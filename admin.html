<script>
window.__appMounted = false;
window.onerror = function() { if (!window.__appMounted) document.getElementById('load-error').style.display = 'flex'; };
if (!window.matchMedia('(display-mode: standalone)').matches && !window.navigator.standalone) {
    document.getElementById('splash-screen').style.display = 'none';
}
(function() {
    const messages = ['Initializing...','Connecting to Supabase...','Loading CRM engine...','Fetching lead data...','Preparing command center...','Almost ready...'];
    let idx = 0;
    const statusEl = document.getElementById('splash-status');
    const msgInterval = setInterval(function() { idx = (idx + 1) % messages.length; if (statusEl) statusEl.textContent = messages[idx]; }, 600);
    window.__dismissSplash = function() {
        clearInterval(msgInterval);
        const splash = document.getElementById('splash-screen');
        if (splash) {
            if (statusEl) statusEl.textContent = 'Ready ✓';
            setTimeout(function() { splash.classList.add('hidden'); setTimeout(function() { if (splash.parentNode) splash.remove(); }, 700); }, 400);
        }
    };
})();
</script>

// ─── IMAGE / DRIVE HELPERS ─────────────────────────────────────────────────
const extractDriveId = (url) => {
    if (!url || typeof url !== 'string') return null;
    const u = url.trim();
    if (/^[a-zA-Z0-9_-]{20,}$/.test(u)) return u;
    let m = u.match(/\/d\/([a-zA-Z0-9_-]+)/); if (m) return m[1];
    m = u.match(/[?&]id=([a-zA-Z0-9_-]+)/); if (m) return m[1];
    m = u.match(/open\?id=([a-zA-Z0-9_-]+)/); if (m) return m[1];
    return null;
};
const getDisplayUrl = (rawUrl) => {
    if (!rawUrl || typeof rawUrl !== 'string') return 'https://placehold.co/600x300/f1f5f9/94a3b8?text=No+Image';
    const url = rawUrl.split(',')[0].trim();
    if (!url) return 'https://placehold.co/600x300/f1f5f9/94a3b8?text=No+Image';
    const id = extractDriveId(url);
    if (id) return `https://drive.google.com/thumbnail?id=${id}&sz=w1000`;
    return url;
};
const uploadToDrive = async (file, propertyName, category) => {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = async () => {
            try {
                const base64 = reader.result.split(',')[1];
                const res = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action:'uploadFile', base64, type:file.type, name:file.name, propertyName:propertyName||'Uploads', category:category||'General' })
                });
                const data = await res.json();
                if (data.fileUrl) resolve(data.fileUrl);
                else if (data.url) resolve(data.url);
                else if (data.fileId) resolve(`https://drive.google.com/file/d/${data.fileId}/view`);
                else reject(new Error(data.error || 'No URL returned'));
            } catch (err) { reject(err); }
        };
        reader.onerror = () => reject(new Error('FileReader failed'));
        reader.readAsDataURL(file);
    });
};

// ─── UTILITY ──────────────────────────────────────────────────────────────
const getVal = (obj, searchKey) => {
    if (!obj) return "";
    if (obj[searchKey] !== undefined && obj[searchKey] !== "") return obj[searchKey];
    const cleanKey = searchKey.replace(/[^a-zA-Z0-9]/g,'').toLowerCase();
    for (let k in obj) { if (k.replace(/[^a-zA-Z0-9]/g,'').toLowerCase() === cleanKey) return obj[k]; }
    return "";
};
const extractPriceInCr = (s) => {
    if (!s) return 0;
    try {
        const c = String(s).toLowerCase().replace(/,/g,'');
        const m = c.match(/[0-9.]+/); if (!m) return 0;
        const v = parseFloat(m[0]); if (isNaN(v)) return 0;
        if (c.includes('cr')||c.includes('crore')) return v;
        if (c.includes('lac')||c.includes('lakh')) return v/100;
        if (v > 100000) return v/10000000;
        return 0;
    } catch(e) { return 0; }
};
const formatINR = (num) => {
    if (num >= 10000000) return '₹'+(num/10000000).toFixed(2).replace(/\.00$/,'')+' Cr';
    if (num >= 100000)   return '₹'+(num/100000).toFixed(2).replace(/\.00$/,'')+' L';
    return new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(num);
};
const formatPercent = (val) => {
    const num = parseFloat(val);
    if (isNaN(num)) return String(val||"0%");
    return (num<1&&num>0)?(num*100).toFixed(1)+"%":num+"%";
};
const getSafeLink = (rawLink) => {
    if (!rawLink) return "#";
    const link = String(rawLink).trim();
    if (!link) return "#";
    if (link.includes('@')&&!link.startsWith('mailto:')) return `mailto:${link}`;
    if (!link.startsWith('http')&&!link.includes('@')) return `https://${link}`;
    return link;
};
const getStatusStyles = (status) => {

        case 'Called':         return 'bg-blue-100 text-blue-800 border-blue-300';

        case 'Converted':      return 'bg-green-100 text-green-800 border-green-400';
        case 'Rejected':       return 'bg-red-100 text-red-800 border-red-300';
        default:               return 'bg-slate-50 text-slate-600 border-slate-200';
    }
};
const getPriorityColor = (priority) => {

};
const getCardTint = (status) => {

};
const isMobile = () => /Android|webOS|iPhone|iPad|iPod/i.test(navigator.userAgent);
const formatDateTime = (ts) => {
    if (!ts) return '—';
    try { return new Date(ts).toLocaleString('en-IN',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }

};

// ─── LEAD BUCKETS ─────────────────────────────────────────────────────────

const LEAD_BUCKETS = [

// ─── EMI CALCULATOR ────────────────────────────────────────────────────────
const EMICalculator = ({ propertyPriceStr }) => {
    const propertyValue = extractPriceInCr(propertyPriceStr) > 0 ? extractPriceInCr(propertyPriceStr)*10000000 : 10000000;
    const [loanAmount, setLoanAmount]     = useState(propertyValue*0.8);
    const [interestRate, setInterestRate] = useState(8.5);
    const [tenureYears, setTenureYears]   = useState(20);
    const { emi, totalInterest, principalPct } = useMemo(() => {
        const p=loanAmount, r=interestRate/12/100, n=tenureYears*12;
        if (!p||!r||!n) return {emi:0,totalInterest:0,principalPct:100};
        const emiVal = (p*r*Math.pow(1+r,n))/(Math.pow(1+r,n)-1);
        const totalPay = emiVal*n;
        return {emi:Math.round(emiVal),totalInterest:Math.round(totalPay-p),principalPct:((p/totalPay)*100).toFixed(1)};
    }, [loanAmount,interestRate,tenureYears]);
    return (
        <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm mt-6">
            <h3 className="text-sm font-black uppercase tracking-widest text-slate-900 mb-6 flex items-center"><span className="mr-2 text-xl">📊</span> EMI Calculator</h3>
            <div className="flex items-center gap-6 mb-8">
                <div className="w-16 h-16 pie-chart shrink-0" style={{background:`conic-gradient(#2563eb ${principalPct}%, #e2e8f0 ${principalPct}% 100%)`}}></div>
                <div className="flex flex-col gap-2 w-full">
                    <div className="flex justify-between text-[10px]"><div className="flex items-center gap-1"><span className="w-2 h-2 rounded-full bg-blue-600 inline-block"></span><span className="font-bold text-slate-400 uppercase tracking-widest">Principal</span></div><span className="font-black text-slate-900">{formatINR(loanAmount)}</span></div>
                    <div className="flex justify-between text-[10px]"><div className="flex items-center gap-1"><span className="w-2 h-2 rounded-full bg-slate-300 inline-block"></span><span className="font-bold text-slate-400 uppercase tracking-widest">Interest</span></div><span className="font-black text-slate-900">{formatINR(totalInterest)}</span></div>
                </div>
            </div>
            <div className="space-y-4">
                {[
                    {label:'Loan Amount',val:formatINR(loanAmount),min:1000000,max:50000000,step:100000,value:loanAmount,set:setLoanAmount},
                    {label:'Interest Rate',val:interestRate+'%',min:6,max:15,step:0.1,value:interestRate,set:setInterestRate},
                    {label:'Tenure',val:tenureYears+' Yrs',min:5,max:30,step:1,value:tenureYears,set:setTenureYears},
                ].map(s => (
                    <div key={s.label}>
                        <div className="flex justify-between mb-1.5"><label className="text-[9px] font-black uppercase text-slate-400 tracking-widest">{s.label}</label><span className="text-[10px] font-black text-blue-600 bg-blue-50 px-2 py-0.5 rounded">{s.val}</span></div>
                        <input type="range" min={s.min} max={s.max} step={s.step} value={s.value} onChange={e=>s.set(Number(e.target.value))} />
                    </div>
                ))}

};

// ─── EDITABLE FIELD ───────────────────────────────────────────────────────
const EditableField = ({ field, label, value, multiline, type='text', onSave, darkMode=false }) => {
    const [editing, setEditing] = useState(false);
    const [draft, setDraft]     = useState('');
    const [saving, setSaving]   = useState(false);
    const inputRef = useRef(null);
    useEffect(() => { if (editing && inputRef.current) inputRef.current.focus(); }, [editing]);
    const save = async () => { setSaving(true); await onSave(field, draft); setSaving(false); setEditing(false); };
    const handleKey = (e) => { if (e.key==='Escape') setEditing(false); if (e.key==='Enter'&&(e.ctrlKey||!multiline)){e.preventDefault();save();} };
    const cls = `w-full p-2.5 border-2 border-blue-400 rounded-xl text-sm font-semibold outline-none resize-none ${darkMode?'bg-slate-800 text-white':'bg-blue-50 text-slate-900'}`;
    if (editing) return (
        <div className="space-y-2">
            {label && <div className="text-[9px] font-black uppercase tracking-widest text-slate-400">{label}</div>}
            {multiline ? <textarea ref={inputRef} rows={4} value={draft} onChange={e=>setDraft(e.target.value)} onKeyDown={handleKey} className={cls} />
                       : <input ref={inputRef} type={type} value={draft} onChange={e=>setDraft(e.target.value)} onKeyDown={handleKey} className={cls} />}
            <div className="flex gap-2">
                <button onClick={save} disabled={saving} className="bg-blue-600 text-white text-[9px] font-black px-3 py-1.5 rounded-lg uppercase tracking-widest disabled:opacity-50">{saving?'...':'Save'}</button>
                <button onClick={()=>setEditing(false)} className={`text-[9px] font-black px-3 py-1.5 rounded-lg uppercase tracking-widest ${darkMode?'bg-slate-700 text-slate-300':'bg-slate-100 text-slate-600'}`}>Cancel</button>
            </div>
        </div>
    );
    return (
        <div className="group/ef flex items-start gap-2">
            <div className="flex-1 min-w-0">
                {label && <div className="text-[9px] font-black uppercase tracking-widest text-slate-400 mb-0.5">{label}</div>}
                <div className={`text-sm font-semibold break-words ${value?(darkMode?'text-slate-200':'text-slate-800'):'italic text-slate-400'}`}>{value||'—'}</div>
            </div>
            <button onClick={()=>{setDraft(value||'');setEditing(true);}} className="opacity-0 group-hover/ef:opacity-100 transition-opacity shrink-0 mt-0.5 text-[8px] font-black bg-blue-50 text-blue-600 border border-blue-200 px-2 py-1 rounded-lg uppercase hover:bg-blue-100">✏️</button>
        </div>
    );
};

// ─── ADMIN OVERVIEW PANEL ─────────────────────────────────────────────────
const AdminOverviewPanel = ({ allLeads, allBulkLeads, allManualLeads, supabase, properties }) => {
    const [selectedAgent, setSelectedAgent] = useState('All');
    const [showBulkUpload, setShowBulkUpload] = useState(false);
    const [bulkAgent, setBulkAgent] = useState('');

    const agentStats = ALL_AGENTS.map(agent => {
        const webLeads    = allLeads.filter(l => l.psa_agent_name === agent);
        const bulkLeads   = allBulkLeads.filter(l => l.psa_agent_name === agent);
        const manualLeads = allManualLeads.filter(l => l.psa_agent_name === agent);
        const all = [...webLeads, ...bulkLeads, ...manualLeads];
        return {
            agent,
            total:     all.length,
            converted: all.filter(l => l.lead_status === 'Converted').length,
            rejected:  all.filter(l => l.lead_status === 'Rejected').length,
            active:    all.filter(l => !['Rejected','Converted'].includes(l.lead_status||'')).length,
            svScheduled: all.filter(l => l.lead_status === 'SV Scheduled').length,
            svDone:    all.filter(l => l.lead_status === 'SV Done').length,
            called:    all.filter(l => l.lead_status === 'Called').length,
            rnr:       all.filter(l => l.lead_status === 'RNR').length,
        };
    });

    const focusLeads = [...allLeads,...allBulkLeads,...allManualLeads]
        .filter(l => selectedAgent === 'All' || l.psa_agent_name === selectedAgent)
        .filter(l => !['Rejected','Converted'].includes(l.lead_status||''))
        .sort((a,b) => new Date(b.created_at||0) - new Date(a.created_at||0))
        .slice(0,30);

    // Bulk upload for admin
    const [csvRows, setCsvRows] = useState([]);
    const [csvHeaders, setCsvHeaders] = useState([]);
    const [csvStep, setCsvStep] = useState(1);
    const [csvLoading, setCsvLoading] = useState(false);
    const [csvResult, setCsvResult] = useState(null);
    const [csvError, setCsvError] = useState('');

    const parseCSV = (text) => {
        const lines = text.split('\n').filter(l => l.trim());
        if (lines.length < 2) return { headers: [], rows: [] };
        const parseRow = (line) => {
            const result = []; let cur = ''; let inQ = false;
            for (let i = 0; i < line.length; i++) {
                if (line[i] === '"') { inQ = !inQ; }
                else if (line[i] === ',' && !inQ) { result.push(cur.trim()); cur = ''; }
                else cur += line[i];
            }
            result.push(cur.trim());
            return result;
        };
        const hdrs = parseRow(lines[0]).map(h => h.replace(/"/g,'').trim());
        const data = lines.slice(1).map(l => {
            const vals = parseRow(l); const obj = {};
            hdrs.forEach((h, i) => { obj[h] = (vals[i]||'').replace(/"/g,'').trim(); });
            return obj;
        }).filter(r => Object.values(r).some(v => v));
        return { headers: hdrs, rows: data };
    };

    const handleCSVFile = (e) => {
        const file = e.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            const { headers: h, rows: r } = parseCSV(ev.target.result);
            if (!h.length) { setCsvError('Cannot parse CSV. Ensure it has a header row.'); return; }
            setCsvHeaders(h); setCsvRows(r); setCsvError(''); setCsvStep(3);
        };
        reader.readAsText(file);
    };

    const mapField = (row, ...keys) => {
        for (const k of keys) {
            const val = row[k] || row[k.toLowerCase()] || row[k.toUpperCase()];
            if (val) return val;
        }
        for (const k of keys) {
            const clean = k.replace(/[^a-zA-Z0-9]/g,'').toLowerCase();
            for (const rk in row) { if (rk.replace(/[^a-zA-Z0-9]/g,'').toLowerCase() === clean && row[rk]) return row[rk]; }
        }
        return '';
    };

    const handleBulkUpload = async () => {
        if (!bulkAgent) { setCsvError('Select an agent first.'); return; }
        if (!csvRows.length) { setCsvError('No rows to upload.'); return; }
        setCsvLoading(true); setCsvError('');
        const stamp = new Date().toLocaleString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
        const records = csvRows.map(row => ({
            customer_name:         mapField(row,'Name','Customer Name','name','Full Name'),
            phone_number:          mapField(row,'Phone','Mobile','phone','Contact'),
            customer_email:        mapField(row,'Email','email','Email ID') || null,
            project_interested_in: mapField(row,'Project','project','Interested In') || 'General Enquiry',
            lead_source:           mapField(row,'Source','Lead Source') || 'Bulk Upload',
            add_note:              mapField(row,'Note','Notes','Requirements') || null,
            psa_agent_name:        bulkAgent,
            assigned_agent:        bulkAgent,
            lead_status:           'Un called',
            lead_priority:         mapField(row,'Priority') || 'Warm',
            call_remark:           `[${stamp}] [Admin] Bulk uploaded → Assigned to ${bulkAgent}\n\n`,
        })).filter(r => r.customer_name || r.phone_number);

        if (!records.length) { setCsvError('No valid rows (need Name or Phone).'); setCsvLoading(false); return; }
        const CHUNK = 100; let inserted = 0, failed = 0;
        for (let i = 0; i < records.length; i += CHUNK) {
            const chunk = records.slice(i, i+CHUNK);
            const { error: err } = await supabase.from('bulk_leads').insert(chunk);
            if (err) { failed += chunk.length; console.error(err); } else inserted += chunk.length;
        }
        setCsvResult({ inserted, failed, total: records.length });
        setCsvLoading(false); setCsvStep(4);
    };

    const resetBulk = () => { setCsvStep(1); setBulkAgent(''); setCsvRows([]); setCsvHeaders([]); setCsvResult(null); setCsvError(''); setShowBulkUpload(false); };

    return (
        <div className="space-y-6 animate-fadeIn">
            <div className="bg-gradient-to-r from-slate-900 to-slate-800 rounded-3xl p-6 text-white flex justify-between items-start">
                <div>
                    <div className="flex items-center gap-3 mb-1"><span className="text-2xl">👑</span><h2 className="text-xl font-black uppercase tracking-tight">Admin Overview</h2></div>
                    <p className="text-slate-400 text-[10px] font-bold uppercase tracking-widest">Full visibility across all PSA agents</p>
                </div>
                <button onClick={()=>setShowBulkUpload(true)} className="bg-blue-600 hover:bg-blue-500 text-white text-[9px] font-black uppercase tracking-widest px-4 py-2.5 rounded-xl transition shadow-lg">📦 Bulk Upload</button>
            </div>

            {/* Bulk Upload Modal */}
            {showBulkUpload && (
                <div className="fixed inset-0 z-[200] flex items-end md:items-center justify-center p-0 md:p-4 bg-slate-900/80 backdrop-blur-sm animate-fadeIn">
                    <div className="bg-white rounded-t-[32px] md:rounded-[28px] w-full max-w-lg shadow-2xl flex flex-col max-h-[90vh]">
                        <div className="p-6 pb-4 border-b border-slate-100">
                            <div className="w-10 h-1 bg-slate-200 rounded-full mx-auto mb-4 md:hidden"></div>
                            <div className="flex justify-between items-start">
                                <div><h2 className="text-lg font-black uppercase text-slate-900">📦 Bulk CSV Upload</h2><p className="text-[9px] font-bold uppercase text-slate-400 mt-0.5">Upload leads for a specific PSA agent</p></div>
                                <button onClick={resetBulk} className="w-8 h-8 flex items-center justify-center rounded-full bg-slate-100 text-slate-500 hover:bg-slate-200 font-black">✕</button>
                            </div>
                            <div className="flex gap-2 mt-4">
                                {['Select Agent','Upload CSV','Preview','Done'].map((s,i) => (
                                    <div key={i} className="flex items-center gap-1.5">
                                        <div className={`w-5 h-5 rounded-full text-[8px] font-black flex items-center justify-center ${csvStep>i+1?'bg-green-500 text-white':csvStep===i+1?'bg-blue-600 text-white':'bg-slate-200 text-slate-500'}`}>{csvStep>i+1?'✓':i+1}</div>
                                        <span className={`text-[8px] font-black uppercase hidden sm:block ${csvStep===i+1?'text-blue-600':'text-slate-400'}`}>{s}</span>
                                        {i<3&&<span className="text-slate-300 text-[10px]">›</span>}
                                    </div>
                                ))}
                            </div>
                        </div>
                        <div className="overflow-y-auto p-6 flex-grow space-y-4">
                            {csvError && <div className="bg-red-50 border border-red-200 text-red-700 text-[10px] font-bold p-3 rounded-2xl">⚠️ {csvError}</div>}
                            {csvStep===1 && (
                                <div>
                                    <label className="text-[9px] font-black uppercase text-slate-500 tracking-widest mb-3 block">Assign all leads in this CSV to:</label>
                                    <div className="grid grid-cols-2 gap-3">
                                        {ALL_AGENTS.map(a => (
                                            <button key={a} onClick={()=>setBulkAgent(a)} className={`p-4 rounded-2xl border-2 font-black text-sm uppercase tracking-widest transition ${bulkAgent===a?'bg-blue-600 text-white border-blue-500':'bg-slate-50 text-slate-700 border-slate-200 hover:border-blue-300'}`}>👤 {a}</button>
                                        ))}
                                    </div>
                                    {bulkAgent && <div className="mt-3 bg-blue-50 border border-blue-200 rounded-2xl p-3 text-[10px] font-bold text-blue-700">✓ All leads will be assigned to: <strong>{bulkAgent}</strong></div>}
                                </div>
                            )}
                            {csvStep===2 && (
                                <div>
                                    <div className="bg-amber-50 border border-amber-200 rounded-2xl p-4 mb-4">
                                        <p className="text-[10px] font-bold text-amber-800 mb-2">📋 CSV Format:</p>
                                        <ul className="text-[9px] text-amber-700 font-bold space-y-1 list-disc list-inside">
                                            <li>Required: <code>Name</code>, <code>Phone</code></li>
                                            <li>Optional: <code>Email</code>, <code>Project</code>, <code>Source</code>, <code>Notes</code>, <code>Priority</code></li>
                                            <li>First row = header row</li>
                                        </ul>
                                    </div>
                                    <label className="block cursor-pointer">
                                        <div className="border-2 border-dashed border-blue-300 rounded-2xl p-8 text-center hover:border-blue-500 bg-blue-50 transition">
                                            <div className="text-3xl mb-2">📁</div>
                                            <div className="text-sm font-black text-blue-700 uppercase tracking-widest mb-1">Click to select CSV</div>
                                            <div className="text-[9px] text-blue-500 font-bold">Uploading for: <span className="text-blue-700">{bulkAgent}</span></div>
                                        </div>
                                        <input type="file" accept=".csv,text/csv" className="hidden" onChange={handleCSVFile} />
                                    </label>
                                </div>
                            )}
                            {csvStep===3 && (
                                <div>
                                    <div className="flex items-center justify-between mb-3">

                                    </div>
                                    <div className="bg-slate-900 rounded-2xl overflow-hidden">
                                        <div className="overflow-x-auto max-h-56">
                                            <table className="w-full text-[9px]">
                                                <thead><tr className="border-b border-slate-700">{csvHeaders.slice(0,5).map(h=><th key={h} className="px-3 py-2 text-left text-slate-400 font-black uppercase whitespace-nowrap">{h}</th>)}{csvHeaders.length>5&&<th className="px-3 py-2 text-slate-500">+{csvHeaders.length-5}</th>}</tr></thead>

                                        <div className={`rounded-2xl p-3 ${csvResult.failed>0?'bg-red-50':'bg-green-50'}`}><div className={`text-[8px] font-black uppercase ${csvResult.failed>0?'text-red-500':'text-green-500'}`}>Failed</div><div className={`text-2xl font-black ${csvResult.failed>0?'text-red-700':'text-green-700'}`}>{csvResult.failed}</div></div>
                                    </div>

                        <div className="p-5 border-t border-slate-100">

                            {csvStep===3 && <button disabled={csvLoading} onClick={handleBulkUpload} className="w-full bg-green-600 hover:bg-green-700 disabled:opacity-50 text-white py-4 rounded-2xl font-black uppercase tracking-widest transition flex items-center justify-center gap-2">{csvLoading?<><span className="animate-spin">⏳</span> Uploading...</>:`⬆️ Upload ${csvRows.length} Leads to ${bulkAgent}`}</button>}
                            {csvStep===4 && <button onClick={resetBulk} className="w-full bg-slate-900 text-white py-4 rounded-2xl font-black uppercase tracking-widest transition hover:bg-slate-700">✓ Done</button>}
                        </div>
                    </div>
                </div>
            )}

            {/* Agent Cards */}
            <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                {agentStats.map(s => (
                    <div key={s.agent} onClick={()=>setSelectedAgent(s.agent===selectedAgent?'All':s.agent)}

                        <div className="flex items-center gap-2 mb-3">

                            <span className="font-black text-sm uppercase">{s.agent}</span>

                        <div className="grid grid-cols-2 gap-1.5 text-center">

                            <div className="bg-green-50 rounded-xl p-1.5"><div className="text-[8px] text-green-600 font-black uppercase">Conv.</div><div className="font-black text-green-700 text-lg leading-tight">{s.converted}</div></div>
                            <div className="bg-blue-50 rounded-xl p-1.5"><div className="text-[8px] text-blue-600 font-black uppercase">Active</div><div className="font-black text-blue-700 text-lg leading-tight">{s.active}</div></div>
                            <div className="bg-teal-50 rounded-xl p-1.5"><div className="text-[8px] text-teal-600 font-black uppercase">SV</div><div className="font-black text-teal-700 text-lg leading-tight">{s.svScheduled+s.svDone}</div></div>
                        </div>
                        <div className="grid grid-cols-3 gap-1 mt-1.5 text-center">
                            <div className="bg-orange-50 rounded-lg p-1"><div className="text-[7px] text-orange-500 font-black uppercase">RNR</div><div className="font-black text-orange-600 text-sm leading-tight">{s.rnr}</div></div>
                            <div className="bg-purple-50 rounded-lg p-1"><div className="text-[7px] text-purple-500 font-black uppercase">Called</div><div className="font-black text-purple-600 text-sm leading-tight">{s.called}</div></div>
                            <div className="bg-red-50 rounded-lg p-1"><div className="text-[7px] text-red-500 font-black uppercase">Rej.</div><div className="font-black text-red-600 text-sm leading-tight">{s.rejected}</div></div>
                        </div>
                    </div>
                ))}
            </div>

            {/* Recent Active Leads */}
            <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
                <div className="px-5 py-4 border-b border-slate-100 flex items-center justify-between">
                    <h3 className="font-black text-sm uppercase tracking-widest text-slate-700">
                        {selectedAgent === 'All' ? '📋 All Active Leads (Recent 30)' : `📋 ${selectedAgent}'s Active Leads`}
                    </h3>
                    {selectedAgent !== 'All' && <button onClick={()=>setSelectedAgent('All')} className="text-[9px] font-black text-slate-400 hover:text-slate-700 uppercase tracking-widest">✕ Clear</button>}
                </div>
                {focusLeads.length === 0 ? (
                    <div className="py-12 text-center text-slate-400 font-black text-sm uppercase tracking-widest">No active leads</div>
                ) : (
                    <div className="divide-y divide-slate-50">
                        {focusLeads.map(l => (
                            <div key={l.id} className={`px-5 py-3 flex items-center gap-4 ${getCardTint(l.lead_status)}`}>
                                <div className={`w-1 h-10 rounded-full shrink-0 ${l.lead_priority==='Hot'?'bg-red-500':l.lead_priority==='Cold'?'bg-blue-400':'bg-amber-400'}`}></div>
                                <div className="flex-1 min-w-0">
                                    <p className="font-black text-[11px] uppercase text-slate-900 truncate">{l.customer_name}</p>
                                    <p className="text-[10px] text-blue-600 font-bold">{l.phone_number}</p>
                                    <p className="text-[9px] text-slate-500 font-bold uppercase tracking-widest truncate">🏠 {l.project_interested_in||'General'}</p>
                                    <p className="text-[8px] text-indigo-500 font-bold">🕐 {formatDateTime(l.created_at)}</p>
                                </div>
                                <div className="text-right shrink-0">
                                    <span className={`text-[8px] font-black uppercase px-2 py-0.5 rounded-full border block mb-1 ${getStatusStyles(l.lead_status)}`}>{l.lead_status||'Uncalled'}</span>
                                    {l.psa_agent_name && <span className="text-[8px] font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-full border border-indigo-100">👤 {l.psa_agent_name}</span>}
                                </div>
                            </div>
                        ))}
                    </div>
                )}
            </div>
        </div>
    );
};

const PropertyDetailsPage = ({ property: initProp, onBack }) => {
    const [property, setProperty]     = useState(initProp);
    const [toast, setToast]           = useState(null);
    const [isSharing, setIsSharing]   = useState(false);
    const [shareModal, setShareModal] = useState(null);
    const [selectedUrls, setSelectedUrls] = useState([]);

    useEffect(() => { window.scrollTo(0,0); }, [initProp]);

    const showToast = useCallback((msg, color='bg-emerald-600') => {
        setToast({msg,color}); setTimeout(()=>setToast(null),4000);
    }, []);

    const saveField = useCallback(async (field, value) => {
        const { error } = await supabase.from('properties').update({[field]:value}).eq('id',property.id);
        if (!error) { setProperty(prev=>({...prev,[field]:value})); showToast('✅ Saved'); }
        else showToast('❌ '+error.message,'bg-red-600');
    }, [property.id, showToast]);

    const cover  = getDisplayUrl(getVal(property,"cover_image")||getVal(property,"cover-image"));
    const galRaw = getVal(property,"gallery_images")||getVal(property,"gallery-images")||"";
    const imgs   = [cover,...(galRaw?galRaw.split(',').map(u=>getDisplayUrl(u.trim())):[])].filter(Boolean);

    const openLink = (rawLink) => {
        if (!rawLink||!rawLink.trim()) return alert("Link not provided.");
        window.open(getSafeLink(rawLink),'_blank');
    };
    const regLink    = getVal(property,"lead_registration_link");
    const regIsEmail = regLink && regLink.includes('@') && !regLink.startsWith('http');
    const regText    = regIsEmail ? "✉️ Email Lead Details" : "🌐 Direct to Website Link";
    const handleRegisterLead = () => {
        if (!regLink||!regLink.trim()) return alert("No lead registration details provided.");
        if (regIsEmail) { window.location.href=`mailto:${regLink.replace('mailto:','').trim()}?subject=New Lead Registration: ${getVal(property,"property_name")}`; }
        else { let link=regLink.trim(); if (!link.startsWith('http')) link=`https://${link}`; window.open(link,'_blank'); }
    };

    const shareViaWhatsApp = (type, linkStr) => {
        if (!linkStr||!linkStr.trim()) return alert(`${type} is not available.`);
        const urls = linkStr.split(',').map(u=>u.trim()).filter(Boolean);
        if (type==='Location Map'||type==='Property Video') { executeShare(type,urls); }
        else { setShareModal({type,urls}); setSelectedUrls([...urls]); }
    };
    const toggleSelection = (url) => setSelectedUrls(prev=>prev.includes(url)?prev.filter(u=>u!==url):[...prev,url]);
    const executeShare = async (type, urlsToShare) => {
        if (!urlsToShare.length) return alert("Select at least one file.");
        setIsSharing(true);
        const propName = getVal(property,"property_name");
        const waText   = `Hello! Here is the *${type}* for *${propName}*. 🏡`;
        const waTextLinks = `Hello! Here is the *${type}* for *${propName}*:\n\n${urlsToShare.join('\n\n')}`;
        if (type==='Location Map'||type==='Property Video') {
            const waUrl = `https://wa.me/?text=${encodeURIComponent(waTextLinks)}`;
            if (isMobile()) window.location.href=waUrl;
            else window.open(`https://web.whatsapp.com/send?text=${encodeURIComponent(waTextLinks)}`,'_blank');
            setShareModal(null); setIsSharing(false); return;
        }
        const triggerDownload = (url,filename) => {
            const a=document.createElement('a'); a.href=url; a.download=filename; a.target='_blank';
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
        };
        const n = urlsToShare.length;
        for (let i=0;i<n;i++) {
            const raw=urlsToShare[i], id=extractDriveId(raw);
            const dlUrl = id?`https://drive.google.com/uc?export=download&id=${id}`:raw;
            const isPdf = raw.includes('/view')||raw.toLowerCase().includes('.pdf');
            const ext   = isPdf?'pdf':'jpg';
            const fname = `${propName.replace(/[^a-zA-Z0-9]/g,'_')}_${type.replace(/\s+/g,'_')}${n>1?'_'+(i+1):''}.${ext}`;
            setTimeout(()=>triggerDownload(dlUrl,fname),i*400);
        }
        setIsSharing(false); setShareModal(null);
        if (isMobile()) { showToast(`⬇️ ${n} file${n>1?'s':''} downloading…`,'bg-green-600'); setTimeout(()=>{window.location.href=`https://wa.me/?text=${encodeURIComponent(waText)}`;},n*400+700); }
        else { showToast(`⬇️ ${n} file${n>1?'s':''} downloading…`,'bg-blue-600'); setTimeout(()=>window.open(`https://web.whatsapp.com/send?text=${encodeURIComponent(waText)}`,'_blank'),n*400+600); }
    };
    const pocNumber = getVal(property,"point_of_contact")?.replace(/\D/g,'')||WHATSAPP_NUMBER;

    return (
        <div className="min-h-screen bg-slate-50 animate-fadeIn pb-24 md:pb-0 relative">
            {toast && <div className={`fixed top-4 left-1/2 -translate-x-1/2 z-[500] ${toast.color} text-white text-xs font-black uppercase tracking-widest px-6 py-3.5 rounded-2xl shadow-2xl animate-fadeIn max-w-sm text-center`}>{toast.msg}</div>}
            {shareModal && (
                <div className="fixed inset-0 z-[200] flex items-end md:items-center justify-center p-0 md:p-4 bg-slate-900/80 backdrop-blur-sm animate-fadeIn">
                    <div className="bg-white rounded-t-[32px] md:rounded-[28px] w-full max-w-md shadow-2xl relative flex flex-col max-h-[88vh]">
                        <div className="p-6 pb-0">
                            <div className="w-10 h-1 bg-slate-200 rounded-full mx-auto mb-5 md:hidden"></div>
                            <div className="flex items-center justify-between mb-1">
                                <div><h2 className="text-base font-black uppercase text-slate-900">Share via WhatsApp</h2><p className="text-[10px] font-bold uppercase text-green-600 mt-0.5">📤 {shareModal.type}</p></div>
                                <button onClick={()=>setShareModal(null)} className="w-8 h-8 flex items-center justify-center rounded-full bg-slate-100 text-slate-500 hover:bg-slate-200 font-black">✕</button>
                            </div>
                            <div className="flex items-center gap-2 bg-blue-50 border border-blue-100 rounded-2xl px-3 py-2 mt-3 mb-4">
                                <span className="text-base shrink-0">💡</span>
                                <p className="text-[9px] text-blue-700 font-bold leading-relaxed">Files download from Drive — attach manually in WhatsApp.</p>
                            </div>
                            <div className="border-b border-slate-100 -mx-6 mb-3"></div>
                        </div>
                        <div className="overflow-y-auto px-6 space-y-2 flex-grow">
                            {shareModal.urls.length===1 ? (() => {
                                const url=shareModal.urls[0]; const displayUrl=getDisplayUrl(url); const driveId=extractDriveId(url); const isImg=driveId||/\.(jpg|jpeg|png|webp)/i.test(url);
                                return (
                                    <div className="flex items-center gap-3 p-3 rounded-2xl bg-green-50 border-2 border-green-400">
                                        {isImg?<img src={displayUrl} className="w-14 h-14 rounded-xl object-cover border border-slate-200 shrink-0" onError={e=>e.target.style.display='none'} />:<div className="w-14 h-14 rounded-xl flex items-center justify-center bg-red-100 text-red-500 text-2xl shrink-0">📄</div>}
                                        <div className="flex-1 min-w-0"><p className="text-[10px] font-black text-slate-800 uppercase">{shareModal.type}</p><p className="text-[9px] text-green-600 font-bold mt-0.5">✓ Ready</p></div>
                                        <a href={displayUrl} target="_blank" onClick={e=>e.stopPropagation()} className="text-[9px] text-blue-500 font-black uppercase shrink-0 bg-blue-50 px-2 py-1 rounded-lg hover:bg-blue-100">👁 View</a>
                                    </div>
                                );
                            })() : (
                                <>
                                    <div className="flex justify-between items-center mb-1">
                                        <p className="text-[9px] font-black text-slate-400 uppercase">{selectedUrls.length}/{shareModal.urls.length} Selected</p>
                                        <div className="flex gap-2">
                                            <button onClick={()=>setSelectedUrls(shareModal.urls)} className="text-[9px] font-black text-blue-600 uppercase bg-blue-50 px-2 py-1 rounded-lg">All</button>

                                    </div>

                                        return (
                                            <label key={idx} className={`flex items-center gap-3 p-3 rounded-2xl border-2 cursor-pointer transition-all ${selected?'bg-green-50 border-green-400':'bg-slate-50 border-slate-200 hover:border-slate-300'}`}>

                                                {isImg?<img src={displayUrl} className="w-12 h-12 rounded-xl object-cover border border-slate-200 shrink-0" onError={e=>e.target.style.display='none'} />:<div className="w-12 h-12 rounded-xl flex items-center justify-center bg-red-50 text-red-500 text-xl shrink-0 border border-red-100">📄</div>}
                                                <span className="text-[10px] font-bold text-slate-700 truncate flex-1">{shareModal.type} {idx+1}</span>
                                                <a href={displayUrl} target="_blank" onClick={e=>e.stopPropagation()} className="text-[9px] text-blue-500 font-black uppercase shrink-0 bg-blue-50 px-2 py-1 rounded-lg">View</a>
                                            </label>
                                        );
                                    })}
                                </>

                        </div>
                        <div className="p-6 pt-4">
                            <button disabled={isSharing||!selectedUrls.length} onClick={()=>executeShare(shareModal.type,selectedUrls)} className="w-full bg-green-500 hover:bg-green-600 disabled:opacity-50 text-white font-black py-4 rounded-2xl text-sm uppercase tracking-widest transition shadow-lg flex items-center justify-center gap-2">
                                {isSharing?<><span className="animate-spin">⏳</span> Preparing...</>:<><span>💬</span> Send via WhatsApp{shareModal.urls.length>1?` (${selectedUrls.length})`:''}</>}
                            </button>
                        </div>
                    </div>
                </div>
            )}
            <div className="bg-white border-b border-slate-200 sticky top-0 z-40 px-4 md:px-8 py-4 flex justify-between items-center shadow-sm">
