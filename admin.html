<!DOCTYPE html>
<html>
<head>
  <title>Admin</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

const supabase = window.supabase.createClient(
  "https://uiiovtsktllvtecfokik.supabase.co",
  "YOUR_KEY"
);

function Admin() {
  const [properties, setProperties] = useState([]);
  const [edit, setEdit] = useState(null);

  const fetchProperties = async () => {
    const { data } = await supabase.from("properties").select("*");
    setProperties(data || []);
  };

  useEffect(() => {
    fetchProperties();
  }, []);

  const toggleLive = async (p) => {
    await supabase
      .from("properties")
      .update({ is_live: !p.is_live })
      .eq("id", p.id);

    fetchProperties();
  };

  const saveProperty = async () => {
    await supabase
      .from("properties")
      .update(edit)
      .eq("id", edit.id);

    setEdit(null);
    fetchProperties();
  };

  const shareFile = (url, name) => {
    const a = document.createElement("a");
    a.href = url;
    a.download = "";
    a.click();

    window.open(
      `https://wa.me/?text=${encodeURIComponent(
        "Sharing file for " + name
      )}`
    );
  };

  return (
    <div className="p-6">
      <h1 className="text-xl font-bold mb-4">Admin Panel</h1>

      {properties.map(p => (
        <div key={p.id} className="bg-white p-4 mb-4 rounded shadow">

          <div className="flex justify-between">
            <h2 className="font-bold">{p.property_name}</h2>

            <button
              onClick={() => toggleLive(p)}
              className={`px-2 py-1 text-white rounded ${
                p.is_live ? "bg-green-500" : "bg-gray-400"
              }`}
            >
              {p.is_live ? "LIVE" : "UNLIVE"}
            </button>
          </div>

          <p>{p.location}</p>
          <p>{p.price}</p>

          <div className="mt-2 flex gap-2">
            <button
              onClick={() => setEdit(p)}
              className="bg-blue-500 text-white px-2 py-1 rounded"
            >
              Edit
            </button>

            {p.brochure && (
              <button
                onClick={() => shareFile(p.brochure, p.property_name)}
                className="bg-green-500 text-white px-2 py-1 rounded"
              >
                Share
              </button>
            )}
          </div>
        </div>
      ))}

      {/* EDIT MODAL */}
      {edit && (
        <div className="fixed inset-0 bg-black/50 flex items-center justify-center">
          <div className="bg-white p-6 rounded w-96">

            <input
              className="border w-full mb-2 p-2"
              value={edit.property_name}
              onChange={e =>
                setEdit({ ...edit, property_name: e.target.value })
              }
            />

            <input
              className="border w-full mb-2 p-2"
              value={edit.location}
              onChange={e =>
                setEdit({ ...edit, location: e.target.value })
              }
            />

            <input
              className="border w-full mb-2 p-2"
              value={edit.price}
              onChange={e =>
                setEdit({ ...edit, price: e.target.value })
              }
            />

            <div className="flex gap-2 mt-4">
              <button
                onClick={saveProperty}
                className="bg-blue-600 text-white px-3 py-1 rounded"
              >
                Save
              </button>

              <button
                onClick={() => setEdit(null)}
                className="bg-gray-400 text-white px-3 py-1 rounded"
              >
                Cancel
              </button>
            </div>

          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Admin />);
</script>
</body>
</html>
