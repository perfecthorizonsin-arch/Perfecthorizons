                                                    <option value="Called">✅ Called</option><option value="RNR">🔔 RNR</option><option value="Details Shared">📤 Details Shared</option><option value="SV Scheduled">📅 SV Scheduled</option><option value="Converted">🏆 Converted</option><option value="Rejected">❌ Rejected</option>
                                                </select>
                                                {l.lead_status==='Rejected'&&(
                                                    <select onChange={e => updateLead(l,'reject_reason',e.target.value)} value={l.reject_reason||''} className="w-full p-2 mb-2 border-2 border-red-300 rounded-xl font-black uppercase text-[9px] outline-none bg-red-50 text-red-800 cursor-pointer">
                                                        <option value="" disabled>Select Reason</option>
                                                        <option value="Not Interested">Not Interested</option><option value="No Response">No Response</option><option value="Wrong Number">Wrong Number</option><option value="No Incoming Call">No Incoming Call</option>
                                                    </select>
                                                )}
                                                <select onChange={e => updateLead(l,'lead_priority',e.target.value)} value={l.lead_priority||'Warm'} className={`w-full p-2 border-2 rounded-xl font-black uppercase text-[9px] outline-none cursor-pointer ${getPriorityColor(l.lead_priority)}`}>
                                                    <option value="Hot">🔥 Hot</option><option value="Warm">🌤 Warm</option><option value="Cold">❄️ Cold</option>
                                                </select>
                                            </td>
                                            <td className="px-5 py-4 min-w-[170px]">
                                                {['Called','RNR','Details Shared'].includes(l.lead_status)&&(
                                                    <div>
                                                        <span className="text-[8px] font-black text-blue-600 uppercase tracking-widest block mb-1">📅 Callback Date</span>
                                                        <input type="datetime-local" className="w-full p-2 border-2 border-blue-200 bg-blue-50 rounded-xl text-[10px] font-bold text-slate-700 outline-none focus:border-blue-400" value={l.follow_up_at?.slice(0,16)||''} onChange={e => updateLead(l,'follow_up_at',e.target.value)} />
                                                    </div>
                                                )}
                                                {l.lead_status==='SV Scheduled'&&(
                                                    <div className="mt-2">
                                                        <span className="text-[8px] font-black text-teal-600 uppercase tracking-widest block mb-1">📍 Site Visit</span>
                                                        <input type="date" className="w-full p-2 border-2 border-teal-200 bg-teal-50 rounded-xl text-[10px] font-bold text-slate-700 outline-none focus:border-teal-400" value={l.site_visit_at||''} onChange={e => updateLead(l,'site_visit_at',e.target.value)} />
                                                    </div>
                                                )}
                                                {!['Called','RNR','Details Shared','SV Scheduled'].includes(l.lead_status) && (
                                                    <span className="text-[9px] text-slate-300 font-bold italic">—</span>
                                                )}
                                            </td>
                                            <td className="px-5 py-4">
                                                <div className="flex flex-col gap-2">
                                                    <div className="h-[60px] overflow-y-auto bg-slate-900/5 p-2 rounded-xl history-scroll whitespace-pre-wrap border border-slate-200 leading-relaxed font-medium text-slate-500 text-[9px]">
                                                        {l.call_remark || <span className="italic text-slate-300">No activity yet...</span>}
                                                    </div>
                                                    <NoteCell lead={l} onSave={updateLead} />
                                                </div>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                            )}
                            {!loading && visibleCount < displayedLeads.length && (
                                <div className="p-4 border-t border-slate-100 bg-slate-50 flex justify-center">
                                    <button onClick={() => setVisibleCount(v => v + 50)} className="bg-blue-100 hover:bg-blue-200 text-blue-800 px-6 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest transition shadow-sm">
                                        Load More Leads ({displayedLeads.length - visibleCount} hidden)
                                    </button>
                                </div>
                            )}
                        </div>

                        {/* Mobile cards */}
                        <div className="lg:hidden space-y-3">
                            {loading ? (
                                [...Array(4)].map((_,i) => (
                                    <div key={i} className="bg-white rounded-2xl p-4 border border-slate-200 space-y-3">
                                        <div className="flex justify-between"><div className="space-y-2 flex-1"><div className="skeleton h-4 w-32 rounded"></div><div className="skeleton h-3 w-24 rounded"></div></div><div className="skeleton h-12 w-24 rounded-xl"></div></div>
                                        <div className="flex gap-2"><div className="skeleton h-10 flex-1 rounded-xl"></div><div className="skeleton h-10 flex-1 rounded-xl"></div></div>
                                        <div className="skeleton h-9 w-full rounded-xl"></div>
                                        <div className="grid grid-cols-2 gap-2"><div className="skeleton h-9 rounded-xl"></div><div className="skeleton h-9 rounded-xl"></div></div>
                                    </div>
                                ))
                            ) : visibleLeads.length === 0 ? (
                                <div className="py-16 flex flex-col items-center text-center bg-white rounded-2xl border border-slate-200">
                                    <div className="text-4xl mb-3">📭</div>
                                    <div className="text-sm font-black uppercase tracking-widest text-slate-400 mb-1">No leads found</div>
                                    <div className="text-[10px] text-slate-400 font-medium">Adjust filters or search</div>
                                </div>
                            ) : visibleLeads.map(l => (
                                <div key={`m-${l.id}`} className={`rounded-2xl shadow-sm border-2 overflow-hidden animate-fadeIn ${l.lead_priority==='Hot'?'border-red-200':l.lead_priority==='Cold'?'border-blue-200':'border-amber-200'} ${getCardTint(l.lead_status)}`}>
                                    <div className={`h-1 w-full ${l.lead_priority==='Hot'?'bg-red-500':l.lead_priority==='Cold'?'bg-blue-400':'bg-amber-400'}`}></div>
                                    <div className="p-4">
                                        <div className="flex justify-between items-start mb-3">
                                            <div className="flex-1 min-w-0 pr-2">
                                                <h3 className="font-black text-[13px] uppercase text-slate-900 leading-tight truncate">{l.customer_name}</h3>
                                                <p className="font-black text-blue-600 text-[12px] mt-0.5">{l.phone_number}</p>
                                                {l.customer_email && <p className="font-medium text-slate-400 text-[9px] truncate mt-0.5">{l.customer_email}</p>}
                                                <p className="text-[9px] text-slate-500 font-bold mt-1 tracking-widest uppercase truncate">
                                                    🏠 {leadCategory==='bulk'&&session?.user?.email!=='saishetty1623@gmail.com'?'[Restricted]':(l.project_interested_in||'General')}
                                                </p>
                                                {l.created_at && <p className="text-[8px] text-slate-400 font-bold mt-0.5 tracking-widest uppercase">🕐 {leadCategory==='bulk'?l.created_at:l.display_date}</p>}
                                            </div>
                                            <div className="flex flex-col items-end gap-1.5 shrink-0">
                                                <span className={`text-[8px] font-black uppercase tracking-widest px-2.5 py-1 rounded-full border ${getStatusStyles(l.lead_status)}`}>{l.lead_status||'Un called'}</span>
                                                <span className={`text-[8px] font-black uppercase tracking-widest px-2 py-0.5 rounded-full border ${getPriorityColor(l.lead_priority||'Warm')}`}>{l.lead_priority==='Hot'?'🔥':l.lead_priority==='Cold'?'❄️':'🌤'} {l.lead_priority||'Warm'}</span>
                                            </div>
                                        </div>
                                        <div className="flex gap-2 mb-3">
                                            <a href={`tel:${l.phone_number}`} className="flex-1 flex items-center justify-center gap-1 bg-white border-2 border-slate-200 text-slate-700 text-[9px] font-black uppercase tracking-widest py-2.5 rounded-xl hover:border-blue-400 transition">📞 Call</a>
                                            <a href={`https://wa.me/91${l.phone_number?.replace(/\D/g,'').slice(-10)}`} className="flex-1 flex items-center justify-center gap-1 bg-green-500 text-white text-[9px] font-black uppercase tracking-widest py-2.5 rounded-xl hover:bg-green-600 transition shadow-sm">💬 WhatsApp</a>
                                        </div>
                                        <div className="border-t border-slate-200/80 pt-3 space-y-2">
                                            <div className="grid grid-cols-2 gap-2 mb-1">
                                                <div className="flex flex-col gap-1 col-span-2">
                                                    <label className="text-[8px] font-black text-slate-400 uppercase tracking-widest">PSA Agent</label>
                                                    <select onChange={e => updateLead(l,'psa_agent_name',e.target.value)} value={l.psa_agent_name||''} className="p-2.5 border-2 border-slate-700 bg-slate-900 rounded-xl font-black uppercase text-[9px] outline-none text-blue-300 cursor-pointer">
                                                        <option value="" disabled>⚡ Assign Agent</option>
                                                        <option value="Tharun">👤 Tharun</option><option value="Shivaji">👤 Shivaji</option><option value="Ramswami">👤 Ramswami</option>
                                                    </select>
                                                </div>
                                                <div className="flex flex-col gap-1">
                                                    <label className="text-[8px] font-black text-slate-400 uppercase tracking-widest">Status</label>
                                                    <select onChange={e => updateLead(l,'lead_status',e.target.value)} value={l.lead_status||''} className={`p-2.5 border-2 rounded-xl font-black uppercase text-[9px] outline-none cursor-pointer ${getStatusStyles(l.lead_status)}`}>
                                                        {(!l.lead_status||l.lead_status==='Un called')&&<option value="Un called">🔵 Un called</option>}
                                                        <option value="Called">✅ Called</option><option value="RNR">🔔 RNR</option><option value="Details Shared">📤 Details</option><option value="SV Scheduled">📅 SV Sched.</option><option value="Converted">🏆 Converted</option><option value="Rejected">❌ Rejected</option>
                                                    </select>
                                                </div>
                                                <div className="flex flex-col gap-1">
                                                    <label className="text-[8px] font-black text-slate-400 uppercase tracking-widest">Priority</label>
                                                    <select onChange={e => updateLead(l,'lead_priority',e.target.value)} value={l.lead_priority||'Warm'} className={`p-2.5 border-2 rounded-xl font-black uppercase text-[9px] outline-none cursor-pointer ${getPriorityColor(l.lead_priority)}`}>
                                                        <option value="Hot">🔥 Hot</option><option value="Warm">🌤 Warm</option><option value="Cold">❄️ Cold</option>
                                                    </select>
                                                </div>
                                                {l.lead_status==='Rejected'&&(
                                                    <div className="flex flex-col gap-1 col-span-2 mt-1">
                                                        <label className="text-[8px] font-black text-red-600 uppercase tracking-widest">Reject Reason</label>
                                                        <select onChange={e => updateLead(l,'reject_reason',e.target.value)} value={l.reject_reason||''} className="p-2.5 border-2 border-red-300 bg-red-50 text-red-800 rounded-xl font-black uppercase text-[9px] outline-none cursor-pointer">
                                                            <option value="" disabled>Select Reason</option>
                                                            <option value="Not Interested">Not Interested</option><option value="No Response">No Response</option><option value="Wrong Number">Wrong Number</option><option value="No Incoming Call">No Incoming Call</option>
                                                        </select>
                                                    </div>
                                                )}
                                            </div>
                                            {['Called','RNR','Details Shared'].includes(l.lead_status)&&(
                                                <div className="flex flex-col gap-1 mt-2">
                                                    <label className="text-[8px] font-black text-blue-600 uppercase tracking-widest">📅 Callback Date</label>
                                                    <input type="datetime-local" className="p-2.5 border-2 border-blue-200 bg-blue-50 rounded-xl text-[10px] font-bold outline-none focus:border-blue-400" value={l.follow_up_at?.slice(0,16)||''} onChange={e => updateLead(l,'follow_up_at',e.target.value)} />
                                                </div>
                                            )}
                                            {l.lead_status==='SV Scheduled'&&(
                                                <div className="flex flex-col gap-1 mt-2">
                                                    <label className="text-[8px] font-black text-teal-600 uppercase tracking-widest">📍 Site Visit Date</label>
                                                    <input type="date" className="p-2.5 border-2 border-teal-200 bg-teal-50 rounded-xl text-[10px] font-bold outline-none focus:border-teal-400" value={l.site_visit_at||''} onChange={e => updateLead(l,'site_visit_at',e.target.value)} />
                                                </div>
                                            )}
                                            <div className="mt-3 pt-3 border-t border-slate-100">
                                                <div className="bg-slate-900/5 p-2.5 rounded-xl h-14 overflow-y-auto text-[9px] font-medium whitespace-pre-wrap history-scroll border border-slate-200 leading-relaxed text-slate-500 mb-2">
                                                    {l.call_remark || <span className="italic text-slate-400">System logs...</span>}
                                                </div>
                                                <NoteCellMobile lead={l} onSave={updateLead} />
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            ))}
                            {!loading && visibleCount < displayedLeads.length && (
                                <button onClick={() => setVisibleCount(v => v + 50)} className="w-full bg-white hover:bg-blue-50 text-blue-700 py-4 rounded-2xl text-[10px] font-black uppercase tracking-widest transition border-2 border-blue-200 hover:border-blue-400 shadow-sm">
                                    Load More ({displayedLeads.length - visibleCount} remaining)
                                </button>
                            )}
                        </div>
                    </div>
                )}

                {view === 'library' && (
                    <ProjectLibrary
                        supabase={supabase} setProp={setSelectedProp} properties={properties} setProperties={setProperties}
                        onEdit={p => { setEditingProp(p); handleNavigate('add'); }}
                    />
                )}
                {view === 'add' && <PropertyForm scriptUrl={GOOGLE_SCRIPT_URL} supabase={supabase} editingProp={editingProp} setView={handleNavigate} />}
            </main>

            {showManualModal && (
                <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-[100] flex items-end md:items-center justify-center p-0 md:p-4" onClick={e => e.target === e.currentTarget && setShowManualModal(false)}>
                    <div className="bg-white rounded-t-[32px] md:rounded-[28px] w-full max-w-md shadow-2xl animate-slideUp overflow-hidden">
                        <div className="px-6 pt-5 pb-4 border-b border-slate-100">
                            <div className="w-10 h-1 bg-slate-200 rounded-full mx-auto mb-5 md:hidden"></div>
                            <div className="flex justify-between items-center">
                                <div>
                                    <h2 className="text-lg font-black uppercase tracking-tight text-slate-900">Manual Lead Entry</h2>
                                    <p className="text-[9px] font-bold uppercase tracking-widest text-slate-400 mt-0.5">Inject directly into CRM</p>
                                </div>
                                <button onClick={() => setShowManualModal(false)} className="w-8 h-8 flex items-center justify-center rounded-full bg-slate-100 text-slate-500 hover:bg-slate-200 text-sm font-black transition">✕</button>
                            </div>
                        </div>
                        <div className="px-6 py-5 max-h-[75vh] overflow-y-auto">
                            <ManualLeadForm properties={properties} supabase={supabase} onSuccess={() => { setShowManualModal(false); fetchLeads(); }} />
                        </div>
                    </div>
                </div>
            )}
        </div>
    );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<AdminApp />);
window.__appMounted = true;
// Fallback: ensure splash is gone after 4s max
setTimeout(function(){ if (window.__dismissSplash) window.__dismissSplash(); }, 4000);
</script>
</body>
</html>
