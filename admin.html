// ─── PROJECT LIBRARY ──────────────────────────────────────────────────────
function ProjectLibrary({ properties, setProp, supabase, setProperties, onEdit }) {
    const [search, setSearch] = useState('');
    const toggleLive = async (e, p) => {
        e.stopPropagation();
        const current = p.is_live!==false, next = !current;
        if (setProperties) setProperties(prev=>prev.map(item=>item.id===p.id?{...item,is_live:next}:item));
        const {error} = await supabase.from('properties').update({is_live:next}).eq('id',p.id);
        if (error) { alert(`DB Error: ${error.message}`); if (setProperties) setProperties(prev=>prev.map(item=>item.id===p.id?{...item,is_live:current}:item)); }
    };
    if (!properties||properties.length===0) return <div className="text-center py-20 font-black text-slate-400 tracking-widest uppercase animate-pulse">Library Empty...</div>;
    const filtered = properties.filter(p => {
        if (!search) return true;
        const t = search.toLowerCase();
        return (getVal(p,'property_name')||'').toLowerCase().includes(t)||(getVal(p,'location')||'').toLowerCase().includes(t);
    });
    return (
        <div className="space-y-4 animate-fadeIn">
            <div className="relative">
                <span className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">🔍</span>
                <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search property or location…"
                    className="w-full pl-10 pr-4 py-3 bg-white border border-slate-200 rounded-2xl text-sm font-semibold outline-none focus:ring-2 focus:ring-blue-500 shadow-sm" />
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                {filtered.map(p => (
                    <div key={p.id} onClick={()=>setProp(p)} className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden cursor-pointer hover:shadow-lg hover:-translate-y-1 transition group flex flex-col relative">
                        <div className="relative h-48 bg-slate-100 overflow-hidden">
                            <img src={getDisplayUrl(getVal(p,'cover_image')||getVal(p,'cover-image'))} className="w-full h-full object-cover group-hover:scale-105 transition duration-500" alt="" />
                            <div className="absolute top-3 left-0 bg-slate-900/90 text-white text-[10px] font-black px-3 py-1.5 rounded-r-lg uppercase tracking-widest shadow-md">{getVal(p,'property_type')||'Property'}</div>
                            <button onClick={e=>toggleLive(e,p)} className={`absolute top-3 right-0 text-[10px] font-black px-3 py-1.5 rounded-l-lg uppercase tracking-widest shadow-md transition z-10 ${p.is_live!==false?'bg-green-500 text-white hover:bg-green-600':'bg-red-500 text-white hover:bg-red-600'}`}>
                                {p.is_live!==false?'🟢 Live':'🔴 Hidden'}
                            </button>
                            <button onClick={e=>{e.stopPropagation();onEdit(p);}} className="absolute top-10 right-0 mt-1 text-[10px] font-black px-3 py-1.5 rounded-l-lg uppercase tracking-widest shadow-md transition z-10 bg-blue-500 text-white hover:bg-blue-600">✏️ Edit</button>
                        </div>
                        <div className="p-5 flex-grow flex flex-col">
                            <h3 className="text-xl font-black uppercase tracking-tighter text-slate-900 leading-tight truncate">{getVal(p,'property_name')}</h3>
                            <p className="text-slate-500 text-xs font-bold mt-1 truncate">📍 {getVal(p,'location')}</p>
                            <div className="mt-4 flex justify-between items-end pt-4 border-t border-slate-100">
                                <div><div className="text-[9px] text-gray-400 font-bold uppercase tracking-widest">Starting Price</div><div className="text-lg font-black text-blue-900">{getVal(p,'price')}</div></div>
                                <button className="bg-slate-900 text-white text-[10px] font-bold px-4 py-2 rounded-lg hover:bg-blue-600 transition">Preview</button>
                            </div>
                        </div>
                    </div>
                ))}
            </div>
        </div>
    );
}

// ─── PROPERTY FORM ────────────────────────────────────────────────────────
function PropertyForm({ supabase, editingProp, setView }) {
    const blank = {
        property_name:'',builder_name:'',property_region:'',property_type:'',location:'',price:'',bhk:'',
        super_built_up_area:'',possession_date:'',construction_status:'',approval:'',rera_number:'',
        total_units:'',availability:'',description:'',usp_details:'',amenities:'',
        point_of_contact:'',commission_details:'',video_link:'',website_link:'',
        lead_registration_link:'',map_link:'',cover_image:'',gallery_images:'',
        floor_plan:'',brochure:'',cost_sheet:'',miscellaneous:'',master_plan:''
    };
    const [form, setForm]             = useState(blank);
    const [loading, setLoading]       = useState(false);
    const [uploadingField, setUpField] = useState(null);
    const [uploadProgress, setUpProgress] = useState({});

    useEffect(()=>{ setForm(editingProp ? {...blank,...editingProp} : blank); },[editingProp]);

    const set = (k,v) => setForm(f=>({...f,[k]:v}));

    const upload = async (e, field, append=false) => {
        const files = e.target.files; if (!files||files.length===0) return;
        setLoading(true); setUpField(field);
        const categoryMap = {cover_image:'Cover Image',gallery_images:'Gallery',brochure:'Brochures',cost_sheet:'Cost Sheets',floor_plan:'Floor Plans',master_plan:'Master Plans',miscellaneous:'Miscellaneous'};
        const category = categoryMap[field]||'General'; let newUrls = [];
        for (let i=0;i<files.length;i++) {
            const file = files[i]; setUpProgress(p=>({...p,[field]:`${i+1}/${files.length}`}));
            try { const url = await uploadToDrive(file,form.property_name,category); newUrls.push(url); }
            catch(err) { alert(`⚠️ Upload failed for "${file.name}": ${err.message}`); }
        }
        if (newUrls.length>0) {
            const joined = newUrls.join(',');
            if (append) set(field,form[field]?form[field]+','+joined:joined);
            else set(field,joined);
        }
        setLoading(false); setUpField(null); setUpProgress(p=>{const n={...p};delete n[field];return n;});
        e.target.value='';
    };

    const removeFile = (field, isArray=false, idx=null) => {
        if (isArray) { const arr=form[field].split(',').filter(Boolean); arr.splice(idx,1); set(field,arr.join(',')); }
        else set(field,'');
    };

    const save = async () => {
        if (!form.property_name||!form.price||!form.cover_image) { alert("Required: Property Name, Price, and Cover Image."); return; }
        setLoading(true);
        if (editingProp) {
            const {error} = await supabase.from('properties').update(form).eq('id',editingProp.id);
            if (!error) { alert("Listing Updated!"); setView('library'); } else alert(error.message);
        } else {
            const {error} = await supabase.from('properties').insert([form]);
            if (!error) { alert("Listing Published!"); setForm(blank); } else alert(error.message);
        }
        setLoading(false);
    };

    const UploadSection = ({field, label, multi}) => {
        const isUploading = uploadingField===field, progress = uploadProgress[field];
        const urls = form[field] ? form[field].split(',').filter(Boolean) : [];
        return (
            <div className="bg-slate-50 border-2 border-dashed border-slate-300 rounded-2xl p-4 transition-all hover:border-blue-400">
                <label className="block text-[10px] font-black uppercase text-slate-500 mb-2 tracking-widest">
                    {label}{isUploading&&<span className="ml-2 text-blue-600 animate-pulse font-black">⬆️ Uploading {progress?`(${progress})`:''}</span>}
                </label>
                {/* Show existing files when editing */}
                {editingProp && urls.length>0 && (
                    <div className="mb-2">
                        <div className="text-[8px] font-black uppercase text-slate-400 mb-1">Current files ({urls.length}):</div>
                        {multi ? urls.map((url,idx)=><FileTag key={idx} field={field} name={`Drive File ${idx+1}`} isArray idx={idx} onRemove={removeFile} />)
                               : <FileTag field={field} name="Drive File" onRemove={removeFile} />}
                    </div>
                )}
                <input type="file" multiple={multi} onChange={e=>upload(e,field,multi)} disabled={isUploading}
                    className="w-full text-xs font-bold text-slate-600 cursor-pointer file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-[9px] file:font-black file:uppercase file:bg-blue-600 file:text-white hover:file:bg-blue-700 file:cursor-pointer disabled:opacity-50" />
                {!editingProp && urls.length>0 && (
                    <div className="mt-2">
                        {multi ? urls.map((url,idx)=><FileTag key={idx} field={field} name={`Drive File ${idx+1}`} isArray idx={idx} onRemove={removeFile} />)
                               : <FileTag field={field} name="Drive File" onRemove={removeFile} />}
                    </div>
                )}
            </div>
        );
    };

    const inputCls     = "w-full p-4 bg-white border-2 border-slate-200 rounded-2xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-400 transition placeholder:text-slate-400";
    const selectCls    = "w-full p-4 bg-white border-2 border-slate-200 rounded-2xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500 transition text-slate-600 cursor-pointer";
    const darkInputCls = "w-full p-4 bg-slate-800 border-2 border-slate-700 rounded-2xl font-bold text-sm text-white outline-none focus:ring-2 focus:ring-blue-500 transition placeholder:text-slate-500";

    return (
        <div className="bg-white rounded-3xl shadow-sm max-w-4xl mx-auto animate-fadeIn border border-slate-200 overflow-hidden">
            <div className="bg-slate-900 px-6 md:px-10 py-6 border-b border-slate-800">
                <h2 className="text-xl md:text-2xl font-black uppercase italic text-white">{editingProp?'✏️ Edit Property Listing':'➕ New Property Listing'}</h2>
                <p className="text-[10px] font-bold uppercase text-slate-400 mt-1">{editingProp?'Pre-filled with existing data — modify and save':'Files upload directly to Google Drive'}</p>
            </div>
            <div className="p-5 md:p-10 space-y-8">
                {/* Section 1 */}
                <div>
                    <div className="flex items-center gap-3 mb-4"><div className="w-6 h-6 bg-blue-600 rounded-lg flex items-center justify-center text-white text-[10px] font-black shrink-0">1</div><h3 className="text-xs font-black uppercase text-slate-700">Basic Information</h3><div className="flex-1 h-px bg-slate-200"></div></div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <input className={`${inputCls} border-blue-300`} placeholder="Property Name *" value={form.property_name} onChange={e=>set('property_name',e.target.value)} />
                        <input className={inputCls} placeholder="Builder Name" value={form.builder_name} onChange={e=>set('builder_name',e.target.value)} />
                        <select className={selectCls} value={form.property_region} onChange={e=>set('property_region',e.target.value)}><option value="">Select Region</option><option>North</option><option>South</option><option>East</option><option>West</option></select>
                        <select className={selectCls} value={form.property_type} onChange={e=>set('property_type',e.target.value)}><option value="">Property Type</option><option>Apartment</option><option>Villa</option><option>Villament</option><option>Plot</option><option>Others</option></select>
                        <input className={inputCls} placeholder="Location / Area" value={form.location} onChange={e=>set('location',e.target.value)} />
                        <input className={`${inputCls} border-blue-300`} placeholder="Price (e.g. 1.2 Cr) *" value={form.price} onChange={e=>set('price',e.target.value)} />
                    </div>
                </div>
                {/* Section 2 */}
                <div>
                    <div className="flex items-center gap-3 mb-4"><div className="w-6 h-6 bg-blue-600 rounded-lg flex items-center justify-center text-white text-[10px] font-black shrink-0">2</div><h3 className="text-xs font-black uppercase text-slate-700">Project Details</h3><div className="flex-1 h-px bg-slate-200"></div></div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div className="sm:col-span-2">
                            <label className="text-[9px] font-black uppercase text-slate-400 mb-1.5 block">BHK / Configurations (hold Ctrl/Cmd for multiple)</label>
                            <select multiple className={`${selectCls} h-28`} value={form.bhk?form.bhk.split(',').map(s=>s.trim()).filter(Boolean):[]} onChange={e=>set('bhk',[...e.target.selectedOptions].map(o=>o.value).join(', '))}>
                                {['1 BHK','2 BHK','3 BHK','4 BHK','5 BHK','Studio','Duplex','Penthouse'].map(b=><option key={b}>{b}</option>)}
                            </select>
                        </div>
                        <input className={inputCls} placeholder="Super Built-up Area (SqFt)" value={form.super_built_up_area} onChange={e=>set('super_built_up_area',e.target.value)} />
                        <input className={inputCls} placeholder="Total Units" value={form.total_units} onChange={e=>set('total_units',e.target.value)} />
                        <input className={inputCls} placeholder="Possession Date (e.g. Dec 2026)" value={form.possession_date} onChange={e=>set('possession_date',e.target.value)} />
                        <select className={selectCls} value={form.construction_status} onChange={e=>set('construction_status',e.target.value)}><option value="">Construction Status</option><option>Ready to Move In</option><option>Under Construction</option><option>New Launch</option><option>Ready to Construct</option></select>
                        <input className={inputCls} placeholder="Approvals (e.g. BDA, RERA)" value={form.approval} onChange={e=>set('approval',e.target.value)} />
                        <input className={inputCls} placeholder="RERA Number" value={form.rera_number} onChange={e=>set('rera_number',e.target.value)} />
                        <input className={`${inputCls} sm:col-span-2`} placeholder="Availability" value={form.availability} onChange={e=>set('availability',e.target.value)} />
                    </div>
                </div>
                {/* Section 3 */}
                <div>
                    <div className="flex items-center gap-3 mb-4"><div className="w-6 h-6 bg-blue-600 rounded-lg flex items-center justify-center text-white text-[10px] font-black shrink-0">3</div><h3 className="text-xs font-black uppercase text-slate-700">Description & Highlights</h3><div className="flex-1 h-px bg-slate-200"></div></div>
                    <div className="space-y-3">
                        <div><label className="text-[9px] font-black uppercase text-slate-400 mb-1.5 block">Property Description</label><textarea className={`${inputCls} h-28 resize-none`} placeholder="Describe the project in detail..." value={form.description} onChange={e=>set('description',e.target.value)} /></div>
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div><label className="text-[9px] font-black uppercase text-slate-400 mb-1.5 block">USPs / Key Highlights</label><textarea rows={4} className={`${inputCls} resize-none`} placeholder="One per line" value={form.usp_details} onChange={e=>set('usp_details',e.target.value)} /></div>
                            <div><label className="text-[9px] font-black uppercase text-slate-400 mb-1.5 block">Amenities</label><textarea rows={4} className={`${inputCls} resize-none`} placeholder="Comma separated" value={form.amenities} onChange={e=>set('amenities',e.target.value)} /></div>
                        </div>
                    </div>
                </div>
                {/* Section 4 */}
                <div className="bg-slate-900 rounded-3xl p-5 md:p-8">
                    <div className="flex items-center gap-3 mb-5"><div className="w-6 h-6 bg-blue-600 rounded-lg flex items-center justify-center text-white text-[10px] font-black shrink-0">4</div><h3 className="text-xs font-black uppercase text-blue-400">Internal Data & Links</h3></div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div><label className="text-[9px] font-black uppercase text-slate-400 mb-1.5 block">Internal POC</label><input className={darkInputCls} placeholder="e.g. Ramesh — 98xx" value={form.point_of_contact} onChange={e=>set('point_of_contact',e.target.value)} /></div>
                        <div><label className="text-[9px] font-black uppercase text-slate-400 mb-1.5 block">Commission Details</label><input className={darkInputCls} placeholder="e.g. 2% on Agreement" value={form.commission_details} onChange={e=>set('commission_details',e.target.value)} /></div>
                        <div className="sm:col-span-2"><label className="text-[9px] font-black uppercase text-slate-400 mb-1.5 block">Video Link</label><input className={darkInputCls} placeholder="https://youtube.com/..." value={form.video_link} onChange={e=>set('video_link',e.target.value)} /></div>
                        <div><label className="text-[9px] font-black uppercase text-slate-400 mb-1.5 block">Builder Website</label><input className={darkInputCls} placeholder="https://..." value={form.website_link} onChange={e=>set('website_link',e.target.value)} /></div>
                        <div><label className="text-[9px] font-black uppercase text-slate-400 mb-1.5 block">Lead Register Link / Email</label><input className={darkInputCls} placeholder="URL or email@builder.com" value={form.lead_registration_link} onChange={e=>set('lead_registration_link',e.target.value)} /></div>
                        <div className="sm:col-span-2"><label className="text-[9px] font-black uppercase text-slate-400 mb-1.5 block">Map Link</label><input className={darkInputCls} placeholder="https://maps.google.com/..." value={form.map_link} onChange={e=>set('map_link',e.target.value)} /></div>
                    </div>
                </div>
                {/* Section 5 - Files */}
                <div>
                    <div className="flex items-center gap-3 mb-2"><div className="w-6 h-6 bg-blue-600 rounded-lg flex items-center justify-center text-white text-[10px] font-black shrink-0">5</div><h3 className="text-xs font-black uppercase text-slate-700">Files & Media</h3><div className="flex-1 h-px bg-slate-200"></div></div>
                    {editingProp && (
                        <div className="flex items-center gap-2 bg-green-50 border border-green-200 rounded-2xl px-4 py-2.5 mb-4">
                            <span className="text-base shrink-0">✏️</span>
                            <p className="text-[10px] text-green-800 font-bold leading-relaxed">Editing mode — existing files shown. Remove with ✕ then upload new ones to replace.</p>
                        </div>
                    )}
                    <div className="flex items-center gap-2 bg-amber-50 border border-amber-200 rounded-2xl px-4 py-2.5 mb-4">
                        <span className="text-base shrink-0">☁️</span>
                        <p className="text-[10px] text-amber-800 font-bold leading-relaxed">All files upload to <strong>Google Drive</strong> automatically.</p>
                    </div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <UploadSection field="cover_image"    label="Main Cover Image *"               multi={false} />
                        <UploadSection field="gallery_images" label="Gallery Images (multiple)"        multi={true}  />
                        <UploadSection field="brochure"       label="Brochure (PDF)"                  multi={false} />
                        <UploadSection field="cost_sheet"     label="Cost Sheet (PDF / Images)"       multi={true}  />
                        <UploadSection field="floor_plan"     label="Floor Plan (PDF / Image)"        multi={false} />
                        <UploadSection field="master_plan"    label="Master Plan (PDF / Image)"       multi={false} />
                        <UploadSection field="miscellaneous"  label="Miscellaneous Docs"              multi={true}  />
                    </div>
                </div>
                <button onClick={save} disabled={loading} className="w-full bg-blue-600 text-white p-5 rounded-3xl font-black uppercase tracking-widest hover:bg-slate-900 transition shadow-xl disabled:opacity-50 text-sm flex items-center justify-center gap-3">
                    {loading?<><span className="animate-spin inline-block text-lg">⏳</span> Processing...</>:<><span className="text-lg">{editingProp?'✅':'🚀'}</span> {editingProp?'Update Listing':'Publish Listing'}</>}
                </button>
            </div>
        </div>
    );
}

// ─── MANUAL LEAD FORM ─────────────────────────────────────────────────────
function ManualLeadForm({ supabase, properties, onSuccess, agentName }) {
    const [form, setForm] = useState({name:'',phone:'',email:'',project:'General Enquiry',note:'',source:'Manual Entry'});
    const [loading, setLoading] = useState(false);
    const set = (k,v) => setForm(f=>({...f,[k]:v}));

    const handleSubmit = async () => {
        if (!form.name||!form.phone) { alert('Name and Phone are required.'); return; }
        setLoading(true);
        const stamp = new Date().toLocaleString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
        const agentTag = agentName ? `[${agentName}]` : '[Admin]';
        const payload = {
            customer_name:         form.name,
            phone_number:          form.phone,
            customer_email:        form.email || null,
            project_interested_in: form.project,
            add_note:              form.note,
            call_remark:           form.note ? `[${stamp}] ${agentTag} Manual entry — Req: ${form.note}\n\n` : `[${stamp}] ${agentTag} Manual lead added\n\n`,
            lead_source:           form.source,
            lead_status:           'Un called',
            psa_agent_name:        agentName || null,
            assigned_agent:        agentName || null,
        };
        const {error} = await supabase.from('leads').insert([payload]);
        if (!error) {
            // Send notification email for manual leads too
            fetch(GOOGLE_SCRIPT_URL,{method:"POST",headers:{'Content-Type':'application/json'},
                body:JSON.stringify({action:"newLeadEmail",adminEmail:ADMIN_EMAIL,Name:form.name,Phone:form.phone,Email:form.email||'N/A',Project:form.project,Source:form.source,Note:form.note||'None',Time:stamp})}).catch(()=>{});
            onSuccess();
        } else alert(error.message);
        setLoading(false);
    };

    return (
        <div className="space-y-3">
            <div className="grid grid-cols-2 gap-3">
                <div className="col-span-2"><label className="text-[8px] font-black uppercase text-slate-400 mb-1 block">Client Name *</label><input required className="w-full p-3 bg-slate-50 border-2 border-slate-200 rounded-2xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500 transition" placeholder="Full Name" value={form.name} onChange={e=>set('name',e.target.value)} /></div>
                <div><label className="text-[8px] font-black uppercase text-slate-400 mb-1 block">Phone *</label><input required className="w-full p-3 bg-slate-50 border-2 border-slate-200 rounded-2xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500 transition" placeholder="10-digit" value={form.phone} onChange={e=>set('phone',e.target.value)} /></div>
                <div><label className="text-[8px] font-black uppercase text-slate-400 mb-1 block">Email</label><input type="email" className="w-full p-3 bg-slate-50 border-2 border-slate-200 rounded-2xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500 transition" placeholder="Optional" value={form.email} onChange={e=>set('email',e.target.value)} /></div>
            </div>
            <div><label className="text-[8px] font-black uppercase text-slate-400 mb-1 block">Project Interested In</label>
                <select className="w-full p-3 bg-slate-50 border-2 border-slate-200 rounded-2xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500 transition text-slate-700 cursor-pointer" value={form.project} onChange={e=>set('project',e.target.value)}>
                    <option value="General Enquiry">General Enquiry</option>
                    {properties?.map(p=><option key={p.id} value={getVal(p,'property_name')}>{getVal(p,'property_name')}</option>)}
                </select>
            </div>
            <div><label className="text-[8px] font-black uppercase text-slate-400 mb-1 block">Lead Source</label>
                <select className="w-full p-3 bg-slate-50 border-2 border-slate-200 rounded-2xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500 transition text-slate-700 cursor-pointer" value={form.source} onChange={e=>set('source',e.target.value)}>
                    <option>Manual Entry</option><option>Walk-in</option><option>Referral</option><option>MagicBricks</option><option>Housing.com</option>
                </select>
            </div>
            {agentName && <div className="bg-indigo-50 border border-indigo-200 rounded-2xl px-3 py-2 text-[10px] text-indigo-700 font-bold">👤 Lead will be assigned to: <strong>{agentName}</strong></div>}
            <div><label className="text-[8px] font-black uppercase text-slate-400 mb-1 block">Requirements / Notes</label>
                <textarea className="w-full p-3 bg-slate-50 border-2 border-slate-200 rounded-2xl font-bold text-sm resize-none outline-none focus:ring-2 focus:ring-blue-500 transition h-20" placeholder="Budget, BHK preference, timeline..." value={form.note} onChange={e=>set('note',e.target.value)} />
            </div>
            <button disabled={loading} onClick={handleSubmit} className="w-full bg-blue-600 hover:bg-blue-700 text-white p-4 rounded-2xl font-black uppercase tracking-widest shadow-lg transition disabled:opacity-50 flex items-center justify-center gap-2 text-sm">
                {loading?<><span className="animate-spin">⏳</span> Saving...</>:'⚡ Add Lead'}
            </button>
        </div>
    );
}

// ─── LOGIN ────────────────────────────────────────────────────────────────
function LoginForm({ supabase }) {
    const [email, setEmail]   = useState("");
    const [pass, setPass]     = useState("");
    const [loading, setLoad]  = useState(false);
    const [errMsg, setErrMsg] = useState("");
    const handleLogin = async (e) => {
        e.preventDefault(); setLoad(true); setErrMsg("");
        const {error} = await supabase.auth.signInWithPassword({email,password:pass});
        if (error) setErrMsg(error.message);
        setLoad(false);
    };
    return (
        <div className="min-h-screen bg-slate-950 flex items-center justify-center p-4">
            <form onSubmit={handleLogin} className="bg-white p-10 rounded-[40px] shadow-2xl w-full max-w-sm text-center border-t-8 border-blue-500">
                <div className="w-16 h-16 bg-gradient-to-br from-blue-600 to-indigo-600 rounded-2xl flex items-center justify-center text-3xl font-black italic text-white mx-auto mb-6 shadow-lg">H</div>
                <h1 className="text-3xl font-black italic uppercase mb-2">Horizon CRM</h1>
                <p className="text-slate-400 text-[10px] font-bold uppercase tracking-widest mb-8">Command Center</p>
                {errMsg && <div className="text-red-500 text-xs font-bold mb-4 bg-red-50 p-3 rounded-xl border border-red-200">{errMsg}</div>}
                <input type="email" required placeholder="Email" className="w-full p-4 bg-slate-100 rounded-2xl mb-3 font-bold outline-none focus:ring-2 focus:ring-blue-500 transition" onChange={e=>setEmail(e.target.value)} />
                <input type="password" required placeholder="Password" className="w-full p-4 bg-slate-100 rounded-2xl mb-8 font-bold outline-none focus:ring-2 focus:ring-blue-500 transition" onChange={e=>setPass(e.target.value)} />
                <button disabled={loading} type="submit" className="w-full bg-blue-600 text-white font-black py-4 rounded-2xl uppercase tracking-widest shadow-lg disabled:opacity-50 hover:bg-blue-700 transition">{loading?"Authenticating...":"Login"}</button>
            </form>
        </div>
    );
}

// ─── MAIN APP ─────────────────────────────────────────────────────────────
function AdminApp() {
    const [session,         setSession]         = useState(null);
    const [authChecking,    setAuthChecking]    = useState(true);
    const [leads,           setLeads]           = useState([]);
    const [allLeads,        setAllLeads]        = useState([]);
    const [allBulkLeads,    setAllBulkLeads]    = useState([]);
    const [allManualLeads,  setAllManualLeads]  = useState([]);
    const [properties,      setProperties]      = useState([]);
    const [editingProp,     setEditingProp]     = useState(null);
    const [view,            setView]            = useState('dashboard');
    const [leadCategory,    setLeadCategory]    = useState('website');
    const [loading,         setLoading]         = useState(true);
    const [showManualModal, setShowManualModal] = useState(false);
    const [bucketTab,       setBucketTab]       = useState('active');
    const [selectedProp,    setSelectedProp]    = useState(null);
    const [visibleCount,    setVisibleCount]    = useState(50);
    const [searchTerm,      setSearchTerm]      = useState("");
    const [deferredPrompt,  setDeferredPrompt]  = useState(null);
    const [detailLead,      setDetailLead]      = useState(null);
    const [summaryAgent,    setSummaryAgent]    = useState('All');
    const [toast,           setToast]           = useState(null);

    const userEmail   = session?.user?.email || '';
    const agentName   = getAgentName(userEmail);
    const isAdminUser = isAdmin(userEmail);

    const showToast = useCallback((msg, color='bg-emerald-600') => {
        setToast({msg,color}); setTimeout(()=>setToast(null),3500);
    }, []);

    useEffect(()=>{
        const handler=(e)=>{e.preventDefault();setDeferredPrompt(e);};
        window.addEventListener('beforeinstallprompt',handler);
        return ()=>window.removeEventListener('beforeinstallprompt',handler);
    },[]);

    const handleNavigate = (newView, newCat='website') => {
        setView(newView);
        if (newView==='dashboard') setLeadCategory(newCat);
        if (newView!=='add') setEditingProp(null);
    };

    useEffect(()=>{ setVisibleCount(50); },[leadCategory,bucketTab,searchTerm]);

    useEffect(()=>{
        supabase.auth.getSession().then(({data:{session}})=>{
            setSession(session); setAuthChecking(false);
            if (window.__dismissSplash) window.__dismissSplash();
        });
        const {data:{subscription}} = supabase.auth.onAuthStateChange((_e,s)=>setSession(s));
        return ()=>subscription.unsubscribe();
    },[]);

    useEffect(()=>{
        if (session) {
            fetchProperties();
            if (view==='dashboard') fetchLeads();
            if (isAdminUser) fetchAllLeadsForAdmin();
        }
    },[session,view,leadCategory]);

    // ── NEW LEAD REALTIME LISTENER (sends email on new website lead) ──────
    useEffect(()=>{
        if (!session) return;
        const channel = supabase
            .channel('new-leads-email')
            .on('postgres_changes',{event:'INSERT',schema:'public',table:'leads'},(payload)=>{
                const lead = payload.new;
                // Only email-notify for website leads (no lead_source or 'website')
                const src = (lead.lead_source||'').toLowerCase();
                if (!src || src.includes('website')) {
                    sendLeadEmailNotification(lead);
                }
            })
            .subscribe();
        return ()=>supabase.removeChannel(channel);
    },[session]);

    async function fetchLeads() {
        setLoading(true);
        if (leadCategory === 'bulk') {
            let q = supabase.from('bulk_leads').select('*').order('created_at',{ascending:false});
            // Agents see only their own bulk leads
            if (!isAdminUser && agentName) q = q.eq('psa_agent_name', agentName);
            const {data,error} = await q;
            if (!error) setLeads(data||[]);
        } else {
            // website + manual both from 'leads' table
            let q = supabase.from('leads').select('*').order('created_at',{ascending:false});
            const {data,error} = await q;
            if (!error) {
                let raw = data||[];
                if (leadCategory === 'website') {
                    // Website leads: all sources that are empty or say 'website' — visible to all for calling
                    raw = raw.filter(l => {
                        const src = (l.lead_source||'').toLowerCase().trim();
                        return !src || src.includes('website');
                    });
                    // Admin sees all; agents see all website leads (they need to call them)
                } else if (leadCategory === 'manual') {
                    // Manual leads: only agent's own
                    raw = raw.filter(l => {
                        const src = (l.lead_source||'').toLowerCase().trim();
                        return src && !src.includes('website');
                    });
                    if (!isAdminUser && agentName) {
                        raw = raw.filter(l => l.psa_agent_name===agentName || l.assigned_agent===agentName);
                    }
                }
                setLeads(raw);
            }
        }
        setLoading(false);
    }

    async function fetchAllLeadsForAdmin() {
        const [{data:webData},{data:bulkData}] = await Promise.all([
            supabase.from('leads').select('*').order('created_at',{ascending:false}),
            supabase.from('bulk_leads').select('*').order('created_at',{ascending:false}),
        ]);
        const allWeb = webData||[];
        setAllLeads(allWeb.filter(l=>{ const s=(l.lead_source||'').toLowerCase().trim(); return !s||s.includes('website'); }));
        setAllManualLeads(allWeb.filter(l=>{ const s=(l.lead_source||'').toLowerCase().trim(); return s&&!s.includes('website'); }));
        setAllBulkLeads(bulkData||[]);
    }

    async function fetchProperties() {
        const {data} = await supabase.from('properties').select('*').order('created_at',{ascending:false});
        setProperties(data||[]);
    }

    async function updateLead(lead, field, value) {
        if (field==='lead_status' && (!lead.psa_agent_name||!lead.psa_agent_name.trim()) && leadCategory==='website') {
            alert("Assign a PSA Agent before changing status."); fetchLeads(); return;
        }
        let updates = {};
        const stamp = new Date().toLocaleString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
        const agentTag = agentName ? `[${agentName}]` : '[Admin]';

        if (field==='lead_status')        { updates.lead_status=value; updates.call_remark=`[${stamp}] ${agentTag} Status→${value}\n\n${lead.call_remark||''}`; }
        else if (field==='psa_agent_name') { updates.psa_agent_name=value; updates.assigned_agent=value; updates.call_remark=`[${stamp}] [Admin] Assigned to ${value}\n\n${lead.call_remark||''}`; }
        else if (field==='follow_up_at')   { updates.follow_up_at=value; updates.call_remark=`[${stamp}] ${agentTag} Callback: ${new Date(value).toLocaleString('en-IN',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}\n\n${lead.call_remark||''}`; }
        else if (field==='site_visit_at')  { updates.site_visit_at=value; updates.call_remark=`[${stamp}] ${agentTag} SV Booked: ${value}\n\n${lead.call_remark||''}`; }
        else if (field==='add_note')       { if (!value.trim()) return; updates.add_note=value; updates.call_remark=`[${stamp}] ${agentTag} Note: ${value}\n\n${lead.call_remark||''}`; }
        else if (field==='reject_reason')  { updates.reject_reason=value; updates.call_remark=`[${stamp}] ${agentTag} Rejected: ${value}\n\n${lead.call_remark||''}`; }
        else                                { updates[field]=value; }

        const table = leadCategory==='bulk' ? 'bulk_leads' : 'leads';
        setLeads(prev=>prev.map(l=>l.id===lead.id?{...l,...updates}:l));
        const {error} = await supabase.from(table).update(updates).eq('id',lead.id);
        if (error) { alert("Save error: "+error.message); fetchLeads(); }
    }

    const displayedLeads = useMemo(() => {
        const bucket = LEAD_BUCKETS.find(b=>b.id===bucketTab);
        let f = bucket ? leads.filter(bucket.filter) : leads;
        if (searchTerm.trim()) {
            const t = searchTerm.toLowerCase();
            f = f.filter(l=>(l.customer_name||'').toLowerCase().includes(t)||(l.phone_number||'').toLowerCase().includes(t)||(l.project_interested_in||'').toLowerCase().includes(t));
        }
        return f;
    },[leads,bucketTab,searchTerm]);

    const visibleLeads = displayedLeads.slice(0,visibleCount);

    const stats = useMemo(()=>{
        let t = leads;
        if (isAdminUser && summaryAgent!=='All') t = t.filter(l=>l.psa_agent_name===summaryAgent);
        return {
            total:     t.length,
            uncalled:  t.filter(l=>l.lead_status==='Un called'||!l.lead_status).length,
            called:    t.filter(l=>l.lead_status&&l.lead_status!=='Un called'&&l.lead_status!=='Rejected').length,
            rejected:  t.filter(l=>l.lead_status==='Rejected').length,
            converted: t.filter(l=>l.lead_status==='Converted').length,
        };
    },[leads,summaryAgent,isAdminUser]);

    if (authChecking) return <div className="min-h-screen bg-slate-950"></div>;
    if (!session) return <LoginForm supabase={supabase} />;
    if (selectedProp) return <PropertyDetailsPage property={selectedProp} onBack={()=>setSelectedProp(null)} />;

    return (
        <div className="min-h-screen flex flex-col animate-fadeIn">
            {toast && <div className={`fixed top-4 left-1/2 -translate-x-1/2 z-[600] ${toast.color} text-white text-xs font-black uppercase tracking-widest px-6 py-3.5 rounded-2xl shadow-2xl animate-fadeIn`}>{toast.msg}</div>}
            {detailLead && <LeadDetailModal lead={detailLead} onClose={()=>setDetailLead(null)} />}

            {/* ── Top Nav ── */}
            <nav className="bg-slate-900 text-white px-4 md:px-8 py-3 flex justify-between items-center sticky top-0 z-50 shadow-lg border-b border-slate-800">
                <div className="flex items-center gap-3">
                    <h1 className="font-black tracking-tighter text-lg md:text-xl uppercase italic">Horizon <span className="text-blue-400">CRM</span></h1>
                    {agentName && <span className="hidden md:block text-[9px] font-bold text-indigo-400 bg-indigo-900/40 border border-indigo-800 px-2 py-1 rounded-lg uppercase tracking-widest">👤 {agentName}</span>}
                    {isAdminUser && <span className="hidden md:block text-[9px] font-bold text-amber-400 bg-amber-900/40 border border-amber-800 px-2 py-1 rounded-lg uppercase tracking-widest">👑 Admin</span>}
                </div>
                <div className="flex gap-1 items-center">
                    {[
                        {id:'dashboard', label:'📊 CRM',     mobileLabel:'CRM'},
                        {id:'library',   label:'🏢 Library', mobileLabel:'Library'},
                        {id:'add',       label:'➕ Property', mobileLabel:'Add'},
                    ].map(n=>(
                        <button key={n.id} onClick={()=>handleNavigate(n.id)}
                            className={`px-2.5 md:px-4 py-1.5 md:py-2 rounded-xl text-[9px] md:text-[10px] font-black uppercase tracking-widest transition ${view===n.id?'bg-blue-600 text-white shadow-md':'text-slate-400 hover:text-white hover:bg-slate-800'}`}>
                            <span className="hidden md:inline">{n.label}</span>
                            <span className="md:hidden">{n.mobileLabel}</span>
                        </button>
                    ))}
                    {isAdminUser && (
                        <button onClick={()=>handleNavigate('adminview')} className={`px-2.5 md:px-4 py-1.5 md:py-2 rounded-xl text-[9px] md:text-[10px] font-black uppercase tracking-widest transition ${view==='adminview'?'bg-amber-500 text-white shadow-md':'text-amber-400 hover:text-white hover:bg-amber-900/40'}`}>
                            <span className="hidden md:inline">👑 Overview</span>
                            <span className="md:hidden">👑</span>
                        </button>
                    )}
                    {deferredPrompt && <button onClick={async()=>{deferredPrompt.prompt();const{outcome}=await deferredPrompt.userChoice;if(outcome==='accepted')setDeferredPrompt(null);}} className="hidden md:flex items-center gap-1 ml-1 px-3 py-2 rounded-xl text-[9px] font-black uppercase bg-indigo-600 hover:bg-indigo-500 text-white transition">⬇ Install</button>}
                    <button onClick={()=>supabase.auth.signOut()} className="ml-1 md:ml-3 text-[9px] font-black uppercase text-red-400 border border-red-900/60 px-2 md:px-3 py-1.5 md:py-2 rounded-xl hover:bg-red-900/40 transition">
                        <span className="hidden md:inline">Logout</span><span className="md:hidden">Out</span>
                    </button>
                </div>
            </nav>

            <main className="p-3 md:p-8 max-w-7xl mx-auto w-full pb-24 md:pb-8">

                {/* ── ADMIN OVERVIEW ── */}
                {view==='adminview' && isAdminUser && (
                    <AdminOverviewPanel allLeads={allLeads} allBulkLeads={allBulkLeads} allManualLeads={allManualLeads} supabase={supabase} properties={properties} />
                )}

                {/* ── DASHBOARD ── */}
                {view==='dashboard' && (
                    <div className="space-y-5">
                        {/* Stats */}
                        <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-4">
                            <div className="flex flex-wrap md:grid md:grid-cols-6 gap-3 items-center">
                                {isAdminUser && (
                                    <div className="w-full md:w-auto border-b md:border-none pb-2 md:pb-0">
                                        <select className="bg-transparent outline-none cursor-pointer text-slate-700 text-[10px] font-black uppercase w-full md:w-auto border border-slate-200 rounded-xl px-3 py-2 focus:ring-2 focus:ring-blue-500" value={summaryAgent} onChange={e=>setSummaryAgent(e.target.value)}>
                                            <option value="All">📊 All Agents</option>
                                            {ALL_AGENTS.map(a=><option key={a} value={a}>👤 {a}</option>)}
                                        </select>
                                    </div>
                                )}
                                {[
                                    {label:'Total',val:stats.total,cls:'bg-slate-50 border-slate-100',vCls:'text-slate-700'},
                                    {label:'Uncalled',val:stats.uncalled,cls:'bg-amber-50 border-amber-100',vCls:'text-amber-600'},
                                    {label:'Working',val:stats.called,cls:'bg-blue-50 border-blue-100',vCls:'text-blue-600'},
                                    {label:'Converted',val:stats.converted,cls:'bg-green-50 border-green-100',vCls:'text-green-600'},
                                    {label:'Rejected',val:stats.rejected,cls:'bg-red-50 border-red-100',vCls:'text-red-600'},
                                ].map(s=>(
                                    <div key={s.label} className={`flex flex-col items-center flex-1 p-3 rounded-2xl border ${s.cls}`}>
                                        <span className="text-[9px] uppercase font-black text-slate-400 mb-1">{s.label}</span>
                                        <span className={`font-black text-2xl leading-none ${s.vCls}`}>{s.val}</span>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Category tabs */}
                        <div className="flex flex-col md:flex-row justify-between items-center gap-4">
                            <div className="flex gap-2 bg-white border border-slate-200 rounded-2xl p-1.5 shadow-sm w-full md:w-auto">
                                {[{id:'website',label:'🌐 Website'},{id:'bulk',label:'📦 Bulk'},{id:'manual',label:'✍️ Manual'}].map(c=>(
                                    <button key={c.id} onClick={()=>{handleNavigate('dashboard',c.id);setBucketTab('active');}}
                                        className={`flex-1 md:flex-none px-4 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all ${leadCategory===c.id?'bg-blue-600 text-white shadow-md':'text-slate-500 hover:text-slate-800 hover:bg-slate-50'}`}>{c.label}</button>
                                ))}
                            </div>
                            <button onClick={()=>setShowManualModal(true)} className="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-2xl text-[9px] font-black uppercase shadow-md shrink-0 transition">+ Add Lead</button>
                        </div>

                        {/* Bucket tabs */}
                        <div className="flex gap-2 overflow-x-auto hide-scroll pb-1">
                            {LEAD_BUCKETS.map(b=>(
                                <button key={b.id} onClick={()=>{setBucketTab(b.id);setVisibleCount(50);}}
                                    className={`shrink-0 px-3 py-1.5 rounded-xl text-[9px] font-black uppercase tracking-widest transition border ${bucketTab===b.id?'bg-slate-900 text-white border-slate-700':'bg-white text-slate-500 border-slate-200 hover:border-slate-400'}`}>{b.label}</button>
                            ))}
                        </div>

                        {/* Search */}
                        <div className="relative">
                            <input type="text" placeholder="Search by name, phone or project..." value={searchTerm} onChange={e=>setSearchTerm(e.target.value)}
                                className="w-full p-4 pl-12 pr-24 bg-white border-2 border-slate-200 rounded-2xl text-xs font-bold shadow-sm outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-300 transition" />
                            <span className="absolute left-4 top-1/2 -translate-y-1/2 text-lg opacity-40 pointer-events-none">🔍</span>
                            <div className="absolute right-3 top-1/2 -translate-y-1/2 flex items-center gap-2">
                                {!loading && <span className="text-[9px] font-black text-slate-400 bg-slate-100 px-2 py-1 rounded-lg">{displayedLeads.length}</span>}
                                {searchTerm && <button onClick={()=>setSearchTerm("")} className="text-[9px] font-black text-red-400 hover:text-red-600 bg-red-50 border border-red-200 px-2 py-1 rounded-lg uppercase transition">✕</button>}
                            </div>
                        </div>

                        {/* ── Desktop Table ── */}
                        <div className="hidden lg:block bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                            {loading ? (
                                <div className="p-6 space-y-3">{[...Array(6)].map((_,i)=>(
                                    <div key={i} className="flex gap-4"><div className="skeleton h-14 flex-1 rounded-xl"></div><div className="skeleton h-14 w-44 rounded-xl"></div><div className="skeleton h-14 w-36 rounded-xl"></div><div className="skeleton h-14 flex-1 rounded-xl"></div></div>
                                ))}</div>
                            ) : visibleLeads.length===0 ? (
                                <div className="py-20 flex flex-col items-center text-center"><div className="text-5xl mb-4">📭</div><div className="text-sm font-black uppercase text-slate-400 mb-1">No leads in this bucket</div></div>
                            ) : (
                                <table className="w-full text-left text-xs">
                                    <thead className="bg-slate-900 text-slate-400 font-black uppercase text-[9px] tracking-widest">
                                        <tr>
                                            <th className="px-5 py-3.5">Customer</th>
                                            {/* PSA Agent column ONLY for website leads */}
                                            {leadCategory==='website' && <th className="px-5 py-3.5">Agent & Status</th>}
                                            {leadCategory!=='website' && <th className="px-5 py-3.5">Status</th>}
                                            <th className="px-5 py-3.5">Scheduling</th>
                                            <th className="px-5 py-3.5 min-w-[260px]">Activity & Notes</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100">
                                        {visibleLeads.map(l=>(
                                            <tr key={l.id} className={`border-l-[5px] hover:brightness-[0.97] transition-all ${l.lead_priority==='Hot'?'border-l-red-500':l.lead_priority==='Cold'?'border-l-blue-400':'border-l-amber-400'} ${getCardTint(l.lead_status)}`}>
                                                <td className="px-5 py-4 min-w-[200px]">
                                                    <p className="font-black text-[11px] uppercase text-slate-900 leading-tight">{l.customer_name}</p>
                                                    <p className="text-blue-600 font-black text-[11px] mt-0.5">{l.phone_number}</p>
                                                    {l.customer_email && <p className="text-slate-400 text-[9px] mt-0.5 lowercase truncate font-medium max-w-[160px]">{l.customer_email}</p>}
                                                    <p className="text-[8px] text-slate-500 font-bold mt-1.5 tracking-widest uppercase truncate max-w-[160px]">🏠 {l.project_interested_in||'General'}</p>
                                                    {/* Registration date always visible */}
                                                    <p className="text-[8px] text-indigo-500 font-bold mt-1 tracking-widest uppercase">🕐 {formatDateTime(l.created_at)}</p>
                                                    <div className="mt-2.5 flex gap-1.5">
                                                        <a href={`tel:${l.phone_number}`} className="bg-slate-100 text-slate-600 text-[8px] font-black px-2.5 py-1.5 rounded-lg uppercase hover:bg-slate-200 transition border border-slate-200">📞 Call</a>
                                                        <a href={`https://wa.me/91${(l.phone_number||'').replace(/\D/g,'').slice(-10)}`} target="_blank" className="bg-green-500 text-white text-[8px] font-black px-2.5 py-1.5 rounded-lg uppercase hover:bg-green-600 transition shadow-sm">💬 WA</a>
                                                        <button onClick={()=>setDetailLead(l)} className="bg-blue-600 text-white text-[8px] font-black px-2.5 py-1.5 rounded-lg uppercase hover:bg-blue-700 transition shadow-sm">📋 Detail</button>
                                                    </div>
                                                </td>
                                                <td className="p-4 min-w-[160px]">
                                                    {/* PSA Agent selector ONLY for website leads */}
                                                    {leadCategory==='website' && (
                                                        <select onChange={e=>updateLead(l,'psa_agent_name',e.target.value)} value={l.psa_agent_name||''} className="w-full p-2 mb-2 border-2 rounded-xl font-black uppercase text-[9px] outline-none bg-slate-900 border-slate-700 text-blue-300 cursor-pointer">
                                                            <option value="" disabled>⚡ Assign Agent</option>
                                                            {ALL_AGENTS.map(a=><option key={a} value={a}>👤 {a}</option>)}
                                                        </select>
                                                    )}
                                                    <select onChange={e=>updateLead(l,'lead_status',e.target.value)} value={l.lead_status||''} className={`w-full p-2 mb-2 border-2 rounded-xl font-black uppercase text-[9px] outline-none cursor-pointer ${getStatusStyles(l.lead_status)}`}>
                                                        {(!l.lead_status||l.lead_status==='Un called') && <option value="Un called">🔵 Un called</option>}
                                                        <option value="Called">✅ Called</option>
                                                        <option value="RNR">🔔 RNR</option>
                                                        <option value="Details Shared">📤 Details Shared</option>
                                                        <option value="SV Scheduled">📅 SV Scheduled</option>
                                                        <option value="SV Done">✅ SV Done</option>
                                                        <option value="Converted">🏆 Converted</option>
                                                        <option value="Rejected">❌ Rejected</option>
                                                    </select>
                                                    {l.lead_status==='Rejected' && (
                                                        <select onChange={e=>updateLead(l,'reject_reason',e.target.value)} value={l.reject_reason||''} className="w-full p-2 mb-2 border-2 border-red-300 rounded-xl font-black uppercase text-[9px] outline-none bg-red-50 text-red-800 cursor-pointer">
                                                            <option value="" disabled>Select Reason</option>
                                                            <option>Not Interested</option><option>No Response</option><option>Wrong Number</option><option>No Incoming Call</option>
                                                        </select>
                                                    )}
                                                    <select onChange={e=>updateLead(l,'lead_priority',e.target.value)} value={l.lead_priority||'Warm'} className={`w-full p-2 border-2 rounded-xl font-black uppercase text-[9px] outline-none cursor-pointer ${getPriorityColor(l.lead_priority)}`}>
                                                        <option value="Hot">🔥 Hot</option><option value="Warm">🌤 Warm</option><option value="Cold">❄️ Cold</option>
                                                    </select>
                                                    {l.psa_agent_name && <div className="mt-2 text-[8px] font-bold text-indigo-500 bg-indigo-50 px-2 py-1 rounded-lg border border-indigo-100">👤 {l.psa_agent_name}</div>}
                                                </td>
                                                <td className="px-5 py-4 min-w-[170px]">
                                                    {['Called','RNR','Details Shared'].includes(l.lead_status) && (
                                                        <div><span className="text-[8px] font-black text-blue-600 uppercase block mb-1">📅 Callback Date</span><input type="datetime-local" className="w-full p-2 border-2 border-blue-200 bg-blue-50 rounded-xl text-[10px] font-bold outline-none focus:border-blue-400" value={l.follow_up_at?.slice(0,16)||''} onChange={e=>updateLead(l,'follow_up_at',e.target.value)} /></div>
                                                    )}
                                                    {l.lead_status==='SV Scheduled' && (
                                                        <div className="mt-2"><span className="text-[8px] font-black text-teal-600 uppercase block mb-1">📍 Site Visit</span><input type="date" className="w-full p-2 border-2 border-teal-200 bg-teal-50 rounded-xl text-[10px] font-bold outline-none focus:border-teal-400" value={l.site_visit_at||''} onChange={e=>updateLead(l,'site_visit_at',e.target.value)} /></div>
                                                    )}
                                                    {l.lead_status==='SV Done' && (
                                                        <div className="mt-2"><span className="text-[8px] font-black text-cyan-600 uppercase block mb-1">✅ SV Done On</span><input type="date" className="w-full p-2 border-2 border-cyan-200 bg-cyan-50 rounded-xl text-[10px] font-bold outline-none focus:border-cyan-400" value={l.site_visit_done_at||''} onChange={e=>updateLead(l,'site_visit_done_at',e.target.value)} /></div>
                                                    )}
                                                    {!['Called','RNR','Details Shared','SV Scheduled','SV Done'].includes(l.lead_status) && <span className="text-[9px] text-slate-300 font-bold italic">—</span>}
                                                </td>
                                                <td className="px-5 py-4">
                                                    <div className="flex flex-col gap-2">
                                                        <div className="h-[60px] overflow-y-auto bg-slate-900/5 p-2 rounded-xl history-scroll whitespace-pre-wrap border border-slate-200 leading-relaxed font-medium text-slate-500 text-[9px]">
                                                            {l.call_remark||<span className="italic text-slate-300">No activity yet...</span>}
                                                        </div>
                                                        <NoteCell lead={l} onSave={updateLead} />
                                                    </div>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            )}
                            {!loading && visibleCount<displayedLeads.length && (
                                <div className="p-4 border-t border-slate-100 bg-slate-50 flex justify-center">
                                    <button onClick={()=>setVisibleCount(v=>v+50)} className="bg-blue-100 hover:bg-blue-200 text-blue-800 px-6 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest transition">Load More ({displayedLeads.length-visibleCount} hidden)</button>
                                </div>
                            )}
                        </div>

                        {/* ── Mobile Cards ── */}
                        <div className="lg:hidden space-y-3">
                            {loading ? (
                                [...Array(4)].map((_,i)=>(
                                    <div key={i} className="bg-white rounded-2xl p-4 border border-slate-200 space-y-3">
                                        <div className="flex justify-between"><div className="space-y-2 flex-1"><div className="skeleton h-4 w-32 rounded"></div><div className="skeleton h-3 w-24 rounded"></div></div><div className="skeleton h-12 w-24 rounded-xl"></div></div>
                                        <div className="skeleton h-9 w-full rounded-xl"></div>
                                    </div>
                                ))
                            ) : visibleLeads.length===0 ? (
                                <div className="py-16 flex flex-col items-center text-center bg-white rounded-2xl border border-slate-200">
                                    <div className="text-4xl mb-3">📭</div>
                                    <div className="text-sm font-black uppercase text-slate-400 mb-1">No leads in this bucket</div>
                                </div>
                            ) : visibleLeads.map(l=>(
                                <div key={`m-${l.id}`} className={`rounded-2xl shadow-sm border-2 overflow-hidden animate-fadeIn ${l.lead_priority==='Hot'?'border-red-200':l.lead_priority==='Cold'?'border-blue-200':'border-amber-200'} ${getCardTint(l.lead_status)}`}>
                                    <div className={`h-1 w-full ${l.lead_priority==='Hot'?'bg-red-500':l.lead_priority==='Cold'?'bg-blue-400':'bg-amber-400'}`}></div>
                                    <div className="p-4">
                                        <div className="flex justify-between items-start mb-3">
                                            <div className="flex-1 min-w-0 pr-2">
                                                <h3 className="font-black text-[13px] uppercase text-slate-900 leading-tight truncate">{l.customer_name}</h3>
                                                <p className="font-black text-blue-600 text-[12px] mt-0.5">{l.phone_number}</p>
                                                {l.customer_email && <p className="font-medium text-slate-400 text-[9px] truncate mt-0.5">{l.customer_email}</p>}
                                                <p className="text-[9px] text-slate-500 font-bold mt-1 tracking-widest uppercase truncate">🏠 {l.project_interested_in||'General'}</p>
                                                {/* Registration date visible on mobile too */}
                                                <p className="text-[8px] text-indigo-500 font-bold mt-0.5 tracking-widest uppercase">🕐 {formatDateTime(l.created_at)}</p>
                                                {l.psa_agent_name && <p className="text-[8px] text-indigo-600 font-bold mt-0.5">👤 {l.psa_agent_name}</p>}
                                            </div>
                                            <div className="flex flex-col items-end gap-1.5 shrink-0">
                                                <span className={`text-[8px] font-black uppercase px-2.5 py-1 rounded-full border ${getStatusStyles(l.lead_status)}`}>{l.lead_status||'Un called'}</span>
                                                <span className={`text-[8px] font-black uppercase px-2 py-0.5 rounded-full border ${getPriorityColor(l.lead_priority||'Warm')}`}>{l.lead_priority==='Hot'?'🔥':l.lead_priority==='Cold'?'❄️':'🌤'} {l.lead_priority||'Warm'}</span>
                                            </div>
                                        </div>
                                        <div className="flex gap-2 mb-3">
                                            <a href={`tel:${l.phone_number}`} className="flex-1 flex items-center justify-center gap-1 bg-white border-2 border-slate-200 text-slate-700 text-[9px] font-black uppercase py-2.5 rounded-xl hover:border-blue-400 transition">📞 Call</a>
                                            <a href={`https://wa.me/91${(l.phone_number||'').replace(/\D/g,'').slice(-10)}`} className="flex-1 flex items-center justify-center gap-1 bg-green-500 text-white text-[9px] font-black uppercase py-2.5 rounded-xl hover:bg-green-600 transition">💬 WA</a>
                                            <button onClick={()=>setDetailLead(l)} className="flex-1 flex items-center justify-center gap-1 bg-blue-600 text-white text-[9px] font-black uppercase py-2.5 rounded-xl hover:bg-blue-700 transition">📋 Detail</button>
                                        </div>
                                        <div className="border-t border-slate-200/80 pt-3 space-y-2">
                                            <div className="grid grid-cols-2 gap-2 mb-1">
                                                {/* PSA Agent selector ONLY for website leads on mobile too */}
                                                {leadCategory==='website' && (
                                                    <div className="flex flex-col gap-1 col-span-2">
                                                        <label className="text-[8px] font-black text-slate-400 uppercase tracking-widest">PSA Agent</label>
                                                        <select onChange={e=>updateLead(l,'psa_agent_name',e.target.value)} value={l.psa_agent_name||''} className="p-2.5 border-2 border-slate-700 bg-slate-900 rounded-xl font-black uppercase text-[9px] outline-none text-blue-300 cursor-pointer">
                                                            <option value="" disabled>⚡ Assign Agent</option>
                                                            {ALL_AGENTS.map(a=><option key={a} value={a}>👤 {a}</option>)}
                                                        </select>
                                                    </div>
                                                )}
                                                <div className="flex flex-col gap-1">
                                                    <label className="text-[8px] font-black text-slate-400 uppercase">Status</label>
                                                    <select onChange={e=>updateLead(l,'lead_status',e.target.value)} value={l.lead_status||''} className={`p-2.5 border-2 rounded-xl font-black uppercase text-[9px] outline-none cursor-pointer ${getStatusStyles(l.lead_status)}`}>
                                                        {(!l.lead_status||l.lead_status==='Un called') && <option value="Un called">🔵 Un called</option>}
                                                        <option value="Called">✅ Called</option><option value="RNR">🔔 RNR</option><option value="Details Shared">📤 Details</option><option value="SV Scheduled">📅 SV</option><option value="SV Done">✅ SV Done</option><option value="Converted">🏆 Converted</option><option value="Rejected">❌ Rejected</option>
                                                    </select>
                                                </div>
                                                <div className="flex flex-col gap-1">
                                                    <label className="text-[8px] font-black text-slate-400 uppercase">Priority</label>
                                                    <select onChange={e=>updateLead(l,'lead_priority',e.target.value)} value={l.lead_priority||'Warm'} className={`p-2.5 border-2 rounded-xl font-black uppercase text-[9px] outline-none cursor-pointer ${getPriorityColor(l.lead_priority)}`}>
                                                        <option value="Hot">🔥 Hot</option><option value="Warm">🌤 Warm</option><option value="Cold">❄️ Cold</option>
                                                    </select>
                                                </div>
                                                {l.lead_status==='Rejected' && (
                                                    <div className="flex flex-col gap-1 col-span-2 mt-1">
                                                        <label className="text-[8px] font-black text-red-600 uppercase">Reject Reason</label>
                                                        <select onChange={e=>updateLead(l,'reject_reason',e.target.value)} value={l.reject_reason||''} className="p-2.5 border-2 border-red-300 bg-red-50 text-red-800 rounded-xl font-black uppercase text-[9px] outline-none cursor-pointer">
                                                            <option value="" disabled>Select Reason</option>
                                                            <option>Not Interested</option><option>No Response</option><option>Wrong Number</option><option>No Incoming Call</option>
                                                        </select>
                                                    </div>
                                                )}
                                            </div>
                                            {['Called','RNR','Details Shared'].includes(l.lead_status) && (
                                                <div className="flex flex-col gap-1 mt-2">
                                                    <label className="text-[8px] font-black text-blue-600 uppercase">📅 Callback Date</label>
                                                    <input type="datetime-local" className="p-2.5 border-2 border-blue-200 bg-blue-50 rounded-xl text-[10px] font-bold outline-none focus:border-blue-400" value={l.follow_up_at?.slice(0,16)||''} onChange={e=>updateLead(l,'follow_up_at',e.target.value)} />
                                                </div>
                                            )}
                                            {l.lead_status==='SV Scheduled' && (
                                                <div className="flex flex-col gap-1 mt-2">
                                                    <label className="text-[8px] font-black text-teal-600 uppercase">📍 Site Visit Date</label>
                                                    <input type="date" className="p-2.5 border-2 border-teal-200 bg-teal-50 rounded-xl text-[10px] font-bold outline-none focus:border-teal-400" value={l.site_visit_at||''} onChange={e=>updateLead(l,'site_visit_at',e.target.value)} />
                                                </div>
                                            )}
                                            {l.lead_status==='SV Done' && (
                                                <div className="flex flex-col gap-1 mt-2">
                                                    <label className="text-[8px] font-black text-cyan-600 uppercase">✅ SV Done On</label>
                                                    <input type="date" className="p-2.5 border-2 border-cyan-200 bg-cyan-50 rounded-xl text-[10px] font-bold outline-none focus:border-cyan-400" value={l.site_visit_done_at||''} onChange={e=>updateLead(l,'site_visit_done_at',e.target.value)} />
                                                </div>
                                            )}
                                            <div className="mt-3 pt-3 border-t border-slate-100">
                                                <div className="bg-slate-900/5 p-2.5 rounded-xl h-14 overflow-y-auto text-[9px] font-medium whitespace-pre-wrap history-scroll border border-slate-200 leading-relaxed text-slate-500 mb-2">
                                                    {l.call_remark||<span className="italic text-slate-400">No activity yet...</span>}
                                                </div>
                                                <NoteCellMobile lead={l} onSave={updateLead} />
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            ))}
                            {!loading && visibleCount<displayedLeads.length && (
                                <button onClick={()=>setVisibleCount(v=>v+50)} className="w-full bg-white hover:bg-blue-50 text-blue-700 py-4 rounded-2xl text-[10px] font-black uppercase tracking-widest transition border-2 border-blue-200 hover:border-blue-400 shadow-sm">
                                    Load More ({displayedLeads.length-visibleCount} remaining)
                                </button>
                            )}
                        </div>
                    </div>
                )}

                {view==='library' && (
                    <ProjectLibrary supabase={supabase} setProp={setSelectedProp} properties={properties} setProperties={setProperties} onEdit={p=>{setEditingProp(p);handleNavigate('add');}} />
                )}
                {view==='add' && <PropertyForm supabase={supabase} editingProp={editingProp} setView={handleNavigate} />}
            </main>

            {/* Manual Lead Modal */}
            {showManualModal && (
                <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-[100] flex items-end md:items-center justify-center p-0 md:p-4" onClick={e=>e.target===e.currentTarget&&setShowManualModal(false)}>
                    <div className="bg-white rounded-t-[32px] md:rounded-[28px] w-full max-w-md shadow-2xl animate-slideUp overflow-hidden">
                        <div className="px-6 pt-5 pb-4 border-b border-slate-100">
                            <div className="w-10 h-1 bg-slate-200 rounded-full mx-auto mb-5 md:hidden"></div>
                            <div className="flex justify-between items-center">
                                <div><h2 className="text-lg font-black uppercase text-slate-900">Manual Lead Entry</h2><p className="text-[9px] font-bold uppercase text-slate-400 mt-0.5">Inject directly into CRM</p></div>
                                <button onClick={()=>setShowManualModal(false)} className="w-8 h-8 flex items-center justify-center rounded-full bg-slate-100 text-slate-500 hover:bg-slate-200 text-sm font-black transition">✕</button>
                            </div>
                        </div>
                        <div className="px-6 py-5 max-h-[75vh] overflow-y-auto">
                            <ManualLeadForm properties={properties} supabase={supabase} agentName={agentName} onSuccess={()=>{setShowManualModal(false);fetchLeads();}} />
                        </div>
                    </div>
                </div>
            )}
        </div>
    );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<AdminApp />);
window.__appMounted = true;
setTimeout(function(){ if (window.__dismissSplash) window.__dismissSplash(); }, 4000);
</script>
</body>
</html>
