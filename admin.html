                                            <div className="absolute inset-0 bg-gradient-to-t from-slate-900/80 via-transparent to-transparent flex flex-col justify-end p-6 md:p-10">
                                                <div className="text-[10px] font-black uppercase tracking-widest text-blue-400 mb-1">{getVal(property, "Property Type") || 'Apartment'}</div>
                                                <h1 className="text-3xl md:text-5xl font-black uppercase tracking-tighter leading-none text-white mb-2">{getVal(property, "Property Name")}</h1>
                                                <p className="text-white/80 font-medium text-sm md:text-base">📍 {getVal(property, "Location")}</p>
                                            </div>
                                        )}
                                    </div>
                                )) : (
                                    <div className="w-full h-full bg-slate-200 rounded-3xl flex flex-col items-center justify-center text-slate-400">
                                        <h1 className="text-3xl md:text-5xl font-black uppercase tracking-tighter leading-none text-slate-500 mb-2">{getVal(property, "Property Name")}</h1>
                                        <p className="text-sm font-bold uppercase tracking-widest">Images Coming Soon</p>
                                    </div>
                                )}
                            </div>
                            {allImgs.length > 1 && (
                                <>
                                    <button onClick={() => scrollGallery('left')} className="hidden md:flex absolute top-1/2 -left-4 -translate-y-1/2 w-10 h-10 bg-white/90 backdrop-blur rounded-full items-center justify-center shadow-lg text-slate-800 hover:bg-white transition hover:scale-110 z-10 border border-slate-100">←</button>
                                    <button onClick={() => scrollGallery('right')} className="hidden md:flex absolute top-1/2 -right-4 -translate-y-1/2 w-10 h-10 bg-white/90 backdrop-blur rounded-full items-center justify-center shadow-lg text-slate-800 hover:bg-white transition hover:scale-110 z-10 border border-slate-100">→</button>
                                    <div className="md:hidden text-center text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mt-2 animate-pulse">Swipe for more images →</div>
                                </>
                            )}
                        </div>

                        {/* Main Content */}
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-8 md:gap-12">
                            <div className="lg:col-span-2 space-y-10">
                                <div className="bg-white p-6 md:p-8 rounded-3xl border border-slate-200 shadow-sm grid grid-cols-2 md:grid-cols-4 gap-6 relative">
                                    <div><div className="text-[10px] font-black uppercase text-slate-400 tracking-widest mb-1">Configurations</div><div className="text-sm md:text-lg font-black text-slate-900 mt-1">{getVal(property, "bhk") || getVal(property, "No of BHK's")} BHK</div></div>
                                    <div><div className="text-[10px] font-black uppercase text-slate-400 tracking-widest mb-1">Status</div><div className="text-sm md:text-base font-black text-slate-900 mt-1">{getVal(property, "Construction Status") || getVal(property, "construction_sta") || 'N/A'}</div></div>
                                    <div><div className="text-[10px] font-black uppercase text-slate-400 tracking-widest mb-1">Possession</div><div className="text-sm md:text-base font-black text-slate-900 mt-1">{getVal(property, "Possession Date") ? new Date(getVal(property, "Possession Date")).toLocaleDateString('en-IN', {month: 'short', year: 'numeric'}) : 'On Request'}</div></div>
                                    <div><div className="text-[10px] font-black uppercase text-slate-400 tracking-widest mb-1">RERA Status</div><div className="text-sm md:text-base font-black text-green-600 mt-1">Verified ✓</div></div>
                                </div>

                                <div>
                                    <h2 className="text-xl md:text-2xl font-black uppercase tracking-tighter text-slate-900 mb-4 border-b border-slate-200 pb-2">About The Project</h2>
                                    <p className="text-slate-600 text-sm md:text-base leading-relaxed whitespace-pre-wrap">
                                        {getVal(property, "description") || `Experience unparalleled luxury and comfort at ${getVal(property, "Property Name")}. Located in the prime neighborhood of ${getVal(property, "Location")}, this project by ${getVal(property, "Builder Name")} offers meticulously designed ${getVal(property, "bhk") || "premium"} homes.`}
                                    </p>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                    {projectUsps && (
                                        <div className="bg-blue-50 p-6 md:p-8 rounded-3xl border border-blue-100">
                                            <h3 className="text-sm font-black uppercase tracking-widest text-blue-900 mb-6">Key Highlights</h3>
                                            <ul className="space-y-4">
                                                {String(projectUsps).split('\n').filter(u => u.trim() !== "").map((u, i) => (
                                                    <li key={i} className="flex items-start text-xs md:text-sm text-blue-800 font-medium leading-relaxed"><span className="mr-3 text-blue-500 mt-0.5">✦</span> {u.trim()}</li>
                                                ))}
                                            </ul>
                                        </div>
                                    )}
                                    {getVal(property, "Amenities") && (
                                        <div className="bg-slate-900 p-6 md:p-8 rounded-3xl border border-slate-800">
                                            <h3 className="text-sm font-black uppercase tracking-widest text-white mb-6">World-Class Amenities</h3>
                                            <ul className="space-y-4">
                                                {String(getVal(property, "Amenities")).split(',').filter(u => u.trim() !== "").map((u, i) => (
                                                    <li key={i} className="flex items-start text-xs md:text-sm text-slate-300 font-medium leading-relaxed"><span className="mr-3 text-blue-400 mt-0.5">✓</span> {u.trim()}</li>
                                                ))}
                                            </ul>
                                        </div>
                                    )}
                                </div>
                            </div>

                            <div className="lg:col-span-1">
                                <div className="sticky top-24 space-y-6">
                                    <div className="bg-white p-6 md:p-8 rounded-3xl border border-slate-200 shadow-[0_4px_20px_-4px_rgba(0,0,0,0.1)]">
                                        <div className="mb-6 pb-6 border-b border-slate-100">
                                            <div className="text-[10px] font-black uppercase text-slate-400 tracking-widest mb-1">Starting Price</div>
                                            <div className="text-3xl md:text-4xl font-black text-slate-900 tracking-tighter">{getVal(property, "Price") || 'On Request'}</div>
                                        </div>
                                        
                                        <div className="bg-[#fffbeb] border border-[#fde68a] p-4 rounded-2xl text-[#92400e] mb-4">
                                            <h4 className="text-[9px] font-black uppercase tracking-widest mb-1 opacity-80">Commission</h4>
                                            <p className="text-2xl font-black">{formatPercent(getVal(property, "commision_deta") || getVal(property, "commission"))}</p>
                                        </div>

                                        <div className="bg-[#f0f9ff] border border-[#bae6fd] p-4 rounded-2xl text-[#0369a1] mb-6">
                                            <h4 className="text-[9px] font-black uppercase tracking-widest mb-1 opacity-80">Internal Info</h4>
                                            <p className="text-[10px] font-bold mb-1">POC: {getVal(property, "point_of_contact") || "N/A"}</p>
                                            <p className="text-[10px] font-bold">Avail: {getVal(property, "availability") || "N/A"}</p>
                                        </div>

                                        <div className="space-y-3">
                                            <button onClick={() => openLink(getVal(property, "website_link"))} className="w-full bg-slate-100 text-slate-700 font-black py-3 rounded-xl uppercase tracking-widest hover:bg-slate-200 transition-colors shadow-sm text-[10px] border border-slate-200">
                                                🌐 Builder Website
                                            </button>
                                            <button onClick={() => openLink(getVal(property, "lead_registration") || getVal(property, "lead_registration_link_or_email_id"))} className="w-full bg-slate-900 text-white font-black py-3 rounded-xl uppercase tracking-widest hover:bg-blue-600 transition-colors shadow-md text-[10px]">
                                                📝 Register Lead
                                            </button>
                                        </div>
                                    </div>
                                    
                                    <div className="grid grid-cols-2 gap-3">
                                        <button onClick={() => openLink(getVal(property, "brochure"))} className="bg-white border border-slate-200 text-slate-800 font-black py-3 rounded-xl uppercase tracking-widest hover:bg-slate-50 transition-colors shadow-sm text-[9px] flex flex-col items-center gap-1"><span className="text-lg">📥</span> Brochure</button>
                                        <button onClick={() => openLink(getVal(property, "cost_sheet"))} className="bg-white border border-slate-200 text-slate-800 font-black py-3 rounded-xl uppercase tracking-widest hover:bg-slate-50 transition-colors shadow-sm text-[9px] flex flex-col items-center gap-1"><span className="text-lg">📄</span> Cost Sheet</button>
                                        <button onClick={() => openLink(getVal(property, "map_link"))} className="bg-white border border-slate-200 text-slate-800 font-black py-3 rounded-xl uppercase tracking-widest hover:bg-slate-50 transition-colors shadow-sm text-[9px] flex flex-col items-center gap-1 col-span-2"><span className="text-lg">📍</span> Location Map</button>
                                    </div>

                                    <EMICalculator propertyPriceStr={getVal(property, "Price")} />
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- UPDATED PROPERTY FORM ---
        function PropertyForm({ scriptUrl, supabase }) {
            const [form, setForm] = useState({
                property_name: '', builder_name: '', location: '', price: '', bhk: '', 
                super_built_up_a: '', possession_date: '', construction_sta: '',
                amenities: '', brochure: '', cover_image: '', gallery_images: '', floor_plan: '', video_link: '', usp_details: '',
                commision_deta: '', point_of_contact: '', website_link: '', map_link: '',
                lead_registration: '', cost_sheet: '', property_type: '', total_units: '', availability: ''
            });

            async function upload(e, field, append = false) {
                const file = e.target.files[0];
                if(!file) return;
                
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = async () => {
                    const res = await fetch(scriptUrl, { method: "POST", body: JSON.stringify({ base64: reader.result.split(',')[1], type: file.type, name: file.name, propertyName: form.property_name || 'Uploads' }) });
                    const result = await res.json();
                    if(result.status === "success") {
                        if(append) {
                            setForm(f => ({ ...f, [field]: f[field] ? f[field] + ',' + result.url : result.url }));
                        } else {
                            setForm(f => ({ ...f, [field]: result.url }));
                        }
                    }
                };
            }

            async function save() {
                const { error } = await supabase.from('properties').insert([form]);
                if (!error) {
                    alert("Listing Live!");
                    setForm({ property_name: '', builder_name: '', location: '', price: '', bhk: '', super_built_up_a: '', possession_date: '', construction_sta: '', amenities: '', brochure: '', cover_image: '', gallery_images: '', floor_plan: '', video_link: '', usp_details: '', commision_deta: '', point_of_contact: '', website_link: '', map_link: '', lead_registration: '', cost_sheet: '', property_type: '', total_units: '', availability: ''});
                } else alert(error.message);
            }

            return (
                <div className="bg-white p-6 md:p-10 rounded-3xl shadow-sm max-w-4xl mx-auto space-y-6 animate-fadeIn border border-slate-200">
                    <h2 className="text-2xl font-black uppercase italic border-b pb-4 text-blue-900">Master Property Form</h2>
                    
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <input placeholder="Property Name" className="p-4 bg-slate-50 border rounded-xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500" onChange={e => setForm({...form, property_name: e.target.value})} value={form.property_name}/>
                        <input placeholder="Builder Name" className="p-4 bg-slate-50 border rounded-xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500" onChange={e => setForm({...form, builder_name: e.target.value})} value={form.builder_name}/>
                        <select className="p-4 bg-slate-50 border rounded-xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500" onChange={e => setForm({...form, property_type: e.target.value})} value={form.property_type}>
                            <option value="">Property Type</option><option>Apartment</option><option>Villa</option><option>Plot</option>
                        </select>
                        <input placeholder="Location" className="p-4 bg-slate-50 border rounded-xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500" onChange={e => setForm({...form, location: e.target.value})} value={form.location}/>
                        <input placeholder="Price (e.g. 1.2 Cr)" className="p-4 bg-slate-50 border rounded-xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500" onChange={e => setForm({...form, price: e.target.value})} value={form.price}/>
                        <input placeholder="BHK (e.g. 2, 3 BHK)" className="p-4 bg-slate-50 border rounded-xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500" onChange={e => setForm({...form, bhk: e.target.value})} value={form.bhk}/>
                        <input placeholder="Area (e.g. 1200 SqFt)" className="p-4 bg-slate-50 border rounded-xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500" onChange={e => setForm({...form, super_built_up_a: e.target.value})} value={form.super_built_up_a}/>
                        <input type="date" className="p-4 bg-slate-50 border rounded-xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500" onChange={e => setForm({...form, possession_date: e.target.value})} value={form.possession_date}/>
                        <select className="p-4 bg-slate-50 border rounded-xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500" onChange={e => setForm({...form, construction_sta: e.target.value})} value={form.construction_sta}>
                            <option value="">Status</option><option>Ready to Move</option><option>Under Construction</option><option>New Launch</option>
                        </select>
                        <input placeholder="Total Units" className="p-4 bg-slate-50 border rounded-xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500" onChange={e => setForm({...form, total_units: e.target.value})} value={form.total_units}/>
                        <input placeholder="Availability" className="p-4 bg-slate-50 border rounded-xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500" onChange={e => setForm({...form, availability: e.target.value})} value={form.availability}/>
                        <input placeholder="Video URL (Drive/YouTube)" className="p-4 bg-slate-50 border rounded-xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500" onChange={e => setForm({...form, video_link: e.target.value})} value={form.video_link}/>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <textarea placeholder="USPs (Line by Line)" rows="3" className="p-4 bg-slate-50 border rounded-xl font-bold text-sm resize-none outline-none focus:ring-2 focus:ring-blue-500" onChange={e => setForm({...form, usp_details: e.target.value})} value={form.usp_details}/>
                        <textarea placeholder="Amenities (Comma separated)" rows="3" className="p-4 bg-slate-50 border rounded-xl font-bold text-sm resize-none outline-none focus:ring-2 focus:ring-blue-500" onChange={e => setForm({...form, amenities: e.target.value})} value={form.amenities}/>
                    </div>

                    <div className="p-6 bg-slate-900 rounded-2xl grid grid-cols-1 md:grid-cols-2 gap-4 border-t-4 border-blue-500">
                        <h3 className="col-span-1 md:col-span-2 text-[10px] font-black text-blue-400 uppercase tracking-widest">Admin Backend Links & Data</h3>
                        <input placeholder="Commission %" className="p-4 bg-slate-800 text-white border border-slate-700 rounded-xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-400" onChange={e => setForm({...form, commision_deta: e.target.value})} value={form.commision_deta}/>
                        <input placeholder="POC (Name / Number)" className="p-4 bg-slate-800 text-white border border-slate-700 rounded-xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-400" onChange={e => setForm({...form, point_of_contact: e.target.value})} value={form.point_of_contact}/>
                        <input placeholder="Builder Website Link" className="p-4 bg-slate-800 text-white border border-slate-700 rounded-xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-400" onChange={e => setForm({...form, website_link: e.target.value})} value={form.website_link}/>
                        <input placeholder="Lead Register Link / Email" className="p-4 bg-slate-800 text-white border border-slate-700 rounded-xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-400" onChange={e => setForm({...form, lead_registration: e.target.value})} value={form.lead_registration}/>
                        <input placeholder="Map Link (Google Maps URL)" className="p-4 bg-slate-800 text-white border border-slate-700 rounded-xl font-bold text-sm md:col-span-2 outline-none focus:ring-2 focus:ring-blue-400" onChange={e => setForm({...form, map_link: e.target.value})} value={form.map_link}/>
                    </div>
                    
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 pt-6 border-t border-slate-100">
                        <div>
                            <label className="text-[10px] font-black uppercase mb-2 block text-slate-500 tracking-widest">Cover Image</label>
                            <input type="file" onChange={e => upload(e, 'cover_image')} className="text-xs text-slate-600 mb-2"/>
                        </div>
                        <div>
                            <label className="text-[10px] font-black uppercase mb-2 block text-slate-500 tracking-widest">Gallery Images (Upload one by one)</label>
                            <input type="file" onChange={e => upload(e, 'gallery_images', true)} className="text-xs text-slate-600"/>
                            <p className="text-[9px] text-blue-500 font-bold mt-1">Uploaded: {form.gallery_images ? form.gallery_images.split(',').length : 0}</p>
                        </div>
                        <div>
                            <label className="text-[10px] font-black uppercase mb-2 block text-slate-500 tracking-widest">Brochure (PDF)</label>
                            <input type="file" onChange={e => upload(e, 'brochure')} className="text-xs text-slate-600"/>
                        </div>
                        <div>
                            <label className="text-[10px] font-black uppercase mb-2 block text-slate-500 tracking-widest">Cost Sheet (PDF)</label>
                            <input type="file" onChange={e => upload(e, 'cost_sheet')} className="text-xs text-slate-600"/>
                        </div>
                        <div>
                            <label className="text-[10px] font-black uppercase mb-2 block text-slate-500 tracking-widest">Floor Plan (PDF/Img)</label>
                            <input type="file" onChange={e => upload(e, 'floor_plan')} className="text-xs text-slate-600"/>
                        </div>
                    </div>
                    
                    <button onClick={save} className="w-full bg-blue-600 text-white p-5 rounded-2xl font-black uppercase tracking-widest hover:bg-blue-700 shadow-xl transition mt-4">Publish Property</button>
                </div>
            );
        }

        // --- MISC COMPONENTS ---
        function ManualLeadForm({ supabase, onSuccess }) {
            const [form, setForm] = useState({ name: '', phone: '', email: '', project: '', reqs: '', source: 'Manual' });
            const [loading, setLoading] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);
                const stamp = new Date().toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute:'2-digit' });
                const remarks = form.reqs ? `[${stamp}] Note: ${form.reqs}` : null;

                const { error } = await supabase.from('leads').insert([{ 
                    customer_name: form.name, 
                    phone_number: form.phone, 
                    customer_email: form.email || null,
                    project_interested_in: form.project,
                    call_remark: remarks,
                    lead_source: form.source, 
                    lead_status: 'Un called' 
                }]);

                if (!error) onSuccess();
                else alert(error.message);
                setLoading(false);
            };

            return (
                <form onSubmit={handleSubmit} className="space-y-4">
                    <input placeholder="Client Name *" required className="w-full p-4 bg-slate-50 border rounded-2xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500" onChange={e => setForm({...form, name: e.target.value})} />
                    <input placeholder="Phone Number *" required className="w-full p-4 bg-slate-50 border rounded-2xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500" onChange={e => setForm({...form, phone: e.target.value})} />
                    <input type="email" placeholder="Email ID (Optional)" className="w-full p-4 bg-slate-50 border rounded-2xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500" onChange={e => setForm({...form, email: e.target.value})} />
                    <input placeholder="Interested Project" className="w-full p-4 bg-slate-50 border rounded-2xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500" onChange={e => setForm({...form, project: e.target.value})} />
                    <textarea placeholder="Customer Requirements / Details..." rows="3" className="w-full p-4 bg-slate-50 border rounded-2xl font-bold text-sm resize-none outline-none focus:ring-2 focus:ring-blue-500" onChange={e => setForm({...form, reqs: e.target.value})}></textarea>
                    
                    <select className="w-full p-4 bg-slate-50 border rounded-2xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500" onChange={e => setForm({...form, source: e.target.value})} value={form.source}>
                        <option>Manual</option><option>Walk-in</option><option>Referral</option><option>MagicBricks</option><option>Housing.com</option>
                    </select>
                    <button disabled={loading} className="w-full bg-blue-600 text-white p-4 rounded-2xl font-black uppercase tracking-widest hover:bg-blue-700 shadow-md transition disabled:opacity-50">
                        {loading ? "Injecting..." : "Inject Lead"}
                    </button>
                </form>
            );
        }

        function LoginForm({ supabase }) {
            const [email, setEmail] = useState("");
            const [pass, setPass] = useState("");
            const [loading, setLoading] = useState(false);
            const [errorMsg, setErrorMsg] = useState("");

            const handleLogin = async (e) => {
                e.preventDefault();
                setLoading(true);
                setErrorMsg("");
                const { error } = await supabase.auth.signInWithPassword({ email, password: pass });
                if (error) setErrorMsg(error.message);
                setLoading(false);
            };

            return (
                <div className="min-h-screen bg-slate-950 flex items-center justify-center p-4">
                    <form onSubmit={handleLogin} className="bg-white p-10 rounded-[40px] shadow-2xl w-full max-w-sm text-center border-t-8 border-blue-500 relative">
                        <h1 className="text-3xl font-black italic uppercase mb-8">Horizon CRM</h1>
                        {errorMsg && <div className="text-red-500 text-xs font-bold mb-4">{errorMsg}</div>}
                        <input type="email" required placeholder="Email" className="w-full p-4 bg-slate-100 rounded-2xl mb-4 font-bold outline-none" onChange={e => setEmail(e.target.value)} />
                        <input type="password" required placeholder="Password" className="w-full p-4 bg-slate-100 rounded-2xl mb-8 font-bold outline-none" onChange={e => setPass(e.target.value)} />
                        <button disabled={loading} type="submit" className="w-full bg-blue-600 text-white font-black py-4 rounded-2xl uppercase tracking-widest shadow-lg disabled:opacity-50 hover:bg-blue-700">
                            {loading ? "Authenticating..." : "Login"}
                        </button>
                    </form>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AdminApp />);
    </script>
</body>
</html>
