<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizon CRM | Command Center</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .animate-fadeIn { animation: fadeIn 0.15s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .history-scroll::-webkit-scrollbar { width: 4px; }
        .history-scroll::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
        
        input[type=range] { -webkit-appearance: none; background: transparent; width: 100%; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 18px; width: 18px; background: #2563eb; cursor: pointer; margin-top: -7px; border-radius: 50%; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: #cbd5e1; border-radius: 2px; }
        .pie-chart { border-radius: 50%; display: inline-block; }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-900 pb-20 md:pb-0">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- SUPABASE CONFIG ---
        const supabaseUrl = 'https://uiiovtsktllvtecfokik.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVpaW92dHNrdGxsdnRlY2Zva2lrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM5NjkxMjMsImV4cCI6MjA4OTU0NTEyM30.fL6cU7YkH4-50w55GrnutoBhmH5sofe8-rOMZetmuvU';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey, { auth: { storage: window.sessionStorage } });
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxJOoh4meGBQOZYZpUWqK1DmDS_B8fXSC5NlwPcTX3GUfP7gzYQKvatgj9IFT3Txy-FCQ/exec";
        const WHATSAPP_NUMBER = "919742353260";

        // --- GLOBAL FORMATTING TOOLS (PREVENTS CRASHES) ---
        const getVal = (obj, searchKey) => {
            if (!obj) return "";
            if (obj[searchKey] !== undefined && obj[searchKey] !== "") return obj[searchKey];
            const cleanKey = searchKey.replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
            for (let k in obj) { if (k.replace(/[^a-zA-Z0-9]/g, '').toLowerCase() === cleanKey) return obj[k]; }
            return "";
        };

        const convertDriveLink = (url) => {
            if (!url || typeof url !== 'string') return url;
            let idMatch = url.match(/\/d\/(.*?)\//) || url.match(/id=(.*?)(&|$)/);
            return idMatch ? `https://drive.google.com/thumbnail?id=${idMatch[1]}&sz=w1000` : url;
        };

        const fixImageUrl = (u) => u ? convertDriveLink(u.split(',')[0].trim()) : 'https://via.placeholder.com/600x300?text=No+Image';

        const extractPriceInCr = (priceString) => {
            if (!priceString) return 0;
            try {
                const cleanStr = String(priceString).toLowerCase().replace(/,/g, '');
                const numMatch = cleanStr.match(/[0-9.]+/); 
                if (!numMatch) return 0;
                const val = parseFloat(numMatch[0]);
                if (isNaN(val)) return 0;
                if (cleanStr.includes('cr') || cleanStr.includes('crore')) return val;
                if (cleanStr.includes('lac') || cleanStr.includes('lakh')) return val / 100;
                if (val > 100000) return val / 10000000; 
                return 0; 
            } catch(e) { return 0; }
        };

        const formatIndianCurrencyCompact = (num) => {
            if (num >= 10000000) return '₹' + (num / 10000000).toFixed(2).replace(/\.00$/, '') + ' Cr';
            if (num >= 100000) return '₹' + (num / 100000).toFixed(2).replace(/\.00$/, '') + ' L';
            return new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(num);
        };

        const formatPercent = (val) => {
            let num = parseFloat(val);
            if (isNaN(num)) return String(val || "0%");
            return (num < 1 && num > 0) ? (num * 100).toFixed(1) + "%" : num + "%";
        };

        const getSafeLink = (rawLink) => {
            if (!rawLink) return "#";
            const link = String(rawLink).trim();
            if (link === "#") return "#";
            if (link.includes('@') && !link.startsWith('mailto:')) return `mailto:${link}`;
            if (!link.startsWith('http') && !link.includes('@')) return `https://${link}`;
            return link;
        };

        const getStatusStyles = (status) => {
            switch(status) {
                case 'Called': return 'bg-blue-100 text-blue-800 border-blue-300';
                case 'RNR': return 'bg-orange-100 text-orange-800 border-orange-300';
                case 'Details Shared': return 'bg-purple-100 text-purple-800 border-purple-300';
                case 'SV Scheduled': return 'bg-teal-100 text-teal-800 border-teal-300';
                case 'Converted': return 'bg-green-100 text-green-800 border-green-400';
                case 'Rejected': return 'bg-red-100 text-red-800 border-red-300';
                default: return 'bg-slate-50 text-slate-600 border-slate-200';
            }
        };

        const getPriorityColor = (priority) => {
            switch(priority) {
                case 'Hot': return 'bg-red-50 text-red-700 border-red-400';
                case 'Cold': return 'bg-blue-50 text-blue-700 border-blue-400';
                default: return 'bg-amber-50 text-amber-700 border-amber-400';
            }
        };

        // --- SHARED EMI CALCULATOR ---
        const EMICalculator = ({ propertyPriceStr }) => {
            const propertyValue = extractPriceInCr(propertyPriceStr) > 0 ? extractPriceInCr(propertyPriceStr) * 10000000 : 10000000; 
            const [loanAmount, setLoanAmount] = useState(propertyValue * 0.8);
            const [interestRate, setInterestRate] = useState(8.5);
            const [tenureYears, setTenureYears] = useState(20);

            const { emi, totalInterest, principalPct } = useMemo(() => {
                const p = loanAmount;
                const r = interestRate / 12 / 100;
                const n = tenureYears * 12;
                if (p === 0 || r === 0 || n === 0) return { emi: 0, totalInterest: 0, principalPct: 100 };
                
                const emiValue = (p * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
                const totalPay = emiValue * n;
                const totalInt = totalPay - p;
                const pct = (p / totalPay) * 100;

                return { emi: Math.round(emiValue), totalInterest: Math.round(totalInt), principalPct: pct.toFixed(1) };
            }, [loanAmount, interestRate, tenureYears]);

            return (
                <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm mt-6">
                    <h3 className="text-sm font-black uppercase tracking-widest text-slate-900 mb-6 flex items-center">
                        <span className="mr-2 text-xl">📊</span> EMI Calculator
                    </h3>
                    <div className="flex items-center gap-6 mb-8">
                        <div className="w-16 h-16 pie-chart shrink-0 shadow-inner" style={{ background: `conic-gradient(#2563eb ${principalPct}%, #e2e8f0 ${principalPct}% 100%)` }}></div>
                        <div className="flex flex-col gap-2 w-full">
                            <div className="flex justify-between items-center border-b border-slate-100 pb-1">
                                <div className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-blue-600"></span><span className="text-[9px] font-bold text-slate-500 uppercase tracking-widest">Principal</span></div>
                                <span className="text-[10px] font-black text-slate-900">{formatIndianCurrencyCompact(loanAmount)}</span>
                            </div>
                            <div className="flex justify-between items-center">
                                <div className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-slate-300"></span><span className="text-[9px] font-bold text-slate-500 uppercase tracking-widest">Interest</span></div>
                                <span className="text-[10px] font-black text-slate-900">{formatIndianCurrencyCompact(totalInterest)}</span>
                            </div>
                        </div>
                    </div>
                    <div className="space-y-5">
                        <div>
                            <div className="flex justify-between mb-2">
                                <label className="text-[10px] font-black uppercase text-slate-400 tracking-widest">Loan Amount</label>
                                <span className="text-xs font-black text-blue-600 bg-blue-50 px-2 py-0.5 rounded">{formatIndianCurrencyCompact(loanAmount)}</span>
                            </div>
                            <input type="range" min="1000000" max="50000000" step="100000" value={loanAmount} onChange={(e) => setLoanAmount(Number(e.target.value))} />
                        </div>
                        <div>
                            <div className="flex justify-between mb-2">
                                <label className="text-[10px] font-black uppercase text-slate-400 tracking-widest">Interest Rate</label>
                                <span className="text-xs font-black text-blue-600 bg-blue-50 px-2 py-0.5 rounded">{interestRate}%</span>
                            </div>
                            <input type="range" min="6" max="15" step="0.1" value={interestRate} onChange={(e) => setInterestRate(Number(e.target.value))} />
                        </div>
                        <div>
                            <div className="flex justify-between mb-2">
                                <label className="text-[10px] font-black uppercase text-slate-400 tracking-widest">Tenure</label>
                                <span className="text-xs font-black text-blue-600 bg-blue-50 px-2 py-0.5 rounded">{tenureYears} Yrs</span>
                            </div>
                            <input type="range" min="5" max="30" step="1" value={tenureYears} onChange={(e) => setTenureYears(Number(e.target.value))} />
                        </div>
                        <div className="pt-4 border-t border-slate-100 flex justify-between items-center">
                            <div>
                                <div className="text-[9px] font-black uppercase text-slate-400 tracking-widest mb-1">Estimated EMI</div>
                                <div className="text-xl font-black text-slate-900 tracking-tighter">{formatIndianCurrencyCompact(emi)} <span className="text-[10px] text-slate-400 font-bold tracking-normal uppercase">/mo</span></div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- FULL PAGE PROPERTY VIEW (ADMIN) ---
        const PropertyDetailsPage = ({ property, onBack }) => {
            const galleryRef = useRef(null);
            useEffect(() => { window.scrollTo(0, 0); }, [property]);

            const scrollGallery = (dir) => {
                if (galleryRef.current) {
                    const scrollAmount = galleryRef.current.clientWidth * 0.8;
                    galleryRef.current.scrollBy({ left: dir === 'right' ? scrollAmount : -scrollAmount, behavior: 'smooth' });
                }
            };

            const cover = fixImageUrl(getVal(property, "cover_image") || getVal(property, "cover-image"));
            const galRaw = getVal(property, "gallery_images") || getVal(property, "gallery-images") || "";
            const imgs = [cover, ...(typeof galRaw === 'string' ? galRaw.split(',').map(l => fixImageUrl(l.trim())) : [])].filter(i => i); 
            const projectUsps = getVal(property, "usp_details") || getVal(property, "usp_s") || getVal(property, "USP's");

            const openLink = (rawLink) => {
                if (!rawLink || rawLink.trim() === '') return alert("This link was not provided for this property.");
                window.open(getSafeLink(rawLink), '_blank');
            };

            return (
                <div className="min-h-screen bg-slate-50 animate-fadeIn pb-24 md:pb-0">
                    <div className="bg-white border-b border-slate-200 sticky top-0 z-40 px-4 md:px-8 py-4 flex justify-between items-center shadow-sm">
                        <button onClick={onBack} className="text-slate-600 hover:text-blue-600 text-xs font-black uppercase tracking-widest flex items-center transition group">
                            <span className="mr-2 text-lg leading-none group-hover:-translate-x-1 transition-transform">←</span> Back to Library
                        </button>
                        <div className="hidden md:flex items-center gap-4">
                            <div className="text-[10px] font-black uppercase tracking-widest text-slate-400 border-r border-slate-200 pr-4">
                                {getVal(property, "Location")} • {getVal(property, "Builder Name")}
                            </div>
                        </div>
                    </div>

                    <div className="max-w-7xl mx-auto w-full p-4 md:p-8">
                        {/* Scrollable Gallery */}
                        <div className="relative mb-8">
                            <div ref={galleryRef} className="flex overflow-x-auto snap-x snap-mandatory gap-4 pb-4 hide-scroll h-[40vh] md:h-[60vh] rounded-3xl">
                                {imgs.length > 0 ? imgs.map((img, i) => (
                                    <div key={i} className="min-w-full md:min-w-[80%] h-full shrink-0 snap-center relative rounded-3xl overflow-hidden bg-slate-200 border border-slate-100">
                                        <img src={img} className="w-full h-full object-cover" />
                                        {i === 0 && (
                                            <div className="absolute inset-0 bg-gradient-to-t from-slate-900/80 via-transparent to-transparent flex flex-col justify-end p-6 md:p-10">
                                                <div className="text-[10px] font-black uppercase tracking-widest text-blue-400 mb-1">{getVal(property, "Property Type") || 'Apartment'}</div>
                                                <h1 className="text-3xl md:text-5xl font-black uppercase tracking-tighter leading-none text-white mb-2">{getVal(property, "Property Name")}</h1>
                                                <p className="text-white/80 font-medium text-sm md:text-base">📍 {getVal(property, "Location")}</p>
                                            </div>
                                        )}
                                    </div>
                                )) : (
                                    <div className="w-full h-full bg-slate-200 rounded-3xl flex flex-col items-center justify-center text-slate-400">
                                        <h1 className="text-3xl md:text-5xl font-black uppercase tracking-tighter leading-none text-slate-500 mb-2">{getVal(property, "Property Name")}</h1>
                                        <p className="text-sm font-bold uppercase tracking-widest">Images Coming Soon</p>
                                    </div>
                                )}
                            </div>
                            {imgs.length > 1 && (
                                <>
                                    <button onClick={() => scrollGallery('left')} className="hidden md:flex absolute top-1/2 -left-4 -translate-y-1/2 w-10 h-10 bg-white/90 backdrop-blur rounded-full items-center justify-center shadow-lg text-slate-800 hover:bg-white transition hover:scale-110 z-10 border border-slate-100">←</button>
                                    <button onClick={() => scrollGallery('right')} className="hidden md:flex absolute top-1/2 -right-4 -translate-y-1/2 w-10 h-10 bg-white/90 backdrop-blur rounded-full items-center justify-center shadow-lg text-slate-800 hover:bg-white transition hover:scale-110 z-10 border border-slate-100">→</button>
                                    <div className="md:hidden text-center text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mt-2 animate-pulse">Swipe for more images →</div>
                                </>
                            )}
                        </div>

                        {/* Main Content */}
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-8 md:gap-12">
                            <div className="lg:col-span-2 space-y-10">
                                <div className="bg-white p-6 md:p-8 rounded-3xl border border-slate-200 shadow-sm grid grid-cols-2 md:grid-cols-4 gap-6 relative">
                                    <div><div className="text-[10px] font-black uppercase text-slate-400 tracking-widest mb-1">Configurations</div><div className="text-sm md:text-lg font-black text-slate-900 mt-1">{getVal(property, "bhk") || getVal(property, "No of BHK's")} BHK</div></div>
                                    <div><div className="text-[10px] font-black uppercase text-slate-400 tracking-widest mb-1">Status</div><div className="text-sm md:text-base font-black text-slate-900 mt-1">{getVal(property, "Construction Status") || getVal(property, "construction_sta") || 'N/A'}</div></div>
                                    <div><div className="text-[10px] font-black uppercase text-slate-400 tracking-widest mb-1">Possession</div><div className="text-sm md:text-base font-black text-slate-900 mt-1">{getVal(property, "Possession Date") ? new Date(getVal(property, "Possession Date")).toLocaleDateString('en-IN', {month: 'short', year: 'numeric'}) : 'On Request'}</div></div>
                                    <div><div className="text-[10px] font-black uppercase text-slate-400 tracking-widest mb-1">RERA Status</div><div className="text-sm md:text-base font-black text-green-600 mt-1">Verified ✓</div></div>
                                </div>

                                <div>
                                    <h2 className="text-xl md:text-2xl font-black uppercase tracking-tighter text-slate-900 mb-4 border-b border-slate-200 pb-2">About The Project</h2>
                                    <p className="text-slate-600 text-sm md:text-base leading-relaxed whitespace-pre-wrap">
                                        {getVal(property, "description") || `Experience unparalleled luxury and comfort at ${getVal(property, "Property Name")}. Located in the prime neighborhood of ${getVal(property, "Location")}, this project by ${getVal(property, "Builder Name")} offers meticulously designed homes.`}
                                    </p>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                    {projectUsps && (
                                        <div className="bg-blue-50 p-6 md:p-8 rounded-3xl border border-blue-100">
                                            <h3 className="text-sm font-black uppercase tracking-widest text-blue-900 mb-6">Key Highlights</h3>
                                            <ul className="space-y-4">
                                                {String(projectUsps).split('\n').filter(u => u.trim() !== "").map((u, i) => (
                                                    <li key={i} className="flex items-start text-xs md:text-sm text-blue-800 font-medium leading-relaxed"><span className="mr-3 text-blue-500 mt-0.5">✦</span> {u.trim()}</li>
                                                ))}
                                            </ul>
                                        </div>
                                    )}
                                    {getVal(property, "Amenities") && (
                                        <div className="bg-slate-900 p-6 md:p-8 rounded-3xl border border-slate-800">
                                            <h3 className="text-sm font-black uppercase tracking-widest text-white mb-6">World-Class Amenities</h3>
                                            <ul className="space-y-4">
                                                {String(getVal(property, "Amenities")).split(',').filter(u => u.trim() !== "").map((u, i) => (
                                                    <li key={i} className="flex items-start text-xs md:text-sm text-slate-300 font-medium leading-relaxed"><span className="mr-3 text-blue-400 mt-0.5">✓</span> {u.trim()}</li>
                                                ))}
                                            </ul>
                                        </div>
                                    )}
                                </div>
                            </div>

                            {/* Sticky Sidebar */}
                            <div className="lg:col-span-1">
                                <div className="sticky top-24 space-y-6">
                                    <div className="bg-white p-6 md:p-8 rounded-3xl border border-slate-200 shadow-sm">
                                        <div className="mb-6 pb-6 border-b border-slate-100">
                                            <div className="text-[10px] font-black uppercase text-slate-400 tracking-widest mb-1">Starting Price</div>
                                            <div className="text-3xl md:text-4xl font-black text-slate-900 tracking-tighter">{getVal(property, "Price") || 'On Request'}</div>
                                        </div>
                                        
                                        <div className="bg-[#fffbeb] border border-[#fde68a] p-4 rounded-2xl text-[#92400e] mb-4">
                                            <h4 className="text-[9px] font-black uppercase tracking-widest mb-1 opacity-80">Commission</h4>
                                            <p className="text-2xl font-black">{formatPercent(getVal(property, "commision_deta") || getVal(property, "commission"))}</p>
                                        </div>

                                        <div className="bg-[#f0f9ff] border border-[#bae6fd] p-4 rounded-2xl text-[#0369a1] mb-6">
                                            <h4 className="text-[9px] font-black uppercase tracking-widest mb-1 opacity-80">Internal Info</h4>
                                            <p className="text-[10px] font-bold mb-1">POC: {getVal(property, "point_of_contact") || "N/A"}</p>
                                            <p className="text-[10px] font-bold">Avail: {getVal(property, "availability") || "N/A"}</p>
                                        </div>

                                        <div className="space-y-3">
                                            <button onClick={() => openLink(getVal(property, "website_link"))} className="w-full bg-slate-100 text-slate-700 font-black py-3 rounded-xl uppercase tracking-widest hover:bg-slate-200 transition-colors shadow-sm text-[10px] border border-slate-200">
                                                🌐 Builder Website
                                            </button>
                                            <button onClick={() => openLink(getVal(property, "lead_registration") || getVal(property, "lead_registration_link_or_email_id"))} className="w-full bg-slate-900 text-white font-black py-3 rounded-xl uppercase tracking-widest hover:bg-blue-600 transition-colors shadow-md text-[10px]">
                                                📝 Register Lead
                                            </button>
                                        </div>
                                    </div>
                                    
                                    <div className="grid grid-cols-2 gap-3">
                                        <button onClick={() => openLink(getVal(property, "brochure"))} className="bg-white border border-slate-200 text-slate-800 font-black py-3 rounded-xl uppercase tracking-widest hover:bg-slate-50 transition-colors shadow-sm text-[9px] flex flex-col items-center gap-1"><span className="text-lg">📥</span> Brochure</button>
                                        <button onClick={() => openLink(getVal(property, "cost_sheet"))} className="bg-white border border-slate-200 text-slate-800 font-black py-3 rounded-xl uppercase tracking-widest hover:bg-slate-50 transition-colors shadow-sm text-[9px] flex flex-col items-center gap-1"><span className="text-lg">📄</span> Cost Sheet</button>
                                        <button onClick={() => openLink(getVal(property, "map_link"))} className="bg-white border border-slate-200 text-slate-800 font-black py-3 rounded-xl uppercase tracking-widest hover:bg-slate-50 transition-colors shadow-sm text-[9px] flex flex-col items-center gap-1 col-span-2"><span className="text-lg">📍</span> Location Map</button>
                                    </div>

                                    <EMICalculator propertyPriceStr={getVal(property, "Price")} />
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- MAIN APP COMPONENT ---
        function AdminApp() {
            const [session, setSession] = useState(null);
            const [authChecking, setAuthChecking] = useState(true);
            const [leads, setLeads] = useState([]);
            const [properties, setProperties] = useState([]);
            const [view, setView] = useState('dashboard'); 
            const [leadCategory, setLeadCategory] = useState('website'); 
            const [loading, setLoading] = useState(true);
            const [showManualModal, setShowManualModal] = useState(false);
            const [showTodayOnly, setShowTodayOnly] = useState(false);
            const [selectedProp, setSelectedProp] = useState(null);

            useEffect(() => {
                // Prevent the "Flash" of login screen
                supabase.auth.getSession().then(({ data: { session } }) => { 
                    setSession(session); 
                    setAuthChecking(false);
                    if (session) { fetchLeads(); fetchProperties(); } 
                });
                
                const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => { 
                    setSession(session); 
                    if (session) { fetchLeads(); fetchProperties(); } 
                });
                
                return () => subscription.unsubscribe();
            }, []);

            useEffect(() => {
                if(session) fetchLeads();
            }, [leadCategory]);

            async function fetchLeads() {
                setLoading(true);
                const table = leadCategory === 'bulk' ? 'bulk_leads' : 'leads';
                const { data, error } = await supabase.from(table).select('*').order('created_at', { ascending: false });
                if (!error) {
                    let raw = data || [];
                    if (table === 'leads') {
                        setLeads(leadCategory === 'website' 
                            ? raw.filter(l => !l.lead_source || l.lead_source.trim() === '' || l.lead_source.toLowerCase() === 'website')
                            : raw.filter(l => l.lead_source && l.lead_source.trim() !== '' && l.lead_source.toLowerCase() !== 'website'));
                    } else { setLeads(raw); }
                }
                setLoading(false);
            }

            async function fetchProperties() {
                const { data } = await supabase.from('properties').select('*').order('created_at', { ascending: false });
                setProperties(data || []);
            }

            async function updateLead(lead, field, value) {
                let updates = {};
                const stamp = new Date().toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute:'2-digit' });

                if (field === 'add_note') {
                    if (!value.trim()) return;
                    updates.call_remark = `[${stamp}] Note: ${value}\n\n${lead.call_remark || ''}`;
                } else if (field === 'lead_status') {
                    updates.lead_status = value;
                    updates.call_remark = `[${stamp}] Status Changed: ${value}\n\n${lead.call_remark || ''}`;
                } else if (field === 'follow_up_at') {
                    updates.follow_up_at = value;
                    updates.call_remark = `[${stamp}] Callback Set: ${new Date(value).toLocaleString('en-IN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'})}\n\n${lead.call_remark || ''}`;
                } else if (field === 'site_visit_at') {
                    updates.site_visit_at = value;
                    updates.call_remark = `[${stamp}] SV Booked: ${value}\n\n${lead.call_remark || ''}`;
                } else {
                    updates[field] = value;
                }

                const table = leadCategory === 'bulk' ? 'bulk_leads' : 'leads';
                
                // Optimistic UI update (feels instant)
                setLeads(prev => prev.map(l => l.id === lead.id ? {...l, ...updates} : l));

                const { error } = await supabase.from(table).update(updates).eq('id', lead.id);
                if (error) {
                    alert("Error saving update: " + error.message);
                    fetchLeads(); // Revert on failure
                }
            }

            const displayedLeads = useMemo(() => {
                if (!showTodayOnly) return leads;
                const today = new Date().toISOString().split('T')[0];
                return leads.filter(l => l.follow_up_at && l.follow_up_at.startsWith(today));
            }, [leads, showTodayOnly]);

            const stats = useMemo(() => {
                const total = leads.length;
                const uncalled = leads.filter(l => l.lead_status === 'Un called' || !l.lead_status).length;
                const called = leads.filter(l => l.lead_status && l.lead_status !== 'Un called' && l.lead_status !== 'Rejected').length;
                const rejected = leads.filter(l => l.lead_status === 'Rejected').length;
                return { total, uncalled, called, rejected };
            }, [leads]);

            // --- RENDER LOGIC ---
            if (authChecking) {
                return (
                    <div className="min-h-screen bg-slate-950 flex flex-col items-center justify-center">
                        <div className="text-3xl font-black italic text-white uppercase tracking-widest animate-pulse mb-4">Horizon CRM</div>
                        <div className="text-blue-500 text-xs font-bold uppercase tracking-widest">Verifying Access...</div>
                    </div>
                );
            }

            if (!session) return <LoginForm supabase={supabase} />;
            if (selectedProp) return <PropertyDetailsPage property={selectedProp} onBack={() => setSelectedProp(null)} />;

            return (
                <div className="min-h-screen flex flex-col animate-fadeIn">
                    <nav className="bg-slate-900 text-white p-4 flex justify-between items-center sticky top-0 z-50 shadow-md">
                        <h1 className="font-black tracking-tighter text-xl uppercase italic">Horizon <span className="text-blue-500">CRM</span></h1>
                        <div className="flex gap-4 md:gap-6 text-[10px] md:text-[11px] font-bold uppercase tracking-widest items-center">
                            <button onClick={() => setView('dashboard')} className={view === 'dashboard' ? 'text-blue-400' : 'hover:text-slate-300 transition'}>CRM</button>
                            <button onClick={() => setView('library')} className={view === 'library' ? 'text-blue-400' : 'hover:text-slate-300 transition'}>Library</button>
                            <button onClick={() => setView('add')} className={view === 'add' ? 'text-blue-400' : 'hover:text-slate-300 transition'}>+ Project</button>
                            <button onClick={() => supabase.auth.signOut()} className="text-red-400 border border-red-900 px-3 py-1.5 rounded hover:bg-red-900/50 transition font-bold uppercase">Logout</button>
                        </div>
                    </nav>

                    <main className="p-3 md:p-8 max-w-7xl mx-auto w-full">
                        {view === 'dashboard' && (
                            <div className="space-y-6">
                                {/* Lead Status Summary */}
                                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                                    <table className="w-full text-sm text-left">
                                        <thead className="bg-slate-50 border-b uppercase text-[9px] font-black text-slate-400 tracking-widest">
                                            <tr><th className="p-4">Volume ({leadCategory})</th><th className="p-4 text-center">Total</th><th className="p-4 text-center text-green-600">Uncalled</th><th className="p-4 text-center text-blue-600">Working</th><th className="p-4 text-center text-red-600">Rejected</th></tr>
                                        </thead>
                                        <tbody className="font-bold text-slate-700">
                                            <tr className="divide-x divide-slate-100">
                                                <td className="p-4 text-[10px] uppercase font-black">Staff: Tharun</td>
                                                <td className="p-4 text-center">{stats.total}</td>
                                                <td className="p-4 text-center text-green-600">{stats.uncalled}</td>
                                                <td className="p-4 text-center text-blue-600">{stats.called}</td>
                                                <td className="p-4 text-center text-red-600">{stats.rejected}</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>

                                <div className="flex justify-between items-center gap-4">
                                    <div className="flex gap-4">
                                        {['website', 'bulk', 'manual'].map(c => (
                                            <button key={c} onClick={() => setLeadCategory(c)} className={`pb-2 text-[10px] font-black uppercase tracking-widest border-b-2 transition-all ${leadCategory === c ? 'border-blue-500 text-blue-600' : 'border-transparent text-slate-500 hover:text-slate-800'}`}>{c}</button>
                                        ))}
                                    </div>
                                    <button onClick={() => setShowManualModal(true)} className="bg-blue-600 text-white px-4 py-2 rounded-full text-[9px] font-black uppercase shadow-sm">+ Manual Lead</button>
                                </div>

                                {/* DESKTOP TABLE */}
                                <div className="hidden lg:block bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                                    <table className="w-full text-left text-xs">
                                        <thead className="bg-slate-50 text-slate-400 font-black uppercase text-[9px] tracking-widest border-b">
                                            <tr><th className="p-4">Customer</th><th className="p-4">Status & Temperature</th><th className="p-4">Scheduling</th><th className="p-4 min-w-[250px]">Activity History</th></tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100">
                                            {displayedLeads.map(l => (
                                                <tr key={l.id} className={`hover:bg-slate-50 transition border-l-4 ${l.lead_priority === 'Hot' ? 'border-l-red-500' : l.lead_priority === 'Cold' ? 'border-l-blue-400' : 'border-l-amber-400'}`}>
                                                    <td className="p-4 uppercase font-bold">
                                                        {l.customer_name} <div className="text-blue-600 lowercase font-medium">{l.customer_email || 'no-email'}</div>
                                                        <div className="text-slate-900 font-black mt-1">{l.phone_number}</div>
                                                        <div className="text-[8px] text-slate-400 mt-2">Log: {new Date(l.created_at).toLocaleDateString()}</div>
                                                    </td>
                                                    <td className="p-4">
                                                        <select onChange={(e) => updateLead(l, 'lead_status', e.target.value)} value={l.lead_status || ''} className={`w-full p-2 mb-2 border rounded-lg font-bold uppercase text-[9px] outline-none border-2 ${getStatusStyles(l.lead_status)}`}>
                                                            {(!l.lead_status || l.lead_status === 'Un called') && <option value="Un called">Un called</option>}
                                                            <option value="Called">Called</option><option value="RNR">RNR</option><option value="Details Shared">Details Shared</option><option value="SV Scheduled">SV Scheduled</option><option value="Converted">Converted</option><option value="Rejected">Rejected</option>
                                                        </select>
                                                        <select onChange={(e) => updateLead(l, 'lead_priority', e.target.value)} value={l.lead_priority || 'Warm'} className={`w-full p-2 border rounded-lg font-bold uppercase text-[9px] outline-none border-2 ${getPriorityColor(l.lead_priority)}`}>
                                                            <option value="Hot">Hot</option><option value="Warm">Warm</option><option value="Cold">Cold</option>
                                                        </select>
                                                    </td>
                                                    <td className="p-4">
                                                        {['Called', 'RNR', 'Details Shared'].includes(l.lead_status) && (
                                                            <div className="mb-2">
                                                                <label className="text-[8px] font-black text-blue-600 uppercase block mb-1">Follow-up Date</label>
                                                                <input type="datetime-local" className="w-full p-2 bg-blue-50 border border-blue-200 rounded-lg text-[10px] font-bold outline-none" value={l.follow_up_at?.slice(0,16) || ''} onChange={e => updateLead(l, 'follow_up_at', e.target.value)} />
                                                            </div>
                                                        )}
                                                        {l.lead_status === 'SV Scheduled' && (
                                                            <div className="mt-2 pt-2 border-t border-slate-100">
                                                                <label className="text-[8px] font-black text-teal-600 uppercase block mb-1">Site Visit Date</label>
                                                                <input type="date" className="w-full p-2 bg-teal-50 border border-teal-200 rounded-lg text-[10px] font-bold outline-none" value={l.site_visit_at || ''} onChange={e => updateLead(l, 'site_visit_at', e.target.value)} />
                                                            </div>
                                                        )}
                                                    </td>
                                                    <td className="p-4">
                                                        <div className="h-20 overflow-y-auto bg-slate-50 p-3 rounded-lg text-[10px] font-medium text-slate-600 border mb-2 whitespace-pre-wrap">{l.call_remark || 'No logs yet...'}</div>
                                                        <div className="flex gap-2">
                                                            <textarea id={`note-d-${l.id}`} rows="1" placeholder="Add note..." className="flex-1 p-2 border border-slate-200 rounded-lg text-[10px] outline-none focus:ring-1 focus:ring-blue-500 resize-none" />
                                                            <button onClick={() => { const el = document.getElementById(`note-d-${l.id}`); if(el.value.trim()){ updateLead(l, 'add_note', el.value); el.value=''; } }} className="bg-slate-900 text-white px-3 rounded-lg text-[9px] font-black uppercase hover:bg-blue-600 transition">Save</button>
                                                        </div>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>

                                {/* MOBILE CARDS */}
                                <div className="lg:hidden space-y-4">
                                    {displayedLeads.map(l => (
                                        <div key={`m-${l.id}`} className={`bg-white p-4 rounded-2xl shadow-sm border-t-8 ${l.lead_priority === 'Hot' ? 'border-t-red-500' : l.lead_priority === 'Cold' ? 'border-t-blue-400' : 'border-t-amber-400'}`}>
                                            <div className="flex justify-between items-start mb-4">
                                                <div>
                                                    <h3 className="font-black text-sm uppercase">{l.customer_name}</h3>
                                                    <p className="font-bold text-blue-600 text-xs">{l.phone_number}</p>
                                                    <p className="font-bold text-slate-400 text-[10px] truncate">{l.customer_email}</p>
                                                </div>
                                                <a href={`tel:${l.phone_number}`} className="bg-blue-50 text-blue-600 p-3 rounded-full">📞</a>
                                            </div>
                                            
                                            <div className="grid grid-cols-2 gap-2 mb-4">
                                                <div className="flex flex-col gap-1">
                                                    <label className="text-[8px] font-black text-slate-400 uppercase tracking-widest">Status</label>
                                                    <select onChange={(e) => updateLead(l, 'lead_status', e.target.value)} value={l.lead_status || ''} className={`p-2 border rounded-xl font-bold uppercase text-[9px] outline-none ${getStatusStyles(l.lead_status)}`}>
                                                        {(!l.lead_status || l.lead_status === 'Un called') && <option value="Un called">Un called</option>}
                                                        <option value="Called">Called</option><option value="RNR">RNR</option><option value="Details Shared">Details Shared</option><option value="SV Scheduled">SV Scheduled</option><option value="Converted">Converted</option><option value="Rejected">Rejected</option>
                                                    </select>
                                                </div>
                                                <div className="flex flex-col gap-1">
                                                    <label className="text-[8px] font-black text-slate-400 uppercase tracking-widest">Priority</label>
                                                    <select onChange={(e) => updateLead(l, 'lead_priority', e.target.value)} value={l.lead_priority || 'Warm'} className={`p-2 border rounded-xl font-bold uppercase text-[9px] outline-none ${getPriorityColor(l.lead_priority)}`}>
                                                        <option value="Hot">Hot</option><option value="Warm">Warm</option><option value="Cold">Cold</option>
                                                    </select>
                                                </div>
                                            </div>
                                            
                                            <div className="mb-4 space-y-2">
                                                {['Called', 'RNR', 'Details Shared'].includes(l.lead_status) && (
                                                    <div>
                                                        <label className="text-[8px] font-black text-blue-600 uppercase tracking-widest block mb-1">Follow-up Date</label>
                                                        <input type="datetime-local" className="w-full p-2 bg-blue-50 border border-blue-200 rounded-lg text-[10px] font-bold outline-none" value={l.follow_up_at?.slice(0,16) || ''} onChange={e => updateLead(l, 'follow_up_at', e.target.value)} />
                                                    </div>
                                                )}
                                                {l.lead_status === 'SV Scheduled' && (
                                                    <div>
                                                        <label className="text-[8px] font-black text-teal-600 uppercase tracking-widest block mb-1">Site Visit Date</label>
                                                        <input type="date" className="w-full p-2 bg-teal-50 border border-teal-200 rounded-lg text-[10px] font-bold outline-none" value={l.site_visit_at || ''} onChange={e => updateLead(l, 'site_visit_at', e.target.value)} />
                                                    </div>
                                                )}
                                            </div>

                                            <div className="bg-slate-50 p-3 rounded-xl text-[10px] h-24 overflow-y-auto mb-2 whitespace-pre-wrap border font-medium text-slate-600">{l.call_remark || 'No logs yet...'}</div>
                                            <div className="flex gap-2">
                                                <textarea id={`m-note-${l.id}`} rows="1" className="flex-1 p-2 border rounded-lg text-[10px] outline-none resize-none" placeholder="Add note..." />
                                                <button onClick={() => { const el = document.getElementById(`m-note-${l.id}`); if(el.value.trim()){ updateLead(l, 'add_note', el.value); el.value=''; } }} className="bg-slate-900 text-white px-4 rounded-lg text-[9px] font-black uppercase">Save</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {view === 'library' && (
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6 animate-fadeIn">
                                {properties.map(p => (
                                    <div key={p.id} onClick={() => setSelectedProp(p)} className="bg-white rounded-3xl shadow-sm border overflow-hidden cursor-pointer hover:shadow-lg transition flex flex-col">
                                        <img src={fixImageUrl(p.cover_image)} className="h-40 object-cover bg-slate-100" />
                                        <div className="p-5">
                                            <h3 className="font-black uppercase text-slate-900 truncate">{getVal(p, "property_name")}</h3>
                                            <div className="text-[10px] font-bold text-blue-600 mt-1 uppercase">POC: {getVal(p, "point_of_contact") || 'N/A'}</div>
                                            <div className="mt-4 pt-4 border-t flex justify-between items-center">
                                                <span className="font-black text-slate-800">{getVal(p, "price")}</span>
                                                <span className="text-[10px] font-bold uppercase bg-slate-100 px-3 py-1 rounded-full">Preview Details</span>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {view === 'add' && <PropertyForm supabase={supabase} scriptUrl={GOOGLE_SCRIPT_URL} />}
                    </main>

                    {showManualModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
                            <div className="bg-white p-8 rounded-[40px] w-full max-w-md shadow-2xl animate-fadeIn">
                                <div className="flex justify-between items-center mb-6"><h2 className="text-xl font-black uppercase italic">New Lead</h2><button onClick={()=>setShowManualModal(false)} className="text-2xl text-gray-400 hover:text-slate-900">&times;</button></div>
                                <ManualLeadForm supabase={supabase} onSuccess={() => {setShowManualModal(false); fetchLeads();}} />
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // --- PROPERTY ADDITION FORM ---
        function PropertyForm({ supabase, scriptUrl }) {
            const [form, setForm] = useState({ property_name: '', builder_name: '', location: '', price: '', bhk: '', construction_sta: '', point_of_contact: '', commision_deta: '', description: '', cover_image: '', gallery_images: '', floor_plan: '', video_link: '', usp_details: '', amenities: '', website_link: '', lead_registration: '', map_link: '', brochure: '', cost_sheet: '' });
            const [loading, setLoading] = useState(false);

            const upload = async (e, field, append = false) => {
                const file = e.target.files[0]; if(!file) return;
                const reader = new FileReader(); reader.readAsDataURL(file);
                reader.onload = async () => {
                    const res = await fetch(scriptUrl, { method: "POST", body: JSON.stringify({ base64: reader.result.split(',')[1], type: file.type, name: file.name, propertyName: form.property_name || 'Uploads' }) });
                    const resJson = await res.json();
                    if(resJson.status === 'success') {
                        if(append) setForm(f => ({ ...f, [field]: f[field] ? f[field] + ',' + resJson.url : resJson.url }));
                        else setForm(f => ({ ...f, [field]: resJson.url }));
                    }
                };
            };

            const save = async () => {
                setLoading(true);
                const { error } = await supabase.from('properties').insert([form]);
                if(!error) { alert("Listing Live!"); setForm({ property_name: '', builder_name: '', location: '', price: '', bhk: '', construction_sta: '', point_of_contact: '', commision_deta: '', description: '', cover_image: '', gallery_images: '', floor_plan: '', video_link: '', usp_details: '', amenities: '', website_link: '', lead_registration: '', map_link: '', brochure: '', cost_sheet: '' }); } 
                else alert(error.message);
                setLoading(false);
            };

            return (
                <div className="bg-white p-8 rounded-[40px] border shadow-sm max-w-4xl mx-auto space-y-6">
                    <h2 className="text-2xl font-black uppercase italic text-blue-900 border-b pb-4">Master Property Entry</h2>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <input className="p-4 bg-slate-50 border rounded-2xl font-bold text-sm" placeholder="Property Name" value={form.property_name} onChange={e => setForm({...form, property_name: e.target.value})} />
                        <input className="p-4 bg-slate-50 border rounded-2xl font-bold text-sm" placeholder="Builder Name" value={form.builder_name} onChange={e => setForm({...form, builder_name: e.target.value})} />
                        <input className="p-4 bg-slate-50 border rounded-2xl font-bold text-sm" placeholder="Location" value={form.location} onChange={e => setForm({...form, location: e.target.value})} />
                        <input className="p-4 bg-slate-50 border rounded-2xl font-bold text-sm" placeholder="Price (e.g. 1.2 Cr)" value={form.price} onChange={e => setForm({...form, price: e.target.value})} />
                        <input className="p-4 bg-slate-50 border rounded-2xl font-bold text-sm" placeholder="BHK Config" value={form.bhk} onChange={e => setForm({...form, bhk: e.target.value})} />
                        <select className="p-4 bg-slate-50 border rounded-2xl font-bold text-sm outline-none" value={form.construction_sta} onChange={e => setForm({...form, construction_sta: e.target.value})}>
                            <option value="">Status</option><option>Ready to Move</option><option>Under Construction</option><option>New Launch</option>
                        </select>
                    </div>
                    <textarea className="w-full p-4 bg-slate-50 border rounded-2xl font-bold text-sm h-32 resize-none" placeholder="Property Description..." value={form.description} onChange={e => setForm({...form, description: e.target.value})}></textarea>
                    
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <textarea placeholder="USPs / Highlights (Line by Line)" rows="3" className="p-4 bg-slate-50 border rounded-2xl font-bold text-sm resize-none" onChange={e => setForm({...form, usp_details: e.target.value})} value={form.usp_details}/>
                        <textarea placeholder="Amenities (Comma separated)" rows="3" className="p-4 bg-slate-50 border rounded-2xl font-bold text-sm resize-none" onChange={e => setForm({...form, amenities: e.target.value})} value={form.amenities}/>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 p-6 bg-slate-900 rounded-3xl text-white">
                        <h3 className="col-span-1 md:col-span-2 text-[10px] font-black text-blue-400 uppercase tracking-widest">Internal Data & Links</h3>
                        <input className="p-4 bg-slate-800 border-none rounded-xl font-bold" placeholder="Internal POC" value={form.point_of_contact} onChange={e => setForm({...form, point_of_contact: e.target.value})} />
                        <input className="p-4 bg-slate-800 border-none rounded-xl font-bold" placeholder="Commission %" value={form.commision_deta} onChange={e => setForm({...form, commision_deta: e.target.value})} />
                        <input className="p-4 bg-slate-800 border-none rounded-xl font-bold md:col-span-2" placeholder="Video Link (YouTube/Drive URL)" value={form.video_link} onChange={e => setForm({...form, video_link: e.target.value})} />
                        <input className="p-4 bg-slate-800 border-none rounded-xl font-bold" placeholder="Builder Website Link" value={form.website_link} onChange={e => setForm({...form, website_link: e.target.value})} />
                        <input className="p-4 bg-slate-800 border-none rounded-xl font-bold" placeholder="Lead Register Link" value={form.lead_registration} onChange={e => setForm({...form, lead_registration: e.target.value})} />
                        <input className="p-4 bg-slate-800 border-none rounded-xl font-bold md:col-span-2" placeholder="Map Link (Google Maps URL)" value={form.map_link} onChange={e => setForm({...form, map_link: e.target.value})} />
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6 pt-6 border-t">
                        <div><label className="block text-[10px] font-black uppercase text-slate-400 mb-2">Main Cover Image</label><input type="file" onChange={e => upload(e, 'cover_image')} className="text-xs font-bold text-slate-600"/></div>
                        <div><label className="block text-[10px] font-black uppercase text-slate-400 mb-2">Gallery Images (Upload 1 by 1)</label><input type="file" onChange={e => upload(e, 'gallery_images', true)} className="text-xs font-bold text-slate-600"/> <span className="text-[9px] text-blue-600 font-bold block mt-1">Uploaded: {form.gallery_images ? form.gallery_images.split(',').length : 0}</span></div>
                        <div><label className="block text-[10px] font-black uppercase text-slate-400 mb-2">Brochure (PDF)</label><input type="file" onChange={e => upload(e, 'brochure')} className="text-xs font-bold text-slate-600"/></div>
                        <div><label className="block text-[10px] font-black uppercase text-slate-400 mb-2">Cost Sheet (PDF)</label><input type="file" onChange={e => upload(e, 'cost_sheet')} className="text-xs font-bold text-slate-600"/></div>
                        <div><label className="block text-[10px] font-black uppercase text-slate-400 mb-2">Floor Plan (PDF/Img)</label><input type="file" onChange={e => upload(e, 'floor_plan')} className="text-xs font-bold text-slate-600"/></div>
                    </div>

                    <button onClick={save} disabled={loading} className="w-full bg-blue-600 text-white p-5 rounded-3xl font-black uppercase tracking-widest hover:bg-slate-900 transition shadow-xl mt-4">{loading ? 'Publishing...' : 'Publish Listing'}</button>
                </div>
            );
        }

        // --- MANUAL LEAD FORM ---
        function ManualLeadForm({ supabase, onSuccess }) {
            const [form, setForm] = useState({ name: '', phone: '', email: '', project: '', note: '', source: 'Manual Entry' });
            const [loading, setLoading] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);
                const stamp = new Date().toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute:'2-digit' });
                const remarks = form.note ? `[${stamp}] Requirement: ${form.note}\n\n` : '';

                const { error } = await supabase.from('leads').insert([{ 
                    customer_name: form.name, 
                    phone_number: form.phone, 
                    customer_email: form.email || null,
                    project_interested_in: form.project,
                    call_remark: remarks,
                    lead_source: form.source, 
                    lead_status: 'Un called' 
                }]);

                if (!error) onSuccess(); else alert(error.message);
                setLoading(false);
            };

            return (
                <form onSubmit={handleSubmit} className="space-y-4">
                    <input required className="w-full p-4 bg-slate-50 border rounded-2xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500" placeholder="Client Name *" onChange={e => setForm({...form, name: e.target.value})} />
                    <input required className="w-full p-4 bg-slate-50 border rounded-2xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500" placeholder="Phone Number *" onChange={e => setForm({...form, phone: e.target.value})} />
                    <input type="email" className="w-full p-4 bg-slate-50 border rounded-2xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500" placeholder="Email ID (Optional)" onChange={e => setForm({...form, email: e.target.value})} />
                    <input className="w-full p-4 bg-slate-50 border rounded-2xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500" placeholder="Interested Project" onChange={e => setForm({...form, project: e.target.value})} />
                    <textarea className="w-full p-4 bg-slate-50 border rounded-2xl font-bold text-sm resize-none outline-none focus:ring-2 focus:ring-blue-500 h-24" placeholder="Customer Requirements / Enquiry Details..." onChange={e => setForm({...form, note: e.target.value})}></textarea>
                    <select className="w-full p-4 bg-slate-50 border rounded-2xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500" onChange={e => setForm({...form, source: e.target.value})} value={form.source}>
                        <option>Manual Entry</option><option>Walk-in</option><option>Referral</option><option>MagicBricks</option><option>Housing.com</option>
                    </select>
                    <button disabled={loading} className="w-full bg-blue-600 text-white p-4 rounded-2xl font-black uppercase tracking-widest hover:bg-blue-700 shadow-md transition disabled:opacity-50">
                        {loading ? "Injecting..." : "Inject Lead"}
                    </button>
                </form>
            );
        }

        // --- LOGIN FORM ---
        function LoginForm({ supabase }) {
            const [email, setEmail] = useState("");
            const [pass, setPass] = useState("");
            const [loading, setLoading] = useState(false);
            const [errorMsg, setErrorMsg] = useState("");

            const handleLogin = async (e) => {
                e.preventDefault();
                setLoading(true);
                setErrorMsg("");
                const { error } = await supabase.auth.signInWithPassword({ email, password: pass });
                if (error) setErrorMsg(error.message);
                setLoading(false);
            };

            return (
                <div className="min-h-screen bg-slate-950 flex items-center justify-center p-4">
                    <form onSubmit={handleLogin} className="bg-white p-10 rounded-[40px] shadow-2xl w-full max-w-sm text-center border-t-8 border-blue-500">
                        <h1 className="text-3xl font-black italic uppercase mb-8">Horizon CRM</h1>
                        {errorMsg && <div className="text-red-500 text-xs font-bold mb-4 bg-red-50 p-2 rounded">{errorMsg}</div>}
                        <input type="email" required placeholder="Email" className="w-full p-4 bg-slate-100 rounded-2xl mb-4 font-bold outline-none" onChange={e => setEmail(e.target.value)} />
                        <input type="password" required placeholder="Password" className="w-full p-4 bg-slate-100 rounded-2xl mb-8 font-bold outline-none" onChange={e => setPass(e.target.value)} />
                        <button disabled={loading} type="submit" className="w-full bg-blue-600 text-white font-black py-4 rounded-2xl uppercase tracking-widest shadow-lg disabled:opacity-50 hover:bg-blue-700">
                            {loading ? "Authenticating..." : "Login"}
                        </button>
                    </form>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AdminApp />);
    </script>
</body>
</html>
