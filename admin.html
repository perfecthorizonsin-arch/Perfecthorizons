<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PH Engine v3.0 | Command Center</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .animate-fadeIn { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .tab-active { color: #60a5fa; border-bottom: 2px solid #60a5fa; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .priority-hot { border-left: 4px solid #ef4444; background: #fef2f2; }
    </style>
</head>
<body class="bg-gray-50 font-sans text-gray-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const supabaseUrl = 'https://uiiovtsktllvtecfokik.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVpaW92dHNrdGxsdnRlY2Zva2lrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM5NjkxMjMsImV4cCI6MjA4OTU0NTEyM30.fL6cU7YkH4-50w55GrnutoBhmH5sofe8-rOMZetmuvU';
        
        // SECURITY: Using sessionStorage so data wipes when tab closes
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey, {
            auth: { storage: window.sessionStorage } 
        });

        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxJOoh4meGBQOZYZpUWqK1DmDS_B8fXSC5NlwPcTX3GUfP7gzYQKvatgj9IFT3Txy-FCQ/exec";

        function AdminApp() {
            const [session, setSession] = useState(null);
            const [leads, setLeads] = useState([]);
            const [view, setView] = useState('dashboard'); 
            const [leadCategory, setLeadCategory] = useState('website'); // website, bulk, manual
            const [loading, setLoading] = useState(true);
            const [showManualModal, setShowManualModal] = useState(false);

            useEffect(() => {
                supabase.auth.getSession().then(({ data: { session } }) => {
                    setSession(session);
                    if (session) fetchLeads();
                });
                const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
                    setSession(session);
                    if (session) fetchLeads();
                });
                return () => subscription.unsubscribe();
            }, [leadCategory]);

           async function fetchLeads() {
                setLoading(true);
                const table = leadCategory === 'bulk' ? 'bulk_leads' : 'leads';
                
                // Fetch ALL rows to bypass Supabase's strict syntax rules
                const { data, error } = await supabase.from(table).select('*').order('created_at', { ascending: false });

                if (error) {
                    alert("Database Error: " + error.message);
                    console.error(error);
                } else {
                    let rawData = data || [];
                    let sortedData = [];

                    // Let JavaScript do the sorting so we don't miss any leads!
                    if (table === 'leads') {
                        if (leadCategory === 'website') {
                            // Show it if the source is blank, null, or says 'website' (any capitalization)
                            sortedData = rawData.filter(lead => 
                                !lead.lead_source || 
                                lead.lead_source.trim() === '' || 
                                lead.lead_source.toLowerCase() === 'website'
                            );
                        } else if (leadCategory === 'manual') {
                            // Show it if the source exists and is NOT a website lead (e.g., MagicBricks, Walk-in, Manual)
                            sortedData = rawData.filter(lead => 
                                lead.lead_source && 
                                lead.lead_source.trim() !== '' && 
                                lead.lead_source.toLowerCase() !== 'website'
                            );
                        }
                    } else {
                        // If it's the bulk table, just show everything
                        sortedData = rawData;
                    }

                    setLeads(sortedData);
                }
                setLoading(false);
            }

            async function updateLead(id, field, value) {
                const table = leadCategory === 'bulk' ? 'bulk_leads' : 'leads';
                const { error } = await supabase.from(table).update({ [field]: value }).eq('id', id);
                if (!error) {
                    setLeads(prev => prev.map(l => l.id === id ? {...l, [field]: value} : l));
                }
            }

            if (!session) return <LoginForm supabase={supabase} />;

            return (
                <div className="min-h-screen flex flex-col animate-fadeIn">
                    <nav className="bg-slate-950 text-white p-5 flex justify-between items-center sticky top-0 z-50 shadow-xl">
                        <div className="flex items-center gap-4">
                            <h1 className="font-black italic uppercase tracking-tighter text-2xl text-blue-400">PH Engine</h1>
                            <span className="bg-blue-900/50 text-blue-200 text-[10px] px-2 py-1 rounded font-bold uppercase tracking-widest">v3.0 CRM</span>
                        </div>
                        <div className="flex gap-6 text-[11px] font-black uppercase tracking-[0.15em] items-center">
                            <button onClick={() => setView('dashboard')} className={view === 'dashboard' ? 'text-blue-400' : 'text-slate-400'}>Leads CRM</button>
                            <button onClick={() => setView('add-property')} className={view === 'add-property' ? 'text-blue-400' : 'text-slate-400'}>List Property</button>
                            <button onClick={() => supabase.auth.signOut()} className="text-red-400 hover:text-red-300 transition">Logout 🚪</button>
                        </div>
                    </nav>

                    <main className="p-4 md:p-8 max-w-7xl mx-auto w-full">
                        {view === 'dashboard' && (
                            <div className="space-y-6">
                                {/* Category Tabs */}
                                <div className="flex items-center gap-8 border-b border-slate-200 pb-2">
                                    {['website', 'bulk', 'manual'].map(cat => (
                                        <button 
                                            key={cat}
                                            onClick={() => setLeadCategory(cat)}
                                            className={`pb-2 text-[11px] font-black uppercase tracking-[0.2em] transition-all border-b-2 ${leadCategory === cat ? 'border-blue-500 text-blue-500' : 'border-transparent text-slate-400'}`}
                                        >
                                            {cat}
                                        </button>
                                    ))}
                                    <button 
                                        onClick={() => setShowManualModal(true)}
                                        className="ml-auto bg-blue-600 text-white text-[10px] px-6 py-2 rounded-full font-black uppercase tracking-widest hover:bg-slate-900 transition shadow-lg shadow-blue-500/20"
                                    >
                                        + Manual Entry
                                    </button>
                                </div>

                                {/* Table Container */}
                                <div className="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
                                    <div className="p-4 bg-slate-50 border-b flex justify-between items-center">
                                        <h3 className="text-[10px] font-black uppercase tracking-widest text-slate-500 italic">Tracking {leadCategory} pipeline</h3>
                                        <button onClick={fetchLeads} className="text-[9px] font-bold text-blue-600 uppercase tracking-tighter">Sync Now ↻</button>
                                    </div>
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-xs text-left">
                                            <thead>
                                                <tr className="bg-slate-50/50 text-slate-400 uppercase font-black text-[9px] tracking-widest border-b">
                                                    <th className="p-5">Customer Profile</th>
                                                    <th className="p-5">Status & Priority</th>
                                                    <th className="p-5">Callback Log</th>
                                                    <th className="p-5">Visit Date</th>
                                                    <th className="p-5">Agent Remarks</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100">
                                                {loading ? (
                                                    <tr><td colSpan="5" className="p-20 text-center font-bold text-slate-300 uppercase italic animate-pulse">Establishing secure link...</td></tr>
                                                ) : leads.map(lead => (
                                                    <tr key={lead.id} className={`hover:bg-blue-50/20 transition ${lead.lead_priority === 'Hot' ? 'priority-hot' : ''}`}>
                                                        <td className="p-5 min-w-[200px]">
                                                            <div className="font-black text-slate-900 uppercase text-[13px]">{lead.customer_name}</div>
                                                            <div className="text-blue-600 font-bold mt-0.5">{lead.phone_number}</div>
                                                            {lead.customer_email && <div className="text-[10px] text-slate-400 italic lowercase">{lead.customer_email}</div>}
                                                            <div className="mt-3 flex gap-2">
                                                                <a href={`https://wa.me/91${lead.phone_number?.replace(/\D/g,'').slice(-10)}`} target="_blank" className="bg-green-500 text-white text-[8px] font-black px-2 py-1 rounded uppercase tracking-tighter">WhatsApp 💬</a>
                                                            </div>
                                                        </td>
                                                        <td className="p-5 min-w-[150px]">
                                                            <select 
                                                                value={lead.lead_status || 'Un called'} 
                                                                onChange={(e) => updateLead(lead.id, 'lead_status', e.target.value)}
                                                                className="block w-full mb-2 p-2 border rounded-lg text-[9px] font-black uppercase tracking-widest bg-white"
                                                            >
                                                                <option>Un called</option><option>Called</option><option>RNR</option><option>Details Shared</option><option>SV Scheduled</option><option>Converted</option><option>Rejected</option>
                                                            </select>
                                                            <select 
                                                                value={lead.lead_priority || 'Warm'} 
                                                                onChange={(e) => updateLead(lead.id, 'lead_priority', e.target.value)}
                                                                className={`block w-full p-2 border rounded-lg text-[9px] font-black uppercase tracking-widest ${lead.lead_priority === 'Hot' ? 'text-red-600 font-black' : 'text-slate-500'}`}
                                                            >
                                                                <option>Hot</option><option>Warm</option><option>Cold</option>
                                                            </select>
                                                        </td>
                                                        <td className="p-5 min-w-[160px]">
                                                            <input 
                                                                type="datetime-local" 
                                                                defaultValue={lead.follow_up_at ? lead.follow_up_at.slice(0,16) : ''}
                                                                onBlur={(e) => updateLead(lead.id, 'follow_up_at', e.target.value)}
                                                                className="w-full p-2 border rounded-lg text-[10px] font-bold text-slate-600 outline-none focus:ring-2 focus:ring-blue-500"
                                                            />
                                                            {lead.follow_up_at && <div className="mt-2 text-[8px] text-blue-500 font-black uppercase tracking-widest flex items-center gap-1">⏱️ Scheduled</div>}
                                                        </td>
                                                        <td className="p-5">
                                                            <input 
                                                                type="date" 
                                                                defaultValue={lead.site_visit_at || ''}
                                                                onBlur={(e) => updateLead(lead.id, 'site_visit_at', e.target.value)}
                                                                className="w-full p-2 border rounded-lg text-[10px] font-bold text-slate-600"
                                                            />
                                                        </td>
                                                        <td className="p-5">
                                                            <textarea 
                                                                defaultValue={lead.call_remark || ''}
                                                                onBlur={(e) => updateLead(lead.id, 'call_remark', e.target.value)}
                                                                className="w-full p-3 border rounded-xl text-[11px] font-medium h-20 bg-slate-50/50 resize-none outline-none focus:ring-2 focus:ring-blue-500"
                                                                placeholder="Type interaction notes..."
                                                            />
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}

                        {view === 'add-property' && <PropertyForm scriptUrl={GOOGLE_SCRIPT_URL} supabase={supabase} />}
                    </main>

                    {/* MANUAL MODAL */}
                    {showManualModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-[100] flex items-center justify-center p-4">
                            <div className="bg-white rounded-[40px] p-10 max-w-md w-full animate-fadeIn shadow-2xl relative">
                                <button onClick={() => setShowManualModal(false)} className="absolute top-6 right-8 text-3xl text-slate-300 hover:text-slate-900 transition">&times;</button>
                                <h2 className="text-2xl font-black italic uppercase tracking-tighter mb-8">Manual Registration</h2>
                                <ManualLeadForm supabase={supabase} onSuccess={() => {setShowManualModal(false); fetchLeads();}} />
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function ManualLeadForm({ supabase, onSuccess }) {
            const [form, setForm] = useState({ name: '', phone: '', email: '', project: '', source: 'Manual' });
            const [loading, setLoading] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);
                const { error } = await supabase.from('leads').insert([{
                    customer_name: form.name,
                    phone_number: form.phone,
                    customer_email: form.email,
                    project_interested_in: form.project,
                    lead_source: form.source,
                    lead_status: 'Un called'
                }]);
                if (!error) onSuccess();
                else alert("Entry failed. Ensure columns follow_up_at and site_visit_at exist.");
                setLoading(false);
            };

            return (
                <form onSubmit={handleSubmit} className="space-y-4">
                    <input required placeholder="Client Name" className="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl text-sm font-bold outline-none focus:ring-2 focus:ring-blue-500" onChange={e => setForm({...form, name: e.target.value})} />
                    <input required placeholder="Phone Number" className="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl text-sm font-bold outline-none focus:ring-2 focus:ring-blue-500" onChange={e => setForm({...form, phone: e.target.value})} />
                    <input placeholder="Email (Optional)" className="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl text-sm font-bold outline-none focus:ring-2 focus:ring-blue-500" onChange={e => setForm({...form, email: e.target.value})} />
                    <input placeholder="Project Name" className="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl text-sm font-bold outline-none focus:ring-2 focus:ring-blue-500" onChange={e => setForm({...form, project: e.target.value})} />
                    <select className="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl text-sm font-bold" onChange={e => setForm({...form, source: e.target.value})}>
                        <option>Manual</option><option>MagicBricks</option><option>Housing.com</option><option>Referral</option><option>Direct Walk-in</option>
                    </select>
                    <button disabled={loading} className="w-full bg-blue-600 text-white font-black py-5 rounded-3xl uppercase tracking-widest shadow-xl shadow-blue-500/20 hover:bg-slate-950 transition active:scale-95">
                        {loading ? "Registering..." : "Inject into Database"}
                    </button>
                </form>
            );
        }

        function LoginForm({ supabase }) {
            const [email, setEmail] = useState("");
            const [pass, setPass] = useState("");
            const handleLogin = async (e) => {
                e.preventDefault();
                const { error } = await supabase.auth.signInWithPassword({ email, password: pass });
                if (error) alert("Invalid Credentials. Make sure user exists in Supabase Auth.");
            };
            return (
                <div className="min-h-screen bg-slate-950 flex items-center justify-center p-4">
                    <form onSubmit={handleLogin} className="bg-white p-10 rounded-[40px] shadow-2xl w-full max-w-sm text-center border-t-8 border-blue-500 animate-fadeIn">
                        <h1 className="text-3xl font-black italic uppercase tracking-tighter mb-4">PH Engine</h1>
                        <p className="text-[10px] font-black uppercase text-slate-400 tracking-[0.3em] mb-10">Restricted Admin Access</p>
                        <input type="email" placeholder="Email Address" className="w-full p-4 bg-slate-100 border border-transparent rounded-2xl mb-3 font-bold text-sm focus:ring-2 focus:ring-blue-500 outline-none" onChange={e => setEmail(e.target.value)} required />
                        <input type="password" placeholder="Password" className="w-full p-4 bg-slate-100 border border-transparent rounded-2xl mb-8 font-bold text-sm focus:ring-2 focus:ring-blue-500 outline-none" onChange={e => setPass(e.target.value)} required />
                        <button className="w-full bg-blue-600 text-white font-black py-5 rounded-3xl uppercase tracking-widest shadow-xl hover:bg-slate-900 transition">Unlock System</button>
                    </form>
                </div>
            );
        }

        // --- PROPERTY FORM ---
        function PropertyForm({ scriptUrl, supabase }) {
            const [uploading, setUploading] = useState(false);
            const [form, setForm] = useState({ property_name: '', price: '', location: '', property_type: '', construction_status: '', bhk: '', builder_name: '', cover_image: '', brochure: '', cost_sheet: '' });

            async function handleFileUpload(e, field) {
                const file = e.target.files[0];
                if (!file || !form.property_name) return alert("Enter Property Name first!");
                setUploading(true);
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = async () => {
                    const base64 = reader.result.split(',')[1];
                    const res = await fetch(scriptUrl, { method: "POST", body: JSON.stringify({ base64, type: file.type, name: file.name, propertyName: form.property_name }) });
                    const result = await res.json();
                    if(result.status === "success") setForm(prev => ({ ...prev, [field]: result.url }));
                    setUploading(false);
                };
            }

            async function saveProperty() {
                const { error } = await supabase.from('properties').insert([form]);
                if (!error) { alert("Published!"); setForm({ property_name: '' }); }
            }

            return (
                <div className="bg-white p-10 rounded-[40px] shadow-xl max-w-3xl mx-auto space-y-8 animate-fadeIn border border-slate-100">
                    <h2 className="text-3xl font-black uppercase tracking-tighter italic">List New Property</h2>
                    <div className="grid grid-cols-2 gap-4">
                        <input placeholder="Project Title" className="col-span-2 p-4 bg-slate-50 border rounded-2xl font-bold text-sm" onChange={e => setForm({...form, property_name: e.target.value})} />
                        <input placeholder="Builder" className="p-4 bg-slate-50 border rounded-2xl font-bold text-sm" onChange={e => setForm({...form, builder_name: e.target.value})} />
                        <input placeholder="Pricing" className="p-4 bg-slate-50 border rounded-2xl font-bold text-sm" onChange={e => setForm({...form, price: e.target.value})} />
                    </div>
                    <div className="grid grid-cols-3 gap-6 border-t pt-8">
                        {['cover_image', 'brochure', 'cost_sheet'].map(f => (
                            <div key={f} className="text-center group">
                                <label className="text-[9px] font-black uppercase block mb-3 text-slate-400 group-hover:text-blue-500 transition">{f.replace('_',' ')}</label>
                                <input type="file" onChange={e => handleFileUpload(e, f)} className="text-[10px] w-full" />
                            </div>
                        ))}
                    </div>
                    <button onClick={saveProperty} disabled={uploading} className="w-full bg-blue-600 text-white p-6 rounded-3xl font-black uppercase tracking-widest shadow-2xl hover:bg-slate-950 transition">
                        {uploading ? "Uploading to G-Drive..." : "Go Live"}
                    </button>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AdminApp />);
    </script>
</body>
</html>
