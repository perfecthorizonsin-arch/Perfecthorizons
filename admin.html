<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizon CRM | Command Center</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .animate-fadeIn { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .history-scroll::-webkit-scrollbar { width: 4px; }
        .history-scroll::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
        .toggle-active { background-color: #f59e0b; color: white; border-color: #f59e0b; }
        .ring-hot { border-left: 5px solid #ef4444 !important; }
        .ring-warm { border-left: 5px solid #f59e0b !important; }
        .ring-cold { border-left: 5px solid #3b82f6 !important; }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-900 pb-20 md:pb-0">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const supabaseUrl = 'https://uiiovtsktllvtecfokik.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVpaW92dHNrdGxsdnRlY2Zva2lrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM5NjkxMjMsImV4cCI6MjA4OTU0NTEyM30.fL6cU7YkH4-50w55GrnutoBhmH5sofe8-rOMZetmuvU';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey, { auth: { storage: window.sessionStorage } });
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxJOoh4meGBQOZYZpUWqK1DmDS_B8fXSC5NlwPcTX3GUfP7gzYQKvatgj9IFT3Txy-FCQ/exec";

        function AdminApp() {
            const [session, setSession] = useState(null);
            const [leads, setLeads] = useState([]);
            const [view, setView] = useState('dashboard'); 
            const [leadCategory, setLeadCategory] = useState('website'); 
            const [loading, setLoading] = useState(true);
            const [showManualModal, setShowManualModal] = useState(false);
            const [showTodayOnly, setShowTodayOnly] = useState(false);

            useEffect(() => {
                if (!session) return;
                let idleTimer;
                const logoutTime = 60 * 60 * 1000; 
                const resetTimer = () => {
                    clearTimeout(idleTimer);
                    idleTimer = setTimeout(() => { supabase.auth.signOut(); window.location.reload(); }, logoutTime);
                };
                window.onmousemove = resetTimer;
                window.onkeydown = resetTimer;
                resetTimer();
            }, [session]);

            useEffect(() => {
                supabase.auth.getSession().then(({ data: { session } }) => {
                    setSession(session);
                    if (session) fetchLeads();
                });
            }, [leadCategory, view]);

            async function fetchLeads() {
                setLoading(true);
                const table = leadCategory === 'bulk' ? 'bulk_leads' : 'leads';
                const { data, error } = await supabase.from(table).select('*').order('created_at', { ascending: false });
                if (!error) {
                    let raw = data || [];
                    if (table === 'leads') {
                        setLeads(leadCategory === 'website' 
                            ? raw.filter(l => !l.lead_source || l.lead_source.trim() === '' || l.lead_source.toLowerCase() === 'website')
                            : raw.filter(l => l.lead_source && l.lead_source.trim() !== '' && l.lead_source.toLowerCase() !== 'website'));
                    } else { setLeads(raw); }
                }
                setLoading(false);
            }

            const displayedLeads = useMemo(() => {
                if (!showTodayOnly) return leads;
                const today = new Date().toISOString().split('T')[0];
                return leads.filter(l => l.follow_up_at && l.follow_up_at.startsWith(today));
            }, [leads, showTodayOnly]);

            async function updateLead(lead, field, value) {
                let updates = { [field]: value };
                const stamp = new Date().toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute:'2-digit' });

                if (field === 'lead_status') updates.call_remark = `[${stamp}] Status: ${value}\n${lead.call_remark || ''}`;
                if (field === 'follow_up_at') updates.call_remark = `[${stamp}] Callback Set: ${value}\n${lead.call_remark || ''}`;
                if (field === 'add_note') {
                    updates.call_remark = `[${stamp}] Note: ${value}\n${lead.call_remark || ''}`;
                    delete updates.add_note;
                }

                const table = leadCategory === 'bulk' ? 'bulk_leads' : 'leads';
                const { error } = await supabase.from(table).update(updates).eq('id', lead.id);
                if (!error) setLeads(prev => prev.map(l => l.id === lead.id ? {...l, ...updates} : l));
            }

            if (!session) return <LoginForm supabase={supabase} />;

            return (
                <div className="min-h-screen flex flex-col animate-fadeIn">
                    <nav className="bg-slate-900 text-white p-4 flex justify-between items-center sticky top-0 z-50 shadow-md">
                        <h1 className="font-black tracking-tighter text-xl uppercase italic">Horizon <span className="text-blue-500">CRM</span></h1>
                        <div className="flex gap-4 text-[10px] font-bold uppercase tracking-widest">
                            <button onClick={() => setView('dashboard')} className={view === 'dashboard' ? 'text-blue-400' : 'hover:text-slate-300 transition'}>CRM</button>
                            <button onClick={() => setView('library')} className={view === 'library' ? 'text-blue-400' : 'hover:text-slate-300 transition'}>Library</button>
                            <button onClick={() => setView('add')} className={view === 'add' ? 'text-blue-400' : 'hover:text-slate-300 transition'}>Add Project</button>
                            <button onClick={() => supabase.auth.signOut()} className="text-red-400 ml-2 hidden md:block border border-red-900 px-2 py-1 rounded">Logout</button>
                            <button onClick={() => supabase.auth.signOut()} className="text-red-400 md:hidden text-lg">🚪</button>
                        </div>
                    </nav>

                    <main className="p-3 md:p-8 max-w-7xl mx-auto w-full">
                        {view === 'dashboard' && (
                            <div className="space-y-6">
                                <div className="flex flex-wrap gap-4 items-center justify-between border-b pb-4">
                                    <div className="flex gap-4">
                                        {['website', 'bulk', 'manual'].map(c => (
                                            <button key={c} onClick={() => setLeadCategory(c)} className={`pb-2 text-[10px] font-black uppercase tracking-widest border-b-2 transition-all ${leadCategory === c ? 'border-blue-500 text-blue-600' : 'border-transparent text-slate-500 hover:text-slate-800'}`}>{c}</button>
                                        ))}
                                    </div>
                                    <div className="flex gap-2">
                                        <button onClick={() => setShowTodayOnly(!showTodayOnly)} className={`px-4 py-2 rounded-full text-[9px] font-black uppercase border ${showTodayOnly ? 'bg-amber-500 text-white border-amber-600' : 'bg-white text-slate-600 shadow-sm'}`}>📅 Today</button>
                                        <button onClick={() => setShowManualModal(true)} className="bg-blue-600 text-white px-4 py-2 rounded-full text-[9px] font-black uppercase shadow-sm">+ Add Lead</button>
                                    </div>
                                </div>

                                <div className="hidden lg:block bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                                    <table className="w-full text-left text-xs">
                                        <thead className="bg-slate-50 text-slate-400 font-black uppercase text-[9px] tracking-widest border-b">
                                            <tr><th className="p-4">Customer</th><th className="p-4">Status</th><th className="p-4">Scheduling</th><th className="p-4">History</th></tr>
                                        </thead>
                                        <tbody className="divide-y">
                                            {displayedLeads.map(l => (
                                                <tr key={l.id} className={`hover:bg-slate-50/50 ${l.lead_priority === 'Hot' ? 'ring-hot' : l.lead_priority === 'Cold' ? 'ring-cold' : 'ring-warm'}`}>
                                                    <td className="p-4 font-bold uppercase">{l.customer_name}<div className="text-blue-600">{l.phone_number}</div></td>
                                                    <td className="p-4">
                                                        <select onChange={(e) => updateLead(l, 'lead_status', e.target.value)} value={l.lead_status || ''} className="w-full p-2 border rounded font-bold uppercase text-[10px] bg-white"><option>Un called</option><option>Called</option><option>SV Scheduled</option><option>Converted</option><option>Rejected</option></select>
                                                    </td>
                                                    <td className="p-4">
                                                        <input type="datetime-local" className="p-2 border rounded w-full text-[10px]" value={l.follow_up_at?.slice(0,16) || ''} onChange={(e) => updateLead(l, 'follow_up_at', e.target.value)} />
                                                    </td>
                                                    <td className="p-4">
                                                        <div className="h-16 overflow-y-auto text-[10px] bg-slate-50 p-2 rounded history-scroll whitespace-pre-wrap">{l.call_remark}</div>
                                                        <input placeholder="Add note..." className="w-full mt-1 p-2 border rounded text-[10px]" onKeyDown={(e) => e.key === 'Enter' && (updateLead(l, 'add_note', e.target.value), e.target.value='')} />
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>

                                <div className="lg:hidden space-y-4">
                                    {displayedLeads.map(l => (
                                        <div key={`m-${l.id}`} className={`bg-white p-4 rounded-2xl shadow-sm border border-t-8 ${l.lead_priority === 'Hot' ? 'border-red-500' : l.lead_priority === 'Cold' ? 'border-blue-400' : 'border-amber-400'}`}>
                                            <div className="flex justify-between items-start">
                                                <div><h3 className="font-black text-sm uppercase">{l.customer_name}</h3><p className="font-bold text-blue-600">{l.phone_number}</p></div>
                                                <div className="flex gap-2"><a href={`tel:${l.phone_number}`} className="bg-blue-50 text-blue-600 border border-blue-100 p-2 rounded-full">📞</a><a href={`https://wa.me/91${l.phone_number}`} className="bg-green-50 text-green-600 border border-green-100 p-2 rounded-full">💬</a></div>
                                            </div>
                                            <div className="mt-4 grid grid-cols-2 gap-2">
                                                <select onChange={(e) => updateLead(l, 'lead_status', e.target.value)} value={l.lead_status || ''} className="p-2 border rounded-xl font-bold uppercase text-[9px]"><option>Un called</option><option>Called</option><option>SV Scheduled</option><option>Rejected</option></select>
                                                <input type="datetime-local" className="p-2 border rounded-xl text-[9px]" value={l.follow_up_at?.slice(0,16) || ''} onChange={(e) => updateLead(l, 'follow_up_at', e.target.value)} />
                                            </div>
                                            <div className="mt-4 bg-slate-50 p-3 rounded-xl h-20 overflow-y-auto text-[10px] font-medium whitespace-pre-wrap border border-slate-100">{l.call_remark}</div>
                                            <div className="flex gap-2 mt-2">
                                                <textarea className="w-full p-2 border rounded-xl text-[10px] resize-none focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Type note..." id={`note-m-${l.id}`} rows="1" />
                                                <button onClick={() => { const el = document.getElementById(`note-m-${l.id}`); updateLead(l, 'add_note', el.value); el.value=''; }} className="bg-slate-900 text-white px-4 rounded-xl text-[9px] font-black uppercase tracking-widest shadow-md">Save</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {view === 'library' && <ProjectLibrary supabase={supabase} />}
                        {view === 'add' && <PropertyForm scriptUrl={GOOGLE_SCRIPT_URL} supabase={supabase} />}
                    </main>

                    {showManualModal && <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4"><div className="bg-white p-8 rounded-[30px] w-full max-w-md shadow-2xl animate-fadeIn"><h2 className="text-xl font-black uppercase italic mb-6">Manual Entry</h2><ManualLeadForm supabase={supabase} onSuccess={() => {setShowManualModal(false); fetchLeads();}} /></div></div>}
                </div>
            );
        }

        // --- FULLY RESTORED PROJECT LIBRARY WITH FRONT-END LOGIC ---
        function ProjectLibrary({ supabase }) {
            const [data, setData] = useState([]);
            const [loading, setLoading] = useState(true);

            useEffect(() => { 
                supabase.from('properties').select('*').order('created_at', { ascending: false }).then(({data}) => {
                    setData(data || []);
                    setLoading(false);
                }); 
            }, []);
            
            // Front-end helper to prevent database column name crashes
            const getVal = (obj, searchKey) => {
                if (!obj) return "";
                if (obj[searchKey] !== undefined && obj[searchKey] !== "") return obj[searchKey];
                const cleanKey = searchKey.replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
                for (let k in obj) {
                    if (k.replace(/[^a-zA-Z0-9]/g, '').toLowerCase() === cleanKey) return obj[k];
                }
                return "";
            };

            const formatPercent = (val) => {
                let num = parseFloat(val);
                if (isNaN(num)) return String(val || "0%");
                return (num < 1 && num > 0) ? (num * 100).toFixed(1) + "%" : num + "%";
            };

            const shareWA = (p) => {
                const txt = `*${getVal(p, "property_name")}* by ${getVal(p, "builder_name")}\n📍 ${getVal(p, "location")}\n💰 ${getVal(p, "price")}\n📐 ${getVal(p, "bhk")} BHK | ${getVal(p, "super_built_up_a") || getVal(p, "super_built_up_area") || "Area on Request"} Sq.Ft\n\n*View Brochure:* ${getVal(p, "brochure")}`;
                window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`, '_blank');
            };

            if (loading) return <div className="text-center py-20 animate-pulse font-black text-slate-400 tracking-widest uppercase">Loading Library...</div>;

            return (
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 md:gap-8 animate-fadeIn">
                    {data.map(p => (
                        <div key={p.id} className="bg-white rounded-2xl md:rounded-[30px] overflow-hidden shadow-sm border border-slate-200 flex flex-col hover:shadow-lg transition">
                            {/* Image Header */}
                            <div className="relative h-48 md:h-56 bg-slate-100">
                                <img src={getVal(p, "cover_image") || getVal(p, "cover-image") || 'https://via.placeholder.com/600x300?text=No+Image'} className="w-full h-full object-cover" />
                                <div className="absolute top-4 left-4 bg-slate-900/90 backdrop-blur-sm text-white text-[10px] font-black px-3 py-1.5 rounded-lg uppercase tracking-widest shadow-md">
                                    {getVal(p, "property_type") || 'Property'}
                                </div>
                            </div>
                            
                            {/* Body */}
                            <div className="p-5 md:p-8 flex flex-col flex-grow">
                                <div className="flex justify-between items-start mb-6 border-b border-slate-100 pb-5">
                                    <div>
                                        <h3 className="text-xl md:text-2xl font-black uppercase tracking-tighter text-slate-900 leading-tight">{getVal(p, "property_name") || "Unnamed Project"}</h3>
                                        <p className="text-blue-600 font-bold text-xs md:text-sm mt-1">{getVal(p, "builder_name") || "Unknown Builder"}</p>
                                    </div>
                                    <div className="text-right shrink-0">
                                        <div className="text-lg md:text-xl font-black text-slate-900">{getVal(p, "price") || "On Request"}</div>
                                        <div className="text-[9px] md:text-[10px] text-slate-400 font-bold uppercase tracking-widest mt-1">📍 {getVal(p, "location") || "N/A"}</div>
                                    </div>
                                </div>

                                {/* ADMIN ONLY: Internal Details Block */}
                                <div className="grid grid-cols-2 gap-3 md:gap-4 mb-6">
                                    <div className="bg-amber-50 border border-amber-100 p-4 rounded-2xl text-amber-900">
                                        <h4 className="text-[9px] font-black uppercase tracking-widest mb-1 opacity-70">Commission</h4>
                                        <p className="text-lg md:text-xl font-black">{formatPercent(getVal(p, "commission_deta") || getVal(p, "commission") || getVal(p, "commission_percent") || "N/A")}</p>
                                        <p className="text-[9px] md:text-[10px] font-bold mt-1 line-clamp-2">{getVal(p, "payout_info") || "Standard Payout"}</p>
                                    </div>
                                    <div className="bg-sky-50 border border-sky-100 p-4 rounded-2xl text-sky-900">
                                        <h4 className="text-[9px] font-black uppercase tracking-widest mb-2 opacity-70">Internal Info</h4>
                                        <p className="text-[9px] md:text-[10px] font-bold truncate">POC: {getVal(p, "point_of_contact") || getVal(p, "poc") || "N/A"}</p>
                                        <p className="text-[9px] md:text-[10px] font-bold mt-1 truncate">Status: {getVal(p, "construction_sta") || getVal(p, "construction_status") || "N/A"}</p>
                                    </div>
                                </div>

                                {/* Share Action Buttons */}
                                <div className="grid grid-cols-2 md:grid-cols-3 gap-2 mt-auto">
                                    <button onClick={() => shareWA(p)} className="bg-green-500 text-white p-3 rounded-xl text-[9px] md:text-[10px] font-black text-center uppercase tracking-widest shadow-sm hover:-translate-y-1 hover:bg-green-600 transition col-span-2 md:col-span-3 mb-1">
                                        💬 Share via WhatsApp
                                    </button>
                                    
                                    <a href={getVal(p, "brochure") || "#"} target="_blank" className="bg-white border border-slate-200 p-3 rounded-xl text-[9px] font-black text-center uppercase tracking-widest shadow-sm hover:bg-slate-50 transition text-slate-700">Brochure</a>
                                    <a href={getVal(p, "cost_sheet") || "#"} target="_blank" className="bg-white border border-slate-200 p-3 rounded-xl text-[9px] font-black text-center uppercase tracking-widest shadow-sm hover:bg-slate-50 transition text-slate-700">Cost Sheet</a>
                                    <a href={getVal(p, "website_link") || "#"} target="_blank" className="bg-white border border-slate-200 p-3 rounded-xl text-[9px] font-black text-center uppercase tracking-widest shadow-sm hover:bg-slate-50 transition text-slate-700 md:col-span-1 col-span-2">Builder Site</a>
                                </div>
                            </div>
                        </div>
                    ))}
                </div>
            );
        }

        // --- PROPERTY FORM ---
        function PropertyForm({ scriptUrl, supabase }) {
            const [form, setForm] = useState({
                property_name: '', builder_name: '', location: '', price: '', bhk: '', 
                super_built_up_area: '', possession_date: '', construction_status: '',
                amenities: '', brochure: '', cover_image: '', usps: '',
                commission_deta: '', point_of_contact: '', website_link: ''
            });

            async function upload(e, field) {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = async () => {
                    const res = await fetch(scriptUrl, { method: "POST", body: JSON.stringify({ base64: reader.result.split(',')[1], type: file.type, name: file.name, propertyName: form.property_name }) });
                    const result = await res.json();
                    if(result.status === "success") setForm(f => ({ ...f, [field]: result.url }));
                };
            }

            async function save() {
                const { error } = await supabase.from('properties').insert([form]);
                if (!error) alert("Listing Live!");
                else alert(error.message);
            }

            return (
                <div className="bg-white p-6 md:p-10 rounded-3xl shadow-sm max-w-4xl mx-auto space-y-6 animate-fadeIn border border-slate-200">
                    <h2 className="text-2xl font-black uppercase italic border-b pb-4 text-blue-900">Master Property Listing</h2>
                    
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <input placeholder="Property Name" className="p-4 bg-slate-50 border rounded-xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500" onChange={e => setForm({...form, property_name: e.target.value})} />
                        <input placeholder="Builder Name" className="p-4 bg-slate-50 border rounded-xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500" onChange={e => setForm({...form, builder_name: e.target.value})} />
                        <input placeholder="Location" className="p-4 bg-slate-50 border rounded-xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500" onChange={e => setForm({...form, location: e.target.value})} />
                        <input placeholder="Starting Price (e.g. 1.2 Cr)" className="p-4 bg-slate-50 border rounded-xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500" onChange={e => setForm({...form, price: e.target.value})} />
                        <input placeholder="BHK (e.g. 2, 3 BHK)" className="p-4 bg-slate-50 border rounded-xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500" onChange={e => setForm({...form, bhk: e.target.value})} />
                        <input placeholder="Super Built-up Area" className="p-4 bg-slate-50 border rounded-xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500" onChange={e => setForm({...form, super_built_up_area: e.target.value})} />
                        <input placeholder="Possession Date" className="p-4 bg-slate-50 border rounded-xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500" onChange={e => setForm({...form, possession_date: e.target.value})} />
                        <input placeholder="Construction Status" className="p-4 bg-slate-50 border rounded-xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500" onChange={e => setForm({...form, construction_status: e.target.value})} />
                        <input placeholder="USP's (Special points)" className="p-4 bg-slate-50 border rounded-xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500" onChange={e => setForm({...form, usps: e.target.value})} />
                    </div>

                    <div className="p-5 bg-amber-50 border border-amber-100 rounded-2xl grid grid-cols-1 md:grid-cols-2 gap-4">
                        <h3 className="col-span-1 md:col-span-2 text-[10px] font-black text-amber-900 uppercase tracking-widest">Admin Details (Hidden from Public)</h3>
                        <input placeholder="Commission % (e.g. 3%)" className="p-4 bg-white border rounded-xl font-bold text-sm outline-none" onChange={e => setForm({...form, commission_deta: e.target.value})} />
                        <input placeholder="Point of Contact (Name/Number)" className="p-4 bg-white border rounded-xl font-bold text-sm outline-none" onChange={e => setForm({...form, point_of_contact: e.target.value})} />
                    </div>
                    
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 pt-6 border-t">
                        <div><label className="text-[10px] font-black uppercase mb-2 block text-slate-500 tracking-widest">Cover Image</label><input type="file" onChange={e => upload(e, 'cover_image')} className="text-xs" /></div>
                        <div><label className="text-[10px] font-black uppercase mb-2 block text-slate-500 tracking-widest">Brochure (PDF)</label><input type="file" onChange={e => upload(e, 'brochure')} className="text-xs" /></div>
                    </div>
                    
                    <button onClick={save} className="w-full bg-blue-600 text-white p-5 rounded-2xl font-black uppercase tracking-widest hover:bg-slate-900 shadow-xl transition">Publish Master Listing</button>
                </div>
            );
        }

        // --- MISC COMPONENTS ---
        function ManualLeadForm({ supabase, onSuccess }) {
            const [form, setForm] = useState({ name: '', phone: '', source: 'Manual' });
            return (
                <div className="space-y-4">
                    <input placeholder="Client Name" className="w-full p-4 bg-slate-50 border rounded-2xl font-bold" onChange={e => setForm({...form, name: e.target.value})} />
                    <input placeholder="Phone Number" className="w-full p-4 bg-slate-50 border rounded-2xl font-bold" onChange={e => setForm({...form, phone: e.target.value})} />
                    <button onClick={async () => { await supabase.from('leads').insert([{ customer_name: form.name, phone_number: form.phone, lead_source: form.source, lead_status: 'Un called' }]); onSuccess(); }} className="w-full bg-blue-600 text-white p-4 rounded-2xl font-black uppercase tracking-widest">Inject Lead</button>
                </div>
            );
        }

        function LoginForm({ supabase }) {
            const [email, setEmail] = useState("");
            const [pass, setPass] = useState("");
            return (
                <div className="min-h-screen bg-slate-950 flex items-center justify-center p-4">
                    <form onSubmit={async (e) => { e.preventDefault(); await supabase.auth.signInWithPassword({ email, password: pass }); }} className="bg-white p-10 rounded-[40px] shadow-2xl w-full max-w-sm text-center border-t-8 border-blue-500">
                        <h1 className="text-3xl font-black italic uppercase mb-8">Horizon CRM</h1>
                        <input type="email" placeholder="Email" className="w-full p-4 bg-slate-100 rounded-2xl mb-4 font-bold outline-none" onChange={e => setEmail(e.target.value)} />
                        <input type="password" placeholder="Password" className="w-full p-4 bg-slate-100 rounded-2xl mb-8 font-bold outline-none" onChange={e => setPass(e.target.value)} />
                        <button className="w-full bg-blue-600 text-white font-black py-4 rounded-2xl uppercase tracking-widest shadow-lg">Login</button>
                    </form>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AdminApp />);
    </script>
</body>
</html>
