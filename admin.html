const getInitialRoute = () => {
    const hash = window.location.hash.replace('#', '');
    if (hash.startsWith('/library'))    return { v:'library',   c:'website' };
    if (hash.startsWith('/add'))        return { v:'add',       c:'website' };
    if (hash.startsWith('/admin'))      return { v:'admin',     c:'website' };
    if (hash.startsWith('/crm/bulk'))   return { v:'dashboard', c:'bulk' };
    if (hash.startsWith('/crm/manual')) return { v:'dashboard', c:'manual' };
    return { v:'dashboard', c:'website' };
};

// ─── ADMIN APP ─────────────────────────────────────────────────────────────
function AdminApp() {
    const initRoute = getInitialRoute();
    const [session,        setSession]        = useState(null);
    const [authChecking,   setAuthChecking]   = useState(true);
    const [leads,          setLeads]          = useState([]);
    const [allLeadsAdmin,  setAllLeadsAdmin]  = useState([]);
    const [allBulkAdmin,   setAllBulkAdmin]   = useState([]);
    const [allManualAdmin, setAllManualAdmin] = useState([]);
    const [properties,     setProperties]     = useState([]);
    const [editingProp,    setEditingProp]    = useState(null);
    const [view,           setView]           = useState(initRoute.v);
    const [leadCategory,   setLeadCategory]   = useState(initRoute.c);
    const [loading,        setLoading]        = useState(true);
    const [showManualModal,setShowManualModal] = useState(false);
    const [summaryAgent,   setSummaryAgent]   = useState(ADMIN_AGENT_NAME || 'All');
    const [selectedProp,   setSelectedProp]   = useState(null);
    const [selectedLead,   setSelectedLead]   = useState(null);
    const [visibleCount,   setVisibleCount]   = useState(50);
    const [searchTerm,     setSearchTerm]     = useState("");
    const [deferredPrompt, setDeferredPrompt] = useState(null);
    const [sessionTimeLeft,setSessionTimeLeft]= useState('');
    const [leadBucket,     setLeadBucket]     = useState('new');
    const [showBulkUpload, setShowBulkUpload] = useState(false);
    const [scheduleFilter, setScheduleFilter] = useState('ALL');
    const [priorityFilter, setPriorityFilter] = useState('ALL');
    // FIX 4: Mobile menu drawer state
    const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
    const prevLeadsRef = useRef(0);

    const userEmail    = session?.user?.email || '';
    const agentName    = getAgentFromEmail(userEmail);
    const isAdminUser  = agentName === '__ADMIN__';
    const isKnownAgent = agentName && agentName !== '__ADMIN__' && agentName !== '__UNKNOWN__';

    // Session countdown
    useEffect(() => {
        const tick = () => {
            const stored = localStorage.getItem('__crm_login_time');
            if (!stored) { setSessionTimeLeft(''); return; }
            const remaining = (3 * 60 * 60 * 1000) - (Date.now() - parseInt(stored, 10));
            if (remaining <= 0) { setSessionTimeLeft('Expired'); return; }
            const h  = Math.floor(remaining / 3600000);
            const m  = Math.floor((remaining % 3600000) / 60000);
            const s  = Math.floor((remaining % 60000) / 1000);
            setSessionTimeLeft(h > 0 ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`);
        };
        tick();
        const interval = setInterval(tick, 1000);
        return () => clearInterval(interval);
    }, []);

    useEffect(() => {
        if (!session) return;
        const email = session.user?.email || '';
        if (email === ADMIN_EMAIL) setSummaryAgent(ADMIN_AGENT_NAME || 'All');
        else { const name = AGENT_EMAIL_MAP[email]; if (name) setSummaryAgent(name); }
    }, [session]);

    useEffect(() => {
        if (session) registerPushNotifications();
    }, [session]);

    useEffect(() => {
        const handler = (e) => { e.preventDefault(); setDeferredPrompt(e); };
        window.addEventListener('beforeinstallprompt', handler);
        return () => window.removeEventListener('beforeinstallprompt', handler);
    }, []);

    const handleInstallClick = async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') setDeferredPrompt(null);
    };

    useEffect(() => {
        const onHashChange = () => {
            const r = getInitialRoute(); setView(r.v); setLeadCategory(r.c);
            if (r.v !== 'add') setEditingProp(null);
        };
        window.addEventListener('hashchange', onHashChange);
        return () => window.removeEventListener('hashchange', onHashChange);
    }, []);

    const handleNavigate = (newView, newCat='website') => {
        setView(newView);
        if (newView === 'dashboard') setLeadCategory(newCat);
        if (newView !== 'add') setEditingProp(null);
        const path = newView === 'dashboard' ? `/crm/${newCat}` : `/${newView}`;
        window.location.hash = path;
        setMobileMenuOpen(false); // close drawer on navigate
    };

    useEffect(() => { setVisibleCount(50); }, [leadCategory, leadBucket, scheduleFilter, summaryAgent, searchTerm, priorityFilter]);

    const AUTO_LOGOUT_MS = 3 * 60 * 60 * 1000;
    const logoutTimerRef = useRef(null);
    const rescheduleFromStored = useCallback(() => {
        if (logoutTimerRef.current) clearTimeout(logoutTimerRef.current);
        const stored = localStorage.getItem('__crm_login_time');
        if (!stored) return;
        const remaining = AUTO_LOGOUT_MS - (Date.now() - parseInt(stored, 10));
        if (remaining <= 0) { supabase.auth.signOut(); localStorage.removeItem('__crm_login_time'); }
        else { logoutTimerRef.current = setTimeout(async () => { await supabase.auth.signOut(); localStorage.removeItem('__crm_login_time'); alert('Session expired after 3 hours. Please log in again.'); }, remaining); }
    }, []);

    useEffect(() => {
        supabase.auth.getSession().then(({ data: { session } }) => {
            setSession(session); setAuthChecking(false);
            if (window.__dismissSplash) window.__dismissSplash();
            if (session) { if (!localStorage.getItem('__crm_login_time')) localStorage.setItem('__crm_login_time', String(Date.now())); rescheduleFromStored(); }
        });
        const { data: { subscription } } = supabase.auth.onAuthStateChange((event, s) => {
            setSession(s);
            if ((event === 'SIGNED_IN' || event === 'INITIAL_SESSION') && s) { if (!localStorage.getItem('__crm_login_time')) localStorage.setItem('__crm_login_time', String(Date.now())); rescheduleFromStored(); }
            else if (event === 'SIGNED_OUT') { if (logoutTimerRef.current) clearTimeout(logoutTimerRef.current); localStorage.removeItem('__crm_login_time'); }
        });
        return () => { subscription.unsubscribe(); if (logoutTimerRef.current) clearTimeout(logoutTimerRef.current); };
    }, [rescheduleFromStored]);

    useEffect(() => {
        if (!session) return;
        fetchProperties();
        if (view === 'dashboard' && agentName) fetchLeads();
    }, [session, view, leadCategory, agentName]);

    useEffect(() => {
        if (session && view === 'admin' && isAdminUser) fetchAllForAdmin();
    }, [session, view, isAdminUser]);

    async function fetchLeads() {
        setLoading(true);
        const table = leadCategory === 'bulk' ? 'bulk_leads' : 'leads';
        const { data, error } = await supabase.from(table).select('*').order('created_at', { ascending:false });
        if (!error) {
            let raw = data || [];
            if (table === 'leads') {
                if (leadCategory === 'website') raw = raw.filter(l => !l.lead_source || l.lead_source.trim() === '' || l.lead_source.toLowerCase().includes('website'));
                else if (leadCategory === 'manual') raw = raw.filter(l => l.lead_source && l.lead_source.trim() !== '' && !l.lead_source.toLowerCase().includes('website'));
            }
            if (!isAdminUser) {
                if (agentName === '__UNKNOWN__') raw = [];
                else if (agentName) {
                    if (leadCategory === 'website') raw = raw.filter(l => !l.psa_agent_name || l.psa_agent_name === agentName);
                    else raw = raw.filter(l => l.psa_agent_name === agentName);
                } else raw = [];
            }
            if (leadCategory === 'website' && prevLeadsRef.current > 0 && raw.length > prevLeadsRef.current) {
                const newest = raw[0];
                if (window.__showNotification) window.__showNotification('🏠 New Lead!', (newest.customer_name || 'Unknown') + ' · ' + (newest.phone_number || ''));
            }
            prevLeadsRef.current = raw.length;
            setLeads(raw);
        }
        setLoading(false);
    }

    async function deleteLead(lead) {
        const confirmed = window.confirm('Delete this lead?\n\nName: ' + lead.customer_name + '\nPhone: ' + lead.phone_number + '\n\nData is kept in the database.');
        if (!confirmed) return;
        const table = leadCategory === 'bulk' ? 'bulk_leads' : 'leads';
        setLeads(prev => prev.filter(l => l.id !== lead.id));
        const { error } = await supabase.from(table).update({ is_hidden: true }).eq('id', lead.id);
        if (error) { alert('Error: ' + error.message); fetchLeads(); }
    }

    async function fetchAllForAdmin() {
        const [{ data: websiteData }, { data: bulkData }, { data: manualData }] = await Promise.all([
            supabase.from('leads').select('*').order('created_at', { ascending:false }),
            supabase.from('bulk_leads').select('*').order('created_at', { ascending:false }),
            supabase.from('leads').select('*').order('created_at', { ascending:false }),
        ]);
        setAllLeadsAdmin((websiteData||[]).filter(l => !l.lead_source || l.lead_source.toLowerCase().includes('website') || l.lead_source.trim() === ''));
        setAllBulkAdmin(bulkData||[]);
        setAllManualAdmin((manualData||[]).filter(l => l.lead_source && !l.lead_source.toLowerCase().includes('website')));
    }

    async function fetchProperties() {
        const { data } = await supabase.from('properties').select('*').order('display_order', { ascending:true });
        setProperties(data || []);
    }

    async function updateLead(lead, field, value) {
        const shouldClaim = !isAdminUser && leadCategory === 'website' && !lead.psa_agent_name && agentName && agentName !== '__UNKNOWN__';
        if (shouldClaim) {
            setLeads(prev => prev.map(l => l.id === lead.id ? { ...l, psa_agent_name: agentName } : l));
            await supabase.from('leads').update({ psa_agent_name: agentName }).eq('id', lead.id);
            lead = { ...lead, psa_agent_name: agentName };
        }
        let updates = {};
        const stamp     = new Date().toLocaleString('en-IN', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
        const actorName = isAdminUser ? (ADMIN_AGENT_NAME || 'Admin') : (agentName || lead.psa_agent_name || 'Unknown');
        if (field === 'lead_status')        { updates.lead_status   = value; updates.call_remark = `[${stamp}] [${actorName}] Status → ${value}\n\n${lead.call_remark||''}`; }
        else if (field === 'follow_up_at')  { updates.follow_up_at  = value; updates.call_remark = `[${stamp}] [${actorName}] Callback Set: ${new Date(value).toLocaleString('en-IN',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}\n\n${lead.call_remark||''}`; }
        else if (field === 'site_visit_at') { updates.site_visit_at = value; updates.call_remark = `[${stamp}] [${actorName}] SV Booked: ${value}\n\n${lead.call_remark||''}`; }
        else if (field === 'add_note')      { if (!value.trim()) return; updates.add_note = value; updates.call_remark = `[${stamp}] [${actorName}] Note: ${value}\n\n${lead.call_remark||''}`; }
        else if (field === 'reject_reason') { updates.reject_reason = value; updates.call_remark = `[${stamp}] [${actorName}] Rejected: ${value}\n\n${lead.call_remark||''}`; }
        else if (field === 'psa_agent_name'){ updates.psa_agent_name = value; updates.call_remark = `[${stamp}] [Admin] ${lead.psa_agent_name ? 'Reassigned: ' + lead.psa_agent_name + ' → ' + value : 'Assigned to ' + value}\n\n${lead.call_remark||''}`; }
        else                                { updates[field] = value; }
        const table = leadCategory === 'bulk' ? 'bulk_leads' : 'leads';
        if (field === 'psa_agent_name') {
            if (isAdminUser) setLeads(prev => prev.map(l => l.id === lead.id ? { ...l, ...updates } : l));
            else setLeads(prev => prev.filter(l => l.id !== lead.id));
        } else {
            setLeads(prev => prev.map(l => l.id === lead.id ? { ...l, ...updates } : l));
        }
        const { error } = await supabase.from(table).update(updates).eq('id', lead.id);
        if (error) { alert("Save error: " + error.message); fetchLeads(); }
        else if (field === 'psa_agent_name') setTimeout(() => fetchLeads(), 500);
    }

    const displayedLeads = useMemo(() => {
        let f = searchTerm.trim()
            ? leads.filter(l => !l.is_hidden)
            : filterLeadsByBucket(leads.filter(l => !l.is_hidden), leadBucket);
        const today = new Date().toISOString().split('T')[0];
        if (scheduleFilter === 'TODAY_CB')       f = f.filter(l => l.follow_up_at?.startsWith(today));
        else if (scheduleFilter === 'TODAY_SV')  f = f.filter(l => l.site_visit_at === today);
        else if (scheduleFilter === 'MISSED_CB') f = f.filter(l => l.follow_up_at && l.follow_up_at < today && !['Rejected','Converted'].includes(l.lead_status));
        else if (scheduleFilter === 'MISSED_SV') f = f.filter(l => l.site_visit_at && l.site_visit_at < today && !['Rejected','Converted'].includes(l.lead_status));
        if (priorityFilter !== 'ALL') f = f.filter(l => (l.lead_priority||'Warm') === priorityFilter);
        if (isAdminUser && summaryAgent !== 'All') f = f.filter(l => l.psa_agent_name === summaryAgent);
        if (searchTerm.trim()) {
            const t = searchTerm.toLowerCase();
            f = f.filter(l => (l.customer_name||'').toLowerCase().includes(t) || (l.phone_number||'').toLowerCase().includes(t) || (l.project_interested_in||'').toLowerCase().includes(t));
        }
        return f;
    }, [leads, leadBucket, scheduleFilter, priorityFilter, summaryAgent, searchTerm, isAdminUser]);

    const visibleLeads = displayedLeads.slice(0, visibleCount);

    const stats = useMemo(() => {
        let t = leads.filter(l => !l.is_hidden && l.lead_status !== 'Rejected');
        if (summaryAgent !== 'All') t = t.filter(l => l.psa_agent_name === summaryAgent);
        return {
            total:     t.length,
            uncalled:  t.filter(l => !l.lead_status || l.lead_status === 'Un called').length,
            called:    t.filter(l => l.lead_status && l.lead_status !== 'Un called').length,
            converted: t.filter(l => l.lead_status === 'Converted').length,
            rejected:  leads.filter(l => !l.is_hidden && l.lead_status === 'Rejected').length,
        };
    }, [leads, summaryAgent]);

    // ─── FIX 1: Simplified status change — no prompt() dialogs ───────────────
    // Status is set immediately; RNR bucket move happens when agent sets callback date
    // Rejected bucket move happens when agent picks reject reason from inline dropdown
    const handleStatusChange = (l, newStatus) => {
        updateLead(l, 'lead_status', newStatus);
        // For RNR: a hint/toast that callback date must be set to move to Open bucket
        // For Rejected: the inline dropdown already handles reject_reason
    };

    if (authChecking) return <div className="min-h-screen bg-slate-950"></div>;
    if (!session) return <LoginForm supabase={supabase} />;
    if (selectedProp) return <PropertyDetailsPage property={selectedProp} onBack={() => setSelectedProp(null)} />;

    // ─── FIX 4: Desktop nav items (all) + mobile nav items (CRM only) ─────────
    const allNavItems = [
        { id:'dashboard', label:'📊 CRM',     mobileLabel:'CRM',     showMobile:true  },
        { id:'library',   label:'🏢 Library',  mobileLabel:'Library', showMobile:false },
        { id:'add',       label:'➕ Property', mobileLabel:'Add',     showMobile:false },
        ...(isAdminUser ? [{ id:'admin', label:'🛡️ Admin', mobileLabel:'Admin', showMobile:false }] : []),
    ];

    // Drawer items (mobile menu)
    const drawerItems = [
        { id:'library', label:'🏢 Property Library', desc:'Browse & manage listings' },
        { id:'add',     label:'➕ Add Property',      desc:'Publish a new listing' },
        ...(isAdminUser ? [{ id:'admin', label:'🛡️ Admin Overview', desc:'Agent stats & performance' }] : []),
    ];

    return (
        <div className="min-h-screen flex flex-col animate-fadeIn">
            {selectedLead && <LeadDetailModal lead={selectedLead} onClose={() => setSelectedLead(null)} leadCategory={leadCategory} userEmail={userEmail} />}

            {/* ─── FIX 4: Mobile drawer ───────────────────────────────────────── */}
            {mobileMenuOpen && (
                <>
                    <div className="mobile-drawer-overlay md:hidden" onClick={() => setMobileMenuOpen(false)} />
                    <div className="mobile-drawer md:hidden animate-slideInRight">
                        <div className="flex items-center justify-between mb-8">
                            <div>
                                <div className="text-white font-black text-lg italic uppercase">Menu</div>
                                <div className="text-slate-400 text-[9px] font-bold uppercase tracking-widest mt-0.5">
                                    {isAdminUser ? `🛡️ Admin · ${ADMIN_AGENT_NAME}` : `👤 ${agentName}`}
                                </div>
                            </div>
                            <button onClick={() => setMobileMenuOpen(false)} className="w-9 h-9 rounded-full bg-slate-800 flex items-center justify-center text-slate-400 hover:text-white font-black transition">✕</button>
                        </div>
                        <div className="space-y-2 flex-1">
                            {drawerItems.map(item => (
                                <button key={item.id} onClick={() => handleNavigate(item.id)}
                                    className={`w-full flex items-start gap-3 p-4 rounded-2xl text-left transition border ${view === item.id ? 'bg-blue-600 border-blue-500 text-white' : 'bg-slate-800 border-slate-700 text-slate-300 hover:bg-slate-700'}`}>
                                    <div className="flex-1">
                                        <div className="font-black text-sm">{item.label}</div>
                                        <div className={`text-[9px] font-bold mt-0.5 ${view === item.id ? 'text-blue-200' : 'text-slate-500'}`}>{item.desc}</div>
                                    </div>
                                    <span className="text-slate-500 mt-0.5">›</span>
                                </button>
                            ))}
                        </div>
                        {deferredPrompt && (
                            <button onClick={handleInstallClick} className="w-full mt-4 flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-500 text-white font-black py-3 rounded-2xl text-[10px] uppercase tracking-widest transition">
                                ⬇ Install App
                            </button>
                        )}
                        {sessionTimeLeft && (
                            <div className="mt-3 flex items-center justify-center gap-2 text-[9px] font-black text-amber-400 bg-amber-900/20 border border-amber-800/40 px-3 py-2 rounded-xl">
                                ⏱ Session: {sessionTimeLeft}
                            </div>
                        )}
                    </div>
                </>
            )}

            <nav className="bg-slate-900 text-white px-4 md:px-8 py-3 flex justify-between items-center sticky top-0 z-50 shadow-lg border-b border-slate-800">
                <div className="flex items-center gap-3">
                    <h1 className="font-black tracking-tighter text-lg md:text-xl uppercase italic">Horizon <span className="text-blue-400">CRM</span></h1>
                    {/* Desktop only: user badge and session timer */}
                    {userEmail && <span className="hidden md:block text-[9px] font-bold text-slate-500 bg-slate-800 border border-slate-700 px-2 py-1 rounded-lg uppercase tracking-widest truncate max-w-[180px]">{isAdminUser ? (ADMIN_AGENT_NAME ? `🛡️ Admin · ${ADMIN_AGENT_NAME}` : '🛡️ Admin') : `👤 ${agentName||userEmail.split('@')[0]}`}</span>}
                    {sessionTimeLeft && <span className="hidden md:flex items-center gap-1 text-[9px] font-black text-amber-400 bg-amber-900/30 border border-amber-800/50 px-2 py-1 rounded-lg tracking-widest" title="Session expires 3 hours after login">⏱ {sessionTimeLeft}</span>}
                </div>
                <div className="flex gap-1.5 items-center">
                    {/* Desktop: show all nav items */}
                    {allNavItems.map(n => (
                        <button key={n.id} onClick={() => handleNavigate(n.id, n.id === 'dashboard' ? leadCategory : 'website')}
                            className={`hidden md:block px-4 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest transition ${view === n.id ? 'bg-blue-600 text-white shadow-md' : 'text-slate-400 hover:text-white hover:bg-slate-800'}`}>

                    {/* Mobile: only CRM button */}
                    <button onClick={() => handleNavigate('dashboard', leadCategory)}

                        📊 CRM
                    </button>
                    {deferredPrompt && <button onClick={handleInstallClick} className="hidden md:flex items-center gap-1 ml-1 px-3 py-2 rounded-xl text-[9px] font-black uppercase tracking-widest bg-indigo-600 hover:bg-indigo-500 text-white transition shadow-md">⬇ Install</button>}
                    <button onClick={() => supabase.auth.signOut()} className="text-[9px] font-black uppercase tracking-widest text-red-400 border border-red-900/60 px-2.5 py-2 rounded-xl hover:bg-red-900/40 transition">

                        <span className={`block w-4 h-0.5 bg-white rounded-full transition-all ${mobileMenuOpen ? '-rotate-45 -translate-y-[7px]' : ''}`}></span>
                    </button>

            </nav>

            <main className="p-3 md:p-8 max-w-7xl mx-auto w-full pb-24 md:pb-8">

                {view === 'admin' && isAdminUser && (

                {view === 'dashboard' && (

                            <div className="flex flex-wrap md:grid md:grid-cols-6 gap-3 items-center">
                                {isAdminUser && (
                                    <div className="w-full md:w-auto">
                                        <select className="bg-transparent outline-none cursor-pointer text-slate-700 text-[10px] font-black uppercase w-full border border-slate-200 rounded-xl px-3 py-2 focus:ring-2 focus:ring-blue-500" value={summaryAgent} onChange={e => setSummaryAgent(e.target.value)}>
                                            <option value="All">📊 All Agents</option>
                                            {PSA_AGENTS.map(a => <option key={a.value} value={a.value}>{a.label}</option>)}
                                        </select>
                                    </div>
                                )}
                                {[
                                    { label:'Active',    val:stats.total,     bg:'bg-slate-50',  tc:'text-slate-700', bc:'border-slate-100' },
                                    { label:'Uncalled',  val:stats.uncalled,  bg:'bg-amber-50',  tc:'text-amber-600', bc:'border-amber-100' },
                                    { label:'Working',   val:stats.called,    bg:'bg-blue-50',   tc:'text-blue-600',  bc:'border-blue-100' },
                                    { label:'Converted', val:stats.converted, bg:'bg-green-50',  tc:'text-green-600', bc:'border-green-100' },
                                    { label:'Rejected',  val:stats.rejected,  bg:'bg-red-50',    tc:'text-red-600',   bc:'border-red-100' },
                                ].map(s => (
                                    <div key={s.label} className={`flex flex-col items-center flex-1 p-3 rounded-2xl ${s.bg} border ${s.bc}`}>
                                        <span className="text-[9px] uppercase font-black text-slate-400 mb-1">{s.label}</span>
                                        <span className={`font-black ${s.tc} text-2xl leading-none`}>{s.val}</span>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Channel + filters */}
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
                            <div className="flex gap-2 bg-white border border-slate-200 rounded-2xl p-1.5 shadow-sm">
                                {[{id:'website',label:'🌐 Website'},{id:'bulk',label:'📦 Bulk'},{id:'manual',label:'✍️ Manual'}].map(c => (
                                    <button key={c.id} onClick={() => { handleNavigate('dashboard', c.id); setVisibleCount(50); setLeadBucket('new'); }}
                                        className={`px-4 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all ${leadCategory===c.id?'bg-blue-600 text-white shadow-md':'text-slate-500 hover:text-slate-800 hover:bg-slate-50'}`}>{c.label}</button>
                                ))}
                            </div>
                            <div className="flex gap-2 items-center flex-wrap">
                                <select value={scheduleFilter} onChange={e => setScheduleFilter(e.target.value)} className="px-3 py-2.5 rounded-2xl text-[9px] font-black uppercase border-2 bg-white text-slate-600 shadow-sm outline-none focus:ring-2 focus:ring-blue-500 border-slate-200 cursor-pointer">
                                    <option value="ALL">📋 All Schedule</option>
                                    <option value="TODAY_CB">📅 Today Callbacks</option>
                                    <option value="TODAY_SV">📅 Today Site Visits</option>
                                    <option value="MISSED_CB">⚠️ Missed Callbacks</option>
                                    <option value="MISSED_SV">⚠️ Missed Site Visits</option>
                                </select>
                                <select value={priorityFilter} onChange={e => setPriorityFilter(e.target.value)} className="px-3 py-2.5 rounded-2xl text-[9px] font-black uppercase border-2 bg-white text-slate-600 shadow-sm outline-none focus:ring-2 focus:ring-blue-500 border-slate-200 cursor-pointer">
                                    <option value="ALL">🌡️ All Priority</option>
                                    <option value="Hot">🔥 Hot</option>
                                    <option value="Warm">🌤 Warm</option>
                                    <option value="Cold">❄️ Cold</option>
                                </select>
                                <button onClick={() => setShowManualModal(true)} className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2.5 rounded-2xl text-[9px] font-black uppercase shadow-md shrink-0 transition border border-blue-500">+ Lead</button>
                                {isAdminUser && leadCategory === 'bulk' && (
                                    <button onClick={() => setShowBulkUpload(v => !v)} className={`px-4 py-2.5 rounded-2xl text-[9px] font-black uppercase shadow-md shrink-0 transition border ${showBulkUpload ? 'bg-amber-500 text-white border-amber-400' : 'bg-white text-slate-700 border-slate-200 hover:border-blue-400'}`}>
                                        📤 {showBulkUpload ? 'Hide Uploader' : 'Upload CSV'}
                                    </button>
                                )}
                            </div>
                        </div>

                        {isAdminUser && leadCategory === 'bulk' && showBulkUpload && (
                            <BulkCSVUploader supabase={supabase} onSuccess={() => { setShowBulkUpload(false); fetchLeads(); }} />
                        )}

                        {!isAdminUser && agentName && agentName !== '__UNKNOWN__' && agentName !== '__ADMIN__' && (
                            <AdminNotesBanner agentName={agentName} />
                        )}

                        {/* Bucket tabs */}
                        <div className="flex gap-2 overflow-x-auto hide-scroll pb-1">
                            {LEAD_BUCKETS.map(b => {
                                const agentFiltered = leads.filter(l => { if (l.is_hidden) return false; if (isAdminUser && summaryAgent !== 'All') return l.psa_agent_name === summaryAgent; return true; });
                                const count = filterLeadsByBucket(agentFiltered, b.id).length;
                                const isActive = leadBucket === b.id;
                                return (
                                    <button key={b.id} onClick={() => setLeadBucket(b.id)}
                                        className={`flex items-center gap-2 px-4 py-2.5 rounded-2xl text-[10px] font-black uppercase tracking-wider transition-all shrink-0 border ${isActive ? `${b.color} text-white border-transparent shadow-lg scale-[1.02]` : 'bg-white text-slate-500 border-slate-200 hover:border-slate-300 hover:text-slate-700'}`}>
                                        <span>{b.emoji}</span>
                                        <span>{b.label.replace(/^[^\s]+\s/,'')}</span>
                                        <span className={`text-[9px] font-black px-1.5 py-0.5 rounded-full ${isActive ? 'bg-white/25 text-white' : 'bg-slate-100 text-slate-500'}`}>{count}</span>
                                    </button>
                                );
                            })}
                        </div>

                        {/* Search */}
                        <div className="relative">
                            <input type="text" placeholder="Search name, phone or project..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)}
                                className="w-full p-4 pl-12 pr-28 bg-white border-2 border-slate-200 rounded-2xl text-xs font-bold shadow-sm outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-300 transition-all" />
                            <span className="absolute left-4 top-1/2 -translate-y-1/2 text-lg opacity-40 pointer-events-none">🔍</span>
                            <div className="absolute right-3 top-1/2 -translate-y-1/2 flex items-center gap-2">
                                {!loading && <span className="text-[9px] font-black text-slate-400 bg-slate-100 px-2 py-1 rounded-lg tracking-widest">{displayedLeads.length}</span>}
                                {searchTerm && <button onClick={() => setSearchTerm("")} className="text-[9px] font-black text-red-400 hover:text-red-600 bg-red-50 border border-red-200 px-2 py-1 rounded-lg uppercase tracking-widest">✕</button>}
                            </div>
                        </div>

                        {/* ── Desktop Table ── */}
                        <div className="hidden lg:block bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                            {loading ? (
                                <div className="p-6 space-y-3">{[...Array(6)].map((_,i) => <div key={i} className="flex gap-4"><div className="skeleton h-14 flex-1 rounded-xl"></div><div className="skeleton h-14 w-44 rounded-xl"></div><div className="skeleton h-14 w-36 rounded-xl"></div><div className="skeleton h-14 flex-1 rounded-xl"></div></div>)}</div>
                            ) : visibleLeads.length === 0 ? (
                                <div className="py-20 flex flex-col items-center text-center"><div className="text-5xl mb-4">🔍</div><div className="text-sm font-black uppercase tracking-widest text-slate-400 mb-1">No leads found</div><div className="text-[10px] text-slate-400 font-medium">Try adjusting your filter or search term</div></div>
                            ) : (
                                <table className="w-full text-left text-xs">
                                    <thead className="bg-slate-900 text-slate-400 font-black uppercase text-[9px] tracking-widest">
                                        <tr>
                                            <th className="px-5 py-3.5">Customer</th>
                                            <th className="px-5 py-3.5">Agent & Status</th>
                                            <th className="px-5 py-3.5">Scheduling</th>
                                            <th className="px-5 py-3.5 min-w-[260px]">Activity & Notes</th>
                                            <th className="px-5 py-3.5 w-16">Detail</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100">
                                        {visibleLeads.map(l => (
                                            <tr key={l.id} className={`border-l-[5px] hover:brightness-[0.97] transition-all ${l.lead_priority==='Hot'?'border-l-red-500':l.lead_priority==='Cold'?'border-l-blue-400':'border-l-amber-400'} ${getCardTint(l.lead_status)}`}>
                                                <td className="px-5 py-4 min-w-[200px]">
                                                    <p className="font-black text-[11px] uppercase text-slate-900 leading-tight">{l.customer_name}</p>
                                                    <p className="text-blue-600 font-black text-[11px] mt-0.5">{l.phone_number}</p>
                                                    {l.customer_email && <p className="text-slate-400 text-[9px] mt-0.5 lowercase truncate font-medium max-w-[160px]">{l.customer_email}</p>}
                                                    {(isAdminUser || l.lead_source !== 'Bulk Upload') && <p className="text-[8px] text-slate-500 font-bold mt-1.5 tracking-widest uppercase truncate max-w-[160px]">🏠 {l.project_interested_in||'General'}</p>}
                                                    <p className="text-[8px] text-slate-400 font-bold mt-1 tracking-widest uppercase">🕐 {formatDateTime(l.created_at)}</p>
                                                    {l.psa_agent_name && <p className="text-[8px] text-blue-500 font-bold mt-0.5 tracking-widest uppercase">👤 {l.psa_agent_name}</p>}
                                                    <div className="mt-2.5 flex gap-1.5">
                                                        <a href={`tel:${l.phone_number}`} className="bg-slate-100 text-slate-600 text-[8px] font-black px-2.5 py-1.5 rounded-lg uppercase tracking-widest hover:bg-slate-200 transition border border-slate-200">📞 Call</a>

                                                    {!isAdminUser && l.psa_agent_name && <div className="text-[8px] font-black text-blue-400 bg-slate-900 border border-slate-700 px-2 py-1.5 rounded-xl mb-2 uppercase tracking-widest">👤 {l.psa_agent_name}</div>}
                                                    <select onChange={e => handleStatusChange(l, e.target.value)} value={l.lead_status||''} className={`w-full p-2 mb-2 border-2 rounded-xl font-black uppercase text-[9px] outline-none cursor-pointer ${getStatusStyles(l.lead_status)}`}>
                                                        {(!l.lead_status||l.lead_status==='Un called')&&<option value="Un called">🔵 Un called</option>}
                                                        <option value="Called">✅ Called</option><option value="RNR">🔔 RNR</option><option value="Details Shared">📤 Details Shared</option><option value="SV Scheduled">📅 SV Scheduled</option><option value="Converted">🏆 Converted</option><option value="Rejected">❌ Rejected</option>
                                                    </select>
                                                    {/* FIX 1: Inline hint for RNR bucket behavior */}
                                                    {l.lead_status === 'RNR' && !l.follow_up_at && (
                                                        <div className="text-[8px] font-bold text-orange-600 bg-orange-50 border border-orange-200 px-2 py-1 rounded-lg mb-2">
                                                            ⚠️ Set callback date → moves to Open
                                                        </div>
                                                    )}
                                                    {l.lead_status==='Rejected' && (
                                                        <div>
                                                            {/* FIX 1: Hint if no reason yet */}
                                                            {!l.reject_reason && (
                                                                <div className="text-[8px] font-bold text-red-600 bg-red-50 border border-red-200 px-2 py-1 rounded-lg mb-1">
                                                                    ⚠️ Select reason → moves to Rejected
                                                                </div>
                                                            )}
                                                            <select onChange={e => updateLead(l,'reject_reason',e.target.value)} value={l.reject_reason||''} className="w-full p-2 mb-2 border-2 border-red-300 rounded-xl font-black uppercase text-[9px] outline-none bg-red-50 text-red-800 cursor-pointer">
                                                                <option value="" disabled>Select Reason</option>
                                                                <option>Not Interested</option><option>No Response</option><option>Wrong Number</option><option>No Incoming Call</option><option>Budget Mismatch</option><option>Already Purchased</option>
                                                            </select>
                                                        </div>
                                                    )}
                                                    <select onChange={e => updateLead(l,'lead_priority',e.target.value)} value={l.lead_priority||'Warm'} className={`w-full p-2 border-2 rounded-xl font-black uppercase text-[9px] outline-none cursor-pointer ${getPriorityColor(l.lead_priority)}`}>
                                                        <option value="Hot">🔥 Hot</option><option value="Warm">🌤 Warm</option><option value="Cold">❄️ Cold</option>
                                                    </select>
                                                </td>
                                                <td className="px-5 py-4 min-w-[170px]">
                                                    {['Called','RNR','Details Shared'].includes(l.lead_status) && (
                                                        <div><span className="text-[8px] font-black text-blue-600 uppercase tracking-widest block mb-1">📅 Callback Date</span>
                                                        <input type="datetime-local" className="w-full p-2 border-2 border-blue-200 bg-blue-50 rounded-xl text-[10px] font-bold text-slate-700 outline-none focus:border-blue-400" value={l.follow_up_at?.slice(0,16)||''} onChange={e => updateLead(l,'follow_up_at',e.target.value)} /></div>
                                                    )}
                                                    {l.lead_status==='SV Scheduled' && (
                                                        <div className="mt-2"><span className="text-[8px] font-black text-teal-600 uppercase tracking-widest block mb-1">📍 Site Visit</span>
                                                        <input type="date" className="w-full p-2 border-2 border-teal-200 bg-teal-50 rounded-xl text-[10px] font-bold text-slate-700 outline-none focus:border-teal-400" value={l.site_visit_at||''} onChange={e => updateLead(l,'site_visit_at',e.target.value)} /></div>
                                                    )}
                                                    {!['Called','RNR','Details Shared','SV Scheduled'].includes(l.lead_status) && <span className="text-[9px] text-slate-300 font-bold italic">—</span>}
                                                </td>
                                                <td className="px-5 py-4">
                                                    <div className="flex flex-col gap-2">
                                                        <div className="h-[60px] overflow-y-auto bg-slate-900/5 p-2 rounded-xl history-scroll whitespace-pre-wrap border border-slate-200 leading-relaxed font-medium text-slate-500 text-[9px]">
                                                            {l.call_remark || <span className="italic text-slate-300">No activity yet...</span>}
                                                        </div>
                                                        <NoteCell lead={l} onSave={updateLead} />
                                                    </div>
                                                </td>
                                                <td className="px-3 py-4">
                                                    <div className="flex flex-col gap-1.5">
                                                        <button onClick={() => setSelectedLead(l)} className="bg-blue-50 hover:bg-blue-100 text-blue-600 text-[8px] font-black px-2 py-2 rounded-xl uppercase tracking-widest border border-blue-200 transition w-full">👁 Detail</button>
                                                        {isAdminUser && <button onClick={() => deleteLead(l)} className="text-[8px] font-black px-2 py-2 rounded-xl uppercase tracking-widest border transition w-full bg-red-50 text-red-500 border-red-200 hover:bg-red-100">🗑 Delete</button>}
                                                    </div>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            )}
                            {!loading && visibleCount < displayedLeads.length && (
                                <div className="p-4 border-t border-slate-100 bg-slate-50 flex justify-center">
                                    <button onClick={() => setVisibleCount(v => v+50)} className="bg-blue-100 hover:bg-blue-200 text-blue-800 px-6 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest transition shadow-sm">Load More ({displayedLeads.length - visibleCount} hidden)</button>
                                </div>
                            )}
                        </div>

                        {/* ── Mobile Cards ── */}
                        <div className="lg:hidden space-y-3">
                            {loading ? (
                                [...Array(4)].map((_,i) => (
                                    <div key={i} className="bg-white rounded-2xl p-4 border border-slate-200 space-y-3">
                                        <div className="flex justify-between"><div className="space-y-2 flex-1"><div className="skeleton h-4 w-32 rounded"></div><div className="skeleton h-3 w-24 rounded"></div></div><div className="skeleton h-12 w-24 rounded-xl"></div></div>
                                        <div className="flex gap-2"><div className="skeleton h-10 flex-1 rounded-xl"></div><div className="skeleton h-10 flex-1 rounded-xl"></div></div>
                                        <div className="skeleton h-9 w-full rounded-xl"></div>
                                    </div>
                                ))
                            ) : visibleLeads.length === 0 ? (
                                <div className="py-16 flex flex-col items-center text-center bg-white rounded-2xl border border-slate-200">
                                    <div className="text-4xl mb-3">📭</div>
                                    <div className="text-sm font-black uppercase tracking-widest text-slate-400 mb-1">No leads found</div>
                                    <div className="text-[10px] text-slate-400 font-medium">Adjust filters or search</div>
                                </div>
                            ) : visibleLeads.map(l => (
                                <div key={`m-${l.id}`} className={`rounded-2xl shadow-sm border-2 overflow-hidden animate-fadeIn ${l.lead_priority==='Hot'?'border-red-200':l.lead_priority==='Cold'?'border-blue-200':'border-amber-200'} ${getCardTint(l.lead_status)}`}>
                                    <div className={`h-1 w-full ${l.lead_priority==='Hot'?'bg-red-500':l.lead_priority==='Cold'?'bg-blue-400':'bg-amber-400'}`}></div>
                                    <div className="p-4">
                                        <div className="flex justify-between items-start mb-3">
                                            <div className="flex-1 min-w-0 pr-2">
                                                <h3 className="font-black text-[13px] uppercase text-slate-900 leading-tight truncate">{l.customer_name}</h3>
                                                <p className="font-black text-blue-600 text-[12px] mt-0.5">{l.phone_number}</p>
                                                {l.customer_email && <p className="font-medium text-slate-400 text-[9px] truncate mt-0.5">{l.customer_email}</p>}
                                                {(isAdminUser || l.lead_source !== 'Bulk Upload') && <p className="text-[9px] text-slate-500 font-bold mt-1 tracking-widest uppercase truncate">🏠 {l.project_interested_in||'General'}</p>}
                                                <p className="text-[8px] text-slate-400 font-bold mt-0.5 tracking-widest uppercase">🕐 {formatDateTime(l.created_at)}</p>
                                                {l.psa_agent_name && <p className="text-[8px] text-blue-500 font-bold mt-0.5 tracking-widest uppercase">👤 {l.psa_agent_name}</p>}
                                            </div>
                                            <div className="flex flex-col items-end gap-1.5 shrink-0">
                                                <span className={`text-[8px] font-black uppercase tracking-widest px-2.5 py-1 rounded-full border ${getStatusStyles(l.lead_status)}`}>{l.lead_status||'Un called'}</span>
                                                <span className={`text-[8px] font-black uppercase tracking-widest px-2 py-0.5 rounded-full border ${getPriorityColor(l.lead_priority||'Warm')}`}>{l.lead_priority==='Hot'?'🔥':l.lead_priority==='Cold'?'❄️':'🌤'} {l.lead_priority||'Warm'}</span>
                                                <button onClick={() => setSelectedLead(l)} className="text-[8px] font-black text-blue-600 bg-blue-50 border border-blue-200 px-2 py-1 rounded-lg uppercase tracking-widest">👁 Detail</button>
                                                {isAdminUser && <button onClick={() => deleteLead(l)} className="text-[8px] font-black px-2 py-1 rounded-lg uppercase tracking-widest border text-red-500 bg-red-50 border-red-200 hover:bg-red-100">🗑</button>}
                                            </div>
                                        </div>
                                        <div className="flex gap-2 mb-3">
                                            <a href={`tel:${l.phone_number}`} className="flex-1 flex items-center justify-center gap-1 bg-white border-2 border-slate-200 text-slate-700 text-[9px] font-black uppercase tracking-widest py-2.5 rounded-xl hover:border-blue-400 transition">📞 Call</a>
                                            <a href={`https://wa.me/91${l.phone_number?.replace(/\D/g,'').slice(-10)}`} className="flex-1 flex items-center justify-center gap-1 bg-green-500 text-white text-[9px] font-black uppercase tracking-widest py-2.5 rounded-xl hover:bg-green-600 transition shadow-sm">💬 WhatsApp</a>
                                        </div>
                                        <div className="border-t border-slate-200/80 pt-3 space-y-2">
                                            {isAdminUser && (
                                                <div className="flex flex-col gap-1">
                                                    <label className="text-[8px] font-black text-slate-400 uppercase tracking-widest">{l.psa_agent_name ? '🔄 Reassign Agent' : '⚡ Assign Agent'}</label>
                                                    <select onChange={e => updateLead(l,'psa_agent_name',e.target.value)} value={l.psa_agent_name||''} className="p-2.5 border-2 border-slate-700 bg-slate-900 rounded-xl font-black uppercase text-[9px] outline-none text-blue-300 cursor-pointer">
                                                        <option value="" disabled>Select Agent</option>
                                                        {PSA_AGENTS.map(a => <option key={a.value} value={a.value}>{a.label}</option>)}
                                                    </select>
                                                </div>
                                            )}
                                            <div className="grid grid-cols-2 gap-2">
                                                <div className="flex flex-col gap-1">
                                                    <label className="text-[8px] font-black text-slate-400 uppercase tracking-widest">Status</label>
                                                    <select onChange={e => handleStatusChange(l, e.target.value)} value={l.lead_status||''} className={`p-2.5 border-2 rounded-xl font-black uppercase text-[9px] outline-none cursor-pointer ${getStatusStyles(l.lead_status)}`}>
                                                        {(!l.lead_status||l.lead_status==='Un called')&&<option value="Un called">🔵 Un called</option>}
                                                        <option value="Called">✅ Called</option><option value="RNR">🔔 RNR</option><option value="Details Shared">📤 Details</option><option value="SV Scheduled">📅 SV Sched.</option><option value="Converted">🏆 Converted</option><option value="Rejected">❌ Rejected</option>
                                                    </select>
                                                </div>
                                                <div className="flex flex-col gap-1">
                                                    <label className="text-[8px] font-black text-slate-400 uppercase tracking-widest">Priority</label>
                                                    <select onChange={e => updateLead(l,'lead_priority',e.target.value)} value={l.lead_priority||'Warm'} className={`p-2.5 border-2 rounded-xl font-black uppercase text-[9px] outline-none cursor-pointer ${getPriorityColor(l.lead_priority)}`}>
                                                        <option value="Hot">🔥 Hot</option><option value="Warm">🌤 Warm</option><option value="Cold">❄️ Cold</option>
                                                    </select>
                                                </div>
                                            </div>
                                            {/* FIX 1: Mobile hints + inline reject reason */}
                                            {l.lead_status === 'RNR' && !l.follow_up_at && (
                                                <div className="text-[8px] font-bold text-orange-600 bg-orange-50 border border-orange-200 px-2 py-1.5 rounded-lg">
                                                    ⚠️ Set callback date below → moves to Open bucket
                                                </div>
                                            )}
                                            {l.lead_status==='Rejected' && (
                                                <div>
                                                    {!l.reject_reason && (
                                                        <div className="text-[8px] font-bold text-red-600 bg-red-50 border border-red-200 px-2 py-1.5 rounded-lg mb-1">
                                                            ⚠️ Select reason below → moves to Rejected bucket
                                                        </div>
                                                    )}
                                                    <select onChange={e => updateLead(l,'reject_reason',e.target.value)} value={l.reject_reason||''} className="w-full p-2.5 border-2 border-red-300 bg-red-50 text-red-800 rounded-xl font-black uppercase text-[9px] outline-none cursor-pointer">
                                                        <option value="" disabled>Select Reject Reason</option>
                                                        <option>Not Interested</option><option>No Response</option><option>Wrong Number</option><option>No Incoming Call</option><option>Budget Mismatch</option><option>Already Purchased</option>
                                                    </select>
                                                </div>
                                            )}
                                            {['Called','RNR','Details Shared'].includes(l.lead_status) && (
                                                <div className="flex flex-col gap-1 mt-2">
                                                    <label className="text-[8px] font-black text-blue-600 uppercase tracking-widest">📅 Callback Date</label>
                                                    <input type="datetime-local" className="p-2.5 border-2 border-blue-200 bg-blue-50 rounded-xl text-[10px] font-bold outline-none focus:border-blue-400" value={l.follow_up_at?.slice(0,16)||''} onChange={e => updateLead(l,'follow_up_at',e.target.value)} />
                                                </div>
                                            )}
                                            {l.lead_status==='SV Scheduled' && (
                                                <div className="flex flex-col gap-1 mt-2">
                                                    <label className="text-[8px] font-black text-teal-600 uppercase tracking-widest">📍 Site Visit Date</label>
                                                    <input type="date" className="p-2.5 border-2 border-teal-200 bg-teal-50 rounded-xl text-[10px] font-bold outline-none focus:border-teal-400" value={l.site_visit_at||''} onChange={e => updateLead(l,'site_visit_at',e.target.value)} />
                                                </div>
                                            )}
                                            <div className="mt-3 pt-3 border-t border-slate-100">
                                                <div className="bg-slate-900/5 p-2.5 rounded-xl h-14 overflow-y-auto text-[9px] font-medium whitespace-pre-wrap history-scroll border border-slate-200 leading-relaxed text-slate-500 mb-2">
                                                    {l.call_remark || <span className="italic text-slate-400">System logs...</span>}
                                                </div>
                                                <NoteCell lead={l} onSave={updateLead} />
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            ))}
                            {!loading && visibleCount < displayedLeads.length && (
                                <button onClick={() => setVisibleCount(v => v+50)} className="w-full bg-white hover:bg-blue-50 text-blue-700 py-4 rounded-2xl text-[10px] font-black uppercase tracking-widest transition border-2 border-blue-200 hover:border-blue-400 shadow-sm">
                                    Load More ({displayedLeads.length - visibleCount} remaining)
                                </button>
                            )}
                        </div>
                    </div>
                )}

                {view === 'library' && (
                    <ProjectLibrary supabase={supabase} setProp={setSelectedProp} properties={properties} setProperties={setProperties} onEdit={p => { setEditingProp(p); handleNavigate('add'); }} />
                )}
                {view === 'add' && <PropertyForm scriptUrl={GOOGLE_SCRIPT_URL} supabase={supabase} editingProp={editingProp} setView={handleNavigate} />}
            </main>

            {showManualModal && (
                <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-[100] flex items-end md:items-center justify-center p-0 md:p-4" onClick={e => e.target === e.currentTarget && setShowManualModal(false)}>
                    <div className="bg-white rounded-t-[32px] md:rounded-[28px] w-full max-w-md shadow-2xl animate-slideUp overflow-hidden">
                        <div className="px-6 pt-5 pb-4 border-b border-slate-100">
                            <div className="w-10 h-1 bg-slate-200 rounded-full mx-auto mb-5 md:hidden"></div>
                            <div className="flex justify-between items-center">
                                <div>
                                    <h2 className="text-lg font-black uppercase tracking-tight text-slate-900">Manual Lead Entry</h2>
                                    <p className="text-[9px] font-bold uppercase tracking-widest text-slate-400 mt-0.5">Inject directly into CRM</p>
                                </div>
                                <button onClick={() => setShowManualModal(false)} className="w-8 h-8 flex items-center justify-center rounded-full bg-slate-100 text-slate-500 hover:bg-slate-200 text-sm font-black">✕</button>
                            </div>
                        </div>
                        <div className="px-6 py-5 max-h-[75vh] overflow-y-auto">
                            <ManualLeadForm properties={properties} supabase={supabase} agentName={agentName === '__ADMIN__' ? getAdminPersonaName() : agentName} onSuccess={() => { setShowManualModal(false); fetchLeads(); }} />
                        </div>
                    </div>
                </div>
            )}
        </div>
    );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<AdminApp />);
window.__appMounted = true;
setTimeout(function(){ if (window.__dismissSplash) window.__dismissSplash(); }, 4000);
</script>
</body>
</html>
