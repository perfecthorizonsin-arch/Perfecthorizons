// ── Splash screen controller ──────────────────────────────────────────────
(function() {
    const messages = [
        'Initializing...',
        'Connecting to Supabase...',
        'Loading CRM engine...',
        'Fetching lead data...',
        'Preparing command center...',
        'Almost ready...'
    ];
    let idx = 0;
    const statusEl = document.getElementById('splash-status');
    const msgInterval = setInterval(function() {
        idx = (idx + 1) % messages.length;
        if (statusEl) statusEl.textContent = messages[idx];
    }, 600);

    window.__dismissSplash = function() {
        clearInterval(msgInterval);
        const splash = document.getElementById('splash-screen');
        if (splash) {
            if (statusEl) statusEl.textContent = 'Ready ✓';
            setTimeout(function() {
                splash.classList.add('hidden');
                setTimeout(function() { if (splash.parentNode) splash.remove(); }, 700);
            }, 400);
        }
    };
})();

<script type="text/babel">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwaOLlqAQZMZczkAWuyK2F2DEHZ2ILgxlJnlDDZrrDNBSdszBZpX3M0f_p9mVtUePobDQ/exec";

// ─── IMAGE HELPERS (Google Drive only) ────────────────────────────────────
// ALL images are stored as Google Drive file IDs or share URLs.
// Display: use thumbnail endpoint. Download: use uc?export=download.

const extractDriveId = (url) => {
    if (!url || typeof url !== 'string') return null;
    const u = url.trim();
    // Already a raw file ID (no slashes, no dots, ~28-33 chars alphanumeric+dash+underscore)
    if (/^[a-zA-Z0-9_-]{20,}$/.test(u)) return u;
    // /d/<id>/
    let m = u.match(/\/d\/([a-zA-Z0-9_-]+)/);
    if (m) return m[1];
    // id=<id>
    m = u.match(/[?&]id=([a-zA-Z0-9_-]+)/);
    if (m) return m[1];
    // open?id=
    m = u.match(/open\?id=([a-zA-Z0-9_-]+)/);
    if (m) return m[1];
    return null;
};

const getDisplayUrl = (rawUrl) => {
    if (!rawUrl || typeof rawUrl !== 'string') return 'https://placehold.co/600x300/f1f5f9/94a3b8?text=No+Image';
    const url = rawUrl.split(',')[0].trim();
    if (!url) return 'https://placehold.co/600x300/f1f5f9/94a3b8?text=No+Image';
    const id = extractDriveId(url);
    if (id) return `https://drive.google.com/thumbnail?id=${id}&sz=w1000`;
    return url;
};

const getDownloadUrl = (rawUrl) => {
    if (!rawUrl || typeof rawUrl !== 'string') return rawUrl;
    const url = rawUrl.trim();
    const id = extractDriveId(url);
    if (id) return `https://drive.google.com/uc?export=download&id=${id}`;
    return url;
};

// Upload a file to Google Drive via Apps Script and return the Drive file URL
// The Apps Script must return { url: "https://drive.google.com/file/d/<id>/view" }
const uploadToDrive = async (file, propertyName, category) => {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = async () => {
            try {
                const base64 = reader.result.split(',')[1];
                const res = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'uploadFile',
                        base64,
                        type: file.type,
                        name: file.name,
                        propertyName: propertyName || 'Uploads',
                        category: category || 'General'
                    })
                });
                const data = await res.json();
                if (data.fileUrl) resolve(data.fileUrl);
                else if (data.url) resolve(data.url);
                else if (data.fileId) resolve(`https://drive.google.com/file/d/${data.fileId}/view`);
                else reject(new Error(data.error || 'No URL returned from Drive'));
            } catch (err) { reject(err); }
        };
        reader.onerror = () => reject(new Error('FileReader failed'));
        reader.readAsDataURL(file);
    });
};

// ─── UTILITY HELPERS ───────────────────────────────────────────────────────
const getVal = (obj, searchKey) => {
    if (!obj) return "";
    if (obj[searchKey] !== undefined && obj[searchKey] !== "") return obj[searchKey];
    const cleanKey = searchKey.replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
    for (let k in obj) { if (k.replace(/[^a-zA-Z0-9]/g, '').toLowerCase() === cleanKey) return obj[k]; }
    return "";
};

const extractPriceInCr = (s) => {
    if (!s) return 0;
    try {
        const c = String(s).toLowerCase().replace(/,/g, '');
        const m = c.match(/[0-9.]+/); if (!m) return 0;
        const v = parseFloat(m[0]); if (isNaN(v)) return 0;
        if (c.includes('cr') || c.includes('crore')) return v;
        if (c.includes('lac') || c.includes('lakh')) return v / 100;
        if (v > 100000) return v / 10000000;
        return 0;
    } catch(e) { return 0; }
};

const formatIndianCurrencyCompact = (num) => {
    if (num >= 10000000) return '₹' + (num / 10000000).toFixed(2).replace(/\.00$/, '') + ' Cr';
    if (num >= 100000)   return '₹' + (num / 100000).toFixed(2).replace(/\.00$/, '') + ' L';
    return new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(num);
};

const formatPercent = (val) => {
    const num = parseFloat(val);
    if (isNaN(num)) return String(val || "0%");
    return (num < 1 && num > 0) ? (num * 100).toFixed(1) + "%" : num + "%";
};

const getSafeLink = (rawLink) => {
    if (!rawLink) return "#";
    const link = String(rawLink).trim();
    if (!link) return "#";
    if (link.includes('@') && !link.startsWith('mailto:')) return `mailto:${link}`;
    if (!link.startsWith('http') && !link.includes('@')) return `https://${link}`;
    return link;
};

        case 'Converted':      return 'bg-emerald-50';
        case 'Rejected':       return 'bg-red-50';
        default:               return 'bg-white';
    }
};

const isMobile = () => /Android|webOS|iPhone|iPad|iPod/i.test(navigator.userAgent);

// ─── EMI CALCULATOR ────────────────────────────────────────────────────────
const EMICalculator = ({ propertyPriceStr }) => {
    const propertyValue = extractPriceInCr(propertyPriceStr) > 0 ? extractPriceInCr(propertyPriceStr) * 10000000 : 10000000;
    const [loanAmount,   setLoanAmount]   = useState(propertyValue * 0.8);
    const [interestRate, setInterestRate] = useState(8.5);
    const [tenureYears,  setTenureYears]  = useState(20);

    const { emi, totalInterest, principalPct } = useMemo(() => {
        const p = loanAmount, r = interestRate / 12 / 100, n = tenureYears * 12;
        if (!p || !r || !n) return { emi: 0, totalInterest: 0, principalPct: 100 };
        const emiVal  = (p * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
        const totalPay = emiVal * n;
        return { emi: Math.round(emiVal), totalInterest: Math.round(totalPay - p), principalPct: ((p / totalPay) * 100).toFixed(1) };
    }, [loanAmount, interestRate, tenureYears]);

    return (
        <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm mt-6">
            <h3 className="text-sm font-black uppercase tracking-widest text-slate-900 mb-6 flex items-center">
                <span className="mr-2 text-xl">📊</span> EMI Calculator
            </h3>
            <div className="flex items-center gap-6 mb-8">
                <div className="w-16 h-16 pie-chart shrink-0 shadow-inner" style={{ background: `conic-gradient(#2563eb ${principalPct}%, #e2e8f0 ${principalPct}% 100%)` }}></div>
                <div className="flex flex-col gap-2 w-full">
                    <div className="flex justify-between items-center border-b border-slate-100 pb-1">
                        <div className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-blue-600 inline-block"></span><span className="text-[9px] font-bold text-slate-500 uppercase tracking-widest">Principal</span></div>
                        <span className="text-[10px] font-black text-slate-900">{formatIndianCurrencyCompact(loanAmount)}</span>
                    </div>
                    <div className="flex justify-between items-center">
                        <div className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-slate-300 inline-block"></span><span className="text-[9px] font-bold text-slate-500 uppercase tracking-widest">Interest</span></div>
                        <span className="text-[10px] font-black text-slate-900">{formatIndianCurrencyCompact(totalInterest)}</span>
                    </div>
                </div>
            </div>
            <div className="space-y-5">
                {[
                    { label: 'Loan Amount',   val: formatIndianCurrencyCompact(loanAmount), min: 1000000, max: 50000000, step: 100000, value: loanAmount,   set: setLoanAmount },
                    { label: 'Interest Rate', val: interestRate + '%',                       min: 6,       max: 15,       step: 0.1,    value: interestRate, set: setInterestRate },
                    { label: 'Tenure',        val: tenureYears + ' Yrs',                     min: 5,       max: 30,       step: 1,      value: tenureYears,  set: setTenureYears },
                ].map(s => (
                    <div key={s.label}>
                        <div className="flex justify-between mb-2">
                            <label className="text-[10px] font-black uppercase text-slate-400 tracking-widest">{s.label}</label>
                            <span className="text-xs font-black text-blue-600 bg-blue-50 px-2 py-0.5 rounded">{s.val}</span>
                        </div>
                        <input type="range" min={s.min} max={s.max} step={s.step} value={s.value} onChange={e => s.set(Number(e.target.value))} />
                    </div>
                ))}
                <div className="pt-4 border-t border-slate-100 flex justify-between items-center">

// ─── INLINE EDITABLE FIELD ─────────────────────────────────────────────────
const EditableField = ({ field, label, value, multiline, type = 'text', onSave, darkMode = false }) => {
    const [editing,  setEditing]  = useState(false);
    const [draft,    setDraft]    = useState('');
    const [saving,   setSaving]   = useState(false);
    const inputRef = useRef(null);

    const startEdit = () => { setDraft(value || ''); setEditing(true); };
    const cancel    = () => setEditing(false);

    useEffect(() => {
        if (editing && inputRef.current) inputRef.current.focus();
    }, [editing]);

    const save = async () => {
        setSaving(true);
        await onSave(field, draft);
        setSaving(false);
        setEditing(false);
    };

    const handleKey = (e) => {
        if (e.key === 'Escape') cancel();
        if (e.key === 'Enter' && (e.ctrlKey || !multiline)) { e.preventDefault(); save(); }
    };

    const inputCls = `w-full p-2.5 border-2 border-blue-400 rounded-xl text-sm font-semibold outline-none resize-none transition-colors ${darkMode ? 'bg-slate-800 text-white' : 'bg-blue-50 text-slate-900'}`;

    if (editing) {
        return (
            <div className="space-y-2">
                {label && <div className="text-[9px] font-black uppercase tracking-widest text-slate-400">{label}</div>}
                {multiline
                    ? <textarea ref={inputRef} rows={4} value={draft} onChange={e => setDraft(e.target.value)} onKeyDown={handleKey} className={inputCls} />
                    : <input ref={inputRef} type={type} value={draft} onChange={e => setDraft(e.target.value)} onKeyDown={handleKey} className={inputCls} />
                }
                <div className="flex gap-2">
                    <button onClick={save} disabled={saving} className="bg-blue-600 hover:bg-blue-700 text-white text-[9px] font-black px-3 py-1.5 rounded-lg uppercase tracking-widest disabled:opacity-50 transition">{saving ? '...' : 'Save'}</button>
                    <button onClick={cancel} className={`text-[9px] font-black px-3 py-1.5 rounded-lg uppercase tracking-widest transition ${darkMode ? 'bg-slate-700 text-slate-300 hover:bg-slate-600' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>Cancel</button>
                </div>
            </div>
        );
    }

    return (
        <div className="group/ef flex items-start gap-2">
            <div className="flex-1 min-w-0">
                {label && <div className="text-[9px] font-black uppercase tracking-widest text-slate-400 mb-0.5">{label}</div>}
                <div className={`text-sm font-semibold break-words ${value ? (darkMode ? 'text-slate-200' : 'text-slate-800') : 'italic text-slate-400'}`}>{value || '—'}</div>
            </div>
            <button
                onClick={startEdit}
                className="opacity-0 group-hover/ef:opacity-100 transition-opacity shrink-0 mt-0.5 text-[8px] font-black bg-blue-50 text-blue-600 border border-blue-200 px-2 py-1 rounded-lg uppercase tracking-widest hover:bg-blue-100"
            >✏️ Edit</button>
        </div>
    );
};

const PropertyDetailsPage = ({ property: initProp, onBack }) => {
    const [property,     setProperty]     = useState(initProp);
    const [toast,        setToast]        = useState(null);
    const [isSharing,    setIsSharing]    = useState(false);
    const [shareModal,   setShareModal]   = useState(null);
    const [selectedUrls, setSelectedUrls] = useState([]);
    const galleryRef = useRef(null);

    useEffect(() => { window.scrollTo(0, 0); }, [initProp]);

    const showToast = useCallback((msg, color = 'bg-emerald-600') => {
        setToast({ msg, color });
        setTimeout(() => setToast(null), 4500);
    }, []);

    const saveField = useCallback(async (field, value) => {
        const { error } = await supabase.from('properties').update({ [field]: value }).eq('id', property.id);
        if (!error) {
            setProperty(prev => ({ ...prev, [field]: value }));
            showToast('✅ Saved to Supabase');
        } else {
            showToast('❌ ' + error.message, 'bg-red-600');
        }
    }, [property.id, showToast]);

    // ── Gallery — Google Drive thumbnail URLs ──
    const cover  = getDisplayUrl(getVal(property, "cover_image") || getVal(property, "cover-image"));
    const galRaw = getVal(property, "gallery_images") || getVal(property, "gallery-images") || "";
    const imgs   = [cover, ...(galRaw ? galRaw.split(',').map(u => getDisplayUrl(u.trim())) : [])].filter(Boolean);

    const openLink = (rawLink) => {
        if (!rawLink || !rawLink.trim()) return alert("This link was not provided.");
        window.open(getSafeLink(rawLink), '_blank');
    };

    const regLink    = getVal(property, "lead_registration") || getVal(property, "lead_registration_link") || getVal(property, "lead_registration_link_or_email_id");
    const regIsEmail = regLink && regLink.includes('@') && !regLink.startsWith('http');
    const regText    = regIsEmail ? "✉️ Email Lead Details" : "🌐 Direct to Website Link";

    const handleRegisterLead = () => {
        if (!regLink || !regLink.trim()) return alert("No lead registration details provided.");
        if (regIsEmail) {
            window.location.href = `mailto:${regLink.replace('mailto:', '').trim()}?subject=New Lead Registration: ${getVal(property, "property_name")}`;
        } else {
            let link = regLink.trim();
            if (!link.startsWith('http')) link = `https://${link}`;
            window.open(link, '_blank');
        }
    };

    // ── Sharing via WhatsApp using Google Drive URLs ──
    const shareViaWhatsApp = (type, linkStr) => {
        if (!linkStr || !linkStr.trim()) return alert(`${type} is not available for this property.`);
        const urls = linkStr.split(',').map(u => u.trim()).filter(Boolean);
        if (type === 'Location Map' || type === 'Property Video') {
            executeShare(type, urls);
        } else {
            setShareModal({ type, urls });
            setSelectedUrls([...urls]);
        }
    };

    const toggleSelection = (url) => {
        setSelectedUrls(prev => prev.includes(url) ? prev.filter(u => u !== url) : [...prev, url]);
    };

    const executeShare = async (type, urlsToShare) => {
        if (!urlsToShare.length) return alert("Please select at least one file.");
        setIsSharing(true);

        const propName = getVal(property, "property_name");
        const waText   = `Hello! Here is the *${type}* for *${propName}*. Please find the attached file(s) below. 🏡`;
        const waTextLinks = `Hello! Here is the *${type}* for *${propName}*:\n\n${urlsToShare.join('\n\n')}`;

        // Plain links (maps, video) — send as WhatsApp text
        if (type === 'Location Map' || type === 'Property Video') {
            const waUrl = `https://wa.me/?text=${encodeURIComponent(waTextLinks)}`;
            if (isMobile()) window.location.href = waUrl;
            else window.open(`https://web.whatsapp.com/send?text=${encodeURIComponent(waTextLinks)}`, '_blank');
            setShareModal(null);
            setIsSharing(false);
            return;
        }

        // ── Download via direct <a> tag — bypasses CORS & Drive auth redirects ──
        // fetch() always fails on Drive URLs (returns HTML redirect, not the file blob).
        // An anchor click lets the browser follow Drive's auth redirect chain natively.
        const triggerDownload = (url, filename) => {
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        };

        const n = urlsToShare.length;
        for (let i = 0; i < n; i++) {
            const raw   = urlsToShare[i];
            const id    = extractDriveId(raw);
            // uc?export=download works for both images and PDFs — browser handles auth
            const dlUrl = id ? `https://drive.google.com/uc?export=download&id=${id}` : raw;
            // Apps Script stores /view for PDFs, thumbnail URL for images
            const isPdf = raw.includes('/view') || raw.toLowerCase().includes('.pdf');
            const ext   = isPdf ? 'pdf' : 'jpg';
            const fname = `${propName.replace(/[^a-zA-Z0-9]/g, '_')}_${type.replace(/\s+/g, '_')}${n > 1 ? '_' + (i + 1) : ''}.${ext}`;
            // Stagger downloads 400ms apart so browser doesn't block simultaneous downloads
            setTimeout(() => triggerDownload(dlUrl, fname), i * 400);
        }

        setIsSharing(false);
        setShareModal(null);

        if (isMobile()) {
            showToast(`⬇️ ${n} file${n>1?'s':''} downloading… Open WhatsApp & attach from Downloads 📎`, 'bg-green-600');
            setTimeout(() => { window.location.href = `https://wa.me/?text=${encodeURIComponent(waText)}`; }, n * 400 + 700);
        } else {
            showToast(`⬇️ ${n} file${n>1?'s':''} downloading… Then attach in WhatsApp Web 📎`, 'bg-blue-600');
            setTimeout(() => window.open(`https://web.whatsapp.com/send?text=${encodeURIComponent(waText)}`, '_blank'), n * 400 + 600);
        }
    };

    const pocNumber = getVal(property, "point_of_contact")?.replace(/\D/g, '') || WHATSAPP_NUMBER;

    return (
        <div className="min-h-screen bg-slate-50 animate-fadeIn pb-24 md:pb-0 relative">

            {/* Toast */}
            {toast && (
                <div className={`fixed top-4 left-1/2 -translate-x-1/2 z-[500] ${toast.color} text-white text-xs font-black uppercase tracking-widest px-6 py-3.5 rounded-2xl shadow-2xl animate-fadeIn max-w-sm text-center`}>
                    {toast.msg}
                </div>
            )}

            {/* Share Modal */}
            {shareModal && (
                <div className="fixed inset-0 z-[200] flex items-end md:items-center justify-center p-0 md:p-4 bg-slate-900/80 backdrop-blur-sm animate-fadeIn">
                    <div className="bg-white rounded-t-[32px] md:rounded-[28px] w-full max-w-md shadow-2xl relative flex flex-col max-h-[88vh]">
                        <div className="p-6 pb-0">
                            <div className="w-10 h-1 bg-slate-200 rounded-full mx-auto mb-5 md:hidden"></div>
                            <div className="flex items-center justify-between mb-1">
                                <div>
                                    <h2 className="text-base font-black uppercase text-slate-900 tracking-tight">Share via WhatsApp</h2>
                                    <p className="text-[10px] font-bold uppercase tracking-widest text-green-600 mt-0.5">📤 {shareModal.type}</p>
                                </div>
                                <button onClick={() => setShareModal(null)} className="w-8 h-8 flex items-center justify-center rounded-full bg-slate-100 text-slate-500 hover:bg-slate-200 text-sm font-black transition">✕</button>
                            </div>
                            <div className="flex items-center gap-2 bg-blue-50 border border-blue-100 rounded-2xl px-3 py-2 mt-3 mb-4">
                                <span className="text-base shrink-0">💡</span>
                                <p className="text-[9px] text-blue-700 font-bold leading-relaxed">
                                    File(s) will download from Google Drive &amp; WhatsApp will open — manually attach the downloaded file.
                                </p>
                            </div>
                            <div className="border-b border-slate-100 -mx-6 mb-3"></div>
                        </div>
                        <div className="overflow-y-auto px-6 space-y-2 flex-grow">
                            {shareModal.urls.length === 1 ? (
                                (() => {
                                    const url = shareModal.urls[0];
                                    const displayUrl = getDisplayUrl(url);
                                    const driveId = extractDriveId(url);
                                    const isImg = driveId || /\.(jpg|jpeg|png|webp)/i.test(url);
                                    return (
                                        <div className="flex items-center gap-3 p-3 rounded-2xl bg-green-50 border-2 border-green-400">
                                            {isImg

// ─── PROJECT LIBRARY ───────────────────────────────────────────────────────
function ProjectLibrary({ properties, setProp, supabase, setProperties, onEdit }) {
    const [search, setSearch] = useState('');

    const toggleLive = async (e, p) => {
        e.stopPropagation();
        const current = p.is_live !== false;
        const next    = !current;
        if (setProperties) setProperties(prev => prev.map(item => item.id === p.id ? { ...item, is_live: next } : item));
        const { error } = await supabase.from('properties').update({ is_live: next }).eq('id', p.id);
        if (error) {
            alert(`DB Error: ${error.message}\nEnsure 'is_live' (bool) column exists in your 'properties' table.`);
            if (setProperties) setProperties(prev => prev.map(item => item.id === p.id ? { ...item, is_live: current } : item));
        }
    };

    if (!properties || properties.length === 0) return (
        <div className="text-center py-20 font-black text-slate-400 tracking-widest uppercase animate-pulse">Library Empty...</div>
    );

    const filtered = properties.filter(p => {
        if (!search) return true;
        const t = search.toLowerCase();
        return (getVal(p,'property_name')||'').toLowerCase().includes(t) || (getVal(p,'location')||'').toLowerCase().includes(t);
    });

    return (
        <div className="space-y-4 animate-fadeIn">
            <div className="relative">
                <span className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">🔍</span>
                <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search property or location…"
                    className="w-full pl-10 pr-4 py-3 bg-white border border-slate-200 rounded-2xl text-sm font-semibold outline-none focus:ring-2 focus:ring-blue-500 shadow-sm" />
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                {filtered.map(p => (
                    <div key={p.id} onClick={() => setProp(p)} className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden cursor-pointer hover:shadow-lg hover:-translate-y-1 transition group flex flex-col relative">
                        <div className="relative h-48 bg-slate-100 overflow-hidden">
                            <img src={getDisplayUrl(getVal(p,'cover_image') || getVal(p,'cover-image'))} className="w-full h-full object-cover group-hover:scale-105 transition duration-500" alt="" />
                            <div className="absolute top-3 left-0 bg-slate-900/90 text-white text-[10px] font-black px-3 py-1.5 rounded-r-lg uppercase tracking-widest shadow-md">
                                {getVal(p,'property_type') || 'Property'}
                            </div>
                            <button onClick={e => toggleLive(e, p)}
                                className={`absolute top-3 right-0 text-[10px] font-black px-3 py-1.5 rounded-l-lg uppercase tracking-widest shadow-md transition z-10 ${p.is_live !== false ? 'bg-green-500 text-white hover:bg-green-600' : 'bg-red-500 text-white hover:bg-red-600'}`}>
                                {p.is_live !== false ? '🟢 Live' : '🔴 Hidden'}
                            </button>
                            <button onClick={e => { e.stopPropagation(); onEdit(p); }}
                                className="absolute top-10 right-0 text-[10px] font-black px-3 py-1.5 rounded-l-lg uppercase tracking-widest shadow-md transition z-10 bg-blue-500 text-white hover:bg-blue-600 mt-1">
                                ✏️ Edit
                            </button>
                        </div>
                        <div className="p-5 flex-grow flex flex-col">
                            <h3 className="text-xl font-black uppercase tracking-tighter text-slate-900 leading-tight truncate">{getVal(p,'property_name')}</h3>
                            <p className="text-slate-500 text-xs font-bold mt-1 truncate">📍 {getVal(p,'location')}</p>
                            <div className="mt-4 flex justify-between items-end pt-4 border-t border-slate-100">
                                <div>
                                    <div className="text-[9px] text-gray-400 font-bold uppercase tracking-widest">Starting Price</div>
                                    <div className="text-lg font-black text-blue-900">{getVal(p,'price')}</div>
                                </div>
                                <button className="bg-slate-900 text-white text-[10px] font-bold px-4 py-2 rounded-lg hover:bg-blue-600 transition">Preview</button>
                            </div>
                        </div>
                    </div>
                ))}
            </div>
        </div>
    );
}

// Upload flow: file → Google Drive (via Apps Script) → save returned Drive URL to Supabase
// No Cloudinary anywhere.
function PropertyForm({ supabase, scriptUrl, editingProp, setView }) {
    const blank = {
        property_name:'', builder_name:'', property_region:'', property_type:'', location:'', price:'', bhk:'',
        super_built_up_area:'', possession_date:'', construction_status:'', approval:'', rera_number:'',
        total_units:'', availability:'', description:'', usp_details:'', amenities:'',
        point_of_contact:'', commission_details:'', video_link:'', website_link:'',
        lead_registration_link:'', map_link:'', cover_image:'', gallery_images:'',
        floor_plan:'', brochure:'', cost_sheet:'', miscellaneous:''
    };
    const [form,          setForm]          = useState(blank);
    const [loading,       setLoading]       = useState(false);
    const [uploadingField,setUploadingField] = useState(null);
    const [uploadProgress,setUploadProgress] = useState({});

    useEffect(() => { setForm(editingProp ? { ...blank, ...editingProp } : blank); }, [editingProp]);

    const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

    // Upload files to Google Drive via Apps Script
    const upload = async (e, field, append = false) => {
        const files = e.target.files;
        if (!files || files.length === 0) return;
        setLoading(true);
        setUploadingField(field);

        const categoryMap = {
            cover_image:    'Cover Image',
            gallery_images: 'Gallery',
            brochure:       'Brochures',
            cost_sheet:     'Cost Sheets',
            floor_plan:     'Floor Plans',
            miscellaneous:  'Miscellaneous'
        };
        const category = categoryMap[field] || 'General';
        let newUrls = [];

        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            setUploadProgress(p => ({ ...p, [field]: `${i + 1}/${files.length}` }));
            try {
                const driveUrl = await uploadToDrive(file, form.property_name, category);
                newUrls.push(driveUrl);
            } catch (err) {
                console.error(`Upload failed for ${file.name}:`, err);
                alert(`⚠️ Upload failed for "${file.name}": ${err.message}\n\nMake sure your Apps Script handles the "uploadFile" action and returns { url: "..." }`);
            }
        }

        if (newUrls.length > 0) {
            const joined = newUrls.join(',');
            if (append) set(field, form[field] ? form[field] + ',' + joined : joined);
            else set(field, joined);
        }

        setLoading(false);
        setUploadingField(null);
        setUploadProgress(p => { const n = {...p}; delete n[field]; return n; });
        // reset input so same file can be re-uploaded if needed
        e.target.value = '';
    };

    const removeFile = (field, isArray = false, idx = null) => {
        if (isArray) {
            const arr = form[field].split(',').filter(Boolean);
            arr.splice(idx, 1);
            set(field, arr.join(','));
        } else {
            set(field, '');
        }
    };

    const save = async () => {
        if (!form.property_name || !form.price || !form.cover_image) {
            alert("Required: Property Name, Price, and Cover Image.");
            return;
        }
        setLoading(true);
        if (editingProp) {
            const { error } = await supabase.from('properties').update(form).eq('id', editingProp.id);
            if (!error) { alert("Listing Updated!"); setView('library'); }
            else alert(error.message);
        } else {
            const { error } = await supabase.from('properties').insert([form]);
            if (!error) { alert("Listing Published!"); setForm(blank); }
            else alert(error.message);
        }
        setLoading(false);
    };

    // Helper: render upload section with progress indicator
    const UploadSection = ({ field, label, multi }) => {
        const isUploading = uploadingField === field;
        const progress = uploadProgress[field];
        const urls = form[field] ? form[field].split(',').filter(Boolean) : [];
        return (
            <div className="bg-slate-50 border-2 border-dashed border-slate-300 rounded-2xl p-4 transition-all hover:border-blue-400">
                <label className="block text-[10px] font-black uppercase text-slate-500 mb-2 tracking-widest">
                    {label}
                    {isUploading && (
                        <span className="ml-2 text-blue-600 animate-pulse font-black">
                            ⬆️ Uploading to Drive {progress ? `(${progress})` : '...'}
                        </span>
                    )}
                </label>
                <input
                    type="file"
                    multiple={multi}
                    onChange={e => upload(e, field, multi)}
                    disabled={isUploading}
                    className="w-full text-xs font-bold text-slate-600 cursor-pointer file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-[9px] file:font-black file:uppercase file:tracking-widest file:bg-blue-600 file:text-white hover:file:bg-blue-700 file:cursor-pointer disabled:opacity-50"
                />
                {urls.length > 0 && (
                    <div className="mt-2 space-y-1">
                        {multi
                            ? urls.map((url, idx) => (
                                <FileTag key={idx} field={field} name={`Drive File ${idx + 1}`} isArray idx={idx} onRemove={removeFile} />
                            ))
                            : <FileTag field={field} name="Drive File" onRemove={removeFile} />
                        }
                    </div>
                )}
            </div>
        );
    };

    const inputCls = "w-full p-4 bg-white border-2 border-slate-200 rounded-2xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-400 transition placeholder:text-slate-400";

        <div className="bg-white rounded-3xl shadow-sm max-w-4xl mx-auto animate-fadeIn border border-slate-200 overflow-hidden">

                <p className="text-[10px] font-bold uppercase tracking-widest text-slate-400 mt-1">
                    Files upload directly to Google Drive
                </p>
            </div>

            <div className="p-5 md:p-10 space-y-8">

                {/* ── Section 1: Basic Info ── */}
                <div>
                    <div className="flex items-center gap-3 mb-4">
                        <div className="w-6 h-6 bg-blue-600 rounded-lg flex items-center justify-center text-white text-[10px] font-black shrink-0">1</div>
                        <h3 className="text-xs font-black uppercase tracking-widest text-slate-700">Basic Information</h3>
                        <div className="flex-1 h-px bg-slate-200"></div>
                    </div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <input className={`${inputCls} border-blue-300`} placeholder="Property Name *" value={form.property_name} onChange={e => set('property_name', e.target.value)} />
                        <input className={inputCls} placeholder="Builder Name" value={form.builder_name} onChange={e => set('builder_name', e.target.value)} />
                        <select className={selectCls} value={form.property_region} onChange={e => set('property_region', e.target.value)}>
                            <option value="">Select Region</option>
                            <option>North</option><option>South</option><option>East</option><option>West</option>
                        </select>
                        <select className={selectCls} value={form.property_type} onChange={e => set('property_type', e.target.value)}>

// ─── MANUAL LEAD FORM ──────────────────────────────────────────────────────
function ManualLeadForm({ supabase, properties, onSuccess }) {
    const [form,    setForm]    = useState({ name:'', phone:'', email:'', project:'General Enquiry', note:'', source:'Manual Entry' });
    const [loading, setLoading] = useState(false);
    const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

    const handleSubmit = async () => {
        if (!form.name || !form.phone) { alert('Name and Phone are required.'); return; }
        setLoading(true);
        const stamp = new Date().toLocaleString('en-IN', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
        const { error } = await supabase.from('leads').insert([{
            customer_name: form.name, phone_number: form.phone, customer_email: form.email || null,
            project_interested_in: form.project, add_note: form.note,
            call_remark: form.note ? `[${stamp}] Requirement: ${form.note}\n\n` : '',
            lead_source: form.source, lead_status: 'Un called'
        }]);
        if (!error) {
            fetch(GOOGLE_SCRIPT_URL, { method:"POST", headers:{'Content-Type':'application/json'},
                body: JSON.stringify({ action:"sendLead", Name:form.name, Phone:form.phone, Email:form.email||'N/A', Project:form.project, Source:form.source, Requirements:form.note||'None' })
            }).catch(() => {});
            onSuccess();
        } else alert(error.message);
        setLoading(false);
    };

    return (
        <div className="space-y-3">
            <div className="grid grid-cols-2 gap-3">
                <div className="col-span-2">
                    <label className="text-[8px] font-black uppercase tracking-widest text-slate-400 mb-1 block">Client Name *</label>
                    <input required className="w-full p-3 bg-slate-50 border-2 border-slate-200 rounded-2xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-400 transition" placeholder="Full Name" onChange={e => set('name', e.target.value)} />
                </div>
                <div>
                    <label className="text-[8px] font-black uppercase tracking-widest text-slate-400 mb-1 block">Phone *</label>
                    <input required className="w-full p-3 bg-slate-50 border-2 border-slate-200 rounded-2xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-400 transition" placeholder="10-digit" onChange={e => set('phone', e.target.value)} />
                </div>
                <div>
                    <label className="text-[8px] font-black uppercase tracking-widest text-slate-400 mb-1 block">Email</label>
                    <input type="email" className="w-full p-3 bg-slate-50 border-2 border-slate-200 rounded-2xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-400 transition" placeholder="Optional" onChange={e => set('email', e.target.value)} />
                </div>
            </div>
            <div>
                <label className="text-[8px] font-black uppercase tracking-widest text-slate-400 mb-1 block">Project Interested In</label>
                <select className="w-full p-3 bg-slate-50 border-2 border-slate-200 rounded-2xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-400 transition text-slate-700 cursor-pointer" value={form.project} onChange={e => set('project', e.target.value)}>
                    <option value="General Enquiry">General Enquiry</option>
                    {properties?.map(p => <option key={p.id} value={getVal(p,'property_name')}>{getVal(p,'property_name')}</option>)}
                </select>
            </div>
            <div>
                <label className="text-[8px] font-black uppercase tracking-widest text-slate-400 mb-1 block">Lead Source</label>
                <select className="w-full p-3 bg-slate-50 border-2 border-slate-200 rounded-2xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-400 transition text-slate-700 cursor-pointer" value={form.source} onChange={e => set('source', e.target.value)}>
                    <option>Manual Entry</option><option>Walk-in</option><option>Referral</option><option>MagicBricks</option><option>Housing.com</option>
                </select>
            </div>
            <div>
                <label className="text-[8px] font-black uppercase tracking-widest text-slate-400 mb-1 block">Requirements / Notes</label>
                <textarea className="w-full p-3 bg-slate-50 border-2 border-slate-200 rounded-2xl font-bold text-sm resize-none outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-400 transition h-20" placeholder="Budget, BHK preference, timeline..." onChange={e => set('note', e.target.value)} />
            </div>
            <button disabled={loading} onClick={handleSubmit} className="w-full bg-blue-600 hover:bg-blue-700 text-white p-4 rounded-2xl font-black uppercase tracking-widest shadow-lg transition disabled:opacity-50 flex items-center justify-center gap-2 text-sm">

// ─── LOGIN ─────────────────────────────────────────────────────────────────
function LoginForm({ supabase }) {
    const [email, setEmail]   = useState("");
    const [pass,  setPass]    = useState("");
    const [loading, setLoad]  = useState(false);
    const [errMsg, setErrMsg] = useState("");

    const handleLogin = async (e) => {
        e.preventDefault(); setLoad(true); setErrMsg("");
        const { error } = await supabase.auth.signInWithPassword({ email, password: pass });
        if (error) setErrMsg(error.message);
        setLoad(false);
    };
    return (
        <div className="min-h-screen bg-slate-950 flex items-center justify-center p-4">
            <form onSubmit={handleLogin} className="bg-white p-10 rounded-[40px] shadow-2xl w-full max-w-sm text-center border-t-8 border-blue-500">
                <h1 className="text-3xl font-black italic uppercase mb-8">Horizon CRM</h1>
                {errMsg && <div className="text-red-500 text-xs font-bold mb-4 bg-red-50 p-2 rounded">{errMsg}</div>}
                <input type="email" required placeholder="Email" className="w-full p-4 bg-slate-100 rounded-2xl mb-4 font-bold outline-none focus:ring-2 focus:ring-blue-500 transition" onChange={e => setEmail(e.target.value)} />
                <input type="password" required placeholder="Password" className="w-full p-4 bg-slate-100 rounded-2xl mb-8 font-bold outline-none focus:ring-2 focus:ring-blue-500 transition" onChange={e => setPass(e.target.value)} />
                <button disabled={loading} type="submit" className="w-full bg-blue-600 text-white font-black py-4 rounded-2xl uppercase tracking-widest shadow-lg disabled:opacity-50 hover:bg-blue-700 transition">
                    {loading ? "Authenticating..." : "Login"}
                </button>
            </form>
        </div>
    );
}

// ─── ROUTER ────────────────────────────────────────────────────────────────
const getInitialRoute = () => {
    const hash = window.location.hash.replace('#', '');
    if (hash.startsWith('/library')) return { v:'library', c:'website' };
    if (hash.startsWith('/add'))     return { v:'add',     c:'website' };
    if (hash.startsWith('/crm/bulk'))   return { v:'dashboard', c:'bulk' };
    if (hash.startsWith('/crm/manual')) return { v:'dashboard', c:'manual' };
    return { v:'dashboard', c:'website' };
};

// ─── ADMIN APP ─────────────────────────────────────────────────────────────
function AdminApp() {
    const initRoute = getInitialRoute();
    const [session,        setSession]        = useState(null);
    const [authChecking,   setAuthChecking]   = useState(true);
    const [leads,          setLeads]          = useState([]);
    const [properties,     setProperties]     = useState([]);
    const [editingProp,    setEditingProp]    = useState(null);
    const [view,           setView]           = useState(initRoute.v);
    const [leadCategory,   setLeadCategory]   = useState(initRoute.c);
    const [loading,        setLoading]        = useState(true);
    const [showManualModal,setShowManualModal] = useState(false);
    const [filterType,     setFilterType]     = useState('ALL');
    const [summaryAgent,   setSummaryAgent]   = useState('All');
    const [selectedProp,   setSelectedProp]   = useState(null);
    const [visibleCount,   setVisibleCount]   = useState(50);
    const [searchTerm,     setSearchTerm]     = useState("");
    const [deferredPrompt, setDeferredPrompt] = useState(null);

    // ── PWA install prompt ──────────────────────────────────────────────────
    useEffect(() => {
        const handler = (e) => { e.preventDefault(); setDeferredPrompt(e); };
        window.addEventListener('beforeinstallprompt', handler);
        return () => window.removeEventListener('beforeinstallprompt', handler);
    }, []);

    const handleInstallClick = async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') setDeferredPrompt(null);
    };

    useEffect(() => {
        const onHashChange = () => {
            const r = getInitialRoute();
            setView(r.v); setLeadCategory(r.c);
            if (r.v !== 'add') setEditingProp(null);
        };
        window.addEventListener('hashchange', onHashChange);
        return () => window.removeEventListener('hashchange', onHashChange);
    }, []);

    const handleNavigate = (newView, newCat = 'website') => {
        setView(newView);
        if (newView === 'dashboard') setLeadCategory(newCat);
        if (newView !== 'add') setEditingProp(null);
        const path = newView === 'dashboard' ? `/crm/${newCat}` : newView === 'library' ? '/library' : '/add';
        window.location.hash = path;
    };

    useEffect(() => { setVisibleCount(50); }, [leadCategory, filterType, summaryAgent, searchTerm]);

    useEffect(() => {
        supabase.auth.getSession().then(({ data: { session } }) => {
            setSession(session);
            setAuthChecking(false);
            // Dismiss the splash screen once auth is resolved
            if (window.__dismissSplash) window.__dismissSplash();
        });
        const { data: { subscription } } = supabase.auth.onAuthStateChange((_e, s) => setSession(s));
        return () => subscription.unsubscribe();
    }, []);

    useEffect(() => {
        if (session) { fetchProperties(); if (view === 'dashboard') fetchLeads(); }
    }, [session, view, leadCategory]);

    async function fetchLeads() {
        setLoading(true);
        const table = leadCategory === 'bulk' ? 'bulk_leads' : 'leads';
        const { data, error } = await supabase.from(table).select('*').order('created_at', { ascending: false });
        if (!error) {
            let raw = data || [];
            if (table === 'leads') {
                if (leadCategory === 'website') raw = raw.filter(l => !l.lead_source || l.lead_source.trim() === '' || l.lead_source.toLowerCase().includes('website'));
                else if (leadCategory === 'manual') raw = raw.filter(l => l.lead_source && l.lead_source.trim() !== '' && !l.lead_source.toLowerCase().includes('website'));
            } else {
                raw = raw.map(l => ({ ...l, display_date: l.created_at || 'N/A' }));
            }
            setLeads(raw);
        }
        setLoading(false);
    }

    async function fetchProperties() {
        const { data } = await supabase.from('properties').select('*').order('created_at', { ascending: false });
        setProperties(data || []);
    }

    async function updateLead(lead, field, value) {
        if (field === 'lead_status' && (!lead.psa_agent_name || !lead.psa_agent_name.trim())) {
            alert("ERROR: Assign a PSA Agent before changing status."); fetchLeads(); return;
        }
        let updates = {};
        const stamp = new Date().toLocaleString('en-IN', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });

        if (field === 'lead_status')        { updates.lead_status   = value; updates.call_remark = `[${stamp}] Status Changed: ${value}\n\n${lead.call_remark || ''}`; }
        else if (field === 'follow_up_at')  { updates.follow_up_at  = value; updates.call_remark = `[${stamp}] Callback Set: ${new Date(value).toLocaleString('en-IN',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}\n\n${lead.call_remark || ''}`; }
        else if (field === 'site_visit_at') { updates.site_visit_at = value; updates.call_remark = `[${stamp}] SV Booked: ${value}\n\n${lead.call_remark || ''}`; }
        else if (field === 'add_note')      { if (!value.trim()) return; updates.add_note = value; updates.call_remark = `[${stamp}] Manual Note: ${value}\n\n${lead.call_remark || ''}`; }
        else if (field === 'reject_reason') { updates.reject_reason = value; updates.call_remark = `[${stamp}] Rejected Reason: ${value}\n\n${lead.call_remark || ''}`; }
        else                                { updates[field] = value; }

        const table = leadCategory === 'bulk' ? 'bulk_leads' : 'leads';
        setLeads(prev => prev.map(l => l.id === lead.id ? { ...l, ...updates } : l));
        const { error } = await supabase.from(table).update(updates).eq('id', lead.id);
        if (error) {
            if (error.message.includes('add_note')) alert("Add 'add_note' text column to Supabase 'leads' table.");
            else if (error.message.includes('reject_reason')) alert("Add 'reject_reason' text column to Supabase 'leads' table.");
            else alert("Save error: " + error.message);
            fetchLeads();
        }
    }

    const displayedLeads = useMemo(() => {
        let f = leads;
        const today = new Date().toISOString().split('T')[0];
        if (filterType === 'TODAY_CB')        f = f.filter(l => l.follow_up_at?.startsWith(today) && !['Rejected','Converted'].includes(l.lead_status));
        else if (filterType === 'TODAY_SV')   f = f.filter(l => l.site_visit_at === today && !['Rejected','Converted'].includes(l.lead_status));
        else if (filterType === 'MISSED_CB')  f = f.filter(l => l.follow_up_at && l.follow_up_at < today && !['Rejected','Converted'].includes(l.lead_status));
        else if (filterType === 'MISSED_SV')  f = f.filter(l => l.site_visit_at && l.site_visit_at < today && !['Rejected','Converted'].includes(l.lead_status));
        else if (filterType.startsWith('STATUS_')) f = f.filter(l => (l.lead_status || 'Un called') === filterType.replace('STATUS_',''));
        if (searchTerm.trim()) {
            const t = searchTerm.toLowerCase();
            f = f.filter(l => (l.customer_name||'').toLowerCase().includes(t) || (l.phone_number||'').toLowerCase().includes(t) || (l.project_interested_in||'').toLowerCase().includes(t));
        }
        return f;
    }, [leads, filterType, searchTerm]);

    const visibleLeads = displayedLeads.slice(0, visibleCount);

    const stats = useMemo(() => {
        let t = leads;
        if (summaryAgent !== 'All') t = t.filter(l => l.psa_agent_name === summaryAgent);
        return {
            total:     t.length,
            uncalled:  t.filter(l => l.lead_status === 'Un called' || !l.lead_status).length,
            called:    t.filter(l => l.lead_status && l.lead_status !== 'Un called' && l.lead_status !== 'Rejected').length,
            rejected:  t.filter(l => l.lead_status === 'Rejected').length,
        };
    }, [leads, summaryAgent]);

    if (authChecking) return <div className="min-h-screen bg-slate-950"></div>;

    if (!session)  return <LoginForm supabase={supabase} />;
    if (selectedProp) return <PropertyDetailsPage property={selectedProp} onBack={() => setSelectedProp(null)} />;

    return (
        <div className="min-h-screen flex flex-col animate-fadeIn">
            {/* ── Top Nav ── */}
            <nav className="bg-slate-900 text-white px-4 md:px-8 py-3 flex justify-between items-center sticky top-0 z-50 shadow-lg border-b border-slate-800">
                <div className="flex items-center gap-3">
                    <h1 className="font-black tracking-tighter text-lg md:text-xl uppercase italic">Horizon <span className="text-blue-400">CRM</span></h1>
                    {session?.user?.email && (
                        <span className="hidden md:block text-[9px] font-bold text-slate-500 bg-slate-800 border border-slate-700 px-2 py-1 rounded-lg uppercase tracking-widest truncate max-w-[160px]">
                            {session.user.email.split('@')[0]}
                        </span>
                    )}
                </div>
                <div className="flex gap-1 items-center">
                    {[
                        { id:'dashboard', label:'📊 CRM',     mobileLabel:'CRM',     cat: leadCategory },
                        { id:'library',   label:'🏢 Library', mobileLabel:'Library', cat: 'website' },
                        { id:'add',       label:'➕ Property', mobileLabel:'Add',     cat: 'website' },
                    ].map(n => (
                        <button key={n.id} onClick={() => handleNavigate(n.id, n.cat)}
                            className={`px-2.5 md:px-4 py-1.5 md:py-2 rounded-xl text-[9px] md:text-[10px] font-black uppercase tracking-widest transition ${view === n.id ? 'bg-blue-600 text-white shadow-md' : 'text-slate-400 hover:text-white hover:bg-slate-800'}`}>
                            <span className="hidden md:inline">{n.label}</span>
                            <span className="md:hidden">{n.mobileLabel}</span>
                        </button>
                    ))}
                    {deferredPrompt && (
                        <button onClick={handleInstallClick}
                            className="hidden md:flex items-center gap-1 ml-1 px-3 py-2 rounded-xl text-[9px] font-black uppercase tracking-widest bg-indigo-600 hover:bg-indigo-500 text-white transition shadow-md">
                            ⬇ Install
                        </button>
                    )}
                    <button onClick={() => supabase.auth.signOut()} className="ml-1 md:ml-3 text-[9px] font-black uppercase tracking-widest text-red-400 border border-red-900/60 px-2 md:px-3 py-1.5 md:py-2 rounded-xl hover:bg-red-900/40 transition">
                        <span className="hidden md:inline">Logout</span>
                        <span className="md:hidden">Out</span>
                    </button>
                </div>
            </nav>

            {/* ── Mobile Bottom Nav ── */}
            <div className="md:hidden fixed bottom-0 left-0 right-0 z-50 bg-white border-t-2 border-slate-200 shadow-2xl"
                style={{paddingBottom:'env(safe-area-inset-bottom,0px)'}}>
                <div className="flex">
                {[
                    { id:'dashboard', emoji:'📊', label:'CRM',     cat: leadCategory },
                    { id:'library',   emoji:'🏢', label:'Library',  cat: 'website' },
                    { id:'add',       emoji:'➕', label:'Add',      cat: 'website' },
                ].map(n => (
                    <button key={n.id} onClick={() => handleNavigate(n.id, n.cat)}
                        className={`flex-1 flex flex-col items-center justify-center py-3 gap-0.5 transition-all relative ${view === n.id ? 'text-blue-600' : 'text-slate-400 active:text-blue-500'}`}>
                        {view===n.id && <span className="absolute top-0 w-10 h-0.5 bg-blue-600 rounded-full"></span>}
                        <span className="text-2xl leading-none">{n.emoji}</span>
                        <span className={`text-[10px] font-black uppercase tracking-widest ${view===n.id?'text-blue-600':'text-slate-400'}`}>{n.label}</span>
                    </button>
                ))}
                {deferredPrompt && (
                    <button onClick={handleInstallClick}
                        className="flex-1 flex flex-col items-center justify-center py-3 gap-0.5 transition-all text-indigo-500 active:text-indigo-700">
                        <span className="text-2xl leading-none">⬇️</span>
                        <span className="text-[10px] font-black uppercase tracking-widest text-indigo-500">Install</span>
                    </button>
                )}
                </div>
            </div>

            <main className="p-3 md:p-8 max-w-7xl mx-auto w-full pb-24 md:pb-8">
                {view === 'dashboard' && (
                    <div className="space-y-6">
                        {/* Stats bar */}
                        <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-4">
                            <div className="flex flex-wrap justify-between md:grid md:grid-cols-5 gap-4 items-center">
                                <div className="w-full md:w-auto border-b md:border-none pb-2 md:pb-0">
                                    <select className="bg-transparent outline-none cursor-pointer text-slate-700 text-[10px] font-black uppercase w-full md:w-auto border border-slate-200 rounded-xl px-3 py-2 focus:ring-2 focus:ring-blue-500" value={summaryAgent} onChange={e => setSummaryAgent(e.target.value)}>
                                        <option value="All">📊 All Agents</option>
                                        <option value="Tharun">👤 Tharun</option><option value="Shivaji">👤 Shivaji</option><option value="Ramswami">👤 Ramswami</option>
                                    </select>
                                </div>
                                <div className="flex flex-col items-center flex-1 p-3 rounded-2xl bg-slate-50 border border-slate-100">
                                    <span className="text-[9px] uppercase font-black text-slate-400 mb-1">Total</span>
                                    <span className="font-black text-slate-700 text-2xl leading-none">{stats.total}</span>
                                </div>

                                        <option value="TODAY_CB">📅 Today's Callbacks</option>
                                        <option value="TODAY_SV">📅 Today's Site Visits</option>
                                        <option value="MISSED_CB">⚠️ Missed Callbacks</option>
                                        <option value="MISSED_SV">⚠️ Missed Site Visits</option>

                                            <option key={s} value={`STATUS_${s}`}>{s}</option>
                                        ))}
                                    </optgroup>
                                </select>

                            </div>

                            <div className="absolute right-3 top-1/2 -translate-y-1/2 flex items-center gap-2">

                                            <div className="skeleton h-14 w-36 rounded-xl"></div>

                                </div>
                            ) : (
                            <table className="w-full text-left text-xs">
                                <thead className="bg-slate-900 text-slate-400 font-black uppercase text-[9px] tracking-widest">

                                        <th className="px-5 py-3.5">Agent &amp; Status</th>
                                        <th className="px-5 py-3.5">Scheduling</th>
                                        <th className="px-5 py-3.5 min-w-[260px]">Activity &amp; Notes</th>

                                </thead>
                                <tbody className="divide-y divide-slate-100">

                                            <td className="px-5 py-4 min-w-[200px]">
                                                <p className="font-black text-[11px] uppercase text-slate-900 leading-tight">{l.customer_name}</p>
                                                <p className="text-blue-600 font-black text-[11px] mt-0.5">{l.phone_number}</p>

                                                <p className="text-[8px] text-slate-500 font-bold mt-1.5 tracking-widest uppercase truncate max-w-[160px]">
                                                    🏠 {leadCategory==='bulk'&&session?.user?.email!=='saishetty1623@gmail.com'?'[Restricted]':(l.project_interested_in||'General')}

                                                {l.created_at && <p className="text-[8px] text-slate-400 font-bold mt-1 tracking-widest uppercase">🕐 {leadCategory==='bulk'?l.created_at:l.display_date}</p>}

                                                    <a href={`tel:${l.phone_number}`} className="bg-slate-100 text-slate-600 text-[8px] font-black px-2.5 py-1.5 rounded-lg uppercase tracking-widest hover:bg-slate-200 transition border border-slate-200">📞 Call</a>

                                                </div>
                                            </td>
                                            <td className="p-4 min-w-[160px]">
                                                <select onChange={e => updateLead(l,'psa_agent_name',e.target.value)} value={l.psa_agent_name||''} className="w-full p-2 mb-2 border-2 rounded-xl font-black uppercase text-[9px] outline-none bg-slate-900 border-slate-700 text-blue-300 cursor-pointer">
                                                    <option value="" disabled>⚡ Assign Agent</option>
                                                    <option value="Tharun">👤 Tharun</option><option value="Shivaji">👤 Shivaji</option><option value="Ramswami">👤 Ramswami</option>
                                                </select>
                                                <select onChange={e => updateLead(l,'lead_status',e.target.value)} value={l.lead_status||''} className={`w-full p-2 mb-2 border-2 rounded-xl font-black uppercase text-[9px] outline-none cursor-pointer ${getStatusStyles(l.lead_status)}`}>
