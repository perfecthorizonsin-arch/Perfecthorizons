const gv = (obj, key) => {
    if (!obj) return "";
    if (obj[key] !== undefined && obj[key] !== "") return obj[key];
    const ck = key.replace(/[^a-zA-Z0-9]/g,'').toLowerCase();
    for (let k in obj) if (k.replace(/[^a-zA-Z0-9]/g,'').toLowerCase()===ck) return obj[k];

};

const driveThumb = (url) => {
    if (!url || typeof url !== 'string') return url;
    const m = url.match(/\/d\/(.*?)\//) || url.match(/id=(.*?)(&|$)/);
    return m ? `https://drive.google.com/thumbnail?id=${m[1]}&sz=w1000` : url;
};

const fixImg = (u) => u ? driveThumb(String(u).split(',')[0].trim()) : 'https://placehold.co/600x300/f1f5f9/94a3b8?text=No+Image';

const safeLink = (r) => {
    if (!r) return "#";
    const l = String(r).trim();
    if (l==="") return "#";
    if (l.includes('@') && !l.startsWith('mailto:')) return `mailto:${l}`;
    if (!l.startsWith('http') && !l.includes('@')) return `https://${l}`;
    return l;
};

const fmtCurrency = (n) => {
    if (n>=10000000) return '\u20B9'+(n/10000000).toFixed(2).replace(/\.00$/,'')+' Cr';
    if (n>=100000)   return '\u20B9'+(n/100000).toFixed(2).replace(/\.00$/,'')+' L';
    return new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(n);
};

const fmtPct = (v) => {
    const n=parseFloat(v);
    if (isNaN(n)) return String(v||"0%");
    return (n<1&&n>0)?(n*100).toFixed(1)+"%":n+"%";
};

const priceInCr = (s) => {
    if (!s) return 0;
    try {
        const c=String(s).toLowerCase().replace(/,/g,'');
        const m=c.match(/[0-9.]+/); if(!m) return 0;
        const v=parseFloat(m[0]); if(isNaN(v)) return 0;
        if (c.includes('cr')||c.includes('crore')) return v;
        if (c.includes('lac')||c.includes('lakh')) return v/100;
        if (v>100000) return v/10000000;
        return 0;
    } catch(e){ return 0; }
};

// ─── FILE SHARE UTILITIES ───────────────────────────────────────────────────
const getDriveId = (url) => {
    if (!url) return null;
    const m = url.match(/\/d\/([-\w]+)/) || url.match(/[?&]id=([-\w]+)/);
    return m ? m[1] : null;
};

const resolveUrl = (url) => {
    if (!url) return { kind:'unknown', url, dlUrl:url };
    const u = url.trim();
    if (u.includes('res.cloudinary.com')) {
        const isPdf = u.toLowerCase().endsWith('.pdf') || u.includes('/raw/upload/');
        return { kind: isPdf?'cloudinary_pdf':'cloudinary_img', url:u, dlUrl:u.replace('/upload/','/upload/fl_attachment/') };
    }
    if (u.includes('/folders/') || (u.includes('drive.google.com') && !u.includes('/d/'))) {
        return { kind:'drive_folder', url:u, dlUrl:u };
    }
    const driveId = getDriveId(u);
    if (driveId) {
        return {
            kind:'drive_file', url:u,
            dlUrl:   `https://drive.google.com/uc?export=download&id=${driveId}`,
            viewUrl: `https://drive.google.com/file/d/${driveId}/view`,
            thumb:   `https://drive.google.com/thumbnail?id=${driveId}&sz=w300`,
        };
    }
    return { kind:'link', url:u, dlUrl:u };
};

const isMobileDevice = () => /android|iphone|ipad|ipod/i.test(navigator.userAgent);

const buildFilename = (url, index, type) => {
    try {
        const parts = url.split('/');
        const raw   = decodeURIComponent(parts[parts.length-1].split('?')[0]);
        if (/\.(pdf|jpg|jpeg|png|webp)$/i.test(raw)) return raw;
        const slug = type.toLowerCase().replace(/\s+/g,'-');
        if (url.includes('/image/upload/'))   return slug+'-'+(index+1)+'.jpg';
        if (url.includes('/raw/upload/'))     return slug+'-'+(index+1)+'.pdf';
        return slug+'-'+(index+1);
    } catch(e) { return 'file-'+(index+1); }
};

const triggerDownload = (resolved, filename) => {
    const a = document.createElement('a');
    a.style.display = 'none';
    if (resolved.kind === 'cloudinary_img' || resolved.kind === 'cloudinary_pdf') {
        a.href = resolved.dlUrl; a.download = filename||'file';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
    } else if (resolved.kind === 'drive_file') {
        a.href = resolved.dlUrl; a.target = '_blank';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
    } else if (resolved.kind === 'drive_folder') {
        window.open(resolved.url, '_blank');
    }
};

// ─── EMI CALCULATOR ────────────────────────────────────────────────────────
const EMICalc = ({ priceStr }) => {
    const base = priceInCr(priceStr)>0 ? priceInCr(priceStr)*10000000 : 10000000;
    const [loan,   setLoan]   = useState(base*0.8);
    const [rate,   setRate]   = useState(8.5);
    const [tenure, setTenure] = useState(20);

    const { emi, totalInt, pct } = useMemo(()=>{
        const p=loan, r=rate/12/100, n=tenure*12;
        if(!p||!r||!n) return {emi:0,totalInt:0,pct:100};
        const e=(p*r*Math.pow(1+r,n))/(Math.pow(1+r,n)-1);
        const tot=e*n;
        return {emi:Math.round(e),totalInt:Math.round(tot-p),pct:(p/tot*100).toFixed(1)};
    },[loan,rate,tenure]);

    return (
        <div className="card p-5 mt-4">
            <div className="flex items-center gap-2 mb-5">
                <span className="text-lg">📊</span>
                <span className="text-xs font-black uppercase tracking-widest text-slate-700">EMI Calculator</span>
            </div>
            <div className="flex items-center gap-4 mb-6">
                <div className="w-14 h-14 pie-chart shrink-0" style={{background:`conic-gradient(#2563eb ${pct}%,#e2e8f0 ${pct}% 100%)`}}></div>
                <div className="flex-1 space-y-1.5">
                    <div className="flex justify-between text-[9px]">
                        <span className="flex items-center gap-1.5 font-bold text-slate-500 uppercase tracking-widest"><span className="w-2 h-2 rounded-full bg-blue-600 inline-block"></span>Principal</span>
                        <span className="font-black text-slate-800">{fmtCurrency(loan)}</span>
                    </div>
                    <div className="flex justify-between text-[9px]">
                        <span className="flex items-center gap-1.5 font-bold text-slate-500 uppercase tracking-widest"><span className="w-2 h-2 rounded-full bg-slate-300 inline-block"></span>Interest</span>
                        <span className="font-black text-slate-800">{fmtCurrency(totalInt)}</span>
                    </div>
                </div>
            </div>
            {[
                {label:'Loan Amount', val:fmtCurrency(loan),  min:1000000,  max:50000000, step:100000, onChange:setLoan,   cur:loan},
                {label:'Interest Rate',val:rate+'%',           min:6,        max:15,       step:0.1,    onChange:setRate,   cur:rate},
                {label:'Tenure',       val:tenure+' Yrs',      min:5,        max:30,       step:1,      onChange:setTenure, cur:tenure},
            ].map(s=>(
                <div key={s.label} className="mb-4">
                    <div className="flex justify-between mb-1.5">
                        <span className="text-[9px] font-black uppercase tracking-widest text-slate-400">{s.label}</span>
                        <span className="text-[10px] font-black text-blue-600 bg-blue-50 px-2 py-0.5 rounded-md">{s.val}</span>
                    </div>
                    <input type="range" min={s.min} max={s.max} step={s.step} value={s.cur} onChange={e=>s.onChange(Number(e.target.value))} />
                </div>
            ))}
            <div className="pt-4 border-t border-slate-100 flex justify-between items-center">
                <span className="text-[9px] font-black uppercase tracking-widest text-slate-400">Monthly EMI</span>
                <span className="text-xl font-black text-slate-900">{fmtCurrency(emi)} <span className="text-[9px] text-slate-400 font-bold">/mo</span></span>
            </div>
        </div>
    );
};

// ─── PROPERTY DETAILS PAGE (Admin) ─────────────────────────────────────────
// FIX #3 EDIT PROPAGATION: onUpdate callback lets parent (AdminApp) sync changes
const PropertyPage = ({ property:init, onBack, onUpdate }) => {
    const [prop,       setProp]       = useState(init);
    const [editField,  setEditField]  = useState(null);
    const [editVal,    setEditVal]    = useState('');
    const [saving,     setSaving]     = useState(false);
    const [toast,      setToast]      = useState(null);
    const [shareModal, setShareModal] = useState(null);
    const [selected,   setSelected]   = useState([]);
    const [sharing,    setSharing]    = useState(false);
    const galleryRef = useRef(null);

    // FIX #3: Sync local prop state when parent passes updated init
    useEffect(()=>{ setProp(init); window.scrollTo(0,0); },[init]);

    const showToast = (msg, color='bg-emerald-500') => {
        setToast({msg,color});
        setTimeout(()=>setToast(null), 4000);
    };

    const startEdit  = (field, val) => { setEditField(field); setEditVal(val||''); };
    const cancelEdit = () => setEditField(null);

    const saveField  = async (field, val) => {
        setSaving(true);
        const {error} = await supabase.from('properties').update({[field]:val}).eq('id',prop.id);
        if (!error) {
            setProp(p=>({...p,[field]:val}));
            // FIX #3: Propagate change up so Library list also stays fresh
            if (onUpdate) onUpdate(prop.id, field, val);
            showToast('Saved');
            setEditField(null);
        } else {
            showToast('Error: '+error.message,'bg-red-500');
        }
        setSaving(false);
    };

    const EF = ({field,label,val,multiline=false,type='text'}) => {
        const editing = editField===field;
        return (
            <div className="group/ef">
                {!editing ? (
                    <div className="flex items-start gap-2">
                        <div className="flex-1 min-w-0">
                            {label && <div className="text-[9px] font-black uppercase tracking-widest text-slate-400 mb-0.5">{label}</div>}
                            <div className={`text-sm font-semibold break-words ${val?'text-slate-800':'italic text-slate-300'}`}>{val||'—'}</div>
                        </div>
                        <button onClick={()=>startEdit(field,val)} className="opacity-0 group-hover/ef:opacity-100 transition-opacity shrink-0 mt-0.5 text-[8px] font-black bg-blue-50 text-blue-600 border border-blue-200 px-2 py-1 rounded-lg uppercase tracking-widest hover:bg-blue-100">Edit</button>
                    </div>
                ) : (
                    <div className="space-y-2">
                        {label && <div className="text-[9px] font-black uppercase tracking-widest text-slate-400">{label}</div>}
                        {multiline
                            ? <textarea rows={4} autoFocus value={editVal} onChange={e=>setEditVal(e.target.value)} className="w-full p-2.5 border-2 border-blue-400 rounded-xl text-sm font-semibold outline-none resize-none bg-blue-50/50 focus:bg-white transition-colors" />
                            : <input type={type} autoFocus value={editVal} onChange={e=>setEditVal(e.target.value)} className="w-full p-2.5 border-2 border-blue-400 rounded-xl text-sm font-semibold outline-none bg-blue-50/50 focus:bg-white transition-colors" />
                        }
                        <div className="flex gap-2">
                            <button onClick={()=>saveField(field,editVal)} disabled={saving} className="btn-primary text-[9px] py-1.5 px-3">{saving?'Saving…':'Save'}</button>
                            <button onClick={cancelEdit} className="btn-ghost text-[9px] py-1.5 px-3">Cancel</button>
                        </div>
                    </div>
                )}
            </div>
        );
    };

    const cover  = driveThumb(gv(prop,'cover_image')||gv(prop,'cover-image'));
    const galRaw = gv(prop,'gallery_images')||gv(prop,'gallery-images')||'';
    const imgs   = [cover,...(galRaw?galRaw.split(',').map(l=>driveThumb(l.trim())):[])].filter(Boolean);

    const parseField = (raw) => {
        if (!raw||!raw.trim()) return [];
        return raw.split(',').map(u=>u.trim()).filter(Boolean).map(u=>({url:u, resolved:resolveUrl(u)}));
    };

    const handleShare = (type, rawField) => {
        const items = parseField(rawField);
        if (!items.length) { showToast('No '+type+' available for this property.','bg-amber-500'); return; }
        if (items.length===1) { doShare([items[0]], type); }
        else { setShareModal({type, items}); setSelected(items.map(i=>i.url)); }
    };

    // FIX #6 WHATSAPP: Use wa.me for both mobile and desktop — wa.me redirects to
    // the native app on mobile and to WhatsApp Web (with pre-filled message) on desktop.
    // Previously, desktop opened https://web.whatsapp.com/ with NO message in the URL.
    const doShare = (items, type) => {
        const propName  = gv(prop,'property_name');
        const mobile    = isMobileDevice();
        const fileItems = items.filter(i=>i.resolved.kind!=='link');
        const linkItems = items.filter(i=>i.resolved.kind==='link');

        // Step 1: Trigger downloads in staggered fashion
        fileItems.forEach((item, i) => {
            const fname = buildFilename(item.url, i, type);
            setTimeout(() => triggerDownload(item.resolved, fname), i * 400);
        });

        // Step 2: Build WhatsApp message
        let waMsg = 'Hi! ';
        if (fileItems.length) {
            const fileWord = fileItems.length===1 ? 'the file' : fileItems.length+' files';
            // NOTE: Using double quotes to avoid apostrophe string-literal issues
            waMsg += "I'm sending you "+fileWord+" for *"+propName+"*\n";
            waMsg += '('+type+' — just sent as attachment)';
        }
        if (linkItems.length) {
            waMsg += (fileItems.length ? '\n\n' : '') + 'Here is the *'+type+'* for *'+propName+'*:\n';
            waMsg += linkItems.map(i=>i.url).join('\n');
        }

        // Step 3: Open WhatsApp with pre-typed message
        // FIX #6: wa.me/?text= works on both mobile (opens app) and desktop (opens WA Web)
        const delay = fileItems.length * 400 + 300;
        setTimeout(() => {

        <div className="min-h-screen bg-slate-100 animate-fadeIn pb-28 md:pb-8">

// ─── PROJECT LIBRARY ───────────────────────────────────────────────────────
const Library = ({ props:initProps, onSelect, supabase }) => {
    const [props,      setProps]      = useState(initProps||[]);
    const [togglingId, setTogglingId] = useState(null);
    const [search,     setSearch]     = useState('');

    useEffect(()=>setProps(initProps||[]),[initProps]);

    // FIX #2 TOGGLE: Use isLive() helper which handles both boolean true and string 'true'
    const toggle = async (e, p) => {
        e.stopPropagation();
        const live   = isLive(p);
        const newVal = !live; // always a real boolean
        setTogglingId(p.id);
        const {error} = await supabase.from('properties').update({is_live:newVal}).eq('id',p.id);
        if (!error) {
            setProps(prev=>prev.map(x=>x.id===p.id?{...x,is_live:newVal}:x));
        } else {
            alert('Update failed: '+error.message);
        }
        setTogglingId(null);
    };

    const filtered = props.filter(p=>{
        if (!search) return true;
        const t=search.toLowerCase();
        return gv(p,'property_name').toLowerCase().includes(t)||gv(p,'location').toLowerCase().includes(t)||gv(p,'builder_name').toLowerCase().includes(t);
    });

    if (!props.length) return (
        <div className="text-center py-24 text-slate-400 font-black uppercase tracking-widest animate-pulse">Library Empty</div>
    );

    return (
        <div className="animate-fadeIn space-y-5">
            <div className="relative">
                <span className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm">🔍</span>
                <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search property, location, builder…" className="w-full pl-10 pr-4 py-3 bg-white border border-slate-200 rounded-2xl text-sm font-semibold outline-none focus:ring-2 focus:ring-blue-500 shadow-sm" />
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4">
                {filtered.map(p=>{
                    const live = isLive(p); // FIX #2
                    const tog  = togglingId===p.id;
                    return (
                        <div key={p.id} className="card overflow-hidden hover:shadow-md hover:-translate-y-0.5 transition-all duration-200 flex flex-col group">
                            <div className="relative h-44 bg-slate-100 overflow-hidden cursor-pointer" onClick={()=>onSelect(p)}>
                                <img src={fixImg(gv(p,'cover_image')||gv(p,'cover-image'))} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" alt="" />
                                <div className="absolute top-3 left-0 bg-slate-900/85 text-white text-[9px] font-black px-3 py-1.5 rounded-r-lg uppercase tracking-widest">
                                    {gv(p,'property_type')||'Property'}
                                </div>
                                <div className={`absolute top-3 right-3 text-[9px] font-black px-2.5 py-1 rounded-full border ${live?'bg-emerald-100 text-emerald-700 border-emerald-300':'bg-red-100 text-red-600 border-red-300'}`}>
                                    {live?'Live':'Hidden'}
                                </div>
                            </div>
                            <div className="p-4 flex flex-col flex-1">
                                <h3 onClick={()=>onSelect(p)} className="font-black uppercase tracking-tight text-slate-900 text-base leading-tight truncate cursor-pointer hover:text-blue-600 transition-colors">{gv(p,'property_name')}</h3>
                                <p className="text-slate-400 text-xs font-semibold mt-0.5 truncate">📍 {gv(p,'location')||'—'}</p>
                                <div className="mt-3 pt-3 border-t border-slate-100 flex justify-between items-center gap-2">
                                    <div>
                                        <div className="text-[9px] text-slate-400 font-bold uppercase tracking-widest">From</div>
                                        <div className="text-sm font-black text-blue-700">{gv(p,'price')||'On Request'}</div>
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <button onClick={e=>toggle(e,p)} disabled={tog} className={`text-[9px] font-black px-3 py-1.5 rounded-lg border transition-all disabled:opacity-50 ${live?'bg-red-50 border-red-300 text-red-700 hover:bg-red-100':'bg-emerald-50 border-emerald-300 text-emerald-700 hover:bg-emerald-100'}`}>
                                            {tog?'…':live?'Hide':'Set Live'}
                                        </button>
                                        <button onClick={()=>onSelect(p)} className="btn-primary text-[9px] py-1.5 px-3">Open</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    );
                })}
            </div>
        </div>
    );
};

// FIX #4 TYPING LAG: FieldWrapper and FileChip MUST be defined OUTSIDE AddPropertyForm.
// When defined inside, every keystroke re-renders AddPropertyForm, creating NEW component
// function references. React treats these as completely new components, unmounts/remounts
// them, and the focused input loses focus on every character typed.
const FieldWrapper = ({label, children}) => (
    <div className="field-group">
        <label>{label}</label>
        {children}
    </div>
);

const FileChip = ({name, onRemove}) => (
    <div className="inline-flex items-center gap-2 bg-blue-50 border border-blue-200 text-blue-700 px-3 py-1.5 rounded-lg mt-2 text-[10px] font-bold mr-2">
        <span className="truncate max-w-[130px]">{name}</span>
        <button onClick={onRemove} className="text-red-500 hover:text-red-700 leading-none font-black">&times;</button>
    </div>
);

const AddPropertyForm = ({ supabase, scriptUrl }) => {
    const blank = { property_name:'',builder_name:'',property_region:'',property_type:'',location:'',price:'',bhk:'',super_built_up_area:'',possession_date:'',construction_status:'',approval:'',total_units:'',availability:'',description:'',usp_details:'',amenities:'',point_of_contact:'',commission_details:'',video_link:'',website_link:'',lead_registration_link:'',map_link:'',cover_image:'',gallery_images:'',floor_plan:'',brochure:'',cost_sheet:'',miscellaneous:'' };
    const [form,        setForm]        = useState(blank);
    const [loading,     setLoading]     = useState(false);
    const [uploadField, setUploadField] = useState(null);
    const [saved,       setSaved]       = useState(false);

    const set = useCallback((k,v) => setForm(f=>({...f,[k]:v})), []);

    const removeFile = useCallback((field, multi=false, idx=null) => {
        if (multi) {
            setForm(f=>{
                const arr=f[field].split(',').filter(Boolean);
                arr.splice(idx,1);
                return {...f,[field]:arr.join(',')};
            });
        } else {
            setForm(f=>({...f,[field]:''}));
        }
    }, []);

    const upload = async (e, field, multi=false) => {
        const files=e.target.files; if(!files||!files.length) return;
        setLoading(true); setUploadField(field);
        const catMap = {cover_image:'Cover Image',gallery_images:'Gallery',brochure:'Brochures',cost_sheet:'Cost Sheets',floor_plan:'Floor Plans',miscellaneous:'Miscellaneous'};
        const cat = catMap[field]||'General';
        let urls=[];
        for (let i=0;i<files.length;i++) {
            const file=files[i];
            const url = await new Promise(res=>{
                const r=new FileReader();
                r.readAsDataURL(file);
                r.onload=async()=>{
                    try {
                        const resp = await fetch(scriptUrl,{method:'POST',body:JSON.stringify({base64:r.result.split(',')[1],type:file.type,name:file.name,propertyName:form.property_name||'Uploads',category:cat})});
                        const j=await resp.json();
                        res(j.status==='success'?j.fileUrl||j.url:null);
                    } catch(e){ res(null); }
                };
            });
            if(url) urls.push(url);
        }
        if(urls.length){
            const joined=urls.join(',');
            if(multi) setForm(f=>({...f,[field]:f[field]?f[field]+','+joined:joined}));
            else setForm(f=>({...f,[field]:joined}));
        }
        setLoading(false); setUploadField(null);
    };

    const save = async () => {
        if(!form.property_name||!form.price||!form.cover_image){
            alert('Please fill: Property Name, Price, and Cover Image.'); return;
        }
        setLoading(true);
        const payload={...form,is_live:true};
        const {error}=await supabase.from('properties').insert([payload]);
        if(!error){ setSaved(true); setForm(blank); setTimeout(()=>setSaved(false),3000); }
        else alert(error.message);
        setLoading(false);
    };

    return (
        <div className="max-w-4xl mx-auto animate-fadeIn">
            <div className="card p-6 md:p-8 space-y-6">
                <div className="flex items-center justify-between">
                    <div>
                        <h2 className="text-xl font-black uppercase tracking-tight text-slate-900">New Property Listing</h2>
                        <p className="text-xs text-slate-400 font-semibold mt-0.5">All starred fields are required</p>
                    </div>
                    {saved&&<div className="bg-emerald-100 text-emerald-700 font-black text-[10px] uppercase tracking-widest px-4 py-2 rounded-xl border border-emerald-200 animate-fadeIn">Published!</div>}
                </div>

                {/* Basic Info */}
                <div>
                    <div className="text-[9px] font-black uppercase tracking-widest text-slate-400 mb-3 pb-2 border-b border-slate-100">Basic Information</div>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <FieldWrapper label="Property Name ★"><input value={form.property_name} onChange={e=>set('property_name',e.target.value)} placeholder="e.g. Prestige Lakeside Habitat" /></FieldWrapper>
                        <FieldWrapper label="Builder Name"><input value={form.builder_name} onChange={e=>set('builder_name',e.target.value)} placeholder="e.g. Prestige Group" /></FieldWrapper>
                        <FieldWrapper label="Region">
                            <select value={form.property_region} onChange={e=>set('property_region',e.target.value)}>
                                <option value="">Select Region</option>
                                {['North','South','East','West'].map(r=><option key={r}>{r}</option>)}
                            </select>
                        </FieldWrapper>
                        <FieldWrapper label="Property Type">
                            <select value={form.property_type} onChange={e=>set('property_type',e.target.value)}>
                                <option value="">Select Type</option>

const ManualLeadForm = ({ supabase, properties, onSuccess }) => {
    const [form, setForm] = useState({name:'',phone:'',email:'',project:'General Enquiry',note:'',source:'Manual Entry'});
    const [loading, setLoading] = useState(false);
    const set = (k,v) => setForm(f=>({...f,[k]:v}));

    const submit = async (e) => {
        e.preventDefault(); setLoading(true);
        const t=stamp();
        const {error}=await supabase.from('leads').insert([{
            customer_name:form.name, phone_number:form.phone, customer_email:form.email||null,
            project_interested_in:form.project, add_note:form.note,
            call_remark:form.note?`[${t}] Requirement: ${form.note}\n\n`:'',
            lead_source:form.source, lead_status:'Un called'
        }]);
        if(!error){
            fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'application/json'},
                body:JSON.stringify({action:'sendLead',Name:form.name,Phone:form.phone,Email:form.email||'N/A',Project:form.project,Source:form.source,Requirements:form.note||'None'})
            }).catch(()=>{});
            onSuccess();
        } else alert(error.message);
        setLoading(false);
    };

    return (
        <form onSubmit={submit} className="space-y-3">
            <div className="field-group"><label>Client Name</label><input required value={form.name} onChange={e=>set('name',e.target.value)} placeholder="Full name" /></div>
            <div className="field-group"><label>Phone</label><input required value={form.phone} onChange={e=>set('phone',e.target.value)} placeholder="10-digit number" /></div>
            <div className="field-group"><label>Email (optional)</label><input type="email" value={form.email} onChange={e=>set('email',e.target.value)} placeholder="email@domain.com" /></div>
            <div className="field-group">
                <label>Project Interest</label>
                <select value={form.project} onChange={e=>set('project',e.target.value)}>
                    <option value="General Enquiry">General Enquiry</option>
                    {properties?.map(p=><option key={p.id} value={gv(p,'property_name')}>{gv(p,'property_name')}</option>)}
                </select>
            </div>
            <div className="field-group"><label>Requirements / Notes</label><textarea rows={3} value={form.note} onChange={e=>set('note',e.target.value)} placeholder="Budget, BHK preference, timeline…" className="resize-none" /></div>
            <div className="field-group">
                <label>Source</label>
                <select value={form.source} onChange={e=>set('source',e.target.value)}>
                    {['Manual Entry','Walk-in','Referral','MagicBricks','Housing.com','99Acres','JustDial'].map(s=><option key={s}>{s}</option>)}
                </select>
            </div>
            <button disabled={loading} className="btn-primary w-full py-3 text-xs">{loading?'Adding Lead…':'+ Inject Lead'}</button>
        </form>
    );
};

const Login = () => {
    const [email,setEmail]=useState(''); const [pass,setPass]=useState('');
    const [loading,setLoading]=useState(false); const [err,setErr]=useState('');
    const go=async(e)=>{
        e.preventDefault(); setLoading(true); setErr('');
        const {error}=await supabase.auth.signInWithPassword({email,password:pass});

        setLoading(false);
    };
    return (
        <div className="min-h-screen bg-slate-950 flex items-center justify-center p-4">
            <form onSubmit={go} className="bg-white w-full max-w-sm rounded-[32px] p-10 shadow-2xl text-center border-t-4 border-blue-500">

// ─── ADMIN APP ─────────────────────────────────────────────────────────────
const getRoute = () => {
    const h=window.location.hash.replace('#','');
    if (h.startsWith('/library')) return {v:'library',c:'website'};
    if (h.startsWith('/add'))     return {v:'add',    c:'website'};
    if (h.includes('/bulk'))      return {v:'crm',    c:'bulk'};
    if (h.includes('/manual'))    return {v:'crm',    c:'manual'};
    return {v:'crm',c:'website'};
};

function AdminApp() {
    const init=getRoute();
    const [session,    setSession]    = useState(null);
    const [authReady,  setAuthReady]  = useState(false);
    const [view,       setView]       = useState(init.v);
    const [tab,        setTab]        = useState(init.c);
    const [leads,      setLeads]      = useState([]);
    const [props,      setProps]      = useState([]);
    const [loading,    setLoading]    = useState(true);
    const [manualOpen, setManualOpen] = useState(false);
    const [filter,     setFilter]     = useState('ALL');
    const [agentFilter,setAgentFilter]= useState('All');
    const [selProp,    setSelProp]    = useState(null);
    const [visible,    setVisible]    = useState(50);
    const [search,     setSearch]     = useState('');

    // Router
    useEffect(()=>{
        const fn=()=>{ const r=getRoute(); setView(r.v); setTab(r.c); };
        window.addEventListener('hashchange',fn);
        return ()=>window.removeEventListener('hashchange',fn);
    },[]);

    const nav=(v,c='website')=>{
        setView(v); if(v==='crm') setTab(c);
        const h=v==='crm'?`/crm/${c}`:v==='library'?'/library':'/add';
        window.location.hash=h;
    };

    // Auth
    useEffect(()=>{
        supabase.auth.getSession().then(({data:{session}})=>{ setSession(session); setAuthReady(true); });
        const {data:{subscription}}=supabase.auth.onAuthStateChange((_,s)=>setSession(s));
        return ()=>subscription.unsubscribe();
    },[]);

    // Data fetchers (stable references)
    const fetchProps = useCallback(async()=>{
        const {data}=await supabase.from('properties').select('*').order('created_at',{ascending:false});
        setProps(data||[]);
    },[]);

    const fetchLeads = useCallback(async()=>{
        setLoading(true);
        const tbl=tab==='bulk'?'bulk_leads':'leads';
        const {data,error}=await supabase.from(tbl).select('*').order('created_at',{ascending:false});
        if(!error){
            let raw=data||[];
            if(tbl==='leads'){
                if(tab==='website') raw=raw.filter(l=>!l.lead_source||l.lead_source.trim()===''||l.lead_source.toLowerCase().includes('website'));
                else if(tab==='manual') raw=raw.filter(l=>l.lead_source&&l.lead_source.trim()!==''&&!l.lead_source.toLowerCase().includes('website'));
            }
            setLeads(raw);
        }
        setLoading(false);
    },[tab]);

    useEffect(()=>{
        if(!session) return;
        fetchProps();
        if(view==='crm') fetchLeads();
    },[session,view,tab]);

    useEffect(()=>setVisible(50),[tab,filter,agentFilter,search]);

    // FIX #3: onUpdate propagates PropertyPage saves back to AdminApp's props list
    const handlePropUpdate = useCallback((propId, field, val) => {
        setProps(prev => prev.map(p => p.id===propId ? {...p,[field]:val} : p));
        setSelProp(prev => prev ? {...prev,[field]:val} : prev);
    },[]);

    const updateLead=async(lead,field,value)=>{
        if(field==='lead_status'&&(!lead.psa_agent_name||!lead.psa_agent_name.trim())){
            alert('Assign an agent before changing status.'); return;
        }
        let updates={};
        const t=stamp();
        if(field==='lead_status')       { updates.lead_status=value; updates.call_remark=`[${t}] Status → ${value}\n\n${lead.call_remark||''}`; }
        else if(field==='follow_up_at') { updates.follow_up_at=value; updates.call_remark=`[${t}] Callback: ${new Date(value).toLocaleString('en-IN',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}\n\n${lead.call_remark||''}`; }
        else if(field==='site_visit_at'){ updates.site_visit_at=value; updates.call_remark=`[${t}] SV Booked: ${value}\n\n${lead.call_remark||''}`; }
        else if(field==='add_note')     { if(!value.trim()) return; updates.add_note=value; updates.call_remark=`[${t}] Note: ${value}\n\n${lead.call_remark||''}`; }
        else if(field==='reject_reason'){ updates.reject_reason=value; updates.call_remark=`[${t}] Rejected: ${value}\n\n${lead.call_remark||''}`; }
        else updates[field]=value;

        const tbl=tab==='bulk'?'bulk_leads':'leads';
        setLeads(p=>p.map(l=>l.id===lead.id?{...l,...updates}:l));
        const {error}=await supabase.from(tbl).update(updates).eq('id',lead.id);
        if(error){ alert('Save error: '+error.message); fetchLeads(); }
    };

    const displayed=useMemo(()=>{
        let f=leads;
        const td=new Date().toISOString().split('T')[0];
        if(filter==='TODAY_CB')   f=f.filter(l=>l.follow_up_at?.startsWith(td)&&!['Rejected','Converted'].includes(l.lead_status));
        else if(filter==='TODAY_SV')  f=f.filter(l=>l.site_visit_at===td&&!['Rejected','Converted'].includes(l.lead_status));
        else if(filter==='MISSED_CB') f=f.filter(l=>l.follow_up_at&&l.follow_up_at<td&&!['Rejected','Converted'].includes(l.lead_status));
        else if(filter==='MISSED_SV') f=f.filter(l=>l.site_visit_at&&l.site_visit_at<td&&!['Rejected','Converted'].includes(l.lead_status));
        else if(filter.startsWith('STATUS_')) f=f.filter(l=>(l.lead_status||'Un called')===filter.replace('STATUS_',''));
        if(agentFilter!=='All') f=f.filter(l=>l.psa_agent_name===agentFilter);
        if(search.trim()){ const t=search.toLowerCase(); f=f.filter(l=>(l.customer_name||'').toLowerCase().includes(t)||(l.phone_number||'').toLowerCase().includes(t)||(l.project_interested_in||'').toLowerCase().includes(t)); }
        return f;
    },[leads,filter,agentFilter,search]);

    const visLeads=displayed.slice(0,visible);

    const stats=useMemo(()=>{
        let t=leads; if(agentFilter!=='All') t=t.filter(l=>l.psa_agent_name===agentFilter);
        return {
            total:t.length,
            uncalled:t.filter(l=>l.lead_status==='Un called'||!l.lead_status).length,
            working:t.filter(l=>l.lead_status&&l.lead_status!=='Un called'&&l.lead_status!=='Rejected'&&l.lead_status!=='Converted').length,
            rejected:t.filter(l=>l.lead_status==='Rejected').length,
            converted:t.filter(l=>l.lead_status==='Converted').length,
        };
    },[leads,agentFilter]);

    if (!authReady) return (
        <div className="min-h-screen bg-slate-950 flex flex-col items-center justify-center gap-3">
            <div className="text-2xl font-black italic text-white uppercase tracking-widest animate-pulse">Horizon CRM</div>
            <div className="text-blue-400 text-[10px] font-bold uppercase tracking-widest">Verifying Access…</div>
        </div>
    );
    if (!session) return <Login />;

    // FIX #3: Pass onUpdate so PropertyPage changes bubble up to props list
    if (selProp) return <PropertyPage property={selProp} onBack={()=>setSelProp(null)} onUpdate={handlePropUpdate} />;

    const isOwner = session?.user?.email===OWNER_EMAIL;

    return (
        <div className="min-h-screen flex flex-col bg-slate-100 animate-fadeIn">
            {/* NAV */}
            <nav className="bg-slate-950 text-white px-4 md:px-6 py-3.5 flex justify-between items-center sticky top-0 z-50 shadow-lg">
                <div className="flex items-center gap-1">
                    <h1 className="font-black text-lg uppercase italic tracking-tight">Horizon</h1>
                    <span className="text-blue-400 font-black text-lg italic uppercase tracking-tight">CRM</span>
                </div>
                <div className="flex items-center gap-1 md:gap-2">
                    {[{id:'crm',label:'CRM'},{id:'library',label:'Library'},{id:'add',label:'+ Project'}].map(({id,label})=>(
                        <button key={id} onClick={()=>nav(id)} className={`nav-btn px-3 py-1.5 rounded-lg text-[10px] font-black uppercase tracking-widest transition-all ${view===id?'bg-blue-600 text-white':'text-slate-400 hover:text-white hover:bg-slate-800'}`}>{label}</button>
                    ))}
                    <button onClick={()=>supabase.auth.signOut()} className="nav-btn ml-2 text-red-400 border border-red-800 px-3 py-1.5 rounded-lg text-[9px] font-black uppercase tracking-widest hover:bg-red-900/40 transition">Logout</button>
                </div>
            </nav>

            <main className="p-3 md:p-6 max-w-7xl mx-auto w-full flex-1">

                {/* CRM VIEW */}
                {view==='crm' && (
                    <div className="space-y-4 animate-fadeIn">
                        {/* Stats Bar */}
                        <div className="card p-4">
                            <div className="flex flex-wrap md:grid md:grid-cols-6 gap-3 items-center">
                                <select className="bg-transparent outline-none text-[10px] font-black uppercase tracking-widest text-slate-600 border border-slate-200 rounded-lg px-2 py-1.5 cursor-pointer md:col-span-1" value={agentFilter} onChange={e=>setAgentFilter(e.target.value)}>
                                    <option value="All">All Agents</option>
                                    {AGENTS.map(a=><option key={a}>{a}</option>)}
                                </select>
                                {[
                                    {label:'Total',    val:stats.total,     color:'text-slate-700'},
                                    {label:'Uncalled', val:stats.uncalled,  color:'text-amber-600'},
                                    {label:'Working',  val:stats.working,   color:'text-blue-600'},
                                    {label:'Converted',val:stats.converted, color:'text-emerald-600'},
                                    {label:'Rejected', val:stats.rejected,  color:'text-red-600'},
                                ].map(s=>(
                                    <div key={s.label} className="flex flex-col items-center flex-1 cursor-pointer" onClick={()=>s.label!=='Total'&&setFilter(`STATUS_${s.label==='Uncalled'?'Un called':s.label==='Working'?'Called':s.label}`)}>
                                        <span className={`text-xl font-black ${s.color}`}>{s.val}</span>
                                        <span className={`text-[8px] font-black uppercase tracking-widest ${s.color} opacity-80`}>{s.label}</span>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Tabs + Controls */}
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
                            <div className="flex gap-1 bg-white border border-slate-200 rounded-xl p-1 shadow-sm">
                                {['website','bulk','manual'].map(c=>(
                                    <button key={c} onClick={()=>{nav('crm',c);setVisible(50);}} className={`px-4 py-1.5 rounded-lg text-[10px] font-black uppercase tracking-widest transition-all ${tab===c?'bg-blue-600 text-white shadow-sm':'text-slate-500 hover:text-slate-800'}`}>{c}</button>
                                ))}
                            </div>
                            <div className="flex gap-2 items-center w-full md:w-auto">
                                <select value={filter} onChange={e=>setFilter(e.target.value)} className="flex-1 md:flex-none px-3 py-2 rounded-xl text-[9px] font-black uppercase border border-slate-200 bg-white text-slate-600 shadow-sm outline-none focus:ring-2 focus:ring-blue-500">
                                    <option value="ALL">All Leads</option>
                                    <optgroup label="Schedule">
                                        <option value="TODAY_CB">Today Callbacks</option>
                                        <option value="TODAY_SV">Today Site Visits</option>
                                        <option value="MISSED_CB">Missed Callbacks</option>
                                        <option value="MISSED_SV">Missed Site Visits</option>
                                    </optgroup>
                                    <optgroup label="Status">
                                        {['Un called','Called','RNR','Details Shared','SV Scheduled','Converted','Rejected'].map(s=><option key={s} value={`STATUS_${s}`}>{s}</option>)}
                                    </optgroup>
                                </select>
                                <button onClick={()=>setManualOpen(true)} className="btn-primary shrink-0 text-[9px] py-2 px-4">+ Lead</button>
                                <button onClick={fetchLeads} className="btn-ghost shrink-0 text-[9px] py-2 px-3">↻</button>
                            </div>
                        </div>

                        {/* Search */}
                        <div className="relative">
                            <span className="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm pointer-events-none">🔍</span>
                            <input type="text" value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search name, phone or project…" className="w-full pl-10 pr-4 py-3 bg-white border border-slate-200 rounded-2xl text-xs font-semibold shadow-sm outline-none focus:ring-2 focus:ring-blue-500 transition-shadow" />
                            {search&&<button onClick={()=>setSearch('')} className="absolute right-3 top-1/2 -translate-y-1/2 text-[9px] font-black text-slate-400 hover:text-red-500 bg-slate-100 px-2 py-1 rounded-lg uppercase">Clear</button>}
                        </div>

                        {/* Lead Table — Desktop */}
                        {loading ? (
                            <div className="text-center py-16 text-slate-400 font-black text-sm uppercase tracking-widest animate-pulse">Loading…</div>
                        ) : !visLeads.length ? (
                            <div className="card p-12 text-center">
                                <div className="text-3xl mb-3">📭</div>
                                <div className="text-slate-400 font-black uppercase tracking-widest text-sm">No leads found</div>
                            </div>
                        ) : (
                            <>
                            {/* Desktop Table */}
                            <div className="hidden lg:block card overflow-hidden">
                                <table className="w-full">
                                    <thead>
                                        <tr className="bg-slate-50 border-b border-slate-100">
                                            {['Client','Project','Agent','Status','Priority','Schedule','Activity','Actions'].map(h=>(
                                                <th key={h} className="py-2.5 px-2 text-[8px] font-black uppercase tracking-widest text-slate-400 text-left first:pl-3 last:pr-3">{h}</th>
                                            ))}
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {visLeads.map(l=>(
                                            <LeadRow key={l.id} l={l} tab={tab} isOwner={isOwner} updateLead={updateLead} />
                                        ))}
                                    </tbody>
                                </table>
                                {visible<displayed.length&&(
                                    <div className="p-3 text-center border-t border-slate-100">
                                        <button onClick={()=>setVisible(v=>v+50)} className="btn-ghost text-[9px]">Load More ({displayed.length-visible} remaining)</button>
                                    </div>
                                )}
                            </div>

                            {/* Mobile Cards */}
                            <div className="lg:hidden space-y-3">
                                {visLeads.map(l=>(
                                    <div key={`m-${l.id}`} className={`card p-4 border-t-4 ${l.lead_priority==='Hot'?'border-t-red-500':l.lead_priority==='Cold'?'border-t-sky-400':'border-t-amber-400'} ${cardTint(l.lead_status)}`}>
                                        <div className="flex justify-between items-start mb-3">
                                            <div>
                                                <div className="font-black text-sm uppercase text-slate-900">{l.customer_name}</div>
                                                <div className="text-blue-600 font-bold text-sm">{l.phone_number}</div>
                                                {l.customer_email&&<div className="text-slate-400 text-[10px] truncate mt-0.5 font-medium">{l.customer_email}</div>}
                                                <div className="text-[9px] text-slate-400 font-bold mt-1 uppercase tracking-widest">{tab==='bulk'&&!isOwner?'[Restricted]':(l.project_interested_in||'General')}</div>
                                            </div>
                                            <div className="flex gap-2">
                                                <a href={`tel:${l.phone_number}`} className="bg-blue-50 text-blue-600 border border-blue-100 w-9 h-9 rounded-full flex items-center justify-center text-sm">📞</a>
                                                <a href={`https://wa.me/91${l.phone_number?.replace(/\D/g,'').slice(-10)}`} className="bg-emerald-50 text-emerald-600 border border-emerald-100 w-9 h-9 rounded-full flex items-center justify-center text-sm">💬</a>
                                            </div>
                                        </div>
                                        <div className="grid grid-cols-2 gap-2 mb-3">
                                            <div className="col-span-2 field-group"><label>Agent</label>
                                                <select value={l.psa_agent_name||''} onChange={e=>updateLead(l,'psa_agent_name',e.target.value)} className="w-full p-2 border border-slate-200 rounded-xl font-black text-[9px] uppercase outline-none bg-white text-blue-800">
                                                    <option value="" disabled>Assign Agent</option>
                                                    {AGENTS.map(a=><option key={a}>{a}</option>)}
                                                </select>
                                            </div>
                                            <div className="field-group"><label>Status</label>
                                                <select value={l.lead_status||''} onChange={e=>updateLead(l,'lead_status',e.target.value)} className={`w-full p-2 border-2 rounded-xl font-black text-[9px] uppercase outline-none ${statusStyle(l.lead_status)}`}>
                                                    {(!l.lead_status||l.lead_status==='Un called')&&<option value="Un called">Un called</option>}
                                                    {['Called','RNR','Details Shared','SV Scheduled','Converted','Rejected'].map(s=><option key={s}>{s}</option>)}
                                                </select>
                                            </div>
                                            <div className="field-group"><label>Priority</label>
                                                <select value={l.lead_priority||'Warm'} onChange={e=>updateLead(l,'lead_priority',e.target.value)} className={`w-full p-2 border-2 rounded-xl font-black text-[9px] uppercase outline-none ${priorityStyle(l.lead_priority)}`}>
                                                    {['Hot','Warm','Cold'].map(p=><option key={p}>{p}</option>)}
                                                </select>
                                            </div>
                                            {l.lead_status==='Rejected'&&(
                                                <div className="col-span-2 field-group"><label>Reject Reason</label>
                                                    <select value={l.reject_reason||''} onChange={e=>updateLead(l,'reject_reason',e.target.value)} className="w-full p-2 border border-red-300 bg-red-50 text-red-800 rounded-xl font-black text-[9px] uppercase outline-none">
                                                        <option value="" disabled>Select Reason</option>
                                                        {['Not Interested','No Response','Wrong Number','No Incoming Call'].map(r=><option key={r}>{r}</option>)}
                                                    </select>
                                                </div>
                                            )}
                                            {['Called','RNR','Details Shared'].includes(l.lead_status)&&(
                                                <div className="col-span-2 field-group"><label>Callback</label>
                                                    <input type="datetime-local" value={l.follow_up_at?.slice(0,16)||''} onChange={e=>updateLead(l,'follow_up_at',e.target.value)} className="w-full p-2 border border-blue-200 bg-blue-50 rounded-xl text-[10px] font-bold outline-none" />
                                                </div>
                                            )}
                                            {l.lead_status==='SV Scheduled'&&(
                                                <div className="col-span-2 field-group"><label>Site Visit</label>
                                                    <input type="date" value={l.site_visit_at||''} onChange={e=>updateLead(l,'site_visit_at',e.target.value)} className="w-full p-2 border border-teal-200 bg-teal-50 rounded-xl text-[10px] font-bold outline-none" />
                                                </div>
                                            )}
                                        </div>
                                        <div className="bg-slate-50 border border-slate-200 rounded-t-xl p-2 h-14 overflow-y-auto history-scroll text-[9px] text-slate-500 whitespace-pre-wrap font-medium mb-1 leading-relaxed">
                                            {l.call_remark||<span className="italic text-slate-300">No activity yet</span>}
                                        </div>
                                        <div className="flex gap-2">
                                            <textarea id={`mn-${l.id}`} defaultValue={l.add_note||''} rows={2} placeholder="Add note…" className="flex-1 p-2 border border-slate-200 rounded-b-xl text-[10px] outline-none focus:ring-1 focus:ring-blue-400 resize-none" />
                                            <button onClick={()=>{ const el=document.getElementById(`mn-${l.id}`); updateLead(l,'add_note',el.value); }} className="bg-slate-800 hover:bg-blue-600 text-white px-3 rounded-xl text-[8px] font-black uppercase tracking-widest transition">Save</button>
                                        </div>
                                    </div>
                                ))}
                                {visible<displayed.length&&(
                                    <button onClick={()=>setVisible(v=>v+50)} className="w-full btn-ghost py-3 text-[9px]">Load More ({displayed.length-visible} remaining)</button>
                                )}
                            </div>
                            </>
                        )}
                    </div>
                )}

                {view==='library' && <Library props={props} onSelect={setSelProp} supabase={supabase} />}
                {view==='add'     && <AddPropertyForm supabase={supabase} scriptUrl={SCRIPT_URL} />}
            </main>

            {/* Manual Lead Modal */}
            {manualOpen&&(
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex items-start justify-center p-4 pt-20 overflow-y-auto">
                    <div className="card p-6 w-full max-w-md animate-slideIn mb-10 shadow-2xl">
                        <div className="flex justify-between items-center mb-5">
                            <h2 className="text-base font-black uppercase italic text-slate-900">Manual Lead Entry</h2>
                            <button onClick={()=>setManualOpen(false)} className="text-slate-400 hover:text-slate-700 text-2xl leading-none">&times;</button>
                        </div>
                        <ManualLeadForm supabase={supabase} properties={props} onSuccess={()=>{setManualOpen(false);fetchLeads();}} />
                    </div>
                </div>
            )}
        </div>
    );
}

// Mark app as mounted (clears the error overlay)
window.__appMounted = true;

const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<AdminApp/>);
</script>
</body>
</html>
