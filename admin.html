(function() {

    let idx = 0;
    const statusEl = document.getElementById('splash-status');
    const msgInterval = setInterval(function() { idx = (idx + 1) % messages.length; if (statusEl) statusEl.textContent = messages[idx]; }, 600);
    window.__dismissSplash = function() {
        clearInterval(msgInterval);
        const splash = document.getElementById('splash-screen');
        if (splash) { if (statusEl) statusEl.textContent = 'Ready ✓'; setTimeout(function() { splash.classList.add('hidden'); setTimeout(function() { if (splash.parentNode) splash.remove(); }, 700); }, 400); }

})();

// ─── IMAGE HELPERS ─────────────────────────────────────────────────────────
const extractDriveId = (url) => {
    if (!url || typeof url !== 'string') return null;
    const u = url.trim();
    if (/^[a-zA-Z0-9_-]{20,}$/.test(u)) return u;
    let m = u.match(/\/d\/([a-zA-Z0-9_-]+)/);
    if (m) return m[1];
    m = u.match(/[?&]id=([a-zA-Z0-9_-]+)/);
    if (m) return m[1];
    m = u.match(/open\?id=([a-zA-Z0-9_-]+)/);
    if (m) return m[1];
    return null;
};
const getDisplayUrl = (rawUrl) => {
    if (!rawUrl || typeof rawUrl !== 'string') return 'https://placehold.co/600x300/f1f5f9/94a3b8?text=No+Image';
    const url = rawUrl.split(',')[0].trim();
    if (!url) return 'https://placehold.co/600x300/f1f5f9/94a3b8?text=No+Image';
    const id = extractDriveId(url);
    if (id) return `https://drive.google.com/thumbnail?id=${id}&sz=w1000`;
    return url;
};
const getDownloadUrl = (rawUrl) => {
    if (!rawUrl || typeof rawUrl !== 'string') return rawUrl;
    const url = rawUrl.trim();
    const id = extractDriveId(url);
    if (id) return `https://drive.google.com/uc?export=download&id=${id}`;
    return url;
};

// ─── UTILITY HELPERS ───────────────────────────────────────────────────────
const getVal = (obj, searchKey) => {
    if (!obj) return "";
    if (obj[searchKey] !== undefined && obj[searchKey] !== "") return obj[searchKey];
    const cleanKey = searchKey.replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
    for (let k in obj) { if (k.replace(/[^a-zA-Z0-9]/g, '').toLowerCase() === cleanKey) return obj[k]; }
    return "";
};
const extractPriceInCr = (s) => {
    if (!s) return 0;
    try {
        const c = String(s).toLowerCase().replace(/,/g, '');
        const m = c.match(/[0-9.]+/); if (!m) return 0;
        const v = parseFloat(m[0]); if (isNaN(v)) return 0;
        if (c.includes('cr') || c.includes('crore')) return v;
        if (c.includes('lac') || c.includes('lakh')) return v / 100;
        if (v > 100000) return v / 10000000;
        return 0;
    } catch(e) { return 0; }
};
const formatIndianCurrencyCompact = (num) => {
    if (num >= 10000000) return '₹' + (num / 10000000).toFixed(2).replace(/\.00$/, '') + ' Cr';
    if (num >= 100000) return '₹' + (num / 100000).toFixed(2).replace(/\.00$/, '') + ' L';
    return new Intl.NumberFormat('en-IN', { style:'currency', currency:'INR', maximumFractionDigits:0 }).format(num);
};
const formatPercent = (val) => {
    const num = parseFloat(val);
    if (isNaN(num)) return String(val || "0%");
    return (num < 1 && num > 0) ? (num * 100).toFixed(1) + "%" : num + "%";
};
const getSafeLink = (rawLink) => {
    if (!rawLink) return "#";
    const link = String(rawLink).trim();
    if (!link) return "#";
    if (link.includes('@') && !link.startsWith('mailto:')) return `mailto:${link}`;
    if (!link.startsWith('http') && !link.includes('@')) return `https://${link}`;
    return link;
};
const formatDateTime = (dt) => {
    if (!dt) return '—';
    try { return new Date(dt).toLocaleString('en-IN', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' }); }
    catch { return dt; }
};
const getStatusStyles = (status) => {
    switch(status) {
        case 'Called':         return 'bg-blue-100 text-blue-800 border-blue-300';

};

        default:               return 'bg-white';
    }
};
const isMobile = () => /Android|webOS|iPhone|iPad|iPod/i.test(navigator.userAgent);

// ─── EMI CALCULATOR ────────────────────────────────────────────────────────
const EMICalculator = ({ propertyPriceStr }) => {
    const propertyValue = extractPriceInCr(propertyPriceStr) > 0 ? extractPriceInCr(propertyPriceStr) * 10000000 : 10000000;
    const [loanAmount,   setLoanAmount]   = useState(propertyValue * 0.8);
    const [interestRate, setInterestRate] = useState(8.5);
    const [tenureYears,  setTenureYears]  = useState(20);

    const { emi, totalInterest, principalPct } = useMemo(() => {
        const p = loanAmount, r = interestRate / 12 / 100, n = tenureYears * 12;
        if (!p || !r || !n) return { emi:0, totalInterest:0, principalPct:100 };
        const emiVal = (p * r * Math.pow(1+r,n)) / (Math.pow(1+r,n) - 1);
        const totalPay = emiVal * n;
        return { emi:Math.round(emiVal), totalInterest:Math.round(totalPay-p), principalPct:((p/totalPay)*100).toFixed(1) };
    }, [loanAmount, interestRate, tenureYears]);

    return (
        <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm mt-6">
            <h3 className="text-sm font-black uppercase tracking-widest text-slate-900 mb-6 flex items-center"><span className="mr-2 text-xl">📊</span> EMI Calculator</h3>

                        <span className="text-[10px] font-black text-slate-900">{formatIndianCurrencyCompact(loanAmount)}</span>
                    </div>
                    <div className="flex justify-between items-center">
                        <div className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-slate-300 inline-block"></span><span className="text-[9px] font-bold text-slate-500 uppercase tracking-widest">Interest</span></div>
                        <span className="text-[10px] font-black text-slate-900">{formatIndianCurrencyCompact(totalInterest)}</span>
                    </div>
                </div>
            </div>
            <div className="space-y-5">
                {[
                    { label:'Loan Amount',   val:formatIndianCurrencyCompact(loanAmount), min:1000000, max:50000000, step:100000, value:loanAmount,   set:setLoanAmount },
                    { label:'Interest Rate', val:interestRate+'%',                        min:6,       max:15,       step:0.1,    value:interestRate,  set:setInterestRate },
                    { label:'Tenure',        val:tenureYears+' Yrs',                      min:5,       max:30,       step:1,      value:tenureYears,   set:setTenureYears },
                ].map(s => (
                    <div key={s.label}>
                        <div className="flex justify-between mb-2">
                            <label className="text-[10px] font-black uppercase text-slate-400 tracking-widest">{s.label}</label>
                            <span className="text-xs font-black text-blue-600 bg-blue-50 px-2 py-0.5 rounded">{s.val}</span>
                        </div>
                        <input type="range" min={s.min} max={s.max} step={s.step} value={s.value} onChange={e => s.set(Number(e.target.value))} />
                    </div>
                ))}
                <div className="pt-4 border-t border-slate-100 flex justify-between items-center">
                    <div>
                        <div className="text-[9px] font-black uppercase text-slate-400 tracking-widest mb-1">Estimated EMI</div>
                        <div className="text-xl font-black text-slate-900 tracking-tighter">{formatIndianCurrencyCompact(emi)} <span className="text-[10px] text-slate-400 font-bold tracking-normal uppercase">/mo</span></div>
                    </div>
                </div>
            </div>

// ─── INLINE EDITABLE FIELD ─────────────────────────────────────────────────
const EditableField = ({ field, label, value, multiline, type='text', onSave, darkMode=false }) => {
    const [editing, setEditing] = useState(false);
    const [draft,   setDraft]   = useState('');
    const [saving,  setSaving]  = useState(false);
    const inputRef = useRef(null);
    const startEdit = () => { setDraft(value || ''); setEditing(true); };
    const cancel    = () => setEditing(false);
    useEffect(() => { if (editing && inputRef.current) inputRef.current.focus(); }, [editing]);
    const save = async () => {
        setSaving(true);
        await onSave(field, draft);
        setSaving(false);
        setEditing(false);
    };
    const handleKey = (e) => {
        if (e.key === 'Escape') cancel();
        if (e.key === 'Enter' && (e.ctrlKey || !multiline)) { e.preventDefault(); save(); }
    };
    const inputCls = `w-full p-2.5 border-2 border-blue-400 rounded-xl text-sm font-semibold outline-none resize-none transition-colors ${darkMode ? 'bg-slate-800 text-white' : 'bg-blue-50 text-slate-900'}`;
    if (editing) {
        return (
            <div className="space-y-2">
                {label && <div className="text-[9px] font-black uppercase tracking-widest text-slate-400">{label}</div>}
                {multiline
                    ? <textarea ref={inputRef} rows={4} value={draft} onChange={e => setDraft(e.target.value)} onKeyDown={handleKey} className={inputCls} />
                    : <input ref={inputRef} type={type} value={draft} onChange={e => setDraft(e.target.value)} onKeyDown={handleKey} className={inputCls} />
                }
                <div className="flex gap-2">
                    <button onClick={save} disabled={saving} className="bg-blue-600 hover:bg-blue-700 text-white text-[9px] font-black px-3 py-1.5 rounded-lg uppercase tracking-widest disabled:opacity-50 transition">{saving ? '...' : 'Save'}</button>
                    <button onClick={cancel} className={`text-[9px] font-black px-3 py-1.5 rounded-lg uppercase tracking-widest transition ${darkMode ? 'bg-slate-700 text-slate-300 hover:bg-slate-600' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>Cancel</button>
                </div>
            </div>
        );
    }
    return (
        <div className="group/ef flex items-start gap-2">
            <div className="flex-1 min-w-0">
                {label && <div className="text-[9px] font-black uppercase tracking-widest text-slate-400 mb-0.5">{label}</div>}
                <div className={`text-sm font-semibold break-words ${value ? (darkMode ? 'text-slate-200' : 'text-slate-800') : 'italic text-slate-400'}`}>{value || '—'}</div>
            </div>
            <button onClick={startEdit} className="opacity-0 group-hover/ef:opacity-100 transition-opacity shrink-0 mt-0.5 text-[8px] font-black bg-blue-50 text-blue-600 border border-blue-200 px-2 py-1 rounded-lg uppercase tracking-widest hover:bg-blue-100">✏️ Edit</button>
        </div>
    );
};

    const openLink = (rawLink) => {

    };
    const regLink    = getVal(property,"lead_registration") || getVal(property,"lead_registration_link") || getVal(property,"lead_registration_link_or_email_id");
    const regIsEmail = regLink && regLink.includes('@') && !regLink.startsWith('http');

    const handleRegisterLead = () => {
        if (!regLink || !regLink.trim()) return alert("No lead registration details provided.");

        if (!linkStr || !linkStr.trim()) return alert(`${type} is not available for this property.`);

    const executeShare = async (type, urlsToShare) => {
        if (!urlsToShare.length) return alert("Please select at least one file.");

        const waText     = `Hello! Here is the *${type}* for *${propName}*. Please find the attached file(s) below. 🏡`;

            const waUrl = `https://wa.me/?text=${encodeURIComponent(waTextLinks)}`;
            if (isMobile()) window.location.href = waUrl;
            else window.open(`https://web.whatsapp.com/send?text=${encodeURIComponent(waTextLinks)}`, '_blank');
            setShareModal(null); setIsSharing(false); return;
        }
        const triggerDownload = (url, filename) => {
            const a = document.createElement('a');
            a.href = url; a.download = filename; a.target = '_blank'; a.rel = 'noopener noreferrer';
            document.body.appendChild(a); a.click(); document.body.removeChild(a);

// ─── PROJECT LIBRARY ────────────────────────────────────────────────────────
function ProjectLibrary({ properties, setProp, supabase, setProperties, onEdit }) {
    const [search,   setSearch]   = useState('');
    const [ordering, setOrdering] = useState(false);
    const [dragIdx,  setDragIdx]  = useState(null);

    const sorted = useMemo(() => {
        return [...properties].sort((a,b) => (a.display_order||9999) - (b.display_order||9999));
    }, [properties]);

    const filtered = sorted.filter(p => {
        if (!search) return true;
        const t = search.toLowerCase();
        return (getVal(p,'property_name')||'').toLowerCase().includes(t) || (getVal(p,'location')||'').toLowerCase().includes(t);
    });

    const saveOrder = async (reordered) => {
        setProperties(reordered);
        for (let i = 0; i < reordered.length; i++) {
            await supabase.from('properties').update({ display_order: i + 1 }).eq('id', reordered[i].id);
        }
    };

    const handleNumberChange = async (p, val) => {
        const num = parseInt(val);
        if (isNaN(num)) return;
        const updated = properties.map(item => item.id === p.id ? { ...item, display_order: num } : item);
        setProperties(updated);
        await supabase.from('properties').update({ display_order: num }).eq('id', p.id);
    };

    const handleDragStart = (i) => setDragIdx(i);
    const handleDragOver  = (e, i) => {
        e.preventDefault();
        if (dragIdx === null || dragIdx === i) return;
        const reordered = [...filtered];
        const [moved]   = reordered.splice(dragIdx, 1);
        reordered.splice(i, 0, moved);
        const withOrder = reordered.map((p, idx) => ({ ...p, display_order: idx + 1 }));
        setDragIdx(i);
        saveOrder(withOrder);
    };
    const handleDragEnd = () => setDragIdx(null);

    const toggleLive = async (e, p) => {
        e.stopPropagation();
        const next = p.is_live === false ? true : false;
        setProperties(prev => prev.map(item => item.id === p.id ? { ...item, is_live:next } : item));
        const { error } = await supabase.from('properties').update({ is_live:next }).eq('id', p.id);
        if (error) { alert('DB Error: ' + error.message); setProperties(prev => prev.map(item => item.id === p.id ? { ...item, is_live:!next } : item)); }
    };

    if (!properties || properties.length === 0) return (
        <div className="text-center py-20 font-black text-slate-400 tracking-widest uppercase animate-pulse">Library Empty...</div>
    );

    return (
        <div className="space-y-4 animate-fadeIn">
            <div className="flex gap-3 items-center flex-wrap">
                <div className="relative flex-1 min-w-[200px]">
                    <span className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">🔍</span>
                    <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search property or location…"
                        className="w-full pl-10 pr-4 py-3 bg-white border border-slate-200 rounded-2xl text-sm font-semibold outline-none focus:ring-2 focus:ring-blue-500 shadow-sm" />
                </div>
                <button onClick={() => setOrdering(v => !v)}
                    className={`px-4 py-3 rounded-2xl text-[10px] font-black uppercase tracking-widest transition border shadow-sm ${ordering ? 'bg-blue-600 text-white border-blue-500' : 'bg-white text-slate-600 border-slate-200 hover:border-blue-400'}`}>
                    {ordering ? '✅ Done Ordering' : '↕️ Reorder'}
                </button>
            </div>
            {ordering && (
                <div className="bg-blue-50 border border-blue-200 rounded-2xl px-4 py-3 text-[10px] text-blue-700 font-bold">
                    💡 Drag cards to reorder, or type a number in the order box. Changes save instantly to Supabase and will reflect on the public site immediately.
                </div>
            )}
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                {filtered.map((p, i) => (
                    <div key={p.id}
                        draggable={ordering}
                        onDragStart={() => handleDragStart(i)}
                        onDragOver={e => handleDragOver(e, i)}
                        onDragEnd={handleDragEnd}
                        onClick={() => !ordering && setProp(p)}
                        className={`bg-white rounded-2xl shadow-sm border overflow-hidden flex flex-col relative transition
                            ${ordering ? 'cursor-grab border-blue-300 shadow-blue-100 shadow-md' : 'cursor-pointer border-slate-200 hover:shadow-lg hover:-translate-y-1'}
                            ${dragIdx === i ? 'opacity-50 scale-95' : ''}`}>
                        {ordering && (
                            <div className="absolute top-3 left-3 z-20 flex items-center gap-1.5 bg-white/90 backdrop-blur-sm border border-slate-200 rounded-xl px-2 py-1 shadow-sm">
                                <span className="text-[8px] font-black text-slate-400 uppercase tracking-widest">#</span>
                                <input type="number" min="1" value={p.display_order||i+1}
                                    onChange={e => handleNumberChange(p, e.target.value)}
                                    onClick={e => e.stopPropagation()}
                                    className="w-10 text-center text-[10px] font-black text-blue-600 outline-none bg-transparent" />
                                <span className="text-slate-300">⠿</span>
                            </div>
                        )}
                        <div className="relative h-48 bg-slate-100 overflow-hidden">
                            <img src={getDisplayUrl(getVal(p,'cover_image')||getVal(p,'cover-image'))} className="w-full h-full object-cover transition duration-500" alt="" />
                            <div className="absolute top-3 left-0 bg-slate-900/90 text-white text-[10px] font-black px-3 py-1.5 rounded-r-lg uppercase tracking-widest shadow-md" style={{marginTop: ordering ? '2rem' : '0'}}>
                                {getVal(p,'property_type')||'Property'}
                            </div>
                            <button onClick={e => toggleLive(e, p)}
                                className={`absolute top-3 right-0 text-[10px] font-black px-3 py-1.5 rounded-l-lg uppercase tracking-widest shadow-md transition z-10 ${p.is_live !== false ? 'bg-green-500 text-white hover:bg-green-600' : 'bg-red-500 text-white hover:bg-red-600'}`}>
                                {p.is_live !== false ? '🟢 Live' : '🔴 Hidden'}
                            </button>
                            <button onClick={e => { e.stopPropagation(); onEdit(p); }}
                                className="absolute top-10 right-0 text-[10px] font-black px-3 py-1.5 rounded-l-lg uppercase tracking-widest shadow-md transition z-10 bg-blue-500 text-white hover:bg-blue-600 mt-1">
                                ✏️ Edit
                            </button>
                        </div>
                        <div className="p-5 flex-grow flex flex-col">
                            <h3 className="text-xl font-black uppercase tracking-tighter text-slate-900 leading-tight truncate">{getVal(p,'property_name')}</h3>
                            <p className="text-slate-500 text-xs font-bold mt-1 truncate">📍 {getVal(p,'location')}</p>
                            <div className="mt-3 pt-3 border-t border-slate-100 flex justify-between items-start">
                                <div>
                                    <div className="text-[9px] text-gray-400 font-bold uppercase tracking-widest">Starting Price</div>
                                    <div className="text-lg font-black text-blue-900">{getVal(p,'price')}</div>
                                </div>
                                {!ordering && <button className="bg-slate-900 text-white text-[10px] font-bold px-4 py-2 rounded-lg hover:bg-blue-600 transition">Preview</button>}
                            </div>
                            {!ordering && (
                                <div className="mt-2 flex flex-wrap gap-1.5">
                                    {getVal(p,'floor_plan') && getVal(p,'floor_plan').split(',').filter(Boolean).map((url, i) => {
                                        const fpId = extractDriveId(url.trim());
                                        const fpUrl = fpId ? `https://drive.google.com/file/d/${fpId}/view` : url.trim();
                                        const fpCount = getVal(p,'floor_plan').split(',').filter(Boolean).length;
                                        return (
                                            <a key={i} href={fpUrl} target="_blank" onClick={e => e.stopPropagation()}
                                                className="text-[8px] font-black uppercase tracking-widest bg-blue-50 text-blue-700 border border-blue-200 px-2 py-1 rounded-lg hover:bg-blue-100 transition">
                                                📐 Floor {fpCount > 1 ? i+1 : 'Plan'}
                                            </a>
                                        );
                                    })}
                                    {getVal(p,'master_plan') && (() => {
                                        const mpId = extractDriveId(getVal(p,'master_plan'));
                                        const mpUrl = mpId ? `https://drive.google.com/file/d/${mpId}/view` : getVal(p,'master_plan');
                                        return (
                                            <a href={mpUrl} target="_blank" onClick={e => e.stopPropagation()}
                                                className="text-[8px] font-black uppercase tracking-widest bg-purple-50 text-purple-700 border border-purple-200 px-2 py-1 rounded-lg hover:bg-purple-100 transition">
                                                🗺️ Master Plan
                                            </a>
                                        );
                                    })()}
                                    {getVal(p,'map_link') && (
                                        <a href={getVal(p,'map_link')} target="_blank" onClick={e => e.stopPropagation()}
                                            className="text-[8px] font-black uppercase tracking-widest bg-green-50 text-green-700 border border-green-200 px-2 py-1 rounded-lg hover:bg-green-100 transition">
                                            📍 Location
                                        </a>
                                    )}
                                </div>
                            )}
                        </div>
                    </div>
                ))}
            </div>
        </div>
    );
}

// ─── PROPERTY FORM ─────────────────────────────────────────────────────────
function PropertyForm({ supabase, scriptUrl, editingProp, setView }) {
    const blank = {
        property_name:'', builder_name:'', property_region:'', property_type:'', location:'', price:'', bhk:'',
        super_built_up_area:'', possession_date:'', construction_status:'', approval:'', rera_number:'',
        total_units:'', availability:'', description:'', usp_details:'', amenities:'',
        point_of_contact:'', commission_details:'', video_link:'', website_link:'',
        lead_registration_link:'', map_link:'', cover_image:'', gallery_images:'',
        floor_plan:'', brochure:'', cost_sheet:'', miscellaneous:'', info_for_psa:''
    };
    const [form,          setForm]          = useState(blank);
    const [loading,       setLoading]       = useState(false);
    const [uploadingField,setUploadingField] = useState(null);
    const [uploadProgress,setUploadProgress] = useState({});
    useEffect(() => { setForm(editingProp ? { ...blank, ...editingProp } : blank); }, [editingProp]);
    const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

    const upload = async (e, field, append = false) => {
        const files = e.target.files;
        if (!files || files.length === 0) return;
        setLoading(true); setUploadingField(field);
        const categoryMap = { cover_image:'Cover Image', gallery_images:'Gallery', brochure:'Brochures', cost_sheet:'Cost Sheets', floor_plan:'Floor Plans', miscellaneous:'Miscellaneous' };
        const category = categoryMap[field] || 'General';
        let newUrls = [];
        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            setUploadProgress(p => ({ ...p, [field]: `${i + 1}/${files.length}` }));
            try {
                const base64 = await new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result.split(',')[1]);
                    reader.onerror = () => reject(new Error('FileReader failed'));
                    reader.readAsDataURL(file);
                });
                const res = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST', redirect: 'follow',
                    body: JSON.stringify({ action:'uploadFile', base64, type:file.type, name:file.name, propertyName:(form.property_name||'').trim() || 'Unnamed Property', category })
                });
                const data = await res.json();
                const driveUrl = data.fileUrl || data.url || (data.fileId ? `https://drive.google.com/file/d/${data.fileId}/view` : null);
                if (driveUrl) newUrls.push(driveUrl);
                else alert('Upload failed: ' + (data.error || 'No URL returned'));
            } catch (err) { alert('Upload failed for "' + file.name + '": ' + err.message); }
        }
        if (newUrls.length > 0) {
            const joined = newUrls.join(',');
            if (append) set(field, form[field] ? form[field] + ',' + joined : joined);
            else set(field, joined);
        }

// ─── SUPABASE HELPERS ──────────────────────────────────────────────────────
async function fetchAgentMessages(agentName) {
    try {
        const { data, error } = await supabase.from('agent_messages').select('*').eq('agent_name', agentName).order('created_at', { ascending: true });
        if (error) { console.error('fetchAgentMessages:', error.message); return []; }
        return data || [];
    } catch(e) { return []; }
}
async function markAdminMessagesRead(agentName) {
    await supabase.from('agent_messages').update({ is_read: true }).eq('agent_name', agentName).eq('sender', 'admin');
}
async function markAgentMessagesRead(agentName) {
    await supabase.from('agent_messages').update({ is_read: true }).eq('agent_name', agentName).eq('sender', 'agent');
}
async function fetchAdminNote(agentName) {
    try {
        const { data, error } = await supabase.from('admin_notes').select('note').eq('agent_name', agentName).maybeSingle();
        if (error) { console.error('fetchAdminNote error:', error.message); return ''; }
        return data?.note || '';
    } catch(e) { return ''; }
}
async function saveAdminNote(agentName, note) {
    const { error: delError } = await supabase.from('admin_notes').delete().eq('agent_name', agentName);
    if (delError) { alert('Delete step failed: ' + delError.message); return false; }
    const { error: insError } = await supabase.from('admin_notes').insert({ agent_name: agentName, note: note });
    if (insError) { alert('Insert step failed: ' + insError.message); return false; }
    return true;
}

// ─── FIX 3: CHAT BOX — fixed overlay, not page-bottom anchored ────────────
// FIX 2: Clear chat for admin, blinking badge for agents, mark-read on open
function ChatBox({ agentName, senderRole, onClose }) {
    const [messages,   setMessages]   = useState([]);
    const [msgLoading, setMsgLoading] = useState(true);
    const [reply,      setReply]      = useState('');
    const [sending,    setSending]    = useState(false);
    const [clearing,   setClearing]   = useState(false);
    const msgBottomRef = useRef(null);

    const loadMessages = useCallback(async () => {
        const msgs = await fetchAgentMessages(agentName);
        setMessages(msgs);
        setMsgLoading(false);
        // Mark read immediately when chatbox opens
        if (senderRole === 'admin') markAgentMessagesRead(agentName);
        else if (senderRole === 'agent') markAdminMessagesRead(agentName);
    }, [agentName, senderRole]);

    useEffect(() => {
        loadMessages();
        const poll = setInterval(() => {
            fetchAgentMessages(agentName).then(msgs => {
                setMessages(prev => {
                    if (senderRole === 'agent') {
                        const prevUnread = prev.filter(m => m.sender === 'admin' && !m.is_read).length;
                        const newUnread  = msgs.filter(m => m.sender === 'admin' && !m.is_read).length;
                        if (newUnread > prevUnread && window.__showNotification) {
                            const latest = msgs.filter(m => m.sender === 'admin' && !m.is_read).slice(-1)[0];
                            window.__showNotification('💬 New message from Admin', latest?.message || '');
                        }
                    }
                    return msgs;
                });
                if (senderRole === 'admin') markAgentMessagesRead(agentName);
                else if (senderRole === 'agent') markAdminMessagesRead(agentName);
            });
        }, 15000);
        return () => clearInterval(poll);
    }, [agentName, senderRole, loadMessages]);

    useEffect(() => {
        if (msgBottomRef.current) msgBottomRef.current.scrollIntoView({ behavior:'smooth' });
    }, [messages]);

    const sendMessage = async () => {
        if (!reply.trim()) return;
        setSending(true);
        await supabase.from('agent_messages').insert({ agent_name:agentName, message:reply.trim(), sender:senderRole, is_read:false });
        setReply('');
        const updated = await fetchAgentMessages(agentName);
        setMessages(updated);
        setSending(false);
    };

    // FIX 2: Clear chat (admin only)
    const clearChat = async () => {
        if (!window.confirm(`Clear all messages with ${agentName}? This cannot be undone.`)) return;
        setClearing(true);
        await supabase.from('agent_messages').delete().eq('agent_name', agentName);
        setMessages([]);
        setClearing(false);
    };

    // FIX 3: Render as fixed centered overlay, not page-anchored
    return (
        <div className="fixed inset-0 z-[400] flex items-end md:items-center justify-center p-0 md:p-4 bg-slate-900/60 backdrop-blur-sm animate-fadeIn" onClick={e => e.target === e.currentTarget && onClose()}>
            <div className="bg-white border border-slate-200 rounded-t-[28px] md:rounded-[24px] w-full max-w-md shadow-2xl animate-slideUp overflow-hidden flex flex-col" style={{maxHeight:'75vh'}}>
                <div className="bg-slate-900 px-4 py-3 flex items-center justify-between shrink-0">
                    <span className="text-[10px] font-black uppercase tracking-widest text-white">
                        💬 {senderRole === 'admin' ? `Messages with ${agentName}` : 'Messages to Admin'}
                    </span>
                    <div className="flex items-center gap-2">
                        {senderRole === 'admin' && (
                            <button onClick={clearChat} disabled={clearing || messages.length === 0}
                                className="text-[8px] font-black uppercase tracking-widest text-red-400 hover:text-red-300 bg-red-900/30 border border-red-800/50 px-2 py-1 rounded-lg transition disabled:opacity-40">
                                {clearing ? '⏳' : '🗑 Clear'}
                            </button>
                        )}
                        <button onClick={onClose} className="text-slate-400 hover:text-white font-black text-sm w-7 h-7 flex items-center justify-center rounded-full hover:bg-slate-700 transition">✕</button>
                    </div>
                </div>
                <div className="overflow-y-auto history-scroll p-3 space-y-2 flex-1 min-h-0">
                    {msgLoading ? (
                        <div className="text-[9px] text-slate-400 text-center py-8 animate-pulse">Loading messages...</div>
                    ) : messages.length === 0 ? (
                        <div className="text-[9px] text-slate-400 text-center py-8 italic">No messages yet. Say hello! 👋</div>
                    ) : messages.map((m, i) => (
                        <div key={i} className={`flex ${m.sender === senderRole ? 'justify-end' : 'justify-start'}`}>
                            <div className={`max-w-[80%] px-3 py-2 rounded-2xl text-[10px] font-semibold leading-relaxed ${m.sender === senderRole ? 'bg-blue-600 text-white rounded-br-sm' : 'bg-slate-100 text-slate-800 rounded-bl-sm border border-slate-200'}`}>
                                {senderRole === 'admin' && (
                                    <div className={`text-[7px] font-black uppercase tracking-widest mb-0.5 ${m.sender === 'admin' ? 'text-blue-200' : 'text-slate-500'}`}>
                                        {m.sender === 'admin' ? 'You (Admin)' : agentName}
                                    </div>
                                )}
                                {m.message}
                                <div className={`text-[7px] mt-1 font-bold uppercase ${m.sender === senderRole ? 'text-blue-200' : 'text-slate-400'}`}>{formatDateTime(m.created_at)}</div>
                            </div>
                        </div>
                    ))}
                    <div ref={msgBottomRef} />
                </div>
                <div className="border-t border-slate-100 p-3 flex gap-2 shrink-0">
                    <input value={reply} onChange={e => setReply(e.target.value)}
                        onKeyDown={e => e.key === 'Enter' && !e.shiftKey && sendMessage()}
                        placeholder={senderRole === 'admin' ? `Reply to ${agentName}...` : 'Message admin...'}
                        className="flex-1 px-3 py-2 bg-slate-50 border-2 border-slate-200 rounded-xl text-[10px] font-semibold outline-none focus:ring-2 focus:ring-blue-400 transition" />
                    <button onClick={sendMessage} disabled={sending || !reply.trim()}
                        className="bg-blue-600 hover:bg-blue-700 disabled:opacity-50 text-white text-[9px] font-black px-3 py-2 rounded-xl uppercase tracking-widest transition">
                        {sending ? '...' : '↑ Send'}
                    </button>
                </div>
            </div>
        </div>
    );
}

function AdminNotesBanner({ agentName }) {
    const [note,     setNote]     = useState('');

    const [loading,  setLoading]  = useState(true);
    const [chatOpen, setChatOpen] = useState(false);
    const [unread,   setUnread]   = useState(0);

    useEffect(() => {
        fetchAdminNote(agentName).then(n => { setNote(n); setLoading(false); });
        const poll = setInterval(() => fetchAdminNote(agentName).then(n => setNote(n)), 60000);
        return () => clearInterval(poll);
    }, [agentName]);

    // Poll unread count from admin
    useEffect(() => {
        if (chatOpen) return; // don't poll badge when chat is open
        const checkUnread = () => fetchAgentMessages(agentName).then(msgs => {
            const u = msgs.filter(m => m.sender === 'admin' && !m.is_read).length;
            setUnread(u);

        checkUnread();
        const poll = setInterval(checkUnread, 15000);
        return () => clearInterval(poll);

    return (
        <div className="space-y-2">

                <div className="bg-amber-50 border-2 border-amber-300 rounded-2xl p-4 relative animate-fadeIn">

// ─── ADMIN NOTE EDITOR (shown in admin drill-down) ─────────────────────────
function AdminNoteEditor({ agentName }) {
    const [note,     setNote]     = useState('');
    const [editing,  setEditing]  = useState(false);
    const [draft,    setDraft]    = useState('');
    const [saving,   setSaving]   = useState(false);
    const [deleting, setDeleting] = useState(false);
    const [status,   setStatus]   = useState('');
    const [loading,  setLoading]  = useState(true);
    const [chatOpen, setChatOpen] = useState(false);
    const [unread,   setUnread]   = useState(0);

    useEffect(() => {
        setLoading(true);
        fetchAdminNote(agentName).then(n => { setNote(n); setLoading(false); });
    }, [agentName]);

    // Poll unread from agents
    useEffect(() => {
        if (chatOpen) return;
        const checkUnread = () => fetchAgentMessages(agentName).then(msgs => {
            setUnread(msgs.filter(m => m.sender === 'agent' && !m.is_read).length);
        });
        checkUnread();
        const poll = setInterval(checkUnread, 15000);
        return () => clearInterval(poll);
    }, [agentName, chatOpen]);

    const save = async () => {
        setSaving(true);
        const ok = await saveAdminNote(agentName, draft);
        setSaving(false);
        if (ok) { setNote(draft); setEditing(false); setStatus('saved'); setTimeout(() => setStatus(''), 4000); }
        else { setStatus('error'); setTimeout(() => setStatus(''), 4000); }
    };

    const deleteNote = async () => {
        if (!window.confirm('Delete this note for ' + agentName + '?')) return;
        setDeleting(true);
        await supabase.from('admin_notes').delete().eq('agent_name', agentName);
        setNote(''); setDeleting(false); setStatus('deleted'); setTimeout(() => setStatus(''), 3000);
    };

    const handleOpenChat = () => {
        setChatOpen(true);
        setUnread(0);
    };

    return (
        <div className="space-y-4">
            {status === 'saved'   && <div className="bg-green-50 border border-green-200 text-green-700 text-[9px] font-black px-3 py-2 rounded-xl uppercase tracking-widest">✅ Note saved</div>}
            {status === 'deleted' && <div className="bg-slate-50 border border-slate-200 text-slate-500 text-[9px] font-black px-3 py-2 rounded-xl uppercase tracking-widest">🗑 Note deleted</div>}
            {status === 'error'   && <div className="bg-red-50 border border-red-200 text-red-600 text-[9px] font-black px-3 py-2 rounded-xl uppercase tracking-widest">❌ Save failed</div>}

            {loading ? (
                <div className="bg-amber-50 border border-amber-200 rounded-2xl p-3 text-[9px] text-amber-600 font-bold animate-pulse">⏳ Loading note...</div>
            ) : editing ? (
                <div className="bg-amber-50 border-2 border-amber-400 rounded-2xl p-4 space-y-3">
                    <div className="text-[9px] font-black uppercase tracking-widest text-amber-700">📋 Note for {agentName}</div>
                    <textarea rows={4} value={draft} onChange={e => setDraft(e.target.value)}
                        placeholder="e.g. Focus on calling Prestige leads this week..."
                        className="w-full p-3 border-2 border-amber-300 rounded-xl text-sm font-semibold outline-none resize-none bg-white focus:ring-2 focus:ring-amber-400 transition" autoFocus />
                    <div className="flex gap-2 flex-wrap">
                        <button onClick={save} disabled={saving} className="bg-amber-500 hover:bg-amber-600 disabled:opacity-50 text-white text-[9px] font-black px-4 py-2.5 rounded-xl uppercase tracking-widest transition">{saving ? '⏳ Saving...' : '✅ Save Note'}</button>
                        <button onClick={() => { setEditing(false); setDraft(''); }} className="bg-white border border-slate-200 text-slate-600 text-[9px] font-black px-4 py-2.5 rounded-xl uppercase tracking-widest hover:bg-slate-50 transition">Cancel</button>
                        {note && <button onClick={deleteNote} disabled={deleting} className="ml-auto bg-red-50 border border-red-200 text-red-500 text-[9px] font-black px-4 py-2.5 rounded-xl uppercase tracking-widest hover:bg-red-100 transition disabled:opacity-50">{deleting ? '⏳' : '🗑 Delete'}</button>}
                    </div>
                </div>
            ) : (
                <div className="bg-amber-50 border border-amber-200 rounded-2xl p-4">
                    <div className="flex items-start justify-between gap-3">
                        <div className="flex items-start gap-3 flex-1 min-w-0">
                            <span className="text-2xl shrink-0">📋</span>
                            <div className="flex-1 min-w-0">
                                <div className="text-[9px] font-black uppercase tracking-widest text-amber-700 mb-1">Admin Note for {agentName}</div>
                                {note ? <p className="text-sm font-semibold text-amber-900 whitespace-pre-wrap leading-relaxed">{note}</p>
                                      : <p className="text-[10px] italic text-amber-500">No note yet. Click Edit to write one.</p>}
                            </div>
                        </div>
                        <div className="flex flex-col gap-1.5 shrink-0">
                            <button onClick={() => { setDraft(note); setEditing(true); }} className="text-[8px] font-black text-amber-600 bg-white border border-amber-300 px-3 py-1.5 rounded-lg uppercase tracking-widest hover:bg-amber-100 transition">✏️ {note ? 'Edit' : 'Write'}</button>
                            {note && <button onClick={deleteNote} disabled={deleting} className="text-[8px] font-black text-red-500 bg-white border border-red-200 px-3 py-1.5 rounded-lg uppercase tracking-widest hover:bg-red-50 transition disabled:opacity-50">{deleting ? '⏳' : '🗑 Delete'}</button>}
                        </div>
                    </div>
                </div>
            )}

            <div className="flex justify-end">
                <button onClick={handleOpenChat}
                    className="relative flex items-center gap-1.5 bg-slate-900 hover:bg-blue-600 text-white text-[9px] font-black uppercase tracking-widest px-3 py-2 rounded-xl transition shadow-md">
                    <span>💬</span>
                    <span className="hidden sm:inline">Messages with {agentName}</span>
                    <span className="sm:hidden">Messages</span>
                    {unread > 0 && (
                        <span className="absolute -top-2 -right-2 min-w-[18px] h-[18px] bg-red-500 text-white text-[8px] font-black rounded-full flex items-center justify-center px-1 badge-blink shadow-lg">{unread}</span>
                    )}
                </button>
            </div>
            {chatOpen && <ChatBox agentName={agentName} senderRole="admin" onClose={() => setChatOpen(false)} />}
        </div>
    );
}

// ─── ADMIN OVERVIEW ────────────────────────────────────────────────────────
function AdminOverview({ allLeads, allBulkLeads, allManualLeads, supabase }) {
    const [drillAgent, setDrillAgent] = useState(null);

    const allCombined = useMemo(() => [
        ...allLeads.map(l => ({ ...l, _type:'Website' })),
        ...allBulkLeads.map(l => ({ ...l, _type:'Bulk' })),
        ...allManualLeads.map(l => ({ ...l, _type:'Manual' })),
    ], [allLeads, allBulkLeads, allManualLeads]);

    const agentStats = useMemo(() => {
        return PSA_AGENTS.map(agent => {
            const mine = allCombined.filter(l => l.psa_agent_name === agent.value && !l.is_hidden);
            const today = new Date().toISOString().split('T')[0];
            return {
                name:      agent.value,
                total:     mine.length,
                website:   mine.filter(l => l._type === 'Website').length,
                bulk:      mine.filter(l => l._type === 'Bulk').length,
                manual:    mine.filter(l => l._type === 'Manual').length,
                new:       mine.filter(l => !l.lead_status || l.lead_status === 'Un called').length,
                open:      mine.filter(l => ['Called','RNR','Details Shared'].includes(l.lead_status)).length,
                svSched:   mine.filter(l => l.lead_status === 'SV Scheduled').length,
                svDone:    mine.filter(l => l.site_visit_at && l.site_visit_at < today && !['Converted','Rejected'].includes(l.lead_status)).length,
                converted: mine.filter(l => l.lead_status === 'Converted').length,
                rejected:  mine.filter(l => l.lead_status === 'Rejected').length,
                leads:     mine,
            };
        });
    }, [allCombined]);

    const recentActivity = useMemo(() => {
        return [...allCombined].filter(l => l.call_remark && l.call_remark.trim())
            .sort((a,b) => new Date(b.created_at) - new Date(a.created_at)).slice(0, 15);
    }, [allCombined]);

    const totalAll   = allCombined.filter(l => !l.is_hidden).length;
    const unassigned = allLeads.filter(l => !l.psa_agent_name && !l.is_hidden).length;

    if (drillAgent) {
        const agent = agentStats.find(a => a.name === drillAgent);
        const leads = agent?.leads || [];
        return (
            <div className="space-y-5 animate-fadeIn">
                <button onClick={() => setDrillAgent(null)} className="flex items-center gap-2 text-[10px] font-black uppercase tracking-widest text-slate-500 hover:text-blue-600 transition">← Back to Overview</button>
                <div className="bg-slate-900 rounded-3xl p-6 text-white flex items-center justify-between flex-wrap gap-4">
                    <div>
                        <div className="text-3xl font-black text-blue-400">{drillAgent}</div>
                        <div className="text-[9px] font-black uppercase tracking-widest text-slate-400 mt-1">{leads.length} active leads</div>
                    </div>
                    <div className="grid grid-cols-3 gap-3 text-center">
                        {[{l:'New',v:agent?.new},{l:'Open',v:agent?.open},{l:'SV Sched',v:agent?.svSched},{l:'SV Done',v:agent?.svDone},{l:'Converted',v:agent?.converted},{l:'Rejected',v:agent?.rejected}].map((s,i) => (
                            <div key={i} className="bg-slate-800 rounded-xl p-2 border border-slate-700">
                                <div className="text-lg font-black">{s.v}</div>
                                <div className="text-[7px] font-black uppercase tracking-widest text-slate-400">{s.l}</div>
                            </div>
                        ))}
                    </div>
                </div>
                <AdminNoteEditor agentName={drillAgent} />
                <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                    {leads.length === 0 ? (
                        <div className="p-8 text-center text-slate-400 font-bold text-sm">No leads assigned</div>
                    ) : (
                        <table className="w-full text-xs">
                            <thead className="bg-slate-900 text-slate-400 text-[9px] font-black uppercase tracking-widest">
                                <tr><th className="px-4 py-3 text-left">Customer</th><th className="px-4 py-3 text-left">Phone</th><th className="px-4 py-3 text-left">Status</th><th className="px-4 py-3 text-left">Source</th><th className="px-4 py-3 text-left">Registered</th></tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                                {leads.map((l,i) => (
                                    <tr key={i} className="hover:bg-slate-50 transition">
                                        <td className="px-4 py-3 font-black text-slate-900 text-[10px]">{l.customer_name}</td>
                                        <td className="px-4 py-3 text-blue-600 font-black text-[10px]">{l.phone_number}</td>
                                        <td className="px-4 py-3"><span className={`text-[8px] font-black uppercase px-2 py-0.5 rounded-full border ${getStatusStyles(l.lead_status)}`}>{l.lead_status||'Un called'}</span></td>
                                        <td className="px-4 py-3 text-[9px] text-slate-500 font-bold">{l._type}</td>
                                        <td className="px-4 py-3 text-[9px] text-slate-400 font-bold">{formatDateTime(l.created_at)}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    )}
                </div>
            </div>
        );
    }

        <div className="space-y-8 animate-fadeIn">

                        <h2 className="text-2xl font-black uppercase italic tracking-tight">🛡️ Admin Overview</h2>

                    <div className="flex gap-4">

                    </div>
                </div>
                <div className="grid grid-cols-3 gap-3">

            <div>
                <h3 className="text-xs font-black uppercase tracking-widest text-slate-500 mb-4">👥 PSA Agent Performance — Click to View Leads</h3>
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    {agentStats.map(agent => (
                        <div key={agent.name} className="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 hover:shadow-lg hover:-translate-y-1 transition cursor-pointer group" onClick={() => setDrillAgent(agent.name)}>

    const [step,      setStep]      = useState('pick');

    const parseCSV = (text) => {
        const lines = text.trim().split(/\r?\n/);
        if (lines.length < 2) return [];
        const headers = lines[0].split(',').map(h => h.replace(/"/g,'').trim().toLowerCase().replace(/\s+/g,'_'));
        return lines.slice(1).map(line => {
            const vals = []; let cur = '', inQ = false;
            for (let ch of line) {
                if (ch === '"') { inQ = !inQ; } else if (ch === ',' && !inQ) { vals.push(cur.trim()); cur = ''; } else cur += ch;
            }
            vals.push(cur.trim());
            const obj = {};
            headers.forEach((h, i) => { obj[h] = (vals[i] || '').replace(/"/g, '').trim(); });
            return obj;
        }).filter(r => r.customer_name || r.name || r.phone_number || r.phone);
    };

    const handleFile = (e) => {
        const f = e.target.files[0]; if (!f) return;
        setError(''); setFile(f);
        const reader = new FileReader();
        reader.onload = (ev) => {
            const parsed = parseCSV(ev.target.result);
            if (!parsed.length) { setError('No valid rows found. Check your CSV format.'); return; }
            setRows(parsed); setStep('preview');
        };
        reader.readAsText(f); e.target.value = '';
    };

    const handleUpload = async () => {
        if (!assignTo) { setError('Please select an agent to assign this batch to.'); return; }
        if (!rows.length) return;
        setUploading(true); setError('');
        const now = new Date().toISOString();
        const inserts = rows.map(r => ({
            customer_name: r.customer_name || r.name || '',
            phone_number:  r.phone_number  || r.phone || '',
            customer_email: r.customer_email || r.email || null,
            project_interested_in: r.project_interested_in || r.project || 'General Enquiry',
            add_note: r.add_note || r.notes || r.note || null,
            psa_agent_name: assignTo, assigned_agent: assignTo,
            lead_status: 'Un called', lead_source: 'Bulk Upload', lead_priority: 'Warm', created_at: now,
        }));
        let totalInserted = 0;
        for (let i = 0; i < inserts.length; i += 100) {
            const batch = inserts.slice(i, i + 100);
            const { error: err } = await supabase.from('bulk_leads').insert(batch);
            if (err) { setError('Upload error: ' + err.message); setUploading(false); return; }
            totalInserted += batch.length;
        }
        setUploading(false); setStep('done');
        setTimeout(() => { onSuccess(totalInserted); setStep('pick'); setRows([]); setFile(null); setAssignTo(''); }, 1800);
    };

    const reset = () => { setStep('pick'); setRows([]); setFile(null); setAssignTo(''); setError(''); };
    const getName  = r => r.customer_name || r.name || '—';
    const getPhone = r => r.phone_number  || r.phone || '—';
    const getEmail = r => r.customer_email || r.email || '—';
    const getProj  = r => r.project_interested_in || r.project || 'General Enquiry';

    return (
        <div className="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden">
            <div className="bg-slate-900 px-6 py-4 flex items-center justify-between">
                <div>
                    <h3 className="text-sm font-black uppercase italic text-white tracking-tight">📤 Bulk CSV Upload</h3>
                    <p className="text-[9px] font-bold uppercase tracking-widest text-slate-400 mt-0.5">Required: <span className="text-blue-400">customer_name, phone_number</span></p>
                </div>
                {step !== 'pick' && <button onClick={reset} className="text-[9px] font-black text-slate-400 hover:text-white bg-slate-800 px-3 py-1.5 rounded-xl uppercase tracking-widest transition">✕ Reset</button>}
            </div>
            <div className="p-6">
                {step === 'pick' && (
                    <div className="space-y-4">
                        <div className="border-2 border-dashed border-slate-300 rounded-2xl p-8 flex flex-col items-center justify-center hover:border-blue-400 transition-all cursor-pointer text-center"
                            onClick={() => document.getElementById('bulk-csv-input').click()}>
                            <div className="text-4xl mb-3">📂</div>
                            <p className="text-sm font-black text-slate-700 uppercase tracking-wider">Click to select CSV file</p>
                            <p className="text-[10px] text-slate-400 font-bold mt-1">or drag and drop</p>
                            <input id="bulk-csv-input" type="file" accept=".csv,text/csv" className="hidden" onChange={handleFile} />
                        </div>
                        {error && <div className="bg-red-50 border border-red-200 text-red-700 text-[10px] font-bold p-3 rounded-2xl">{error}</div>}
                        <div className="bg-blue-50 border border-blue-100 rounded-2xl p-4">
                            <p className="text-[9px] font-black uppercase tracking-widest text-blue-600 mb-2">📋 CSV Template</p>
                            <code className="text-[10px] text-blue-800 font-bold">customer_name, phone_number, customer_email, project_interested_in, add_note</code>
                        </div>
                    </div>
                )}
                {step === 'preview' && (
                    <div className="space-y-4">
                        <div className="flex items-center justify-between flex-wrap gap-3">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-green-500 rounded-full flex items-center justify-center text-white font-black text-lg">✓</div>
                                <div><p className="text-sm font-black text-slate-900">{rows.length} leads ready to import</p><p className="text-[10px] text-slate-400 font-bold">{file?.name}</p></div>
                            </div>
                            <div className="flex items-center gap-2">
                                <label className="text-[9px] font-black uppercase tracking-widest text-slate-500">Assign to Agent:</label>
                                <select value={assignTo} onChange={e => setAssignTo(e.target.value)} className="p-2.5 border-2 border-slate-700 bg-slate-900 rounded-xl font-black uppercase text-[9px] outline-none text-blue-300 cursor-pointer min-w-[140px]">
                                    <option value="" disabled>⚡ Select Agent</option>
                                    {PSA_AGENTS.map(a => <option key={a.value} value={a.value}>{a.label}</option>)}
                                </select>
                            </div>
                        </div>
                        {error && <div className="bg-red-50 border border-red-200 text-red-700 text-[10px] font-bold p-3 rounded-2xl">{error}</div>}
                        <div className="rounded-2xl border border-slate-200 overflow-hidden">
                            <div className="bg-slate-900 grid grid-cols-4 gap-0">
                                {['Name','Phone','Email','Project'].map(h => <div key={h} className="px-3 py-2 text-[8px] font-black uppercase tracking-widest text-slate-400">{h}</div>)}
                            </div>
                            <div className="divide-y divide-slate-100 max-h-56 overflow-y-auto history-scroll">
                                {rows.slice(0, 10).map((r, i) => (
                                    <div key={i} className="grid grid-cols-4 gap-0 hover:bg-slate-50">
                                        <div className="px-3 py-2 text-[10px] font-bold text-slate-800 truncate">{getName(r)}</div>
                                        <div className="px-3 py-2 text-[10px] font-bold text-blue-600 truncate">{getPhone(r)}</div>
                                        <div className="px-3 py-2 text-[10px] font-medium text-slate-500 truncate">{getEmail(r)}</div>
                                        <div className="px-3 py-2 text-[10px] font-medium text-slate-500 truncate">{getProj(r)}</div>
                                    </div>
                                ))}
                            </div>
                            {rows.length > 10 && <div className="bg-slate-50 px-3 py-2 text-[9px] font-black text-slate-400 uppercase tracking-widest border-t border-slate-200">+ {rows.length - 10} more rows not shown</div>}
                        </div>
                        <div className="flex gap-3">
                            <button onClick={reset} className="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-black py-3.5 rounded-2xl text-[10px] uppercase tracking-widest transition">Cancel</button>
                            <button onClick={handleUpload} disabled={uploading || !assignTo} className="flex-1 bg-blue-600 hover:bg-blue-700 disabled:opacity-50 text-white font-black py-3.5 rounded-2xl text-[10px] uppercase tracking-widest transition shadow-lg flex items-center justify-center gap-2">
                                {uploading ? <><span className="animate-spin inline-block">⏳</span> Uploading...</> : `🚀 Upload ${rows.length} Leads`}
                            </button>
                        </div>
                    </div>
                )}
                {step === 'done' && (
                    <div className="flex flex-col items-center py-8 gap-3">
                        <div className="text-5xl">🎉</div>
                        <p className="text-lg font-black uppercase text-slate-900 tracking-tight">Upload Complete!</p>
                        <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">{rows.length} leads added to {assignTo}'s bulk queue</p>
                    </div>
                )}
            </div>
        </div>
    );
}

// ─── FIX 1: BUCKET LOGIC ──────────────────────────────────────────────────
// RNR only moves to 'open' once follow_up_at is set.
// Rejected only moves to 'rejected' bucket once reject_reason is set.
function filterLeadsByBucket(leads, bucket) {
    const today = new Date().toISOString().split('T')[0];
    switch(bucket) {
        case 'new':
            return leads.filter(l => {
                if (!l.lead_status || l.lead_status === 'Un called') return true;
                // RNR without a callback date stays in 'new'
                if (l.lead_status === 'RNR' && !l.follow_up_at) return true;
                // Rejected without a reason stays in 'new'
                if (l.lead_status === 'Rejected' && !l.reject_reason) return true;
                return false;
            });
        case 'open':
            return leads.filter(l => {
                if (l.lead_status === 'Called') return true;
                if (l.lead_status === 'Details Shared') return true;
                // RNR only moves to open once follow_up_at is set
                if (l.lead_status === 'RNR' && l.follow_up_at) return true;
                return false;
            });
        case 'sv_scheduled': return leads.filter(l => l.lead_status === 'SV Scheduled');
        case 'sv_done':      return leads.filter(l => l.site_visit_at && l.site_visit_at < today && !['Converted','Rejected'].includes(l.lead_status));
        case 'converted':    return leads.filter(l => l.lead_status === 'Converted');
        case 'rejected':
            // Only show in rejected bucket if reason is set
            return leads.filter(l => l.lead_status === 'Rejected' && l.reject_reason);
        default:             return leads;
    }
}
