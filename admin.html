async function registerPushNotifications() {
    try {
        if (!('Notification' in window) || !('serviceWorker' in navigator)) return;
        if (Notification.permission !== 'default') return;          // already allowed or blocked: don't ask again on every login
        const permission = await Notification.requestPermission();
        if (permission === 'granted') console.log('Push notifications enabled');
    } catch (e) { console.warn('[CRM] Notification permission request failed:', e && e.message); }
}
function showNotification(title, body) {
    // Android Chrome (browser AND installed app) throws "Illegal constructor" for `new Notification()`;
    // it only allows notifications through the service worker. This must never throw, or React unmounts the whole app.
    try {
        if (!('Notification' in window) || Notification.permission !== 'granted') return;
        const opts = { body: body, icon: './icon.png', badge: './icon.png' };
        const direct = function () { try { new Notification(title, opts); } catch (e) { console.warn('[CRM] Notification unavailable:', e && e.message); } };
        if (navigator.serviceWorker && navigator.serviceWorker.getRegistration) {
            navigator.serviceWorker.getRegistration().then(function (reg) { if (reg && reg.showNotification) reg.showNotification(title, opts); else direct(); }).catch(direct);
        } else { direct(); }
    } catch (e) { console.warn('[CRM] Notification failed:', e && e.message); }
}
window.__showNotification = showNotification;
