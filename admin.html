<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PH Engine v3.3 | Full Command Center</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .animate-fadeIn { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .priority-hot { border-left: 4px solid #ef4444; background: #fef2f2; }
        
        /* Custom scrollbar for the history box */
        .history-scroll::-webkit-scrollbar { width: 4px; }
        .history-scroll::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
    </style>
</head>
<body class="bg-gray-50 font-sans text-gray-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const supabaseUrl = 'https://uiiovtsktllvtecfokik.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVpaW92dHNrdGxsdnRlY2Zva2lrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM5NjkxMjMsImV4cCI6MjA4OTU0NTEyM30.fL6cU7YkH4-50w55GrnutoBhmH5sofe8-rOMZetmuvU';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey, { auth: { storage: window.sessionStorage } });
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxJOoh4meGBQOZYZpUWqK1DmDS_B8fXSC5NlwPcTX3GUfP7gzYQKvatgj9IFT3Txy-FCQ/exec";

        function AdminApp() {
            const [session, setSession] = useState(null);
            const [leads, setLeads] = useState([]);
            const [view, setView] = useState('dashboard'); 
            const [leadCategory, setLeadCategory] = useState('website'); 
            const [loading, setLoading] = useState(true);
            const [showManualModal, setShowManualModal] = useState(false);

            useEffect(() => {
                supabase.auth.getSession().then(({ data: { session } }) => {
                    setSession(session);
                    if (session) fetchLeads();
                });
                const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
                    setSession(session);
                    if (session) fetchLeads();
                });
                return () => subscription.unsubscribe();
            }, [leadCategory]);

            async function fetchLeads() {
                setLoading(true);
                const table = leadCategory === 'bulk' ? 'bulk_leads' : 'leads';
                const { data, error } = await supabase.from(table).select('*').order('created_at', { ascending: false });

                if (!error) {
                    let rawData = data || [];
                    let sortedData = [];
                    if (table === 'leads') {
                        if (leadCategory === 'website') {
                            sortedData = rawData.filter(l => !l.lead_source || l.lead_source.trim() === '' || l.lead_source.toLowerCase() === 'website');
                        } else {
                            sortedData = rawData.filter(l => l.lead_source && l.lead_source.trim() !== '' && l.lead_source.toLowerCase() !== 'website');
                        }
                    } else { sortedData = rawData; }
                    setLeads(sortedData);
                }
                setLoading(false);
            }

            const stats = useMemo(() => {
                const total = leads.length;
                const uncalled = leads.filter(l => l.lead_status === 'Un called' || !l.lead_status).length;
                const called = leads.filter(l => l.lead_status && l.lead_status !== 'Un called' && l.lead_status !== 'Rejected').length;
                const rejected = leads.filter(l => l.lead_status === 'Rejected').length;
                return {
                    total, uncalled, called, rejected,
                    uncalledPct: total ? Math.round((uncalled/total)*100) : 0,
                    calledPct: total ? Math.round((called/total)*100) : 0,
                    rejectedPct: total ? Math.round((rejected/total)*100) : 0
                };
            }, [leads]);

            async function updateLead(lead, field, value) {
                if (lead[field] === value && field !== 'add_note') return; 

                let updates = { [field]: value };
                const timestamp = new Date().toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute:'2-digit' });

                if (field === 'lead_status') {
                    const existingHistory = lead.call_remark ? `\n${lead.call_remark}` : '';
                    updates.call_remark = `[${timestamp}] Status: ${value}${existingHistory}`;
                }
                
                if (field === 'site_visit_at') {
                    const existingHistory = lead.call_remark ? `\n${lead.call_remark}` : '';
                    updates.call_remark = `[${timestamp}] SV Booked: ${value}${existingHistory}`;
                }

                if (field === 'add_note') {
                    if (!value.trim()) return;
                    const existingHistory = lead.call_remark ? `\n${lead.call_remark}` : '';
                    updates.call_remark = `[${timestamp}] Note: ${value}${existingHistory}`;
                    delete updates.add_note; 
                }

                const table = leadCategory === 'bulk' ? 'bulk_leads' : 'leads';
                const { error } = await supabase.from(table).update(updates).eq('id', lead.id);
                
                if (!error) {
                    setLeads(prev => prev.map(l => l.id === lead.id ? {...l, ...updates} : l));
                } else {
                    alert("System Error: " + error.message);
                }
            }

            if (!session) return <LoginForm supabase={supabase} />;

            return (
                <div className="min-h-screen flex flex-col animate-fadeIn">
                    <nav className="bg-slate-950 text-white p-5 flex justify-between items-center sticky top-0 z-50">
                        <div className="flex items-center gap-4">
                            <h1 className="font-black italic uppercase tracking-tighter text-2xl text-blue-400">PH Engine</h1>
                            <span className="bg-blue-900/50 text-blue-200 text-[10px] px-2 py-1 rounded font-bold uppercase tracking-widest">v3.3 CRM</span>
                        </div>
                        <div className="flex gap-6 text-[11px] font-black uppercase tracking-[0.15em] items-center">
                            <button onClick={() => setView('dashboard')} className={view === 'dashboard' ? 'text-blue-400' : 'text-slate-400'}>Leads CRM</button>
                            <button onClick={() => setView('add-property')} className={view === 'add-property' ? 'text-blue-400' : 'text-slate-400'}>List Property</button>
                            <button onClick={() => supabase.auth.signOut()} className="text-red-400">Logout</button>
                        </div>
                    </nav>

                    <main className="p-4 md:p-8 max-w-7xl mx-auto w-full space-y-8">
                        {view === 'dashboard' && (
                            <>
                                {/* Analytics */}
                                <div className="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden animate-fadeIn">
                                    <table className="w-full text-sm text-left">
                                        <thead className="bg-slate-50 border-b uppercase text-[10px] font-black text-slate-400 tracking-widest">
                                            <tr>
                                                <th className="p-5">Team Metric (Tharun)</th>
                                                <th className="p-5">Total</th>
                                                <th className="p-5">Uncalled</th>
                                                <th className="p-5">Called & Working</th>
                                                <th className="p-5">Rejected</th>
                                            </tr>
                                        </thead>
                                        <tbody className="font-bold text-slate-700">
                                            <tr>
                                                <td className="p-5 border-b uppercase text-[11px] tracking-tighter">Lead Volume ({leadCategory})</td>
                                                <td className="p-5 border-b">{stats.total}</td>
                                                <td className="p-5 border-b text-green-600">{stats.uncalled}</td>
                                                <td className="p-5 border-b text-blue-600">{stats.called}</td>
                                                <td className="p-5 border-b text-red-600">{stats.rejected}</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>

                                {/* Category Switcher */}
                                <div className="flex items-center gap-8 border-b border-slate-200 pb-2">
                                    {['website', 'bulk', 'manual'].map(cat => (
                                        <button key={cat} onClick={() => setLeadCategory(cat)} className={`pb-2 text-[11px] font-black uppercase tracking-[0.2em] transition-all border-b-2 ${leadCategory === cat ? 'border-blue-500 text-blue-500' : 'border-transparent text-slate-400'}`}>
                                            {cat}
                                        </button>
                                    ))}
                                    <button onClick={() => setShowManualModal(true)} className="ml-auto bg-blue-600 text-white text-[10px] px-6 py-2 rounded-full font-black uppercase tracking-widest shadow-lg">
                                        + Manual Entry
                                    </button>
                                </div>

                                {/* Pipeline Table */}
                                <div className="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-xs text-left">
                                            <thead>
                                                <tr className="bg-slate-50/50 text-slate-400 uppercase font-black text-[9px] tracking-widest border-b">
                                                    <th className="p-5">Customer Profile</th>
                                                    <th className="p-5">Status & Priority</th>
                                                    <th className="p-5">Site Visit</th>
                                                    <th className="p-5 min-w-[250px]">Activity History & Notes</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100">
                                                {loading ? (
                                                    <tr><td colSpan="4" className="p-20 text-center font-bold text-slate-300 uppercase italic animate-pulse">Syncing Database...</td></tr>
                                                ) : leads.map(lead => (
                                                    <tr key={lead.id} className={`hover:bg-blue-50/20 transition ${lead.lead_priority === 'Hot' ? 'priority-hot' : ''}`}>
                                                        {/* CUSTOMER INFO */}
                                                        <td className="p-5 min-w-[180px]">
                                                            <div className="font-black text-slate-900 uppercase text-[13px]">{lead.customer_name}</div>
                                                            <div className="text-blue-600 font-bold mt-0.5">{lead.phone_number}</div>
                                                            <div className="mt-3 flex gap-2">
                                                                <a href={`https://wa.me/91${lead.phone_number?.replace(/\D/g,'').slice(-10)}`} target="_blank" className="bg-green-500 text-white text-[8px] font-black px-2 py-1 rounded uppercase tracking-tighter shadow-sm hover:scale-105 transition">WhatsApp 💬</a>
                                                            </div>
                                                        </td>
                                                        
                                                        {/* STATUS & LOCK */}
                                                        <td className="p-5 min-w-[150px]">
                                                            <select 
                                                                value={lead.lead_status || 'Un called'} 
                                                                onChange={(e) => updateLead(lead, 'lead_status', e.target.value)} 
                                                                className="block w-full mb-2 p-2 border rounded-lg text-[9px] font-black uppercase tracking-widest bg-white shadow-sm outline-none focus:ring-2 focus:ring-blue-500"
                                                            >
                                                                {(!lead.lead_status || lead.lead_status === 'Un called') && <option value="Un called">Un called</option>}
                                                                <option value="Called">Called</option>
                                                                <option value="RNR">RNR</option>
                                                                <option value="Details Shared">Details Shared</option>
                                                                <option value="SV Scheduled">SV Scheduled</option>
                                                                <option value="Converted">Converted</option>
                                                                <option value="Rejected">Rejected</option>
                                                            </select>

                                                            <select 
                                                                value={lead.lead_priority || 'Warm'} 
                                                                onChange={(e) => updateLead(lead, 'lead_priority', e.target.value)} 
                                                                className={`block w-full p-2 border rounded-lg text-[9px] font-black uppercase tracking-widest outline-none focus:ring-2 focus:ring-blue-500 ${lead.lead_priority === 'Hot' ? 'text-red-600 bg-red-50 border-red-200' : 'text-slate-500 bg-white'}`}
                                                            >
                                                                <option>Hot</option><option>Warm</option><option>Cold</option>
                                                            </select>
                                                        </td>

                                                        {/* CONDITIONAL SV SCHEDULER */}
                                                        <td className="p-5 min-w-[140px]">
                                                            {lead.lead_status === 'SV Scheduled' ? (
                                                                <div className="animate-fadeIn">
                                                                    <span className="text-[8px] font-black text-green-600 uppercase tracking-widest block mb-1">Pick Date</span>
                                                                    <input 
                                                                        type="date" 
                                                                        defaultValue={lead.site_visit_at || ''} 
                                                                        onBlur={(e) => updateLead(lead, 'site_visit_at', e.target.value)} 
                                                                        className="w-full p-2 border border-green-200 bg-green-50 rounded-lg text-[10px] font-bold text-slate-700 outline-none focus:ring-2 focus:ring-green-500" 
                                                                    />
                                                                </div>
                                                            ) : (
                                                                <div className="text-[8px] text-slate-400 font-bold uppercase tracking-widest text-center bg-slate-50 p-3 rounded-lg border border-slate-100">
                                                                    Status must be<br/>"SV Scheduled"
                                                                </div>
                                                            )}
                                                        </td>

                                                        {/* ACTIVITY HISTORY LOGGER */}
                                                        <td className="p-5">
                                                            <div className="flex flex-col gap-2">
                                                                <div className="h-16 history-scroll overflow-y-auto bg-slate-50 border border-slate-200 p-2 rounded-lg text-[10px] font-medium whitespace-pre-wrap leading-relaxed text-slate-600">
                                                                    {lead.call_remark || <span className="text-slate-400 italic">No activity recorded yet...</span>}
                                                                </div>
                                                                <input 
                                                                    type="text" 
                                                                    placeholder="Type remark & press Enter to save..." 
                                                                    onKeyDown={(e) => {
                                                                        if (e.key === 'Enter') {
                                                                            updateLead(lead, 'add_note', e.target.value);
                                                                            e.target.value = ''; 
                                                                        }
                                                                    }}
                                                                    className="w-full p-2 border border-slate-200 rounded-lg text-[10px] outline-none focus:ring-2 focus:ring-blue-500 shadow-sm"
                                                                />
                                                            </div>
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </>
                        )}
                        {view === 'add-property' && <PropertyForm scriptUrl={GOOGLE_SCRIPT_URL} supabase={supabase} />}
                    </main>

                    {/* MANUAL MODAL */}
                    {showManualModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-[100] flex items-center justify-center p-4">
                            <div className="bg-white rounded-[40px] p-10 max-w-md w-full animate-fadeIn shadow-2xl relative">
                                <button onClick={() => setShowManualModal(false)} className="absolute top-6 right-8 text-3xl text-slate-300">&times;</button>
                                <h2 className="text-2xl font-black italic uppercase tracking-tighter mb-8">Manual Registration</h2>
                                <ManualLeadForm supabase={supabase} onSuccess={() => {setShowManualModal(false); fetchLeads();}} />
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function ManualLeadForm({ supabase, onSuccess }) {
            const [form, setForm] = useState({ name: '', phone: '', email: '', project: '', source: 'Manual' });
            const [loading, setLoading] = useState(false);
            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);
                const { error } = await supabase.from('leads').insert([{
                    customer_name: form.name, phone_number: form.phone, customer_email: form.email, project_interested_in: form.project, lead_source: form.source, lead_status: 'Un called'
                }]);
                if (!error) onSuccess();
                setLoading(false);
            };
            return (
                <form onSubmit={handleSubmit} className="space-y-4">
                    <input required placeholder="Client Name" className="w-full p-4 bg-slate-50 border rounded-2xl text-sm font-bold" onChange={e => setForm({...form, name: e.target.value})} />
                    <input required placeholder="Phone Number" className="w-full p-4 bg-slate-50 border rounded-2xl text-sm font-bold" onChange={e => setForm({...form, phone: e.target.value})} />
                    <select className="w-full p-4 bg-slate-50 border rounded-2xl text-sm font-bold" onChange={e => setForm({...form, source: e.target.value})}>
                        <option>Manual</option><option>MagicBricks</option><option>Housing.com</option><option>Direct Walk-in</option>
                    </select>
                    <button className="w-full bg-blue-600 text-white font-black py-5 rounded-3xl uppercase tracking-widest shadow-xl hover:bg-slate-900 transition">Inject Lead</button>
                </form>
            );
        }

        function LoginForm({ supabase }) {
            const [email, setEmail] = useState("");
            const [pass, setPass] = useState("");
            const handleLogin = async (e) => {
                e.preventDefault();
                await supabase.auth.signInWithPassword({ email, password: pass });
            };
            return (
                <div className="min-h-screen bg-slate-950 flex items-center justify-center p-4">
                    <form onSubmit={handleLogin} className="bg-white p-10 rounded-[40px] shadow-2xl w-full max-w-sm text-center border-t-8 border-blue-500">
                        <h1 className="text-3xl font-black italic uppercase mb-8">PH Engine</h1>
                        <input type="email" placeholder="Email" className="w-full p-4 bg-slate-100 rounded-2xl mb-3 font-bold" onChange={e => setEmail(e.target.value)} required />
                        <input type="password" placeholder="Password" className="w-full p-4 bg-slate-100 rounded-2xl mb-8 font-bold" onChange={e => setPass(e.target.value)} required />
                        <button className="w-full bg-blue-600 text-white font-black py-5 rounded-3xl uppercase tracking-widest">Unlock System</button>
                    </form>
                </div>
            );
        }

        // --- FULLY RESTORED PROPERTY FORM ---
        function PropertyForm({ scriptUrl, supabase }) {
            const [uploading, setUploading] = useState(false);
            const [uploadStatus, setUploadStatus] = useState("");
            const [form, setForm] = useState({
                property_name: '', price: '', location: '', property_type: '', construction_status: '',
                bhk: '', builder_name: '', cover_image: '', brochure: '', cost_sheet: ''
            });

            async function handleFileUpload(e, field) {
                const file = e.target.files[0];
                if (!file) return;
                
                if (!form.property_name) {
                    alert("Please enter a Property Name first so we know which folder to create/use in Google Drive!");
                    e.target.value = ''; 
                    return;
                }

                setUploading(true);
                setUploadStatus(`Uploading ${field.replace('_', ' ')} to Drive...`);

                try {
                    const reader = new FileReader();
                    reader.readAsDataURL(file);
                    reader.onload = async () => {
                        const base64 = reader.result.split(',')[1];
                        const response = await fetch(scriptUrl, {
                            method: "POST",
                            body: JSON.stringify({
                                base64: base64,
                                type: file.type,
                                name: file.name,
                                propertyName: form.property_name 
                            })
                        });
                        const result = await response.json();
                        
                        if(result.status === "success") {
                            setForm(prev => ({ ...prev, [field]: result.url }));
                            setUploadStatus(`Success! Link saved.`);
                            setTimeout(() => setUploadStatus(""), 2000);
                        } else {
                            alert("Upload error: " + result.message);
                            setUploadStatus("");
                        }
                    };
                } catch (err) { 
                    alert("Upload failed. Make sure your Apps Script Web App is deployed correctly."); 
                    setUploadStatus("");
                }
                finally { setUploading(false); }
            }

            async function saveProperty() {
                if (!form.property_name) return alert("Property Name is required!");
                
                const insertData = {
                    property_name: form.property_name,
                    price: form.price,
                    location: form.location,
                    property_type: form.property_type,
                    construction_status: form.construction_status,
                    bhk: form.bhk,
                    builder_name: form.builder_name,
                    cover_image: form.cover_image,
                    brochure: form.brochure,
                    cost_sheet: form.cost_sheet
                };

                const { error } = await supabase.from('properties').insert([insertData]);
                
                if (error) {
                    alert("Save failed: " + error.message);
                } else {
                    alert("Property Added Successfully! It is now live on your website.");
                    setForm({ property_name: '', price: '', location: '', property_type: '', construction_status: '', bhk: '', builder_name: '', cover_image: '', brochure: '', cost_sheet: '' });
                    document.querySelectorAll('input[type="file"]').forEach(el => el.value = '');
                }
            }

            return (
                <div className="bg-white p-6 md:p-10 rounded-3xl shadow-xl border border-slate-200 max-w-3xl mx-auto space-y-8 animate-fadeIn">
                    <div>
                        <h2 className="text-2xl md:text-3xl font-black uppercase tracking-tighter italic text-slate-900">List New Property</h2>
                        <p className="text-xs font-bold text-slate-400 uppercase tracking-widest mt-1">Updates instantly to perfecthorizons.in</p>
                    </div>
                    
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div className="md:col-span-2">
                            <label className="text-[10px] font-black uppercase tracking-widest text-slate-500 ml-2">Property Name (Required)</label>
                            <input className="w-full mt-1 p-4 bg-slate-50 border border-slate-200 rounded-xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500" placeholder="e.g. Godrej Splendour" onChange={e => setForm({...form, property_name: e.target.value})} value={form.property_name} />
                        </div>
                        
                        <div>
                            <label className="text-[10px] font-black uppercase tracking-widest text-slate-500 ml-2">Builder Name</label>
                            <input className="w-full mt-1 p-4 bg-slate-50 border border-slate-200 rounded-xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500" placeholder="e.g. Godrej Properties" onChange={e => setForm({...form, builder_name: e.target.value})} value={form.builder_name} />
                        </div>

                        <div>
                            <label className="text-[10px] font-black uppercase tracking-widest text-slate-500 ml-2">Starting Price</label>
                            <input className="w-full mt-1 p-4 bg-slate-50 border border-slate-200 rounded-xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500" placeholder="e.g. ₹ 1.2 Cr" onChange={e => setForm({...form, price: e.target.value})} value={form.price} />
                        </div>

                        <div>
                            <label className="text-[10px] font-black uppercase tracking-widest text-slate-500 ml-2">Location</label>
                            <input className="w-full mt-1 p-4 bg-slate-50 border border-slate-200 rounded-xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500" placeholder="e.g. Whitefield, Bengaluru" onChange={e => setForm({...form, location: e.target.value})} value={form.location} />
                        </div>

                        <div>
                            <label className="text-[10px] font-black uppercase tracking-widest text-slate-500 ml-2">BHK Config</label>
                            <input className="w-full mt-1 p-4 bg-slate-50 border border-slate-200 rounded-xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500" placeholder="e.g. 2, 3, 4" onChange={e => setForm({...form, bhk: e.target.value})} value={form.bhk} />
                        </div>

                        <div>
                            <label className="text-[10px] font-black uppercase tracking-widest text-slate-500 ml-2">Property Type</label>
                            <select className="w-full mt-1 p-4 bg-slate-50 border border-slate-200 rounded-xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500" onChange={e => setForm({...form, property_type: e.target.value})} value={form.property_type}>
                                <option value="">Select Type...</option>
                                <option value="Apartment">Apartment</option>
                                <option value="Villa">Villa</option>
                                <option value="Plot">Plot</option>
                            </select>
                        </div>

                        <div>
                            <label className="text-[10px] font-black uppercase tracking-widest text-slate-500 ml-2">Construction Status</label>
                            <select className="w-full mt-1 p-4 bg-slate-50 border border-slate-200 rounded-xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500" onChange={e => setForm({...form, construction_status: e.target.value})} value={form.construction_status}>
                                <option value="">Select Status...</option>
                                <option value="New Launch">New Launch</option>
                                <option value="Under Construction">Under Construction</option>
                                <option value="Ready to Move">Ready to Move</option>
                            </select>
                        </div>
                        
                        <div className="md:col-span-2 space-y-5 border-t border-slate-200 pt-6 mt-2">
                            <div className="flex items-center justify-between">
                                <p className="text-[11px] font-black uppercase tracking-widest text-slate-400">Google Drive Asset Uploads</p>
                                {uploadStatus && <span className="text-[10px] font-bold text-blue-600 animate-pulse">{uploadStatus}</span>}
                            </div>
                            
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 relative overflow-hidden group">
                                    <span className="text-xs font-black uppercase tracking-widest block mb-3 text-slate-700">🖼️ Cover Image</span>
                                    <input type="file" accept="image/*" onChange={e => handleFileUpload(e, 'cover_image')} className="text-[10px] w-full file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-[10px] file:font-black file:uppercase file:tracking-widest file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer" />
                                    {form.cover_image && <div className="mt-3 text-[9px] text-green-600 font-bold truncate">✓ Linked</div>}
                                </div>
                                
                                <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 relative overflow-hidden group">
                                    <span className="text-xs font-black uppercase tracking-widest block mb-3 text-slate-700">📄 Brochure</span>
                                    <input type="file" accept=".pdf" onChange={e => handleFileUpload(e, 'brochure')} className="text-[10px] w-full file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-[10px] file:font-black file:uppercase file:tracking-widest file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer" />
                                    {form.brochure && <div className="mt-3 text-[9px] text-green-600 font-bold truncate">✓ Linked</div>}
                                </div>

                                <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 relative overflow-hidden group">
                                    <span className="text-xs font-black uppercase tracking-widest block mb-3 text-slate-700">📊 Cost Sheet</span>
                                    <input type="file" accept=".pdf" onChange={e => handleFileUpload(e, 'cost_sheet')} className="text-[10px] w-full file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-[10px] file:font-black file:uppercase file:tracking-widest file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer" />
                                    {form.cost_sheet && <div className="mt-3 text-[9px] text-green-600 font-bold truncate">✓ Linked</div>}
                                </div>
                            </div>
                        </div>
                    </div>

                    <button 
                        disabled={uploading}
                        onClick={saveProperty}
                        className="w-full bg-blue-600 text-white p-5 rounded-2xl font-black uppercase tracking-widest hover:bg-slate-900 transition-colors shadow-xl shadow-blue-500/20 disabled:opacity-50 disabled:cursor-not-allowed mt-4"
                    >
                        {uploading ? "Waiting for upload..." : "Publish to Website"}
                    </button>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AdminApp />);
    </script>
</body>
</html>
