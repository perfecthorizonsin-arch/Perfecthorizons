<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizon CRM | Command Center</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .animate-fadeIn { animation: fadeIn 0.15s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .history-scroll::-webkit-scrollbar { width: 4px; }
        .history-scroll::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
        .toggle-active { background-color: #f59e0b; color: white; border-color: #f59e0b; }
        .ring-hot { border-left: 5px solid #ef4444 !important; }
        .ring-warm { border-left: 5px solid #f59e0b !important; }
        .ring-cold { border-left: 5px solid #3b82f6 !important; }
        input[type=range] { -webkit-appearance: none; background: transparent; width: 100%; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 18px; width: 18px; background: #2563eb; cursor: pointer; margin-top: -7px; border-radius: 50%; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: #cbd5e1; border-radius: 2px; }
        .pie-chart { border-radius: 50%; display: inline-block; }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-900 pb-20 md:pb-0">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const supabaseUrl = 'https://uiiovtsktllvtecfokik.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVpaW92dHNrdGxsdnRlY2Zva2lrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM5NjkxMjMsImV4cCI6MjA4OTU0NTEyM30.fL6cU7YkH4-50w55GrnutoBhmH5sofe8-rOMZetmuvU';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey, { auth: { storage: window.sessionStorage } });
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwaOLlqAQZMZczkAWuyK2F2DEHZ2ILgxlJnlDDZrrDNBSdszBZpX3M0f_p9mVtUePobDQ/exec";
        const WHATSAPP_NUMBER = "9113261205";

        const getVal = (obj, searchKey) => {
            if (!obj) return "";
            if (obj[searchKey] !== undefined && obj[searchKey] !== "") return obj[searchKey];
            const cleanKey = searchKey.replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
            for (let k in obj) { if (k.replace(/[^a-zA-Z0-9]/g, '').toLowerCase() === cleanKey) return obj[k]; }
            return "";
        };

        const convertDriveLink = (url) => {
            if (!url || typeof url !== 'string') return url;
            let idMatch = url.match(/\/d\/(.*?)\//) || url.match(/id=(.*?)(&|$)/);
            let id = idMatch ? idMatch[1] : null;
            if (id) return `https://drive.google.com/thumbnail?id=${id}&sz=w1000`;
            return url;
        };

        const PropertyDetailsPage = ({ property, onBack }) => {
            const [shareModal, setShareModal] = useState(null);
            const [selectedUrls, setSelectedUrls] = useState([]);
            
            useEffect(() => { window.scrollTo(0, 0); }, [property]);

            const cover = convertDriveLink(getVal(property, "cover_image") || getVal(property, "cover-image"));
            const galRaw = getVal(property, "gallery_images") || getVal(property, "gallery-images") || "";
            const imgs = [cover, ...(typeof galRaw === 'string' ? galRaw.split(',').map(l => convertDriveLink(l.trim())) : [])].filter(i => i);

            // --- SELECTION MODAL LOGIC ---
            const openShareModal = (type, linkStr) => {
                if (!linkStr || linkStr.trim() === '') return alert(`${type} is not available.`);
                const urls = linkStr.split(',').map(u => u.trim()).filter(Boolean);
                if (urls.length === 1 || type === 'Location Map' || type === 'Property Video') {
                    executeShare(type, urls);
                } else {
                    setShareModal({ type, urls });
                    setSelectedUrls([...urls]);
                }
            };

            const executeShare = async (type, urlsToShare) => {
                const propName = getVal(property, "Property Name") || getVal(property, "property_name");
                const textMsg = `Hello! Here is the ${type} for *${propName}*:`;
                const waUrl = `https://wa.me/?text=${encodeURIComponent(textMsg + '\n\n' + urlsToShare.join('\n\n'))}`;

                if (navigator.canShare && /Android|iPhone|iPad/i.test(navigator.userAgent) && !type.includes('Map') && !type.includes('Video')) {
                    try {
                        const filesToShare = [];
                        for (let url of urlsToShare) {
                            const res = await fetch(url);
                            const blob = await res.blob();
                            const isPdf = url.toLowerCase().includes('.pdf') || blob.type.includes('pdf');
                            const mime = isPdf ? 'application/pdf' : blob.type;
                            const ext = isPdf ? 'pdf' : 'jpg';
                            filesToShare.push(new File([blob], `${propName.replace(/\s/g,'_')}_${type}.${ext}`, { type: mime }));
                        }
                        await navigator.share({ files: filesToShare, title: propName, text: textMsg });
                        setShareModal(null);
                        return;
                    } catch (e) { console.error(e); }
                }
                window.open(waUrl, '_blank');
                setShareModal(null);
            };

            return (
                <div className="min-h-screen bg-slate-50 animate-fadeIn pb-24 md:pb-0">
                    <div className="bg-white border-b border-slate-200 sticky top-0 z-40 px-4 md:px-8 py-4 flex justify-between items-center shadow-sm">
                        <button onClick={onBack} className="text-slate-600 hover:text-blue-600 text-xs font-black uppercase tracking-widest flex items-center transition group">← Back</button>
                    </div>

                    <div className="max-w-7xl mx-auto w-full p-4 md:p-8">
                        <div className="relative mb-8 h-[40vh] md:h-[60vh] rounded-3xl overflow-hidden bg-slate-200 shadow-lg">
                            <img src={cover} className="w-full h-full object-cover" />
                            <div className="absolute inset-0 bg-gradient-to-t from-black/70 flex flex-col justify-end p-8">
                                <h1 className="text-3xl md:text-5xl font-black text-white uppercase tracking-tighter italic">{getVal(property, "property_name")}</h1>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                            <div className="lg:col-span-2 space-y-6">
                                <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm grid grid-cols-2 md:grid-cols-4 gap-4">
                                    <div><p className="text-[9px] font-black uppercase text-slate-400">Config</p><p className="font-bold text-slate-800">{getVal(property, "bhk")}</p></div>
                                    <div><p className="text-[9px] font-black uppercase text-slate-400">Status</p><p className="font-bold text-slate-800">{getVal(property, "construction_status") || 'N/A'}</p></div>
                                    <div><p className="text-[9px] font-black uppercase text-slate-400">Region</p><p className="font-bold text-slate-800">{getVal(property, "property_region") || 'N/A'}</p></div>
                                    <div><p className="text-[9px] font-black uppercase text-slate-400">Price</p><p className="font-bold text-blue-600">{getVal(property, "price")}</p></div>
                                </div>
                                <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
                                    <h3 className="font-black uppercase italic mb-4">Description</h3>
                                    <p className="text-slate-600 text-sm leading-relaxed">{getVal(property, "description")}</p>
                                </div>
                            </div>

                            <div className="lg:col-span-1 space-y-6">
                                <div className="bg-slate-900 text-white p-6 rounded-[35px] shadow-xl">
                                    <h4 className="text-xs font-black uppercase tracking-widest text-blue-400 mb-4 border-b border-slate-700 pb-2">WhatsApp Admin Share</h4>
                                    <div className="grid grid-cols-2 gap-2">
                                        <button onClick={() => openShareModal('Brochure', getVal(property, "brochure"))} className="bg-slate-800 hover:bg-blue-600 p-3 rounded-xl text-[10px] font-bold transition">📥 Brochure</button>
                                        <button onClick={() => openShareModal('Cost Sheet', getVal(property, "cost_sheet"))} className="bg-slate-800 hover:bg-blue-600 p-3 rounded-xl text-[10px] font-bold transition">📄 Cost Sheet</button>
                                        <button onClick={() => openShareModal('Location Map', getVal(property, "map_link"))} className="bg-slate-800 hover:bg-blue-600 p-3 rounded-xl text-[10px] font-bold transition">📍 Location</button>
                                        <button onClick={() => openShareModal('Property Video', getVal(property, "video_link"))} className="bg-slate-800 hover:bg-blue-600 p-3 rounded-xl text-[10px] font-bold transition">🎥 Video</button>
                                        <button onClick={() => openShareModal('Floor Plan', getVal(property, "floor_plan"))} className="bg-slate-800 hover:bg-blue-600 p-3 rounded-xl text-[10px] font-bold transition">📐 Floor Plan</button>
                                        <button onClick={() => openShareModal('Miscellaneous', getVal(property, "miscellaneous"))} className="bg-slate-800 hover:bg-blue-600 p-3 rounded-xl text-[10px] font-bold transition">📂 Misc</button>
                                        <button onClick={() => openShareModal('Gallery Images', getVal(property, "gallery_images"))} className="col-span-2 bg-blue-600 hover:bg-blue-500 p-3 rounded-xl text-[10px] font-black uppercase tracking-widest transition mt-2">🖼️ Share Actual Images</button>
                                    </div>
                                </div>
                                <EMICalculator propertyPriceStr={getVal(property, "price")} />
                            </div>
                        </div>
                    </div>

                    {shareModal && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-900/80 backdrop-blur-sm animate-fadeIn">
                            <div className="bg-white rounded-[30px] w-full max-w-md shadow-2xl p-6 relative flex flex-col max-h-[80vh]">
                                <button onClick={() => setShareModal(null)} className="absolute top-6 right-6 text-xl text-slate-400">✕</button>
                                <h2 className="text-lg font-black uppercase text-slate-900 mb-4">Select Files</h2>
                                <div className="overflow-y-auto space-y-2 mb-4 pr-2">
                                    {shareModal.urls.map((url, i) => (
                                        <label key={i} className="flex items-center gap-3 p-3 border rounded-xl cursor-pointer hover:bg-slate-50 transition">
                                            <input type="checkbox" className="w-5 h-5 accent-blue-600" checked={selectedUrls.includes(url)} onChange={() => setSelectedUrls(prev => prev.includes(url) ? prev.filter(u => u !== url) : [...prev, url])} />
                                            <span className="text-[10px] font-bold text-slate-500 truncate">{url.split('/').pop().substring(0,30)}...</span>
                                        </label>
                                    ))}
                                </div>
                                <button onClick={() => executeShare(shareModal.type, selectedUrls)} className="w-full bg-blue-600 text-white p-4 rounded-xl font-black uppercase tracking-widest shadow-lg">Send Selected ({selectedUrls.length})</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        function AdminApp() {
            const [view, setView] = useState('dashboard');
            const [leadCategory, setLeadCategory] = useState('website');
            const [session, setSession] = useState(null);
            const [leads, setLeads] = useState([]);
            const [properties, setProperties] = useState([]);
            const [selectedProp, setSelectedProp] = useState(null);
            const [loading, setLoading] = useState(false);

            useEffect(() => {
                supabase.auth.getSession().then(({ data: { session } }) => setSession(session));
                supabase.auth.onAuthStateChange((_event, session) => setSession(session));
            }, []);

            useEffect(() => { if (session) { fetchProperties(); fetchLeads(); } }, [session, leadCategory, view]);

            async function fetchLeads() {
                if (view !== 'dashboard') return;
                const table = leadCategory === 'bulk' ? 'bulk_leads' : 'leads';
                const { data } = await supabase.from(table).select('*').order('created_at', { ascending: false });
                if (data) setLeads(data);
            }

            async function fetchProperties() {
                const { data } = await supabase.from('properties').select('*').order('created_at', { ascending: false });
                if (data) setProperties(data);
            }

            const toggleLive = async (e, p) => {
                e.stopPropagation();
                const newStatus = p.is_live === false;
                setProperties(prev => prev.map(item => item.id === p.id ? { ...item, is_live: newStatus } : item));
                const { error } = await supabase.from('properties').update({ is_live: newStatus }).eq('id', p.id);
                if (error) alert("Database column 'is_live' missing! Please add it in Supabase.");
            };

            if (!session) return <LoginForm supabase={supabase} />;
            if (selectedProp) return <PropertyDetailsPage property={selectedProp} onBack={() => setSelectedProp(null)} />;

            return (
                <div className="min-h-screen flex flex-col">
                    <nav className="bg-slate-900 text-white p-4 flex justify-between items-center sticky top-0 z-50 shadow-md">
                        <h1 className="font-black tracking-tighter text-xl uppercase italic">Horizon <span className="text-blue-500">CRM</span></h1>
                        <div className="flex gap-4 text-[10px] font-bold uppercase tracking-widest">
                            <button onClick={() => setView('dashboard')}>CRM</button>
                            <button onClick={() => setView('library')}>Library</button>
                            <button onClick={() => setView('add')}>+ Project</button>
                        </div>
                    </nav>

                    <main className="p-3 md:p-8 max-w-7xl mx-auto w-full">
                        {view === 'dashboard' && (
                            <div className="space-y-6">
                                <div className="flex gap-4 border-b">
                                    {['website', 'bulk', 'manual'].map(c => (
                                        <button key={c} onClick={() => setLeadCategory(c)} className={`pb-2 text-[10px] font-black uppercase tracking-widest ${leadCategory === c ? 'border-b-2 border-blue-500 text-blue-600' : 'text-slate-500'}`}>{c}</button>
                                    ))}
                                </div>
                                <div className="bg-white rounded-2xl shadow-sm border overflow-hidden">
                                    <table className="w-full text-left text-xs">
                                        <thead className="bg-slate-50 text-slate-400 font-black uppercase text-[9px] border-b">
                                            <tr><th className="p-4">Customer</th><th className="p-4">Status</th><th className="p-4">Notes</th></tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100">
                                            {leads.map(l => (
                                                <tr key={l.id} className={`${getCardTint(l.lead_status)}`}>
                                                    <td className="p-4 font-bold uppercase">{l.customer_name}<div className="text-blue-600 text-[10px]">{l.phone_number}</div></td>
                                                    <td className="p-4"><span className={`px-2 py-1 rounded-full text-[9px] font-black uppercase ${getStatusStyles(l.lead_status)}`}>{l.lead_status}</span></td>
                                                    <td className="p-4 text-slate-500 italic text-[10px] truncate max-w-[200px]">{l.call_remark || 'No logs...'}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {view === 'library' && (
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                                {properties.map(p => (
                                    <div key={p.id} onClick={() => setSelectedProp(p)} className="bg-white rounded-3xl border border-slate-200 overflow-hidden cursor-pointer hover:shadow-lg transition flex flex-col relative">
                                        <div className="h-40 bg-slate-100 relative">
                                            <img src={fixImageUrl(getVal(p, "cover_image"))} className="w-full h-full object-cover" />
                                            <button onClick={(e) => toggleLive(e, p)} className={`absolute top-2 right-2 px-3 py-1 rounded-full text-[9px] font-black uppercase shadow-lg ${p.is_live !== false ? 'bg-green-500 text-white' : 'bg-red-500 text-white'}`}>
                                                {p.is_live !== false ? '🟢 Live' : '🔴 Hidden'}
                                            </button>
                                        </div>
                                        <div className="p-5 flex-grow">
                                            <h3 className="text-lg font-black uppercase italic tracking-tighter truncate">{getVal(p, "property_name")}</h3>
                                            <p className="text-slate-400 text-[10px] font-bold truncate">📍 {getVal(p, "location")}</p>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {view === 'add' && <PropertyForm scriptUrl={GOOGLE_SCRIPT_URL} supabase={supabase} />}
                    </main>
                </div>
            );
        }

        function PropertyForm({ supabase, scriptUrl }) {
            const [form, setForm] = useState({ property_name: '', price: '', cover_image: '', bhk: '' });
            const [uploading, setUploading] = useState(null);

            const handleUpload = async (e, field) => {
                const files = e.target.files; if (!files.length) return;
                setUploading(field);
                const urls = [];
                for (let file of files) {
                    const formData = new FormData();
                    formData.append('file', file);
                    formData.append('upload_preset', 'horizon_preset');
                    const res = await fetch(`https://api.cloudinary.com/v1_1/dzptjohkq/auto/upload`, { method: 'POST', body: formData });
                    const data = await res.json();
                    if (data.secure_url) urls.push(data.secure_url);

                    const reader = new FileReader();
                    reader.readAsDataURL(file);
                    reader.onload = () => {
                        fetch(scriptUrl, { method: "POST", body: JSON.stringify({ base64: reader.result.split(',')[1], type: file.type, name: file.name, propertyName: form.property_name || 'Uploads', category: field }) });
                    };
                }
                setForm(prev => ({ ...prev, [field]: urls.join(',') }));
                setUploading(null);
            };

            const save = async () => {
                if (!form.property_name || !form.price || !form.cover_image) return alert("Fill mandatory fields!");
                const { error } = await supabase.from('properties').insert([form]);
                if (!error) alert("Listing Live!");
            };

            return (
                <div className="bg-white p-8 rounded-3xl shadow-sm border max-w-2xl mx-auto space-y-4">
                    <h2 className="font-black uppercase italic italic text-xl border-b pb-2">New Listing</h2>
                    <input className="w-full p-4 bg-slate-50 border rounded-2xl font-bold" placeholder="Property Name *" onChange={e => setForm({...form, property_name: e.target.value})} />
                    <input className="w-full p-4 bg-slate-50 border rounded-2xl font-bold" placeholder="Price (e.g. 1.2 Cr) *" onChange={e => setForm({...form, price: e.target.value})} />
                    <input className="w-full p-4 bg-slate-50 border rounded-2xl font-bold" placeholder="BHK (e.g. 2, 3 BHK)" onChange={e => setForm({...form, bhk: e.target.value})} />
                    <div className="grid grid-cols-2 gap-4">
                        {['cover_image', 'gallery_images', 'brochure', 'cost_sheet', 'floor_plan', 'video_link', 'miscellaneous'].map(f => (
                            <div key={f} className="p-3 border rounded-xl bg-slate-50 relative">
                                <label className="text-[8px] font-black uppercase text-slate-400 block mb-1">{f.replace('_',' ')}</label>
                                <input type="file" className="text-[9px]" multiple onChange={e => handleUpload(e, f)} />
                                {uploading === f && <span className="absolute right-2 bottom-2 text-blue-500 animate-pulse text-[8px]">UPLOADING...</span>}
                            </div>
                        ))}
                    </div>
                    <button onClick={save} className="w-full bg-blue-600 text-white p-4 rounded-2xl font-black uppercase tracking-widest shadow-xl">Publish Project</button>
                </div>
            );
        }

        function LoginForm({ supabase }) {
            const [email, setEmail] = useState(""); const [pass, setPass] = useState("");
            const handleLogin = (e) => { e.preventDefault(); supabase.auth.signInWithPassword({ email, password: pass }); };
            return (
                <div className="min-h-screen bg-slate-950 flex items-center justify-center p-4">
                    <form onSubmit={handleLogin} className="bg-white p-10 rounded-[40px] shadow-2xl w-full max-w-sm text-center border-t-8 border-blue-500">
                        <h1 className="text-3xl font-black italic uppercase mb-8">Horizon CRM</h1>
                        <input type="email" required placeholder="Email" className="w-full p-4 bg-slate-100 rounded-2xl mb-4 font-bold outline-none" onChange={e => setEmail(e.target.value)} />
                        <input type="password" required placeholder="Password" className="w-full p-4 bg-slate-100 rounded-2xl mb-8 font-bold outline-none" onChange={e => setPass(e.target.value)} />
                        <button type="submit" className="w-full bg-blue-600 text-white font-black py-4 rounded-2xl uppercase tracking-widest shadow-lg">Login</button>
                    </form>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AdminApp />);
    </script>
</body>
</html>
