<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizon CRM | Command Center</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .animate-fadeIn { animation: fadeIn 0.15s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .history-scroll::-webkit-scrollbar { width: 4px; }
        .history-scroll::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
        .toggle-active { background-color: #f59e0b; color: white; border-color: #f59e0b; }
        .ring-hot { border-left: 5px solid #ef4444 !important; }
        .ring-warm { border-left: 5px solid #f59e0b !important; }
        .ring-cold { border-left: 5px solid #3b82f6 !important; }
        input[type=range] { -webkit-appearance: none; background: transparent; width: 100%; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 18px; width: 18px; background: #2563eb; cursor: pointer; margin-top: -7px; border-radius: 50%; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: #cbd5e1; border-radius: 2px; }
        .pie-chart { border-radius: 50%; display: inline-block; }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-900 pb-20 md:pb-0">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const supabaseUrl = 'https://uiiovtsktllvtecfokik.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVpaW92dHNrdGxsdnRlY2Zva2lrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM5NjkxMjMsImV4cCI6MjA4OTU0NTEyM30.fL6cU7YkH4-50w55GrnutoBhmH5sofe8-rOMZetmuvU';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey, { auth: { storage: window.sessionStorage } });
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwaOLlqAQZMZczkAWuyK2F2DEHZ2ILgxlJnlDDZrrDNBSdszBZpX3M0f_p9mVtUePobDQ/exec";
        const WHATSAPP_NUMBER = "9113261205";

        const getVal = (obj, searchKey) => {
            if (!obj) return "";
            if (obj[searchKey] !== undefined && obj[searchKey] !== "") return obj[searchKey];
            const cleanKey = searchKey.replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
            for (let k in obj) { if (k.replace(/[^a-zA-Z0-9]/g, '').toLowerCase() === cleanKey) return obj[k]; }
            return "";
        };

        const convertDriveLink = (url) => {
            if (!url || typeof url !== 'string') return url;
            let idMatch = url.match(/\/d\/(.*?)\//) || url.match(/id=(.*?)(&|$)/);
            let id = idMatch ? idMatch[1] : null;
            if (id) return `https://drive.google.com/thumbnail?id=${id}&sz=w1000`;
            return url;
        };

        const fixImageUrl = (u) => u ? convertDriveLink(u.split(',')[0].trim()) : 'https://via.placeholder.com/600x300?text=No+Image';

        const extractPriceInCr = (priceString) => {
            if (!priceString) return 0;
            try {
                const cleanStr = String(priceString).toLowerCase().replace(/,/g, '');
                const numMatch = cleanStr.match(/[0-9.]+/); 
                if (!numMatch) return 0;
                const val = parseFloat(numMatch[0]);
                if (isNaN(val)) return 0;
                if (cleanStr.includes('cr') || cleanStr.includes('crore')) return val;
                if (cleanStr.includes('lac') || cleanStr.includes('lakh')) return val / 100;
                if (val > 100000) return val / 10000000; 
                return 0; 
            } catch(e) { return 0; }
        };

        const formatIndianCurrencyCompact = (num) => {
            if (num >= 10000000) return '₹' + (num / 10000000).toFixed(2).replace(/\.00$/, '') + ' Cr';
            if (num >= 100000) return '₹' + (num / 100000).toFixed(2).replace(/\.00$/, '') + ' L';
            return new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(num);
        };

        const formatPercent = (val) => {
            let num = parseFloat(val);
            if (isNaN(num)) return String(val || "0%");
            return (num < 1 && num > 0) ? (num * 100).toFixed(1) + "%" : num + "%";
        };

        const getSafeLink = (rawLink) => {
            if (!rawLink) return "#";
            const link = String(rawLink).trim();
            if (link === "#") return "#";
            if (link.includes('@') && !link.startsWith('mailto:')) return `mailto:${link}`;
            if (!link.startsWith('http') && !link.includes('@')) return `https://${link}`;
            return link;
        };

        const getStatusStyles = (status) => {
            switch(status) {
                case 'Called': return 'bg-blue-100 text-blue-800 border-blue-300';
                case 'RNR': return 'bg-orange-100 text-orange-800 border-orange-300';
                case 'Details Shared': return 'bg-purple-100 text-purple-800 border-purple-300';
                case 'SV Scheduled': return 'bg-teal-100 text-teal-800 border-teal-300';
                case 'Converted': return 'bg-green-100 text-green-800 border-green-400';
                case 'Rejected': return 'bg-red-100 text-red-800 border-red-300';
                default: return 'bg-slate-50 text-slate-600 border-slate-200';
            }
        };

        const getPriorityColor = (priority) => {
            switch(priority) {
                case 'Hot': return 'bg-red-50 text-red-700 border-red-400';
                case 'Cold': return 'bg-blue-50 text-blue-700 border-blue-400';
                default: return 'bg-amber-50 text-amber-700 border-amber-400';
            }
        };

        const getCardTint = (status) => {
            switch(status) {
                case 'Un called': return 'bg-yellow-50';
                case 'Called': return 'bg-green-50';
                case 'RNR': return 'bg-orange-50';
                case 'Details Shared': return 'bg-purple-50';
                case 'SV Scheduled': return 'bg-blue-50';
                case 'Converted': return 'bg-emerald-50';
                case 'Rejected': return 'bg-red-50';
                default: return 'bg-white';
            }
        };

        const EMICalculator = ({ propertyPriceStr }) => {
            const propertyValue = extractPriceInCr(propertyPriceStr) > 0 ? extractPriceInCr(propertyPriceStr) * 10000000 : 10000000; 
            const [loanAmount, setLoanAmount] = useState(propertyValue * 0.8);
            const [interestRate, setInterestRate] = useState(8.5);
            const [tenureYears, setTenureYears] = useState(20);

            const { emi, totalInterest, principalPct } = useMemo(() => {
                const p = loanAmount;
                const r = interestRate / 12 / 100;
                const n = tenureYears * 12;
                if (p === 0 || r === 0 || n === 0) return { emi: 0, totalInterest: 0, principalPct: 100 };
                
                const emiValue = (p * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
                const totalPay = emiValue * n;
                const totalInt = totalPay - p;
                const pct = (p / totalPay) * 100;

                return { emi: Math.round(emiValue), totalInterest: Math.round(totalInt), principalPct: pct.toFixed(1) };
            }, [loanAmount, interestRate, tenureYears]);

            return (
                <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm mt-6">
                    <h3 className="text-sm font-black uppercase tracking-widest text-slate-900 mb-6 flex items-center">
                        <span className="mr-2 text-xl">📊</span> EMI Calculator
                    </h3>
                    <div className="flex items-center gap-6 mb-8">
                        <div className="w-16 h-16 pie-chart shrink-0 shadow-inner" style={{ background: `conic-gradient(#2563eb ${principalPct}%, #e2e8f0 ${principalPct}% 100%)` }}></div>
                        <div className="flex flex-col gap-2 w-full">
                            <div className="flex justify-between items-center border-b border-slate-100 pb-1">
                                <div className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-blue-600"></span><span className="text-[9px] font-bold text-slate-500 uppercase tracking-widest">Principal</span></div>
                                <span className="text-[10px] font-black text-slate-900">{formatIndianCurrencyCompact(loanAmount)}</span>
                            </div>
                            <div className="flex justify-between items-center">
                                <div className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-slate-300"></span><span className="text-[9px] font-bold text-slate-500 uppercase tracking-widest">Interest</span></div>
                                <span className="text-[10px] font-black text-slate-900">{formatIndianCurrencyCompact(totalInterest)}</span>
                            </div>
                        </div>
                    </div>
                    <div className="space-y-5">
                        <div>
                            <div className="flex justify-between mb-2">
                                <label className="text-[10px] font-black uppercase text-slate-400 tracking-widest">Loan Amount</label>
                                <span className="text-xs font-black text-blue-600 bg-blue-50 px-2 py-0.5 rounded">{formatIndianCurrencyCompact(loanAmount)}</span>
                            </div>
                            <input type="range" min="1000000" max="50000000" step="100000" value={loanAmount} onChange={(e) => setLoanAmount(Number(e.target.value))} />
                        </div>
                        <div>
                            <div className="flex justify-between mb-2">
                                <label className="text-[10px] font-black uppercase text-slate-400 tracking-widest">Interest Rate</label>
                                <span className="text-xs font-black text-blue-600 bg-blue-50 px-2 py-0.5 rounded">{interestRate}%</span>
                            </div>
                            <input type="range" min="6" max="15" step="0.1" value={interestRate} onChange={(e) => setInterestRate(Number(e.target.value))} />
                        </div>
                        <div>
                            <div className="flex justify-between mb-2">
                                <label className="text-[10px] font-black uppercase text-slate-400 tracking-widest">Tenure</label>
                                <span className="text-xs font-black text-blue-600 bg-blue-50 px-2 py-0.5 rounded">{tenureYears} Yrs</span>
                            </div>
                            <input type="range" min="5" max="30" step="1" value={tenureYears} onChange={(e) => setTenureYears(Number(e.target.value))} />
                        </div>
                        <div className="pt-4 border-t border-slate-100 flex justify-between items-center">
                            <div>
                                <div className="text-[9px] font-black uppercase text-slate-400 tracking-widest mb-1">Estimated EMI</div>
                                <div className="text-xl font-black text-slate-900 tracking-tighter">{formatIndianCurrencyCompact(emi)} <span className="text-[10px] text-slate-400 font-bold tracking-normal uppercase">/mo</span></div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const PropertyDetailsPage = ({ property, onBack }) => {
            const galleryRef = useRef(null);
            useEffect(() => { window.scrollTo(0, 0); }, [property]);

            const cover = convertDriveLink(getVal(property, "cover_image") || getVal(property, "cover-image"));
            const galRaw = getVal(property, "gallery_images") || getVal(property, "gallery-images") || "";
            const imgs = [cover, ...(typeof galRaw === 'string' ? galRaw.split(',').map(l => convertDriveLink(l.trim())) : [])].filter(i => i); 
            const projectUsps = getVal(property, "usp_details") || getVal(property, "usp_s") || getVal(property, "USP's");

            const openLink = (rawLink) => {
                if (!rawLink || rawLink.trim() === '') return alert("This link was not provided for this property.");
                window.open(getSafeLink(rawLink), '_blank');
            };

            const handlePreviewImages = () => {
                const gallery = getVal(property, "gallery_images") || getVal(property, "cover_image");
                if (!gallery || gallery.trim() === '') return alert("No images available.");
                let firstLink = gallery.split(',')[0].trim();
                let folderLink = firstLink.replace('thumbnail?id=', 'file/d/').replace('&sz=w1000', '/view');
                window.open(folderLink, '_blank');
            };

            const regLink = getVal(property, "lead_registration") || getVal(property, "lead_registration_link") || getVal(property, "lead_registration_link_or_email_id");
            const isEmail = regLink && regLink.includes('@') && !regLink.startsWith('http');
            const regText = isEmail ? "✉️ Email Lead Details" : "🌐 Direct to Website Link";

            const handleRegisterLead = () => {
                if (!regLink || regLink.trim() === '') return alert("No lead registration details provided.");
                if (isEmail) {
                    let email = regLink.replace('mailto:', '').trim();
                    window.location.href = `mailto:${email}?subject=New Lead Registration: ${getVal(property, "property_name")}`;
                } else {
                    let link = regLink.trim();
                    if (!link.startsWith('http')) link = `https://${link}`;
                    window.open(link, '_blank');
                }
            };

            const shareViaWhatsApp = (type, link) => {
                if (!link || link.trim() === '') return alert(`${type} is not available for this property.`);
                let finalLink = link;
                if (type === 'Images/Gallery' && link.includes(',')) { finalLink = link.split(',').join('\n'); }
                const text = `Hello! Here is the ${type} for *${getVal(property, "Property Name")}*:\n\n${finalLink}`;
                window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
            };

            const pocNumber = getVal(property, "point_of_contact")?.replace(/\D/g,'') || WHATSAPP_NUMBER;

            return (
                <div className="min-h-screen bg-slate-50 animate-fadeIn pb-24 md:pb-0">
                    <div className="bg-white border-b border-slate-200 sticky top-0 z-40 px-4 md:px-8 py-4 flex justify-between items-center shadow-sm">
                        <button onClick={onBack} className="text-slate-600 hover:text-blue-600 text-xs font-black uppercase tracking-widest flex items-center transition group">
                            <span className="mr-2 text-lg leading-none group-hover:-translate-x-1 transition-transform">←</span> Back to Search
                        </button>
                        <div className="hidden md:flex items-center gap-4">
                            <div className="text-[10px] font-black uppercase tracking-widest text-slate-400 border-r border-slate-200 pr-4">
                                {getVal(property, "Location")} • {getVal(property, "Builder Name")}
                            </div>
                            <a href={`tel:${pocNumber}`} className="bg-slate-100 text-slate-700 px-4 py-2 rounded-full font-black uppercase tracking-widest text-[9px] hover:bg-blue-600 hover:text-white transition shadow-sm border border-slate-200">
                                📞 Call Agent
                            </a>
                        </div>
                    </div>

                    <div className="max-w-7xl mx-auto w-full p-4 md:p-8">
                        <div className="relative mb-8">
                            <div ref={galleryRef} className="flex overflow-x-auto snap-x snap-mandatory gap-4 pb-4 hide-scroll h-[40vh] md:h-[60vh] rounded-3xl">
                                {imgs.length > 0 ? imgs.map((img, i) => (
                                    <div key={i} className="min-w-full md:min-w-[80%] h-full shrink-0 snap-center relative rounded-3xl overflow-hidden bg-slate-200 border border-slate-100">
                                        <img src={img} className="w-full h-full object-cover" />
                                        {i === 0 && (
                                            <div className="absolute inset-0 bg-gradient-to-t from-slate-900/80 via-transparent to-transparent flex flex-col justify-end p-6 md:p-10">
                                                <div className="text-[10px] font-black uppercase tracking-widest text-blue-400 mb-1">{getVal(property, "Property Type") || 'Apartment'}</div>
                                                <h1 className="text-3xl md:text-5xl font-black uppercase tracking-tighter leading-none text-white mb-2">{getVal(property, "Property Name")}</h1>
                                                <p className="text-white/80 font-medium text-sm md:text-base">📍 {getVal(property, "Location")}</p>
                                            </div>
                                        )}
                                    </div>
                                )) : (
                                    <div className="w-full h-full bg-slate-200 rounded-3xl flex flex-col items-center justify-center text-slate-400">
                                        <h1 className="text-3xl md:text-5xl font-black uppercase tracking-tighter leading-none text-slate-500 mb-2">{getVal(property, "Property Name")}</h1>
                                        <p className="text-sm font-bold uppercase tracking-widest">Images Coming Soon</p>
                                    </div>
                                )}
                            </div>
                        </div>

                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-8 md:gap-12">
                            <div className="lg:col-span-2 space-y-10">
                                <div className="bg-white p-6 md:p-8 rounded-3xl border border-slate-200 shadow-sm grid grid-cols-2 md:grid-cols-4 gap-6 relative">
                                    <div><div className="text-[10px] font-black uppercase text-slate-400 tracking-widest mb-1">Configurations</div><div className="text-sm md:text-lg font-black text-slate-900 mt-1">{getVal(property, "bhk") || getVal(property, "No of BHK's")} BHK</div></div>
                                    <div><div className="text-[10px] font-black uppercase text-slate-400 tracking-widest mb-1">Status</div><div className="text-sm md:text-base font-black text-slate-900 mt-1">{getVal(property, "Construction Status") || getVal(property, "construction_status") || 'N/A'}</div></div>
                                    <div><div className="text-[10px] font-black uppercase text-slate-400 tracking-widest mb-1">Possession</div><div className="text-sm md:text-base font-black text-slate-900 mt-1">{getVal(property, "Possession Date") ? new Date(getVal(property, "Possession Date")).toLocaleDateString('en-IN', {month: 'short', year: 'numeric'}) : 'On Request'}</div></div>
                                    <div><div className="text-[10px] font-black uppercase text-slate-400 tracking-widest mb-1">RERA Status</div><div className="text-sm md:text-base font-black text-green-600 mt-1">Verified ✓</div></div>
                                </div>

                                <div>
                                    <h2 className="text-xl md:text-2xl font-black uppercase tracking-wide text-slate-900 mb-4 border-b border-slate-200 pb-2">About The Project</h2>
                                    <p className="text-slate-600 text-sm md:text-base leading-relaxed whitespace-pre-wrap">
                                        {getVal(property, "description") || `Experience unparalleled luxury and comfort at ${getVal(property, "Property Name")}. Located in the prime neighborhood of ${getVal(property, "Location")}, this project by ${getVal(property, "Builder Name")} offers meticulously designed ${getVal(property, "bhk") || "premium"} homes.`}
                                    </p>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                    {projectUsps && (
                                        <div className="bg-blue-50 p-6 md:p-8 rounded-3xl border border-blue-100">
                                            <h3 className="text-sm font-black uppercase tracking-widest text-blue-900 mb-6">Key Highlights</h3>
                                            <ul className="space-y-4">
                                                {String(projectUsps).split('\n').filter(u => u.trim() !== "").map((u, i) => (
                                                    <li key={i} className="flex items-start text-xs md:text-sm text-blue-800 font-medium leading-relaxed"><span className="mr-3 text-blue-500 mt-0.5">✦</span> {u.trim()}</li>
                                                ))}
                                            </ul>
                                        </div>
                                    )}
                                    {getVal(property, "Amenities") && (
                                        <div className="bg-slate-900 p-6 md:p-8 rounded-3xl border border-slate-800">
                                            <h3 className="text-sm font-black uppercase tracking-widest text-white mb-6">World-Class Amenities</h3>
                                            <ul className="space-y-4">
                                                {String(getVal(property, "Amenities")).split(',').filter(u => u.trim() !== "").map((u, i) => (
                                                    <li key={i} className="flex items-start text-xs md:text-sm text-slate-300 font-medium leading-relaxed"><span className="mr-3 text-blue-400 mt-0.5">✓</span> {u.trim()}</li>
                                                ))}
                                            </ul>
                                        </div>
                                    )}
                                </div>
                            </div>

                            <div className="lg:col-span-1">
                                <div className="sticky top-24 space-y-6">
                                    <div className="bg-white p-6 md:p-8 rounded-3xl border border-slate-200 shadow-[0_4px_20px_-4px_rgba(0,0,0,0.1)]">
                                        <div className="mb-6 pb-6 border-b border-slate-100">
                                            <div className="text-[10px] font-black uppercase text-slate-400 tracking-widest mb-1">Starting Price</div>
                                            <div className="text-3xl md:text-4xl font-black text-slate-900 tracking-tighter">{getVal(property, "Price") || 'On Request'}</div>
                                        </div>
                                        
                                        <div className="bg-[#fffbeb] border border-[#fde68a] p-4 rounded-2xl text-[#92400e] mb-4">
                                            <h4 className="text-[9px] font-black uppercase tracking-widest mb-1 opacity-80">Commission</h4>
                                            <p className="text-2xl font-black">{formatPercent(getVal(property, "commission") || getVal(property, "commision_deta") || getVal(property, "commission_details"))}</p>
                                        </div>

                                        <div className="bg-[#f0f9ff] border border-[#bae6fd] p-4 rounded-2xl text-[#0369a1] mb-6">
                                            <h4 className="text-[9px] font-black uppercase tracking-widest mb-1 opacity-80">Internal Info</h4>
                                            <p className="text-[10px] font-bold mb-1">POC: {getVal(property, "point_of_contact") || "N/A"}</p>
                                            <p className="text-[10px] font-bold">Avail: {getVal(property, "availability") || "N/A"}</p>
                                        </div>

                                        <div className="bg-slate-900 text-white p-5 rounded-2xl">
                                            <h4 className="text-[9px] font-black uppercase tracking-widest text-blue-400 mb-3 border-b border-slate-700 pb-2">Admin Tools</h4>
                                            
                                            <div className="space-y-2 mb-5">
                                                <button onClick={() => openLink(getVal(property, "website_link"))} className="w-full bg-slate-800 hover:bg-slate-700 text-white font-black py-2.5 rounded-xl uppercase tracking-widest transition-colors text-[9px] border border-slate-700">
                                                    🌐 Builder Website
                                                </button>
                                                <button onClick={handleRegisterLead} className="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-2.5 rounded-xl uppercase tracking-widest transition-colors shadow-md text-[9px]">
                                                    {regText}
                                                </button>
                                            </div>

                                            <h4 className="text-[8px] font-bold uppercase tracking-widest text-slate-400 mb-2">Share With Client (WhatsApp)</h4>
                                            <div className="grid grid-cols-2 gap-2">
                                                <button onClick={() => shareViaWhatsApp('Brochure', getVal(property, "brochure"))} className="bg-slate-800 hover:bg-slate-700 font-bold py-2 rounded-lg text-[9px] uppercase tracking-wider text-slate-200 transition">📥 Brochure</button>
                                                <button onClick={() => shareViaWhatsApp('Cost Sheet', getVal(property, "cost_sheet"))} className="bg-slate-800 hover:bg-slate-700 font-bold py-2 rounded-lg text-[9px] uppercase tracking-wider text-slate-200 transition">📄 Cost Sheet</button>
                                                <button onClick={() => shareViaWhatsApp('Location Map', getVal(property, "map_link"))} className="bg-slate-800 hover:bg-slate-700 font-bold py-2 rounded-lg text-[9px] uppercase tracking-wider text-slate-200 transition">📍 Location</button>
                                                <button onClick={() => shareViaWhatsApp('Property Video', getVal(property, "video_link"))} className="bg-slate-800 hover:bg-slate-700 font-bold py-2 rounded-lg text-[9px] uppercase tracking-wider text-slate-200 transition">🎥 Video</button>
                                                <button onClick={handlePreviewImages} className="col-span-2 bg-slate-800 hover:bg-slate-700 font-bold py-2.5 rounded-lg text-[9px] uppercase tracking-wider text-slate-200 transition border border-slate-600">🖼️ Preview Images (Drive)</button>
                                            </div>
                                        </div>
                                    </div>
                                    <EMICalculator propertyPriceStr={getVal(property, "Price")} />
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // URL ROUTER LOGIC
        const getInitialRoute = () => {
            const hash = window.location.hash.replace('#', '');
            if (hash.startsWith('/library')) return { v: 'library', c: 'website' };
            if (hash.startsWith('/add')) return { v: 'add', c: 'website' };
            if (hash.startsWith('/crm/bulk')) return { v: 'dashboard', c: 'bulk' };
            if (hash.startsWith('/crm/manual')) return { v: 'dashboard', c: 'manual' };
            return { v: 'dashboard', c: 'website' };
        };

        function AdminApp() {
            const initRoute = getInitialRoute();
            const [session, setSession] = useState(null);
            const [authChecking, setAuthChecking] = useState(true);
            const [leads, setLeads] = useState([]);
            const [properties, setProperties] = useState([]);
            
            // View and Category states tied to Router
            const [view, setView] = useState(initRoute.v); 
            const [leadCategory, setLeadCategory] = useState(initRoute.c); 
            
            const [loading, setLoading] = useState(true);
            const [showManualModal, setShowManualModal] = useState(false);
            const [filterType, setFilterType] = useState('ALL'); 
            const [summaryAgent, setSummaryAgent] = useState('All');
            const [selectedProp, setSelectedProp] = useState(null);
            const [visibleCount, setVisibleCount] = useState(50);
            const [searchTerm, setSearchTerm] = useState("");

            const getCardTint = (status) => {
                switch(status) {
                    case 'Un called': return 'bg-yellow-50';
                    case 'Called': return 'bg-green-50';
                    case 'RNR': return 'bg-orange-50';
                    case 'Details Shared': return 'bg-purple-50';
                    case 'SV Scheduled': return 'bg-blue-50';
                    case 'Converted': return 'bg-emerald-50';
                    case 'Rejected': return 'bg-red-50';
                    default: return 'bg-white';
                }
            };

            // Router Event Listener
            useEffect(() => {
                const onHashChange = () => {
                    const r = getInitialRoute();
                    setView(r.v);
                    setLeadCategory(r.c);
                };
                window.addEventListener('hashchange', onHashChange);
                return () => window.removeEventListener('hashchange', onHashChange);
            }, []);

            // Navigation Function
            const handleNavigate = (newView, newCat = 'website') => {
                setView(newView);
                if (newView === 'dashboard') setLeadCategory(newCat);
                
                let path = '';
                if (newView === 'dashboard') path = `/crm/${newCat}`;
                else if (newView === 'library') path = `/library`;
                else if (newView === 'add') path = `/add`;
                
                window.location.hash = path;
            };

            useEffect(() => {
                setVisibleCount(50);
            }, [leadCategory, filterType, summaryAgent, searchTerm]);

            // AUTH SETUP
            useEffect(() => {
                supabase.auth.getSession().then(({ data: { session } }) => { 
                    setSession(session); 
                    setAuthChecking(false);
                });
                const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => { 
                    setSession(session); 
                });
                return () => subscription.unsubscribe();
            }, []);

            // DATA FETCHING (Tied securely to current tab state)
            useEffect(() => {
                if (session) {
                    fetchProperties();
                    if (view === 'dashboard') fetchLeads();
                }
            }, [session, view, leadCategory]);

            async function fetchLeads() {
                setLoading(true);
                const table = leadCategory === 'bulk' ? 'bulk_leads' : 'leads';
                const { data, error } = await supabase.from(table).select('*').order('created_at', { ascending: false });
                if (!error) {
                    let raw = data || [];
                    if (table === 'leads') {
                        if (leadCategory === 'website') {
                            setLeads(raw.filter(l => !l.lead_source || l.lead_source.trim() === '' || l.lead_source.toLowerCase().includes('website')));
                        } else if (leadCategory === 'manual') {
                            setLeads(raw.filter(l => l.lead_source && l.lead_source.trim() !== '' && !l.lead_source.toLowerCase().includes('website')));
                        }
                    } else { 
                        // This is for Bulk Leads specifically
                        const bulkData = raw.map(l => ({
                            ...l,
                            // If it's the bulk tab, we use the text exactly as it is in Supabase
                            display_date: l.created_at || 'N/A'
                        }));
                        setLeads(bulkData); 
                    }
                }
                setLoading(false);
            }

            async function fetchProperties() {
                const { data } = await supabase.from('properties').select('*').order('created_at', { ascending: false });
                setProperties(data || []);
            }

            async function updateLead(lead, field, value) {
                if (field === 'lead_status') {
                    if (!lead.psa_agent_name || lead.psa_agent_name.trim() === '') {
                        alert("ERROR: You must assign a PSA Agent (Tharun or Shivaji or Ramswami) before changing the lead status.");
                        fetchLeads(); 
                        return;
                    }
                }

                let updates = {};
                const stamp = new Date().toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute:'2-digit' });

                if (field === 'lead_status') {
                    updates.lead_status = value;
                    updates.call_remark = `[${stamp}] Status Changed: ${value}\n\n${lead.call_remark || ''}`;
                } else if (field === 'follow_up_at') {
                    updates.follow_up_at = value;
                    updates.call_remark = `[${stamp}] Callback Set: ${new Date(value).toLocaleString('en-IN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'})}\n\n${lead.call_remark || ''}`;
                } else if (field === 'site_visit_at') {
                    updates.site_visit_at = value;
                    updates.call_remark = `[${stamp}] SV Booked: ${value}\n\n${lead.call_remark || ''}`;
                } else if (field === 'add_note') {
                    if (!value.trim()) return;
                    updates.add_note = value; 
                    updates.call_remark = `[${stamp}] Manual Note: ${value}\n\n${lead.call_remark || ''}`; 
                } else if (field === 'reject_reason') {
                    updates.reject_reason = value;
                    updates.call_remark = `[${stamp}] Rejected Reason: ${value}\n\n${lead.call_remark || ''}`;
                } else {
                    updates[field] = value;
                }

                const table = leadCategory === 'bulk' ? 'bulk_leads' : 'leads';
                setLeads(prev => prev.map(l => l.id === lead.id ? {...l, ...updates} : l));

                const { error } = await supabase.from(table).update(updates).eq('id', lead.id);
                if (error) {
                    if (error.message.includes('add_note')) alert("ERROR: Please create an 'add_note' text column in your Supabase 'leads' table to save manual remarks.");
                    else if (error.message.includes('reject_reason')) alert("ERROR: Please create a 'reject_reason' text column in your Supabase 'leads' table.");
                    else alert("Error saving update: " + error.message);
                    fetchLeads(); 
                }
            }

            const displayedLeads = useMemo(() => {
                let filtered = leads;
                const todayStr = new Date().toISOString().split('T')[0];
                
                if (filterType === 'TODAY_CB') {
                    filtered = leads.filter(l => l.follow_up_at && l.follow_up_at.startsWith(todayStr) && !['Rejected', 'Converted'].includes(l.lead_status));
                } else if (filterType === 'TODAY_SV') {
                    filtered = leads.filter(l => l.site_visit_at && l.site_visit_at === todayStr && !['Rejected', 'Converted'].includes(l.lead_status));
                } else if (filterType === 'MISSED_CB') {
                    filtered = leads.filter(l => l.follow_up_at && l.follow_up_at < todayStr && !['Rejected', 'Converted'].includes(l.lead_status));
                } else if (filterType === 'MISSED_SV') {
                    filtered = leads.filter(l => l.site_visit_at && l.site_visit_at < todayStr && !['Rejected', 'Converted'].includes(l.lead_status));
                } else if (filterType.startsWith('STATUS_')) {
                    const statusTarget = filterType.replace('STATUS_', '');
                    filtered = leads.filter(l => (l.lead_status || 'Un called') === statusTarget);
                }

                if (searchTerm.trim() !== '') {
                    const term = searchTerm.toLowerCase();
                    filtered = filtered.filter(l => 
                        (l.customer_name && l.customer_name.toLowerCase().includes(term)) ||
                        (l.phone_number && l.phone_number.toLowerCase().includes(term)) ||
                        (l.project_interested_in && l.project_interested_in.toLowerCase().includes(term))
                    );
                }
                
                return filtered;
            }, [leads, filterType, searchTerm]);

            const visibleLeads = displayedLeads.slice(0, visibleCount);

            const stats = useMemo(() => {
                let targetLeads = leads;
                if (summaryAgent !== 'All') {
                    targetLeads = leads.filter(l => l.psa_agent_name === summaryAgent);
                }
                const total = targetLeads.length;
                const uncalled = targetLeads.filter(l => l.lead_status === 'Un called' || !l.lead_status).length;
                const called = targetLeads.filter(l => l.lead_status && l.lead_status !== 'Un called' && l.lead_status !== 'Rejected').length;
                const rejected = targetLeads.filter(l => l.lead_status === 'Rejected').length;
                return { total, uncalled, called, rejected };
            }, [leads, summaryAgent]);

            if (authChecking) {
                return (
                    <div className="min-h-screen bg-slate-950 flex flex-col items-center justify-center">
                        <div className="text-3xl font-black italic text-white uppercase tracking-widest animate-pulse mb-4">Horizon CRM</div>
                        <div className="text-blue-500 text-xs font-bold uppercase tracking-widest">Verifying Access...</div>
                    </div>
                );
            }

            if (!session) return <LoginForm supabase={supabase} />;
            if (selectedProp) return <PropertyDetailsPage property={selectedProp} onBack={() => setSelectedProp(null)} />;

            return (
                <div className="min-h-screen flex flex-col animate-fadeIn">
                    <nav className="bg-slate-900 text-white p-4 flex justify-between items-center sticky top-0 z-50 shadow-md">
                        <h1 className="font-black tracking-tighter text-xl uppercase italic">Horizon <span className="text-blue-500">CRM</span></h1>
                        <div className="flex gap-4 md:gap-6 text-[10px] md:text-[11px] font-bold uppercase tracking-widest items-center">
                            <button onClick={() => handleNavigate('dashboard', leadCategory)} className={view === 'dashboard' ? 'text-blue-400' : 'hover:text-slate-300 transition'}>CRM</button>
                            <button onClick={() => handleNavigate('library')} className={view === 'library' ? 'text-blue-400' : 'hover:text-slate-300 transition'}>Library</button>
                            <button onClick={() => handleNavigate('add')} className={view === 'add' ? 'text-blue-400' : 'hover:text-slate-300 transition'}>+ Project</button>
                            <button onClick={() => supabase.auth.signOut()} className="text-red-400 border border-red-900 px-3 py-1.5 rounded hover:bg-red-900/50 transition font-bold uppercase">Logout</button>
                        </div>
                    </nav>

                    <main className="p-3 md:p-8 max-w-7xl mx-auto w-full">
                        {view === 'dashboard' && (
                            <div className="space-y-6">
                                
                                {/* IMPROVED RESPONSIVE STATS BAR */}
                                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-4">
                                    <div className="flex flex-wrap justify-between md:grid md:grid-cols-5 gap-4 items-center">
                                        <div className="w-full md:w-auto border-b md:border-none pb-2 md:pb-0">
                                            <select className="bg-transparent outline-none cursor-pointer text-slate-700 text-[10px] font-black uppercase w-full md:w-auto" value={summaryAgent} onChange={e => setSummaryAgent(e.target.value)}>
                                                <option value="All">Total (All Agents)</option>
                                                <option value="Tharun">Tharun</option>
                                                <option value="Shivaji">Shivaji</option>
                                                <option value="Ramswami">Ramswami</option>
                                            </select>
                                        </div>
                                        <div className="flex flex-col items-center flex-1"><span className="text-[9px] uppercase font-black text-slate-400">Total</span><span className="font-bold text-slate-700 text-lg">{stats.total}</span></div>
                                        <div className="flex flex-col items-center flex-1"><span className="text-[9px] uppercase font-black text-green-600">Uncalled</span><span className="font-bold text-green-600 text-lg">{stats.uncalled}</span></div>
                                        <div className="flex flex-col items-center flex-1"><span className="text-[9px] uppercase font-black text-blue-600">Working</span><span className="font-bold text-blue-600 text-lg">{stats.called}</span></div>
                                        <div className="flex flex-col items-center flex-1"><span className="text-[9px] uppercase font-black text-red-600">Rejected</span><span className="font-bold text-red-600 text-lg">{stats.rejected}</span></div>
                                    </div>
                                </div>

                                <div className="flex flex-col md:flex-row justify-between items-center gap-4 border-b pb-4">
                                    <div className="flex gap-4">
                                        {['website', 'bulk', 'manual'].map(c => (
                                            <button key={c} onClick={() => { handleNavigate('dashboard', c); setVisibleCount(50); }} className={`pb-2 text-[10px] font-black uppercase tracking-widest border-b-2 transition-all ${leadCategory === c ? 'border-blue-500 text-blue-600' : 'border-transparent text-slate-500 hover:text-slate-800'}`}>{c}</button>
                                        ))}
                                    </div>
                                    <div className="flex gap-3 items-center w-full md:w-auto">
                                        <select 
                                            value={filterType} 
                                            onChange={(e) => setFilterType(e.target.value)} 
                                            className="px-4 py-2 rounded-full text-[9px] font-black uppercase border bg-white text-slate-600 shadow-sm outline-none focus:ring-2 focus:ring-blue-500 w-full md:w-auto"
                                        >
                                            <option value="ALL">All Leads</option>
                                            <optgroup label="Schedule Filters">
                                                <option value="TODAY_CB">📅 Today's Callbacks</option>
                                                <option value="TODAY_SV">📅 Today's Site Visits</option>
                                                <option value="MISSED_CB">⚠️ Missed Callbacks</option>
                                                <option value="MISSED_SV">⚠️ Missed Site Visits</option>
                                            </optgroup>
                                            <optgroup label="Status Filters">
                                                <option value="STATUS_Un called">Un called</option>
                                                <option value="STATUS_Called">Called</option>
                                                <option value="STATUS_RNR">RNR</option>
                                                <option value="STATUS_Details Shared">Details Shared</option>
                                                <option value="STATUS_SV Scheduled">SV Scheduled</option>
                                                <option value="STATUS_Converted">Converted</option>
                                                <option value="STATUS_Rejected">Rejected</option>
                                            </optgroup>
                                        </select>
                                        <button onClick={() => setShowManualModal(true)} className="bg-blue-600 text-white px-4 py-2 rounded-full text-[9px] font-black uppercase shadow-sm shrink-0">+ Manual Lead</button>
                                    </div>
                                </div>

                                <div className="mb-4 relative">
                                    <input 
                                        type="text" 
                                        placeholder="Search Name, Phone or Project..." 
                                        className="w-full p-4 pl-12 bg-white border border-slate-200 rounded-2xl text-xs font-bold shadow-sm outline-none focus:ring-2 focus:ring-blue-500 transition-all"
                                        value={searchTerm}
                                        onChange={(e) => setSearchTerm(e.target.value)}
                                    />
                                    <span className="absolute left-4 top-4 opacity-50 text-lg">🔍</span>
                                    {searchTerm && (
                                        <button 
                                            onClick={() => setSearchTerm("")}
                                            className="absolute right-4 top-4 text-[10px] font-black text-slate-400 hover:text-red-500 uppercase bg-slate-100 px-3 py-1 rounded-lg transition"
                                        >
                                            Clear
                                        </button>
                                    )}
                                </div>

                                <div className="hidden lg:block bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                                    <table className="w-full text-left text-xs">
                                        <thead className="bg-slate-50 text-slate-400 font-black uppercase text-[9px] tracking-widest border-b">
                                            <tr><th className="p-4">Customer</th><th className="p-4">Status & Agent</th><th className="p-4">Scheduling</th><th className="p-4 min-w-[250px]">Activity & Notes</th></tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100">
                                            {visibleLeads.map(l => (
                                                <tr key={l.id} className={`transition-colors border-l-4 hover:brightness-95 ${l.lead_priority === 'Hot' ? 'border-l-red-500' : l.lead_priority === 'Cold' ? 'border-l-blue-400' : 'border-l-amber-400'} ${getCardTint(l.lead_status)}`}>
                                                    <td className="p-4 uppercase font-bold min-w-[180px]">
                                                        {l.customer_name}
                                                        <div className="text-blue-600 mt-1">{l.phone_number}</div>
                                                        <div className="text-slate-400 text-[10px] mt-1 lowercase truncate font-medium">{l.customer_email || ''}</div>
                                                        
                                                        {l.created_at && (
                                                            <div className="text-[8px] text-slate-400 font-bold mt-2 tracking-widest uppercase">
                                                                Logged: {leadCategory === 'bulk' ? l.created_at : l.display_date}
                                                            </div>
                                                        )}
                                                        
                                                        <div className="text-[8px] text-slate-500 font-bold mt-1 tracking-widest uppercase truncate max-w-[150px]">
                                                            Inq: {leadCategory === 'bulk' && session?.user?.email !== 'saishetty1623@gmail.com' 
                                                                ? '[Restricted]' 
                                                                : (l.project_interested_in || 'General')}
                                                        </div>

                                                        <div className="mt-3 flex gap-2">
                                                            <a href={`https://wa.me/91${l.phone_number?.replace(/\D/g,'').slice(-10)}`} target="_blank" className="bg-green-500 text-white text-[8px] font-black px-3 py-1.5 rounded uppercase tracking-widest shadow-sm hover:scale-105 transition">WhatsApp 💬</a>
                                                        </div>
                                                    </td>
                                                    <td className="p-4 min-w-[140px]">
                                                        <select onChange={(e) => updateLead(l, 'psa_agent_name', e.target.value)} value={l.psa_agent_name || ''} className="w-full p-2 mb-2 border rounded-lg font-bold uppercase text-[9px] outline-none bg-slate-50 border-slate-300 text-blue-800">
                                                            <option value="" disabled>Assign Agent</option>
                                                            <option value="Tharun">Tharun</option>
                                                            <option value="Shivaji">Shivaji</option>
                                                            <option value="Ramswami">Ramswami</option>
                                                        </select>
                                                        <select onChange={(e) => updateLead(l, 'lead_status', e.target.value)} value={l.lead_status || ''} className={`w-full p-2 mb-2 border rounded-lg font-bold uppercase text-[9px] outline-none border-2 ${getStatusStyles(l.lead_status)}`}>
                                                            {(!l.lead_status || l.lead_status === 'Un called') && <option value="Un called">Un called</option>}
                                                            <option value="Called">Called</option><option value="RNR">RNR</option><option value="Details Shared">Details Shared</option><option value="SV Scheduled">SV Scheduled</option><option value="Converted">Converted</option><option value="Rejected">Rejected</option>
                                                        </select>
                                                        
                                                        {l.lead_status === 'Rejected' && (
                                                            <select onChange={(e) => updateLead(l, 'reject_reason', e.target.value)} value={l.reject_reason || ''} className="w-full p-2 mb-2 border border-red-300 rounded-lg font-bold uppercase text-[9px] outline-none bg-red-50 text-red-800">
                                                                <option value="" disabled>Select Reason</option>
                                                                <option value="Not Interested">Not Interested</option>
                                                                <option value="No Response">No Response</option>
                                                                <option value="Wrong Number">Wrong Number</option>
                                                                <option value="No Incoming Call">No Incoming Call</option>
                                                            </select>
                                                        )}

                                                        <select onChange={(e) => updateLead(l, 'lead_priority', e.target.value)} value={l.lead_priority || 'Warm'} className={`w-full p-2 border rounded-lg font-bold uppercase text-[9px] outline-none border-2 ${getPriorityColor(l.lead_priority)}`}>
                                                            <option value="Hot">Hot</option><option value="Warm">Warm</option><option value="Cold">Cold</option>
                                                        </select>
                                                    </td>
                                                    <td className="p-4 min-w-[160px]">
                                                        <div className="space-y-3">
                                                            {['Called', 'RNR', 'Details Shared'].includes(l.lead_status) && (
                                                                <div>
                                                                    <span className="text-[8px] font-black text-blue-600 uppercase tracking-widest block mb-1">Call Back Date</span>
                                                                    <input type="datetime-local" className="w-full p-2 border border-blue-200 bg-blue-50 rounded-lg text-[10px] font-bold text-slate-700 outline-none" value={l.follow_up_at?.slice(0,16) || ''} onChange={(e) => updateLead(l, 'follow_up_at', e.target.value)} />
                                                                </div>
                                                            )}
                                                            {l.lead_status === 'SV Scheduled' && (
                                                                <div className="mt-2 pt-2 border-t border-slate-100">
                                                                    <span className="text-[8px] font-black text-teal-600 uppercase tracking-widest block mb-1">Site Visit Date</span>
                                                                    <input type="date" className="w-full p-2 border border-teal-200 bg-teal-50 rounded-lg text-[10px] font-bold text-slate-700 outline-none" value={l.site_visit_at || ''} onChange={(e) => updateLead(l, 'site_visit_at', e.target.value)} />
                                                                </div>
                                                            )}
                                                        </div>
                                                    </td>
                                                    <td className="p-4">
                                                        <div className="flex flex-col gap-2">
                                                            <div className="h-16 overflow-y-auto bg-slate-50 p-2 rounded-lg history-scroll whitespace-pre-wrap border border-slate-100 leading-relaxed font-medium text-slate-400 mb-1">
                                                                {l.call_remark || <span className="italic">System logs...</span>}
                                                            </div>
                                                            <div className="flex gap-2">
                                                                <textarea id={`note-d-${l.id}`} defaultValue={l.add_note || ''} rows="2" placeholder="Manual notes / requirements..." className="flex-1 p-2 border border-slate-200 rounded-lg text-[10px] outline-none focus:ring-1 focus:ring-blue-500 shadow-sm resize-none" />
                                                                <button onClick={() => { const el = document.getElementById(`note-d-${l.id}`); updateLead(l, 'add_note', el.value); }} className="bg-slate-900 text-white px-3 rounded-lg text-[9px] font-black uppercase tracking-widest hover:bg-blue-600 transition">Save</button>
                                                            </div>
                                                        </div>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                    {visibleCount < displayedLeads.length && (
                                        <div className="p-4 border-t border-slate-100 bg-slate-50 flex justify-center">
                                            <button onClick={() => setVisibleCount(v => v + 50)} className="bg-blue-100 hover:bg-blue-200 text-blue-800 px-6 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest transition shadow-sm">
                                                Load More Leads ({displayedLeads.length - visibleCount} hidden)
                                            </button>
                                        </div>
                                    )}
                                </div>

                                <div className="lg:hidden space-y-4">
                                    {visibleLeads.map(l => (
                                        <div key={`m-${l.id}`} className={`p-4 rounded-2xl shadow-sm border border-t-8 transition-colors ${l.lead_priority === 'Hot' ? 'border-t-red-500' : l.lead_priority === 'Cold' ? 'border-t-blue-400' : 'border-t-amber-400'} ${getCardTint(l.lead_status)}`}>
                                            <div className="flex justify-between items-start">
                                                <div>
                                                    <h3 className="font-black text-sm uppercase">{l.customer_name}</h3>
                                                    <p className="font-bold text-blue-600">{l.phone_number}</p>
                                                    <p className="font-bold text-slate-400 text-[10px] truncate mt-1">{l.customer_email}</p>
                                                    
                                                    <p className="text-[10px] text-slate-500 font-bold mt-1 tracking-widest uppercase">
                                                        Inq: {leadCategory === 'bulk' && session?.user?.email !== 'saishetty1623@gmail.com' 
                                                            ? '[Restricted]'

        function ProjectLibrary({ properties, setProp, supabase, setProperties }) {
            const getVal = (obj, searchKey) => {
                if (!obj) return "";
                if (obj[searchKey] !== undefined && obj[searchKey] !== "") return obj[searchKey];
                const cleanKey = searchKey.replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
                for (let k in obj) { if (k.replace(/[^a-zA-Z0-9]/g, '').toLowerCase() === cleanKey) return obj[k]; }
                return "";
            };

            const convertDriveLink = (url) => {
                if (!url || typeof url !== 'string') return url;
                let idMatch = url.match(/\/d\/(.*?)\//) || url.match(/id=(.*?)(&|$)/);
                return idMatch ? `https://drive.google.com/thumbnail?id=${idMatch[1]}&sz=w1000` : url;
            };

            const fixImageUrl = (u) => u ? convertDriveLink(String(u).split(',')[0].trim()) : 'https://via.placeholder.com/600x300?text=No+Image';

            const toggleLive = async (e, p) => {
                e.stopPropagation(); // Prevents opening the property details card
                const currentStatus = p.is_live !== false; // Assume true if undefined
                const newStatus = !currentStatus;

                // Optimistic UI update
                if (setProperties) setProperties(prev => prev.map(item => item.id === p.id ? { ...item, is_live: newStatus } : item));

                // Backend update
                const { error } = await supabase.from('properties').update({ is_live: newStatus }).eq('id', p.id);
                if (error) {
                    alert("Failed to toggle live status. Ensure you have created an 'is_live' boolean column in your 'properties' table in Supabase.");
                    // Revert UI on error
                    if (setProperties) setProperties(prev => prev.map(item => item.id === p.id ? { ...item, is_live: currentStatus } : item));
                }
            };

            if (!properties || properties.length === 0) return <div className="text-center py-20 font-black text-slate-400 tracking-widest uppercase animate-pulse">Library Empty...</div>;

            return (
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 animate-fadeIn">
                    {properties.map(p => (
                        <div key={p.id} onClick={() => setProp(p)} className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden cursor-pointer hover:shadow-lg hover:-translate-y-1 transition group flex flex-col relative">
                            <div className="relative h-48 bg-slate-100 overflow-hidden">
                                <img src={fixImageUrl(getVal(p, "cover_image") || getVal(p, "cover-image"))} className="w-full h-full object-cover group-hover:scale-105 transition duration-500" />
                                <div className="absolute top-4 left-0 bg-slate-900/90 backdrop-blur-sm text-white text-[10px] font-black px-3 py-1.5 rounded-r-lg uppercase tracking-widest shadow-md">
                                    {getVal(p, "property_type") || 'Property'}
                                </div>
                                <button 
                                    onClick={(e) => toggleLive(e, p)} 
                                    className={`absolute top-4 right-0 text-[10px] font-black px-3 py-1.5 rounded-l-lg uppercase tracking-widest shadow-md transition z-10 ${p.is_live !== false ? 'bg-green-500 text-white hover:bg-green-600' : 'bg-red-500 text-white hover:bg-red-600'}`}
                                >
                                    {p.is_live !== false ? '🟢 Live' : '🔴 Hidden'}
                                </button>
                            </div>
                            <div className="p-5 flex-grow flex flex-col">
                                <h3 className="text-xl font-black uppercase tracking-tighter text-slate-900 leading-tight truncate">{getVal(p, "property_name")}</h3>
                                <p className="text-slate-500 text-xs font-bold mt-1 truncate">📍 {getVal(p, "location")}</p>
                                <div className="mt-4 flex justify-between items-end pt-4 border-t border-slate-100">
                                    <div>
                                        <div className="text-[9px] text-gray-400 font-bold uppercase tracking-widest">Starting Price</div>
                                        <div className="text-lg font-black text-blue-900">{getVal(p, "price")}</div>
                                    </div>
                                    <button className="bg-slate-900 text-white text-[10px] font-bold px-4 py-2 rounded-lg hover:bg-blue-600 transition">Preview Details</button>
                                </div>
                            </div>
                        </div>
                    ))}
                </div>
            );
        }

        function PropertyForm({ supabase, scriptUrl }) {
            const [form, setForm] = useState({
                property_name: '', builder_name: '', property_region: '', property_type: '', location: '', price: '', bhk: '', 
                super_built_up_area: '', possession_date: '', construction_status: '', approval: '', total_units: '', availability: '',
                description: '', usp_details: '', amenities: '', point_of_contact: '', commission_details: '', video_link: '',
                website_link: '', lead_registration_link: '', map_link: '', cover_image: '', gallery_images: '', floor_plan: '', brochure: '', cost_sheet: '', miscellaneous: ''
            });
            const [loading, setLoading] = useState(false);
            const [uploadingField, setUploadingField] = useState(null);

            const upload = async (e, field, append = false) => {
                const files = e.target.files; if(!files || files.length === 0) return;
                setLoading(true); setUploadingField(field);
                
                const categoryMap = { 'cover_image': 'Cover Image', 'gallery_images': 'Gallery', 'brochure': 'Brochures', 'cost_sheet': 'Cost Sheets', 'floor_plan': 'Floor Plans', 'miscellaneous': 'Miscellaneous' };
                const category = categoryMap[field] || 'General';

                const CLOUD_NAME = "dzptjohkq";
                const UPLOAD_PRESET = "horizon_preset"; 

                let newUrls = [];
                for(let i=0; i<files.length; i++) {
                    const file = files[i];

                    // 1. Upload to Cloudinary for actual fast viewing in CRM
                    let cloudinaryUrl = null;
                    const formData = new FormData();
                    formData.append('file', file);
                    formData.append('upload_preset', UPLOAD_PRESET);
                    if (form.property_name) formData.append('folder', `Projects/${form.property_name}`);

                    try {
                        const cloudRes = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`, {
                            method: 'POST',
                            body: formData
                        });
                        const cloudData = await cloudRes.json();
                        if (cloudData.secure_url) {
                            cloudinaryUrl = cloudData.secure_url;
                        }
                    } catch (err) {
                        console.error("Cloudinary upload failed", err);
                    }

                    // 2. Background Backup to Google Drive (Fire and Forget)
                    const reader = new FileReader();
                    reader.readAsDataURL(file);
                    reader.onload = () => {
                        fetch(scriptUrl, { 
                            method: "POST", 
                            body: JSON.stringify({ base64: reader.result.split(',')[1], type: file.type, name: file.name, propertyName: form.property_name || 'Uploads', category: category }) 
                        }).catch(err => console.error("Drive backup failed", err));
                    };

                    // Pushing Cloudinary URL to state so CRM uses it instantly
                    if(cloudinaryUrl) newUrls.push(cloudinaryUrl);
                }
                
                if(newUrls.length > 0) {
                    const joined = newUrls.join(',');
                    if(append) setForm(f => ({ ...f, [field]: f[field] ? f[field] + ',' + joined : joined }));
                    else setForm(f => ({ ...f, [field]: joined }));
                }
                setLoading(false); setUploadingField(null);
            };

            const removeFile = (field, isArray = false, idx = null) => {
                if (isArray) {
                    const arr = form[field].split(',').filter(Boolean);
                    arr.splice(idx, 1);
                    setForm(f => ({ ...f, [field]: arr.join(',') }));
                } else {
                    setForm(f => ({ ...f, [field]: '' }));
                }
            };

            const save = async () => {
                if (!form.property_name || !form.price || !form.cover_image) {
                    alert("Please fill the mandatory fields: Property Name, Price, and Main Cover Image.");
                    return;
                }
                setLoading(true);
                const { error } = await supabase.from('properties').insert([form]);
                if (!error) {
                    alert("Listing Live!");
                    setForm({ property_name: '', builder_name: '', property_region: '', property_type: '', location: '', price: '', bhk: '', super_built_up_area: '', possession_date: '', construction_status: '', approval: '', total_units: '', availability: '', description: '', usp_details: '', amenities: '', point_of_contact: '', commission_details: '', video_link: '', website_link: '', lead_registration_link: '', map_link: '', cover_image: '', gallery_images: '', floor_plan: '', brochure: '', cost_sheet: '', miscellaneous: '' });
                } else alert(error.message);
                setLoading(false);
            };

            const FileTag = ({ field, name, isArray=false, idx=null }) => (
                <div className="flex justify-between items-center bg-blue-50 border border-blue-100 text-blue-700 p-2 rounded-lg mt-2 text-[10px] font-bold">
                    <span className="truncate max-w-[150px]">{name}</span>
                    <button onClick={() => removeFile(field, isArray, idx)} className="text-red-500 hover:text-red-700 px-2 text-xs">✕</button>
                </div>
            );

            return (
                <div className="bg-white p-6 md:p-10 rounded-3xl shadow-sm max-w-4xl mx-auto space-y-6 animate-fadeIn border border-slate-200">
                    <h2 className="text-2xl font-black uppercase italic border-b pb-4 text-blue-900">Master Property Form</h2>
                    
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <input className="p-4 bg-slate-50 border rounded-2xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500 border-blue-200" placeholder="Property Name *" value={form.property_name} onChange={e => setForm({...form, property_name: e.target.value})} />
                        <input className="p-4 bg-slate-50 border rounded-2xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500" placeholder="Builder Name" value={form.builder_name} onChange={e => setForm({...form, builder_name: e.target.value})} />
                        
                        <select className="p-4 bg-slate-50 border rounded-2xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500 text-slate-600" value={form.property_region} onChange={e => setForm({...form, property_region: e.target.value})}>
                            <option value="">Property Region</option><option>North</option><option>South</option><option>East</option><option>West</option>
                        </select>
                        <select className="p-4 bg-slate-50 border rounded-2xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500 text-slate-600" value={form.property_type} onChange={e => setForm({...form, property_type: e.target.value})}>
                            <option value="">Property Type</option><option>Apartment</option><option>Villa</option><option>Villament</option><option>Plot</option><option>Others</option>
                        </select>

                        <input className="p-4 bg-slate-50 border rounded-2xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500" placeholder="Location" value={form.location} onChange={e => setForm({...form, location: e.target.value})} />
                        <input className="p-4 bg-slate-50 border rounded-2xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500 border-blue-200" placeholder="Price (e.g. 1.2 Cr) *" value={form.price} onChange={e => setForm({...form, price: e.target.value})} />
                        
                        <div className="flex flex-col">
                            <select multiple className="p-4 bg-slate-50 border rounded-2xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500 text-slate-600 h-28" value={form.bhk ? form.bhk.split(',') : []} onChange={e => {
                                const options = [...e.target.selectedOptions];
                                const values = options.map(opt => opt.value);
                                setForm({...form, bhk: values.join(',')});
                            }}>
                                <option value="1 BHK">1 BHK</option>
                                <option value="2 BHK">2 BHK</option>
                                <option value="3 BHK">3 BHK</option>
                                <option value="4 BHK">4 BHK</option>
                                <option value="5+ BHK">5+ BHK</option>
                            </select>

                        </select>

                        <input className="p-4 bg-slate-50 border rounded-2xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500" placeholder="Approvals (e.g. BDA, RERA)" value={form.approval} onChange={e => setForm({...form, approval: e.target.value})} />
                        <input className="p-4 bg-slate-50 border rounded-2xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500" placeholder="Total Units" value={form.total_units} onChange={e => setForm({...form, total_units: e.target.value})} />
