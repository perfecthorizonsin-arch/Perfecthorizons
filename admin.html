<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizon CRM | Command Center</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .animate-fadeIn { animation: fadeIn 0.15s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .history-scroll::-webkit-scrollbar { width: 4px; }
        .history-scroll::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
        .toggle-active { background-color: #f59e0b; color: white; border-color: #f59e0b; }
        .ring-hot { border-left: 5px solid #ef4444 !important; }
        .ring-warm { border-left: 5px solid #f59e0b !important; }
        .ring-cold { border-left: 5px solid #3b82f6 !important; }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-900 pb-20 md:pb-0">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const supabaseUrl = 'https://uiiovtsktllvtecfokik.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVpaW92dHNrdGxsdnRlY2Zva2lrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM5NjkxMjMsImV4cCI6MjA4OTU0NTEyM30.fL6cU7YkH4-50w55GrnutoBhmH5sofe8-rOMZetmuvU';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey, { auth: { storage: window.sessionStorage } });
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxJOoh4meGBQOZYZpUWqK1DmDS_B8fXSC5NlwPcTX3GUfP7gzYQKvatgj9IFT3Txy-FCQ/exec";

        function AdminApp() {
            const [session, setSession] = useState(null);
            const [leads, setLeads] = useState([]);
            const [properties, setProperties] = useState([]);
            const [view, setView] = useState('dashboard'); 
            const [leadCategory, setLeadCategory] = useState('website'); 
            const [loading, setLoading] = useState(true);
            const [showManualModal, setShowManualModal] = useState(false);
            const [showTodayOnly, setShowTodayOnly] = useState(false);
            const [selectedProp, setSelectedProp] = useState(null);

            useEffect(() => {
                if (!session) return;
                let idleTimer;
                const logoutTime = 60 * 60 * 1000; 
                const resetTimer = () => {
                    clearTimeout(idleTimer);
                    idleTimer = setTimeout(() => { supabase.auth.signOut(); window.location.reload(); }, logoutTime);
                };
                window.onmousemove = resetTimer;
                window.onkeydown = resetTimer;
                resetTimer();

                return () => clearTimeout(idleTimer);
            }, [session]);

            useEffect(() => {
                supabase.auth.getSession().then(({ data: { session } }) => {
                    setSession(session);
                    if (session) { fetchLeads(); fetchProperties(); }
                });

                const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
                    setSession(session);
                    if (session) { fetchLeads(); fetchProperties(); }
                });

                return () => subscription.unsubscribe();
            }, [leadCategory, view]);

            async function fetchLeads() {
                setLoading(true);
                const table = leadCategory === 'bulk' ? 'bulk_leads' : 'leads';
                const { data, error } = await supabase.from(table).select('*').order('created_at', { ascending: false });
                if (!error) {
                    let raw = data || [];
                    if (table === 'leads') {
                        setLeads(leadCategory === 'website' 
                            ? raw.filter(l => !l.lead_source || l.lead_source.trim() === '' || l.lead_source.toLowerCase() === 'website')
                            : raw.filter(l => l.lead_source && l.lead_source.trim() !== '' && l.lead_source.toLowerCase() !== 'website'));
                    } else { setLeads(raw); }
                }
                setLoading(false);
            }

            async function fetchProperties() {
                const { data } = await supabase.from('properties').select('*').order('created_at', { ascending: false });
                setProperties(data || []);
            }

            const displayedLeads = useMemo(() => {
                if (!showTodayOnly) return leads;
                const today = new Date().toISOString().split('T')[0];
                return leads.filter(l => l.follow_up_at && l.follow_up_at.startsWith(today));
            }, [leads, showTodayOnly]);

            const stats = useMemo(() => {
                const total = leads.length;
                const uncalled = leads.filter(l => l.lead_status === 'Un called' || !l.lead_status).length;
                const called = leads.filter(l => l.lead_status && l.lead_status !== 'Un called' && l.lead_status !== 'Rejected').length;
                const rejected = leads.filter(l => l.lead_status === 'Rejected').length;
                return { total, uncalled, called, rejected };
            }, [leads]);

            async function updateLead(lead, field, value) {
                // BLOCK STATUS CHANGE IF NO PSA AGENT
                if (field === 'lead_status') {
                    if (!lead.psa_agent_name || lead.psa_agent_name.trim() === '') {
                        alert("ERROR: You must assign a PSA Agent (Tharun or Shivaji) before changing the lead status.");
                        setLeads([...leads]); // Force re-render to revert dropdown
                        return;
                    }
                }

                let updates = { [field]: value };
                const stamp = new Date().toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute:'2-digit' });

                if (field === 'lead_status') updates.call_remark = `[${stamp}] Status: ${value}\n${lead.call_remark || ''}`;
                if (field === 'follow_up_at') updates.call_remark = `[${stamp}] Callback Set: ${value}\n${lead.call_remark || ''}`;
                if (field === 'site_visit_at') updates.call_remark = `[${stamp}] SV Booked: ${value}\n${lead.call_remark || ''}`;
                
                // ENSURE NOTE SAVES TO DB AND REMAINS IN BOX
                if (field === 'add_note') {
                    updates.add_note = value; 
                }

                const table = leadCategory === 'bulk' ? 'bulk_leads' : 'leads';
                const { error } = await supabase.from(table).update(updates).eq('id', lead.id);
                if (!error) setLeads(prev => prev.map(l => l.id === lead.id ? {...l, ...updates} : l));
            }

            if (!session) return <LoginForm supabase={supabase} />;
            if (selectedProp) return <PropertyDetailsPage property={selectedProp} onBack={() => setSelectedProp(null)} />;

            return (
                <div className="min-h-screen flex flex-col animate-fadeIn">
                    <nav className="bg-slate-900 text-white p-4 flex justify-between items-center sticky top-0 z-50 shadow-md">
                        <h1 className="font-black tracking-tighter text-xl uppercase italic">Horizon <span className="text-blue-500">CRM</span></h1>
                        <div className="flex gap-4 md:gap-6 text-[10px] md:text-[11px] font-bold uppercase tracking-widest items-center">
                            <button onClick={() => setView('dashboard')} className={view === 'dashboard' ? 'text-blue-400' : 'hover:text-slate-300 transition'}>
                                <span className="hidden md:inline">CRM</span>
                                <span className="md:hidden text-lg" title="CRM">📱</span>
                            </button>
                            <button onClick={() => setView('library')} className={view === 'library' ? 'text-blue-400' : 'hover:text-slate-300 transition'}>
                                <span className="hidden md:inline">Library</span>
                                <span className="md:hidden text-lg" title="Library">📚</span>
                            </button>
                            <button onClick={() => setView('add')} className={view === 'add' ? 'text-blue-400' : 'hover:text-slate-300 transition'}>
                                <span className="hidden md:inline">Add Project</span>
                                <span className="md:hidden text-lg" title="Add Project">🏠</span>
                            </button>
                            <button onClick={() => supabase.auth.signOut()} className="text-red-400 border border-red-900 px-3 py-1.5 rounded hidden md:block hover:bg-red-900/50 transition">Logout</button>
                            <button onClick={() => supabase.auth.signOut()} className="text-red-400 md:hidden text-lg" title="Logout">🚪</button>
                        </div>
                    </nav>

                    <main className="p-3 md:p-8 max-w-7xl mx-auto w-full">
                        {view === 'dashboard' && (
                            <div className="space-y-6">
                                {/* Lead Status Summary Block */}
                                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-x-auto">
                                    <table className="w-full text-sm text-left min-w-[450px]">
                                        <thead className="bg-slate-50 border-b uppercase text-[9px] md:text-[10px] font-black text-slate-400 tracking-widest">
                                            <tr>
                                                <th className="p-3 md:p-5">Team Metric (Tharun)</th>
                                                <th className="p-3 md:p-5 text-center">Total</th>
                                                <th className="p-3 md:p-5 text-center">Uncalled</th>
                                                <th className="p-3 md:p-5 text-center">Working</th>
                                                <th className="p-3 md:p-5 text-center">Rejected</th>
                                            </tr>
                                        </thead>
                                        <tbody className="font-bold text-slate-700">
                                            <tr>
                                                <td className="p-3 md:p-5 border-b uppercase text-[10px] md:text-[11px] tracking-tighter">Volume ({leadCategory})</td>
                                                <td className="p-3 md:p-5 border-b text-center">{stats.total}</td>
                                                <td className="p-3 md:p-5 border-b text-green-600 text-center">{stats.uncalled}</td>
                                                <td className="p-3 md:p-5 border-b text-blue-600 text-center">{stats.called}</td>
                                                <td className="p-3 md:p-5 border-b text-red-600 text-center">{stats.rejected}</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>

                                <div className="flex flex-wrap gap-4 items-center justify-between border-b pb-4">
                                    <div className="flex gap-4">
                                        {['website', 'bulk', 'manual'].map(c => (
                                            <button key={c} onClick={() => setLeadCategory(c)} className={`pb-2 text-[10px] font-black uppercase tracking-widest border-b-2 transition-all ${leadCategory === c ? 'border-blue-500 text-blue-600' : 'border-transparent text-slate-500 hover:text-slate-800'}`}>{c}</button>
                                        ))}
                                    </div>
                                    <div className="flex gap-2">
                                        <button onClick={() => setShowTodayOnly(!showTodayOnly)} className={`px-4 py-2 rounded-full text-[9px] font-black uppercase border ${showTodayOnly ? 'bg-amber-500 text-white border-amber-600' : 'bg-white text-slate-600 shadow-sm'}`}>📅 Today</button>
                                        <button onClick={() => setShowManualModal(true)} className="bg-blue-600 text-white px-4 py-2 rounded-full text-[9px] font-black uppercase shadow-sm">+ Add Lead</button>
                                    </div>
                                </div>

                                {/* DESKTOP TABLE */}
                                <div className="hidden lg:block bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                                    <table className="w-full text-left text-xs">
                                        <thead className="bg-slate-50 text-slate-400 font-black uppercase text-[9px] tracking-widest border-b">
                                            <tr><th className="p-4">Customer</th><th className="p-4">Status & Priority</th><th className="p-4">Scheduling</th><th className="p-4 min-w-[250px]">Activity & Notes</th></tr>
                                        </thead>
                                        <tbody className="divide-y">
                                            {displayedLeads.map(l => (
                                                <tr key={l.id} className={`hover:bg-slate-50/50 transition ${l.lead_priority === 'Hot' ? 'ring-hot bg-red-50/10' : l.lead_priority === 'Cold' ? 'ring-cold' : 'ring-warm'}`}>
                                                    <td className="p-4 font-bold uppercase min-w-[180px]">
                                                        {l.customer_name}
                                                        <div className="text-blue-600 mt-1">{l.phone_number}</div>
                                                        {(leadCategory === 'website' || leadCategory === 'manual') && l.created_at && (
                                                            <div className="text-[9px] text-slate-400 font-bold mt-1 tracking-widest uppercase">Logged: {new Date(l.created_at).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute:'2-digit' })}</div>
                                                        )}
                                                        <div className="mt-3 flex gap-2">
                                                            <a href={`https://wa.me/91${l.phone_number?.replace(/\D/g,'').slice(-10)}`} target="_blank" className="bg-green-500 text-white text-[8px] font-black px-3 py-1.5 rounded uppercase tracking-widest shadow-sm hover:scale-105 transition">WhatsApp 💬</a>
                                                        </div>
                                                    </td>
                                                    <td className="p-4 min-w-[140px]">
                                                        <select onChange={(e) => updateLead(l, 'psa_agent_name', e.target.value)} value={l.psa_agent_name || ''} className="w-full p-2 mb-2 border rounded-lg font-bold uppercase text-[10px] bg-slate-50 border-slate-300 outline-none text-blue-800">
                                                            <option value="" disabled>Assign Agent</option>
                                                            <option value="Tharun">Tharun</option>
                                                            <option value="Shivaji">Shivaji</option>
                                                        </select>
                                                        <select onChange={(e) => updateLead(l, 'lead_status', e.target.value)} value={l.lead_status || ''} className="w-full p-2 mb-2 border rounded-lg font-bold uppercase text-[10px] bg-white outline-none">
                                                            {(!l.lead_status || l.lead_status === 'Un called') && <option value="Un called">Un called</option>}
                                                            <option value="Called">Called</option><option value="Details Shared">Details Shared</option><option value="SV Scheduled">SV Scheduled</option><option value="Converted">Converted</option><option value="Rejected">Rejected</option><option value="RNR">RNR</option>
                                                        </select>
                                                        <select onChange={(e) => updateLead(l, 'lead_priority', e.target.value)} value={l.lead_priority || 'Warm'} className="w-full p-2 border rounded-lg font-bold uppercase text-[10px] bg-white outline-none">
                                                            <option>Hot</option><option>Warm</option><option>Cold</option>
                                                        </select>
                                                    </td>
                                                    <td className="p-4 min-w-[160px]">
                                                        <div className="space-y-3">
                                                            {['Called', 'RNR', 'Details Shared'].includes(l.lead_status) && (
                                                                <div>
                                                                    <span className="text-[8px] font-black text-blue-600 uppercase tracking-widest block mb-1">Call Back Date</span>
                                                                    <input type="datetime-local" className="w-full p-2 border border-blue-200 bg-blue-50 rounded-lg text-[10px] font-bold text-slate-700 outline-none" value={l.follow_up_at?.slice(0,16) || ''} onChange={(e) => updateLead(l, 'follow_up_at', e.target.value)} />
                                                                </div>
                                                            )}
                                                            {l.lead_status === 'SV Scheduled' && (
                                                                <div>
                                                                    <span className="text-[8px] font-black text-teal-600 uppercase tracking-widest block mb-1">Site Visit Date</span>
                                                                    <input type="date" className="w-full p-2 border border-teal-200 bg-teal-50 rounded-lg text-[10px] font-bold text-slate-700 outline-none" value={l.site_visit_at || ''} onChange={(e) => updateLead(l, 'site_visit_at', e.target.value)} />
                                                                </div>
                                                            )}
                                                        </div>
                                                    </td>
                                                    <td className="p-4">
                                                        <div className="flex flex-col gap-2">
                                                            <div className="h-16 overflow-y-auto text-[10px] bg-slate-50 p-2 rounded-lg history-scroll whitespace-pre-wrap border border-slate-100 leading-relaxed font-medium text-slate-400">
                                                                {l.call_remark || <span className="italic">System auto-capture records...</span>}
                                                            </div>
                                                            <div className="flex gap-2">
                                                                <textarea id={`note-d-${l.id}`} defaultValue={l.add_note || ''} rows="2" placeholder="Manual notes / requirements..." className="flex-1 p-2 border border-slate-200 rounded-lg text-[10px] outline-none focus:ring-2 focus:ring-blue-500 shadow-sm resize-none" />
                                                                <button onClick={() => { const el = document.getElementById(`note-d-${l.id}`); updateLead(l, 'add_note', el.value); }} className="bg-slate-900 text-white px-3 rounded-lg text-[9px] font-black uppercase tracking-widest hover:bg-blue-600">Save</button>
                                                            </div>
                                                        </div>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>

                                {/* MOBILE CARDS */}
                                <div className="lg:hidden space-y-4">
                                    {displayedLeads.map(l => (
                                        <div key={`m-${l.id}`} className={`bg-white p-4 rounded-2xl shadow-sm border border-t-8 ${l.lead_priority === 'Hot' ? 'border-t-red-500 bg-red-50/10' : l.lead_priority === 'Cold' ? 'border-t-blue-400' : 'border-t-amber-400'}`}>
                                            <div className="flex justify-between items-start">
                                                <div>
                                                    <h3 className="font-black text-sm uppercase">{l.customer_name}</h3>
                                                    <p className="font-bold text-blue-600">{l.phone_number}</p>
                                                    {(leadCategory === 'website' || leadCategory === 'manual') && l.created_at && (
                                                        <div className="text-[9px] text-slate-400 font-bold mt-1 tracking-widest uppercase">Logged: {new Date(l.created_at).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute:'2-digit' })}</div>
                                                    )}
                                                </div>
                                                <div className="flex gap-2">
                                                    <a href={`tel:${l.phone_number}`} className="bg-blue-50 text-blue-600 border border-blue-100 p-2.5 rounded-full shadow-sm">📞</a>
                                                    <a href={`https://wa.me/91${l.phone_number?.replace(/\D/g,'').slice(-10)}`} className="bg-green-50 text-green-600 border border-green-100 p-2.5 rounded-full shadow-sm">💬</a>
                                                </div>
                                            </div>
                                            
                                            <div className="mt-4 grid grid-cols-2 gap-2">
                                                <div className="flex flex-col gap-1 col-span-2">
                                                    <label className="text-[8px] font-black text-slate-400 uppercase tracking-widest">PSA Agent</label>
                                                    <select onChange={(e) => updateLead(l, 'psa_agent_name', e.target.value)} value={l.psa_agent_name || ''} className="p-2 border border-slate-300 rounded-xl font-bold uppercase text-[9px] outline-none bg-slate-50 text-blue-800">
                                                        <option value="" disabled>Assign Agent</option>
                                                        <option value="Tharun">Tharun</option>
                                                        <option value="Shivaji">Shivaji</option>
                                                    </select>
                                                </div>
                                                <div className="flex flex-col gap-1">
                                                    <label className="text-[8px] font-black text-slate-400 uppercase tracking-widest">Status</label>
                                                    <select onChange={(e) => updateLead(l, 'lead_status', e.target.value)} value={l.lead_status || ''} className="p-2 border rounded-xl font-bold uppercase text-[9px] outline-none">
                                                        {(!l.lead_status || l.lead_status === 'Un called') && <option value="Un called">Un called</option>}
                                                        <option>Called</option><option>Details Shared</option><option>SV Scheduled</option><option>Converted</option><option>Rejected</option><option>RNR</option>
                                                    </select>
                                                </div>
                                                <div className="flex flex-col gap-1">
                                                    <label className="text-[8px] font-black text-slate-400 uppercase tracking-widest">Priority</label>
                                                    <select onChange={(e) => updateLead(l, 'lead_priority', e.target.value)} value={l.lead_priority || 'Warm'} className="p-2 border rounded-xl font-bold uppercase text-[9px] outline-none">
                                                        <option>Hot</option><option>Warm</option><option>Cold</option>
                                                    </select>
                                                </div>
                                            </div>

                                            <div className="mt-3 grid grid-cols-1 gap-2 pt-3 border-t border-slate-100">
                                                {['Called', 'RNR', 'Details Shared'].includes(l.lead_status) && (
                                                    <div className="flex flex-col gap-1">
                                                        <label className="text-[8px] font-black text-blue-600 uppercase tracking-widest">Callback Date</label>
                                                        <input type="datetime-local" className="p-2 border border-blue-200 bg-blue-50 rounded-xl text-[10px] font-bold text-slate-700 outline-none" value={l.follow_up_at?.slice(0,16) || ''} onChange={(e) => updateLead(l, 'follow_up_at', e.target.value)} />
                                                    </div>
                                                )}
                                                {l.lead_status === 'SV Scheduled' && (
                                                    <div className="flex flex-col gap-1 mt-2">
                                                        <label className="text-[8px] font-black text-teal-600 uppercase tracking-widest">Site Visit Date</label>
                                                        <input type="date" className="p-2 border border-teal-200 bg-teal-50 rounded-xl text-[10px] font-bold text-slate-700 outline-none" value={l.site_visit_at || ''} onChange={(e) => updateLead(l, 'site_visit_at', e.target.value)} />
                                                    </div>
                                                )}
                                            </div>

                                            <div className="mt-4 pt-3 border-t border-slate-100">
                                                <div className="bg-slate-50 p-2 rounded-t-xl h-16 overflow-y-auto text-[9px] font-medium whitespace-pre-wrap border border-slate-200 leading-relaxed text-slate-400 mb-1">
                                                    {l.call_remark || <span className="italic">System logs...</span>}
                                                </div>
                                                <div className="flex gap-2">
                                                    <textarea id={`note-m-${l.id}`} defaultValue={l.add_note || ''} className="w-full p-2 border border-slate-200 rounded-b-xl text-[10px] resize-none focus:ring-2 focus:ring-blue-500 outline-none shadow-sm" placeholder="Manual notes / requirements..." rows="2" />
                                                    <button onClick={() => { const el = document.getElementById(`note-m-${l.id}`); updateLead(l, 'add_note', el.value); }} className="bg-slate-900 text-white px-4 rounded-xl text-[10px] font-black uppercase tracking-widest shadow-md">Save</button>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {view === 'library' && <ProjectLibrary supabase={supabase} setProp={setSelectedProp} properties={properties} />}
                        {view === 'add' && <PropertyForm scriptUrl={GOOGLE_SCRIPT_URL} supabase={supabase} />}
                    </main>

                    {showManualModal && <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4"><div className="bg-white p-8 rounded-[30px] w-full max-w-md shadow-2xl animate-fadeIn"><div className="flex justify-between items-center mb-6"><h2 className="text-xl font-black uppercase italic">Manual Entry</h2><button onClick={()=>setShowManualModal(false)} className="text-2xl text-gray-400">&times;</button></div><ManualLeadForm properties={properties} supabase={supabase} onSuccess={() => {setShowManualModal(false); fetchLeads();}} /></div></div>}
                </div>
            );
        }

        // --- FULL PAGE PROJECT LIBRARY ---
        function ProjectLibrary({ properties, setProp }) {
            const getVal = (obj, searchKey) => {
                if (!obj) return "";
                if (obj[searchKey] !== undefined && obj[searchKey] !== "") return obj[searchKey];
                const cleanKey = searchKey.replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
                for (let k in obj) {
                    if (k.replace(/[^a-zA-Z0-9]/g, '').toLowerCase() === cleanKey) return obj[k];
                }
                return "";
            };

            const convertDriveLink = (url) => {
                if (!url || typeof url !== 'string') return url;
                let idMatch = url.match(/\/d\/(.*?)\//) || url.match(/id=(.*?)(&|$)/);
                return idMatch ? `https://drive.google.com/thumbnail?id=${idMatch[1]}&sz=w1000` : url;
            };

            const fixImageUrl = (u) => u ? convertDriveLink(String(u).split(',')[0].trim()) : 'https://via.placeholder.com/600x300?text=No+Image';

            useEffect(() => { window.scrollTo(0, 0); }, [property]);

            const getVal = (obj, searchKey) => {
                if (!obj) return "";
                if (obj[searchKey] !== undefined && obj[searchKey] !== "") return obj[searchKey];
                const cleanKey = searchKey.replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
                for (let k in obj) { if (k.replace(/[^a-zA-Z0-9]/g, '').toLowerCase() === cleanKey) return obj[k]; }
                return "";
            };

            const convertDriveLink = (url) => {
                if (!url || typeof url !== 'string') return url;
                let idMatch = url.match(/\/d\/(.*?)\//) || url.match(/id=(.*?)(&|$)/);
                return idMatch ? `https://drive.google.com/thumbnail?id=${idMatch[1]}&sz=w1000` : url;
            };

            const formatPercent = (val) => {
                let num = parseFloat(val);
                if (isNaN(num)) return String(val || "0%");
                return (num < 1 && num > 0) ? (num * 100).toFixed(1) + "%" : num + "%";
            };

            const scrollGallery = (dir) => {
                if (galleryRef.current) {
                    const scrollAmount = galleryRef.current.clientWidth * 0.8;
                    galleryRef.current.scrollBy({ left: dir === 'right' ? scrollAmount : -scrollAmount, behavior: 'smooth' });
                }
            };

            const getSafeLink = (rawLink) => {
                if (!rawLink) return "#";
                const link = String(rawLink).trim();
                if (link === "#") return "#";
                if (link.includes('@') && !link.startsWith('mailto:')) return `mailto:${link}`;
                if (!link.startsWith('http') && !link.includes('@')) return `https://${link}`;
                return link;

        // --- UPDATED PROPERTY FORM ---
        function PropertyForm({ scriptUrl, supabase }) {
            const [form, setForm] = useState({
                property_name: '', builder_name: '', property_region: '', property_type: '', location: '', price: '', bhk: '', 
                super_built_up_a: '', possession_date: '', construction_sta: '', approval: '', total_units: '', availability: '',
                description: '', usp_details: '', amenities: '', point_of_contact: '', commission: '', video_link: '',
                website_link: '', lead_registration: '', map_link: '', cover_image: '', gallery_images: '', floor_plan: '', brochure: '', cost_sheet: ''
            });
            const [loading, setLoading] = useState(false);

            const upload = async (e, field, append = false) => {
                const files = e.target.files; if(!files || files.length === 0) return;
                setLoading(true);
                let newUrls = [];
                for(let i=0; i<files.length; i++) {
                    const file = files[i];
                    const reader = new FileReader();
                    const url = await new Promise(resolve => {
                        reader.readAsDataURL(file);
                        reader.onload = async () => {
                            const res = await fetch(scriptUrl, { method: "POST", body: JSON.stringify({ base64: reader.result.split(',')[1], type: file.type, name: file.name, propertyName: form.property_name || 'Uploads' }) });
                            const resJson = await res.json();
                            resolve(resJson.status === 'success' ? resJson.url : null);
                        };
                    });
                    if(url) newUrls.push(url);
                }
                if(newUrls.length > 0) {
                    const joined = newUrls.join(',');
                    if(append) setForm(f => ({ ...f, [field]: f[field] ? f[field] + ',' + joined : joined }));
                    else setForm(f => ({ ...f, [field]: joined }));
                }
                setLoading(false);
            };

            const removeFile = (field, isArray = false, idx = null) => {
                if (isArray) {
                    const arr = form[field].split(',').filter(Boolean);
                    arr.splice(idx, 1);
                    setForm(f => ({ ...f, [field]: arr.join(',') }));
                } else {
                    setForm(f => ({ ...f, [field]: '' }));
                }
            };

            const save = async () => {
                if (!form.property_name || !form.price || !form.cover_image) {
                    alert("Please fill the mandatory fields: Property Name, Price, and Main Cover Image.");
                    return;
                }
                setLoading(true);
                const { error } = await supabase.from('properties').insert([form]);
                if (!error) {
                    alert("Listing Live!");
                    setForm({ property_name: '', builder_name: '', property_region: '', property_type: '', location: '', price: '', bhk: '', super_built_up_a: '', possession_date: '', construction_sta: '', approval: '', total_units: '', availability: '', description: '', usp_details: '', amenities: '', point_of_contact: '', commission: '', video_link: '', website_link: '', lead_registration: '', map_link: '', cover_image: '', gallery_images: '', floor_plan: '', brochure: '', cost_sheet: '' });
                } else alert(error.message);
                setLoading(false);

            const FileTag = ({ field, name, isArray=false, idx=null }) => (

                    <span className="truncate max-w-[150px]">{name}</span>
                    <button onClick={() => removeFile(field, isArray, idx)} className="text-red-500 hover:text-red-700 px-2 text-xs">✕</button>
                </div>
            );

            return (
                <div className="bg-white p-6 md:p-10 rounded-3xl shadow-sm max-w-4xl mx-auto space-y-6 animate-fadeIn border border-slate-200">

                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4">

                        <div>
                            <label className="block text-[10px] font-black uppercase text-slate-500 mb-2">Cost Sheet (PDF/Images - Multiple)</label>
                            <input type="file" multiple onChange={e => upload(e, 'cost_sheet', true)} className="text-xs font-bold text-slate-600"/>
                            {form.cost_sheet && form.cost_sheet.split(',').filter(Boolean).map((img, idx) => (
                                <FileTag key={idx} field="cost_sheet" name={`Cost Sheet File ${idx + 1}`} isArray={true} idx={idx} />
                            ))}
                        </div>
                        <div className="md:col-span-2">
                            <label className="block text-[10px] font-black uppercase text-slate-500 mb-2">Floor Plan (PDF/Img)</label>
                            <input type="file" onChange={e => upload(e, 'floor_plan')} className="text-xs font-bold text-slate-600"/>
                            {form.floor_plan && <FileTag field="floor_plan" name="Floor Plan File" />}
                        </div>
                    </div>

                    <button onClick={save} disabled={loading} className="w-full bg-blue-600 text-white p-5 rounded-3xl font-black uppercase tracking-widest hover:bg-slate-900 transition shadow-xl mt-4">
                        {loading ? 'Uploading & Publishing...' : 'Publish Listing'}
                    </button>
                </div>
            );
        }

        // --- MANUAL LEAD FORM ---
        function ManualLeadForm({ supabase, properties, onSuccess }) {
            const [form, setForm] = useState({ name: '', phone: '', email: '', project: 'General Enquiry', note: '', source: 'Manual Entry' });
            const [loading, setLoading] = useState(false);

            const getVal = (obj, searchKey) => {
                if (!obj) return "";
                if (obj[searchKey] !== undefined && obj[searchKey] !== "") return obj[searchKey];
                const cleanKey = searchKey.replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
                for (let k in obj) { if (k.replace(/[^a-zA-Z0-9]/g, '').toLowerCase() === cleanKey) return obj[k]; }
                return "";
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);
                const stamp = new Date().toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute:'2-digit' });
                
                const { error } = await supabase.from('leads').insert([{ 
                    customer_name: form.name, 
                    phone_number: form.phone, 
                    customer_email: form.email || null,
                    project_interested_in: form.project,
                    add_note: form.note, 
                    call_remark: form.note ? `[${stamp}] Requirement: ${form.note}\n\n` : '',
                    lead_source: form.source, 
                    lead_status: 'Un called' 
                }]);

                if (!error) {
                    fetch("https://formsubmit.co/ajax/perfecthorizons.in@gmail.com", {
                        method: "POST", headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                        body: JSON.stringify({ _subject: `New Lead: ${form.name}`, Name: form.name, Phone: form.phone, Email: form.email || 'N/A', Project: form.project, Source: form.source, Requirements: form.note || 'None' })
                    }).catch(err => console.log(err));
                    onSuccess(); 
                } else alert(error.message);
                setLoading(false);
            };

            return (
                <form onSubmit={handleSubmit} className="space-y-4">
                    <input required className="w-full p-4 bg-slate-50 border rounded-2xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500" placeholder="Client Name *" onChange={e => setForm({...form, name: e.target.value})} />
                    <input required className="w-full p-4 bg-slate-50 border rounded-2xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500" placeholder="Phone Number *" onChange={e => setForm({...form, phone: e.target.value})} />
                    <input type="email" className="w-full p-4 bg-slate-50 border rounded-2xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500" placeholder="Email ID (Optional)" onChange={e => setForm({...form, email: e.target.value})} />
                    <select className="w-full p-4 bg-slate-50 border rounded-2xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500 text-slate-600" onChange={e => setForm({...form, project: e.target.value})} value={form.project}>
                        <option value="General Enquiry">General Enquiry</option>
                        {properties?.map(p => <option key={p.id} value={getVal(p, "property_name")}>{getVal(p, "property_name")}</option>)}
                    </select>
                    <textarea className="w-full p-4 bg-slate-50 border rounded-2xl font-bold text-sm resize-none outline-none focus:ring-2 focus:ring-blue-500 h-24" placeholder="Customer Requirements / Enquiry Details..." onChange={e => setForm({...form, note: e.target.value})}></textarea>
                    <select className="w-full p-4 bg-slate-50 border rounded-2xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500" onChange={e => setForm({...form, source: e.target.value})} value={form.source}>
                        <option>Manual Entry</option><option>Walk-in</option><option>Referral</option><option>MagicBricks</option><option>Housing.com</option>
                    </select>
                    <button disabled={loading} className="w-full bg-blue-600 text-white p-4 rounded-2xl font-black uppercase tracking-widest hover:bg-blue-700 shadow-md transition disabled:opacity-50">
                        {loading ? "Injecting..." : "Inject Lead"}
                    </button>
                </form>
            );
        }

        // --- LOGIN FORM ---
        function LoginForm({ supabase }) {
            const [email, setEmail] = useState(""); const [pass, setPass] = useState(""); const [loading, setLoading] = useState(false); const [errorMsg, setErrorMsg] = useState("");
            const handleLogin = async (e) => {
                e.preventDefault(); setLoading(true); setErrorMsg("");
                const { error } = await supabase.auth.signInWithPassword({ email, password: pass });
                if (error) setErrorMsg(error.message);
                setLoading(false);
            };
            return (
                <div className="min-h-screen bg-slate-950 flex items-center justify-center p-4">
                    <form onSubmit={handleLogin} className="bg-white p-10 rounded-[40px] shadow-2xl w-full max-w-sm text-center border-t-8 border-blue-500 relative">
                        <h1 className="text-3xl font-black italic uppercase mb-8">Horizon CRM</h1>
                        {errorMsg && <div className="text-red-500 text-xs font-bold mb-4 bg-red-50 p-2 rounded">{errorMsg}</div>}
                        <input type="email" required placeholder="Email" className="w-full p-4 bg-slate-100 rounded-2xl mb-4 font-bold outline-none focus:ring-2 focus:ring-blue-500 transition" onChange={e => setEmail(e.target.value)} />
                        <input type="password" required placeholder="Password" className="w-full p-4 bg-slate-100 rounded-2xl mb-8 font-bold outline-none focus:ring-2 focus:ring-blue-500 transition" onChange={e => setPass(e.target.value)} />
                        <button disabled={loading} type="submit" className="w-full bg-blue-600 text-white font-black py-4 rounded-2xl uppercase tracking-widest shadow-lg disabled:opacity-50 hover:bg-blue-700 transition">
                            {loading ? "Authenticating..." : "Login"}
                        </button>
                    </form>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AdminApp />);
    </script>
</body>
</html>
