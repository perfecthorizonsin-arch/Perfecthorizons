<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizon CRM | Command Center</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .animate-fadeIn { animation: fadeIn 0.15s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .history-scroll::-webkit-scrollbar { width: 4px; }
        .history-scroll::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
        .toggle-active { background-color: #f59e0b; color: white; border-color: #f59e0b; }
        .ring-hot { border-left: 5px solid #ef4444 !important; }
        .ring-warm { border-left: 5px solid #f59e0b !important; }
        .ring-cold { border-left: 5px solid #3b82f6 !important; }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-900 pb-20 md:pb-0">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const supabaseUrl = 'https://uiiovtsktllvtecfokik.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVpaW92dHNrdGxsdnRlY2Zva2lrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM5NjkxMjMsImV4cCI6MjA4OTU0NTEyM30.fL6cU7YkH4-50w55GrnutoBhmH5sofe8-rOMZetmuvU';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey, { auth: { storage: window.sessionStorage } });
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxJOoh4meGBQOZYZpUWqK1DmDS_B8fXSC5NlwPcTX3GUfP7gzYQKvatgj9IFT3Txy-FCQ/exec";

        function AdminApp() {
            const [session, setSession] = useState(null);
            const [leads, setLeads] = useState([]);
            const [view, setView] = useState('dashboard'); 
            const [leadCategory, setLeadCategory] = useState('website'); 
            const [loading, setLoading] = useState(true);
            const [showManualModal, setShowManualModal] = useState(false);
            const [showTodayOnly, setShowTodayOnly] = useState(false);

            // AUTO-LOGOUT AFTER 1 HOUR
            useEffect(() => {
                if (!session) return;
                let idleTimer;
                const logoutTime = 60 * 60 * 1000; 
                const resetTimer = () => {
                    clearTimeout(idleTimer);
                    idleTimer = setTimeout(() => { supabase.auth.signOut(); window.location.reload(); }, logoutTime);
                };
                window.onmousemove = resetTimer;
                window.onkeydown = resetTimer;
                resetTimer();
            }, [session]);

            useEffect(() => {
                supabase.auth.getSession().then(({ data: { session } }) => {
                    setSession(session);
                    if (session) fetchLeads();
                });
            }, [leadCategory, view]);

            async function fetchLeads() {
                setLoading(true);
                const table = leadCategory === 'bulk' ? 'bulk_leads' : 'leads';
                const { data, error } = await supabase.from(table).select('*').order('created_at', { ascending: false });
                if (!error) {
                    let raw = data || [];
                    if (table === 'leads') {
                        setLeads(leadCategory === 'website' 
                            ? raw.filter(l => !l.lead_source || l.lead_source.trim() === '' || l.lead_source.toLowerCase() === 'website')
                            : raw.filter(l => l.lead_source && l.lead_source.trim() !== '' && l.lead_source.toLowerCase() !== 'website'));
                    } else { setLeads(raw); }
                }
                setLoading(false);
            }

            const displayedLeads = useMemo(() => {
                if (!showTodayOnly) return leads;
                const today = new Date().toISOString().split('T')[0];
                return leads.filter(l => l.follow_up_at && l.follow_up_at.startsWith(today));
            }, [leads, showTodayOnly]);

            async function updateLead(lead, field, value) {
                let updates = { [field]: value };
                const stamp = new Date().toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute:'2-digit' });

                if (field === 'lead_status') updates.call_remark = `[${stamp}] Status: ${value}\n${lead.call_remark || ''}`;
                if (field === 'follow_up_at') updates.call_remark = `[${stamp}] Callback Set: ${value}\n${lead.call_remark || ''}`;
                if (field === 'add_note') {
                    updates.call_remark = `[${stamp}] Note: ${value}\n${lead.call_remark || ''}`;
                    delete updates.add_note;
                }

                const table = leadCategory === 'bulk' ? 'bulk_leads' : 'leads';
                const { error } = await supabase.from(table).update(updates).eq('id', lead.id);
                if (!error) setLeads(prev => prev.map(l => l.id === lead.id ? {...l, ...updates} : l));
            }

            if (!session) return <LoginForm supabase={supabase} />;

            return (
                <div className="min-h-screen flex flex-col animate-fadeIn">
                    <nav className="bg-slate-900 text-white p-4 flex justify-between items-center sticky top-0 z-50">
                        <h1 className="font-black tracking-tighter text-xl uppercase italic">Horizon <span className="text-blue-500">CRM</span></h1>
                        <div className="flex gap-4 text-[10px] font-bold uppercase tracking-widest">
                            <button onClick={() => setView('dashboard')} className={view === 'dashboard' ? 'text-blue-400' : ''}>CRM</button>
                            <button onClick={() => setView('library')} className={view === 'library' ? 'text-blue-400' : ''}>Library</button>
                            <button onClick={() => setView('add')} className={view === 'add' ? 'text-blue-400' : ''}>Add Project</button>
                            <button onClick={() => supabase.auth.signOut()} className="text-red-400 border border-red-900 px-2 py-1 rounded hidden md:block">Logout</button>
                        </div>
                    </nav>

                    <main className="p-3 md:p-8 max-w-7xl mx-auto w-full">
                        {view === 'dashboard' && (
                            <div className="space-y-6">
                                <div className="flex flex-wrap gap-4 items-center justify-between border-b pb-4">
                                    <div className="flex gap-4">
                                        {['website', 'bulk', 'manual'].map(c => (
                                            <button key={c} onClick={() => setLeadCategory(c)} className={`pb-2 text-[10px] font-black uppercase tracking-widest border-b-2 transition-all ${leadCategory === c ? 'border-blue-500 text-blue-500' : 'border-transparent text-slate-400'}`}>{c}</button>
                                        ))}
                                    </div>
                                    <div className="flex gap-2">
                                        <button onClick={() => setShowTodayOnly(!showTodayOnly)} className={`px-4 py-2 rounded-full text-[9px] font-black uppercase border ${showTodayOnly ? 'bg-amber-500 text-white' : 'bg-white'}`}>📅 Today</button>
                                        <button onClick={() => setShowManualModal(true)} className="bg-blue-600 text-white px-4 py-2 rounded-full text-[9px] font-black uppercase">+ Add Lead</button>
                                    </div>
                                </div>

                                {/* DESKTOP TABLE */}
                                <div className="hidden lg:block bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                                    <table className="w-full text-left text-xs">
                                        <thead className="bg-slate-50 text-slate-400 font-black uppercase text-[9px] tracking-widest border-b">
                                            <tr><th className="p-4">Customer</th><th className="p-4">Status</th><th className="p-4">Scheduling</th><th className="p-4">History</th></tr>
                                        </thead>
                                        <tbody className="divide-y">
                                            {displayedLeads.map(l => (
                                                <tr key={l.id} className={`hover:bg-slate-50/50 ${l.lead_priority === 'Hot' ? 'ring-hot' : l.lead_priority === 'Cold' ? 'ring-cold' : 'ring-warm'}`}>
                                                    <td className="p-4 font-bold uppercase">{l.customer_name}<div className="text-blue-600">{l.phone_number}</div></td>
                                                    <td className="p-4">
                                                        <select onChange={(e) => updateLead(l, 'lead_status', e.target.value)} value={l.lead_status || ''} className="w-full p-2 border rounded font-bold uppercase text-[10px] bg-white"><option>Un called</option><option>Called</option><option>SV Scheduled</option><option>Converted</option><option>Rejected</option></select>
                                                    </td>
                                                    <td className="p-4">
                                                        <input type="datetime-local" className="p-2 border rounded w-full text-[10px]" value={l.follow_up_at?.slice(0,16) || ''} onChange={(e) => updateLead(l, 'follow_up_at', e.target.value)} />
                                                    </td>
                                                    <td className="p-4">
                                                        <div className="h-16 overflow-y-auto text-[10px] bg-slate-50 p-2 rounded history-scroll whitespace-pre-wrap">{l.call_remark}</div>
                                                        <input placeholder="Add note..." className="w-full mt-1 p-2 border rounded text-[10px]" onKeyDown={(e) => e.key === 'Enter' && (updateLead(l, 'add_note', e.target.value), e.target.value='')} />
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>

                                {/* MOBILE CARDS */}
                                <div className="lg:hidden space-y-4">
                                    {displayedLeads.map(l => (
                                        <div key={`m-${l.id}`} className={`bg-white p-4 rounded-2xl shadow-md border-t-8 ${l.lead_priority === 'Hot' ? 'border-red-500' : l.lead_priority === 'Cold' ? 'border-blue-400' : 'border-amber-400'}`}>
                                            <div className="flex justify-between items-start">
                                                <div><h3 className="font-black text-sm uppercase">{l.customer_name}</h3><p className="font-bold text-blue-600">{l.phone_number}</p></div>
                                                <div className="flex gap-2"><a href={`tel:${l.phone_number}`} className="bg-blue-100 p-2 rounded-full">📞</a><a href={`https://wa.me/91${l.phone_number}`} className="bg-green-100 p-2 rounded-full">💬</a></div>
                                            </div>
                                            <div className="mt-4 grid grid-cols-2 gap-2">
                                                <select onChange={(e) => updateLead(l, 'lead_status', e.target.value)} value={l.lead_status || ''} className="p-2 border rounded-xl font-bold uppercase text-[9px]"><option>Un called</option><option>Called</option><option>SV Scheduled</option><option>Rejected</option></select>
                                                <input type="datetime-local" className="p-2 border rounded-xl text-[9px]" value={l.follow_up_at?.slice(0,16) || ''} onChange={(e) => updateLead(l, 'follow_up_at', e.target.value)} />
                                            </div>
                                            <div className="mt-4 bg-slate-50 p-3 rounded-xl h-20 overflow-y-auto text-[10px] italic whitespace-pre-wrap">{l.call_remark}</div>
                                            <textarea className="w-full mt-2 p-3 border rounded-xl text-[10px] resize-none" placeholder="Type note & hit save..." id={`note-m-${l.id}`} rows="1" />
                                            <button onClick={() => { const el = document.getElementById(`note-m-${l.id}`); if(el.value.trim()){ updateLead(l, 'add_note', el.value); el.value=''; } }} className="w-full bg-slate-900 text-white p-2 rounded-xl text-[10px] font-bold mt-1 uppercase">Save Note</button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {view === 'library' && <ProjectLibrary supabase={supabase} />}
                        {view === 'add' && <PropertyForm scriptUrl={GOOGLE_SCRIPT_URL} supabase={supabase} />}
                    </main>

                    {showManualModal && <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4"><div className="bg-white p-8 rounded-[30px] w-full max-w-md shadow-2xl animate-fadeIn"><div className="flex justify-between items-center mb-6"><h2 className="text-xl font-black uppercase italic">Manual Entry</h2><button onClick={()=>setShowManualModal(false)} className="text-2xl text-gray-400">&times;</button></div><ManualLeadForm supabase={supabase} onSuccess={() => {setShowManualModal(false); fetchLeads();}} /></div></div>}
                </div>
            );
        }

        // --- FULLY RESTORED PROJECT LIBRARY WITH FRONT-END MODAL ---
        function ProjectLibrary({ supabase }) {
            const [data, setData] = useState([]);
            const [loading, setLoading] = useState(true);
            const [selectedProperty, setSelectedProperty] = useState(null);

            useEffect(() => { 
                supabase.from('properties').select('*').order('created_at', { ascending: false }).then(({data}) => {
                    setData(data || []);
                    setLoading(false);
                }); 
            }, []);

            const formatPercent = (val) => {
                let num = parseFloat(val);
                if (isNaN(num)) return String(val || "0%");
                return (num < 1 && num > 0) ? (num * 100).toFixed(1) + "%" : num + "%";
            };

            const formatDate = (ds) => ds ? new Date(ds).toLocaleDateString('en-IN', { month: 'short', year: 'numeric' }) : "N/A";

            if (loading) return <div className="text-center py-20 animate-pulse font-black text-slate-400 tracking-widest uppercase">Loading Master Library...</div>;

            return (
                <div className="animate-fadeIn">
                    {/* GRID OF PROPERTIES */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                        {data.map(p => (
                            <div key={p.id} onClick={() => setSelectedProperty(p)} className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden cursor-pointer hover:shadow-lg hover:-translate-y-1 transition group flex flex-col">
                                <div className="relative h-48 bg-slate-100 overflow-hidden">
                                    <img src={p['cover-image'] || 'https://via.placeholder.com/600x300?text=No+Image'} className="w-full h-full object-cover group-hover:scale-105 transition duration-500" />
                                    <div className="absolute top-4 left-0 bg-slate-900/90 backdrop-blur-sm text-white text-[10px] font-black px-3 py-1.5 rounded-r-lg uppercase tracking-widest shadow-md">
                                        {p.property_type || 'Property'}
                                    </div>
                                </div>
                                <div className="p-5 flex-grow flex flex-col">
                                    <h3 className="text-xl font-black uppercase tracking-tighter text-slate-900 leading-tight truncate">{p.property_name || "Unnamed Project"}</h3>
                                    <p className="text-slate-500 text-xs font-bold mt-1 truncate">📍 {p.location || "Location Unknown"}</p>
                                    <div className="mt-4 flex justify-between items-end pt-4 border-t border-slate-100">
                                        <div>
                                            <div className="text-[9px] text-gray-400 font-bold uppercase tracking-widest">Starting Price</div>
                                            <div className="text-lg font-black text-blue-900">{p.price || "On Request"}</div>
                                        </div>
                                        <button className="bg-slate-900 text-white text-[10px] font-bold px-4 py-2 rounded-lg hover:bg-blue-600 transition">View Full Details</button>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>

                    {/* THE FRONT-END STYLE MODAL FOR ADMINS */}
                    {selectedProperty && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4">
                            <div className="absolute inset-0 bg-black/80 backdrop-blur-sm" onClick={() => setSelectedProperty(null)}></div>
                            <div className="bg-white rounded-[30px] md:rounded-[40px] w-full max-w-4xl max-h-[95vh] overflow-hidden relative z-10 animate-fadeIn flex flex-col shadow-2xl">
                                <div className="overflow-y-auto w-full hide-scroll">
                                    <button onClick={() => setSelectedProperty(null)} className="absolute top-4 right-4 md:top-6 md:right-6 bg-slate-900/80 text-white w-10 h-10 rounded-full z-20 font-bold hover:bg-black transition flex items-center justify-center backdrop-blur-md">✕</button>
                                    
                                    {/* Gallery Header */}
                                    <div className="flex overflow-x-auto snap-x snap-mandatory h-64 md:h-96 bg-slate-100 hide-scroll">
                                        {(() => {
                                            const cover = selectedProperty['cover-image'];
                                            const galRaw = selectedProperty['gallery-images'];
                                            const imgs = (typeof galRaw === 'string' && galRaw.length > 5) ? galRaw.split(',').map(l => l.trim()) : [];
                                            const allImgs = [cover, ...imgs].filter(i => i && !i.includes('undefined')); 
                                            return allImgs.length > 0 ? allImgs.map((img, idx) => (
                                                <img key={idx} src={img} className="w-full h-full object-cover shrink-0 snap-center" />
                                            )) : <div className="w-full h-full flex items-center justify-center font-bold text-slate-400">No Images Available</div>;
                                        })()}
                                    </div>

                                    <div className="p-6 md:p-10">
                                        {/* Header Info */}
                                        <div className="flex flex-col md:flex-row justify-between mb-8 border-b border-gray-100 pb-8">
                                            <div>
                                                <div className="text-[10px] md:text-xs font-bold text-blue-600 uppercase tracking-widest mb-1">{selectedProperty.property_type || 'Property'} • {selectedProperty.construction_sta || 'Status'}</div>
                                                <h1 className="text-3xl md:text-4xl font-black uppercase tracking-tighter leading-tight text-slate-900">{selectedProperty.property_name || 'Property Details'}</h1>
                                                <p className="text-gray-500 text-sm md:text-lg italic mt-1">📍 {selectedProperty.location || 'Bengaluru'} • <span className="text-blue-600 font-bold uppercase tracking-widest text-[10px] md:text-sm">{selectedProperty.approval ? `${selectedProperty.approval} APPROVED` : 'VERIFIED'}</span></p>
                                            </div>
                                            <div className="text-left md:text-right mt-4 md:mt-0 flex flex-col items-start md:items-end">
                                                <div className="text-slate-900 font-black text-3xl md:text-4xl italic tracking-tighter">{selectedProperty.price || 'On Request'}</div>
                                                <div className="bg-slate-900 text-white px-3 py-1.5 rounded-lg text-[10px] md:text-xs font-black uppercase tracking-widest mt-2 shadow-sm">{selectedProperty.bhk || '-'} BHK Config</div>
                                            </div>
                                        </div>

                                        {/* Basic Grid */}
                                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4 bg-slate-50 p-6 rounded-2xl md:rounded-3xl mb-8 border border-slate-100">
                                            <div><span className="text-[9px] md:text-[10px] text-gray-400 font-bold uppercase block mb-1">Builder</span><span className="font-bold text-xs md:text-sm text-slate-800">{selectedProperty.builder_name || "N/A"}</span></div>
                                            <div><span className="text-[9px] md:text-[10px] text-gray-400 font-bold uppercase block mb-1">Total Units</span><span className="font-bold text-xs md:text-sm text-slate-800">{selectedProperty.total_units || "N/A"}</span></div>
                                            <div><span className="text-[9px] md:text-[10px] text-gray-400 font-bold uppercase block mb-1">Possession</span><span className="font-bold text-xs md:text-sm text-slate-800">{formatDate(selectedProperty.possession_date)}</span></div>
                                            <div><span className="text-[9px] md:text-[10px] text-gray-400 font-bold uppercase block mb-1">Status</span><span className="font-bold text-xs md:text-sm text-slate-800">{selectedProperty.construction_sta || "N/A"}</span></div>
                                        </div>

                                        {/* Highlights & Amenities */}
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-8 md:gap-10 mb-10">
                                            {selectedProperty.usp_s && (
                                                <div>
                                                    <h3 className="text-xs font-black text-slate-900 uppercase tracking-widest mb-4 border-b border-gray-100 pb-2">Project Highlights</h3>
                                                    <ul className="list-disc pl-5 text-xs md:text-sm space-y-2 text-gray-600 leading-relaxed">
                                                        {String(selectedProperty.usp_s).split('\n').filter(u => u.trim() !== "").map((u, i) => <li key={i}>{u.trim()}</li>)}
                                                    </ul>
                                                </div>
                                            )}
                                            {selectedProperty.amenities && (
                                                <div>
                                                    <h3 className="text-xs font-black text-slate-900 uppercase tracking-widest mb-4 border-b border-gray-100 pb-2">Amenities</h3>
                                                    <p className="text-xs md:text-sm text-gray-600 leading-relaxed bg-white p-4 rounded-xl border border-gray-100 italic whitespace-pre-line">{String(selectedProperty.amenities)}</p>
                                                </div>
                                            )}
                                        </div>

                                        {/* YELLOW & BLUE ADMIN BLOCKS (Matches User Screenshot) */}
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
                                            <div className="bg-[#fffbeb] border border-[#fde68a] p-5 md:p-6 rounded-2xl md:rounded-3xl text-[#92400e]">
                                                <h4 className="text-[9px] md:text-[10px] font-black uppercase tracking-widest mb-2">Commission & Payout</h4>
                                                <p className="text-3xl md:text-4xl font-black">{formatPercent(selectedProperty.commision_deta)}</p>
                                                <p className="text-xs md:text-sm font-medium italic mt-2 opacity-80">N/A</p> {/* Payout details usually go here if you had a column for it */}
                                            </div>
                                            <div className="bg-[#f0f9ff] border border-[#bae6fd] p-5 md:p-6 rounded-2xl md:rounded-3xl text-[#0369a1]">
                                                <h4 className="text-[9px] md:text-[10px] font-black uppercase tracking-widest mb-3">Internal Details</h4>
                                                <p className="text-xs md:text-sm font-bold mb-1">POC: {selectedProperty.point_of_contact || "N/A"}</p>
                                                <p className="text-xs md:text-sm font-bold">Availability: {selectedProperty.availability || "N/A"}</p>
                                            </div>
                                        </div>

                                        {/* ACTION BUTTONS (Matches User Screenshot) */}
                                        <div className="bg-slate-50 border border-slate-100 p-6 md:p-8 rounded-2xl md:rounded-[35px]">
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                                <a href={selectedProperty.website_link || "#"} target="_blank" className="bg-white border border-slate-200 p-4 rounded-xl md:rounded-2xl text-[10px] font-black text-center uppercase tracking-widest shadow-sm hover:bg-slate-100 transition">Builder Site</a>
                                                <a href={String(selectedProperty.lead_registration).includes('@') ? `mailto:${selectedProperty.lead_registration}` : selectedProperty.lead_registration || "#"} target="_blank" className="bg-[#0f172a] text-white p-4 rounded-xl md:rounded-2xl text-[10px] font-black text-center uppercase tracking-widest shadow-md hover:bg-blue-600 transition">Register Lead</a>
                                                <a href={selectedProperty.brochure || "#"} target="_blank" className="bg-white border border-slate-200 p-4 rounded-xl md:rounded-2xl text-[10px] font-black text-center uppercase tracking-widest shadow-sm hover:bg-slate-100 transition">Share Brochure</a>
                                                <a href={selectedProperty.cost_sheet || "#"} target="_blank" className="bg-white border border-slate-200 p-4 rounded-xl md:rounded-2xl text-[10px] font-black text-center uppercase tracking-widest shadow-sm hover:bg-slate-100 transition">Share Cost Sheet</a>
                                                <a href={selectedProperty.map_link || "#"} target="_blank" className="bg-white border border-slate-200 p-4 rounded-xl md:rounded-2xl text-[10px] font-black text-center uppercase tracking-widest shadow-sm md:col-span-2 hover:bg-slate-100 transition">Share Location Map</a>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // --- UPDATED PROPERTY FORM (Matches Exact DB Schema) ---
        function PropertyForm({ scriptUrl, supabase }) {
            const [form, setForm] = useState({
                property_name: '', builder_name: '', location: '', price: '', bhk: '', 
                super_built_up_a: '', possession_date: '', construction_sta: '',
                amenities: '', brochure: '', 'cover-image': '', usp_s: '',
                commision_deta: '', point_of_contact: '', website_link: '', map_link: '',
                lead_registration: '', cost_sheet: '', property_type: '', total_units: '', availability: ''
            });

            async function upload(e, field) {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = async () => {
                    const res = await fetch(scriptUrl, { method: "POST", body: JSON.stringify({ base64: reader.result.split(',')[1], type: file.type, name: file.name, propertyName: form.property_name }) });
                    const result = await res.json();
                    if(result.status === "success") setForm(f => ({ ...f, [field]: result.url }));
                };
            }

            async function save() {
                const { error } = await supabase.from('properties').insert([form]);
                if (!error) {
                    alert("Listing Live!");
                    setForm({ property_name: '', builder_name: '', location: '', price: '', bhk: '', super_built_up_a: '', possession_date: '', construction_sta: '', amenities: '', brochure: '', 'cover-image': '', usp_s: '', commision_deta: '', point_of_contact: '', website_link: '', map_link: '', lead_registration: '', cost_sheet: '', property_type: '', total_units: '', availability: ''});
                } else alert(error.message);
            }

            return (
                <div className="bg-white p-6 md:p-10 rounded-3xl shadow-sm max-w-4xl mx-auto space-y-6 animate-fadeIn border border-slate-200">
                    <h2 className="text-2xl font-black uppercase italic border-b pb-4 text-blue-900">Master Property Form</h2>
                    
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <input placeholder="Property Name" className="p-4 bg-slate-50 border rounded-xl font-bold text-sm" onChange={e => setForm({...form, property_name: e.target.value})} value={form.property_name}/>
                        <input placeholder="Builder Name" className="p-4 bg-slate-50 border rounded-xl font-bold text-sm" onChange={e => setForm({...form, builder_name: e.target.value})} value={form.builder_name}/>
                        <select className="p-4 bg-slate-50 border rounded-xl font-bold text-sm" onChange={e => setForm({...form, property_type: e.target.value})} value={form.property_type}>
                            <option value="">Property Type</option><option>Apartment</option><option>Villa</option><option>Plot</option>
                        </select>
                        <input placeholder="Location" className="p-4 bg-slate-50 border rounded-xl font-bold text-sm" onChange={e => setForm({...form, location: e.target.value})} value={form.location}/>
                        <input placeholder="Price (e.g. 1.2 Cr)" className="p-4 bg-slate-50 border rounded-xl font-bold text-sm" onChange={e => setForm({...form, price: e.target.value})} value={form.price}/>
                        <input placeholder="BHK (e.g. 2, 3 BHK)" className="p-4 bg-slate-50 border rounded-xl font-bold text-sm" onChange={e => setForm({...form, bhk: e.target.value})} value={form.bhk}/>
                        <input placeholder="Area (e.g. 1200 SqFt)" className="p-4 bg-slate-50 border rounded-xl font-bold text-sm" onChange={e => setForm({...form, super_built_up_a: e.target.value})} value={form.super_built_up_a}/>
                        <input type="date" className="p-4 bg-slate-50 border rounded-xl font-bold text-sm" onChange={e => setForm({...form, possession_date: e.target.value})} value={form.possession_date}/>
                        <select className="p-4 bg-slate-50 border rounded-xl font-bold text-sm" onChange={e => setForm({...form, construction_sta: e.target.value})} value={form.construction_sta}>
                            <option value="">Status</option><option>Ready to Move</option><option>Under Construction</option><option>New Launch</option>
                        </select>
                        <input placeholder="Total Units" className="p-4 bg-slate-50 border rounded-xl font-bold text-sm" onChange={e => setForm({...form, total_units: e.target.value})} value={form.total_units}/>
                        <input placeholder="Availability" className="p-4 bg-slate-50 border rounded-xl font-bold text-sm" onChange={e => setForm({...form, availability: e.target.value})} value={form.availability}/>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <textarea placeholder="USPs (Line by Line)" rows="3" className="p-4 bg-slate-50 border rounded-xl font-bold text-sm resize-none" onChange={e => setForm({...form, usp_s: e.target.value})} value={form.usp_s}/>
                        <textarea placeholder="Amenities (Comma separated)" rows="3" className="p-4 bg-slate-50 border rounded-xl font-bold text-sm resize-none" onChange={e => setForm({...form, amenities: e.target.value})} value={form.amenities}/>
                    </div>

                    {/* Admin Specific Links */}
                    <div className="p-6 bg-slate-900 rounded-2xl grid grid-cols-1 md:grid-cols-2 gap-4 border-t-4 border-blue-500">
                        <h3 className="col-span-1 md:col-span-2 text-[10px] font-black text-blue-400 uppercase tracking-widest">Admin Backend Links & Data</h3>
                        <input placeholder="Commission %" className="p-4 bg-slate-800 text-white border border-slate-700 rounded-xl font-bold text-sm" onChange={e => setForm({...form, commision_deta: e.target.value})} value={form.commision_deta}/>
                        <input placeholder="POC (Name / Number)" className="p-4 bg-slate-800 text-white border border-slate-700 rounded-xl font-bold text-sm" onChange={e => setForm({...form, point_of_contact: e.target.value})} value={form.point_of_contact}/>
                        <input placeholder="Builder Website Link" className="p-4 bg-slate-800 text-white border border-slate-700 rounded-xl font-bold text-sm" onChange={e => setForm({...form, website_link: e.target.value})} value={form.website_link}/>
                        <input placeholder="Lead Register Link / Email" className="p-4 bg-slate-800 text-white border border-slate-700 rounded-xl font-bold text-sm" onChange={e => setForm({...form, lead_registration: e.target.value})} value={form.lead_registration}/>
                        <input placeholder="Map Link (Google Maps URL)" className="p-4 bg-slate-800 text-white border border-slate-700 rounded-xl font-bold text-sm md:col-span-2" onChange={e => setForm({...form, map_link: e.target.value})} value={form.map_link}/>
                    </div>
                    
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 pt-6 border-t">
                        <div><label className="text-[10px] font-black uppercase mb-2 block text-slate-500">Cover Image</label><input type="file" onChange={e => upload(e, 'cover-image')} className="text-xs"/></div>
                        <div><label className="text-[10px] font-black uppercase mb-2 block text-slate-500">Brochure (PDF)</label><input type="file" onChange={e => upload(e, 'brochure')} className="text-xs"/></div>
                        <div><label className="text-[10px] font-black uppercase mb-2 block text-slate-500">Cost Sheet (PDF)</label><input type="file" onChange={e => upload(e, 'cost_sheet')} className="text-xs"/></div>
                    </div>
                    
                    <button onClick={save} className="w-full bg-blue-600 text-white p-5 rounded-2xl font-black uppercase tracking-widest hover:bg-blue-700 shadow-xl transition">Publish Property</button>
                </div>
            );
        }

        // --- MISC COMPONENTS ---
        function ManualLeadForm({ supabase, onSuccess }) {
            const [form, setForm] = useState({ name: '', phone: '', source: 'Manual' });
            return (
                <div className="space-y-4">
                    <input placeholder="Client Name" className="w-full p-4 bg-slate-50 border rounded-2xl font-bold" onChange={e => setForm({...form, name: e.target.value})} />
                    <input placeholder="Phone Number" className="w-full p-4 bg-slate-50 border rounded-2xl font-bold" onChange={e => setForm({...form, phone: e.target.value})} />
                    <button onClick={async () => { await supabase.from('leads').insert([{ customer_name: form.name, phone_number: form.phone, lead_source: form.source, lead_status: 'Un called' }]); onSuccess(); }} className="w-full bg-blue-600 text-white p-4 rounded-2xl font-black uppercase tracking-widest">Inject Lead</button>
                </div>
            );
        }

        function LoginForm({ supabase }) {
            const [email, setEmail] = useState("");
            const [pass, setPass] = useState("");
            return (
                <div className="min-h-screen bg-slate-950 flex items-center justify-center p-4">
                    <form onSubmit={async (e) => { e.preventDefault(); await supabase.auth.signInWithPassword({ email, password: pass }); }} className="bg-white p-10 rounded-[40px] shadow-2xl w-full max-w-sm text-center border-t-8 border-blue-500">
                        <h1 className="text-3xl font-black italic uppercase mb-8">Horizon CRM</h1>
                        <input type="email" placeholder="Email" className="w-full p-4 bg-slate-100 rounded-2xl mb-4 font-bold outline-none" onChange={e => setEmail(e.target.value)} />
                        <input type="password" placeholder="Password" className="w-full p-4 bg-slate-100 rounded-2xl mb-8 font-bold outline-none" onChange={e => setPass(e.target.value)} />
                        <button className="w-full bg-blue-600 text-white font-black py-4 rounded-2xl uppercase tracking-widest shadow-lg">Login</button>
                    </form>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AdminApp />);
    </script>
</body>
</html>
