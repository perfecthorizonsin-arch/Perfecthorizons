<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfect Horizons | Property Portal</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fadeIn { animation: fadeIn 0.15s ease-out forwards; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const LEAD_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzKmjXhueUDqDJ2HwalGBuRk4WfEEx-ruYZJ5IeSCIMxSDuEwaCAMspYBq-zMrFzmY/exec';
        const API_URL = "https://script.google.com/macros/s/AKfycbzORxItxvqlsIUokcs7JCKjFASG2e3y_CrAT2zuy81aEQvLsVG6Sm6CuuSplgWnWh4/exec";
        const WHATSAPP_NUMBER = "919742353260";
        const ADMIN_PIN = "1234"; 

        // SMART SCANNER: Fixes Google Sheet header typos (like trailing spaces)
        const getVal = (obj, searchKey) => {
            if (!obj) return "";
            if (obj[searchKey] !== undefined && obj[searchKey] !== "") return obj[searchKey];
            const cleanKey = searchKey.trim().toLowerCase();
            for (let k in obj) {
                if (k.trim().toLowerCase() === cleanKey) return obj[k];
            }
            return "";
        };

        const fixImageUrl = (u) => {
            if (!u || typeof u !== 'string') return 'https://via.placeholder.com/800x500?text=No+Image';
            let url = u.split(',')[0].trim();
            let id = url.match(/\/d\/(.*?)\//)?.[1] || url.split('id=')[1];
            return id ? `https://drive.google.com/thumbnail?id=${id}&sz=w1000` : url;
        };

        const formatPercent = (val) => {
            let num = parseFloat(val);
            if (isNaN(num)) return String(val || "0%");
            return (num < 1 && num > 0) ? (num * 100).toFixed(1) + "%" : num + "%";
        };

        const extractPriceInCr = (priceString) => {
            if (!priceString) return 0;
            try {
                const cleanStr = String(priceString).toLowerCase().replace(/,/g, '');
                const numMatch = cleanStr.match(/[0-9.]+/); 
                if (!numMatch) return 0;
                const val = parseFloat(numMatch[0]);
                if (isNaN(val)) return 0;
                if (cleanStr.includes('cr') || cleanStr.includes('crore')) return val;
                if (cleanStr.includes('lac') || cleanStr.includes('lakh')) return val / 100;
                if (val > 100000) return val / 10000000; 
                return 0; 
            } catch(e) { return 0; }
        };

        const formatDate = (ds) => ds ? new Date(ds).toLocaleDateString('en-IN', { month: 'short', year: 'numeric' }) : "N/A";

        function App() {
            const [properties, setProperties] = useState([]);
            const [loading, setLoading] = useState(true);
            const [isAdmin, setIsAdmin] = useState(false);
            const [selectedProperty, setSelectedProperty] = useState(null);
            const [search, setSearch] = useState("");
            const [filters, setFilters] = useState({ bhk: "", status: "", type: "", priceBracket: "" });
            const [showLeadForm, setShowLeadForm] = useState(false);
            const [leadData, setLeadData] = useState({ name: "", phone: "" });
            const [isSubmitting, setIsSubmitting] = useState(false);

            useEffect(() => {
                const urlParams = new URLSearchParams(window.location.search);
                if (urlParams.get("key") === "admin123") setIsAdmin(true);
                
                try { localStorage.removeItem('ph_cache_v19'); } catch(e){} // Clear cache
                
                fetch(API_URL).then(res => res.json()).then(data => {
                    if (Array.isArray(data)) setProperties(data);
                    setLoading(false);
                }).catch(() => setLoading(false));
            }, []);

            const loginAdmin = () => {
                const pin = prompt("Enter Admin PIN:");
                if (pin === ADMIN_PIN) { setIsAdmin(true); alert("Admin Access Granted"); }
                else if (pin) alert("Incorrect PIN");
            };

            const handleLeadSubmit = (e) => {
                e.preventDefault();
                if (!/^[6-9]\d{9}$/.test(leadData.phone)) return alert("Enter valid 10-digit number");
                setIsSubmitting(true);
                fetch(LEAD_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({
                    name: leadData.name, phone: leadData.phone, property: getVal(selectedProperty, "Property Name") || "Unknown"
                })}).then(() => {
                    alert("Interest Registered!");
                    setIsSubmitting(false); setShowLeadForm(false); setLeadData({ name: "", phone: "" });
                });
            };

            const safeProperties = Array.isArray(properties) ? properties : [];
            const filtered = safeProperties.filter(p => {
                if (!p || typeof p !== 'object') return false; 

                const term = search.toLowerCase();
                const pName = String(getVal(p, "Property Name")).toLowerCase();
                const pLoc = String(getVal(p, "Location")).toLowerCase();
                const pBuild = String(getVal(p, "Builder Name")).toLowerCase();
                
                const matchSearch = !term || pName.includes(term) || pLoc.includes(term) || pBuild.includes(term);
                const matchBHK = !filters.bhk || String(getVal(p, "No of BHK's")).includes(filters.bhk);
                const matchStatus = !filters.status || String(getVal(p, "Construction Status")) === filters.status;
                const matchType = !filters.type || String(getVal(p, "Property Type")) === filters.type;
                
                const priceInCr = extractPriceInCr(getVal(p, "Price"));
                let matchPrice = true;
                
                if (filters.priceBracket) {
                    if (priceInCr > 0) {
                        if (filters.priceBracket === "under1") matchPrice = priceInCr < 1;
                        else if (filters.priceBracket === "1-2") matchPrice = priceInCr >= 1 && priceInCr < 2;
                        else if (filters.priceBracket === "2-3") matchPrice = priceInCr >= 2 && priceInCr < 3;
                        else if (filters.priceBracket === "3-4") matchPrice = priceInCr >= 3 && priceInCr < 4;
                        else if (filters.priceBracket === "4-5") matchPrice = priceInCr >= 4 && priceInCr < 5;
                        else if (filters.priceBracket === "5plus") matchPrice = priceInCr >= 5;
                    } else { matchPrice = false; }
                }

                return matchSearch && matchBHK && matchStatus && matchType && matchPrice;
            });

            if (loading && safeProperties.length === 0) return <div className="h-screen flex items-center justify-center font-black text-blue-900 animate-pulse text-2xl uppercase italic">Perfect Horizons</div>;

            return (
                <div className="min-h-screen flex flex-col">
                    <nav className="bg-white shadow-sm px-6 py-5 sticky top-0 z-40 border-b flex justify-between items-center">
                        <h1 className="text-xl font-black text-blue-900 tracking-tighter uppercase italic">Perfect Horizons</h1>
                        {isAdmin && <span className="bg-green-600 text-white text-[10px] px-3 py-1 rounded-full font-bold uppercase tracking-widest shadow-sm">Admin Mode</span>}
                    </nav>

                    <main className="max-w-7xl mx-auto p-4 md:p-8 flex-grow w-full">
                        <div className="bg-white p-6 rounded-3xl shadow-sm border mb-8 space-y-4">
                            <input type="text" placeholder="Search Location, Project or Builder..." className="w-full bg-gray-50 border-none rounded-2xl p-4 text-sm outline-none ring-1 ring-gray-200 focus:ring-2 focus:ring-blue-600 transition" value={search} onChange={e => setSearch(e.target.value)} />
                            <div className="grid grid-cols-2 md:grid-cols-5 gap-3">
                                <select className="bg-gray-50 p-3 rounded-xl text-xs font-bold outline-none" value={filters.bhk} onChange={e => setFilters({...filters, bhk: e.target.value})}>
                                    <option value="">BHK</option>
                                    {[1,2,3,4,5].map(n => <option key={n} value={n}>{n} BHK</option>)}
                                </select>
                                <select className="bg-gray-50 p-3 rounded-xl text-xs font-bold outline-none" value={filters.status} onChange={e => setFilters({...filters, status: e.target.value})}>
                                    <option value="">Status</option>
                                    <option value="Ready to Move">Ready to Move</option>
                                    <option value="Under Construction">Under Construction</option>
                                    <option value="New Launch">New Launch</option>
                                </select>
                                <select className="bg-gray-50 p-3 rounded-xl text-xs font-bold outline-none" value={filters.type} onChange={e => setFilters({...filters, type: e.target.value})}>
                                    <option value="">Type</option>
                                    <option value="Apartment">Apartment</option>
                                    <option value="Villa">Villa</option>
                                    <option value="Plot">Plot</option>
                                </select>
                                <select className="bg-gray-50 p-3 rounded-xl text-xs font-bold outline-none" value={filters.priceBracket} onChange={e => setFilters({...filters, priceBracket: e.target.value})}>
                                    <option value="">Budget</option>
                                    <option value="under1">Under 1 Cr</option>
                                    <option value="1-2">1 - 2 Cr</option>
                                    <option value="2-3">2 - 3 Cr</option>
                                    <option value="3-4">3 - 4 Cr</option>
                                    <option value="4-5">4 - 5 Cr</option>
                                    <option value="5plus">5 Cr & Above</option>
                                </select>
                                <button onClick={() => {setSearch(""); setFilters({bhk:"", status:"", type:"", priceBracket:""})}} className="text-red-500 font-black text-[10px] uppercase tracking-widest border border-red-100 rounded-xl hover:bg-red-50 transition">Clear All</button>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                            {filtered.map((p, i) => (
                                <div key={i} onClick={() => setSelectedProperty(p)} className="bg-white rounded-[35px] shadow-sm border overflow-hidden hover:shadow-2xl transition-all cursor-pointer group flex flex-col">
                                    <div className="relative h-56 overflow-hidden shrink-0 bg-gray-100">
                                        <img src={fixImageUrl(getVal(p, "Cover Image"))} className="w-full h-full object-cover group-hover:scale-105 transition duration-500" />
                                    </div>
                                    <div className="p-7 flex-grow flex flex-col justify-between">
                                        <div>
                                            <div className="text-[9px] font-bold text-blue-600 uppercase tracking-[0.2em] mb-1">{getVal(p, "Property Type") || 'Residential'}</div>
                                            <h2 className="text-xl font-black uppercase tracking-tighter text-gray-900 leading-tight mb-2">
                                                {getVal(p, "Property Name") || "Listed Property"}
                                            </h2>
                                            <p className="text-gray-400 text-sm mb-4 italic text-justify">📍 {getVal(p, "Location") || "Location on Request"}</p>
                                        </div>
                                        <div className="flex justify-between items-end border-t pt-4 mt-auto">
                                            <span className="text-blue-600 font-black text-2xl italic tracking-tighter">{getVal(p, "Price") || "On Request"}</span>
                                            <span className="bg-blue-600 text-white px-3 py-1 rounded-lg text-[11px] font-black uppercase tracking-widest shadow-md">{getVal(p, "No of BHK's") || "-"} BHK</span>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </main>

                    {selectedProperty && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
                            <div className="absolute inset-0 bg-black/80 backdrop-blur-sm" onClick={() => setSelectedProperty(null)}></div>
                            <div className="bg-white rounded-[40px] w-full max-w-4xl max-h-[90vh] overflow-hidden relative z-10 animate-fadeIn flex flex-col shadow-2xl">
                                <div className="overflow-y-auto w-full hide-scroll">
                                    <button onClick={() => setSelectedProperty(null)} className="absolute top-6 right-6 bg-black/50 text-white w-10 h-10 rounded-full z-20 font-bold hover:bg-black transition flex items-center justify-center">✕</button>
                                    
                                    <div className="flex overflow-x-auto snap-x snap-mandatory h-72 md:h-96 bg-gray-100 hide-scroll">
                                        {(() => {
                                            const cover = fixImageUrl(getVal(selectedProperty, "Cover Image"));
                                            const galRaw = getVal(selectedProperty, "Images and short videos \nif any") || getVal(selectedProperty, "Images and short videos");
                                            const imgs = (typeof galRaw === 'string' && galRaw.length > 5) ? galRaw.split(',').map(l => fixImageUrl(l.trim())) : [];
                                            const allImgs = [cover, ...imgs].filter(i => i && !i.includes('undefined')); 
                                            return allImgs.map((img, idx) => (
                                                <img key={idx} src={img} className="w-full h-full object-cover shrink-0 snap-center" />
                                            ));
                                        })()}
                                    </div>

                                    <div className="p-6 md:p-10">
                                        <div className="flex flex-col md:flex-row justify-between mb-8 border-b pb-8">
                                            <div>
                                                <div className="text-xs font-bold text-blue-600 uppercase tracking-widest mb-1">{getVal(selectedProperty, "Property Type") || 'Property'} • {getVal(selectedProperty, "Construction Status") || 'Status'}</div>
                                                <h1 className="text-4xl font-black uppercase tracking-tighter leading-tight">{getVal(selectedProperty, "Property Name") || 'Property Details'}</h1>
                                                <p className="text-gray-500 text-lg italic">📍 {getVal(selectedProperty, "Location") || 'Bengaluru'} • <span className="text-blue-900 font-bold uppercase tracking-widest text-sm">{getVal(selectedProperty, "Approval") ? `${getVal(selectedProperty, "Approval")} APPROVED` : 'VERIFIED'}</span></p>
                                            </div>
                                            <div className="text-left md:text-right mt-4 md:mt-0 flex flex-col items-start md:items-end">
                                                <div className="text-blue-600 font-black text-4xl italic tracking-tighter">{getVal(selectedProperty, "Price") || 'On Request'}</div>
                                                <div className="bg-yellow-400 text-yellow-900 border border-yellow-500 px-3 py-1.5 rounded-lg text-xs font-black uppercase tracking-widest mt-2 shadow-sm">{getVal(selectedProperty, "No of BHK's") || '-'} BHK Config</div>
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4 bg-gray-50 p-6 rounded-3xl mb-8 border border-gray-100">
                                            <div><span className="text-[10px] text-gray-400 font-bold uppercase block mb-1">Builder</span><span className="font-bold text-sm">{getVal(selectedProperty, "Builder Name") || "N/A"}</span></div>
                                            <div><span className="text-[10px] text-gray-400 font-bold uppercase block mb-1">Total Units</span><span className="font-bold text-sm">{getVal(selectedProperty, "Total Units") || getVal(selectedProperty, "Total Units ") || "N/A"}</span></div>
                                            <div><span className="text-[10px] text-gray-400 font-bold uppercase block mb-1">Possession</span><span className="font-bold text-sm">{formatDate(getVal(selectedProperty, "Possession Date"))}</span></div>
                                            <div><span className="text-[10px] text-gray-400 font-bold uppercase block mb-1">Status</span><span className="font-bold text-sm">{getVal(selectedProperty, "Construction Status") || "N/A"}</span></div>
                                        </div>

                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-10 mb-10">
                                            {getVal(selectedProperty, "USP's") && (
                                                <div>
                                                    <h3 className="text-xs font-black text-blue-900 uppercase tracking-widest mb-4 border-b pb-2">Project Highlights</h3>
                                                    <ul className="list-disc pl-5 text-sm space-y-2 text-gray-700 leading-relaxed">
                                                        {String(getVal(selectedProperty, "USP's")).split('\n').filter(u => u.trim() !== "").map((u, i) => <li key={i}>{u.trim()}</li>)}
                                                    </ul>
                                                </div>
                                            )}
                                            {getVal(selectedProperty, "Amenities") && (
                                                <div>
                                                    <h3 className="text-xs font-black text-blue-900 uppercase tracking-widest mb-4 border-b pb-2">Amenities</h3>
                                                    <p className="text-sm text-gray-700 leading-relaxed bg-gray-50 p-4 rounded-2xl border border-gray-100 italic whitespace-pre-line">{String(getVal(selectedProperty, "Amenities"))}</p>
                                                </div>
                                            )}
                                        </div>

                                        {isAdmin && (
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
                                                <div className="bg-yellow-50 border-2 border-yellow-100 p-6 rounded-3xl text-yellow-900">
                                                    <h4 className="text-[10px] font-black uppercase tracking-widest mb-2">Commission & Payout</h4>
                                                    <p className="text-3xl font-black">{formatPercent(getVal(selectedProperty, "Commission % and Payout info"))}</p>
                                                    <p className="text-sm font-medium italic mt-1">{getVal(selectedProperty, "Payout info") || "N/A"}</p>
                                                </div>
                                                <div className="bg-blue-50 border-2 border-blue-100 p-6 rounded-3xl text-blue-900">
                                                    <h4 className="text-[10px] font-black uppercase tracking-widest mb-2">Internal Details</h4>
                                                    <p className="text-sm font-bold">POC: {getVal(selectedProperty, "Point of contact") || "N/A"}</p>
                                                    <p className="text-sm font-bold">Availability: {getVal(selectedProperty, "Availability") || "Check master sheet"}</p>
                                                </div>
                                            </div>
                                        )}

                                        <div className="bg-gray-100 p-8 rounded-[35px]">
                                            {isAdmin ? (
                                                <div className="grid grid-cols-2 gap-3">
                                                    <a href={getVal(selectedProperty, "Website Link") || "#"} target="_blank" className="bg-white border p-4 rounded-2xl text-[10px] font-black text-center uppercase shadow-sm">Builder Site</a>
                                                    <a href={String(getVal(selectedProperty, "Lead registration Link or email ID—")).includes('@') ? `mailto:${getVal(selectedProperty, "Lead registration Link or email ID—")}` : getVal(selectedProperty, "Lead registration Link or email ID—") || "#"} target="_blank" className="bg-blue-900 text-white p-4 rounded-2xl text-[10px] font-black text-center uppercase shadow-lg">Register Lead</a>
                                                    <a href={getVal(selectedProperty, "Brochure") || "#"} target="_blank" className="bg-white border p-4 rounded-2xl text-[10px] font-black text-center uppercase shadow-sm">Share Brochure</a>
                                                    <a href={getVal(selectedProperty, "Cost Sheet") || "#"} target="_blank" className="bg-white border p-4 rounded-2xl text-[10px] font-black text-center uppercase shadow-sm">Share Cost Sheet</a>
                                                    <a href={getVal(selectedProperty, "Map Link") || "#"} target="_blank" className="bg-white border p-4 rounded-2xl text-[10px] font-black text-center uppercase shadow-sm col-span-2">Share Location Map</a>
                                                </div>
                                            ) : (
                                                <div className="flex flex-col gap-4">
                                                    <button onClick={() => setShowLeadForm(true)} className="bg-blue-600 text-white font-black py-5 rounded-2xl uppercase tracking-widest shadow-xl shadow-blue-200 hover:bg-blue-700 transition active:scale-95">I am Interested</button>
                                                    <div className="grid grid-cols-3 gap-3">
                                                        <a href={`https://wa.me/${WHATSAPP_NUMBER}?text=Hi Tharun, I request the Brochure for ${getVal(selectedProperty, "Property Name") || "this property"}`} target="_blank" className="bg-white border p-4 rounded-xl text-[9px] font-black text-center uppercase shadow-sm">Request Brochure</a>
                                                        <a href={`https://wa.me/${WHATSAPP_NUMBER}?text=Hi Tharun, I request the Cost Sheet for ${getVal(selectedProperty, "Property Name") || "this property"}`} target="_blank" className="bg-white border p-4 rounded-xl text-[9px] font-black text-center uppercase shadow-sm">Request Cost Sheet</a>
                                                        <a href={`https://wa.me/${WHATSAPP_NUMBER}?text=Hi Tharun, I request a Callback for ${getVal(selectedProperty, "Property Name") || "this property"}`} target="_blank" className="bg-white border p-4 rounded-xl text-[9px] font-black text-center uppercase shadow-sm">Request Callback</a>
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    <footer className="bg-slate-900 text-white p-12 mt-auto text-justify">
                        <div className="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-12 text-justify">
                            <div className="text-justify">
                                <h3 className="text-xl font-black italic uppercase text-blue-500 mb-4 tracking-tighter underline decoration-blue-500/30 text-left">About Us</h3>
                                <p className="text-slate-400 text-sm leading-relaxed max-w-xl text-left">We are authorized channel partners dedicated to providing buyers with unbiased, expert advice. Our mission is to simplify the real estate landscape by offering transparent guidance, ensuring you make an informed decision for your dream home or investment.</p>
                                <button onClick={loginAdmin} className="mt-8 text-[9px] text-slate-600 uppercase font-black tracking-widest hover:text-blue-400 transition text-left block">Management Login</button>
                            </div>
                            <div className="space-y-4 text-left">
                                <h3 className="text-xs font-black text-slate-500 uppercase tracking-[0.2em] mb-4 text-left">Official Contact</h3>
                                <p className="text-sm">📞 +91 9742353260</p>
                                <a href="mailto:perfecthorizons.in@gmail.com" className="text-sm underline block text-blue-400 decoration-blue-400/30">✉️ perfecthorizons.in@gmail.com</a>
                                <p className="text-sm text-slate-500 italic">📍 Bengaluru, Karnataka</p>
                            </div>
                        </div>
                    </footer>

                    {showLeadForm && (
                        <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-black/90 backdrop-blur-md" onClick={() => setShowLeadForm(false)}>
                            <div className="bg-white rounded-[40px] p-10 w-full max-w-sm animate-fadeIn shadow-2xl text-center" onClick={e => e.stopPropagation()}>
                                <h2 className="text-3xl font-black text-blue-900 mb-6 italic tracking-tighter uppercase">Enquiry</h2>
                                <form onSubmit={handleLeadSubmit} className="space-y-4 text-left">
                                    <label className="text-[10px] font-black uppercase text-gray-400 ml-2 tracking-widest">Full Name</label>
                                    <input type="text" placeholder="Enter Name" required className="w-full border-none bg-gray-50 p-4 rounded-2xl outline-none font-bold text-sm focus:ring-2 focus:ring-blue-600 transition" value={leadData.name} onChange={e => setLeadData({...leadData, name: e.target.value})} />
                                    <label className="text-[10px] font-black uppercase text-gray-400 ml-2 tracking-widest">Mobile Number</label>
                                    <input type="tel" placeholder="10 Digits" required className="w-full border-none bg-gray-50 p-4 rounded-2xl outline-none font-bold text-sm focus:ring-2 focus:ring-blue-600 transition" value={leadData.phone} onChange={e => setLeadData({...leadData, phone: e.target.value})} />
                                    <button disabled={isSubmitting} type="submit" className="w-full bg-blue-600 text-white font-black py-4 rounded-2xl uppercase tracking-widest shadow-lg mt-4 active:scale-95 transition-transform">{isSubmitting ? "Processing..." : "Submit Interest"}</button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
