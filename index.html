<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfect Horizons | Property Portal</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fadeIn { animation: fadeIn 0.15s ease-out forwards; }
        .dropdown-arrow {
            display: inline-block;
            margin-left: 4px;
            width: 0;
            height: 0;
            vertical-align: middle;
            border-top: 4px solid currentColor;
            border-right: 4px solid transparent;
            border-left: 4px solid transparent;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const LEAD_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzKmjXhueUDqDJ2HwalGBuRk4WfEEx-ruYZJ5IeSCIMxSDuEwaCAMspYBq-zMrFzmY/exec';
        const API_URL = "https://script.google.com/macros/s/AKfycbzORxItxvqlsIUokcs7JCKjFASG2e3y_CrAT2zuy81aEQvLsVG6Sm6CuuSplgWnWh4/exec";
        const WHATSAPP_NUMBER = "919742353260";
        const ADMIN_PIN = "1234"; 

        const getVal = (obj, searchKey) => {
            if (!obj) return "";
            if (obj[searchKey] !== undefined && obj[searchKey] !== "") return obj[searchKey];
            const cleanKey = searchKey.trim().toLowerCase();
            for (let k in obj) {
                if (k.trim().toLowerCase() === cleanKey) return obj[k];
            }
            return "";
        };

        const fixImageUrl = (u) => {
            if (!u || typeof u !== 'string') return 'https://via.placeholder.com/800x500?text=No+Image';
            let url = u.split(',')[0].trim();
            let id = url.match(/\/d\/(.*?)\//)?.[1] || url.split('id=')[1];
            return id ? `https://drive.google.com/thumbnail?id=${id}&sz=w1000` : url;
        };

        const formatPercent = (val) => {
            let num = parseFloat(val);
            if (isNaN(num)) return String(val || "0%");
            return (num < 1 && num > 0) ? (num * 100).toFixed(1) + "%" : num + "%";
        };

        const extractPriceInCr = (priceString) => {
            if (!priceString) return 0;
            try {
                const cleanStr = String(priceString).toLowerCase().replace(/,/g, '');
                const numMatch = cleanStr.match(/[0-9.]+/); 
                if (!numMatch) return 0;
                const val = parseFloat(numMatch[0]);
                if (isNaN(val)) return 0;
                if (cleanStr.includes('cr') || cleanStr.includes('crore')) return val;
                if (cleanStr.includes('lac') || cleanStr.includes('lakh')) return val / 100;
                if (val > 100000) return val / 10000000; 
                return 0; 
            } catch(e) { return 0; }
        };

        const formatDate = (ds) => ds ? new Date(ds).toLocaleDateString('en-IN', { month: 'short', year: 'numeric' }) : "N/A";

        function App() {
            const [properties, setProperties] = useState([]);
            const [loading, setLoading] = useState(true);
            const [isAdmin, setIsAdmin] = useState(false);
            const [selectedProperty, setSelectedProperty] = useState(null);
            const [search, setSearch] = useState("");
            const [filters, setFilters] = useState({ bhk: "", status: "", type: "", priceBracket: "" });
            const [showLeadForm, setShowLeadForm] = useState(false);
            const [leadData, setLeadData] = useState({ name: "", phone: "" });
            const [isSubmitting, setIsSubmitting] = useState(false);
            
            const [activePage, setActivePage] = useState("home"); 
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            
            // BLOGS STATE
            const [blogs, setBlogs] = useState([]);
            const [loadingBlogs, setLoadingBlogs] = useState(false);

            useEffect(() => {
                const urlParams = new URLSearchParams(window.location.search);
                if (urlParams.get("key") === "admin123") setIsAdmin(true);
                
                try { localStorage.removeItem('ph_cache_v19'); } catch(e){} 
                
                fetch(API_URL).then(res => res.json()).then(data => {
                    if (Array.isArray(data)) setProperties(data);
                    setLoading(false);
                }).catch(() => setLoading(false));
            }, []);

            // AUTOMATED BLOG FETCHER
            useEffect(() => {
                if (activePage === 'blogs' && blogs.length === 0) {
                    setLoadingBlogs(true);
                    // Fetches top Bengaluru Real Estate news via RSS
                    const rssUrl = encodeURIComponent('https://news.google.com/rss/search?q=Bengaluru+real+estate+property&hl=en-IN&gl=IN&ceid=IN:en');
                    fetch(`https://api.rss2json.com/v1/api.json?rss_url=${rssUrl}`)
                        .then(res => res.json())
                        .then(data => {
                            if (data && data.items) {
                                // Keep only the top 6 news articles to look clean
                                setBlogs(data.items.slice(0, 6)); 
                            }
                            setLoadingBlogs(false);
                        })
                        .catch(() => setLoadingBlogs(false));
                }
            }, [activePage]);

            const loginAdmin = () => {
                const pin = prompt("Enter Admin PIN:");
                if (pin === ADMIN_PIN) { setIsAdmin(true); alert("Admin Access Granted"); }
                else if (pin) alert("Incorrect PIN");
            };

            const handleLeadSubmit = (e) => {
                e.preventDefault();
                if (!/^[6-9]\d{9}$/.test(leadData.phone)) return alert("Enter valid 10-digit number");
                setIsSubmitting(true);
                fetch(LEAD_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({
                    name: leadData.name, phone: leadData.phone, property: getVal(selectedProperty, "Property Name") || "Unknown"
                })}).then(() => {
                    alert("Interest Registered!");
                    setIsSubmitting(false); setShowLeadForm(false); setLeadData({ name: "", phone: "" });
                });
            };

            const safeProperties = Array.isArray(properties) ? properties : [];
            const filtered = safeProperties.filter(p => {
                if (!p || typeof p !== 'object') return false; 

                const term = search.toLowerCase();
                const pName = String(getVal(p, "Property Name")).toLowerCase();
                const pLoc = String(getVal(p, "Location")).toLowerCase();
                const pBuild = String(getVal(p, "Builder Name")).toLowerCase();
                
                const matchSearch = !term || pName.includes(term) || pLoc.includes(term) || pBuild.includes(term);
                const matchBHK = !filters.bhk || String(getVal(p, "No of BHK's")).includes(filters.bhk);
                const matchStatus = !filters.status || String(getVal(p, "Construction Status")) === filters.status;
                const matchType = !filters.type || String(getVal(p, "Property Type")) === filters.type;
                
                const priceInCr = extractPriceInCr(getVal(p, "Price"));
                let matchPrice = true;
                
                if (filters.priceBracket) {
                    if (priceInCr > 0) {
                        if (filters.priceBracket === "under1") matchPrice = priceInCr < 1;
                        else if (filters.priceBracket === "1-2") matchPrice = priceInCr >= 1 && priceInCr < 2;
                        else if (filters.priceBracket === "2-3") matchPrice = priceInCr >= 2 && priceInCr < 3;
                        else if (filters.priceBracket === "3-4") matchPrice = priceInCr >= 3 && priceInCr < 4;
                        else if (filters.priceBracket === "4-5") matchPrice = priceInCr >= 4 && priceInCr < 5;
                        else if (filters.priceBracket === "5plus") matchPrice = priceInCr >= 5;
                    } else { matchPrice = false; }
                }

                return matchSearch && matchBHK && matchStatus && matchType && matchPrice;
            });

            const navTo = (page) => {
                setActivePage(page);
                setIsMobileMenuOpen(false);
                window.scrollTo(0,0);
            };

            if (loading && safeProperties.length === 0) return <div className="h-screen flex items-center justify-center font-black text-blue-900 animate-pulse text-2xl uppercase italic">Perfect Horizons</div>;

            return (
                <div className="min-h-screen flex flex-col">
                    <nav className="bg-white shadow-sm sticky top-0 z-40 border-b">
                        <div className="max-w-7xl mx-auto px-4 md:px-8 flex justify-between items-center py-4 md:py-5">
                            <h1 onClick={() => navTo('home')} className="text-xl md:text-2xl font-black text-blue-900 tracking-tighter uppercase italic cursor-pointer hover:text-blue-700 transition">Perfect Horizons</h1>
                            
                            <div className="md:hidden flex items-center gap-4">
                                {isAdmin && <span className="bg-green-600 text-white text-[9px] px-2 py-1 rounded-full font-bold uppercase tracking-widest shadow-sm">Admin</span>}
                                <button onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)} className="text-gray-900 focus:outline-none">
                                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                                </button>
                            </div>

                            <div className="hidden md:flex gap-8 items-center">
                                <button onClick={() => navTo('home')} className={`text-xs font-black uppercase tracking-widest transition ${activePage === 'home' ? 'text-blue-600' : 'text-gray-500 hover:text-gray-900'}`}>Properties</button>
                                
                                <div className="relative group cursor-pointer py-2">
                                    <span className={`text-xs font-black uppercase tracking-widest transition flex items-center ${['about-us', 'our-journey', 'our-management'].includes(activePage) ? 'text-blue-600' : 'text-gray-500 hover:text-gray-900'}`}>
                                        About <span className="dropdown-arrow"></span>
                                    </span>
                                    <div className="absolute hidden group-hover:block top-full left-0 mt-0 w-48 bg-white border border-gray-100 shadow-xl rounded-xl overflow-hidden z-50 animate-fadeIn">
                                        <div onClick={() => navTo('about-us')} className="p-4 hover:bg-blue-50 text-xs font-bold cursor-pointer text-gray-700 hover:text-blue-600 transition">About Us</div>
                                        <div onClick={() => navTo('our-journey')} className="p-4 hover:bg-blue-50 text-xs font-bold cursor-pointer text-gray-700 hover:text-blue-600 transition border-t border-gray-50">Our Journey</div>
                                        <div onClick={() => navTo('our-management')} className="p-4 hover:bg-blue-50 text-xs font-bold cursor-pointer text-gray-700 hover:text-blue-600 transition border-t border-gray-50">Our Management</div>
                                    </div>
                                </div>

                                <div className="relative group cursor-pointer py-2">
                                    <span className={`text-xs font-black uppercase tracking-widest transition flex items-center ${['what-we-do', 'what-we-dont-do'].includes(activePage) ? 'text-blue-600' : 'text-gray-500 hover:text-gray-900'}`}>
                                        Services <span className="dropdown-arrow"></span>
                                    </span>
                                    <div className="absolute hidden group-hover:block top-full left-0 mt-0 w-48 bg-white border border-gray-100 shadow-xl rounded-xl overflow-hidden z-50 animate-fadeIn">
                                        <div onClick={() => navTo('what-we-do')} className="p-4 hover:bg-blue-50 text-xs font-bold cursor-pointer text-gray-700 hover:text-blue-600 transition">What We Do</div>
                                        <div onClick={() => navTo('what-we-dont-do')} className="p-4 hover:bg-blue-50 text-xs font-bold cursor-pointer text-gray-700 hover:text-blue-600 transition border-t border-gray-50">What We Don't Do</div>
                                    </div>
                                </div>

                                <button onClick={() => navTo('blogs')} className={`text-xs font-black uppercase tracking-widest transition ${activePage === 'blogs' ? 'text-blue-600' : 'text-gray-500 hover:text-gray-900'}`}>Blogs</button>
                                
                                {isAdmin && <span className="bg-green-600 text-white text-[10px] px-3 py-1 rounded-full font-bold uppercase tracking-widest shadow-sm">Admin Mode</span>}
                            </div>
                        </div>

                        {isMobileMenuOpen && (
                            <div className="md:hidden bg-white border-t border-gray-100 py-4 px-4 space-y-4 shadow-lg absolute w-full left-0 animate-fadeIn z-50">
                                <div onClick={() => navTo('home')} className="text-xs font-black uppercase tracking-widest text-gray-700 py-2 border-b border-gray-50">Properties</div>
                                <div className="text-xs font-black uppercase tracking-widest text-gray-400 py-2">-- About --</div>
                                <div onClick={() => navTo('about-us')} className="text-xs font-bold text-gray-700 pl-4 py-2 border-b border-gray-50">About Us</div>
                                <div onClick={() => navTo('our-journey')} className="text-xs font-bold text-gray-700 pl-4 py-2 border-b border-gray-50">Our Journey</div>
                                <div onClick={() => navTo('our-management')} className="text-xs font-bold text-gray-700 pl-4 py-2 border-b border-gray-50">Our Management</div>
                                <div className="text-xs font-black uppercase tracking-widest text-gray-400 py-2 mt-4">-- Services --</div>
                                <div onClick={() => navTo('what-we-do')} className="text-xs font-bold text-gray-700 pl-4 py-2 border-b border-gray-50">What We Do</div>
                                <div onClick={() => navTo('what-we-dont-do')} className="text-xs font-bold text-gray-700 pl-4 py-2 border-b border-gray-50">What We Don't Do</div>
                                <div onClick={() => navTo('blogs')} className="text-xs font-black uppercase tracking-widest text-gray-700 py-2 mt-4">Blogs</div>
                            </div>
                        )}
                    </nav>

                    <main className="max-w-7xl mx-auto p-4 md:p-8 flex-grow w-full animate-fadeIn">
                        
                        {activePage === 'home' && (
                            <>
                                <div className="bg-white p-4 md:p-6 rounded-2xl md:rounded-3xl shadow-sm border mb-6 md:mb-8 space-y-2 md:space-y-4">
                                    <input type="text" placeholder="Search Location, Project or Builder..." className="w-full bg-gray-50 border-none rounded-xl md:rounded-2xl p-3 md:p-4 text-xs md:text-sm outline-none ring-1 ring-gray-200 focus:ring-2 focus:ring-blue-600 transition" value={search} onChange={e => setSearch(e.target.value)} />
                                    <div className="grid grid-cols-2 md:grid-cols-5 gap-2 md:gap-3">
                                        <select className="bg-gray-50 p-2 md:p-3 rounded-lg md:rounded-xl text-[10px] md:text-xs font-bold outline-none" value={filters.bhk} onChange={e => setFilters({...filters, bhk: e.target.value})}>
                                            <option value="">BHK</option>
                                            {[1,2,3,4,5].map(n => <option key={n} value={n}>{n} BHK</option>)}
                                        </select>
                                        <select className="bg-gray-50 p-2 md:p-3 rounded-lg md:rounded-xl text-[10px] md:text-xs font-bold outline-none" value={filters.status} onChange={e => setFilters({...filters, status: e.target.value})}>
                                            <option value="">Status</option>
                                            <option value="Ready to Move">Ready to Move</option>
                                            <option value="Under Construction">Under Construction</option>
                                            <option value="New Launch">New Launch</option>
                                        </select>
                                        <select className="bg-gray-50 p-2 md:p-3 rounded-lg md:rounded-xl text-[10px] md:text-xs font-bold outline-none" value={filters.type} onChange={e => setFilters({...filters, type: e.target.value})}>
                                            <option value="">Type</option>
                                            <option value="Apartment">Apartment</option>
                                            <option value="Villa">Villa</option>
                                            <option value="Plot">Plot</option>
                                        </select>
                                        <select className="bg-gray-50 p-2 md:p-3 rounded-lg md:rounded-xl text-[10px] md:text-xs font-bold outline-none" value={filters.priceBracket} onChange={e => setFilters({...filters, priceBracket: e.target.value})}>
                                            <option value="">Budget</option>
                                            <option value="under1">Under 1 Cr</option>
                                            <option value="1-2">1 - 2 Cr</option>
                                            <option value="2-3">2 - 3 Cr</option>
                                            <option value="3-4">3 - 4 Cr</option>
                                            <option value="4-5">4 - 5 Cr</option>
                                            <option value="5plus">5 Cr & Above</option>
                                        </select>
                                        <button onClick={() => {setSearch(""); setFilters({bhk:"", status:"", type:"", priceBracket:""})}} className="col-span-2 md:col-span-1 text-red-500 font-black text-[10px] uppercase tracking-widest border border-red-100 rounded-lg md:rounded-xl hover:bg-red-50 transition py-2 md:py-0">Clear All</button>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                                    {filtered.map((p, i) => (
                                        <div key={i} onClick={() => setSelectedProperty(p)} className="bg-white rounded-[35px] shadow-sm border overflow-hidden hover:shadow-2xl transition-all cursor-pointer group flex flex-col">
                                            <div className="relative h-56 overflow-hidden shrink-0 bg-gray-100">
                                                <img src={fixImageUrl(getVal(p, "Cover Image"))} className="w-full h-full object-cover group-hover:scale-105 transition duration-500" />
                                            </div>
                                            <div className="p-7 flex-grow flex flex-col justify-between">
                                                <div>
                                                    <div className="text-[9px] font-bold text-blue-600 uppercase tracking-[0.2em] mb-1">{getVal(p, "Property Type") || 'Residential'}</div>
                                                    <h2 className="text-xl font-black uppercase tracking-tighter text-gray-900 leading-tight mb-2">
                                                        {getVal(p, "Property Name") || "Listed Property"}
                                                    </h2>
                                                    <p className="text-gray-400 text-sm mb-4 italic text-justify">📍 {getVal(p, "Location") || "Location on Request"}</p>
                                                </div>
                                                <div className="flex justify-between items-end border-t pt-4 mt-auto">
                                                    <span className="text-blue-600 font-black text-2xl italic tracking-tighter">{getVal(p, "Price") || "On Request"}</span>
                                                    <span className="bg-blue-600 text-white px-3 py-1 rounded-lg text-[11px] font-black uppercase tracking-widest shadow-md">{getVal(p, "No of BHK's") || "-"} BHK</span>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </>
                        )}

                        {activePage === 'about-us' && (
                            <div className="bg-white p-8 md:p-16 rounded-[40px] shadow-xl border">
                                <h1 className="text-3xl md:text-5xl font-black text-blue-900 tracking-tighter uppercase italic mb-8 border-b-4 border-blue-500 pb-4 inline-block">About Perfect Horizons</h1>
                                <div className="text-gray-600 text-sm md:text-base leading-relaxed space-y-6 max-w-3xl">
                                    <p className="text-xl font-medium text-blue-900">We are authorized channel partners dedicated to providing home buyers with unbiased, expert advice in the complex Bengaluru real estate market.</p>
                                    <p>Our mission is to simplify the real estate journey by offering transparent guidance, ensuring you make an informed and safe decision for your dream home or investment. We cut through the marketing noise to give you the raw facts, pros, and cons of every property.</p>
                                    <p>Partnering with us means you have a dedicated advocate on your side, negotiating the best prices and ensuring a smooth, hassle-free transaction from your first site visit to the final handover.</p>
                                </div>
                            </div>
                        )}

                        {activePage === 'our-journey' && (
                            <div className="bg-white p-8 md:p-16 rounded-[40px] shadow-xl border">
                                <h1 className="text-3xl md:text-5xl font-black text-blue-900 tracking-tighter uppercase italic mb-4">Our Journey</h1>
                                <p className="text-gray-400 font-bold uppercase tracking-widest mb-12">Built on Trust & Transparency</p>
                                
                                <div className="space-y-12 max-w-3xl">
                                    <div className="border-l-4 border-blue-600 pl-6">
                                        <h3 className="text-xl font-black text-gray-900 uppercase">The Beginning</h3>
                                        <p className="text-gray-600 mt-2 leading-relaxed">Perfect Horizons was founded out of a necessity. We noticed a gap in the market where home buyers were overwhelmed by aggressive sales pitches and a lack of clear, honest data. We started with a single goal: to protect the buyer.</p>
                                    </div>
                                    <div className="border-l-4 border-blue-600 pl-6">
                                        <h3 className="text-xl font-black text-gray-900 uppercase">Building Partnerships</h3>
                                        <p className="text-gray-600 mt-2 leading-relaxed">We slowly built strong relationships with Bengaluru's most reputable Tier-1 and Tier-2 builders. By maintaining strict standards for the properties we list, we earned the trust of our early clients, leading to a network built almost entirely on referrals.</p>
                                    </div>
                                    <div className="border-l-4 border-blue-600 pl-6">
                                        <h3 className="text-xl font-black text-gray-900 uppercase">Looking Forward</h3>
                                        <p className="text-gray-600 mt-2 leading-relaxed">Today, we are proud to be a fast-growing, tech-enabled channel partner. We continue to innovate our services while staying true to our core mission: putting the homebuyer's needs first.</p>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activePage === 'our-management' && (
                            <div className="bg-white p-8 md:p-16 rounded-[40px] shadow-xl border flex flex-col md:flex-row gap-12 items-center">
                                <div className="w-full md:w-1/2">
                                    <h1 className="text-3xl md:text-5xl font-black text-blue-900 tracking-tighter uppercase italic mb-4">Meet Tharun</h1>
                                    <h3 className="text-xs font-black text-gray-400 uppercase tracking-[0.2em] mb-8">Lead Real Estate Advisor</h3>
                                    
                                    <div className="text-gray-600 text-sm md:text-base leading-relaxed space-y-6">
                                        <p>Hi, I'm Tharun. I built Perfect Horizons because I saw how confusing and overwhelming buying a home in Bengaluru can be.</p>
                                        <p>As your dedicated channel partner, I don't just show you brochures. I provide you with complete, unbiased analysis of floor plans, builder histories, and locality growth potential.</p>
                                        <p>My goal isn't just to help you buy a house; it's to ensure you make the smartest, safest financial decision for your family's future.</p>
                                    </div>

                                    <a href={`https://wa.me/${WHATSAPP_NUMBER}?text=Hi Tharun, I would like to schedule a consultation.`} target="_blank" className="inline-block mt-8 bg-blue-600 text-white font-black py-4 px-8 rounded-2xl uppercase tracking-widest shadow-xl shadow-blue-200 hover:bg-blue-700 transition active:scale-95">
                                        Chat with Tharun
                                    </a>
                                </div>
                                <div className="w-full md:w-1/2 flex justify-center">
                                    <div className="w-64 h-64 md:w-96 md:h-96 bg-gray-100 rounded-[40px] border-8 border-white shadow-2xl flex items-center justify-center text-6xl text-gray-300 overflow-hidden relative">
                                        <div className="absolute inset-0 bg-blue-900/5"></div>
                                        <span className="z-10">👨‍💼</span>
                                        <div className="absolute bottom-4 left-0 w-full text-center text-[10px] font-bold text-gray-400 uppercase tracking-widest z-10">Your Advisor</div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activePage === 'what-we-do' && (
                            <div className="bg-white p-8 md:p-16 rounded-[40px] shadow-xl border">
                                <h1 className="text-3xl md:text-5xl font-black text-blue-900 tracking-tighter uppercase italic mb-12 text-center">What We Do</h1>
                                
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-8 max-w-5xl mx-auto">
                                    <div className="bg-gray-50 p-8 rounded-3xl border border-gray-100 hover:shadow-lg transition">
                                        <div className="text-4xl mb-4">🏠</div>
                                        <h4 className="font-black uppercase tracking-widest text-lg mb-3 text-blue-900">Property Curation</h4>
                                        <p className="text-gray-600 text-sm leading-relaxed">We filter out the noise. We only show you properties that match your specific budget, lifestyle requirements, and have clear legal titles.</p>
                                    </div>
                                    <div className="bg-gray-50 p-8 rounded-3xl border border-gray-100 hover:shadow-lg transition">
                                        <div className="text-4xl mb-4">💰</div>
                                        <h4 className="font-black uppercase tracking-widest text-lg mb-3 text-blue-900">Price Negotiation</h4>
                                        <p className="text-gray-600 text-sm leading-relaxed">We sit across the table from the builders on your behalf. Leveraging our industry volume, we secure discounts and waivers you cannot get walking in alone.</p>
                                    </div>
                                    <div className="bg-gray-50 p-8 rounded-3xl border border-gray-100 hover:shadow-lg transition">
                                        <div className="text-4xl mb-4">🚗</div>
                                        <h4 className="font-black uppercase tracking-widest text-lg mb-3 text-blue-900">End-to-End Logistics</h4>
                                        <p className="text-gray-600 text-sm leading-relaxed">From arranging free cab pickups for site visits to helping coordinate your home loan paperwork, we handle the heavy lifting.</p>
