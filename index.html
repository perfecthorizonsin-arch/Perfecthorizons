<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfect Horizons | Property Dashboard</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
        .animate-fadeIn { animation: fadeIn 0.15s ease-out forwards; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- CONFIGURATION ---
        const LEAD_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzKmjXhueUDqDJ2HwalGBuRk4WfEEx-ruYZJ5IeSCIMxSDuEwaCAMspYBq-zMrFzmY/exec';
        const WHATSAPP_NUMBER = "919742353260";
        const API_URL = "https://script.google.com/macros/s/AKfycbzORxItxvqlsIUokcs7JCKjFASG2e3y_CrAT2zuy81aEQvLsVG6Sm6CuuSplgWnWh4/exec";

        const fixImageUrl = (rawUrl) => {
            if (!rawUrl || typeof rawUrl !== 'string' || rawUrl.trim() === '') return 'https://via.placeholder.com/800x500?text=No+Image';
            let url = rawUrl.split(',')[0].trim();
            let id = null;
            if (url.includes('drive.google.com/file/d/')) {
                const match = url.match(/\/d\/(.*?)\//);
                if (match && match[1]) id = match[1];
            } else if (url.includes('drive.google.com/open?id=')) {
                id = url.split('id=')[1];
            }
            return id ? `https://drive.google.com/thumbnail?id=${id}&sz=w1000` : url;
        };

        function App() {
            const [properties, setProperties] = useState([]);
            const [loading, setLoading] = useState(true);
            const [filters, setFilters] = useState({ bhk: "", location: "" });
            const [selectedProperty, setSelectedProperty] = useState(null);
            const [showLeadForm, setShowLeadForm] = useState(false);
            const [leadData, setLeadData] = useState({ name: "", phone: "" });
            const [isSubmitting, setIsSubmitting] = useState(false);

            const urlParams = new URLSearchParams(window.location.search);
            const isAdmin = urlParams.get("key") === "admin123";

            useEffect(() => {
                // INSTANT LOAD LOGIC
                const cached = localStorage.getItem('ph_cache');
                if (cached) {
                    setProperties(JSON.parse(cached));
                    setLoading(false);
                }

                // Background update from Google Sheet
                fetch(API_URL)
                    .then(res => res.json())
                    .then(data => {
                        setProperties(data);
                        setLoading(false);
                        localStorage.setItem('ph_cache', JSON.stringify(data));
                    })
                    .catch(() => setLoading(false));
            }, []);

            const handleLeadSubmit = (e) => {
                e.preventDefault();
                const phoneRegex = /^[6-9]\d{9}$/;
                if (!phoneRegex.test(leadData.phone)) {
                    alert("Please enter a valid 10-digit mobile number.");
                    return;
                }
                
                setIsSubmitting(true);
                fetch(LEAD_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({
                        name: leadData.name,
                        phone: leadData.phone,
                        property: selectedProperty ? selectedProperty["Property Name"] : "General Inquiry"
                    })
                }).then(() => {
                    alert("Thank you! Tharun will contact you shortly.");
                    setIsSubmitting(false); setShowLeadForm(false); setLeadData({ name: "", phone: "" });
                }).catch(() => {
                    alert("Error submitting. Please try again.");
                    setIsSubmitting(false);
                });
            };

            const filteredProperties = properties.filter(p => {
                const locMatch = !filters.location || (p.Location && p.Location.toLowerCase().includes(filters.location.toLowerCase()));
                const bhkMatch = !filters.bhk || String(p["No of BHK's"] || "").includes(filters.bhk);
                return locMatch && bhkMatch;
            });

            if (loading && properties.length === 0) return (
                <div className="flex h-screen items-center justify-center bg-white">
                    <div className="text-center">
                        <div className="text-2xl font-black text-blue-900 animate-pulse italic uppercase tracking-tighter">Perfect Horizons</div>
                        <div className="mt-2 text-[10px] text-blue-400 font-bold tracking-widest uppercase">Loading Properties...</div>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen pb-20 animate-fadeIn">
                    <nav className="bg-white shadow-sm px-6 py-5 sticky top-0 z-40 border-b flex justify-between items-center">
                        <h1 className="text-xl font-black text-blue-900 tracking-tighter uppercase italic">Perfect Horizons</h1>
                        {isAdmin && <span className="bg-green-600 text-white text-[10px] px-3 py-1 rounded-full font-bold">ADMIN ACTIVE</span>}
                    </nav>

                    <main className="max-w-7xl mx-auto p-4 md:p-8">
                        <div className="bg-white p-6 rounded-2xl shadow-sm border mb-8 flex flex-wrap gap-4 items-end">
                            <div className="flex-1 min-w-[200px]">
                                <label className="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-1 block">Location</label>
                                <input type="text" placeholder="Search area..." className="w-full border-gray-200 border rounded-xl p-3 text-sm focus:ring-2 focus:ring-blue-600 outline-none" value={filters.location} onChange={e => setFilters({...filters, location: e.target.value})} />
                            </div>
                            <div className="w-32">
                                <label className="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-1 block">BHK</label>
                                <select className="w-full border-gray-200 border rounded-xl p-3 text-sm focus:ring-2 focus:ring-blue-600 outline-none bg-white" value={filters.bhk} onChange={e => setFilters({...filters, bhk: e.target.value})}>
                                    <option value="">All</option>
                                    {[1,2,3,4,5].map(n => <option key={n} value={n}>{n} BHK</option>)}
                                </select>
                            </div>
                            <button onClick={() => setFilters({bhk:"", location:""})} className="text-blue-600 text-sm font-bold h-12 px-4 hover:bg-blue-50 rounded-xl transition">Clear</button>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                            {filteredProperties.map((p, i) => (
                                <div key={i} onClick={() => setSelectedProperty(p)} className="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-2xl transition-all duration-300 cursor-pointer flex flex-col">
                                    <div className="relative h-56 shrink-0 bg-gray-100">
                                        <img src={fixImageUrl(p["Cover Image"])} className="w-full h-full object-cover" />
                                        <div className="absolute top-4 left-4 bg-blue-600 text-white px-3 py-1 rounded-lg text-[10px] font-bold uppercase">{p["No of BHK's"] || '-'} BHK</div>
                                    </div>
                                    <div className="p-6 flex-grow flex flex-col justify-between">
                                        <div>
                                            <h2 className="text-xl font-bold text-gray-900 leading-tight mb-1 line-clamp-2">{p["Property Name"] || "New Launch"}</h2>
                                            <p className="text-gray-500 text-sm flex items-center gap-1 mb-4">📍 {p.Location || 'Location unavailable'}</p>
                                        </div>
                                        <div className="text-blue-600 font-black text-2xl">{p.Price || "Price on Request"}</div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </main>

                    {/* Property Detail Modal */}
                    {selectedProperty && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6">
                            <div className="absolute inset-0 bg-black/70 backdrop-blur-sm" onClick={() => setSelectedProperty(null)}></div>
                            <div className="bg-white rounded-3xl w-full max-w-4xl max-h-[90vh] overflow-hidden flex flex-col relative z-10 shadow-2xl animate-fadeIn">
                                <button onClick={() => setSelectedProperty(null)} className="absolute top-4 right-4 bg-black/50 hover:bg-black text-white w-10 h-10 rounded-full flex items-center justify-center font-bold z-20">✕</button>
                                
                                <div className="overflow-y-auto w-full hide-scroll">
                                    <img src={fixImageUrl(selectedProperty["Cover Image"])} className="w-full h-72 sm:h-96 object-cover" />
                                    
                                    <div className="p-6 sm:p-10">
                                        <div className="flex flex-col sm:flex-row justify-between items-start gap-4 mb-8 border-b pb-6">
                                            <div>
                                                <h1 className="text-3xl font-black text-gray-900 leading-tight">{selectedProperty["Property Name"]}</h1>
                                                <p className="text-gray-500 text-lg">📍 {selectedProperty.Location}</p>
                                            </div>
                                            <div className="text-left sm:text-right">
                                                <div className="text-blue-600 font-black text-3xl">{selectedProperty.Price}</div>
                                            </div>
                                        </div>

                                        {/* ADMIN SECTION */}
                                        {isAdmin && (
                                            <div className="bg-yellow-50 border-2 border-yellow-200 p-6 rounded-2xl mb-8">
                                                <h3 className="text-yellow-800 font-black text-[10px] uppercase tracking-widest mb-2">Confidential Payout Details</h3>
                                                <p className="text-yellow-900 text-sm leading-relaxed whitespace-pre-line">
                                                    {selectedProperty["Commission Details"] || "Update sheet to see payout info."}
                                                </p>
                                            </div>
                                        )}

                                        <div className="bg-blue-50 p-6 rounded-2xl border border-blue-100 mb-6">
                                            {isAdmin ? (
                                                <div className="grid grid-cols-2 gap-3">
                                                    <a href={selectedProperty["Brochure"] || '#'} target="_blank" className="bg-white text-blue-700 py-3 rounded-xl text-xs font-black text-center shadow-sm">Brochure</a>
                                                    <a href={selectedProperty["Cost Sheet"] || '#'} target="_blank" className="bg-white text-blue-700 py-3 rounded-xl text-xs font-black text-center shadow-sm">Cost Sheet</a>
                                                </div>
                                            ) : (
                                                <div className="flex flex-col gap-3">
                                                    <button onClick={() => setShowLeadForm(true)} className="bg-blue-600 text-white font-black py-4 rounded-xl shadow-lg text-sm uppercase tracking-widest">I am Interested</button>
                                                    <div className="grid grid-cols-3 gap-2">
                                                        <a href={`https://wa.me/${WHATSAPP_NUMBER}?text=Hi%20Tharun,%20send%20brochure%20for%20${selectedProperty["Property Name"]}`} target="_blank" className="bg-white text-gray-700 border p-3 rounded-xl text-[10px] font-bold text-center uppercase">Brochure</a>
                                                        <a href={`https://wa.me/${WHATSAPP_NUMBER}?text=Hi%20Tharun,%20send%20cost%20sheet%20for%20${selectedProperty["Property Name"]}`} target="_blank" className="bg-white text-gray-700 border p-3 rounded-xl text-[10px] font-bold text-center uppercase">Cost Sheet</a>
                                                        <a href={`https://wa.me/${WHATSAPP_NUMBER}?text=Hi%20Tharun,%20call%20me%20back%20for%20${selectedProperty["Property Name"]}`} target="_blank" className="bg-white text-gray-700 border p-3 rounded-xl text-[10px] font-bold text-center uppercase">Callback</a>
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* LEAD FORM */}
                    {showLeadForm && (
                        <div className="fixed inset-0 z-[60] flex items-center justify-center p-4">
                            <div className="absolute inset-0 bg-black/80 backdrop-blur-md" onClick={() => setShowLeadForm(false)}></div>
                            <div className="bg-white rounded-3xl p-8 w-full max-w-sm relative z-10 animate-fadeIn shadow-2xl">
                                <h2 className="text-2xl font-black text-blue-900 mb-2">Interested?</h2>
                                <p className="text-gray-500 text-sm mb-6">Tharun will contact you shortly.</p>
                                <form onSubmit={handleLeadSubmit} className="space-y-4">
                                    <input type="text" placeholder="Your Name" required className="w-full border p-4 rounded-xl outline-none" value={leadData.name} onChange={e => setLeadData({...leadData, name: e.target.value})} />
                                    <input type="tel" placeholder="Mobile Number" required className="w-full border p-4 rounded-xl outline-none" value={leadData.phone} onChange={e => setLeadData({...leadData, phone: e.target.value})} />
                                    <button disabled={isSubmitting} type="submit" className="w-full bg-blue-600 text-white font-black py-4 rounded-xl shadow-lg">
                                        {isSubmitting ? "Submitting..." : "SUBMIT DETAILS"}
                                    </button>
                                    <p onClick={() => setShowLeadForm(false)} className="text-center text-gray-400 text-xs cursor-pointer">Cancel</p>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
