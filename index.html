<!DOCTYPE html>

<head>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fadeIn { animation: fadeIn 0.15s ease-out forwards; }
    </style>
    
    <script>
        window.addEventListener('error', function(event) {
            document.body.innerHTML = '<div style="background:#fee2e2; color:#991b1b; padding:2rem; font-family:sans-serif; height:100vh;">' +
                '<h2 style="font-weight:900; font-size:1.5rem; margin-bottom:1rem; text-transform:uppercase;">🚨 Syntax Error Detected</h2>' +
                '<p style="font-family:monospace; padding:1rem; background:#fecaca; border-radius:0.5rem; font-weight:bold;">' + event.message + '</p>' +
                '<p style="margin-top:1rem; font-size:0.875rem;">Screenshot this to Tharun.</p></div>';
        });
    </script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- ERROR BOUNDARY: Catches React Runtime Errors ---
        class ErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { hasError: false, errorInfo: null }; }
            static getDerivedStateFromError(error) { return { hasError: true, errorInfo: error }; }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="h-screen bg-red-50 text-red-900 p-8 font-sans flex flex-col justify-center items-center text-center">
                            <h2 className="text-3xl font-black mb-4 uppercase">Portal Crash Detected</h2>
                            <div className="bg-white p-6 rounded-2xl shadow-sm border-2 border-red-200 font-mono text-sm mb-6 text-left w-full max-w-2xl">
                                {this.state.errorInfo ? this.state.errorInfo.toString() : "Unknown Error"}
                            </div>
                            <p className="text-sm font-bold bg-red-200 px-4 py-2 rounded-lg">Please send a screenshot of this exact screen back!</p>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

            if (!u || typeof u !== 'string') return 'https://via.placeholder.com/800x500?text=No+Image';
            let url = u.split(',')[0].trim();
            let id = url.match(/\/d\/(.*?)\//)?.[1] || url.split('id=')[1];
            return id ? `https://drive.google.com/thumbnail?id=${id}&sz=w1000` : url;
        };

        const formatPercent = (val) => {
            if (!val) return "0%";
            let num = parseFloat(val);
            if (isNaN(num)) return String(val);
            return (num < 1 && num > 0) ? (num * 100).toFixed(1) + "%" : num + "%";
        };
