            --blue-light: #eff6ff;

            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border: #e2e8f0;
            --surface: #f8fafc;
        }

        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: var(--font-body);
            background: var(--surface);
            color: var(--text-primary);
            overflow-x: hidden;
            width: 100%;
        }

        h1, h2, h3, h4, h5, h6, .font-display {
            font-family: var(--font-display);
        }

        /* ---- HIDE SCROLLBAR ---- */
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }

        /* ---- ANIMATIONS ---- */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.95); }
            to   { opacity: 1; transform: scale(1); }
        }
        @keyframes shimmer {
            0%   { background-position: -400px 0; }
            100% { background-position: 400px 0; }
        }
        @keyframes pulse-ring {
            0%   { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34,197,94,.5); }
            70%  { transform: scale(1);    box-shadow: 0 0 0 12px rgba(34,197,94,0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34,197,94,0); }
        }
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        @keyframes drawHouse { to { stroke-dashoffset: 0; } }
        @keyframes pulse-fast { 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:.6;transform:scale(.98);} }
        @keyframes countUp { from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);} }

        .animate-fadeUp   { animation: fadeUp  0.4s ease-out forwards; }
        .animate-fadeIn   { animation: fadeIn  0.3s ease-out forwards; }
        .animate-scaleIn  { animation: scaleIn 0.25s ease-out forwards; }
        .animate-marquee  { display: flex; white-space: nowrap; animation: marquee 30s linear infinite; }
        .marquee-container:hover .animate-marquee { animation-play-state: paused; }

        /* ---- SKELETON ---- */
        .skeleton {
            background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
            background-size: 400px 100%;
            animation: shimmer 1.4s ease infinite;
            border-radius: 8px;
        }

        /* ---- SPLASH ---- */
        .splash-title { font-family: var(--font-display); color: #1e3a8a; font-size:2rem; font-weight:800; font-style:italic; text-transform:uppercase; animation: pulse-fast 1.2s ease-in-out infinite; }
        .splash-sub { font-family: var(--font-body); color:#64748b; font-size:.7rem; margin-top:1rem; font-weight:700; letter-spacing:.15em; text-transform:uppercase; }
        .splash-house-path { stroke-dasharray:300; stroke-dashoffset:300; animation: drawHouse 1.5s ease-in-out forwards; }

        /* ---- NAV ---- */
        .navbar { background: rgba(11,17,32,.96); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }

        /* ---- HERO ---- */
        .hero-bg {
            background: linear-gradient(135deg, #0b1120 0%, #0f2040 50%, #0b1120 100%);
            position: relative;
            overflow: hidden;
        }
        .hero-bg::before {
            content: '';
            position: absolute; inset: 0;
            background: radial-gradient(ellipse 80% 60% at 60% 40%, rgba(37,99,235,.18) 0%, transparent 70%),
                        radial-gradient(ellipse 40% 40% at 20% 80%, rgba(245,158,11,.08) 0%, transparent 60%);
        }
        .hero-bg::after {
            content: '';
            position: absolute; inset: 0;
            background-image: radial-gradient(rgba(255,255,255,.04) 1px, transparent 1px);
            background-size: 28px 28px;
        }

        /* ---- SEARCH INPUT ---- */
        .search-input {
            background: rgba(255,255,255,.08);
            border: 1.5px solid rgba(255,255,255,.14);
            color: white;
            transition: all .25s;

            background: rgba(255,255,255,.12);

            box-shadow: 0 0 0 4px rgba(37,99,235,.15);

        /* ---- PROPERTY CARD ---- */

            background: white;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--border);
            transition: transform .3s ease, box-shadow .3s ease;

        /* ---- FILTER PILLS ---- */

            appearance: none;

        input[type=range] { -webkit-appearance:none; background:transparent; width:100%; }

        input[type=range]::-webkit-slider-runnable-track { width:100%; height:4px; cursor:pointer; background:#e2e8f0; border-radius:2px; }

        /* ---- PIE CHART ---- */
        .pie-chart { border-radius: 50%; display: inline-block; }

        /* ---- BOTTOM NAV (mobile) ---- */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            z-index: 45;
            background: rgba(11,17,32,.97);
            backdrop-filter: blur(20px);

            align-items: center;

        .bottom-nav-item {
            display: flex; flex-direction: column; align-items: center;

            padding: 4px 6px;
            color: rgba(255,255,255,.45);
            font-family: var(--font-body);
            font-size: 9px; font-weight: 700;
            letter-spacing: .04em;
            text-transform: uppercase;
            transition: color .2s;
        }
        .bottom-nav-item.active { color: #60a5fa; }
        .bottom-nav-item svg { width: 20px; height: 20px; }

        /* ---- WA BUTTON ---- */
        .wa-btn { animation: pulse-ring 2.5s ease-in-out infinite; }

        /* ---- TRUST BAR ---- */
        .trust-bar {
            background: white;
            border-bottom: 1px solid var(--border);
        }

        /* ---- STICKY MOBILE CTA ---- */
        .mobile-cta-bar {
            position: fixed; bottom: 60px; left: 0; right: 0;
            z-index: 44;
            background: white;
            border-top: 1px solid var(--border);
            padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
            display: flex; gap: 10px;
            box-shadow: 0 -8px 32px rgba(0,0,0,.1);
        }

        /* ---- DROPDOWN ---- */
        .dropdown-arrow { display:inline-block; margin-left:4px; width:0; height:0; vertical-align:middle; border-top:4px solid currentColor; border-right:4px solid transparent; border-left:4px solid transparent; }

        .line-clamp-3 { display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
        .line-clamp-2 { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }

        /* ---- BADGE ---- */
        .badge { display:inline-flex; align-items:center; gap:4px; padding:4px 10px; border-radius:999px; font-size:10px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; }

        /* Page bottom padding for mobile nav */
        .page-content { padding-bottom: 80px; }
        @media (min-width: 768px) { .page-content { padding-bottom: 0; } }

        /* Glass card */
        .glass {
            background: rgba(255,255,255,.06);
            border: 1px solid rgba(255,255,255,.1);
            backdrop-filter: blur(12px);
        }
    </style>
</head>

<script type="text/babel">
    /* ===================== SUPABASE ===================== */

    const getVal = (obj, searchKey) => {

    const formatPercent = (val) => {
        let num = parseFloat(val);
        if (isNaN(num)) return String(val || "0%");

    const extractPriceInCr = (priceString) => {
        if (!priceString) return 0;
        try {
            const cleanStr = String(priceString).toLowerCase().replace(/,/g,'');
            const numMatch = cleanStr.match(/[0-9.]+/);
            if (!numMatch) return 0;
            const val = parseFloat(numMatch[0]);
            if (isNaN(val)) return 0;
            if (cleanStr.includes('cr') || cleanStr.includes('crore')) return val;
            if (cleanStr.includes('lac') || cleanStr.includes('lakh')) return val / 100;
            if (val > 100000) return val / 10000000;
            return 0;
        } catch(e) { return 0; }
    };

    const formatIndianCurrencyCompact = (num) => {
        if (num >= 10000000) return '₹' + (num/10000000).toFixed(2).replace(/\.00$/,'') + ' Cr';
        if (num >= 100000)   return '₹' + (num/100000).toFixed(2).replace(/\.00$/,'') + ' L';
        return new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(num);
    };

    const STATUS_COLOR = {
        'ready to move':      { bg:'#dcfce7', text:'#15803d' },
        'under construction': { bg:'#fef9c3', text:'#a16207' },
        'new launch':         { bg:'#dbeafe', text:'#1d4ed8' },
    };

    const getStatusStyle = (status='') => {
        const key = status.toLowerCase();
        for (let k in STATUS_COLOR) { if (key.includes(k)) return STATUS_COLOR[k]; }
        return { bg:'#f1f5f9', text:'#475569' };

    /* ===================== BLOG DATA ===================== */
    const BLOG_ARTICLES = [
        { id:1, tag:"Legal Guide",    emoji:"⚖️", title:"What is UDS and Why Does it Matter?",           excerpt:"When you buy an apartment, you aren't just buying the flat; you are buying a piece of the land it sits on.",  content:`<p>When purchasing an apartment in Bengaluru, many buyers focus entirely on the super built-up area and the amenities. However, the most critical element of your investment is the <strong>Undivided Share of Land (UDS)</strong>.</p><br/><h3 style="font-weight:800;font-size:1.1rem;color:#1e3a8a;">What is UDS?</h3><p>UDS is your personal share of the land on which the entire apartment complex is built. Since you cannot physically mark out your exact piece of land in a high-rise, it is expressed as a fraction or percentage.</p><br/><h3 style="font-weight:800;font-size:1.1rem;color:#1e3a8a;">Why is it so important?</h3><ul style="list-style-type:disc;margin-left:20px;"><li><strong>Future Resale Value:</strong> The building structure depreciates over time, but the land appreciates. Your property's true resale value is determined by the UDS.</li><li><strong>Redevelopment:</strong> If the building is demolished or redeveloped 40 years from now, your compensation will be based strictly on your UDS.</li></ul><br/><p><strong>The Rule of Thumb:</strong> Always ask the builder for the exact UDS before booking.</p>` },
        { id:2, tag:"Finance Hack",   emoji:"💰", title:"5 Hidden Charges Builders Don't Tell You",      excerpt:"The 'Base Price' is never the final price. From Club House charges to BESCOM deposits, learn the actual landed cost.", content:`<p>You see an ad for a luxury 3BHK for "₹1.2 Cr Onwards." You sit down to book it—only to realize the final cost is suddenly ₹1.45 Cr. What happened?</p><br/><ol style="list-style-type:decimal;margin-left:20px;"><li><strong>BESCOM & BWSSB Charges:</strong> ₹200-₹300 per sq.ft.</li><li><strong>Clubhouse & Amenity Fees:</strong> ₹2 – ₹5 Lakhs one-time.</li><li><strong>Advance Maintenance:</strong> 1-2 years upfront at possession.</li><li><strong>Legal & Documentation Charges:</strong> ₹30k – ₹75k.</li><li><strong>Floor Rise Premium (PLC):</strong> ₹15 – ₹50/sq.ft per floor.</li></ol><br/><p>Always demand a comprehensive <strong>Cost Sheet</strong> before paying any token amount.</p>` },
        { id:3, tag:"Property Types", emoji:"📐", title:"Carpet Area vs. Super Built-up: What You Pay For", excerpt:"Don't be fooled by big numbers. RERA Carpet Area is the only metric that matters for home buyers.", content:`<p>One of the biggest confusions for home buyers is the difference between the area advertised and the actual livable space they get.</p><br/><h3 style="font-weight:800;font-size:1.1rem;color:#1e3a8a;">1. RERA Carpet Area</h3><p>The actual usable floor area inside your apartment. Under RERA, builders <strong>must</strong> quote this.</p><br/><h3 style="font-weight:800;font-size:1.1rem;color:#1e3a8a;">2. Super Built-up Area</h3><p>Includes your unit + proportionate share of common areas. Some builders apply a 30-35% loading factor. A 1000 sq.ft SBA apartment may only be 650 sq.ft livable space.</p><br/><p><strong>Always check the RERA Carpet Area to know what you are actually getting.</strong></p>` },
        { id:4, tag:"Legal Guide",    emoji:"📋", title:"A Khata vs B Khata: The Ultimate Buyer's Guide",  excerpt:"Buying a 'B Khata' property can lead to loan rejections and legal trouble. Here is how to verify.", content:`<p>If you are buying property in Bengaluru, the word "Khata" will come up immediately. It is a BBMP document assessing the property for tax records.</p><br/><h3 style="font-weight:800;font-size:1.1rem;color:#1e3a8a;">A Khata = Legal & Safe</h3><p>Fully approved by BBMP/BDA/BMRDA. Banks will give home loans. You can get building plan approvals.</p><br/><h3 style="font-weight:800;font-size:1.1rem;color:#1e3a8a;">B Khata = Risky</h3><p>Property is in violation of regulations. Nationalized banks will <strong>not</strong> give home loans. Selling later will be extremely difficult.</p><br/><p>Never fall for "we will upgrade it to A Khata later" without verifying with a legal expert.</p>` },
    ];

    const SkeletonCard = () => (
        <div className="prop-card flex flex-col">

    /* ===================== EMI CALCULATOR ===================== */
    const EMICalculator = ({ propertyPriceStr, onApplyAction }) => {
        const extractRaw = (str) => { const v=extractPriceInCr(str); return v>0 ? v*10000000 : 10000000; };
        const propVal = extractRaw(propertyPriceStr);
        const [loanAmount,  setLoanAmount]  = useState(propVal * 0.8);
        const [interestRate,setInterestRate]= useState(8.5);
        const [tenureYears, setTenureYears] = useState(20);

        const { emi, totalInterest, principalPct } = useMemo(() => {
            const p=loanAmount, r=interestRate/12/100, n=tenureYears*12;
            if (!p||!r||!n) return {emi:0,totalInterest:0,principalPct:100};
            const emiVal = (p*r*Math.pow(1+r,n))/(Math.pow(1+r,n)-1);
            const tot = emiVal*n;
            return { emi:Math.round(emiVal), totalInterest:Math.round(tot-p), principalPct:((p/tot)*100).toFixed(1) };
        }, [loanAmount,interestRate,tenureYears]);

        return (
            <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm mt-5">

                    <span className="text-lg">📊</span> EMI Calculator
                </h3>
                <div className="flex items-center gap-5 mb-6">
                    <div className="pie-chart shrink-0 w-16 h-16 shadow-inner" style={{background:`conic-gradient(#2563eb ${principalPct}%, #e2e8f0 ${principalPct}% 100%)`}}></div>
                    <div className="flex flex-col gap-2 w-full text-xs">
                        <div className="flex justify-between"><div className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-blue-600"></span><span className="text-slate-500 font-semibold">Principal</span></div><span className="font-bold">{formatIndianCurrencyCompact(loanAmount)}</span></div>
                        <div className="flex justify-between"><div className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-slate-200"></span><span className="text-slate-500 font-semibold">Interest</span></div><span className="font-bold">{formatIndianCurrencyCompact(totalInterest)}</span></div>
                    </div>
                </div>
                <div className="space-y-5">
                    {[
                        {label:'Loan Amount', val:formatIndianCurrencyCompact(loanAmount), min:1000000, max:50000000, step:100000, state:loanAmount, set:setLoanAmount},
                        {label:'Interest Rate', val:interestRate+'%', min:6, max:15, step:0.1, state:interestRate, set:setInterestRate},
                        {label:'Tenure', val:tenureYears+' Yrs', min:5, max:30, step:1, state:tenureYears, set:setTenureYears},
                    ].map(s=>(

    /* ===================== MAIN APP ===================== */
    function App() {
        const [properties,       setProperties]       = useState([]);
        const [loading,          setLoading]          = useState(true);
        const [isAdmin,          setIsAdmin]          = useState(false);
        const [selectedProperty, setSelectedProperty] = useState(null);
        const [search,           setSearch]           = useState("");
        const [filters,          setFilters]          = useState({bhk:"",status:"",type:"",priceBracket:""});
        const [showLeadForm,     setShowLeadForm]     = useState(false);
        const [leadData,         setLeadData]         = useState({name:"",phone:"",email:""});
        const [isSubmitting,     setIsSubmitting]     = useState(false);
        const [activePage,       setActivePage]       = useState(()=>window.location.hash.replace('#','')||'home');
        const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
        const [activeBlog,       setActiveBlog]       = useState(null);
        const [legalModal,       setLegalModal]       = useState(null);
        const [mobileAboutOpen,  setMobileAboutOpen]  = useState(false);
        const [mobileServicesOpen,setMobileServicesOpen]=useState(false);
        const [showMobileSearch, setShowMobileSearch] = useState(false);
        const [showMobileFilter, setShowMobileFilter] = useState(false);

        useEffect(()=>{
            const params = new URLSearchParams(window.location.search);
            if (params.get("key")==="admin123") setIsAdmin(true);

            const onHash = () => {
                const h = window.location.hash.replace('#','');
                setActivePage(h||'home');
                if(h!=='home') setSelectedProperty(null);
                if(h!=='blogs') setActiveBlog(null);
                setIsMobileMenuOpen(false);
            };
            window.addEventListener('hashchange',onHash);

            (async()=>{
                try {
                    const {data,error} = await supabase.from('properties').select('*').or('is_live.eq.true,is_live.is.null');
                    if (!error) setProperties(data||[]);
                } catch(e){console.error(e);}
                finally{setLoading(false);}
            })();

            return ()=>window.removeEventListener('hashchange',onHash);
        },[]);

        const handleLeadSubmit = async (dataToSubmit, projectName, actionType="General Enquiry", event=null) => {
            if (event) event.preventDefault();
            const data    = dataToSubmit||leadData;
            const project = projectName||"General Enquiry";
            const source  = actionType==='brochure'?"Website - Brochure Download":actionType==='cost_sheet'?"Website - Cost Sheet":actionType==='apply_now'?"Website - EMI Apply":"Website - General";
            if (!/^[6-9]\d{9}$/.test(data.phone)){alert("Enter valid 10-digit number");return false;}
            if (!dataToSubmit) setIsSubmitting(true);
            try {
                const {error} = await supabase.from('leads').insert([{
                    customer_name:data.name, phone_number:data.phone,
                    customer_email:data.email||null, project_interested_in:project,
                    lead_status:"Un called", lead_source:source, psa_agent_name:"Tharun"

                                    ))}
                                </div>
                            </div>
                            <div className="relative group cursor-pointer py-2">
                                <span className={`text-xs font-bold uppercase tracking-widest flex items-center gap-1 transition ${['what-we-do','what-we-dont-do'].includes(activePage)?'text-blue-400':'text-slate-400 hover:text-white'}`}>Services <span className="dropdown-arrow"></span></span>
                                <div className="absolute hidden group-hover:block top-full right-0 mt-1 w-52 bg-slate-800 border border-slate-700 shadow-2xl rounded-xl overflow-hidden z-50 animate-fadeIn">
                                    {[['what-we-do','What We Do'],['what-we-dont-do',"What We Don't Do"]].map(([p,l])=>(
                                        <div key={p} onClick={()=>navTo(p)} className="px-4 py-3 hover:bg-slate-700 text-xs font-semibold cursor-pointer text-slate-300 hover:text-white transition">{l}</div>
                                    ))}
                                </div>
                            </div>
                            <NavLink page="advisor" label="Advisors"/>
                            <NavLink page="blogs" label="Insights"/>
                            <NavLink page="customers" label="Reviews"/>
                            <button onClick={()=>setShowLeadForm(true)} className="text-white text-[10px] font-bold uppercase tracking-widest px-4 py-2.5 rounded-xl transition"
                                style={{background:'linear-gradient(135deg,#2563eb,#4f46e5)'}}>
                                Free Consultation
                            </button>
                        </div>

                        {/* Mobile Hamburger */}
                        <button onClick={()=>setIsMobileMenuOpen(!isMobileMenuOpen)} className="md:hidden text-white p-1">
                            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d={isMobileMenuOpen?"M6 18L18 6M6 6l12 12":"M4 6h16M4 12h16M4 18h16"}></path>
                            </svg>
                        </button>
                    </div>

                    {/* Mobile Menu Drawer */}
                    {isMobileMenuOpen && (
                        <div className="md:hidden border-t border-slate-800 py-5 px-6 space-y-4 animate-fadeIn">
                            <div onClick={()=>navTo('home')} className="text-sm font-bold text-white uppercase tracking-widest cursor-pointer hover:text-blue-400">Properties</div>
                            <div>
                                <div onClick={()=>setMobileAboutOpen(!mobileAboutOpen)} className="text-sm font-bold text-slate-300 uppercase tracking-widest flex items-center justify-between cursor-pointer">About <span>{mobileAboutOpen?'▲':'▼'}</span></div>
                                {mobileAboutOpen && <div className="mt-2 ml-4 space-y-2">
                                    <div onClick={()=>navTo('about-us')} className="text-xs font-semibold text-slate-400 hover:text-blue-400 cursor-pointer py-1">About Us</div>
                                    <div onClick={()=>navTo('our-journey')} className="text-xs font-semibold text-slate-400 hover:text-blue-400 cursor-pointer py-1">Our Story</div>
                                </div>}
                            </div>
                            <div>
                                <div onClick={()=>setMobileServicesOpen(!mobileServicesOpen)} className="text-sm font-bold text-slate-300 uppercase tracking-widest flex items-center justify-between cursor-pointer">Services <span>{mobileServicesOpen?'▲':'▼'}</span></div>
                                {mobileServicesOpen && <div className="mt-2 ml-4 space-y-2">
                                    <div onClick={()=>navTo('what-we-do')} className="text-xs font-semibold text-slate-400 hover:text-blue-400 cursor-pointer py-1">What We Do</div>
                                    <div onClick={()=>navTo('what-we-dont-do')} className="text-xs font-semibold text-slate-400 hover:text-blue-400 cursor-pointer py-1">What We Don't Do</div>
                                </div>}
                            </div>
                            {[['advisor','Advisors'],['blogs','Insights'],['customers','Reviews']].map(([p,l])=>(
                                <div key={p} onClick={()=>navTo(p)} className="text-sm font-bold text-white uppercase tracking-widest cursor-pointer hover:text-blue-400">{l}</div>
                            ))}
                            <button onClick={()=>setShowLeadForm(true)} className="w-full text-white font-bold py-3.5 rounded-xl text-xs uppercase tracking-widest transition mt-2"
                                style={{background:'linear-gradient(135deg,#2563eb,#4f46e5)'}}>
                                Free Consultation
                            </button>
                        </div>
                    )}
                </div>

                {/* ===== MAIN CONTENT ===== */}
                <main className="flex-grow page-content">

                    {activePage==='home' && (
                        <>
                            <HeroSection />
                            <FilterBar />
                            <div className="max-w-7xl mx-auto px-4 md:px-8 py-8 md:py-10">
                                {loading ? (
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                        {[1,2,3,4,5,6].map(i=><SkeletonCard key={i}/>)}
                                    </div>
                                ) : filtered.length===0 ? (
                                    <div className="text-center py-24">
                                        <div className="text-5xl mb-4">🏚️</div>
                                        <h3 style={{fontFamily:'var(--font-display)'}} className="text-xl font-bold text-slate-400 uppercase tracking-widest">No Properties Found</h3>
                                        <p className="text-sm text-slate-400 mt-2">Try adjusting your filters or search term.</p>
                                        <button onClick={()=>{setSearch("");setFilters({bhk:"",status:"",type:"",priceBracket:""});}} className="mt-5 px-6 py-2.5 bg-slate-900 text-white rounded-xl text-xs font-bold uppercase tracking-widest hover:bg-blue-600 transition">Clear Filters</button>
                                    </div>
                                ) : (
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 md:gap-7">
                                        {filtered.map((p,i)=>{
                                            const st = getStatusStyle(getVal(p,"Construction Status")||getVal(p,"construction_sta")||'');
                                            return (
                                                <div key={i} className="prop-card flex flex-col" onClick={()=>setSelectedProperty(p)}
                                                    style={{animationDelay:`${i*50}ms`}}>
                                                    <div className="relative overflow-hidden bg-slate-100" style={{height:'220px'}}>
                                                        <img src={fixImageUrl(getVal(p,"Cover Image")||getVal(p,"cover_image"))||''} className="card-img w-full h-full object-cover" alt=""
                                                            onError={e=>e.target.src='https://via.placeholder.com/600x300?text=No+Image'} />
                                                        <div className="absolute inset-0" style={{background:'linear-gradient(to top,rgba(0,0,0,.45) 0%,transparent 55%)'}}></div>
                                                        {/* Type badge top-left */}
                                                        <div className="absolute top-3 left-3">
                                                            <span className="badge" style={{background:'rgba(11,17,32,.85)',color:'white',backdropFilter:'blur(8px)',border:'1px solid rgba(255,255,255,.1)'}}>
                                                                {getVal(p,"Property Type")||'Apartment'}
                                                            </span>
                                                        </div>
                                                        {/* Status badge top-right */}
                                                        <div className="absolute top-3 right-3">
                                                            <span className="badge" style={{background:st.bg,color:st.text}}>
                                                                {getVal(p,"Construction Status")||'—'}
                                                            </span>
                                                        </div>
                                                    </div>

                                                    <div className="p-5 flex-grow flex flex-col">
                                                        <h2 style={{fontFamily:'var(--font-display)'}} className="text-xl font-bold text-slate-900 leading-tight truncate uppercase mb-0.5">
                                                            {getVal(p,"Property Name")||"Listed Property"}
                                                        </h2>
                                                        <p className="text-sm text-blue-600 font-semibold truncate mb-3">{getVal(p,"Builder Name")||"Premium Builder"}</p>

                                                        <div className="flex flex-wrap gap-1.5 mb-5">
                                                            <span className="badge" style={{background:'#f8fafc',color:'#64748b',border:'1px solid #e2e8f0'}}>📍 {getVal(p,"Location")}</span>
                                                            <span className="badge" style={{background:'#f8fafc',color:'#64748b',border:'1px solid #e2e8f0'}}>🛏 {getVal(p,"bhk")||getVal(p,"No of BHK's")||'—'} BHK</span>
                                                        </div>

                                                        <div className="flex justify-between items-center border-t border-slate-100 pt-4 mt-auto">
                                                            <div>
                                                                <div className="text-[9px] text-slate-400 font-semibold uppercase tracking-widest mb-0.5">Starting from</div>
                                                                <div style={{fontFamily:'var(--font-display)'}} className="text-xl font-bold text-slate-900">{getVal(p,"Price")||"On Request"}</div>
                                                            </div>
                                                            <button className="text-white text-[10px] font-bold px-4 py-2.5 rounded-xl transition-all uppercase tracking-wide"
                                                                style={{background:'#0b1120'}}>
                                                                View →
                                                            </button>
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>
                        </>
                    )}

                    {activePage!=='home' && (
                        <div className="max-w-7xl mx-auto px-4 md:px-8 py-8 md:py-10">
                            {activePage==='about-us'         && <AboutUs/>}
                            {activePage==='our-journey'      && <OurJourney/>}
                            {activePage==='advisor'          && <Advisors/>}
                            {activePage==='what-we-do'       && <WhatWeDo/>}
                            {activePage==='what-we-dont-do'  && <WhatWeDontDo/>}
                            {activePage==='customers'        && <Reviews/>}
                            {activePage==='blogs' && !activeBlog && <Blogs/>}

                        <div>
                            <h1 style={{fontFamily:'var(--font-display)'}} className="text-xl font-bold text-white italic uppercase mb-2">Perfect Horizons</h1>
                            <p className="text-slate-500 text-xs leading-relaxed mb-5">Bengaluru's trusted real estate advisory. Zero brokerage. Unbiased guidance.</p>
                            <div className="flex gap-3">
                                <button onClick={()=>setLegalModal('terms')} className="text-[9px] text-slate-600 hover:text-slate-300 transition font-semibold uppercase tracking-widest">Terms</button>
                                <span className="text-slate-700">|</span>
                                <button onClick={()=>setLegalModal('privacy')} className="text-[9px] text-slate-600 hover:text-slate-300 transition font-semibold uppercase tracking-widest">Privacy</button>
                            </div>
                            <p className="text-slate-700 text-[10px] mt-4">© 2026 Perfect Horizons. All rights reserved.</p>
                        </div>

                                    <div key={p} onClick={()=>navTo(p)} className="text-sm text-slate-400 hover:text-white transition cursor-pointer font-medium">{l}</div>
                                ))}
                            </div>
                        </div>

                        <div>
                            <h3 className="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-4">Contact Us</h3>
                            <div className="space-y-3">
                                <a href={`tel:${WHATSAPP_NUMBER}`} className="flex items-center gap-2 text-slate-300 hover:text-white transition text-sm font-medium">📞 +91 97423 53260</a>
                                <a href="mailto:perfecthorizons.in@gmail.com" className="flex items-center gap-2 text-slate-300 hover:text-white transition text-sm font-medium">✉️ perfecthorizons.in@gmail.com</a>
                                <p className="flex items-center gap-2 text-slate-500 text-sm">📍 Bengaluru, Karnataka</p>
                            </div>
                            <a href="admin.html" className="mt-6 text-[9px] text-slate-700 hover:text-blue-400 transition font-bold uppercase tracking-widest block">Management Login →</a>
                        </div>
                    </div>
                </footer>

                {/* ===== MOBILE BOTTOM NAV ===== */}
                <div className="bottom-nav md:hidden">
                    {[
                        {page:'home', label:'Properties', icon:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>},
                        {page:'advisor', label:'Advisor', icon:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>},
                        {page:'blogs', label:'Insights', icon:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>},
                        {page:'customers', label:'Reviews', icon:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>},
                    ].map(n=>(
                        <div key={n.page} className={`bottom-nav-item ${activePage===n.page?'active':''}`} onClick={()=>navTo(n.page)}>
                            {n.icon}
                            <span>{n.label}</span>
                        </div>
                    ))}
                </div>

                {/* ===== WHATSAPP BUTTON ===== */}
                <a href={`https://wa.me/${WHATSAPP_NUMBER}?text=Hi, I'd like to know more about available properties.`} target="_blank"
                    className="wa-btn fixed right-5 z-50 w-13 h-13 rounded-full flex items-center justify-center shadow-xl text-white transition hover:scale-110"
                    style={{bottom:'72px', width:'52px', height:'52px', background:'linear-gradient(135deg,#22c55e,#16a34a)'}}>
                    <svg viewBox="0 0 24 24" fill="currentColor" className="w-6 h-6"><path d="M12.031 0C5.385 0 0 5.385 0 12.031c0 2.12.553 4.148 1.603 5.946L.2 24l6.195-1.62c1.737.947 3.69 1.445 5.636 1.445 6.646 0 12.031-5.385 12.031-12.031C24 5.385 18.615 0 12.031 0zm5.496 16.482c-.301-.15-1.785-.885-2.062-.986-.277-.1-.478-.15-.678.15-.201.301-.778.986-.954 1.187-.176.201-.351.226-.653.076-1.609-.816-2.73-1.637-3.784-3.411-.176-.301.176-.277.453-.827.076-.15-.038-.277-.038-.427-.076-.15-.678-1.631-.929-2.233-.251-.602-.502-.527-.678-.527-.176 0-.377 0-.578 0-.201 0-.527.076-.803.427-.276.351-1.054 1.028-1.054 2.508 0 1.48 1.079 2.91 1.229 3.111.15.201 2.133 3.262 5.169 4.566.726.301 1.28.478 1.731.628.728.227 1.381.194 1.905.118.578-.084 1.785-.728 2.036-1.431.251-.703.251-1.305.176-1.431-.076-.126-.277-.201-.578-.352z"/></svg>
                </a>

                {/* ===== LEGAL MODALS ===== */}
                {legalModal && (
                    <div className="fixed inset-0 z-[100] flex items-end md:items-center justify-center p-0 md:p-4" style={{background:'rgba(0,0,0,.7)',backdropFilter:'blur(8px)'}} onClick={()=>setLegalModal(null)}>
                        <div className="bg-white w-full md:max-w-2xl rounded-t-3xl md:rounded-3xl p-7 md:p-10 max-h-[80vh] overflow-y-auto shadow-2xl relative animate-scaleIn" onClick={e=>e.stopPropagation()}>
                            <div className="w-10 h-1 bg-slate-200 rounded-full mx-auto mb-5 md:hidden"></div>
                            <button onClick={()=>setLegalModal(null)} className="absolute top-4 right-5 text-2xl text-slate-300 hover:text-slate-700">×</button>
                            <h2 style={{fontFamily:'var(--font-display)'}} className="text-xl font-bold text-slate-900 mb-6 uppercase border-b border-slate-100 pb-4">
                                {legalModal==='terms'?'Terms & Conditions':'Privacy Policy'}
                            </h2>
                            <div className="text-xs text-slate-600 leading-relaxed space-y-4">
                                <p className="font-semibold text-slate-800 bg-amber-50 p-4 rounded-xl border border-amber-100">Disclaimer: Perfect Horizons acts solely as an authorized channel partner and real estate advisory. We are not the developers or builders of the properties listed.</p>
                                <p><strong>Logos & Trademarks:</strong> Any builder logos used are for representative purposes only and remain the property of their respective trademark owners.</p>
                                <p><strong>Information Accuracy:</strong> All images, pricing, and project details are for informational purposes only. We advise clients to verify all legal and RERA documents independently before any financial commitment.</p>
                                <p><strong>Data Privacy:</strong> Any information submitted through our forms is kept strictly confidential and used exclusively by our advisors to assist your property search.</p>
                            </div>
                        </div>
                    </div>
                )}

                {/* ===== GENERAL LEAD FORM ===== */}
                {showLeadForm && (
                    <div className="fixed inset-0 z-[100] flex items-end md:items-center justify-center p-0 md:p-4" style={{background:'rgba(0,0,0,.7)',backdropFilter:'blur(8px)'}} onClick={()=>setShowLeadForm(false)}>
                        <div className="bg-white w-full md:max-w-sm rounded-t-3xl md:rounded-3xl p-7 md:p-9 shadow-2xl relative animate-scaleIn" onClick={e=>e.stopPropagation()}>
                            <div className="w-10 h-1 bg-slate-200 rounded-full mx-auto mb-5 md:hidden"></div>
                            <button onClick={()=>setShowLeadForm(false)} className="absolute top-4 right-5 text-2xl text-slate-300 hover:text-slate-700">×</button>
                            <h2 style={{fontFamily:'var(--font-display)'}} className="text-xl font-bold text-slate-900 mb-1 uppercase">Free Consultation</h2>
                            <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-widest mb-6">Our advisor will call you within 24 hrs</p>
                            <form onSubmit={(e)=>handleLeadSubmit(null,"General Enquiry","Website - General",e)} className="space-y-3">
                                <input type="text" placeholder="Full Name" required className="w-full border border-slate-200 bg-slate-50 p-3.5 rounded-xl text-sm font-medium outline-none focus:ring-2 focus:ring-blue-500 transition" value={leadData.name} onChange={e=>setLeadData({...leadData,name:e.target.value})} />
                                <input type="tel" placeholder="Mobile Number (10 digits)" required className="w-full border border-slate-200 bg-slate-50 p-3.5 rounded-xl text-sm font-medium outline-none focus:ring-2 focus:ring-blue-500 transition" value={leadData.phone} onChange={e=>setLeadData({...leadData,phone:e.target.value})} />
                                <input type="email" placeholder="Email (optional)" className="w-full border border-slate-200 bg-slate-50 p-3.5 rounded-xl text-sm font-medium outline-none focus:ring-2 focus:ring-blue-500 transition" value={leadData.email} onChange={e=>setLeadData({...leadData,email:e.target.value})} />
                                <button disabled={isSubmitting} type="submit" className="w-full text-white font-bold py-4 rounded-xl uppercase tracking-widest shadow-lg transition active:scale-95 mt-2 text-sm"
                                    style={{background:'linear-gradient(135deg,#2563eb,#4f46e5)'}}>
                                    {isSubmitting?'Processing…':'Book Consultation'}
                                </button>
                            </form>
                        </div>
                    </div>
                )}
            </div>
        );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App/>);
</script>
</body>
</html>
