<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Perfect Horizons | Data X-Ray</title>
</head>
<body style="font-family: monospace; background: #111; color: #0f0; padding: 40px; font-size: 16px;">
    <h2>🔍 DATA X-RAY SCANNER</h2>
    <p>Fetching raw data from Google...</p>
    <div id="output"></div>

    <script>
        // Bypasses all caches to get the freshest data
        const api = "https://script.google.com/macros/s/AKfycbzORxItxvqlsIUokcs7JCKjFASG2e3y_CrAT2zuy81aEQvLsVG6Sm6CuuSplgWnWh4/exec?nocache=" + new Date().getTime();
        
        fetch(api)
            .then(res => res.json())
            .then(data => {
                if(data.length === 0) {
                    document.getElementById('output').innerHTML = "ERROR: Your spreadsheet is empty or the script is looking at the wrong tab!";
                } else {
                    // Prints the very first property in the sheet exactly as the computer sees it
                    document.getElementById('output').innerHTML = "<pre>" + JSON.stringify(data[0], null, 4) + "</pre>";
                }
            })
            .catch(err => {
                document.getElementById('output').innerHTML = "ERROR: " + err.message;
            });
    </script>
</body>
</html>
