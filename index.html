        .map-embed { border-radius: 1rem; overflow: hidden; border: 1px solid var(--border); }

        const BLOG_ARTICLES = [
            { id: 1, tag: "Legal Guide", title: "What is UDS (Undivided Share) and Why Does it Matter?", excerpt: "When you buy an apartment, you aren't just buying the flat; you are buying a piece of the land it sits on. Understanding your UDS is critical.", content: `<p>When purchasing an apartment in Bengaluru, many buyers focus entirely on the super built-up area and the amenities. However, the most critical element of your investment is the <strong>Undivided Share of Land (UDS)</strong>.</p><br/><h3>What is UDS?</h3><p>UDS is your personal share of the land on which the entire apartment complex is built. Since you cannot physically mark out your exact piece of land in a high-rise, it is expressed as a fraction or percentage.</p><br/><h3>Why is it so important?</h3><ul style="list-style-type: disc; margin-left: 20px;"><li><strong>Future Resale Value:</strong> The building structure depreciates over time, but the land appreciates. Your property's true resale value is determined by the UDS.</li><li><strong>Redevelopment:</strong> If the building is demolished or redeveloped 40 years from now, your compensation or new apartment allocation will be based strictly on your UDS.</li></ul><br/><p><strong>The Rule of Thumb:</strong> Always ask the builder for the exact UDS before booking. If the UDS is unusually low compared to the size of your flat, it means the builder is over-utilizing the land, which dilutes your investment.</p>` },
            { id: 2, tag: "Finance Hack", title: "5 Hidden Charges Builders Don't Tell You About", excerpt: "The 'Base Price' is never the final price. From Club House charges to BESCOM deposits, learn how to calculate the actual landed cost.", content: `<p>You see an ad for a luxury 3BHK for "₹1.2 Cr Onwards." You visit the site, fall in love, and sit down to book it—only to realize the final cost is suddenly ₹1.45 Cr. What happened?</p><br/><p>Builders use a "Base Price" for marketing, but the "Landed Cost" includes mandatory hidden fees. Here is what you need to watch out for:</p><br/><ol style="list-style-type: decimal; margin-left: 20px;"><li><strong>BESCOM & BWSSB Charges:</strong> Fees for setting up the electricity and water infrastructure. This can add ₹200-₹300 per sq.ft.</li><li><strong>Clubhouse & Amenity Fees:</strong> Builders often charge a hefty one-time premium (anywhere from ₹2 Lakhs to ₹5 Lakhs) just to use the amenities they advertised.</li><li><strong>Advance Maintenance:</strong> You will typically have to pay 1 to 2 years of maintenance upfront at the time of possession.</li><li><strong>Legal & Documentation Charges:</strong> Builders charge for preparing your sale agreement and legal vetting, usually around ₹30,000 to ₹75,000.</li><li><strong>Floor Rise Premium (PLC):</strong> Prefer a higher floor? Expect to pay an extra ₹15 to ₹50 per sq.ft. for every floor you go up.</li></ol><br/><p>Always demand a comprehensive <strong>Cost Sheet</strong> before paying any token amount so you know exactly what you are paying for.</p>` },
            { id: 3, tag: "Property Types", title: "Carpet Area vs. Super Built-up Area: What Are You Actually Paying For?", excerpt: "Don't be fooled by big numbers. Learn how builders calculate space and why RERA Carpet Area is the only metric that matters.", content: `<p>One of the biggest confusions for home buyers is the difference between the area advertised and the actual livable space they get.</p><br/><h3>1. RERA Carpet Area</h3><p>This is the actual usable floor area inside your apartment. Imagine laying a carpet wall-to-wall inside your house—that is the carpet area. Under the RERA act, builders <strong>must</strong> quote this area to buyers.</p><br/><h3>2. Built-up Area</h3><p>This includes the Carpet Area PLUS the space taken up by the internal and external walls, and the balconies. It is usually 10-15% more than the Carpet Area.</p><br/><h3>3. Super Built-up Area (SBA) / Saleable Area</h3><p>This is the number builders use to calculate your final price. It includes the Built-up Area PLUS a proportionate share of the common areas (lobbies, lifts, staircases, clubhouse). The difference between Carpet Area and SBA is called the "Loading Factor."</p><br/><p><strong>The Trap:</strong> Some builders apply a loading factor of 30-35%. This means if you buy a 1000 sq.ft. apartment (SBA), your actual livable space might only be 650 sq.ft. Always check the RERA Carpet Area to know what you are actually getting.</p>` },
            { id: 4, tag: "Legal Guide", title: "A Khata vs B Khata in Bengaluru: The Ultimate Buyer's Guide", excerpt: "Confused about Khatas? Buying a 'B Khata' property can lead to loan rejections and legal trouble. Here is how to verify property records.", content: `<p>If you are buying property in Bengaluru (especially plots or independent houses), the word "Khata" will come up immediately. It is a BBMP (Bruhat Bengaluru Mahanagara Palike) document assessing the property for tax records.</p><br/><h3>What is 'A' Khata?</h3><p>An 'A' Khata certificate means the property is completely legal, fully approved by the BBMP, BDA, or BMRDA, and all property taxes have been paid. <strong>You can easily get home loans and building plan approvals with an 'A' Khata.</strong></p><br/><h3>What is 'B' Khata?</h3><p>A 'B' Khata is technically not a certificate; it's just an entry in a register. It signifies that the property is illegal or built in violation of government regulations (e.g., built on unauthorized layouts or lacking DC conversion), but the government is collecting tax on it anyway.</p><br/><h3>Why you should avoid B Khata:</h3><ul style="list-style-type: disc; margin-left: 20px;"><li>Nationalized banks (SBI, HDFC) will <strong>not</strong> give you a home loan.</li><li>You cannot get an official building plan approval to construct a house.</li><li>Selling the property later will be extremely difficult.</li></ul><br/><p>Never fall for the "we will upgrade it to A Khata later" promise without verifying with a legal expert.</p>` }
        ];

        const getDriveDownloadUrl = (rawLink) => {
            if (!rawLink) return null;
            const link = String(rawLink).trim();
            let idMatch = link.match(/\/d\/(.*?)\//) || link.match(/id=([a-zA-Z0-9_-]+)/);
            if (idMatch && idMatch[1]) {
                return `https://drive.google.com/uc?export=download&id=${idMatch[1]}`;
            }
            return link;
        };

        // Direct download via fetch+blob to force download (bypasses Drive viewer)
        const triggerDirectDownload = async (rawLink, filename = 'Brochure.pdf') => {
            const url = getDriveDownloadUrl(rawLink);

                window.open(url, '_blank');
            } catch(e) {

            }

        // Extract map embed src from a Google Maps share link
        const getMapEmbedSrc = (mapLink) => {
            if (!mapLink) return null;
            const link = String(mapLink).trim();
            if (link.includes('maps/embed')) return link;
            try {
                const url = new URL(link.startsWith('http') ? link : 'https://' + link);
                const q = url.searchParams.get('q') || url.searchParams.get('query');
                if (q) return `https://maps.google.com/maps?q=${encodeURIComponent(q)}&output=embed`;
                const placeMatch = link.match(/\/maps\/place\/([^/@]+)/);
                if (placeMatch) return `https://maps.google.com/maps?q=${encodeURIComponent(placeMatch[1])}&output=embed`;
                return `https://maps.google.com/maps?q=${encodeURIComponent(link)}&output=embed`;
            } catch(e) {
                return `https://maps.google.com/maps?q=${encodeURIComponent(link)}&output=embed`;
            }
        };

                if (p === 0 || r === 0 || n === 0) return { emi: 0, totalPayment: 0, totalInterest: 0, principalPct: 100 };
                const emiValue = (p * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
                const totalPay = emiValue * n;
                const totalInt = totalPay - p;
                return { emi: Math.round(emiValue), totalPayment: Math.round(totalPay), totalInterest: Math.round(totalInt), principalPct: ((p / totalPay) * 100).toFixed(1) };
            }, [loanAmount, interestRate, tenureYears]);

                                <span style={{fontSize:'0.7rem',fontWeight:800,color:'var(--navy)'}}>{formatIndianCurrencyCompact(totalInterest)}</span>
                            </div>

                                            <a href={getSafeLink(getVal(property, "lead_registration") || getVal(property, "lead_registration_link_or_email_id"))} target="_blank" style={{background:'var(--navy)', color:'white', padding:'14px', borderRadius:'12px', fontSize:'0.62rem', fontWeight:800, textAlign:'center', textTransform:'uppercase', letterSpacing:'0.14em', transition:'all 0.2s'}} className="hover:opacity-80">Register Lead</a>
                                            <a href={getSafeLink(mapLink)} target="_blank" style={{background:'white', border:'1px solid var(--border)', padding:'14px', borderRadius:'12px', fontSize:'0.62rem', fontWeight:800, textAlign:'center', textTransform:'uppercase', letterSpacing:'0.14em', color:'var(--navy)', transition:'all 0.2s'}} className="md:col-span-2 hover:border-yellow-400 hover:shadow-sm">Share Location Map</a>

                            <div className="lg:col-span-1">
                                <div className="sticky top-24 space-y-5">

                                            <button onClick={() => openAction('cost_sheet')} style={{width:'100%', background:'var(--navy)', color:'white', fontWeight:800, fontSize:'0.65rem', textTransform:'uppercase', letterSpacing:'0.14em', padding:'13px', borderRadius:'12px', display:'flex', justifyContent:'center', alignItems:'center', gap:'8px', transition:'opacity 0.2s'}} className="hover:opacity-80">

                                                📥 Download Brochure
                                            </button>
                                        </div>
                                    </div>
                                    <EMICalculator propertyPriceStr={getVal(property, "Price")} onApplyAction={() => openAction('apply_now')} />
                                </div>
                            </div>
                        </div>

                        {/* Similar Properties */}
                        {similarProperties.length > 0 && (
                            <div className="mt-14 pt-8" style={{borderTop:'1px solid var(--border)'}}>
                                <h2 style={{fontFamily:"'Cormorant Garamond', Georgia, serif", fontSize:'1.5rem', fontWeight:700, fontStyle:'italic', color:'var(--navy)', marginBottom:'1.5rem', borderLeft:'4px solid var(--gold)', paddingLeft:'1rem'}}>Similar Properties</h2>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
                                    {similarProperties.map((simProp, i) => (
                                        <div key={i} onClick={() => { window.scrollTo(0,0); onSelectProperty(simProp); }} className="prop-card group flex flex-col" style={{cursor:'pointer'}}>
                                            <div className="relative overflow-hidden shrink-0" style={{height:'170px', background:'var(--parchment)'}}>
                                                <img src={fixImageUrl(getVal(simProp, "Cover Image") || getVal(simProp, "cover_image"))} loading="lazy" decoding="async" className="card-img" />
                                            </div>
                                            <div style={{padding:'1rem 1.25rem', flexGrow:1, display:'flex', flexDirection:'column'}}>
                                                <p style={{fontSize:'0.55rem', fontWeight:700, color:'var(--gold)', textTransform:'uppercase', letterSpacing:'0.12em', marginBottom:'3px'}}>{getVal(simProp, "Builder Name")}</p>
                                                <h3 style={{fontFamily:"'Cormorant Garamond', Georgia, serif", fontSize:'1.05rem', fontWeight:700, fontStyle:'italic', color:'var(--navy)', lineHeight:1.2}} className="truncate">{getVal(simProp, "Property Name")}</h3>
                                                <p style={{fontSize:'0.6rem', color:'var(--slate-soft)', textTransform:'uppercase', letterSpacing:'0.1em', marginTop:'4px', fontWeight:600}}>📍 {getVal(simProp, "Location")}</p>
                                                <div className="mt-3 pt-3 flex justify-between items-end" style={{borderTop:'1px solid var(--border)'}}>
                                                    <span style={{fontWeight:800, fontSize:'1rem', color:'var(--navy)'}}>{getVal(simProp, "Price")}</span>
                                                    <span style={{background:'var(--parchment)', border:'1px solid var(--border)', padding:'3px 8px', borderRadius:'6px', fontSize:'0.6rem', fontWeight:700, textTransform:'uppercase', letterSpacing:'0.12em', color:'var(--slate-soft)'}}>{getVal(simProp, "bhk")} BHK</span>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Property Action Modal */}
                    {actionModal && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-900/90 backdrop-blur-sm animate-fadeIn" onClick={() => { setActionModal(null); setDownloadReadyUrl(null); }}>
                            <div style={{background:'var(--card-bg)', borderRadius:'24px', maxWidth:'380px', width:'100%', padding:'2.5rem', boxShadow:'0 32px 80px rgba(15,23,42,0.5), 0 0 0 1px rgba(217,119,6,0.12)', position:'relative'}} onClick={e => e.stopPropagation()}>
                                <button onClick={() => { setActionModal(null); setDownloadReadyUrl(null); }} style={{position:'absolute', top:'16px', right:'20px', fontSize:'1.5rem', color:'rgba(100,116,139,0.5)', fontWeight:300, lineHeight:1}} className="hover:text-slate-900 transition">&times;</button>
                                <div style={{height:'3px', background:'linear-gradient(90deg, var(--gold), transparent)', borderRadius:'2px', marginBottom:'1.5rem'}}></div>
                                <h2 style={{fontFamily:"'Cormorant Garamond', Georgia, serif", fontSize:'1.6rem', fontWeight:700, fontStyle:'italic', color:'var(--navy)', marginBottom:'4px', textTransform:'uppercase'}}>
                                    {actionModal === 'brochure' ? "Get The Brochure" : actionModal === 'cost_sheet' ? "Get Cost Sheet" : actionModal === 'apply_now' ? "Apply for Loan" : "Enquiry"}
                                </h2>
                                <p style={{fontSize:'0.6rem', fontWeight:700, color:'var(--slate-soft)', textTransform:'uppercase', letterSpacing:'0.18em', marginBottom:'1.5rem'}}>Please enter details to proceed</p>
                                <form onSubmit={handleActionSubmit} className="space-y-3 text-left">
                                    <input type="text" placeholder="Full Name" required style={{width:'100%', border:'1px solid var(--border)', background:'var(--cream)', padding:'14px 16px', borderRadius:'12px', outline:'none', fontFamily:"'DM Sans', sans-serif", fontSize:'0.875rem', fontWeight:500}} className="focus:ring-2 focus:ring-amber-300 focus:border-amber-400" value={leadData.name} onChange={e => setLeadData({...leadData, name: e.target.value})} />
                                    <input type="tel" placeholder="Mobile Number (10 Digits)" required style={{width:'100%', border:'1px solid var(--border)', background:'var(--cream)', padding:'14px 16px', borderRadius:'12px', outline:'none', fontFamily:"'DM Sans', sans-serif", fontSize:'0.875rem', fontWeight:500}} className="focus:ring-2 focus:ring-amber-300 focus:border-amber-400" value={leadData.phone} onChange={e => setLeadData({...leadData, phone: e.target.value})} />
                                    <input type="email" placeholder="Email Address (Optional)" style={{width:'100%', border:'1px solid var(--border)', background:'var(--cream)', padding:'14px 16px', borderRadius:'12px', outline:'none', fontFamily:"'DM Sans', sans-serif", fontSize:'0.875rem', fontWeight:500}} className="focus:ring-2 focus:ring-amber-300 focus:border-amber-400" value={leadData.email} onChange={e => setLeadData({...leadData, email: e.target.value})} />
                                    <button disabled={isSubmitting} type="submit" className="btn-gold w-full font-black py-4 rounded-xl uppercase tracking-widest mt-2 active:scale-95 text-white" style={{fontSize:'0.72rem'}}>
                                        {isSubmitting ? "Processing…" : actionModal === 'apply_now' ? "Submit Application" : actionModal === 'interest' ? "Submit Interest" : "Unlock Download"}
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // ─── MAIN APP ───
        function App() {
            const [properties, setProperties] = useState([]);
            const [loading, setLoading] = useState(true);
            const [isAdmin, setIsAdmin] = useState(false);
            const [selectedProperty, setSelectedProperty] = useState(null);
            const [search, setSearch] = useState("");
            const [isMobileSearchOpen, setIsMobileSearchOpen] = useState(false);
            const [isMobileFilterOpen, setIsMobileFilterOpen] = useState(false);
            const [filters, setFilters] = useState({ bhk: "", status: "", type: "", priceBracket: "" });
            const [showLeadForm, setShowLeadForm] = useState(false);
            const [leadData, setLeadData] = useState({ name: "", phone: "", email: "" });
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [activePage, setActivePage] = useState(() => window.location.hash.replace('#', '') || 'home'); 
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            const [mobileAboutOpen, setMobileAboutOpen] = useState(false);
            const [mobileServicesOpen, setMobileServicesOpen] = useState(false);
            const [activeBlog, setActiveBlog] = useState(null);
            const [legalModal, setLegalModal] = useState(null);

            useEffect(() => {
                const urlParams = new URLSearchParams(window.location.search);
                if (urlParams.get("key") === "admin123") setIsAdmin(true);

                const handleHashChange = () => {
                    const hash = window.location.hash.replace('#', '');
                    setActivePage(hash || 'home');
                    if(hash !== 'home') setSelectedProperty(null);
                    if(hash !== 'blogs') setActiveBlog(null);
                };
                window.addEventListener('hashchange', handleHashChange);
                
                const fetchProperties = async () => {
                    try {
                        const { data, error } = await supabase.from('properties').select('*').eq('is_live', true);
                        if (!error) setProperties(data || []);
                    } catch (error) { console.error(error); } 
                    finally { setLoading(false); }
                };
                fetchProperties();

                const channel = supabase
                    .channel('public:properties')
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'properties' }, (payload) => {
                        if (payload.eventType === 'INSERT') {
                            if (payload.new.is_live === true) setProperties(prev => [payload.new, ...prev]);
                        } else if (payload.eventType === 'UPDATE') {
                            const updated = payload.new;
                            if (updated.is_live === true) {
                                setProperties(prev => { const exists = prev.some(p => p.id === updated.id); return exists ? prev.map(p => p.id === updated.id ? updated : p) : [updated, ...prev]; });
                                setSelectedProperty(prev => prev && prev.id === updated.id ? updated : prev);
                            } else {
                                setProperties(prev => prev.filter(p => p.id !== updated.id));
                                setSelectedProperty(prev => prev && prev.id === updated.id ? null : prev);
                            }
                        } else if (payload.eventType === 'DELETE') {
                            setProperties(prev => prev.filter(p => p.id !== payload.old.id));
                            setSelectedProperty(prev => prev && prev.id === payload.old.id ? null : prev);
                        }
                    })
                    .subscribe();

                return () => {
                    window.removeEventListener('hashchange', handleHashChange);
                    supabase.removeChannel(channel);
                };
            }, []);

            const handleLeadSubmit = async (dataToSubmit, projectName, actionType = "General Enquiry", event = null) => {
                if(event) event.preventDefault(); 
                const data = dataToSubmit || leadData;
                const project = projectName || "General Enquiry";
                const sourceContext = actionType === 'brochure' ? "Website - Brochure Download" : actionType === 'cost_sheet' ? "Website - Cost Sheet Request" : actionType === 'apply_now' ? "Website - EMI Apply" : "Website - General";
                if (!/^[6-9]\d{9}$/.test(data.phone)) { alert("Enter valid 10-digit number"); return false; }
                if (!dataToSubmit) setIsSubmitting(true);
                try {
                    const { error } = await supabase.from('leads').insert([{ customer_name: data.name, phone_number: data.phone, customer_email: data.email || null, project_interested_in: project, lead_status: "Un called", lead_source: sourceContext, psa_agent_name: "Tharun" }]);
                    if (error) throw error; 
                    fetch(GOOGLE_SCRIPT_URL, { method: "POST", body: JSON.stringify({ action: "sendLead", Name: data.name, Phone: data.phone, Email: data.email || 'N/A', Project: project, Source: sourceContext, Requirements: 'None' }) }).catch(err => console.log("Email Error:", err));
                    if (!dataToSubmit) { alert("Interest Registered! Our advisor will contact you shortly."); setShowLeadForm(false); setLeadData({ name: "", phone: "", email: "" }); }
                    return true;
                } catch (error) { alert("Error saving details. Please try again."); return false; } 
                finally { if (!dataToSubmit) setIsSubmitting(false); }
            };

            const safeProperties = Array.isArray(properties) ? properties : [];
            const filtered = safeProperties.filter(p => {
                if (!p || typeof p !== 'object') return false; 
                const term = search.toLowerCase();
                const matchSearch = !term || String(getVal(p, "Property Name")).toLowerCase().includes(term) || String(getVal(p, "Location")).toLowerCase().includes(term) || String(getVal(p, "Builder Name")).toLowerCase().includes(term);
                const matchBHK = !filters.bhk || String(getVal(p, "No of BHK's") || getVal(p, "bhk")).includes(filters.bhk);
                const matchStatus = !filters.status || String(getVal(p, "Construction Status")).includes(filters.status);
                const matchType = !filters.type || String(getVal(p, "Property Type")).includes(filters.type);
                const priceInCr = extractPriceInCr(getVal(p, "Price"));
                let matchPrice = true;
                if (filters.priceBracket && priceInCr > 0) {
                    if (filters.priceBracket === "under1") matchPrice = priceInCr < 1;
                    else if (filters.priceBracket === "1-2") matchPrice = priceInCr >= 1 && priceInCr < 2;
                    else if (filters.priceBracket === "2-3") matchPrice = priceInCr >= 2 && priceInCr < 3;
                    else if (filters.priceBracket === "3-4") matchPrice = priceInCr >= 3 && priceInCr < 4;
                    else if (filters.priceBracket === "4-5") matchPrice = priceInCr >= 4 && priceInCr < 5;
                    else if (filters.priceBracket === "5plus") matchPrice = priceInCr >= 5;
                } else if (filters.priceBracket) matchPrice = false;
                return matchSearch && matchBHK && matchStatus && matchType && matchPrice;
            });

            const navTo = (page) => {
                setIsMobileMenuOpen(false);
                setMobileAboutOpen(false);
                setMobileServicesOpen(false);
                setActiveBlog(null);
                setSelectedProperty(null);
                window.location.hash = page;
                window.scrollTo(0,0);
            };

            const openEnquiry = useCallback(() => { setShowLeadForm(true); }, []);

            if (selectedProperty) {
                return (
                    <>
                        <PropertyDetailsPage property={selectedProperty} allProperties={safeProperties} onBack={() => setSelectedProperty(null)} onSubmitLead={handleLeadSubmit} isAdmin={isAdmin} onSelectProperty={setSelectedProperty} onOpenEnquiry={openEnquiry} />
                        {/* Sticky Enquire Now - on property page too */}
                        <button onClick={openEnquiry} className="sticky-enquire-btn" title="Enquire Now">
                            Enquire Now
                        </button>
                        {showLeadForm && (
                            <div className="fixed inset-0 z-[200] flex items-center justify-center p-4 bg-slate-900/90 backdrop-blur-sm animate-fadeIn" onClick={() => setShowLeadForm(false)}>
                                <div style={{background:'var(--card-bg)', borderRadius:'28px', maxWidth:'380px', width:'100%', padding:'2.5rem', boxShadow:'0 32px 80px rgba(15,23,42,0.5), 0 0 0 1px rgba(217,119,6,0.12)', position:'relative'}} onClick={e => e.stopPropagation()}>
                                    <button onClick={() => setShowLeadForm(false)} style={{position:'absolute', top:'16px', right:'20px', fontSize:'1.5rem', color:'rgba(100,116,139,0.6)', fontWeight:300, lineHeight:1}} className="hover:text-slate-900 transition">&times;</button>
                                    <div style={{height:'3px', background:'linear-gradient(90deg, var(--gold), transparent)', borderRadius:'2px', marginBottom:'1.5rem'}}></div>
                                    <h2 style={{fontFamily:"'Cormorant Garamond', Georgia, serif", fontSize:'1.6rem', fontWeight:700, fontStyle:'italic', color:'var(--navy)', marginBottom:'4px', textTransform:'uppercase'}}>Quick Enquiry</h2>
                                    <p style={{fontSize:'0.6rem', fontWeight:700, color:'var(--slate-soft)', textTransform:'uppercase', letterSpacing:'0.18em', marginBottom:'1.5rem'}}>Our advisor will call you shortly</p>
                                    <form onSubmit={(e) => handleLeadSubmit(null, getVal(selectedProperty, "Property Name"), "Website - Quick Enquiry", e)} className="space-y-3 text-left">
                                        <input type="text" placeholder="Full Name" required style={{width:'100%', border:'1px solid var(--border)', background:'var(--cream)', padding:'14px 16px', borderRadius:'12px', outline:'none', fontFamily:"'DM Sans', sans-serif", fontSize:'0.875rem', fontWeight:500}} className="focus:ring-2 focus:ring-amber-300 focus:border-amber-400" value={leadData.name} onChange={e => setLeadData({...leadData, name: e.target.value})} />
                                        <input type="tel" placeholder="Mobile Number (10 Digits)" required style={{width:'100%', border:'1px solid var(--border)', background:'var(--cream)', padding:'14px 16px', borderRadius:'12px', outline:'none', fontFamily:"'DM Sans', sans-serif", fontSize:'0.875rem', fontWeight:500}} className="focus:ring-2 focus:ring-amber-300 focus:border-amber-400" value={leadData.phone} onChange={e => setLeadData({...leadData, phone: e.target.value})} />
                                        <input type="email" placeholder="Email Address (Optional)" style={{width:'100%', border:'1px solid var(--border)', background:'var(--cream)', padding:'14px 16px', borderRadius:'12px', outline:'none', fontFamily:"'DM Sans', sans-serif", fontSize:'0.875rem', fontWeight:500}} className="focus:ring-2 focus:ring-amber-300 focus:border-amber-400" value={leadData.email} onChange={e => setLeadData({...leadData, email: e.target.value})} />
                                        <button disabled={isSubmitting} type="submit" className="btn-gold w-full font-black py-4 rounded-xl uppercase tracking-widest mt-2 active:scale-95" style={{fontSize:'0.75rem'}}>
                                            {isSubmitting ? "Processing…" : "Submit Enquiry"}
                                        </button>
                                    </form>
                                </div>
                            </div>
                        )}
                    </>
                );
            }

            return (
                <div className="min-h-screen flex flex-col overflow-x-hidden" style={{backgroundColor:'var(--cream)'}}>
                    
                    {/* STICKY HEADER */}
                    <div className="sticky top-0 z-40 w-full flex flex-col" style={{boxShadow:'0 4px 24px rgba(15,23,42,0.18)'}}>
                        <nav style={{background:'linear-gradient(135deg, #0A1628 0%, #0F172A 100%)'}} className="px-4 md:px-8 py-3 md:py-4 flex justify-between items-center relative z-50 gap-4">
                            <h1 onClick={() => navTo('home')} style={{fontFamily:"'Cormorant Garamond', Georgia, serif", letterSpacing:'-0.02em'}} className="text-xl md:text-2xl font-bold text-white uppercase italic cursor-pointer transition shrink-0 hover:text-yellow-300">
                                Perfect Horizons
                            </h1>
                            
                            {activePage === 'home' && (
                                <div className="hidden lg:flex flex-1 justify-center px-4 max-w-2xl">
                                    <div className="relative w-full group">
                                        <span className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm z-10 transition-colors group-focus-within:text-yellow-400">
                                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                                        </span>
                                        <input type="text" placeholder="Search location, project or builder..." style={{background:'rgba(255,255,255,0.07)', border:'1px solid rgba(255,255,255,0.12)', fontSize:'0.75rem', fontFamily:"'DM Sans', sans-serif"}} className="w-full text-white placeholder-slate-400 rounded-full pl-11 pr-5 py-2.5 font-medium outline-none focus:ring-2 focus:ring-yellow-400/40 focus:border-yellow-400/50 transition-all" value={search} onChange={e => setSearch(e.target.value)} />
                                    </div>
                                </div>
                            )}

                            <div className="hidden md:flex gap-5 lg:gap-7 items-center shrink-0">
                                <button onClick={() => navTo('home')} className={`text-[0.65rem] font-black uppercase tracking-widest transition relative pb-1 ${activePage === 'home' ? 'nav-link-active text-yellow-300' : 'text-slate-300 hover:text-white'}`}>Properties</button>
                                
                                <div className="nav-dropdown-group py-2 cursor-pointer">
                                    <span className={`text-[0.65rem] font-black uppercase tracking-widest transition flex items-center gap-1 ${['about-us','our-journey'].includes(activePage) ? 'text-yellow-300' : 'text-slate-300 hover:text-white'}`}>
                                        About <span className="dropdown-arrow"></span>
                                    </span>
                                    <div className="nav-dropdown-menu">
                                        <div className="nav-dropdown-item" onClick={() => navTo('about-us')}><span className="icon">🏛️</span> About Us</div>
                                        <div className="nav-dropdown-item" onClick={() => navTo('our-journey')}><span className="icon">🗺️</span> Our Journey</div>
                                    </div>
                                </div>

                                <div className="nav-dropdown-group py-2 cursor-pointer">
                                    <span className={`text-[0.65rem] font-black uppercase tracking-widest transition flex items-center gap-1 ${['what-we-do','what-we-dont-do'].includes(activePage) ? 'text-yellow-300' : 'text-slate-300 hover:text-white'}`}>
                                        Services <span className="dropdown-arrow"></span>
                                    </span>
                                    <div className="nav-dropdown-menu">
                                        <div className="nav-dropdown-item" onClick={() => navTo('what-we-do')}><span className="icon">✅</span> What We Do</div>
                                        <div className="nav-dropdown-item" onClick={() => navTo('what-we-dont-do')}><span className="icon">🚫</span> What We Don't Do</div>

                                    {legalModal === 'terms' ? "Terms & Conditions" : "Privacy Policy"}
                                </h2>
                                <div style={{fontSize:'0.8rem', color:'var(--slate-soft)', lineHeight:1.8}} className="space-y-4">
                                    <p style={{fontWeight:600, color:'var(--navy)', background:'var(--gold-light)', padding:'1rem', borderRadius:'10px', border:'1px solid rgba(217,119,6,0.15)', fontSize:'0.78rem'}}>Disclaimer: Perfect Horizons acts solely as an authorized channel partner and real estate advisory. We are not the developers or builders of the properties listed on this website.</p>
                                    <p><strong>Logos & Trademarks:</strong> Any builder logos used on this platform are for representative and associative purposes only and remain the absolute property of their respective trademark owners.</p>
                                    <p><strong>Information Accuracy:</strong> All images, layouts, pricing, and project details displayed are for informational and representational purposes only, sourced from respective developers under fair use policy. We do not guarantee the absolute accuracy of builder-provided data and advise clients to verify all legal and RERA documents independently before making a financial commitment.</p>
                                    <p><strong>Liability:</strong> Perfect Horizons shall not be held liable for any disputes, delays in possession, or discrepancies between the builder's promised specifications and the final delivered product.</p>
                                    <p><strong>Data Privacy:</strong> Any information submitted through our enquiry forms is kept strictly confidential. We do not sell your personal data to third-party marketing agencies. It is used exclusively by our internal advisors to assist you with your property search.</p>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* General Lead Form Modal */}
                    {showLeadForm && (
                        <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-slate-900/90 backdrop-blur-sm animate-fadeIn" onClick={() => setShowLeadForm(false)}>
                            <div style={{background:'var(--card-bg)', borderRadius:'28px', maxWidth:'380px', width:'100%', padding:'2.5rem', boxShadow:'0 32px 80px rgba(15,23,42,0.5), 0 0 0 1px rgba(217,119,6,0.12)', position:'relative'}} onClick={e => e.stopPropagation()}>
                                <button onClick={() => setShowLeadForm(false)} style={{position:'absolute', top:'16px', right:'20px', fontSize:'1.5rem', color:'rgba(100,116,139,0.6)', fontWeight:300, lineHeight:1}} className="hover:text-slate-900 transition">&times;</button>
                                <div style={{height:'3px', background:'linear-gradient(90deg, var(--gold), transparent)', borderRadius:'2px', marginBottom:'1.5rem'}}></div>
                                <h2 style={{fontFamily:"'Cormorant Garamond', Georgia, serif", fontSize:'1.6rem', fontWeight:700, fontStyle:'italic', color:'var(--navy)', marginBottom:'4px', textTransform:'uppercase'}}>Enquiry</h2>
                                <p style={{fontSize:'0.6rem', fontWeight:700, color:'var(--slate-soft)', textTransform:'uppercase', letterSpacing:'0.18em', marginBottom:'1.5rem'}}>Please enter details to proceed</p>
                                <form onSubmit={(e) => handleLeadSubmit(null, "General Enquiry", "Website - General", e)} className="space-y-3 text-left">
                                    <input type="text" placeholder="Full Name" required style={{width:'100%', border:'1px solid var(--border)', background:'var(--cream)', padding:'14px 16px', borderRadius:'12px', outline:'none', fontFamily:"'DM Sans', sans-serif", fontSize:'0.875rem', fontWeight:500}} className="focus:ring-2 focus:ring-amber-300 focus:border-amber-400" value={leadData.name} onChange={e => setLeadData({...leadData, name: e.target.value})} />
                                    <input type="tel" placeholder="Mobile Number (10 Digits)" required style={{width:'100%', border:'1px solid var(--border)', background:'var(--cream)', padding:'14px 16px', borderRadius:'12px', outline:'none', fontFamily:"'DM Sans', sans-serif", fontSize:'0.875rem', fontWeight:500}} className="focus:ring-2 focus:ring-amber-300 focus:border-amber-400" value={leadData.phone} onChange={e => setLeadData({...leadData, phone: e.target.value})} />
                                    <input type="email" placeholder="Email Address (Optional)" style={{width:'100%', border:'1px solid var(--border)', background:'var(--cream)', padding:'14px 16px', borderRadius:'12px', outline:'none', fontFamily:"'DM Sans', sans-serif", fontSize:'0.875rem', fontWeight:500}} className="focus:ring-2 focus:ring-amber-300 focus:border-amber-400" value={leadData.email} onChange={e => setLeadData({...leadData, email: e.target.value})} />
                                    <button disabled={isSubmitting} type="submit" className="btn-gold w-full font-black py-4 rounded-xl uppercase tracking-widest mt-2 active:scale-95" style={{fontSize:'0.75rem'}}>
                                        {isSubmitting ? "Processing…" : "Submit Interest"}
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
