<script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [properties, setProperties] = useState([]);
            const [loading, setLoading] = useState(true);
            const [filters, setFilters] = useState({ bhk: "", location: "", maxPrice: "" });

            // THE SECRET LINK TRICK:
            // This checks the URL for "?key=admin123" to unlock your buttons
            const urlParams = new URLSearchParams(window.location.search);
            const [isAdmin, setIsAdmin] = useState(urlParams.get("key") === "admin123");

            // YOUR GOOGLE SCRIPT URL
            const API_URL = "https://script.google.com/macros/s/AKfycbzORxItxvqlsIUokcs7JCKjFASG2e3y_CrAT2zuy81aEQvLsVG6Sm6CuuSplgWnWh4/exec";

            useEffect(() => {
                fetch(API_URL)
                    .then(res => res.json())
                    .then(data => {
                        setProperties(data);
                        setLoading(false);
                    })
                    .catch(err => console.error("Error fetching data:", err));
            }, []);

            const filteredProperties = properties.filter(prop => {
                const matchBhk = filters.bhk === "" || String(prop.BHK) === filters.bhk;
                const matchLoc = filters.location === "" || (prop.Location && prop.Location.toLowerCase().includes(filters.location.toLowerCase()));
                const matchPrice = filters.maxPrice === "" || Number(prop.Price) <= Number(filters.maxPrice);
                return matchBhk && matchLoc && matchPrice;
            });

            if (loading) return <div className="flex h-screen items-center justify-center font-bold text-blue-600">Loading Portfolio...</div>;

            return (
                <div className="min-h-screen">
                    {/* Navigation - TOGGLE BUTTONS REMOVED FOR SECURITY */}
                    <nav className="bg-white shadow-md px-6 py-4 flex justify-between items-center sticky top-0 z-50">
                        <h1 className="text-xl font-black text-blue-900 tracking-tight">PERFECT HORIZONS</h1>
                    </nav>

                    <main className="max-w-7xl mx-auto p-6">
                        {/* Filter Bar */}
                        <div className="bg-white p-4 rounded-xl shadow-sm border mb-8 flex flex-wrap gap-4 items-end">
                            <div className="flex-1 min-w-[140px]">
                                <label className="text-xs font-bold text-gray-500 uppercase">Location</label>
                                <input type="text" placeholder="Search area..." className="w-full border rounded-lg p-2 text-sm" value={filters.location} onChange={e => setFilters({...filters, location: e.target.value})} />
                            </div>
                            <div className="w-32">
                                <label className="text-xs font-bold text-gray-500 uppercase">BHK</label>
                                <select className="w-full border rounded-lg p-2 text-sm" value={filters.bhk} onChange={e => setFilters({...filters, bhk: e.target.value})}>
                                    <option value="">All</option>
                                    <option value="1">1 BHK</option>
                                    <option value="2">2 BHK</option>
                                    <option value="3">3 BHK</option>
                                    <option value="4">4 BHK</option>
                                </select>
                            </div>
                            <button onClick={() => setFilters({bhk:"", location:"", maxPrice:""})} className="text-blue-600 text-sm font-bold hover:underline">Clear Filters</button>
                        </div>

                        {/* Grid */}
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                            {filteredProperties.map(p => (
                                <div key={p.id} className="bg-white rounded-2xl shadow-sm border overflow-hidden hover:shadow-xl transition-all">
                                    <img src={p.ImageURL || 'https://via.placeholder.com/400x250?text=No+Image'} className="w-full h-52 object-cover" />
                                    <div className="p-5">
                                        <div className="flex justify-between items-start mb-2">
                                            <h2 className="text-xl font-bold">{p.Title}</h2>
                                            <span className="text-blue-600 font-bold">₹{(p.Price/10000000).toFixed(2)} Cr</span>
                                        </div>
                                        <p className="text-gray-500 text-sm mb-4 italic">📍 {p.Location}</p>
                                        
                                        {isAdmin ? (
                                            <div className="grid grid-cols-2 gap-2 border-t pt-4 mt-4">
                                                <a href={p.BrochureURL} target="_blank" className="text-center bg-gray-50 text-blue-700 p-2 rounded text-xs font-bold border hover:bg-blue-50">Share Brochure</a>
                                                <a href={p.ImageURL} target="_blank" className="text-center bg-gray-50 text-blue-700 p-2 rounded text-xs font-bold border hover:bg-blue-50">Share Images</a>
                                                <a href={p.CostSheetURL} target="_blank" className="text-center bg-gray-50 text-blue-700 p-2 rounded text-xs font-bold border hover:bg-blue-50">Share Cost Sheet</a>
                                                <a href={p.MapURL} target="_blank" className="text-center bg-gray-50 text-blue-700 p-2 rounded text-xs font-bold border hover:bg-blue-50">Share Map</a>
                                            </div>
                                        ) : (
                                            <div className="space-y-2 border-t pt-4 mt-4">
                                                <button className="w-full bg-blue-600 text-white font-bold py-2 rounded-lg hover:bg-blue-700">I am Interested</button>
                                                <div className="grid grid-cols-2 gap-2">
                                                    <button className="border p-2 rounded text-xs font-bold hover:bg-gray-50">Request Brochure</button>
                                                    <button className="border p-2 rounded text-xs font-bold hover:bg-gray-50">Request Callback</button>
                                                </div>
                                                <button className="w-full border p-2 rounded text-xs font-bold hover:bg-gray-50">Request Cost Sheet</button>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
