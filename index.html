        const formatIndianCurrencyCompact = (num) => {

        const AUTHORIZED_PARTNERS = [

            convertDriveLink("https://drive.google.com/file/d/11r3Bj7QF_RrKZTvY3q9l4VjJqJZudIl6/view?usp=drive_link"),

            convertDriveLink("https://drive.google.com/file/d/1uMynHYKnkK1g4zyWkBhSagNfv0JzXzJy/view?usp=drive_link"),
            convertDriveLink("https://drive.google.com/file/d/1dl7PKPuDw6Cdoh1ZDpaTxHDCJE5Y8Fej/view?usp=drive_link"),

        ];

        const BLOG_ARTICLES = [
            { id: 1, tag: "Legal Guide", title: "What is UDS (Undivided Share) and Why Does it Matter?", excerpt: "When you buy an apartment, you aren't just buying the flat; you are buying a piece of the land it sits on. Understanding your UDS is critical.", content: `<p>When purchasing an apartment in Bengaluru, many buyers focus entirely on the super built-up area and the amenities. However, the most critical element of your investment is the <strong>Undivided Share of Land (UDS)</strong>.</p><br/><h3 style="font-weight: 900; font-size: 1.1rem; color: #1e3a8a;">What is UDS?</h3><p>UDS is your personal share of the land on which the entire apartment complex is built. Since you cannot physically mark out your exact piece of land in a high-rise, it is expressed as a fraction or percentage.</p><br/><h3 style="font-weight: 900; font-size: 1.1rem; color: #1e3a8a;">Why is it so important?</h3><ul style="list-style-type: disc; margin-left: 20px;"><li><strong>Future Resale Value:</strong> The building structure depreciates over time, but the land appreciates. Your property's true resale value is determined by the UDS.</li><li><strong>Redevelopment:</strong> If the building is demolished or redeveloped 40 years from now, your compensation or new apartment allocation will be based strictly on your UDS.</li></ul><br/><p><strong>The Rule of Thumb:</strong> Always ask the builder for the exact UDS before booking. If the UDS is unusually low compared to the size of your flat, it means the builder is over-utilizing the land, which dilutes your investment.</p>` },
            { id: 2, tag: "Finance Hack", title: "5 Hidden Charges Builders Don't Tell You About", excerpt: "The 'Base Price' is never the final price. From Club House charges to BESCOM deposits, learn how to calculate the actual landed cost.", content: `<p>You see an ad for a luxury 3BHK for "₹1.2 Cr Onwards." You visit the site, fall in love, and sit down to book it—only to realize the final cost is suddenly ₹1.45 Cr. What happened?</p><br/><p>Builders use a "Base Price" for marketing, but the "Landed Cost" includes mandatory hidden fees. Here is what you need to watch out for:</p><br/><ol style="list-style-type: decimal; margin-left: 20px;"><li><strong>BESCOM & BWSSB Charges:</strong> Fees for setting up the electricity and water infrastructure. This can add ₹200-₹300 per sq.ft.</li><li><strong>Clubhouse & Amenity Fees:</strong> Builders often charge a hefty one-time premium (anywhere from ₹2 Lakhs to ₹5 Lakhs) just to use the amenities they advertised.</li><li><strong>Advance Maintenance:</strong> You will typically have to pay 1 to 2 years of maintenance upfront at the time of possession.</li><li><strong>Legal & Documentation Charges:</strong> Builders charge for preparing your sale agreement and legal vetting, usually around ₹30,000 to ₹75,000.</li><li><strong>Floor Rise Premium (PLC):</strong> Prefer a higher floor? Expect to pay an extra ₹15 to ₹50 per sq.ft. for every floor you go up.</li></ol><br/><p>Always demand a comprehensive <strong>Cost Sheet</strong> before paying any token amount so you know exactly what you are paying for.</p>` },
            { id: 3, tag: "Property Types", title: "Carpet Area vs. Super Built-up Area: What Are You Actually Paying For?", excerpt: "Don't be fooled by big numbers. Learn how builders calculate space and why RERA Carpet Area is the only metric that matters.", content: `<p>One of the biggest confusions for home buyers is the difference between the area advertised and the actual livable space they get.</p><br/><h3 style="font-weight: 900; font-size: 1.1rem; color: #1e3a8a;">1. RERA Carpet Area</h3><p>This is the actual usable floor area inside your apartment. Imagine laying a carpet wall-to-wall inside your house—that is the carpet area. Under the RERA act, builders <strong>must</strong> quote this area to buyers.</p><br/><h3 style="font-weight: 900; font-size: 1.1rem; color: #1e3a8a;">2. Built-up Area</h3><p>This includes the Carpet Area PLUS the space taken up by the internal and external walls, and the balconies. It is usually 10-15% more than the Carpet Area.</p><br/><h3 style="font-weight: 900; font-size: 1.1rem; color: #1e3a8a;">3. Super Built-up Area (SBA) / Saleable Area</h3><p>This is the number builders use to calculate your final price. It includes the Built-up Area PLUS a proportionate share of the common areas (lobbies, lifts, staircases, clubhouse). The difference between Carpet Area and SBA is called the "Loading Factor."</p><br/><p><strong>The Trap:</strong> Some builders apply a loading factor of 30-35%. This means if you buy a 1000 sq.ft. apartment (SBA), your actual livable space might only be 650 sq.ft. Always check the RERA Carpet Area to know what you are actually getting.</p>` },
            { id: 4, tag: "Legal Guide", title: "A Khata vs B Khata in Bengaluru: The Ultimate Buyer's Guide", excerpt: "Confused about Khatas? Buying a 'B Khata' property can lead to loan rejections and legal trouble. Here is how to verify property records.", content: `<p>If you are buying property in Bengaluru (especially plots or independent houses), the word "Khata" will come up immediately. It is a BBMP (Bruhat Bengaluru Mahanagara Palike) document assessing the property for tax records.</p><br/><h3 style="font-weight: 900; font-size: 1.1rem; color: #1e3a8a;">What is 'A' Khata?</h3><p>An 'A' Khata certificate means the property is completely legal, fully approved by the BBMP, BDA, or BMRDA, and all property taxes have been paid. <strong>You can easily get home loans and building plan approvals with an 'A' Khata.</strong></p><br/><h3 style="font-weight: 900; font-size: 1.1rem; color: #1e3a8a;">What is 'B' Khata?</h3><p>A 'B' Khata is technically not a certificate; it's just an entry in a register. It signifies that the property is illegal or built in violation of government regulations (e.g., built on unauthorized layouts or lacking DC conversion), but the government is collecting tax on it anyway.</p><br/><h3 style="font-weight: 900; font-size: 1.1rem; color: #1e3a8a;">Why you should avoid B Khata:</h3><ul style="list-style-type: disc; margin-left: 20px;"><li>Nationalized banks (SBI, HDFC) will <strong>not</strong> give you a home loan.</li><li>You cannot get an official building plan approval to construct a house.</li><li>Selling the property later will be extremely difficult.</li></ul><br/><p>Never fall for the "we will upgrade it to A Khata later" promise without verifying with a legal expert.</p>` }
        ];

        // --- ADVANCED EMI CALCULATOR ---
        const EMICalculator = ({ propertyPriceStr, onApplyAction }) => {
            const extractRawNumber = (str) => {
                const val = extractPriceInCr(str);
                return val > 0 ? val * 10000000 : 10000000; 
            };

            const propertyValue = extractRawNumber(propertyPriceStr);
            const [loanAmount, setLoanAmount] = useState(propertyValue * 0.8);
            const [interestRate, setInterestRate] = useState(8.5);
            const [tenureYears, setTenureYears] = useState(20);

            const { emi, totalPayment, totalInterest, principalPct } = useMemo(() => {
                const p = loanAmount;
                const r = interestRate / 12 / 100;
                const n = tenureYears * 12;
                if (p === 0 || r === 0 || n === 0) return { emi: 0, totalPayment: 0, totalInterest: 0, principalPct: 100 };
                
                const emiValue = (p * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
                const totalPay = emiValue * n;
                const totalInt = totalPay - p;
                const pct = (p / totalPay) * 100;

                return { 
                    emi: Math.round(emiValue), 
                    totalPayment: Math.round(totalPay), 
                    totalInterest: Math.round(totalInt), 
                    principalPct: pct.toFixed(1) 
                };
            }, [loanAmount, interestRate, tenureYears]);

            return (
                <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-[0_4px_20px_-4px_rgba(0,0,0,0.1)] mt-6">

                                <span className="text-[10px] font-black text-slate-900">{formatIndianCurrencyCompact(loanAmount)}</span>
                            </div>
                            <div className="flex justify-between items-center">
                                <div className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-slate-300"></span><span className="text-[9px] font-bold text-slate-500 uppercase tracking-widest">Interest</span></div>
                                <span className="text-[10px] font-black text-slate-900">{formatIndianCurrencyCompact(totalInterest)}</span>
                            </div>

                            </div>
                            <input type="range" min="1000000" max="50000000" step="100000" value={loanAmount} onChange={(e) => setLoanAmount(Number(e.target.value))} />
                        </div>

                        <div>
                            <div className="flex justify-between mb-2">
                                <label className="text-[10px] font-black uppercase text-slate-400 tracking-widest">Interest Rate</label>
                                <span className="text-xs font-black text-blue-600 bg-blue-50 px-2 py-0.5 rounded">{interestRate}%</span>
                            </div>
                            <input type="range" min="6" max="15" step="0.1" value={interestRate} onChange={(e) => setInterestRate(Number(e.target.value))} />
                        </div>

                        <div>
                            <div className="flex justify-between mb-2">
                                <label className="text-[10px] font-black uppercase text-slate-400 tracking-widest">Tenure</label>
                                <span className="text-xs font-black text-blue-600 bg-blue-50 px-2 py-0.5 rounded">{tenureYears} Yrs</span>
                            </div>
                            <input type="range" min="5" max="30" step="1" value={tenureYears} onChange={(e) => setTenureYears(Number(e.target.value))} />

                        <div className="pt-5 border-t border-slate-100 flex justify-between items-center">
                            <div>
                                <div className="text-[9px] font-black uppercase text-slate-400 tracking-widest mb-1">Estimated EMI</div>
                                <div className="text-2xl font-black text-slate-900 tracking-tighter">{formatIndianCurrencyCompact(emi)} <span className="text-[10px] text-slate-400 font-bold tracking-normal uppercase">/mo</span></div>
                            </div>

        // --- FULL PAGE PROPERTY DETAILS ---
        const PropertyDetailsPage = ({ property, allProperties, onBack, onSubmitLead, isAdmin, onSelectProperty }) => {

            const cover = convertDriveLink(getVal(property, "cover_image") || getVal(property, "cover-image"));

            const imgs = (typeof galRaw === 'string' && galRaw.length > 5) ? galRaw.split(',').map(l => convertDriveLink(l.trim())) : [];
            const allImgs = [cover, ...imgs].filter(i => i && !i.includes('undefined')); 

            const projectUsps = getVal(property, "usp-details") || getVal(property, "usp_details") || getVal(property, "USP's") || getVal(property, "Project Highlights");

            const similarProperties = useMemo(() => {
                if (!allProperties || allProperties.length === 0) return [];
                return allProperties

            return (

                                <span className="text-sm">📞</span> Call Us
                            </a>
                            
                            {/* DESKTOP Call Number Text */}
                            <div className="hidden md:flex text-slate-700 font-black uppercase tracking-widest text-xs flex items-center gap-2">
                                <span className="text-lg">📞</span> +91 {WHATSAPP_NUMBER}
                            </div>
                        </div>
                    </div>

                    <div className="max-w-7xl mx-auto w-full p-4 md:p-8 animate-fadeIn">

                                    <input type="tel" placeholder="Mobile Number (10 Digits)" required className="w-full border border-gray-200 bg-gray-50 p-4 rounded-xl outline-none font-bold text-sm focus:ring-2 focus:ring-blue-500 transition" value={leadData.phone} onChange={e => setLeadData({...leadData, phone: e.target.value})} />

        function App() {
            const [properties, setProperties] = useState([]);

            const [selectedProperty, setSelectedProperty] = useState(null);
            
            const [search, setSearch] = useState("");
            const [isMobileSearchOpen, setIsMobileSearchOpen] = useState(false);
            const [isMobileFilterOpen, setIsMobileFilterOpen] = useState(false);
            
            const [filters, setFilters] = useState({ bhk: "", status: "", type: "", priceBracket: "" });
            const [showLeadForm, setShowLeadForm] = useState(false);
            const [leadData, setLeadData] = useState({ name: "", phone: "", email: "" });
            const [isSubmitting, setIsSubmitting] = useState(false);
            
            const [activePage, setActivePage] = useState(() => window.location.hash.replace('#', '') || 'home'); 
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            const [mobileAboutOpen, setMobileAboutOpen] = useState(false);
            const [mobileServicesOpen, setMobileServicesOpen] = useState(false);
            const [activeBlog, setActiveBlog] = useState(null);

            const [legalModal, setLegalModal] = useState(null); 

            useEffect(() => {
                const urlParams = new URLSearchParams(window.location.search);
                if (urlParams.get("key") === "admin123") setIsAdmin(true);

                const handleHashChange = () => {
                    const hash = window.location.hash.replace('#', '');
                    setActivePage(hash || 'home');
                    if(hash !== 'home') setSelectedProperty(null);
                    if(hash !== 'blogs') setActiveBlog(null);
                };
                window.addEventListener('hashchange', handleHashChange);
                
                const fetchProperties = async () => {
                    try {
                        const { data, error } = await supabase.from('properties').select('*');
                        if (!error) setProperties(data || []);
                    } catch (error) { console.error(error); } 
                    finally { setLoading(false); }
                };
                fetchProperties();
                return () => window.removeEventListener('hashchange', handleHashChange);
            }, []);

            const handleLeadSubmit = async (dataToSubmit, projectName, actionType = "General Enquiry", event = null) => {
                if(event) event.preventDefault(); 

                const data = dataToSubmit || leadData;
                const project = projectName || "General Enquiry";
                const sourceContext = actionType === 'brochure' ? "Website - Brochure Download" 
                                    : actionType === 'cost_sheet' ? "Website - Cost Sheet Request" 
                                    : actionType === 'apply_now' ? "Website - EMI Apply" 
                                    : "Website - General";
                
                if (!/^[6-9]\d{9}$/.test(data.phone)) { alert("Enter valid 10-digit number"); return false; }
                if (!dataToSubmit) setIsSubmitting(true);

                try {
                    const { error } = await supabase.from('leads').insert([{
                        customer_name: data.name, 
                        phone_number: data.phone,
                        customer_email: data.email || null,
                        project_interested_in: project, 
                        lead_status: "Un called", 
                        lead_source: sourceContext, 
                        psa_agent_name: "Tharun" 
                    }]);

                    if (error) throw error; 

                    fetch(GOOGLE_SCRIPT_URL, {
                        method: "POST",
                        body: JSON.stringify({
                            action: "sendLead",
                            Name: data.name,
                            Phone: data.phone,
                            Email: data.email || 'N/A',
                            Project: project,
                            Source: sourceContext,
                            Requirements: 'None'
                        })
                    }).catch(err => console.log("Email Error:", err));

                    if (!dataToSubmit) {
                        alert("Interest Registered! Our advisor will contact you shortly.");
                        setShowLeadForm(false); 
                        setLeadData({ name: "", phone: "", email: "" });
                    }
                    return true;
                } catch (error) {
                    alert("Error saving details. Please try again.");
                    return false;
                } finally {
                    if (!dataToSubmit) setIsSubmitting(false);
                }
            };

            const safeProperties = Array.isArray(properties) ? properties : [];
            const filtered = safeProperties.filter(p => {
                if (!p || typeof p !== 'object') return false; 
                const term = search.toLowerCase();
                const pName = String(getVal(p, "Property Name")).toLowerCase();
                const pLoc = String(getVal(p, "Location")).toLowerCase();
                const pBuild = String(getVal(p, "Builder Name")).toLowerCase();
                
                const matchSearch = !term || pName.includes(term) || pLoc.includes(term) || pBuild.includes(term);
                const matchBHK = !filters.bhk || String(getVal(p, "No of BHK's") || getVal(p, "bhk")).includes(filters.bhk);
                const matchStatus = !filters.status || String(getVal(p, "Construction Status")).includes(filters.status);
                const matchType = !filters.type || String(getVal(p, "Property Type")).includes(filters.type);
                
                const priceInCr = extractPriceInCr(getVal(p, "Price"));
                let matchPrice = true;
                if (filters.priceBracket) {
                    if (priceInCr > 0) {
                        if (filters.priceBracket === "under1") matchPrice = priceInCr < 1;
                        else if (filters.priceBracket === "1-2") matchPrice = priceInCr >= 1 && priceInCr < 2;
                        else if (filters.priceBracket === "2-3") matchPrice = priceInCr >= 2 && priceInCr < 3;
                        else if (filters.priceBracket === "3-4") matchPrice = priceInCr >= 3 && priceInCr < 4;
                        else if (filters.priceBracket === "4-5") matchPrice = priceInCr >= 4 && priceInCr < 5;
                        else if (filters.priceBracket === "5plus") matchPrice = priceInCr >= 5;
                    } else { matchPrice = false; }
                }

                return matchSearch && matchBHK && matchStatus && matchType && matchPrice;
            });

            const navTo = (page) => {
                setIsMobileMenuOpen(false);
                setMobileAboutOpen(false);
                setMobileServicesOpen(false);
                setActiveBlog(null);
                setSelectedProperty(null);
                window.location.hash = page;
                window.scrollTo(0,0);

            if (selectedProperty) {
                return <PropertyDetailsPage property={selectedProperty} allProperties={safeProperties} onBack={() => setSelectedProperty(null)} onSubmitLead={handleLeadSubmit} isAdmin={isAdmin} onSelectProperty={setSelectedProperty} />;

            return (

                                    </div>
                                </div>

                                <div className="relative group cursor-pointer py-2">
                                    <span className={`text-xs font-black uppercase tracking-widest transition flex items-center ${['what-we-do', 'what-we-dont-do'].includes(activePage) ? 'text-blue-400 pb-1' : 'text-slate-300 hover:text-white'}`}>Services <span className="dropdown-arrow"></span></span>
