<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfect Horizons | Property Portal</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fadeIn { animation: fadeIn 0.15s ease-out forwards; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- CONFIGURATION ---
        const LEAD_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzKmjXhueUDqDJ2HwalGBuRk4WfEEx-ruYZJ5IeSCIMxSDuEwaCAMspYBq-zMrFzmY/exec';
        const API_URL = "https://script.google.com/macros/s/AKfycbzORxItxvqlsIUokcs7JCKjFASG2e3y_CrAT2zuy81aEQvLsVG6Sm6CuuSplgWnWh4/exec";
        const WHATSAPP_NUMBER = "919742353260";
        const ADMIN_PIN = "1234"; 

        const fixImageUrl = (u) => {
            if (!u || typeof u !== 'string') return 'https://via.placeholder.com/800x500?text=No+Image';
            let url = u.split(',')[0].trim();
            let id = url.match(/\/d\/(.*?)\//)?.[1] || url.split('id=')[1];
            return id ? `https://drive.google.com/thumbnail?id=${id}&sz=w1000` : url;
        };

        const formatPayout = (val) => {
            if (typeof val === 'number' && val < 1) return (val * 100).toFixed(0) + "%";
            return val;
        };

        function App() {
            const [properties, setProperties] = useState([]);
            const [loading, setLoading] = useState(true);
            const [isAdmin, setIsAdmin] = useState(false);
            const [selectedProperty, setSelectedProperty] = useState(null);
            const [search, setSearch] = useState("");
            const [filters, setFilters] = useState({ bhk: "", status: "", type: "" });
            const [showLeadForm, setShowLeadForm] = useState(false);
            const [leadData, setLeadData] = useState({ name: "", phone: "" });
            const [isSubmitting, setIsSubmitting] = useState(false);

            useEffect(() => {
                const urlParams = new URLSearchParams(window.location.search);
                if (urlParams.get("key") === "admin123") setIsAdmin(true);
                const cached = localStorage.getItem('ph_portal_cache_v6');
                if (cached) { setProperties(JSON.parse(cached)); setLoading(false); }
                fetch(API_URL).then(res => res.json()).then(data => {
                    setProperties(data); setLoading(false);
                    localStorage.setItem('ph_portal_cache_v6', JSON.stringify(data));
                }).catch(() => setLoading(false));
            }, []);

            const loginAdmin = () => {
                const pin = prompt("Enter 4-Digit Admin PIN:");
                if (pin === ADMIN_PIN) { setIsAdmin(true); alert("Admin Access Granted"); }
                else { alert("Incorrect PIN"); }
            };

            const handleLeadSubmit = (e) => {
                e.preventDefault();
                if (!/^[6-9]\d{9}$/.test(leadData.phone)) return alert("Enter valid 10-digit number");
                setIsSubmitting(true);
                fetch(LEAD_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({
                    name: leadData.name, phone: leadData.phone, property: selectedProperty["Property Name"]
                })}).then(() => {
                    alert("Interest Registered!");
                    setIsSubmitting(false); setShowLeadForm(false); setLeadData({ name: "", phone: "" });
                });
            };

            const filtered = properties.filter(p => {
                const term = search.toLowerCase();
                const matchSearch = !search || (p["Property Name"]?.toLowerCase().includes(term)) || (p.Location?.toLowerCase().includes(term));
                const matchBHK = !filters.bhk || String(p["No of BHK's"]).includes(filters.bhk);
                const matchStatus = !filters.status || p["Construction Status"] === filters.status;
                const matchType = !filters.type || p["Property Type"] === filters.type;
                return matchSearch && matchBHK && matchStatus && matchType;
            });

            if (loading && properties.length === 0) return <div className="h-screen flex items-center justify-center font-black text-blue-900 animate-pulse italic">PERFECT HORIZONS...</div>;

            return (
                <div className="min-h-screen flex flex-col">
                    <nav className="bg-white shadow-sm px-6 py-5 sticky top-0 z-40 border-b flex justify-between items-center">
                        <h1 className="text-xl font-black text-blue-900 tracking-tighter uppercase italic">Perfect Horizons</h1>
                        {isAdmin && <span className="bg-green-600 text-white text-[10px] px-3 py-1 rounded-full font-bold uppercase tracking-widest">Admin Mode</span>}
                    </nav>

                    <main className="max-w-7xl mx-auto p-4 md:p-8 flex-grow w-full">
                        {/* SEARCH & FILTERS */}
                        <div className="bg-white p-6 rounded-3xl shadow-sm border mb-8 space-y-4">
                            <input type="text" placeholder="Search Location or Property..." className="w-full bg-gray-50 border-none rounded-2xl p-4 text-sm outline-none ring-1 ring-gray-200 focus:ring-2 focus:ring-blue-600" value={search} onChange={e => setSearch(e.target.value)} />
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                                <select className="bg-gray-50 p-3 rounded-xl text-xs font-bold outline-none" value={filters.bhk} onChange={e => setFilters({...filters, bhk: e.target.value})}>
                                    <option value="">All BHK</option>
                                    {[1,2,3,4,5].map(n => <option key={n} value={n}>{n} BHK</option>)}
                                </select>
                                <select className="bg-gray-50 p-3 rounded-xl text-xs font-bold outline-none" value={filters.status} onChange={e => setFilters({...filters, status: e.target.value})}>
                                    <option value="">Status</option>
                                    <option value="Ready to Move">Ready to Move</option>
                                    <option value="Under Construction">Under Construction</option>
                                    <option value="New Launch">New Launch</option>
                                </select>
                                <select className="bg-gray-50 p-3 rounded-xl text-xs font-bold outline-none" value={filters.type} onChange={e => setFilters({...filters, type: e.target.value})}>
                                    <option value="">Type</option>
                                    <option value="Apartment">Apartment</option>
                                    <option value="Villa">Villa</option>
                                    <option value="Plot">Plot</option>
                                </select>
                                <button onClick={() => {setSearch(""); setFilters({bhk:"", status:"", type:""})}} className="text-blue-600 font-bold text-xs uppercase tracking-widest">Clear</button>
                            </div>
                        </div>

                        {/* GRID */}
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                            {filtered.map((p, i) => (
                                <div key={i} onClick={() => setSelectedProperty(p)} className="bg-white rounded-[35px] shadow-sm border overflow-hidden hover:shadow-2xl transition-all cursor-pointer group flex flex-col">
                                    <div className="relative h-56 overflow-hidden shrink-0">
                                        <img src={fixImageUrl(p["Cover Image"])} className="w-full h-full object-cover group-hover:scale-105 transition duration-500" />
                                        <div className="absolute top-4 left-4 bg-white/90 backdrop-blur px-3 py-1 rounded-lg text-[9px] font-black uppercase tracking-widest text-blue-900">{p["Construction Status"] || 'Verified'}</div>
                                    </div>
                                    <div className="p-7 flex-grow">
                                        <div className="text-[9px] font-bold text-blue-600 uppercase tracking-[0.2em] mb-1">{p["Property Type"] || 'Residential'}</div>
                                        <h2 className="text-xl font-black uppercase tracking-tighter line-clamp-1">{p["Property Name"]}</h2>
                                        <p className="text-gray-400 text-sm mb-4">📍 {p.Location}</p>
                                        <div className="flex justify-between items-center border-t pt-4">
                                            <span className="text-blue-600 font-black text-2xl italic">{p.Price}</span>
                                            <span className="text-[10px] font-bold text-gray-400 uppercase tracking-widest">{p["No of BHK's"]} BHK</span>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </main>

                    {/* DETAILS MODAL */}
                    {selectedProperty && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
                            <div className="absolute inset-0 bg-black/80 backdrop-blur-sm" onClick={() => setSelectedProperty(null)}></div>
                            <div className="bg-white rounded-[40px] w-full max-w-4xl max-h-[90vh] overflow-hidden relative z-10 animate-fadeIn flex flex-col shadow-2xl">
                                <div className="overflow-y-auto w-full hide-scroll p-6 md:p-10">
                                    <button onClick={() => setSelectedProperty(null)} className="absolute top-6 right-6 bg-black/50 text-white w-10 h-10 rounded-full z-20 font-bold hover:bg-black transition">✕</button>
                                    <img src={fixImageUrl(selectedProperty["Cover Image"])} className="w-full h-64 md:h-96 object-cover rounded-[30px] mb-8" />
                                    
                                    <div className="flex flex-col md:flex-row justify-between mb-8 border-b pb-8">
                                        <div>
                                            <div className="text-xs font-bold text-blue-600 uppercase tracking-widest mb-1">{selectedProperty["Property Type"]} • {selectedProperty["Construction Status"]}</div>
                                            <h1 className="text-4xl font-black uppercase tracking-tighter">{selectedProperty["Property Name"]}</h1>
                                            <p className="text-gray-500 text-lg">📍 {selectedProperty.Location} • <span className="text-blue-900 font-bold">{selectedProperty["Approval "] || 'RERA Pending'}</span></p>
                                        </div>
                                        <div className="text-left md:text-right mt-4 md:mt-0">
                                            <div className="text-blue-600 font-black text-4xl italic">{selectedProperty.Price}</div>
                                            <div className="text-xs font-bold text-gray-400 uppercase tracking-widest mt-1">{selectedProperty["No of BHK's"]} BHK Options</div>
                                        </div>
                                    </div>

                                    {/* ADMIN ONLY SECTION */}
                                    {isAdmin && (
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
                                            <div className="bg-yellow-50 border-2 border-yellow-200 p-6 rounded-3xl">
                                                <h4 className="text-[10px] font-black uppercase text-yellow-700 mb-2 tracking-widest">Internal Payout</h4>
                                                <p className="text-3xl font-black text-yellow-900">{formatPayout(selectedProperty["Commission Details"])}</p>
                                            </div>
                                            <div className="bg-blue-50 border-2 border-blue-200 p-6 rounded-3xl">
                                                <h4 className="text-[10px] font-black uppercase text-blue-700 mb-2 tracking-widest">POC & Availability</h4>
                                                <p className="text-sm font-bold text-blue-900 mb-1 leading-relaxed">POC: {selectedProperty["Point of Contact"] || "N/A"}</p>
                                                <p className="text-sm font-bold text-blue-900">Availability: {selectedProperty["Availability"] || "Check Sheet"}</p>
                                            </div>
                                        </div>
                                    )}

                                    {/* ACTION BUTTONS */}
                                    <div className="bg-gray-50 p-6 rounded-[35px] border border-gray-100">
                                        {isAdmin ? (
                                            <div className="grid grid-cols-2 gap-3">
                                                <a href={selectedProperty["Website Link"] || "#"} target="_blank" className="bg-white border-2 border-gray-200 p-4 rounded-2xl text-xs font-black text-center uppercase">Builder Website</a>
                                                <a href="https://docs.google.com/spreadsheets/d/1NVv5skVQzT2DzBBw9Ju0iN38rzbsk8nqZ_T8QYxjQ6I/edit" target="_blank" className="bg-blue-900 text-white p-4 rounded-2xl text-xs font-black text-center uppercase">Lead Management</a>
                                                <a href={selectedProperty["Brochure"] || "#"} target="_blank" className="bg-white border-2 border-gray-200 p-4 rounded-2xl text-xs font-black text-center uppercase">View Brochure</a>
                                                <a href={selectedProperty["Map Link"] || "#"} target="_blank" className="bg-white border-2 border-gray-200 p-4 rounded-2xl text-xs font-black text-center uppercase">Map & Location</a>
                                            </div>
                                        ) : (
                                            <div className="flex flex-col gap-3">
                                                <button onClick={() => setShowLeadForm(true)} className="bg-blue-600 text-white font-black py-5 rounded-2xl uppercase tracking-widest shadow-xl shadow-blue-200 hover:bg-blue-700 transition active:scale-95">I am Interested</button>
                                                <div className="grid grid-cols-3 gap-2">
                                                    <a href={`https://wa.me/${WHATSAPP_NUMBER}?text=Brochure: ${selectedProperty["Property Name"]}`} className="bg-white border p-3 rounded-xl text-[10px] font-bold text-center uppercase">Brochure</a>
                                                    <a href={`https://wa.me/${WHATSAPP_NUMBER}?text=Cost: ${selectedProperty["Property Name"]}`} className="bg-white border p-3 rounded-xl text-[10px] font-bold text-center uppercase">Cost Sheet</a>
                                                    <a href={`https://wa.me/${WHATSAPP_NUMBER}?text=Callback: ${selectedProperty["Property Name"]}`} className="bg-white border p-3 rounded-xl text-[10px] font-bold text-center uppercase">Callback</a>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* FOOTER */}
                    <footer className="bg-slate-900 text-white p-12 mt-auto">
                        <div className="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-12">
                            <div>
                                <h3 className="text-xl font-black italic uppercase text-blue-500 mb-4 tracking-tighter">About Perfect Horizons</h3>
                                <p className="text-slate-400 text-sm leading-relaxed">Authorized channel partners providing unbiased advice to homebuyers in Bengaluru. We simplify the real estate journey with transparency and expert guidance.</p>
                                <button onClick={loginAdmin} className="mt-8 text-[9px] text-slate-600 uppercase font-black tracking-widest hover:text-blue-400 transition">Management Login</button>
                            </div>
                            <div className="space-y-4">
                                <h3 className="text-xs font-black text-slate-500 uppercase tracking-[0.2em] mb-4">Contact Details</h3>
                                <p className="text-sm">📞 +91 9742353260</p>
                                <p className="text-sm underline">✉️ perfecthorizons.in@gmail.com</p>
                                <p className="text-sm text-slate-500 italic">📍 Hosa Road, Bengaluru</p>
                            </div>
                            <div>
                                <h3 className="text-xs font-black text-slate-500 uppercase tracking-[0.2em] mb-4">Social Media</h3>
                                <div className="flex gap-4">
                                    <a href="#" className="bg-slate-800 p-3 rounded-xl text-xs font-bold hover:bg-blue-600 transition">Instagram</a>
                                    <a href="#" className="bg-slate-800 p-3 rounded-xl text-xs font-bold hover:bg-green-600 transition">WhatsApp</a>
                                </div>
                            </div>
                        </div>
                    </footer>

                    {/* LEAD FORM */}
                    {showLeadForm && (
                        <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-black/90 backdrop-blur-md">
                            <div className="bg-white rounded-[40px] p-10 w-full max-w-sm animate-fadeIn shadow-2xl text-center">
                                <h2 className="text-3xl font-black text-blue-900 mb-2 italic tracking-tighter uppercase">Enquiry</h2>
                                <p className="text-gray-400 text-[10px] uppercase font-bold tracking-widest mb-8">Verified Property Lead</p>
                                <form onSubmit={handleLeadSubmit} className="space-y-4">
                                    <input type="text" placeholder="Full Name" className="w-full border-none bg-gray-50 p-4 rounded-2xl outline-none text-sm font-bold" value={leadData.name} onChange={e => setLeadData({...leadData, name: e.target.value})} />
                                    <input type="tel" placeholder="10-Digit Mobile" className="w-full border-none bg-gray-50 p-4 rounded-2xl outline-none text-sm font-bold" value={leadData.phone} onChange={e => setLeadData({...leadData, phone: e.target.value})} />
                                    <button disabled={isSubmitting} type="submit" className="w-full bg-blue-600 text-white font-black py-4 rounded-2xl uppercase tracking-widest shadow-lg">{isSubmitting ? "Processing..." : "Submit Interest"}</button>
                                    <p onClick={() => setShowLeadForm(false)} className="text-center text-gray-400 text-xs cursor-pointer mt-4 font-bold hover:text-blue-600">Cancel</p>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
