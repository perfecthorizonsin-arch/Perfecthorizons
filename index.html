        ];

        const getVal = (obj, searchKey) => {
            if (!obj) return "";
            if (obj[searchKey] !== undefined && obj[searchKey] !== "") return obj[searchKey];
            const cleanKey = searchKey.replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
            for (let k in obj) {
                if (k.replace(/[^a-zA-Z0-9]/g, '').toLowerCase() === cleanKey) return obj[k];
            }
            return "";
        };

        const fixImageUrl = (u) => {
            if (!u || typeof u !== 'string') return 'https://via.placeholder.com/800x500?text=No+Image';
            let url = u.split(',')[0].trim();
            let id = url.match(/\/d\/(.*?)\//)?.[1] || url.split('id=')[1];
            return id ? `https://drive.google.com/thumbnail?id=${id}&sz=w1000` : url;
        };

        const extractPriceInCr = (priceString) => {
            if (!priceString) return 0;
            try {
                const cleanStr = String(priceString).toLowerCase().replace(/,/g, '');
                const numMatch = cleanStr.match(/[0-9.]+/); 
                if (!numMatch) return 0;
                const val = parseFloat(numMatch[0]);
                if (isNaN(val)) return 0;
                if (cleanStr.includes('cr') || cleanStr.includes('crore')) return val;
                if (cleanStr.includes('lac') || cleanStr.includes('lakh')) return val / 100;
                if (val > 100000) return val / 10000000; 
                return 0; 
            } catch(e) { return 0; }
        };

        // --- NEW: EMI CALCULATOR COMPONENT ---
        const EMICalculator = ({ propertyPriceStr }) => {
            const extractRawNumber = (str) => {
                const val = extractPriceInCr(str);
                return val > 0 ? val * 10000000 : 10000000; 
            };

            const propertyValue = extractRawNumber(propertyPriceStr);
            const [loanAmount, setLoanAmount] = useState(propertyValue * 0.8); 
            const [interestRate, setInterestRate] = useState(8.5);
            const [tenureYears, setTenureYears] = useState(20);

            const emi = useMemo(() => {
                const p = loanAmount;
                const r = interestRate / 12 / 100;
                const n = tenureYears * 12;
                if (p === 0 || r === 0 || n === 0) return 0;
                const calcEmi = (p * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
                return Math.round(calcEmi);
            }, [loanAmount, interestRate, tenureYears]);

            const formatCurrency = (num) => new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(num);

            return (

                    <div className="space-y-6">

                            </div>
                            <input type="range" min="1000000" max={propertyValue * 1.2} step="100000" value={loanAmount} onChange={(e) => setLoanAmount(Number(e.target.value))} />
                        </div>

                        <div>
                            <div className="flex justify-between mb-2">
                                <label className="text-[10px] font-black uppercase text-slate-500 tracking-widest">Interest Rate</label>
                                <span className="text-xs font-black text-blue-600">{interestRate}%</span>
                            </div>
                            <input type="range" min="6" max="15" step="0.1" value={interestRate} onChange={(e) => setInterestRate(Number(e.target.value))} />
                        </div>

                        <div>
                            <div className="flex justify-between mb-2">
                                <label className="text-[10px] font-black uppercase text-slate-500 tracking-widest">Tenure</label>
                                <span className="text-xs font-black text-blue-600">{tenureYears} Years</span>
                            </div>
                            <input type="range" min="5" max="30" step="1" value={tenureYears} onChange={(e) => setTenureYears(Number(e.target.value))} />
                        </div>

                        <div className="pt-6 border-t border-slate-100 mt-2">
                            <div className="text-[10px] font-black uppercase text-slate-400 tracking-widest mb-1">Estimated EMI</div>
                            <div className="text-3xl font-black text-slate-900 tracking-tighter">{formatCurrency(emi)} <span className="text-sm text-slate-400 font-bold tracking-normal">/month</span></div>
                        </div>
                    </div>

            );
        };

        // --- NEW: JLL-STYLE FULL PAGE PROPERTY COMPONENT ---

            const cover = fixImageUrl(getVal(property, "Cover Image") || getVal(property, "cover_image"));
            const galRaw = getVal(property, "gallery_images") || getVal(property, "Images and short videos \nif any") || "";
            const imgs = (typeof galRaw === 'string' && galRaw.length > 5) ? galRaw.split(',').map(l => fixImageUrl(l.trim())) : [];
            const allImgs = [cover, ...imgs].filter(i => i && !i.includes('undefined')).slice(0, 4);

            return (
                <div className="min-h-screen bg-slate-50 animate-fadeIn pb-20">
                    {/* Top Navigation */}

                        </button>
                        <div className="hidden md:block text-[10px] font-black uppercase tracking-widest text-slate-400 bg-slate-50 px-4 py-2 rounded-full border border-slate-100">
                            {getVal(property, "Location")} • {getVal(property, "Builder Name")}
                        </div>
                    </div>

                    <div className="max-w-7xl mx-auto w-full p-4 md:p-8">
                        {/* Hero Image Grid */}
                        <div className="grid grid-cols-1 md:grid-cols-4 gap-2 md:gap-4 h-[40vh] md:h-[60vh] rounded-[30px] overflow-hidden mb-8 shadow-sm">
                            <div className="md:col-span-3 h-full relative group">
                                <img src={allImgs[0]} className="w-full h-full object-cover" />
                                <div className="absolute bottom-6 left-6 md:bottom-10 md:left-10 bg-slate-900/90 backdrop-blur-md text-white p-6 rounded-3xl shadow-xl">
                                    <div className="text-[10px] font-black uppercase tracking-widest text-blue-400 mb-2">{getVal(property, "Property Type") || 'Apartment'}</div>
                                    <h1 className="text-3xl md:text-5xl font-black uppercase tracking-tighter leading-none">{getVal(property, "Property Name")}</h1>
                                    <div className="mt-3 text-xs md:text-sm font-bold text-slate-300">By {getVal(property, "Builder Name")}</div>
                                </div>

                            <div className="hidden md:grid grid-rows-3 gap-4 h-full">
                                {allImgs.slice(1, 4).map((img, i) => (
                                    <div key={i} className="h-full w-full overflow-hidden rounded-[20px]"><img src={img} className="w-full h-full object-cover hover:scale-110 transition duration-500" /></div>
                                ))}
                                {Array.from({ length: Math.max(0, 3 - allImgs.slice(1).length) }).map((_, i) => (
                                    <div key={`empty-${i}`} className="h-full w-full bg-slate-200 rounded-[20px] flex items-center justify-center text-slate-400 text-xs font-bold uppercase">No Image</div>

                            </div>

                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-8 md:gap-12">
                            {/* Left Content Area */}
                            <div className="lg:col-span-2 space-y-10">
                                {/* Highlights Strip */}
                                <div className="bg-white p-6 md:p-8 rounded-[30px] border border-slate-200 shadow-sm flex flex-wrap gap-6 md:gap-12 items-center justify-between">

                                    </div>

                                    <div>
                                        <div className="text-[10px] font-black uppercase text-slate-400 tracking-widest mb-1">Possession</div>
                                        <div className="text-lg md:text-2xl font-black text-slate-900">{getVal(property, "Possession Date") ? new Date(getVal(property, "Possession Date")).getFullYear() : 'On Request'}</div>
                                    </div>
                                    <div className="bg-green-50 px-4 py-2 rounded-xl border border-green-100">
                                        <div className="text-[10px] font-black uppercase text-green-600 tracking-widest mb-1">RERA</div>

                                {/* About Section */}

                                    <p className="text-slate-600 text-sm md:text-base leading-relaxed whitespace-pre-wrap">
                                        {getVal(property, "description") || `Experience unparalleled luxury and comfort at ${getVal(property, "Property Name")}. Located in the prime neighborhood of ${getVal(property, "Location")}, this project by ${getVal(property, "Builder Name")} offers meticulously designed ${getVal(property, "bhk") || getVal(property, "No of BHK's")} BHK homes. Discover a lifestyle defined by modern architecture, vast open spaces, and world-class connectivity.`}
                                    </p>
                                </div>

                                {/* USPs & Amenities */}
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    {(getVal(property, "USP's") || getVal(property, "usps")) && (
                                        <div className="bg-blue-50 p-8 rounded-[30px] border border-blue-100">
                                            <h3 className="text-sm font-black uppercase tracking-widest text-blue-900 mb-6">Key Highlights</h3>
                                            <ul className="space-y-4">
                                                {String(getVal(property, "USP's") || getVal(property, "usps")).split('\n').filter(u => u.trim() !== "").map((u, i) => (

                                    {getVal(property, "Amenities") && (
                                        <div className="bg-slate-900 p-8 rounded-[30px] border border-slate-800">
                                            <h3 className="text-sm font-black uppercase tracking-widest text-white mb-6">Amenities</h3>
                                            <ul className="space-y-4">

                            {/* Right Column (Sticky Sidebar) */}
                            <div className="lg:col-span-1">

                                    {/* Pricing & Form Box */}

                                            <input type="tel" placeholder="Mobile Number" required className="w-full bg-slate-50 border border-slate-200 p-4 rounded-xl text-sm font-bold outline-none focus:ring-2 focus:ring-blue-500 transition" value={leadData.phone} onChange={e => setLeadData({...leadData, phone: e.target.value})} />
                                            <button disabled={isSubmitting} type="submit" className="w-full bg-blue-600 text-white font-black py-4 rounded-xl uppercase tracking-widest hover:bg-slate-900 transition-colors shadow-lg shadow-blue-500/30">
                                                {isSubmitting ? "Registering..." : "Get Details Now"}
                                            </button>

                                        <div className="mt-6 text-center">

        };

        function App() {
            const [properties, setProperties] = useState([]);
            const [loading, setLoading] = useState(true);
            const [isAdmin, setIsAdmin] = useState(false);
            const [selectedProperty, setSelectedProperty] = useState(null);
            const [search, setSearch] = useState("");
            const [filters, setFilters] = useState({ bhk: "", status: "", type: "", priceBracket: "" });
            const [showLeadForm, setShowLeadForm] = useState(false);
            const [leadData, setLeadData] = useState({ name: "", phone: "" });
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [activePage, setActivePage] = useState(() => window.location.hash.replace('#', '') || 'home'); 
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            const [isMobileSearchOpen, setIsMobileSearchOpen] = useState(false);
            const [activeBlog, setActiveBlog] = useState(null);

            useEffect(() => {
                const urlParams = new URLSearchParams(window.location.search);
                if (urlParams.get("key") === "admin123") setIsAdmin(true);
                
                const handleHashChange = () => {
                    const hash = window.location.hash.replace('#', '');
                    setActivePage(hash || 'home');
                    if(hash !== 'blogs') setActiveBlog(null);
                    if(hash !== 'home') setSelectedProperty(null); 
                };
                window.addEventListener('hashchange', handleHashChange);

                const fetchProperties = async () => {
                    try {
                        const { data, error } = await supabase.from('properties').select('*').order('created_at', { ascending: false });
                        if (!error) setProperties(data || []);
                    } catch (error) { console.error(error); } finally { setLoading(false); }
                };

                fetchProperties();
                return () => window.removeEventListener('hashchange', handleHashChange);
            }, []);

            const handleLeadSubmit = async (data = leadData, projectName = "General Enquiry") => {
                if (!/^[6-9]\d{9}$/.test(data.phone)) { alert("Enter valid 10-digit number"); return false; }
                if(data === leadData) setIsSubmitting(true);

                try {
                    const { error } = await supabase.from('leads').insert([{
                        customer_name: data.name, phone_number: data.phone,
                        project_interested_in: projectName, lead_status: "Un called", lead_source: "Website"
                    }]);

                    if (error) throw error; 
                    alert("Interest Registered! Our team will contact you shortly.");
                    if(data === leadData) { setShowLeadForm(false); setLeadData({ name: "", phone: "" }); }
                    return true;
                } catch (error) {
                    alert("Something went wrong saving your details. Please try again.");
                    return false;
                } finally {
                    if(data === leadData) setIsSubmitting(false);
                }
            };

            const safeProperties = Array.isArray(properties) ? properties : [];
            const filtered = safeProperties.filter(p => {
                if (!p || typeof p !== 'object') return false; 
                const term = search.toLowerCase();
                const pName = String(getVal(p, "Property Name")).toLowerCase();
                const pLoc = String(getVal(p, "Location")).toLowerCase();
                const pBuild = String(getVal(p, "Builder Name")).toLowerCase();
                
                const matchSearch = !term || pName.includes(term) || pLoc.includes(term) || pBuild.includes(term);
                const matchBHK = !filters.bhk || String(getVal(p, "No of BHK's") || getVal(p, "bhk")).includes(filters.bhk);
                const matchStatus = !filters.status || String(getVal(p, "Construction Status")).includes(filters.status);
                const matchType = !filters.type || String(getVal(p, "Property Type")).includes(filters.type);
                
                const priceInCr = extractPriceInCr(getVal(p, "Price"));
                let matchPrice = true;
                if (filters.priceBracket) {
                    if (priceInCr > 0) {
                        if (filters.priceBracket === "under1") matchPrice = priceInCr < 1;
                        else if (filters.priceBracket === "1-2") matchPrice = priceInCr >= 1 && priceInCr < 2;
                        else if (filters.priceBracket === "2-3") matchPrice = priceInCr >= 2 && priceInCr < 3;
                        else if (filters.priceBracket === "3-4") matchPrice = priceInCr >= 3 && priceInCr < 4;
                        else if (filters.priceBracket === "4-5") matchPrice = priceInCr >= 4 && priceInCr < 5;
                        else if (filters.priceBracket === "5plus") matchPrice = priceInCr >= 5;
                    } else { matchPrice = false; }
                }

                return matchSearch && matchBHK && matchStatus && matchType && matchPrice;
            });

            const navTo = (page) => {
                setIsMobileMenuOpen(false);
                setActiveBlog(null);
                setSelectedProperty(null);
                window.location.hash = page;
                window.scrollTo(0,0);
            };

                            <svg className="w-6 h-6 md:w-8 md:h-8 drop-shadow-md" fill="currentColor" viewBox="0 0 24 24"><path d="M12.031 0C5.385 0 0 5.385 0 12.031c0 2.12.553 4.148 1.603 5.946L.2 24l6.195-1.62c1.737.947 3.69 1.445 5.636 1.445 6.646 0 12.031-5.385 12.031-12.031C24 5.385 18.615 0 12.031 0zm0 21.846c-1.802 0-3.568-.484-5.115-1.402l-.366-.217-3.805.996.996-3.805-.217-.366a9.92 9.92 0 0 1-1.402-5.115c0-5.514 4.486-10 10-10 5.514 0 10 4.486 10 10 0 5.514-4.486 10-10 10zm5.496-7.518c-.301-.15-1.785-.885-2.062-.986-.277-.1-.478-.15-.678.15-.201.301-.778.986-.954 1.187-.176.201-.351.226-.653.076-1.609-.816-2.73-1.637-3.784-3.411-.176-.301.176-.277.453-.827.076-.15-.038-.277-.038-.427-.076-.15-.678-1.631-.929-2.233-.251-.602-.502-.527-.678-.527-.176 0-.377 0-.578 0-.201 0-.527.076-.803.427-.276.351-1.054 1.028-1.054 2.508 0 1.48 1.079 2.91 1.229 3.111.15.201 2.133 3.262 5.169 4.566.726.301 1.28.478 1.731.628.728.227 1.381.194 1.905.118.578-.084 1.785-.728 2.036-1.431.251-.703.251-1.305.176-1.431-.076-.126-.277-.201-.578-.352z"/></svg>
                        </div>
                    </a>

                    {showLeadForm && (
                        <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-slate-900/90 backdrop-blur-sm" onClick={() => setShowLeadForm(false)}>
                            <div className="bg-white rounded-3xl md:rounded-[40px] p-8 md:p-10 w-full max-w-sm animate-fadeIn shadow-2xl text-center" onClick={e => e.stopPropagation()}>
                                <h2 className="text-2xl md:text-3xl font-black text-slate-900 mb-6 italic tracking-tighter uppercase">Enquiry</h2>
                                <form onSubmit={handleLeadSubmit} className="space-y-4 text-left">
                                    <label className="text-[10px] font-black uppercase text-gray-500 ml-2 tracking-widest">Full Name</label>
                                    <input type="text" placeholder="Enter Name" required className="w-full border border-gray-200 bg-gray-50 p-4 rounded-xl outline-none font-bold text-sm focus:ring-2 focus:ring-blue-500 transition" value={leadData.name} onChange={e => setLeadData({...leadData, name: e.target.value})} />
                                    <label className="text-[10px] font-black uppercase text-gray-500 ml-2 tracking-widest">Mobile Number</label>
                                    <input type="tel" placeholder="10 Digits" required className="w-full border border-gray-200 bg-gray-50 p-4 rounded-xl outline-none font-bold text-sm focus:ring-2 focus:ring-blue-500 transition" value={leadData.phone} onChange={e => setLeadData({...leadData, phone: e.target.value})} />
                                    <button disabled={isSubmitting} type="submit" className="w-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-black py-4 rounded-xl uppercase tracking-widest shadow-lg mt-4 active:scale-95 transition-transform">{isSubmitting ? "Processing..." : "Submit Interest"}</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* NEW: T&C FOOTER LINK */}
                    <footer className="bg-slate-950 text-white p-8 md:p-12 mt-auto border-t border-slate-900">
                        <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center md:items-start gap-8 text-center md:text-left">
                            <div>
                                <h1 className="text-xl font-black italic uppercase text-slate-300 tracking-tighter">Perfect Horizons</h1>
                                <p className="text-slate-600 text-xs mt-2 font-medium">© 2026 Perfect Horizons. All rights reserved.</p>
                                <div className="flex gap-4 mt-4 justify-center md:justify-start text-[9px] text-slate-500 uppercase font-black tracking-widest">
                                    <a href="#" className="hover:text-blue-400 transition">Terms & Conditions</a>
                                    <span>|</span>
                                    <a href="#" className="hover:text-blue-400 transition">Privacy Policy</a>
                                </div>
                            </div>
                            <div className="space-y-3">
                                <h3 className="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2">Contact Us</h3>
                                <p className="text-sm font-medium text-slate-300">📞 +91 9742353260</p>
                                <a href="mailto:perfecthorizons.in@gmail.com" className="text-sm font-medium text-slate-300 hover:text-blue-400 transition block">✉️ perfecthorizons.in@gmail.com</a>
                                <p className="text-sm text-slate-500 italic">📍 Bengaluru, Karnataka</p>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
