<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfect Horizons | Property Portal</title>
    
    <link rel="preconnect" href="https://unpkg.com">
    <link rel="preconnect" href="https://script.google.com">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏢</text></svg>">
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fadeIn { animation: fadeIn 0.15s ease-out forwards; }
        .dropdown-arrow { display: inline-block; margin-left: 4px; width: 0; height: 0; vertical-align: middle; border-top: 4px solid currentColor; border-right: 4px solid transparent; border-left: 4px solid transparent; }
        @keyframes pulse-fast { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.6; transform: scale(0.98); } }
        .splash-title { font-family: sans-serif; color: #1e3a8a; font-size: 2rem; font-weight: 900; font-style: italic; text-transform: uppercase; animation: pulse-fast 1.2s ease-in-out infinite; }
        .splash-sub { font-family: sans-serif; color: #64748b; font-size: 0.75rem; margin-top: 1rem; font-weight: bold; letter-spacing: 0.15em; text-transform: uppercase; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
    
    <div id="native-splash" style="position: fixed; inset: 0; z-index: 99999; background-color: #f8fafc; display: flex; align-items: center; justify-content: center; flex-direction: column; transition: opacity 0.5s ease;">
        <div class="splash-title">Perfect Horizons</div>
        <div class="splash-sub">Curating Properties...</div>
    </div>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const LEAD_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzKmjXhueUDqDJ2HwalGBuRk4WfEEx-ruYZJ5IeSCIMxSDuEwaCAMspYBq-zMrFzmY/exec';
        const API_URL = "https://script.google.com/macros/s/AKfycbzORxItxvqlsIUokcs7JCKjFASG2e3y_CrAT2zuy81aEQvLsVG6Sm6CuuSplgWnWh4/exec";
        const WHATSAPP_NUMBER = "919742353260";
        const ADMIN_PIN = "1234"; 

        const BLOG_ARTICLES = [
            {
                id: 1, tag: "Legal Guide", title: "What is UDS (Undivided Share) and Why Does it Matter?",
                excerpt: "Understanding your UDS is critical for future resale value and redevelopment rights.",
                content: `<p>UDS is your personal share of the land on which the entire apartment complex is built. The building structure depreciates, but the land appreciates. Your true resale value is determined by the UDS.</p>`
            },
            {
                id: 2, tag: "Finance Hack", title: "5 Hidden Charges Builders Don't Tell You About",
                excerpt: "Learn how to calculate the actual landed cost of your property beyond the base price.",
                content: `<p>Watch out for BESCOM/BWSSB charges, Clubhouse fees, and Floor Rise premiums which can add 15-20% to your base cost.</p>`
            }
        ];

        const getVal = (obj, searchKey) => {
            if (!obj) return "";
            const cleanKey = searchKey.replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
            for (let k in obj) { if (k.replace(/[^a-zA-Z0-9]/g, '').toLowerCase() === cleanKey) return obj[k]; }
            return obj[searchKey] || "";
        };

        const fixImageUrl = (u) => {
            if (!u || typeof u !== 'string') return 'https://via.placeholder.com/800x500?text=No+Image';
            let url = u.split(',')[0].trim();
            let id = url.match(/\/d\/(.*?)\//)?.[1] || url.split('id=')[1];
            return id ? `https://drive.google.com/thumbnail?id=${id}&sz=w1000` : url;
        };

        const formatPercent = (v) => { let n = parseFloat(v); return isNaN(n) ? v : (n < 1 ? (n * 100).toFixed(1) : n) + "%"; };
        const extractPriceInCr = (ps) => {
            if (!ps) return 0;
            const s = String(ps).toLowerCase().replace(/,/g, '');
            const m = s.match(/[0-9.]+/);
            if (!m) return 0;
            const v = parseFloat(m[0]);
            if (s.includes('cr')) return v;
            if (s.includes('lac') || s.includes('lakh')) return v / 100;
            return v > 100000 ? v / 10000000 : 0;
        };

        function App() {
            const [properties, setProperties] = useState([]);
            const [loading, setLoading] = useState(true);
            const [isAdmin, setIsAdmin] = useState(false);
            const [selectedProperty, setSelectedProperty] = useState(null);
            const [search, setSearch] = useState("");
            const [filters, setFilters] = useState({ bhk: "", status: "", type: "", priceBracket: "" });
            const [showLeadForm, setShowLeadForm] = useState(false);
            const [leadData, setLeadData] = useState({ name: "", phone: "" });
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [activePage, setActivePage] = useState("home"); 
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            const [showFiltersMobile, setShowFiltersMobile] = useState(false);
            const [activeBlog, setActiveBlog] = useState(null);

            useEffect(() => {
                const urlParams = new URLSearchParams(window.location.search);
                if (urlParams.get("key") === "admin123") setIsAdmin(true);
                fetch(API_URL).then(res => res.json()).then(data => {
                    if (Array.isArray(data)) setProperties(data);
                    setLoading(false);
                    const splash = document.getElementById('native-splash');
                    if(splash) { splash.style.opacity = '0'; setTimeout(() => splash.remove(), 500); }
                }).catch(() => {
                    setLoading(false);
                    const splash = document.getElementById('native-splash');
                    if(splash) splash.remove();
                });
            }, []);

            const navTo = (p) => { setActivePage(p); setIsMobileMenuOpen(false); setActiveBlog(null); window.scrollTo(0,0); };

            const handleLeadSubmit = (e) => {
                e.preventDefault();
                setIsSubmitting(true);
                fetch(LEAD_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({
                    name: leadData.name, phone: leadData.phone, property: getVal(selectedProperty, "Property Name") || "General"
                })}).then(() => {
                    alert("Interest Registered!");
                    setIsSubmitting(false); setShowLeadForm(false); setLeadData({ name: "", phone: "" });
                });
            };

            const filtered = properties.filter(p => {
                const term = search.toLowerCase();
                const pName = String(getVal(p, "Property Name")).toLowerCase();
                const matchSearch = !term || pName.includes(term) || String(getVal(p, "Location")).toLowerCase().includes(term);
                const matchBHK = !filters.bhk || String(getVal(p, "No of BHK's")).includes(filters.bhk);
                const priceCr = extractPriceInCr(getVal(p, "Price"));
                let matchPrice = true;
                if (filters.priceBracket) {
                    if (filters.priceBracket === "under1") matchPrice = priceCr < 1;
                    else if (filters.priceBracket === "1-2") matchPrice = priceCr >= 1 && priceCr < 2;
                    else if (filters.priceBracket === "2-3") matchPrice = priceCr >= 2 && priceCr < 3;
                    else if (filters.priceBracket === "5plus") matchPrice = priceCr >= 5;
                }
                return matchSearch && matchBHK && matchPrice;
            });

            return (
                <div className="min-h-screen flex flex-col">
                    <nav className="bg-slate-900 shadow-lg px-4 md:px-6 py-4 sticky top-0 z-40 border-b border-slate-800">
                        <div className="max-w-7xl mx-auto flex justify-between items-center">
                            <h1 onClick={() => navTo('home')} className="text-xl font-black text-white italic cursor-pointer">Perfect Horizons</h1>
                            <button onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)} className="md:hidden text-white">
                                <svg className="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                            </button>
                            <div className="hidden md:flex gap-8 items-center text-white text-xs font-black uppercase">
                                <button onClick={() => navTo('home')} className={activePage === 'home' ? 'text-blue-400' : ''}>Properties</button>
                                <button onClick={() => navTo('about-us')}>About</button>
                                <button onClick={() => navTo('our-management')}>Advisor</button>
                                <button onClick={() => navTo('customers')}>Customers</button>
                                <button onClick={() => navTo('blogs')}>Blogs</button>
                            </div>
                        </div>
                    </nav>

                    <main className="max-w-7xl mx-auto p-4 md:p-8 flex-grow w-full animate-fadeIn">
                        {activePage === 'home' && (
                            <>
                                <div className="bg-white p-4 rounded-2xl shadow-sm border mb-6 space-y-4">
                                    <input type="text" placeholder="Search..." className="w-full bg-gray-50 p-4 rounded-xl outline-none ring-1 ring-gray-100 focus:ring-2 focus:ring-blue-600" value={search} onChange={e => setSearch(e.target.value)} />
                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                                        <select className="bg-gray-50 p-3 rounded-xl font-bold" value={filters.bhk} onChange={e => setFilters({...filters, bhk: e.target.value})}><option value="">BHK</option><option value="1">1 BHK</option><option value="2">2 BHK</option><option value="3">3 BHK</option></select>
                                        <select className="bg-gray-50 p-3 rounded-xl font-bold" value={filters.priceBracket} onChange={e => setFilters({...filters, priceBracket: e.target.value})}><option value="">Budget</option><option value="under1">Under 1Cr</option><option value="1-2">1-2 Cr</option><option value="5plus">5Cr+</option></select>
                                        <button onClick={() => setFilters({bhk:"", status:"", type:"", priceBracket:""})} className="col-span-2 md:col-span-1 bg-red-50 text-red-500 font-bold p-3 rounded-xl uppercase text-[10px]">Clear</button>
                                    </div>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                                    {filtered.map((p, i) => (
                                        <div key={i} onClick={() => setSelectedProperty(p)} className="bg-white rounded-[35px] shadow-sm border overflow-hidden hover:shadow-xl transition-all cursor-pointer">
                                            <img src={fixImageUrl(getVal(p, "Cover Image"))} className="h-56 w-full object-cover" />
                                            <div className="p-6">
                                                <h2 className="text-xl font-black uppercase text-slate-900">{getVal(p, "Property Name") || "Property"}</h2>
                                                <p className="text-gray-400 text-sm italic">📍 {getVal(p, "Location")}</p>
                                                <div className="mt-4 flex justify-between items-center border-t pt-4">
                                                    <span className="text-blue-600 font-black text-2xl italic">{getVal(p, "Price")}</span>
                                                    <span className="bg-slate-900 text-white px-3 py-1 rounded-lg text-[10px] font-black uppercase">{getVal(p, "No of BHK's")} BHK</span>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </>
                        )}

                        {activePage === 'our-management' && (
                            <div className="bg-white p-6 md:p-16 rounded-[40px] shadow-sm border flex flex-col-reverse md:flex-row gap-12 items-center animate-fadeIn">
                                <div className="w-full md:w-1/2">
                                    <h1 className="text-4xl md:text-6xl font-black text-slate-900 italic uppercase">Meet Tharun</h1>
                                    <p className="text-gray-600 mt-6 leading-relaxed">Hi, I'm Tharun. I built Perfect Horizons to provide unbiased analysis of the Bengaluru real estate landscape. My goal is to ensure you make the smartest decision for your family's future.</p>
                                    <button onClick={() => setShowLeadForm(true)} className="mt-8 bg-slate-900 text-white font-black py-4 px-10 rounded-2xl uppercase shadow-xl hover:bg-blue-600 transition-all">Schedule Consultation</button>
                                </div>
                                <div className="w-full md:w-1/2 flex justify-center">
                                    <div className="w-64 h-64 md:w-96 md:h-96 bg-slate-100 rounded-[40px] border-8 border-white shadow-2xl overflow-hidden relative">
                                        <img src="https://drive.google.com/thumbnail?id=1KyIqvQ2zqrkUWp_750uvmEAtfONfZ3Sd&sz=w1000" className="w-full h-full object-cover" onError={(e) => e.target.src='https://via.placeholder.com/400x400?text=Advisor'} />
                                    </div>
                                </div>
                            </div>
                        )}
                        
                        {/* CUSTOMERS / BLOGS placeholders to keep code short but working */}
                        {activePage === 'customers' && <div className="p-10 text-center font-black uppercase">Customer Reviews Coming Soon</div>}
                        {activePage === 'blogs' && <div className="p-10 text-center font-black uppercase">Real Estate Insights Coming Soon</div>}
                        {activePage === 'about-us' && <div className="p-10 text-center font-black uppercase">About Perfect Horizons</div>}
                    </main>

                    {selectedProperty && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
                            <div className="absolute inset-0 bg-black/80 backdrop-blur-md" onClick={() => setSelectedProperty(null)}></div>
                            <div className="bg-white rounded-[40px] w-full max-w-4xl max-h-[90vh] overflow-hidden relative animate-fadeIn flex flex-col shadow-2xl">
                                <button onClick={() => setSelectedProperty(null)} className="absolute top-4 right-4 bg-slate-900 text-white w-10 h-10 rounded-full z-20 font-bold">✕</button>
                                <div className="overflow-y-auto hide-scroll">
                                    <img src={fixImageUrl(getVal(selectedProperty, "Cover Image"))} className="h-64 md:h-96 w-full object-cover" />
                                    <div className="p-8">
                                        <h1 className="text-3xl font-black uppercase text-slate-900">{getVal(selectedProperty, "Property Name")}</h1>
                                        <div className="mt-8 flex flex-col gap-4">
                                            <button onClick={() => setShowLeadForm(true)} className="bg-blue-600 text-white font-black py-4 rounded-2xl uppercase tracking-widest shadow-xl shadow-blue-500/30">I am Interested</button>
                                            <div className="grid grid-cols-3 gap-2">
                                                <a href={`https://wa.me/${WHATSAPP_NUMBER}?text=Brochure for ${getVal(selectedProperty, "Property Name")}`} target="_blank" className="bg-cyan-500 text-white p-3 rounded-xl text-[9px] font-black text-center uppercase">Brochure</a>
                                                <a href={`https://wa.me/${WHATSAPP_NUMBER}?text=Cost Sheet for ${getVal(selectedProperty, "Property Name")}`} target="_blank" className="bg-emerald-500 text-white p-3 rounded-xl text-[9px] font-black text-center uppercase">Cost Sheet</a>
                                                <a href={`https://wa.me/${WHATSAPP_NUMBER}?text=Callback for ${getVal(selectedProperty, "Property Name")}`} target="_blank" className="bg-purple-500 text-white p-3 rounded-xl text-[9px] font-black text-center uppercase">Callback</a>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    <footer className="bg-slate-950 text-white p-8 mt-auto border-t border-slate-900">
                        <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-8">
                            <h1 className="text-xl font-black italic uppercase text-slate-300">Perfect Horizons</h1>
                            <div className="text-center md:text-right">
                                <p className="text-sm">📞 +91 9742353260</p>
                                <p className="text-xs text-slate-500 mt-2">© 2026 Bengaluru, Karnataka</p>
                            </div>
                        </div>
                    </footer>

                    {showLeadForm && (
                        <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-slate-900/90 backdrop-blur-sm" onClick={() => setShowLeadForm(false)}>
                            <div className="bg-white rounded-[40px] p-8 md:p-10 w-full max-w-sm animate-fadeIn text-center" onClick={e => e.stopPropagation()}>
                                <h2 className="text-2xl font-black text-slate-900 mb-6 uppercase">Enquiry</h2>
                                <form onSubmit={handleLeadSubmit} className="space-y-4 text-left">
                                    <input type="text" placeholder="Name" required className="w-full bg-gray-50 p-4 rounded-xl outline-none font-bold" value={leadData.name} onChange={e => setLeadData({...leadData, name: e.target.value})} />
                                    <input type="tel" placeholder="Mobile" required className="w-full bg-gray-50 p-4 rounded-xl outline-none font-bold" value={leadData.phone} onChange={e => setLeadData({...leadData, phone: e.target.value})} />
                                    <button disabled={isSubmitting} type="submit" className="w-full bg-blue-600 text-white font-black py-4 rounded-xl uppercase">{isSubmitting ? "..." : "Submit Interest"}</button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
