<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Property Dashboard</title>
    
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            // Placeholder data - we will replace this with your Google Sheet data later
            const properties = [
                { id: 1, title: "Modern Downtown Loft", location: "New York, NY", price: "$850,000", beds: 2, baths: 2, status: "Available", img: "https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" },
                { id: 2, title: "Suburban Family Home", location: "Austin, TX", price: "$450,000", beds: 4, baths: 3, status: "Pending", img: "https://images.unsplash.com/photo-1512917774080-9991f1c4c750?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" },
                { id: 3, title: "Luxury Beachfront Villa", location: "Miami, FL", price: "$2,100,000", beds: 5, baths: 6, status: "Available", img: "https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" }
            ];

            return (
                <div className="min-h-screen">
                    {/* Navigation Bar */}
                    <nav className="bg-white shadow-sm border-b px-8 py-4 flex justify-between items-center">
                        <h1 className="text-2xl font-bold text-blue-900 flex items-center gap-2">
                            <span>🏢</span> Perfect Horizons
                        </h1>
                        <button className="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition">Contact Us</button>
                    </nav>

                    {/* Main Content */}
                    <main className="max-w-7xl mx-auto px-8 py-8">
                        {/* Header & Search */}
                        <div className="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
                            <div>
                                <h2 className="text-3xl font-bold text-gray-900">Property Listings</h2>
                                <p className="text-gray-500 mt-1">Manage and view your live portfolio.</p>
                            </div>
                            <div className="w-full md:w-1/3">
                                <input 
                                    type="text" 
                                    placeholder="Search by location or title..." 
                                    className="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500"
                                />
                            </div>
                        </div>

                        {/* Property Grid */}
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                            {properties.map(property => (
                                <div key={property.id} className="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-lg transition duration-300 border border-gray-100">
                                    <div className="h-48 overflow-hidden relative">
                                        <img src={property.img} alt={property.title} className="w-full h-full object-cover" />
                                        <span className={`absolute top-4 right-4 px-3 py-1 text-xs font-bold rounded-full ${property.status === 'Available' ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800'}`}>
                                            {property.status}
                                        </span>
                                    </div>
                                    <div className="p-6">
                                        <div className="text-2xl font-bold text-blue-600 mb-2">{property.price}</div>
                                        <h3 className="text-xl font-semibold text-gray-900 mb-1">{property.title}</h3>
                                        <p className="text-gray-500 mb-4 flex items-center gap-1">
                                            📍 {property.location}
                                        </p>
                                        <div className="flex gap-4 text-sm text-gray-600 border-t pt-4">
                                            <span>🛏️ {property.beds} Beds</span>
                                            <span>🛁 {property.baths} Baths</span>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
