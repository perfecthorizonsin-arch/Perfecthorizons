            { id: 1, tag: "Legal Guide", title: "What is UDS (Undivided Share) and Why Does it Matter?", excerpt: "When you buy an apartment, you aren't just buying the flat; you are buying a piece of the land it sits on. Understanding your UDS is critical.", content: `<p>When purchasing an apartment in Bengaluru, many buyers focus entirely on the super built-up area and the amenities. However, the most critical element of your investment is the <strong>Undivided Share of Land (UDS)</strong>.</p><br/><h3>What is UDS?</h3><p>UDS is your personal share of the land on which the entire apartment complex is built. Since you cannot physically mark out your exact piece of land in a high-rise, it is expressed as a fraction or percentage.</p><br/><h3>Why is it so important?</h3><ul style="list-style-type:disc;margin-left:20px;"><li><strong>Future Resale Value:</strong> The building structure depreciates over time, but the land appreciates. Your property's true resale value is determined by the UDS.</li><li><strong>Redevelopment:</strong> If the building is demolished or redeveloped 40 years from now, your compensation or new apartment allocation will be based strictly on your UDS.</li></ul><br/><p><strong>The Rule of Thumb:</strong> Always ask the builder for the exact UDS before booking. If the UDS is unusually low compared to the size of your flat, it means the builder is over-utilizing the land, which dilutes your investment.</p>` },
            { id: 2, tag: "Finance Hack", title: "5 Hidden Charges Builders Don't Tell You About", excerpt: "The 'Base Price' is never the final price. From Club House charges to BESCOM deposits, learn how to calculate the actual landed cost.", content: `<p>You see an ad for a luxury 3BHK for "₹1.2 Cr Onwards." You visit the site, fall in love, and sit down to book it—only to realize the final cost is suddenly ₹1.45 Cr. What happened?</p><br/><ol style="list-style-type:decimal;margin-left:20px;"><li><strong>BESCOM & BWSSB Charges</strong></li><li><strong>Clubhouse & Amenity Fees</strong></li><li><strong>Advance Maintenance</strong></li><li><strong>Legal & Documentation Charges</strong></li><li><strong>Floor Rise Premium (PLC)</strong></li></ol><br/><p>Always demand a comprehensive <strong>Cost Sheet</strong> before paying any token amount.</p>` },

        ];

        const getMapEmbedSrc = (mapLink) => {
            if (!mapLink) return null;
            const link = String(mapLink).trim();
            if (!link || link === '#') return null;
            if (link.includes('maps/embed')) return link;
            let query = "";
            try {
                const coordMatch = link.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
                if (coordMatch) return `https://maps.google.com/maps?q=${coordMatch[1]},${coordMatch[2]}&z=16&output=embed`;
                const url = new URL(link.startsWith('http') ? link : 'https://' + link);
                query = url.searchParams.get('q') || url.searchParams.get('query') || "";
                if (!query) { const placeMatch = link.match(/\/maps\/place\/([^/@?]+)/); if (placeMatch) query = decodeURIComponent(placeMatch[1].replace(/\+/g, ' ')); }
            } catch(e) { query = "Bengaluru, Karnataka"; }
            if (!query) query = "Bengaluru, Karnataka";
            return `https://maps.google.com/maps?q=${encodeURIComponent(query)}&z=15&output=embed`;
        };

                                <p style={{fontSize:'0.6rem',fontWeight:700,color:'var(--slate-soft)',textTransform:'uppercase',letterSpacing:'0.18em',marginBottom:'1.5rem'}}>{propName}</p>
                                {(actionModal==='unlock_floor'||actionModal==='unlock_master') && (
                                    <p style={{fontSize:'0.78rem',color:'var(--slate-soft)',marginBottom:'1.25rem',lineHeight:1.6,background:'var(--gold-light)',padding:'10px 14px',borderRadius:'8px',border:'1px solid rgba(217,119,6,0.2)'}}>
                                        🔓 Share your details to instantly unlock the {actionModal==='unlock_floor'?'floor plans':'master plan'}.

                                    <input type="tel" placeholder="Mobile Number (10 Digits)" required style={{width:'100%',border:'1px solid var(--border)',background:'var(--cream)',padding:'14px 16px',borderRadius:'10px',outline:'none',fontFamily:"'DM Sans',sans-serif",fontSize:'0.875rem',fontWeight:500}} className="focus:ring-2 focus:ring-amber-300" value={leadData.phone} onChange={e => setLeadData({...leadData,phone:e.target.value})} />
                                    <input type="email" placeholder="Email Address (Optional)" style={{width:'100%',border:'1px solid var(--border)',background:'var(--cream)',padding:'14px 16px',borderRadius:'10px',outline:'none',fontFamily:"'DM Sans',sans-serif",fontSize:'0.875rem',fontWeight:500}} className="focus:ring-2 focus:ring-amber-300" value={leadData.email} onChange={e => setLeadData({...leadData,email:e.target.value})} />
                                    <button disabled={isSubmitting} type="submit" className="btn-gold w-full font-black py-4 rounded-xl uppercase tracking-widest mt-2 active:scale-95 text-white" style={{fontSize:'0.72rem'}}>
                                        {isSubmitting?"Processing…":actionModal==='unlock_floor'||actionModal==='unlock_master'?"Unlock Now →":actionModal==='apply_now'?"Submit Application":"Submit"}
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Legal Modal */}
                    {legalModal && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-900/90 backdrop-blur-sm animate-fadeIn" onClick={() => setLegalModal(null)}>
                            <div style={{background:'var(--card-bg)',borderRadius:'24px',padding:'2.5rem',maxWidth:'640px',width:'100%',maxHeight:'80vh',overflowY:'auto',boxShadow:'0 32px 80px rgba(15,23,42,0.45)',position:'relative'}} onClick={e => e.stopPropagation()}>
                                <button onClick={() => setLegalModal(null)} style={{position:'absolute',top:'16px',right:'20px',fontSize:'1.5rem',color:'rgba(100,116,139,0.5)',fontWeight:300}} className="hover:text-slate-900 transition">×</button>
                                <div style={{height:'3px',background:'linear-gradient(90deg,var(--gold),transparent)',borderRadius:'2px',marginBottom:'1.5rem'}}/>
                                <h2 style={{fontFamily:"'Cormorant Garamond',Georgia,serif",fontSize:'1.5rem',fontWeight:700,fontStyle:'italic',color:'var(--navy)',textTransform:'uppercase',marginBottom:'1.5rem',paddingBottom:'1rem',borderBottom:'1px solid var(--border)'}}>{legalModal==='terms'?"Terms & Conditions":"Privacy Policy"}</h2>
                                <div style={{fontSize:'0.8rem',color:'var(--slate-soft)',lineHeight:1.8}} className="space-y-4">
                                    <p style={{fontWeight:600,color:'var(--navy)',background:'var(--gold-light)',padding:'1rem',borderRadius:'10px',border:'1px solid rgba(217,119,6,0.15)',fontSize:'0.78rem'}}>Disclaimer: Perfect Horizons acts solely as an authorized channel partner. We are not the developers or builders of the properties listed.</p>
                                    <p><strong>Logos & Trademarks:</strong> Any builder logos used are for representative purposes only and remain the property of their respective trademark owners.</p>
                                    <p><strong>Information Accuracy:</strong> All images, layouts, pricing, and project details are for informational purposes only. We advise clients to verify all legal and RERA documents independently before making a financial commitment.</p>
                                    <p><strong>Data Privacy:</strong> Any information submitted through our enquiry forms is kept strictly confidential and used exclusively by our internal advisors.</p>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // ─── MAIN APP ───
        function App() {
            const [properties, setProperties] = useState([]);
            const [loading, setLoading] = useState(true);
            const [isAdmin, setIsAdmin] = useState(false);
            const [selectedProperty, setSelectedProperty] = useState(null);
            const [search, setSearch] = useState("");
            const [isMobileSearchOpen, setIsMobileSearchOpen] = useState(false);
            const [isMobileFilterOpen, setIsMobileFilterOpen] = useState(false);
            const [filters, setFilters] = useState({ bhk: "", status: "", type: "", priceBracket: "", possessionYear: "" });
            const [showLeadForm, setShowLeadForm] = useState(false);
            const [leadData, setLeadData] = useState({ name: "", phone: "", email: "" });
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [activePage, setActivePage] = useState(() => window.location.hash.replace('#','') || 'home');
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            const [mobileAboutOpen, setMobileAboutOpen] = useState(false);
            const [mobilePromisesOpen, setMobilePromisesOpen] = useState(false);
            const [mobileServicesOpen, setMobileServicesOpen] = useState(false);
            const [activeBlog, setActiveBlog] = useState(null);
            const [legalModal, setLegalModal] = useState(null);

            useEffect(() => {
                const urlParams = new URLSearchParams(window.location.search);
                if (urlParams.get("key") === "admin123") setIsAdmin(true);
                const handleHashChange = () => {
                    const hash = window.location.hash.replace('#','');
                    setActivePage(hash||'home');
                    if(hash!=='home') setSelectedProperty(null);
                    if(hash!=='blogs') setActiveBlog(null);
                };
                window.addEventListener('hashchange', handleHashChange);
                const fetchProperties = async () => {
                    try { const { data, error } = await supabase.from('properties').select('*').eq('is_live', true); if (!error) setProperties(data||[]); } catch(e){console.error(e);} finally { setLoading(false); }
                };
                fetchProperties();
                const channel = supabase.channel('public:properties')
                    .on('postgres_changes', { event:'*', schema:'public', table:'properties' }, (payload) => {
                        if (payload.eventType==='INSERT') { if(payload.new.is_live===true) setProperties(prev=>[payload.new,...prev]); }
                        else if (payload.eventType==='UPDATE') { const u=payload.new; if(u.is_live===true){setProperties(prev=>{const exists=prev.some(p=>p.id===u.id);return exists?prev.map(p=>p.id===u.id?u:p):[u,...prev];});setSelectedProperty(prev=>prev&&prev.id===u.id?u:prev);}else{setProperties(prev=>prev.filter(p=>p.id!==u.id));setSelectedProperty(prev=>prev&&prev.id===u.id?null:prev);} }
                        else if (payload.eventType==='DELETE') { setProperties(prev=>prev.filter(p=>p.id!==payload.old.id)); setSelectedProperty(prev=>prev&&prev.id===payload.old.id?null:prev); }
                    }).subscribe();
                return () => { window.removeEventListener('hashchange', handleHashChange); supabase.removeChannel(channel); };
            }, []);

            const handleLeadSubmit = async (dataToSubmit, projectName, actionType="General Enquiry", event=null) => {
                if(event) event.preventDefault();
                const data = dataToSubmit || leadData;
                const project = projectName || "General Enquiry";
                const sourceContext = actionType==='brochure'?"Website - Brochure Download":actionType==='cost_sheet'?"Website - Cost Sheet":actionType==='apply_now'?"Website - EMI Apply":"Website - General";
                if (!/^[6-9]\d{9}$/.test(data.phone)) { alert("Enter valid 10-digit number"); return false; }
                if (!dataToSubmit) setIsSubmitting(true);
                try {
                    const { error } = await supabase.from('leads').insert([{ customer_name:data.name, phone_number:data.phone, customer_email:data.email||null, project_interested_in:project, lead_status:"Un called", lead_source:sourceContext, psa_agent_name:"Tharun" }]);
                    if (error) throw error;
                    fetch(GOOGLE_SCRIPT_URL, { method:"POST", body:JSON.stringify({ action:"sendLead", Name:data.name, Phone:data.phone, Email:data.email||'N/A', Project:project, Source:sourceContext, Requirements:'None' }) }).catch(err=>console.log("Email Error:",err));
                    if (!dataToSubmit) { alert("Interest Registered! Our advisor will contact you shortly."); setShowLeadForm(false); setLeadData({name:"",phone:"",email:""}); }
                    return true;
                } catch(error) { alert("Error saving details. Please try again."); return false; }
                finally { if(!dataToSubmit) setIsSubmitting(false); }
            };

            const safeProperties = Array.isArray(properties) ? properties : [];
            const filtered = safeProperties.filter(p => {
                if (!p || typeof p !== 'object') return false;
                const term = search.toLowerCase();
                const matchSearch = !term || String(getVal(p,"Property Name")).toLowerCase().includes(term) || String(getVal(p,"Location")).toLowerCase().includes(term) || String(getVal(p,"Builder Name")).toLowerCase().includes(term);
                const matchBHK = !filters.bhk || String(getVal(p,"No of BHK's")||getVal(p,"bhk")).includes(filters.bhk);
                const matchStatus = !filters.status || String(getVal(p,"Construction Status")).includes(filters.status);
                const matchType = !filters.type || String(getVal(p,"Property Type")).includes(filters.type);
                const priceInCr = extractPriceInCr(getVal(p,"Price"));
                let matchPrice = true;
                if (filters.priceBracket && priceInCr > 0) {
                    if (filters.priceBracket==="under1") matchPrice = priceInCr < 1;
                    else if (filters.priceBracket==="1-2") matchPrice = priceInCr>=1 && priceInCr<2;
                    else if (filters.priceBracket==="2-3") matchPrice = priceInCr>=2 && priceInCr<3;
                    else if (filters.priceBracket==="3-4") matchPrice = priceInCr>=3 && priceInCr<4;
                    else if (filters.priceBracket==="4-5") matchPrice = priceInCr>=4 && priceInCr<5;
                    else if (filters.priceBracket==="5plus") matchPrice = priceInCr>=5;
                } else if (filters.priceBracket) matchPrice = false;
                const matchPossession = !filters.possessionYear || (() => {
                    const pd = String(getVal(p,"possession_date")||getVal(p,"Possession Date")||"").toLowerCase();
                    if (filters.possessionYear === "ready") return pd.includes("ready");
                    return pd.includes(filters.possessionYear);
                })();
                return matchSearch && matchBHK && matchStatus && matchType && matchPrice && matchPossession;
            });

            const navTo = (page) => {
                setIsMobileMenuOpen(false); setMobileAboutOpen(false); setMobilePromisesOpen(false); setMobileServicesOpen(false);
                setActiveBlog(null); setSelectedProperty(null);
                window.location.hash = page; window.scrollTo(0,0);
            };
            const openEnquiry = useCallback(() => { setShowLeadForm(true); }, []);

            if (selectedProperty) {
                return (
                    <>
                        <PropertyDetailsPage property={selectedProperty} allProperties={safeProperties} onBack={() => setSelectedProperty(null)} onNavTo={navTo} onSubmitLead={handleLeadSubmit} isAdmin={isAdmin} onSelectProperty={setSelectedProperty} onOpenEnquiry={openEnquiry} />
                        <button onClick={openEnquiry} className="sticky-git-btn" title="Get in Touch">Get in Touch</button>
                        {showLeadForm && (
                            <div className="fixed inset-0 z-[200] flex items-center justify-center p-4 bg-slate-900/90 backdrop-blur-sm animate-fadeIn" onClick={() => setShowLeadForm(false)}>
                                <div style={{background:'var(--card-bg)',borderRadius:'28px',maxWidth:'380px',width:'100%',padding:'2.5rem',boxShadow:'0 32px 80px rgba(15,23,42,0.5)',position:'relative'}} onClick={e => e.stopPropagation()}>
                                    <button onClick={() => setShowLeadForm(false)} style={{position:'absolute',top:'16px',right:'20px',fontSize:'1.5rem',color:'rgba(100,116,139,0.6)',fontWeight:300,lineHeight:1}} className="hover:text-slate-900 transition">×</button>
                                    <div style={{height:'3px',background:'linear-gradient(90deg,var(--gold),transparent)',borderRadius:'2px',marginBottom:'1.5rem'}}></div>
                                    <h2 style={{fontFamily:"'Cormorant Garamond',Georgia,serif",fontSize:'1.6rem',fontWeight:700,fontStyle:'italic',color:'var(--navy)',marginBottom:'4px',textTransform:'uppercase'}}>Get in Touch</h2>
                                    <p style={{fontSize:'0.6rem',fontWeight:700,color:'var(--slate-soft)',textTransform:'uppercase',letterSpacing:'0.18em',marginBottom:'1.5rem'}}>Our advisor will call you shortly</p>
                                    <form onSubmit={(e) => handleLeadSubmit(null,getVal(selectedProperty,"Property Name"),"Website - Quick Enquiry",e)} className="space-y-3 text-left">
                                        <input type="text" placeholder="Full Name" required style={{width:'100%',border:'1px solid var(--border)',background:'var(--cream)',padding:'14px 16px',borderRadius:'12px',outline:'none',fontFamily:"'DM Sans',sans-serif",fontSize:'0.875rem',fontWeight:500}} className="focus:ring-2 focus:ring-amber-300" value={leadData.name} onChange={e => setLeadData({...leadData,name:e.target.value})} />
                                        <input type="tel" placeholder="Mobile Number (10 Digits)" required style={{width:'100%',border:'1px solid var(--border)',background:'var(--cream)',padding:'14px 16px',borderRadius:'12px',outline:'none',fontFamily:"'DM Sans',sans-serif",fontSize:'0.875rem',fontWeight:500}} className="focus:ring-2 focus:ring-amber-300" value={leadData.phone} onChange={e => setLeadData({...leadData,phone:e.target.value})} />
                                        <input type="email" placeholder="Email Address (Optional)" style={{width:'100%',border:'1px solid var(--border)',background:'var(--cream)',padding:'14px 16px',borderRadius:'12px',outline:'none',fontFamily:"'DM Sans',sans-serif",fontSize:'0.875rem',fontWeight:500}} className="focus:ring-2 focus:ring-amber-300" value={leadData.email} onChange={e => setLeadData({...leadData,email:e.target.value})} />
                                        <button disabled={isSubmitting} type="submit" className="btn-gold w-full font-black py-4 rounded-xl uppercase tracking-widest mt-2 active:scale-95 text-white" style={{fontSize:'0.75rem'}}>{isSubmitting?"Processing…":"Submit Enquiry"}</button>
                                    </form>
                                </div>
                            </div>
                        )}
                    </>
                );
            }

            return (
                <div className="min-h-screen flex flex-col overflow-x-hidden" style={{backgroundColor:'var(--cream)'}}>

                    {/* STICKY HEADER */}
                    <div className="sticky top-0 z-40 w-full flex flex-col" style={{boxShadow:'0 4px 24px rgba(15,23,42,0.18)'}}>
                        <nav style={{background:'linear-gradient(135deg,#0A1628 0%,#0F172A 100%)'}} className="px-4 md:px-8 py-3 md:py-4 flex justify-between items-center relative z-50 gap-4">
                            <h1 onClick={() => navTo('home')} style={{fontFamily:"'Cormorant Garamond',Georgia,serif",letterSpacing:'-0.02em'}} className="text-xl md:text-2xl font-bold text-white uppercase italic cursor-pointer transition shrink-0 hover:text-yellow-300">Perfect Horizons</h1>

                            {activePage === 'home' && (
                                <div className="hidden lg:flex flex-1 justify-center px-4 max-w-2xl">
                                    <div className="relative w-full group">
                                        <span className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm z-10 transition-colors group-focus-within:text-yellow-400"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></span>
                                        <input type="text" placeholder="Search location, project or builder..." style={{background:'rgba(255,255,255,0.07)',border:'1px solid rgba(255,255,255,0.12)',fontSize:'0.75rem',fontFamily:"'DM Sans',sans-serif"}} className="w-full text-white placeholder-slate-400 rounded-full pl-11 pr-5 py-2.5 font-medium outline-none focus:ring-2 focus:ring-yellow-400/40 focus:border-yellow-400/50 transition-all" value={search} onChange={e => setSearch(e.target.value)} />
                                    </div>
                                </div>
                            )}

                            <div className="hidden md:flex gap-5 lg:gap-7 items-center shrink-0">
                                <button onClick={() => navTo('home')} className={`text-[0.65rem] font-black uppercase tracking-widest transition relative pb-1 ${activePage==='home'?'nav-link-active text-yellow-300':'text-slate-300 hover:text-white'}`}>Properties</button>

                                {/* About dropdown */}
                                <div className="nav-dropdown-group py-2 cursor-pointer">
                                    <span className={`text-[0.65rem] font-black uppercase tracking-widest transition flex items-center gap-1 ${['about-us','our-journey'].includes(activePage)?'text-yellow-300':'text-slate-300 hover:text-white'}`}>About <span className="dropdown-arrow"></span></span>
                                    <div className="nav-dropdown-menu">
                                        <div className="nav-dropdown-item" onClick={() => navTo('about-us')}><span className="icon">🏛️</span> About Us</div>
                                        <div className="nav-dropdown-item" onClick={() => navTo('our-journey')}><span className="icon">🗺️</span> Our Journey</div>
                                    </div>
                                </div>

                                {/* Our Promises dropdown (formerly Services) */}
                                <div className="nav-dropdown-group py-2 cursor-pointer">
                                    <span className={`text-[0.65rem] font-black uppercase tracking-widest transition flex items-center gap-1 ${['what-we-do','what-we-dont-do'].includes(activePage)?'text-yellow-300':'text-slate-300 hover:text-white'}`}>Our Promises <span className="dropdown-arrow"></span></span>

                                        <div className="nav-dropdown-item" onClick={() => navTo('what-we-do')}><span className="icon">✅</span> What We Do</div>

                                    </div>

                                {/* NEW: Services dropdown */}
                                <div className="nav-dropdown-group py-2 cursor-pointer">
                                    <span className={`text-[0.65rem] font-black uppercase tracking-widest transition flex items-center gap-1 ${['interiors','home-loan'].includes(activePage)?'text-yellow-300':'text-slate-300 hover:text-white'}`}>Services <span className="dropdown-arrow"></span></span>
                                    <div className="nav-dropdown-menu">
                                        <div className="nav-dropdown-item" onClick={() => navTo('interiors')}><span className="icon">🛋️</span> Interiors</div>
                                        <div className="nav-dropdown-item" onClick={() => navTo('home-loan')}><span className="icon">🏦</span> Home Loan</div>
                                    </div>
                                </div>

                                <button onClick={() => navTo('advisor')} className={`text-[0.65rem] font-black uppercase tracking-widest transition relative pb-1 ${activePage==='advisor'?'nav-link-active text-yellow-300':'text-slate-300 hover:text-white'}`}>Advisors</button>
                                <button onClick={() => navTo('blogs')} className={`text-[0.65rem] font-black uppercase tracking-widest transition relative pb-1 ${activePage==='blogs'?'nav-link-active text-yellow-300':'text-slate-300 hover:text-white'}`}>Insights</button>
                                <button onClick={() => navTo('customers')} className={`text-[0.65rem] font-black uppercase tracking-widest transition relative pb-1 ${activePage==='customers'?'nav-link-active text-yellow-300':'text-slate-300 hover:text-white'}`}>Reviews</button>
                            </div>

                            <div className="md:hidden flex items-center gap-3 shrink-0">
                                {activePage==='home' && (<button onClick={() => setIsMobileSearchOpen(!isMobileSearchOpen)} style={{border:'1px solid rgba(255,255,255,0.15)',minHeight:'40px'}} className="flex items-center gap-1.5 text-slate-300 px-3 py-1.5 rounded-full text-[0.6rem] font-black uppercase tracking-widest hover:border-yellow-400 hover:text-yellow-300 transition active:scale-95"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>Search</button>)}
                                <button onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)} style={{minWidth:'44px',minHeight:'44px'}} className="text-white focus:outline-none flex items-center justify-center rounded-xl transition active:scale-90">
                                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d={isMobileMenuOpen?"M6 18L18 6M6 6l12 12":"M4 6h16M4 12h16M4 18h16"}></path></svg>
                                </button>
                            </div>
                        </nav>

                        {activePage === 'home' && (
                            <>
                            <div style={{background:'#FFFFFF',borderBottom:'1px solid var(--border)'}} className="py-2.5 md:py-3 overflow-hidden flex flex-col items-center marquee-container">
                                <p style={{fontSize:'0.55rem',letterSpacing:'0.22em',color:'#B45309'}} className="font-black uppercase mb-1.5">Associated With</p>
                                <div className="animate-marquee flex items-center">
                                    {AUTHORIZED_PARTNERS.concat(AUTHORIZED_PARTNERS).map((logo,index) => (<img key={index} src={logo} loading="lazy" decoding="async" width="120" height="36" className="h-7 md:h-9 mx-8 md:mx-12 opacity-90 hover:opacity-100 transition-opacity" style={{objectFit:'contain'}} />))}
                                </div>
                            </div>
                            <div className="filter-bar py-2.5 md:py-3 px-4 relative z-40 w-full">
                                <div className="max-w-7xl mx-auto w-full">
                                    {isMobileSearchOpen && (<div className="md:hidden w-full relative animate-fadeIn mb-3"><span className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></span><input type="text" placeholder="Search location, project..." style={{border:'2px solid var(--teal)',fontFamily:"'DM Sans',sans-serif",fontSize:'0.8rem',minHeight:'48px'}} className="w-full bg-white pl-10 pr-4 py-3 rounded-xl font-medium outline-none shadow-sm" value={search} onChange={e => setSearch(e.target.value)} autoFocus /></div>)}
                                    <div className="md:hidden flex justify-between items-center h-6">
                                        <span style={{fontSize:'0.6rem',letterSpacing:'0.2em',color:'var(--slate-soft)'}} className="font-black uppercase">Property Finder</span>
                                        <button onClick={() => setIsMobileFilterOpen(!isMobileFilterOpen)} style={{color:'var(--teal)',minHeight:'44px',fontSize:'0.65rem'}} className="font-black uppercase tracking-widest flex items-center gap-1.5 active:scale-95 transition-transform px-2">
                                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="11" y1="18" x2="13" y2="18"/></svg>
                                            Filters {isMobileFilterOpen?'▲':'▼'}
                                        </button>
                                    </div>
                                    <div className={`${isMobileFilterOpen?'grid':'hidden'} md:grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-2 md:gap-3 mt-3 md:mt-0 animate-fadeIn w-full`}>
                                        <select className="ph-select w-full bg-white px-3 md:px-4 py-2.5 rounded-xl text-[0.7rem] md:text-xs font-semibold outline-none border text-gray-700" style={{borderColor:'var(--border)',fontFamily:"'DM Sans',sans-serif"}} value={filters.bhk} onChange={e => setFilters({...filters,bhk:e.target.value})}>
                                            <option value="">🏠 Configuration</option>
                                            <option value="1">1 BHK</option><option value="2">2 BHK</option><option value="3">3 BHK</option><option value="4">4 BHK</option><option value="5">5 BHK</option>
                                        </select>
                                        <select className="ph-select w-full bg-white px-3 md:px-4 py-2.5 rounded-xl text-[0.7rem] md:text-xs font-semibold outline-none border text-gray-700" style={{borderColor:'var(--border)',fontFamily:"'DM Sans',sans-serif"}} value={filters.status} onChange={e => setFilters({...filters,status:e.target.value})}>
                                            <option value="">🔑 Status</option>
                                            <option value="Ready to Move In">Ready to Move</option>
                                            <option value="Under Construction">Under Construction</option>

                                    <input type="text" placeholder="Full Name" required style={{width:'100%',border:'1px solid var(--border)',background:'var(--cream)',padding:'14px 16px',borderRadius:'12px',outline:'none',fontFamily:"'DM Sans',sans-serif",fontSize:'0.875rem',fontWeight:500}} className="focus:ring-2 focus:ring-amber-300" value={leadData.name} onChange={e => setLeadData({...leadData,name:e.target.value})} />
                                    <input type="tel" placeholder="Mobile Number (10 Digits)" required style={{width:'100%',border:'1px solid var(--border)',background:'var(--cream)',padding:'14px 16px',borderRadius:'12px',outline:'none',fontFamily:"'DM Sans',sans-serif",fontSize:'0.875rem',fontWeight:500}} className="focus:ring-2 focus:ring-amber-300" value={leadData.phone} onChange={e => setLeadData({...leadData,phone:e.target.value})} />
                                    <input type="email" placeholder="Email Address (Optional)" style={{width:'100%',border:'1px solid var(--border)',background:'var(--cream)',padding:'14px 16px',borderRadius:'12px',outline:'none',fontFamily:"'DM Sans',sans-serif",fontSize:'0.875rem',fontWeight:500}} className="focus:ring-2 focus:ring-amber-300" value={leadData.email} onChange={e => setLeadData({...leadData,email:e.target.value})} />
                                    <button disabled={isSubmitting} type="submit" className="btn-gold w-full font-black py-4 rounded-xl uppercase tracking-widest mt-2 active:scale-95 text-white" style={{fontSize:'0.75rem'}}>{isSubmitting?"Processing…":"Submit Interest"}</button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
