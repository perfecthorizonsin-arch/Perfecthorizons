<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfect Horizons | Property Dashboard</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fadeIn { animation: fadeIn 0.2s ease-out forwards; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const LEAD_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzKmjXhueUDqDJ2HwalGBuRk4WfEEx-ruYZJ5IeSCIMxSDuEwaCAMspYBq-zMrFzmY/exec';
        const WHATSAPP_NUMBER = "919742353260";
        const API_URL = "https://script.google.com/macros/s/AKfycbzORxItxvqlsIUokcs7JCKjFASG2e3y_CrAT2zuy81aEQvLsVG6Sm6CuuSplgWnWh4/exec";

        const fixImageUrl = (rawUrl) => {
            if (!rawUrl || typeof rawUrl !== 'string' || rawUrl.trim() === '') return 'https://via.placeholder.com/800x500?text=No+Image';
            let url = rawUrl.split(',')[0].trim();
            let id = null;
            if (url.includes('drive.google.com/file/d/')) {
                const match = url.match(/\/d\/(.*?)\//);
                if (match && match[1]) id = match[1];
            } else if (url.includes('drive.google.com/open?id=')) {
                id = url.split('id=')[1];
            }
            return id ? `https://drive.google.com/thumbnail?id=${id}&sz=w1000` : url;
        };

        const formatDate = (ds) => ds ? new Date(ds).toLocaleDateString('en-IN', { month: 'short', year: 'numeric' }) : "N/A";

        function App() {
            const [properties, setProperties] = useState([]);
            const [loading, setLoading] = useState(true);
            const [filters, setFilters] = useState({ bhk: "", location: "" });
            const [selectedProperty, setSelectedProperty] = useState(null);
            const [showLeadForm, setShowLeadForm] = useState(false);
            const [leadData, setLeadData] = useState({ name: "", phone: "" });
            const [isSubmitting, setIsSubmitting] = useState(false);

            const urlParams = new URLSearchParams(window.location.search);
            const isAdmin = urlParams.get("key") === "admin123";

            useEffect(() => {
                const cached = localStorage.getItem('ph_cache_v2');
                if (cached) { setProperties(JSON.parse(cached)); setLoading(false); }
                fetch(API_URL).then(res => res.json()).then(data => {
                    setProperties(data); setLoading(false);
                    localStorage.setItem('ph_cache_v2', JSON.stringify(data));
                }).catch(() => setLoading(false));
            }, []);

            const handleLeadSubmit = (e) => {
                e.preventDefault();
                if (!/^[6-9]\d{9}$/.test(leadData.phone)) return alert("Enter valid 10-digit number");
                setIsSubmitting(true);
                fetch(LEAD_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({
                    name: leadData.name, phone: leadData.phone, property: selectedProperty["Property Name"]
                })}).then(() => {
                    alert("Thank you! Tharun will call you.");
                    setIsSubmitting(false); setShowLeadForm(false); setLeadData({ name: "", phone: "" });
                });
            };

            const getGallery = (p) => {
                const cover = fixImageUrl(p["Cover Image"]);
                const galleryStr = p["Images and short videos \nif any"];
                if (!galleryStr) return [cover];
                const links = String(galleryStr).split(',').map(l => fixImageUrl(l.trim())).filter(l => !l.includes('placeholder'));
                return [cover, ...links];
            };

            const filtered = properties.filter(p => {
                const locMatch = !filters.location || (p.Location && p.Location.toLowerCase().includes(filters.location.toLowerCase()));
                const bhkMatch = !filters.bhk || String(p["No of BHK's"] || "").includes(filters.bhk);
                return locMatch && bhkMatch;
            });

            if (loading && properties.length === 0) return (
                <div className="flex h-screen items-center justify-center font-black text-blue-900 animate-pulse italic">PERFECT HORIZONS...</div>
            );

            return (
                <div className="min-h-screen pb-20 animate-fadeIn">
                    <nav className="bg-white shadow-sm px-6 py-5 sticky top-0 z-40 border-b flex justify-between items-center">
                        <h1 className="text-xl font-black text-blue-900 tracking-tighter uppercase italic">Perfect Horizons</h1>
                        {isAdmin && <span className="bg-green-600 text-white text-[10px] px-3 py-1 rounded-full font-bold">ADMIN ACTIVE</span>}
                    </nav>

                    <main className="max-w-7xl mx-auto p-4 md:p-8">
                        <div className="bg-white p-6 rounded-2xl shadow-sm border mb-8 flex flex-wrap gap-4 items-end">
                            <div className="flex-1 min-w-[200px]">
                                <label className="text-[10px] font-black text-gray-400 uppercase tracking-widest block">Location</label>
                                <input type="text" placeholder="Search area..." className="w-full border rounded-xl p-3 text-sm outline-none" value={filters.location} onChange={e => setFilters({...filters, location: e.target.value})} />
                            </div>
                            <div className="w-32">
                                <label className="text-[10px] font-black text-gray-400 uppercase tracking-widest block">BHK</label>
                                <select className="w-full border rounded-xl p-3 text-sm outline-none bg-white" value={filters.bhk} onChange={e => setFilters({...filters, bhk: e.target.value})}>
                                    <option value="">All</option>
                                    {[1,2,3,4,5].map(n => <option key={n} value={n}>{n} BHK</option>)}
                                </select>
                            </div>
                            <button onClick={() => setFilters({bhk:"", location:""})} className="text-blue-600 text-sm font-bold h-12 px-4 hover:bg-blue-50 rounded-xl transition">Clear</button>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                            {filtered.map((p, i) => (
                                <div key={i} onClick={() => setSelectedProperty(p)} className="bg-white rounded-3xl shadow-sm border overflow-hidden hover:shadow-xl transition-all cursor-pointer">
                                    <img src={fixImageUrl(p["Cover Image"])} className="w-full h-56 object-cover" />
                                    <div className="p-6">
                                        <h2 className="text-xl font-bold line-clamp-1">{p["Property Name"]}</h2>
                                        <p className="text-gray-500 text-sm">📍 {p.Location}</p>
                                        <div className="text-blue-600 font-black text-2xl mt-2">{p.Price}</div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </main>

                    {selectedProperty && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
                            <div className="absolute inset-0 bg-black/70 backdrop-blur-sm" onClick={() => setSelectedProperty(null)}></div>
                            <div className="bg-white rounded-3xl w-full max-w-4xl max-h-[90vh] overflow-hidden flex flex-col relative z-10 shadow-2xl animate-fadeIn">
                                <button onClick={() => setSelectedProperty(null)} className="absolute top-4 right-4 bg-black/50 text-white w-10 h-10 rounded-full z-20">✕</button>
                                
                                <div className="overflow-y-auto w-full hide-scroll">
                                    <div className="flex overflow-x-auto snap-x snap-mandatory h-72 sm:h-96 bg-gray-100 hide-scroll">
                                        {getGallery(selectedProperty).map((img, idx) => (
                                            <img key={idx} src={img} className="w-full h-full object-cover shrink-0 snap-center" />
                                        ))}
                                    </div>
                                    <div className="text-center text-[10px] text-gray-400 mt-2 font-bold uppercase tracking-widest">Swipe for more photos</div>

                                    <div className="p-6 sm:p-10">
                                        <h1 className="text-3xl font-black">{selectedProperty["Property Name"]}</h1>
                                        <p className="text-gray-500 text-lg mb-4">📍 {selectedProperty.Location}</p>
                                        <div className="text-blue-600 font-black text-3xl mb-8">{selectedProperty.Price}</div>

                                        <div className="grid grid-cols-2 sm:grid-cols-3 gap-4 bg-gray-50 p-6 rounded-2xl mb-8">
                                            <div><span className="text-[10px] text-gray-400 font-bold uppercase block">Builder</span><span className="font-bold">{selectedProperty["Builder Name"] || "N/A"}</span></div>
                                            <div><span className="text-[10px] text-gray-400 font-bold uppercase block">Units</span><span className="font-bold">{selectedProperty["Total Units "] || "N/A"}</span></div>
                                            <div><span className="text-[10px] text-gray-400 font-bold uppercase block">Possession</span><span className="font-bold">{formatDate(selectedProperty["Possession Date"])}</span></div>
                                        </div>

                                        {selectedProperty["USP's"] && (
                                            <div className="mb-8">
                                                <h3 className="text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">Highlights</h3>
                                                <ul className="list-disc pl-5 text-sm space-y-1 text-gray-700">
                                                    {selectedProperty["USP's"].split('\n').map((u, i) => u.trim() && <li key={i}>{u}</li>)}
                                                </ul>
                                            </div>
                                        )}

                                        {isAdmin && (
                                            <div className="bg-yellow-50 border-2 border-yellow-100 p-6 rounded-2xl mb-8">
                                                <h3 className="text-yellow-800 font-black text-[10px] uppercase mb-1 tracking-widest">Confidential Payout Info</h3>
                                                <p className="text-yellow-900 text-sm whitespace-pre-line font-medium">{selectedProperty["Commission % and Payout info"] || "No payout info available."}</p>
                                            </div>
                                        )}

                                        <div className="bg-blue-50 p-6 rounded-2xl border border-blue-100 flex flex-col gap-3">
                                            <button onClick={() => setShowLeadForm(true)} className="bg-blue-600 text-white font-black py-4 rounded-xl shadow-lg uppercase text-sm">I am Interested</button>
                                            <div className="grid grid-cols-3 gap-2">
                                                <a href={`https://wa.me/${WHATSAPP_NUMBER}?text=Brochure: ${selectedProperty["Property Name"]}`} target="_blank" className="bg-white border p-3 rounded-xl text-[10px] font-bold text-center">BROCHURE</a>
                                                <a href={`https://wa.me/${WHATSAPP_NUMBER}?text=Cost Sheet: ${selectedProperty["Property Name"]}`} target="_blank" className="bg-white border p-3 rounded-xl text-[10px] font-bold text-center">COST SHEET</a>
                                                <a href={`https://wa.me/${WHATSAPP_NUMBER}?text=Callback: ${selectedProperty["Property Name"]}`} target="_blank" className="bg-white border p-3 rounded-xl text-[10px] font-bold text-center">CALLBACK</a>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {showLeadForm && (
                        <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-black/80">
                            <div className="bg-white rounded-3xl p-8 w-full max-w-sm animate-fadeIn shadow-2xl">
                                <h2 className="text-2xl font-black text-blue-900 mb-2">Interested?</h2>
                                <p className="text-gray-500 text-xs mb-6">Leave details for a call from Tharun.</p>
                                <form onSubmit={handleLeadSubmit} className="space-y-4">
                                    <input type="text" placeholder="Name" required className="w-full border p-4 rounded-xl outline-none" value={leadData.name} onChange={e => setLeadData({...leadData, name: e.target.value})} />
                                    <input type="tel" placeholder="10-Digit Phone" required className="w-full border p-4 rounded-xl outline-none" value={leadData.phone} onChange={e => setLeadData({...leadData, phone: e.target.value})} />
                                    <button disabled={isSubmitting} type="submit" className="w-full bg-blue-600 text-white font-black py-4 rounded-xl">{isSubmitting ? "Sending..." : "SUBMIT"}</button>
                                    <p onClick={() => setShowLeadForm(false)} className="text-center text-gray-400 text-xs cursor-pointer">Cancel</p>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
