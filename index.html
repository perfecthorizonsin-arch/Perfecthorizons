<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfect Horizons Dashboard</title>
    
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function App() {
            // State for toggling Admin vs Customer view
            const [isAdmin, setIsAdmin] = useState(false);

            // State for Filters
            const [filters, setFilters] = useState({ bhk: "", location: "", maxPrice: "" });

            // Dummy Data customized for your market
            const properties = [
                { id: 1, title: "Premium Villas", location: "Sarjapur Road", price: 25000000, priceDisplay: "₹2.50 Cr", bhk: "4", status: "Available", img: "https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=800&q=80" },
                { id: 2, title: "Luxury Highrise", location: "Whitefield", price: 12000000, priceDisplay: "₹1.20 Cr", bhk: "3", status: "Available", img: "https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?w=800&q=80" },
                { id: 3, title: "Cozy Apartments", location: "Sarjapur Road", price: 8500000, priceDisplay: "₹85 Lacs", bhk: "2", status: "Sold Out", img: "https://images.unsplash.com/photo-1512917774080-9991f1c4c750?w=800&q=80" },
                { id: 4, title: "Tech Park Suites", location: "Bellandur", price: 15000000, priceDisplay: "₹1.50 Cr", bhk: "3", status: "Available", img: "https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?w=800&q=80" }
            ];

            // Filter Logic
            const filteredProperties = properties.filter(prop => {
                const matchBhk = filters.bhk === "" || prop.bhk === filters.bhk;
                const matchLoc = filters.location === "" || prop.location.includes(filters.location);
                const matchPrice = filters.maxPrice === "" || prop.price <= parseInt(filters.maxPrice);
                return matchBhk && matchLoc && matchPrice;
            });

            const clearFilters = () => setFilters({ bhk: "", location: "", maxPrice: "" });

            return (
                <div className="min-h-screen">
                    {/* Navigation */}
                    <nav className="bg-white shadow-sm border-b px-8 py-4 flex justify-between items-center sticky top-0 z-50">
                        <h1 className="text-2xl font-bold text-blue-900 flex items-center gap-2">
                            <span>🏢</span> Perfect Horizons
                        </h1>
                        
                        {/* Admin Toggle Switch */}
                        <div className="flex items-center gap-3 bg-gray-100 px-4 py-2 rounded-lg border border-gray-200">
                            <span className={`text-sm font-semibold ${!isAdmin ? 'text-blue-600' : 'text-gray-400'}`}>Customer</span>
                            <button 
                                onClick={() => setIsAdmin(!isAdmin)}
                                className={`w-12 h-6 rounded-full p-1 transition-colors ${isAdmin ? 'bg-blue-600' : 'bg-gray-300'}`}
                            >
                                <div className={`w-4 h-4 rounded-full bg-white transition-transform ${isAdmin ? 'translate-x-6' : ''}`}></div>
                            </button>
                            <span className={`text-sm font-semibold ${isAdmin ? 'text-blue-600' : 'text-gray-400'}`}>Admin</span>
                        </div>
                    </nav>

                    <main className="max-w-7xl mx-auto px-4 md:px-8 py-8">
                        {/* Filters Section */}
                        <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-200 mb-8 flex flex-wrap gap-4 items-end">
                            <div className="flex-1 min-w-[150px]">
                                <label className="block text-sm font-medium text-gray-700 mb-1">Location</label>
                                <select 
                                    className="w-full border-gray-300 rounded-lg p-2 border focus:ring-blue-500 focus:border-blue-500"
                                    value={filters.location}
                                    onChange={(e) => setFilters({...filters, location: e.target.value})}
                                >
                                    <option value="">All Locations</option>
                                    <option value="Sarjapur Road">Sarjapur Road</option>
                                    <option value="Whitefield">Whitefield</option>
                                    <option value="Bellandur">Bellandur</option>
                                </select>
                            </div>
                            <div className="flex-1 min-w-[150px]">
                                <label className="block text-sm font-medium text-gray-700 mb-1">BHK</label>
                                <select 
                                    className="w-full border-gray-300 rounded-lg p-2 border focus:ring-blue-500"
                                    value={filters.bhk}
                                    onChange={(e) => setFilters({...filters, bhk: e.target.value})}
                                >
                                    <option value="">Any BHK</option>
                                    <option value="2">2 BHK</option>
                                    <option value="3">3 BHK</option>
                                    <option value="4">4 BHK</option>
                                </select>
                            </div>
                            <div className="flex-1 min-w-[150px]">
                                <label className="block text-sm font-medium text-gray-700 mb-1">Max Price</label>
                                <select 
                                    className="w-full border-gray-300 rounded-lg p-2 border focus:ring-blue-500"
                                    value={filters.maxPrice}
                                    onChange={(e) => setFilters({...filters, maxPrice: e.target.value})}
                                >
                                    <option value="">Any Price</option>
                                    <option value="10000000">Under ₹1 Cr</option>
                                    <option value="15000000">Under ₹1.5 Cr</option>
                                    <option value="20000000">Under ₹2 Cr</option>
                                </select>
                            </div>
                            <button 
                                onClick={clearFilters}
                                className="px-6 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium rounded-lg transition"
                            >
                                Clear All
                            </button>
                        </div>

                        {/* Property Grid */}
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            {filteredProperties.length === 0 ? (
                                <p className="text-gray-500 col-span-full text-center py-8">No properties match your filters.</p>
                            ) : (
                                filteredProperties.map(property => (
                                    <div key={property.id} className="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-lg transition border border-gray-100 flex flex-col">
                                        <div className="h-48 overflow-hidden relative">
                                            <img src={property.img} alt={property.title} className="w-full h-full object-cover" />
                                            <span className={`absolute top-4 right-4 px-3 py-1 text-xs font-bold rounded-full ${property.status === 'Available' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}`}>
                                                {property.status}
                                            </span>
                                        </div>
                                        
                                        <div className="p-5 flex-grow">
                                            <div className="text-2xl font-bold text-blue-700 mb-1">{property.priceDisplay}</div>
                                            <h3 className="text-xl font-semibold text-gray-900">{property.title}</h3>
                                            <p className="text-gray-500 mb-3 text-sm">📍 {property.location}</p>
                                            <div className="inline-block bg-gray-100 px-3 py-1 rounded text-sm font-medium text-gray-700 mb-4">
                                                🛏️ {property.bhk} BHK
                                            </div>

                                            {/* Action Buttons: Conditional based on View */}
                                            {isAdmin ? (
                                                <div className="grid grid-cols-2 gap-2 mt-auto border-t pt-4">
                                                    <button className="bg-indigo-50 text-indigo-700 text-sm font-medium py-2 rounded hover:bg-indigo-100">📤 Share Brochure</button>
                                                    <button className="bg-indigo-50 text-indigo-700 text-sm font-medium py-2 rounded hover:bg-indigo-100">📸 Share Images</button>
                                                    <button className="bg-indigo-50 text-indigo-700 text-sm font-medium py-2 rounded hover:bg-indigo-100">💰 Share Cost Sheet</button>
                                                    <button className="bg-indigo-50 text-indigo-700 text-sm font-medium py-2 rounded hover:bg-indigo-100">🗺️ Share Map</button>
                                                </div>
                                            ) : (
                                                <div className="grid grid-cols-2 gap-2 mt-auto border-t pt-4">
                                                    <button className="col-span-2 bg-blue-600 text-white text-sm font-bold py-2.5 rounded hover:bg-blue-700">✋ I am Interested</button>
                                                    <button className="border border-gray-300 text-gray-700 text-xs font-medium py-2 rounded hover:bg-gray-50">📥 Req. Brochure</button>
                                                    <button className="border border-gray-300 text-gray-700 text-xs font-medium py-2 rounded hover:bg-gray-50">📞 Req. Callback</button>
                                                    <button className="col-span-2 border border-gray-300 text-gray-700 text-xs font-medium py-2 rounded hover:bg-gray-50">📊 Request Cost Sheet</button>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                ))
                            )}
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
