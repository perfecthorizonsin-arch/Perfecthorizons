        const BLOG_ARTICLES = [
            { id: 1, tag: "Legal Guide", title: "What is UDS (Undivided Share) and Why Does it Matter?", metaDescription: "Learn what Undivided Share of Land (UDS) means for apartment buyers in Bengaluru, why it determines your resale value, and how to check if your builder is offering a fair share.", excerpt: "When you buy an apartment, you aren't just buying the flat; you are buying a piece of the land it sits on. Understanding your UDS is critical.", content: `<p>When purchasing an apartment in Bengaluru, many buyers focus entirely on the super built-up area and the amenities. However, the most critical element of your investment is the <strong>Undivided Share of Land (UDS)</strong>.</p><br/><h2>What is UDS?</h2><p>UDS is your personal share of the land on which the entire apartment complex is built. Since you cannot physically mark out your exact piece of land in a high-rise, it is expressed as a fraction or percentage. Every apartment owner in the project collectively owns the land, and your UDS is calculated based on your flat's area relative to the total saleable area of the project.</p><br/><h2>Why is it so important?</h2><ul style="list-style-type:disc;margin-left:20px;"><li><strong>Future Resale Value:</strong> The building structure depreciates over time, but the land appreciates. Your property's true resale value is determined largely by the UDS.</li><li><strong>Redevelopment:</strong> If the building is demolished or redeveloped decades from now, your compensation or new apartment allocation will be based strictly on your UDS.</li><li><strong>Loan & Legal Clarity:</strong> Banks and registrars use UDS figures to validate the sale deed and ensure the transaction is legally sound.</li></ul><br/><h2>How to Check Your UDS</h2><p>Your UDS should be explicitly mentioned in your sale agreement and sale deed, usually expressed in square feet or as a percentage. A simple way to estimate a fair UDS is: (Your Flat's Super Built-up Area ÷ Total Super Built-up Area of All Units) × Total Project Land Area.</p><br/><p><strong>The Rule of Thumb:</strong> Always ask the builder for the exact UDS before booking. If the UDS is unusually low compared to the size of your flat, it means the builder is over-utilizing the land, which dilutes your investment and could reduce your long-term returns.</p>` },
            { id: 2, tag: "Finance Hack", title: "5 Hidden Charges Builders Don't Tell You About", metaDescription: "Discover the 5 most common hidden charges Bengaluru builders add after booking — BESCOM/BWSSB deposits, clubhouse fees, advance maintenance, legal charges and floor rise premiums — and how to avoid surprises.", excerpt: "The 'Base Price' is never the final price. From Club House charges to BESCOM deposits, learn how to calculate the actual landed cost.", content: `<p>You see an ad for a luxury 3BHK for "₹1.2 Cr Onwards." You visit the site, fall in love, and sit down to book it—only to realize the final cost is suddenly ₹1.45 Cr. What happened?</p><br/><h2>The Most Common Hidden Charges</h2><ol style="list-style-type:decimal;margin-left:20px;"><li><strong>BESCOM & BWSSB Charges</strong> — Electricity and water connection deposits levied by the utility boards, often passed on to the buyer at a markup.</li><li><strong>Clubhouse & Amenity Fees</strong> — A one-time charge for access to the gym, pool, and clubhouse, sometimes running into several lakhs.</li><li><strong>Advance Maintenance</strong> — Builders often collect 1-2 years of maintenance upfront before handover.</li><li><strong>Legal & Documentation Charges</strong> — Stamp duty, registration, and "legal fee" line items that vary widely between builders.</li><li><strong>Floor Rise Premium (PLC)</strong> — Higher floors and units with a "preferred view" can add a per-square-foot premium on top of the base price.</li></ol><br/><h2>How to Protect Yourself</h2><p>Always demand a comprehensive <strong>Cost Sheet</strong> before paying any token amount. A proper cost sheet should break down the base price, floor rise charges, car parking, clubhouse fee, BESCOM/BWSSB, legal charges, GST, and advance maintenance as separate line items — so there are no surprises at the time of agreement.</p>` },
            { id: 3, tag: "Property Types", title: "Carpet Area vs. Super Built-up Area: What Are You Actually Paying For?", metaDescription: "Confused about carpet area vs super built-up area in Bengaluru apartments? Understand RERA carpet area, loading factor, and how builders calculate the price you actually pay.", excerpt: "Don't be fooled by big numbers. Learn how builders calculate space and why RERA Carpet Area is the only metric that matters.", content: `<p>One of the biggest confusions for home buyers is the difference between the area advertised and the actual livable space they get.</p><br/><h2>RERA Carpet Area</h2><p>This is the actual usable floor area inside your apartment — the space within the walls where you can lay a carpet. Under the RERA Act, builders <strong>must</strong> quote this area to buyers, as it represents the true living space you're paying for.</p><br/><h2>Super Built-up Area (SBA)</h2><p>This is the number builders use to calculate your final price. It includes the Built-up Area (carpet area plus wall thickness) PLUS a proportionate share of common areas such as lobbies, staircases, lifts, and the clubhouse. The difference between carpet area and super built-up area is called the "Loading Factor." Some builders apply a loading factor of 30-35%, meaning nearly a third of what you're paying for is common area, not your private living space.</p><br/><h2>Why This Matters</h2><p>When comparing two projects, never compare the price-per-square-foot of super built-up area alone. Always ask for the RERA carpet area and recalculate the effective price-per-square-foot of actual usable space — this is the only fair way to compare value across projects with different loading factors.</p>` },
            { id: 4, tag: "Legal Guide", title: "A Khata vs B Khata in Bengaluru: The Ultimate Buyer's Guide", metaDescription: "A Khata vs B Khata explained for Bengaluru property buyers — what each means, why B Khata properties face home loan rejections, and how to verify property records before buying.", excerpt: "Confused about Khatas? Buying a 'B Khata' property can lead to loan rejections and legal trouble. Here is how to verify property records.", content: `<p>If you are buying property in Bengaluru, the word "Khata" will come up immediately. A Khata is essentially a property tax record maintained by the BBMP (Bruhat Bengaluru Mahanagara Palike) that identifies the assessment of a property for tax purposes.</p><br/><h2>What is A Khata?</h2><p>An 'A' Khata certificate means the property is completely legal, built according to approved plans, and recognized by the BBMP for all civic purposes. <strong>You can easily get home loans with an 'A' Khata</strong> from any nationalized or private bank.</p><br/><h2>What is B Khata?</h2><p>A 'B' Khata signifies the property is either built in violation of building bye-laws, located on revenue land, or has pending dues/approvals. While the owner still pays property tax, the property is technically considered "irregular." Nationalized banks will <strong>not</strong> give you a home loan for a B Khata property, and resale becomes significantly harder.</p><br/><h2>How to Verify Before You Buy</h2><p>Before booking any property, ask for the Khata certificate and Khata extract, and cross-check the property's status on the BBMP portal. Our advisors at Perfect Horizons help clients verify A Khata status as part of our standard due-diligence process — completely free of charge.</p>` }
        ];

                if (coordMatch) return `https://maps.google.com/maps?q=${coordMatch[1]},${coordMatch[2]}&z=16&output=embed`;
                const url = new URL(link.startsWith('http') ? link : 'https://' + link);

                if (!query) { const placeMatch = link.match(/\/maps\/place\/([^/@?]+)/); if (placeMatch) query = decodeURIComponent(placeMatch[1].replace(/\+/g, ' ')); }

        // ─── MAIN APP ───
        function App() {
            const [properties, setProperties] = useState([]);
            const [loading, setLoading] = useState(true);
            const [isAdmin, setIsAdmin] = useState(false);
            const [selectedProperty, setSelectedProperty] = useState(null);
            const [search, setSearch] = useState("");
            const [isMobileSearchOpen, setIsMobileSearchOpen] = useState(false);
            const [isMobileFilterOpen, setIsMobileFilterOpen] = useState(false);
            const [filters, setFilters] = useState({ bhk: "", status: "", type: "", priceBracket: "", possessionYear: "" });
            const [showLeadForm, setShowLeadForm] = useState(false);
            const [leadData, setLeadData] = useState({ name: "", phone: "", email: "" });
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [activePage, setActivePage] = useState(() => (window.location.hash.replace('#','').split('/')[0]) || 'home');
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            const [mobileAboutOpen, setMobileAboutOpen] = useState(false);
            const [mobilePromisesOpen, setMobilePromisesOpen] = useState(false);
            const [mobileServicesOpen, setMobileServicesOpen] = useState(false);
            const [activeBlog, setActiveBlog] = useState(null);
            const [legalModal, setLegalModal] = useState(null);

            // ─── SEO: page-level title + meta description per route ───
            const PAGE_SEO = {
                'home': { title: "Perfect Horizons | Luxury Property Portal — Bengaluru", desc: "Browse RERA-approved apartments, villas and plots across Bengaluru. Free, unbiased advisory — no hidden charges, no spam calls." , path: "/"},
                'about-us': { title: "About Us | Perfect Horizons Real Estate Advisory, Bengaluru", desc: "Learn about Perfect Horizons — a trust-first luxury real estate advisory in Bengaluru focused on honest, unbiased property guidance.", path: "/#about-us" },
                'our-journey': { title: "Our Journey | Perfect Horizons", desc: "The story behind Perfect Horizons — built on trust over transactions, clarity over confusion, and relationships over gains.", path: "/#our-journey" },
                'what-we-do': { title: "What We Do | Perfect Horizons Real Estate Services Bengaluru", desc: "From project discovery and guided site visits to negotiation and post-sales support — see how Perfect Horizons helps Bengaluru home buyers.", path: "/#what-we-do" },
                'what-we-dont-do': { title: "Our Promises | Perfect Horizons — No Hidden Charges, No Spam", desc: "Perfect Horizons never charges buyers, never pushes bad projects, never spam calls, and never hides facts. See our commitments.", path: "/#what-we-dont-do" },
                'interiors': { title: "Interior Design Services Bengaluru | Perfect Horizons", desc: "Get connected with trusted interior designers in Bengaluru for modular kitchens, wardrobes, false ceilings, flooring and full home interiors.", path: "/#interiors" },
                'home-loan': { title: "Home Loan Assistance Bengaluru | Perfect Horizons", desc: "Free home loan assistance in Bengaluru — top bank partners, fast approvals, EMI calculator and complete documentation support.", path: "/#home-loan" },
                'advisor': { title: "Meet Your Advisor | Perfect Horizons Bengaluru", desc: "Meet Tharun, Lead Luxury Advisor at Perfect Horizons — unbiased, expert guidance for property buyers in Bengaluru.", path: "/#advisor" },
                'blogs': { title: "Real Estate Insights & Guides Bengaluru | Perfect Horizons", desc: "Expert guides for Bengaluru property buyers — UDS, A Khata vs B Khata, carpet area vs super built-up area, hidden charges and more.", path: "/#blogs" },
                'customers': { title: "Customer Reviews | Perfect Horizons Bengaluru", desc: "Read what homeowners say about working with Perfect Horizons — honest advisory, guided site visits and stress-free home buying in Bengaluru.", path: "/#customers" }
            };

            useEffect(() => {
                const urlParams = new URLSearchParams(window.location.search);
                if (urlParams.get("key") === "admin123") setIsAdmin(true);
                const handleHashChange = () => {
                    const rawHash = window.location.hash.replace('#','');
                    const parts = rawHash.split('/');
                    const page = parts[0] || 'home';
                    setActivePage(page);
                    if(page!=='home') setSelectedProperty(null);
                    if (page === 'blogs' && parts[1]) {
                        const blog = BLOG_ARTICLES.find(b => String(b.id) === parts[1]);
                        setActiveBlog(blog || null);
                    } else if (page !== 'blogs') {
                        setActiveBlog(null);
                    }
                };
                window.addEventListener('hashchange', handleHashChange);
                handleHashChange();
                const fetchProperties = async () => {
                    try { const { data, error } = await supabase.from('properties').select('*').eq('is_live', true).order('display_order', { ascending: true, nullsFirst: false }); if (!error) setProperties(data||[]); } catch(e){console.error(e);} finally { setLoading(false); }
                };
                fetchProperties();
                const channel = supabase.channel('public:properties')
                    .on('postgres_changes', { event:'*', schema:'public', table:'properties' }, (payload) => {
                        if (payload.eventType==='INSERT') { if(payload.new.is_live===true) setProperties(prev=>[payload.new,...prev]); }
                        else if (payload.eventType==='UPDATE') { const u=payload.new; if(u.is_live===true){setProperties(prev=>{const exists=prev.some(p=>p.id===u.id);const updated = exists ? prev.map(p => p.id === u.id ? u : p) : [u, ...prev];
return [...updated].sort((a, b) => (a.display_order || 9999) - (b.display_order || 9999));});setSelectedProperty(prev=>prev&&prev.id===u.id?u:prev);}else{setProperties(prev=>prev.filter(p=>p.id!==u.id));setSelectedProperty(prev=>prev&&prev.id===u.id?null:prev);} }
                        else if (payload.eventType==='DELETE') { setProperties(prev=>prev.filter(p=>p.id!==payload.old.id)); setSelectedProperty(prev=>prev&&prev.id===payload.old.id?null:prev); }
                    }).subscribe();
                return () => { window.removeEventListener('hashchange', handleHashChange); supabase.removeChannel(channel); };
            }, []);

            // ─── SEO: update title/meta whenever page or blog changes (and no property is selected) ───
            useEffect(() => {
                if (selectedProperty) return; // property page handles its own SEO
                if (activePage === 'blogs' && activeBlog) {
                    setSEO(`${activeBlog.title} | Perfect Horizons Insights`, activeBlog.metaDescription || activeBlog.excerpt, `/#blogs/${activeBlog.id}`);
                    setArticleSchema(activeBlog);
                } else {
                    const seo = PAGE_SEO[activePage] || PAGE_SEO['home'];
                    setSEO(seo.title, seo.desc, seo.path);
                    setArticleSchema(null);
                }
            }, [activePage, activeBlog, selectedProperty]);

            const handleLeadSubmit = async (dataToSubmit, projectName, actionType="General Enquiry", event=null) => {
                if(event) event.preventDefault();
                const data = dataToSubmit || leadData;
                const project = projectName || "General Enquiry";
                const sourceContext = actionType==='brochure'?"Website - Brochure Download":actionType==='cost_sheet'?"Website - Cost Sheet":actionType==='apply_now'?"Website - EMI Apply":"Website - General";
                if (!/^[6-9]\d{9}$/.test(data.phone)) { alert("Enter valid 10-digit number"); return false; }
                if (!dataToSubmit) setIsSubmitting(true);
                try {
                    const { error } = await supabase.from('leads').insert([{ customer_name:data.name, phone_number:data.phone, customer_email:data.email||null, project_interested_in:project, lead_status:"Un called", lead_source:sourceContext, psa_agent_name: null }]);
                    if (error) throw error;
                    fetch(GOOGLE_SCRIPT_URL, {
  method: "POST",
  body: JSON.stringify({ action:"sendLead", Name:data.name, Phone:data.phone, Email:data.email||'N/A', Project:project, Source:sourceContext, Requirements:'None' })
}).catch(err=>console.log("Email Error:",err));
                    if (!dataToSubmit) { alert("Interest Registered! Our advisor will contact you shortly."); setShowLeadForm(false); setLeadData({name:"",phone:"",email:""}); }
                    return true;
                } catch(error) { alert("Error saving details. Please try again."); return false; }
                finally { if(!dataToSubmit) setIsSubmitting(false); }
            };

            const safeProperties = Array.isArray(properties) ? properties : [];
            const filtered = safeProperties.filter(p => {
                if (!p || typeof p !== 'object') return false;
                const term = search.toLowerCase();
                const matchSearch = !term || String(getVal(p,"Property Name")).toLowerCase().includes(term) || String(getVal(p,"Location")).toLowerCase().includes(term) || String(getVal(p,"Builder Name")).toLowerCase().includes(term);
                const matchBHK = !filters.bhk || String(getVal(p,"No of BHK's")||getVal(p,"bhk")).includes(filters.bhk);
                const matchStatus = !filters.status || String(getVal(p,"Construction Status")).includes(filters.status);
                const matchType = !filters.type || String(getVal(p,"Property Type")).includes(filters.type);
                const priceInCr = extractPriceInCr(getVal(p,"Price"));
                let matchPrice = true;
                if (filters.priceBracket && priceInCr > 0) {
                    if (filters.priceBracket==="under1") matchPrice = priceInCr < 1;
                    else if (filters.priceBracket==="1-2") matchPrice = priceInCr>=1 && priceInCr<2;
                    else if (filters.priceBracket==="2-3") matchPrice = priceInCr>=2 && priceInCr<3;
                    else if (filters.priceBracket==="3-4") matchPrice = priceInCr>=3 && priceInCr<4;
                    else if (filters.priceBracket==="4-5") matchPrice = priceInCr>=4 && priceInCr<5;
                    else if (filters.priceBracket==="5plus") matchPrice = priceInCr>=5;
                } else if (filters.priceBracket) matchPrice = false;
                const matchPossession = !filters.possessionYear || (() => {
                    const pd = String(getVal(p,"possession_date")||getVal(p,"Possession Date")||"").toLowerCase();
                    if (filters.possessionYear === "ready") return pd.includes("ready");
                    return pd.includes(filters.possessionYear);
                })();
                return matchSearch && matchBHK && matchStatus && matchType && matchPrice && matchPossession;
